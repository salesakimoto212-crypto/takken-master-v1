とは区別する。人の個性が本質的な委任契約と賃貸借を混同させる典型的な設問である。","choice_4_corrected_statement":"ＡとＢのいずれもが死亡した場合、本件契約は原則として賃貸借上の地位は相続される。","choice_4_legal_basis":"民法601条・896条","choice_4_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／占有回収＝侵奪を前提とする／所有権に基づく返還＝所有権侵害を前提とする。賃貸人＝間接占有、賃借人＝直接占有。"},{"question_id":"2024-Q08","year":2024,"session":"通常","question_no":8,"major_field":"権利関係","section":"民法","unit":"代理","topic":"代理・無権代理・表見代理","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"次の記述のうち、民法の条文として規定されていないものはどれか。","choice_1":"隔地者間の契約は、承諾の通知を発した時に成立する。","choice_2":"無効な行為に基づく債務の履行として給付を受けた者は、相手方を原状に復させる義務を負う。","choice_3":"代理人が自己又は第三者の利益を図る目的で代理権の範囲内の行為をした場合において、相手方がその目的を知り、又は知ることができたときは、その行為は、代理権を有しない者がした行為とみなす。","choice_4":"未成年者が法律行為をするには、その法定代理人の同意を得なければならない。ただし、単に権利を得、又は義務を免れる法律行為については、この限りでない。","official_accepted_answers":"1","answer_conclusion":"《隔地者間の契約成立は承諾の到達時》。発送時成立という旧民法の扱いは改正されています。","answer_reason":"2024-Q08の公式解答は選択肢1。問題文の各条件を満たすかを4肢ごとに判断する。旧法の隔地者間契約＝承諾の発信時の規定／現行法＝到達主義。代理権濫用＝107条、無効行為の原状回復＝121条の2。","scoring_exception_note":"","deep_lecture":"条文の文章をそのまま問う問題でも、時代によって法律の条文が変わる点に注意する。特に2020年4月施行の民法（債権法）改正で、隔地者間の契約の成立時期について従来の「[[WARN:発信主義]]」が改められ、相手方への承諾通知の到達が原則となった。民法97条は意思表示の到達主義を定め、契約成立に関する522条と合わせて読む。現在は承諾を郵便に出しただけでは原則として成立せず、==相手方に到達==する必要がある。これとは別に、無効な法律行為に基づいて給付を受けた者の原状回復義務は121条の2に定めがある。また代理人が本人を犠牲にして自己または第三者を利する目的で権限内の行為をし、その事情を相手方が知り、または知り得たときは、[[NOTE:代理権濫用]]として無権代理とみなす（107条）。さらに未成年者が法律行為をする場合には法定代理人の同意を要するのが原則で、単に権利を得る行為などは例外となる（5条）。このように、各肢は別々の制度を述べており、出題の狙いは「条文にあるか」という形式に加え、旧法の文章を見抜けるかにある。\n実際の契約では、申込みと承諾の意思表示が対応しているか、承諾がいつ相手方に到達したか、申込みに有効期間があるかを確認する。条文の旧新比較は成立時点の1日の差が契約上のリスクを変えることに着目する。","system_purpose":"制度趣旨：条文の文章をそのまま問う問題でも、時代によって法律の条文が変わる点に注意する。特に2020年4月施行の民法（債権法）改正で、隔地者間の契約の成立時期について従来の「発信主義」が改められ、相手方への承諾通知の到達が原則となった。民法97条は意思表示の到達主義を定め、契約成立に関する522条と合わせて読む。現在は承諾を郵便に出しただけでは原則として成立せず、相手方に到達す","practical_examples":"東京の買主が売主に購入承諾の郵便を10日に発送し、12日に届いたとき、原則として承諾の効力発生は12日であり10日ではない。","advanced_knowledge":"電子メールの到達判断でも「送信ボタンを押した時」と受信者が支配する領域に到達した時を区別する必要がある。","comparative_explanation":"旧法の隔地者間契約＝承諾の発信時の規定／現行法＝到達主義。代理権濫用＝107条、無効行為の原状回復＝121条の2。","important_points":"①旧法の隔地者間契約＝承諾の発信時の規定／現行法＝到達主義。代理権濫用＝107条、無効行為の原状回復＝121条の2。　②電子メールの到達判断でも「送信ボタンを押した時」と受信者が支配する領域に到達した時を区別する必要がある。","trick_patterns":"(1)旧法の隔地者間契約＝承諾の発信時の規定／現行法＝到達主義。代理権濫用＝107条、無効行為の原状回復＝121条の2。　(2)「承諾の通知を発した時」という記述は、現行の民法の契約成立ルールと一致しない。意思表示は原則として相手方に到達した時に効力が生じるため、郵便のポスト投函と相手方への到着を区別する。","memory_summary":"旧法の隔地者間契約＝承諾の発信時の規定／現行法＝到達主義。代理権濫用＝107条、無効行為の原状回復＝121条の2。","review_check_questions":"Q.承諾通知は発信時と到達時のどちらが原則？→到達時。|Q.代理権濫用の条文は？→107条。|Q.未成年者が単に権利を得る行為に同意は必要？→原則不要。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法・特別法一次資料照合入口：https://laws.e-gov.go.jp/law/129AC0000000089 ; https://laws.e-gov.go.jp/law/403AC0000000090","marker_yellow_spans":"相手方に到達","marker_red_spans":"発信主義","marker_blue_spans":"代理権濫用","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"true","choice_1_wrong_part":"承諾の通知を発した時","choice_1_reason":"正解肢。現在の民法では、隔地者間の契約も承諾の通知が相手方へ到達した時に成立するのが原則です。「発した時」は条文の内容ではありません。\n「承諾の通知を発した時」という記述は、現行の民法の契約成立ルールと一致しない。意思表示は原則として相手方に到達した時に効力が生じるため、郵便のポスト投函と相手方への到着を区別する。過去の条文知識のまま解く受験生を狙った典型例。出題は「民法の条文として規定されていないもの」である点にも注意する。","choice_1_corrected_statement":"隔地者間の契約は、原則として承諾の通知が相手方に到達した時に成立する。","choice_1_legal_basis":"民法97条・522条・旧法526条との比較","choice_1_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／旧法の隔地者間契約＝承諾の発信時の規定／現行法＝到達主義。代理権濫用＝107条、無効行為の原状回復＝121条の2。","choice_2_truth":"true","choice_2_is_exam_answer":"false","choice_2_wrong_part":"該当なし","choice_2_reason":"民法121条の2の原状回復義務の内容で、無効行為に基づく給付を受けた者は原状回復を負います。\n無効な契約に従って金銭や建物を渡した場合、相手方が取得した利益を保持し続けてよいわけではない。121条の2が原状回復を基本的に定めており、無効と取消しで回復の問題が生じる。ただし制限行為能力者等に関しては現存利益の範囲など特別の扱いがあり、一律にすべてを全額返還すると理解してはいけない。","choice_2_corrected_statement":"原文どおりで正しい","choice_2_legal_basis":"民法121条の2","choice_2_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／旧法の隔地者間契約＝承諾の発信時の規定／現行法＝到達主義。代理権濫用＝107条、無効行為の原状回復＝121条の2。","choice_3_truth":"true","choice_3_is_exam_answer":"false","choice_3_wrong_part":"該当なし","choice_3_reason":"民法107条の代理権濫用の規律で、相手方が濫用目的を知り又は知り得たとき無権代理とみなします。\n代理権の範囲内で代理人が契約しても、代理人が自分の利益のために権限を濫用し、相手方もその目的を知り得たなら、民法107条により無権代理行為とみなされる。「権限内なら無条件に本人に効く」わけではない。相手方が善意無過失である場合の保護との対比が重要である。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"民法107条","choice_3_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／旧法の隔地者間契約＝承諾の発信時の規定／現行法＝到達主義。代理権濫用＝107条、無効行為の原状回復＝121条の2。","choice_4_truth":"true","choice_4_is_exam_answer":"false","choice_4_wrong_part":"該当なし","choice_4_reason":"民法5条の未成年者による法律行為の原則と、単に権利を得・義務を免れる行為の例外を述べています。\n未成年者は原則法定代理人の同意が必要だが、贈与を無条件で受けるなど、単に権利を得る行為には同意不要という例外がある。負担付贈与のように義務も生じる契約は「単に」に当たらない場合がある。詐術を用いた場合や営業許可などの別規定もあるので、この条文だけで未成年者の全取引を判定しない。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"民法5条","choice_4_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／旧法の隔地者間契約＝承諾の発信時の規定／現行法＝到達主義。代理権濫用＝107条、無効行為の原状回復＝121条の2。"},{"question_id":"2024-Q09","year":2024,"session":"通常","question_no":9,"major_field":"権利関係","section":"民法","unit":"賃貸借","topic":"賃貸借・敷金・転貸","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"承諾に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choice_1":"第三者が債務者との間で、債務者の債務につき免責的債務引受契約をする場合、債権者の承諾は不要である。","choice_2":"第三者が債務者との間で、債務者の債務につき併存的債務引受契約をした場合、債権者が第三者に承諾をした時点で、その効力が生ずる。","choice_3":"第三者が債権者との間で、債務者の債務につき併存的債務引受契約をした場合、債務者が第三者に承諾をした時点で、その効力が生ずる。","choice_4":"賃借人が賃貸借契約の目的物を第三者に転貸する場合、賃貸人の承諾は不要である。","official_accepted_answers":"2","answer_conclusion":"《併存的債務引受》を債務者と引受人で契約した場合、債権者への承諾によって効力が生じます。","answer_reason":"2024-Q09の公式解答は選択肢2。問題文の各条件を満たすかを4肢ごとに判断する。併存的＝元債務者が残る／免責的＝元債務者が抜ける。債務者＋引受人の併存契約も債権者の承諾で効力発生。","scoring_exception_note":"","deep_lecture":"同じ「第三者の承諾」が出てきても、債務引受と転貸とでは誰を守るための承諾かが異なる。債務引受には、元の債務者がなお債務を負う[[NOTE:併存的債務引受]]と、元の債務者が[[WARN:債務を免れる]]免責的債務引受がある。併存的債務引受は債権者と引受人との契約によっても、債務者と引受人との契約によっても成立する（民法470条）。後者では債権者が引受人に承諾した時に効力が生じるが、前者では元の債務者の承諾は必要ない。これに対し、免責的債務引受では従来の債務者が免責され、債権者にとって回収先が変わる。債務者と引受人の契約だけで債権者の意向を無視することはできないため、==債権者の承諾==を要する（472条）。賃貸借では借主が第三者に賃借物を転貸する場合、原則として賃貸人の承諾が必要である（612条）。債務引受と転貸を一つの「同意の要否」で暗記せず、誰と誰が契約を結び、誰の法的地位が変わるかを先に整理する。\n宅地建物取引の場面でも、売買代金債務に保証人や引受人を加える取り決めを考えることがある。その際、引受人が追加されるだけなのか、元の買主が免責されるのかで債権者の判断事項が異なる。債権者から見て債務者が増える合意と、信用していた元の債務者が消える合意とでは、保護の必要性が違う。契約当事者を図に描いて確認する。","system_purpose":"制度趣旨：同じ「第三者の承諾」が出てきても、債務引受と転貸とでは誰を守るための承諾かが異なる。債務引受には、元の債務者がなお債務を負う併存的債務引受と、元の債務者が債務を免れる免責的債務引受がある。併存的債務引受は債権者と引受人との契約によっても、債務者と引受人との契約によっても成立する（民法470条）。後者では債権者が引受人に承諾した時に効力が生じるが、前者では元の債務者の承","practical_examples":"Bが銀行Aから借入れ、Cが返済を引き受けるとき、Bも残るなら併存的、Bが抜けるなら免責的。Aの承諾がなぜ重要かはBが抜ける場面で特に明らかになる。","advanced_knowledge":"併存的債務引受人は原則として元の債務者と連帯して同一の債務を負う（470条1項）。弁済の内部負担と対外的責任は別。","comparative_explanation":"併存的＝元債務者が残る／免責的＝元債務者が抜ける。債務者＋引受人の併存契約も債権者の承諾で効力発生。","important_points":"①併存的＝元債務者が残る／免責的＝元債務者が抜ける。債務者＋引受人の併存契約も債権者の承諾で効力発生。　②併存的債務引受人は原則として元の債務者と連帯して同一の債務を負う（470条1項）。弁済の内部負担と対外的責任は別。","trick_patterns":"(1)併存的＝元債務者が残る／免責的＝元債務者が抜ける。債務者＋引受人の併存契約も債権者の承諾で効力発生。　(2)併存的債務引受では元の債務者も残るため、債権者に回収相手が追加される。この制度を債務者と引受人の契約で設定した場合は、債権者が引受人に承諾した時に効力が生じるというのが民法470条","memory_summary":"併存的＝元債務者が残る／免責的＝元債務者が抜ける。債務者＋引受人の併存契約も債権者の承諾で効力発生。","review_check_questions":"Q.併存的債務引受で元の債務者は残る？→残る。|Q.債務者と第三者の免責的引受に必要な承諾者は？→債権者。|Q.転貸には誰の承諾？→賃貸人。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法・特別法一次資料照合入口：https://laws.e-gov.go.jp/law/129AC0000000089 ; https://laws.e-gov.go.jp/law/403AC0000000090","marker_yellow_spans":"債権者の承諾","marker_red_spans":"債務を免れる","marker_blue_spans":"併存的債務引受","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"債権者の承諾は不要","choice_1_reason":"誤り。免責的債務引受を債務者と第三者で契約する場合、債権者の承諾が必要です。元の債務者を外すからです。\n免責的債務引受では元の債務者が債務から外れ、債権者は引受人を新たな債務者として見ることになる。債権者の回収可能性を左右するため、債務者と第三者だけの合意で債権者の承諾を省略できない。貸主が高い信用を持つ債務者に貸していたのに、その者を無断で免責してしまう不合理を考えると理解しやすい。","choice_1_corrected_statement":"第三者が債務者との間で、債務者の債務につき免責的債務引受契約をする場合、債権者の承諾が必要である。","choice_1_legal_basis":"民法472条3項","choice_1_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／併存的＝元債務者が残る／免責的＝元債務者が抜ける。債務者＋引受人の併存契約も債権者の承諾で効力発生。","choice_2_truth":"true","choice_2_is_exam_answer":"true","choice_2_wrong_part":"該当なし","choice_2_reason":"正しい。債務者と第三者の併存的債務引受は、債権者が引受人に承諾すると効力が生じます。\n併存的債務引受では元の債務者も残るため、債権者に回収相手が追加される。この制度を債務者と引受人の契約で設定した場合は、債権者が引受人に承諾した時に効力が生じるというのが民法470条3項の定め。承諾者と承諾の相手、承諾の時点を正確に読み取る必要がある。","choice_2_corrected_statement":"原文どおりで正しい","choice_2_legal_basis":"民法470条3項","choice_2_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／併存的＝元債務者が残る／免責的＝元債務者が抜ける。債務者＋引受人の併存契約も債権者の承諾で効力発生。","choice_3_truth":"false","choice_3_is_exam_answer":"false","choice_3_wrong_part":"債務者が第三者に承諾をした時点","choice_3_reason":"誤り。債権者と第三者の併存的債務引受は、債務者の承諾を要しません。\n債権者と引受人との間で併存的債務引受を約すると、元の債務者は依然として債務を負うため、原則として債務者の承諾を要しない。債務者の債務自体を勝手に増額するわけではないことを理解する。選択肢は「債務者が承諾して初めて効力が生じる」と不要な条件を加えている。","choice_3_corrected_statement":"第三者が債権者との間で、債務者の債務につき併存的債務引受契約をした場合、債権者と引受人の契約で効力が生じ、債務者の承諾は不要で、その効力が生ずる。","choice_3_legal_basis":"民法470条2項","choice_3_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／併存的＝元債務者が残る／免責的＝元債務者が抜ける。債務者＋引受人の併存契約も債権者の承諾で効力発生。","choice_4_truth":"false","choice_4_is_exam_answer":"false","choice_4_wrong_part":"賃貸人の承諾は不要","choice_4_reason":"誤り。賃借人による第三者への転貸は原則として賃貸人の承諾が必要です。無断転貸は解除問題にもなります。\n第三者に使用収益させる転貸は、目的物の利用方法や管理に影響するため、賃貸人の承諾が原則必要である。無断転貸があっても信頼関係を破壊しない特段の事情があれば解除できないとの判例法理があるが、それは「初めから承諾不要」という意味ではない。民法612条の原則と解除制限を混同しない。","choice_4_corrected_statement":"賃借人が賃貸借契約の目的物を第三者に転貸する場合、原則として賃貸人の承諾が必要である。","choice_4_legal_basis":"民法612条","choice_4_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／併存的＝元債務者が残る／免責的＝元債務者が抜ける。債務者＋引受人の併存契約も債権者の承諾で効力発生。"},{"question_id":"2024-Q10","year":2024,"session":"通常","question_no":10,"major_field":"権利関係","section":"民法","unit":"売買","topic":"売買・手付・契約不適合責任","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"売買契約の目的物が品質に関して契約の内容に適合しない場合において、当該契約不適合が売主及び買主のいずれの責めにも帰することができない事由によるものであるとき、履行の追完請求権、代金の減額請求権、損害賠償請求権及び契約の解除権のうち、民法の規定によれば、買主が行使することができない権利のみを掲げたものとして正しいものは次の記述のうちどれか。なお、上記帰責性以外の点について、権利の行使を妨げる事情はないものとする。","choice_1":"履行の追完請求権、損害賠償請求権、契約の解除権","choice_2":"代金の減額請求権、損害賠償請求権、契約の解除権","choice_3":"履行の追完請求権、代金の減額請求権","choice_4":"損害賠償請求権","official_accepted_answers":"4","answer_conclusion":"《売主に帰責性がないとき使えないのは損害賠償》。追完・減額・解除は別条件で可能です。","answer_reason":"2024-Q10の公式解答は選択肢4。問題文の各条件を満たすかを4肢ごとに判断する。追完・代金減額・解除＝売主無過失のみで当然不可とはならない／損害賠償＝帰責性を欠くと原則不可。","scoring_exception_note":"","deep_lecture":"契約不適合とは、引き渡された目的物が種類・品質・数量などについて契約内容に合致していない状態をいう。本問は品質不適合が売主にも買主にも責任のない事情によって生じたという設定で、買主の四つの救済手段を区別させる。①追完請求（民法562条）は修補・代替物の引渡しなど契約どおりにすることを求める制度であり、売主の帰責性を一般的な成立要件としない。②[[NOTE:代金減額請求]]（563条）は、追完がなされないなど法定の条件を満たすと、契約に見合わない分の代金を減らす制度。これも帰責性がないというだけでは排除されない。③==損害賠償請求==（564条・415条）は、債務不履行が契約その他の事情に照らして売主の責めに帰することができない事由によるときには原則認められない。④契約解除（564条・541条等）は、債務不履行の内容など法定の解除要件によって判断され、売主の帰責性がないという理由だけでは排除されない。つまり「損害賠償だけが帰責性で落ちる」という区別が最重要である。ただし、追完不能、買主側の帰責性、軽微な不履行など別の要件がある場合には結論が変わり得るため、本問の「帰責性以外の妨げはない」という条件を読む。\n契約不適合は「不良品があるか」だけでなく、契約に何が約束されたかによって決まる。引渡し時の検査資料や契約書の性能記載を読み、欠陥があるのか、契約との不一致なのかを分けて判断する。","system_purpose":"制度趣旨：契約不適合とは、引き渡された目的物が種類・品質・数量などについて契約内容に合致していない状態をいう。本問は品質不適合が売主にも買主にも責任のない事情によって生じたという設定で、買主の四つの救済手段を区別させる。①追完請求（民法562条）は修補・代替物の引渡しなど契約どおりにすることを求める制度であり、売主の帰責性を一般的な成立要件としない。②代金減額請求（563条）は","practical_examples":"引渡し前に原因不明の設備故障が生じ、売主に落ち度がない場合でも、買主は設備修理を求められることがあるが、遅延損害の賠償には帰責性が問題になる。","advanced_knowledge":"民法563条は原則として追完の催告と相当期間経過を要するが、追完不能などには無催告で代金減額できる例外がある。","comparative_explanation":"追完・代金減額・解除＝売主無過失のみで当然不可とはならない／損害賠償＝帰責性を欠くと原則不可。","important_points":"①追完・代金減額・解除＝売主無過失のみで当然不可とはならない／損害賠償＝帰責性を欠くと原則不可。　②民法563条は原則として追完の催告と相当期間経過を要するが、追完不能などには無催告で代金減額できる例外がある。","trick_patterns":"(1)追完・代金減額・解除＝売主無過失のみで当然不可とはならない／損害賠償＝帰責性を欠くと原則不可。　(2)損害賠償請求については民法415条1項ただし書が問題となる。債務不履行が売主に帰責できない事情によるとき、損害賠償請求は原則認められない。本問は他の行使障害はないと明示しているので\n【要注意の表現】[[WARN:履行の追完請求権]]","memory_summary":"追完・代金減額・解除＝売主無過失のみで当然不可とはならない／損害賠償＝帰責性を欠くと原則不可。","review_check_questions":"Q.売主無過失なら追完請求も不可？→いいえ。|Q.損害賠償の帰責性ルールは？→415条。|Q.本問の不可な権利は？→損害賠償請求権のみ。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法・特別法一次資料照合入口：https://laws.e-gov.go.jp/law/129AC0000000089 ; https://laws.e-gov.go.jp/law/403AC0000000090","marker_yellow_spans":"損害賠償請求","marker_red_spans":"履行の追完請求権","marker_blue_spans":"代金減額請求","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"履行の追完請求権、損害賠償請求権、契約の解除権","choice_1_reason":"誤り。追完請求と解除は、[[WARN:売主の帰責性]]がないという理由だけでは排除されません。\n追完請求が使えないとするのは、契約不適合を売主の落ち度がある場合に限る制度だと誤解しているため。また解除は売主の過失を必須とするものではない。損害賠償だけは本問の免責事由で請求できないが、追完と解除まで一緒に除外した時点で誤りとなる。どの救済手段を列挙しているか一つずつ分解して判定する。","choice_1_corrected_statement":"本問で行使できないのは損害賠償請求権のみ","choice_1_legal_basis":"民法562条・564条・541条","choice_1_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／追完・代金減額・解除＝売主無過失のみで当然不可とはならない／損害賠償＝帰責性を欠くと原則不可。","choice_2_truth":"false","choice_2_is_exam_answer":"false","choice_2_wrong_part":"代金の減額請求権、損害賠償請求権、契約の解除権","choice_2_reason":"誤り。代金減額と解除も売主の帰責性の有無だけで当然に排除されません。\n代金減額請求は目的物が契約と違うことを受けて対価を修正する救済であり、売主の帰責性がないことだけでは排除されない。解除についても同様。三つをまとめて「請求不可」としたこの選択肢は、損害賠償の免責ルールを他の救済に広げ過ぎている。追完請求と代金減額は通常前後関係などの要件がある点も押さえる。","choice_2_corrected_statement":"本問で行使できないのは損害賠償請求権のみ","choice_2_legal_basis":"民法563条・564条","choice_2_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／追完・代金減額・解除＝売主無過失のみで当然不可とはならない／損害賠償＝帰責性を欠くと原則不可。","choice_3_truth":"false","choice_3_is_exam_answer":"false","choice_3_wrong_part":"履行の追完請求権、代金の減額請求権","choice_3_reason":"誤り。追完請求と代金減額請求は、売主の帰責性がなくても法定要件を満たせば可能です。\n追完請求と代金減額請求は、品質が約束に達していない場合に契約のバランスを回復するための手段である。双方無過失でも法定要件を満たせば認められ、損害賠償と同じ帰責性要件は課されない。請求の順序や追完不能の場合の特則が別にあるため、買主がいつでも自由に二つを選べるという意味ではない。","choice_3_corrected_statement":"本問で行使できないのは損害賠償請求権のみ","choice_3_legal_basis":"民法562条・563条","choice_3_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／追完・代金減額・解除＝売主無過失のみで当然不可とはならない／損害賠償＝帰責性を欠くと原則不可。","choice_4_truth":"true","choice_4_is_exam_answer":"true","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。損害賠償は債務不履行についての帰責性がないと原則請求できません。他の3権利は帰責性と切り離して考えます。\n損害賠償請求については民法415条1項ただし書が問題となる。債務不履行が売主に帰責できない事情によるとき、損害賠償請求は原則認められない。本問は他の行使障害はないと明示しているので、四つのうちこの権利だけが不可。正誤を答える際は「行使できない権利のみ」を問う逆向きの設問に注意する。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"民法415条1項ただし書・564条","choice_4_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／追完・代金減額・解除＝売主無過失のみで当然不可とはならない／損害賠償＝帰責性を欠くと原則不可。"},{"question_id":"2024-Q11","year":2024,"session":"通常","question_no":11,"major_field":"権利関係","section":"借地借家法","unit":"借家","topic":"借家権・更新・定期建物賃貸借","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"建物の所有を目的とする土地の賃貸借契約（一時使用目的の借地契約を除く。）に関する次の記述のうち、借地借家法の規定によれば、正しいものはどれか。","choice_1":"専ら事業の用に供する建物（居住の用に供するものを除く。）の所有を目的とし、存続期間を20 年として借地権を設定する場合、建物買取請求権の規定は適用されず、また、その契約は、公正証書による等書面によってしなければならない。","choice_2":"居住の用に供する建物の所有を目的として借地権を設定する場合において、借地権を消滅させる目的で、その設定後30 年を経過した日に借地権の目的である土地の上の建物を借地権設定者に相当の対価で譲渡する旨の特約を定めても、この特約は無効である。","choice_3":"借地権を設定する場合において、存続期間を定めなかったときは、その期間は30 年となる。","choice_4":"当事者が借地権の設定後に最初に借地契約を更新する場合において、存続期間を定めなかったときは、その期間は更新の日から10 年となる。","official_accepted_answers":"3","answer_conclusion":"《普通借地の当初期間は30年》。定めがなければ30年、最初の更新は20年です。","answer_reason":"2024-Q11の公式解答は選択肢3。問題文の各条件を満たすかを4肢ごとに判断する。普通借地＝設定30年・初回更新20年・2回目以後10年／事業用定期＝10年以上50年未満・公正証書／建物譲渡特約＝30年以上。","scoring_exception_note":"","deep_lecture":"借地借家法は建物所有を目的とする土地賃借権など、一定の借地権を民法の一般的な賃貸借より強く保護する。通常の借地権の存続期間は==原則30年==であり、これより短い期間を定めても30年となる（3条）。期間の定めがない場合も30年である。契約更新は最初の更新で原則20年、二回目以降の更新で原則10年で、当事者がそれ以上の期間を定めることはできる（4条）。普通借地と区別すべき制度に定期借地権がある。事業用定期借地権等は専ら事業用建物所有が目的で10年以上50年未満の期間設定が可能となり、契約は公正証書による必要がある（23条）。10年以上30年未満と30年以上50年未満とでは条文構成が違うため、数字だけで判断しない。[[NOTE:建物譲渡特約付借地権]]（24条）は設定後30年以上経過した日に借地権設定者に建物を相当対価で譲渡して借地権を消滅させる制度で、建物が居住用でも利用し得る。普通借地30年、最初の更新20年、二回目以降10年、建物譲渡特約30年以上、事業用10年以上50年未満を制度別に整理すると点が取れる。\n重要な数字は単に大きい順に並べるのではなく、「当初の設定」「最初の更新」「2回目以後の更新」という時間軸に載せると記憶しやすい。さらに事業用定期借地は建物の用途が限定されることも確認する。","system_purpose":"制度趣旨：借地借家法は建物所有を目的とする土地賃借権など、一定の借地権を民法の一般的な賃貸借より強く保護する。通常の借地権の存続期間は原則30年であり、これより短い期間を定めても30年となる（3条）。期間の定めがない場合も30年である。契約更新は最初の更新で原則20年、二回目以降の更新で原則10年で、当事者がそれ以上の期間を定めることはできる（4条）。普通借地と区別すべき制度に","practical_examples":"店舗用地を20年間借りる事業用定期借地は公正証書が必要。一方、住宅用の普通借地を期間未定で設定すれば30年が原則となる。","advanced_knowledge":"一般定期借地権は50年以上で、更新・再築延長・建物買取請求を排除する旨の特約を公正証書等の書面で定める（22条）。","comparative_explanation":"普通借地＝設定30年・初回更新20年・2回目以後10年／事業用定期＝10年以上50年未満・公正証書／建物譲渡特約＝30年以上。","important_points":"①普通借地＝設定30年・初回更新20年・2回目以後10年／事業用定期＝10年以上50年未満・公正証書／建物譲渡特約＝30年以上。　②一般定期借地権は50年以上で、更新・再築延長・建物買取請求を排除する旨の特約を公正証書等の書面で定める（22条）。","trick_patterns":"(1)普通借地＝設定30年・初回更新20年・2回目以後10年／事業用定期＝10年以上50年未満・公正証書／建物譲渡特約＝30年以上。　(2)借地期間の定めがないときは、通常の借地権について借地借家法3条により30年となる。20年や10年という数字は更新後の期間と混同しやすい。借地権設定時の「最初の存続期間」と更新後の期\n【要注意の表現】[[WARN:公正証書による等書面]]","memory_summary":"普通借地＝設定30年・初回更新20年・2回目以後10年／事業用定期＝10年以上50年未満・公正証書／建物譲渡特約＝30年以上。","review_check_questions":"Q.普通借地の期間未定は何年？→30年。|Q.最初の更新で期間未定なら？→20年。|Q.事業用定期借地の方式は？→公正証書。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法・特別法一次資料照合入口：https://laws.e-gov.go.jp/law/129AC0000000089 ; https://laws.e-gov.go.jp/law/403AC0000000090","marker_yellow_spans":"原則30年","marker_red_spans":"公正証書による等書面","marker_blue_spans":"建物譲渡特約付借地権","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"公正証書による等書面","choice_1_reason":"誤り。事業用定期借地権等は期間に応じた特則があり、[[WARN:公正証書]]など方式要件が必要です。20年の事業用借地に「建物買取請求権なし」とする説明が不足・不正確です。\n事業用定期借地権等で20年間の存続期間を定めるなら借地借家法23条2項に該当し、13条の建物買取請求規定が適用されず、契約は「公正証書」による必要がある。選択肢は「公正証書による等書面」とし、一般定期借地権の方式と混同している。単なる私製の契約書では足りない点が決め手である。","choice_1_corrected_statement":"専ら事業の用に供する建物（居住の用に供するものを除く。）の所有を目的とし、存続期間を20 年として借地権を設定する場合、建物買取請求権の規定は適用されず、また、その契約は、公正証書によって締結しなければならないによってしなければならない。","choice_1_legal_basis":"借地借家法23条2項・3項","choice_1_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／普通借地＝設定30年・初回更新20年・2回目以後10年／事業用定期＝10年以上50年未満・公正証書／建物譲渡特約＝30年以上。","choice_2_truth":"false","choice_2_is_exam_answer":"false","choice_2_wrong_part":"この特約は無効である","choice_2_reason":"誤り。借地権設定後30年以上経過して建物を相当対価で譲渡し借地権を消滅させる建物譲渡特約付借地権は認められます。\n建物譲渡特約付借地権は、設定後30年以上経過した日に土地上の建物を地主へ相当の対価で譲渡する特約によって借地権を終了させる。事業用に限定されず、居住目的でも制度が使える。「居住用だからこの特約は無効」とする記述は誤り。借地人が建物を失う代わりに対価を得る構造を理解する。","choice_2_corrected_statement":"居住の用に供する建物の所有を目的として借地権を設定する場合において、借地権を消滅させる目的で、その設定後30 年を経過した日に借地権の目的である土地の上の建物を借地権設定者に相当の対価で譲渡する旨の特約を定めても、要件を満たす建物譲渡特約付借地権は有効。","choice_2_legal_basis":"借地借家法24条1項","choice_2_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／普通借地＝設定30年・初回更新20年・2回目以後10年／事業用定期＝10年以上50年未満・公正証書／建物譲渡特約＝30年以上。","choice_3_truth":"true","choice_3_is_exam_answer":"true","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい。通常の借地権の存続期間は、期間を定めない場合30年です。30年より短く定めても原則30年になります。\n借地期間の定めがないときは、通常の借地権について借地借家法3条により30年となる。20年や10年という数字は更新後の期間と混同しやすい。借地権設定時の「最初の存続期間」と更新後の期間は問題文の時期を区切って読む。民法の一般賃貸借期間とは別の特別法上の保護規定である。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"借地借家法3条","choice_3_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／普通借地＝設定30年・初回更新20年・2回目以後10年／事業用定期＝10年以上50年未満・公正証書／建物譲渡特約＝30年以上。","choice_4_truth":"false","choice_4_is_exam_answer":"false","choice_4_wrong_part":"更新の日から10 年","choice_4_reason":"誤り。最初の更新で期間の定めがなければ20年です。10年となるのは原則2回目以後の更新です。\n最初の更新で期間を決めなければ、借地借家法4条により更新の日から原則20年となる。10年は2回目以後の更新での原則期間であり、更新回数を省いて覚えると失点する。「設定時30→最初の更新20→その後10」の時間順を意識する。いずれも当事者が法の許す長期を定める場合はその条件を確認する。","choice_4_corrected_statement":"当事者が借地権の設定後に最初に借地契約を更新する場合において、存続期間を定めなかったときは、その期間は最初の更新は原則20年となる。","choice_4_legal_basis":"借地借家法4条","choice_4_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／普通借地＝設定30年・初回更新20年・2回目以後10年／事業用定期＝10年以上50年未満・公正証書／建物譲渡特約＝30年以上。"},{"question_id":"2024-Q12","year":2024,"session":"通常","question_no":12,"major_field":"権利関係","section":"借地借家法","unit":"借家","topic":"借家権・更新・定期建物賃貸借","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"賃貸人Ａと賃借人Ｂとが、居住目的で期間を3 年として、借地借家法第38 条の定期建物賃貸借契約（以下この問において「契約①」という。）を締結した場合と、定期建物賃貸借契約でも一時使用目的の賃貸借契約でもない普通建物賃貸借契約（以下この問において「契約②」という。）を締結した場合とに関する次の記述のうち、借地借家法の規定によれば、正しいものはどれか。","choice_1":"Ｂが建物の引渡しを受けた後にＡが建物をＣに売却して建物所有者がＣに変わった場合、Ｂは、契約①の場合ではＣに対して賃借人であることを主張できるが、契約②の場合ではＣに対して賃借人であることを主張できない。","choice_2":"契約期間中は賃料の改定を行わない旨の特約を契約において定めていても、契約期間中に賃料が不相当になったと考えるに至ったＢは、契約①の場合も契約②の場合も、借地借家法第32 条に基づく賃料減額請求をすることができる。","choice_3":"Ｂが契約期間中に相続人なしで死亡した場合において、婚姻はしていないが事実上夫婦と同様の関係にあった同居者Ｄがあるときは、契約①の場合も契約②の場合も、Ａに反対の意思表示をしないＤは、建物の賃貸借契約に関し、Ｂの権利義務を承継する。","choice_4":"契約①の場合、公正証書によって契約をするときに限り契約の更新がないことを有効に定めることができ、契約②の場合、書面で契約し、かつ、Ａに正当な理由がない限り、Ａは契約の更新を拒絶することができなくなる。","official_accepted_answers":"3","answer_conclusion":"《同居する事実上の配偶者の居住保護》は定期借家・普通借家の両方に適用されます。","answer_reason":"2024-Q12の公式解答は選択肢3。問題文の各条件を満たすかを4肢ごとに判断する。対抗力＝定期・普通とも引渡しで可／賃料改定特約＝定期借家に38条特則／更新＝普通借家は正当事由の保護、定期借家は適法な方式で更新なし。","scoring_exception_note":"","deep_lecture":"普通建物賃貸借と定期建物賃貸借を比較する際は、契約期間と更新の有無だけでなく、対抗力、賃料増減額、相続・同居者保護、契約方法を分けて考える。まず==建物の引渡し==を受ければ、その後所有者が変わっても借家権を新所有者に対抗できるという借地借家法31条は、普通借家だけに限定されない。賃料が不相当になったときの増減額請求権は同法32条が原則だが、定期建物賃貸借について[[NOTE:賃料改定の特約]]がある場合は32条が適用されない（38条）。一方、普通建物賃貸借における減額請求を封じる特約の効力は同列に判断できない。相続人のない賃借人と事実上の夫婦・養親子として同居していた者には、建物の賃貸借上の権利義務を承継する制度がある（36条）。定期借家か普通借家かというだけでこの保護が消えるわけではない。定期借家では更新がない旨を有効に定めるために所定の書面又は電磁的記録による契約や事前説明が求められるが、[[WARN:公正証書だけ]]が唯一の方法ではない。設問では「引渡し」「賃料特約」「相続人がいない」「公正証書に限る」の四つの分岐点を順番に確認する。\n借地借家法の借家人保護は生活・営業の継続に関わる。賃料改定について特約を尊重する定期借家の例外があっても、建物引渡しによる対抗や相続人なき同居者保護を一律に消すわけではない。","system_purpose":"制度趣旨：普通建物賃貸借と定期建物賃貸借を比較する際は、契約期間と更新の有無だけでなく、対抗力、賃料増減額、相続・同居者保護、契約方法を分けて考える。まず建物の引渡しを受ければ、その後所有者が変わっても借家権を新所有者に対抗できるという借地借家法31条は、普通借家だけに限定されない。賃料が不相当になったときの増減額請求権は同法32条が原則だが、定期建物賃貸借について賃料改定の特","practical_examples":"Aが3年の定期借家でBに部屋を貸し、途中でCに売却しても、Bが引渡しを受けていれば原則Cに賃借権を主張できる。","advanced_knowledge":"期間1年以上の定期借家では満了通知が問題となる（38条）。更新がない契約でも、法定の満了通知要件を軽視しない。","comparative_explanation":"対抗力＝定期・普通とも引渡しで可／賃料改定特約＝定期借家に38条特則／更新＝普通借家は正当事由の保護、定期借家は適法な方式で更新なし。","important_points":"①対抗力＝定期・普通とも引渡しで可／賃料改定特約＝定期借家に38条特則／更新＝普通借家は正当事由の保護、定期借家は適法な方式で更新なし。　②期間1年以上の定期借家では満了通知が問題となる（38条）。更新がない契約でも、法定の満了通知要件を軽視しない。","trick_patterns":"(1)対抗力＝定期・普通とも引渡しで可／賃料改定特約＝定期借家に38条特則／更新＝普通借家は正当事由の保護、定期借家は適法な方式で更新なし。　(2)相続人がいない賃借人が死亡したとき、事実上夫婦と同じ関係で居住を共にしていたDは、反対の意思表示をしなければ賃貸借上の地位を承継できる（36条）。契約が定期か普通かで無条件に除外さ","memory_summary":"対抗力＝定期・普通とも引渡しで可／賃料改定特約＝定期借家に38条特則／更新＝普通借家は正当事由の保護、定期借家は適法な方式で更新なし。","review_check_questions":"Q.定期借家も引渡しによって対抗できる？→できる。|Q.相続人のない賃借人の同居内縁者は承継可能？→要件により可能。|Q.定期借家は公正証書限定？→限定されない。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法・特別法一次資料照合入口：https://laws.e-gov.go.jp/law/129AC0000000089 ; https://laws.e-gov.go.jp/law/403AC0000000090","marker_yellow_spans":"建物の引渡し","marker_red_spans":"公正証書だけ","marker_blue_spans":"賃料改定の特約","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"契約②の場合ではＣに対して賃借人であることを主張できない","choice_1_reason":"誤り。引渡しを受けた賃借人は建物の所有者が変わっても、定期・普通の双方で借家権を対抗できます。\n建物の賃貸借は、引渡しが対抗要件となるため、Bがすでに建物を占有していれば、Aから買ったCに賃借人として主張できる。これは定期建物賃貸借にも普通建物賃貸借にも共通する。「定期だから対抗できる、普通だからできない」という差はない。登記の有無だけでなく建物の引渡しの事実を見る。","choice_1_corrected_statement":"Ｂが建物の引渡しを受けた後にＡが建物をＣに売却して建物所有者がＣに変わった場合、Ｂは、契約①の場合ではＣに対して賃借人であることを主張できるが、契約①・②ともに引渡しにより対抗できる。","choice_1_legal_basis":"借地借家法31条","choice_1_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／対抗力＝定期・普通とも引渡しで可／賃料改定特約＝定期借家に38条特則／更新＝普通借家は正当事由の保護、定期借家は適法な方式で更新なし。","choice_2_truth":"false","choice_2_is_exam_answer":"false","choice_2_wrong_part":"契約①の場合も契約②の場合も","choice_2_reason":"誤り。定期建物賃貸借で適法な賃料改定特約がある場合は借地借家法32条の増減額請求規定が適用されない場合があります。普通借家と同じではありません。\n定期建物賃貸借は賃料改定特約があると、借地借家法32条の借賃増減請求の規定が適用されない特例がある。契約①で適法に賃料改定を行わない旨を決めたなら、Bが32条で当然に減額請求できるとはいえない。普通建物賃貸借の賃料減額請求とは違う。条文番号と契約類型のセットを確認する。","choice_2_corrected_statement":"契約期間中は賃料の改定を行わない旨の特約を契約において定めていても、契約期間中に賃料が不相当になったと考えるに至ったＢは、適法な賃料改定特約がある契約①では32条の請求は適用されない、借地借家法第32 条に基づく賃料減額請求をすることができる。","choice_2_legal_basis":"借地借家法32条・38条","choice_2_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／対抗力＝定期・普通とも引渡しで可／賃料改定特約＝定期借家に38条特則／更新＝普通借家は正当事由の保護、定期借家は適法な方式で更新なし。","choice_3_truth":"true","choice_3_is_exam_answer":"true","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい。相続人のない賃借人と事実上の夫婦として同居していた人は、反対の意思表示をしなければ権利義務を承継します。\n相続人がいない賃借人が死亡したとき、事実上夫婦と同じ関係で居住を共にしていたDは、反対の意思表示をしなければ賃貸借上の地位を承継できる（36条）。契約が定期か普通かで無条件に除外される制度ではない。法は住宅での生活の継続を守ろうとしている。相続人がいる場合とは別の仕組みである点に注意する。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"借地借家法36条","choice_3_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／対抗力＝定期・普通とも引渡しで可／賃料改定特約＝定期借家に38条特則／更新＝普通借家は正当事由の保護、定期借家は適法な方式で更新なし。","choice_4_truth":"false","choice_4_is_exam_answer":"false","choice_4_wrong_part":"公正証書によって契約をするときに限り","choice_4_reason":"誤り。定期借家は所定の書面等で契約し事前説明が必要ですが、公正証書に限定されません。普通借家の更新拒絶では正当事由の要件も考慮します。\n定期借家の要件は、公正証書によること「だけ」ではない。借地借家法38条は公正証書による等書面または電磁的記録による方式を認め、さらに賃貸人からの事前説明などを要求する。普通借家の更新拒絶は正当事由などの制限を受けるが、普通借家契約を書面にすること自体を更新保護の絶対条件とするのも不正確である。","choice_4_corrected_statement":"契約①の場合、法定の書面又は電磁的記録の方式・事前説明により定期借家を定め得る契約の更新がないことを有効に定めることができ、契約②の場合、書面で契約し、かつ、Ａに正当な理由がない限り、Ａは契約の更新を拒絶することができなくなる。","choice_4_legal_basis":"借地借家法26条・28条・38条","choice_4_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／対抗力＝定期・普通とも引渡しで可／賃料改定特約＝定期借家に38条特則／更新＝普通借家は正当事由の保護、定期借家は適法な方式で更新なし。"},{"question_id":"2024-Q13","year":2024,"session":"通常","question_no":13,"major_field":"権利関係","section":"区分所有法","unit":"区分所有","topic":"集会・規約・共用部分・建替え","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"建物の区分所有等に関する法律に関する次の記述のうち、誤っているものはどれか。","choice_1":"各共有者の共用部分の持分は、規約に別段の定めがない限り、共有者数で等分することとされている。","choice_2":"規約及び集会の決議は、区分所有者の特定承継人に対しても、その効力を生ずる。","choice_3":"管理者は、集会において、毎年1 回一定の時期に、その事務に関する報告をしなければならない。","choice_4":"集会の招集の通知は、区分所有者が管理者に対して通知を受けるべき場所を通知しなかったときは区分所有者の所有する専有部分が所在する場所にあててすれば足りる。この場合には、集会の招集の通知は、通常それが到達すべき時に到達したものとみなされる。","official_accepted_answers":"1","answer_conclusion":"《共用部分の持分は専有部分の床面積割合が原則》。人数で等分ではありません。","answer_reason":"《共用部分の持分は専有部分の床面積割合が原則》。人数で等分ではありません。","scoring_exception_note":"","deep_lecture":"この設問は、区分所有法のうち共同管理を機能させる4つの制度を横断して問うものです。第1に==共用部分の持分割合==。各区分所有者の専有部分の床面積が異なれば、共用部分の持分も原則として異なり、住戸を保有する人数で等分するとは限りません。出題当時の区分所有法14条において、規約で別段の定めを置けることと、法定原則そのものとを区別します。第2に[[NOTE:特定承継人への効力]]。マンションの住戸を取得した買主も従前の規約や集会決議の効力を受けるので、重要事項の確認時には管理規約・議事録等の資料が欠かせません。第3に管理者の毎年の事務報告。管理者が任命されているだけでは管理の透明性は確保されず、集会への報告という定期的な説明責任が課されていました。第4に通知方法。管理者への通知先届出がない区分所有者に対しては専有部分の所在場所に通知する制度があり、通常到達時の到達擬制までセットで覚えます。つまり①持分の基準、②規約・決議の承継、③管理者の報告、④集会招集の通知を別々の条文で判定すれば正解が出ます。本問で[[WARN:共有者数で等分]]とする肢1だけが誤りです。なお、2026年4月施行の区分所有法改正により集会運営・決議制度は改められているため、出題時の公式正解を保持しつつ、現行法の手続要件は別欄で学んでください。","system_purpose":"【学習補助】区分所有の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"たとえば専有面積が40㎡、60㎡、100㎡の3住戸で、共用部分持分に特別な規約がない場合、単純に3人で3分の1ずつと考えません。専有部分床面積を合計200㎡として各住戸の床面積割合を基準にします。","advanced_knowledge":"【関連論点】2026年4月施行の区分所有法改正があるため、集会手続・決議要件の出題当時の扱いをそのまま現行法に置き換えない。","comparative_explanation":"共用部分持分の原則＝専有部分床面積割合／人数均等ではない。特定承継＝売買等で区分所有権を取得した者／規約・決議の効力が及ぶ。年1回の報告＝管理者の事務報告／通知先＝届出なければ専有部分所在地。","important_points":"《==共用部分の持分＝原則専有部分床面積割合==》／《特定承継人にも規約等の効力》。\n【判定の軸】2026年4月施行の区分所有法改正があるため、集会手続・決議要件の出題当時の扱いをそのまま現行法に置き換えない。","trick_patterns":"【重要】2024年の出題時点と2026年4[[WARN:月施行後の制度を同一視しない]]。","memory_summary":"《共用部分の持分は専有部分の床面積割合が原則》。人数で等分ではありません。","review_check_questions":"Q1. 共用部分の持分は人数で均等？ A. 原則は専有部分床面積の割合。Q2. 中古マンションの買主は従前の規約に拘束される？ A. 特定承継人にも規約・集会決議の効力が及ぶ。Q3. 管理者の事務報告頻度は？ A. 出題当時は毎年1回一定時期に集会報告。","substatement_reasoning":"","reform_status":"review_required","reform_title":"区分所有法の2026年4月1日施行改正と集会手続","reform_effective_date":"2026-04-01","reform_before":"本問は試験当時の区分所有法を前提に判定する。","reform_after":"2026年4月1日に区分所有法等の改正が施行。","reform_2026_impact":"区分所有法の改正施行は確認済み。ただし本問各肢の条文・招集手続・経過措置を個別に独立検証していないため、2026年度現行法での同一結論は未承認。","reform_sources":"https://www.moj.go.jp/MINJI/minji07_00375.html","legal_sources":"区分所有法（2024年当時）14条・46条・43条・35条／法務省 2026年4月[[NOTE:施行]]区分所有法改正","marker_yellow_spans":"共用部分の持分割合|共用部分の持分＝原則専有部分床面積割合","marker_red_spans":"共有者数で等分|月施行後の制度を同一視しない","marker_blue_spans":"特定承継人への効力","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"true","choice_1_wrong_part":"共有者数で等分","choice_1_reason":"誤り（正解肢）。共用部分は複数の区分所有者に共有されますが、各共有者の持分を人数で均等に割り当てるのが法定原則ではありません。出題当時の区分所有法14条1項では、規約に別段の定めがない限り、各専有部分の床面積の割合を基準に持分を定めます。例えば専有面積40㎡の部屋と80㎡の部屋を持つ区分所有者の持分は、規約で修正されない限り同率とは限りません。「人数で等分」と「面積割合」の取り違えが本肢の誤りです。","choice_1_corrected_statement":"共用部分の各共有者の持分は、規約で別段の定めがない限り、それぞれの専有部分の床面積の割合によって決まる。","choice_1_legal_basis":"区分所有法14条1項（共用部分持分の割合）","choice_1_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。共用部分の共有持分は規約に別段の定めがない限り、各専有部分の床面積の割合で決まります。共有者数の均等割ではありません。 具体的な要件は出題当時の関連条文で確認する。","choice_2_truth":"true","choice_2_is_exam_answer":"false","choice_2_wrong_part":"該当なし","choice_2_reason":"正しい（出題当時）。規約は管理組合内の取り決め、集会決議は共用部分の管理などの意思決定ですが、区分所有者が売買で入れ替わるたびに効力を失うと建物の共同管理が成り立ちません。このため区分所有法46条1項は、規約と集会の決議が区分所有者の特定承継人にも効力を生じると定めています。買主は過去の規約・決議と無関係だと即断せず、取得前に管理規約や総会決議の内容を確認する必要があります。","choice_2_corrected_statement":"原文どおりで正しい","choice_2_legal_basis":"肢別の法令照合待ち。関連出典：区分所有法（2024年当時）14条・46条・43条・35条／法務省 2026年4月施行区分所有法改正","choice_2_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。規約および集会決議は、区分所有権を後から取得した特定承継人にも効力を生じます。 具体的な要件は出題当時の関連条文で確認する。","choice_3_truth":"true","choice_3_is_exam_answer":"false","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい（出題当時）。区分所有法43条は管理者が集会で毎年1回一定の時期に事務の報告を行うことを求めています。管理者は共用部分の管理等について区分所有者のために事務を扱うため、会計や業務状況を報告することで管理の透明性を確保する趣旨です。管理者が存在するからといって報告を省略できるわけではなく、個々の区分所有者に逐一報告すれば定期の集会報告が不要になるとも限りません。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"肢別の法令照合待ち。関連出典：区分所有法（2024年当時）14条・46条・43条・35条／法務省 2026年4月施行区分所有法改正","choice_3_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。管理者は集会で毎年1回一定時期に事務報告を行う義務があります。 具体的な要件は出題当時の関連条文で確認する。","choice_4_truth":"true","choice_4_is_exam_answer":"false","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい（出題当時）。集会招集の通知先を各区分所有者が届け出ていない場合、区分所有法35条3項により、その者の専有部分の所在場所を通知先としてよいとされていました。法定の通知の効力が一律に実際の手渡しや本人の開封まで必要なら、所在不明の区分所有者によって集会運営が止まってしまいます。そのため、同法は通常到達すべき時に到達したものとみなす旨も定めていました。2026年度では改正後の招集規律を別途確認してください。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"肢別の法令照合待ち。関連出典：区分所有法（2024年当時）14条・46条・43条・35条／法務省 2026年4月施行区分所有法改正","choice_4_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。所定の通知先の届出がなければ専有部分所在地に通知でき、通常到達すべき時に到達したものとみなす取扱いです。 具体的な要件は出題当時の関連条文で確認する。"},{"question_id":"2024-Q14","year":2024,"session":"通常","question_no":14,"major_field":"権利関係","section":"不動産登記法","unit":"登記申請","topic":"買戻特約・収用・遺贈・住所変更の登記","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"不動産の登記に関する次の記述のうち、不動産登記法の規定によれば、誤っているものはどれか。","choice_1":"買戻しの特約に関する登記がされている場合において、契約の日から10 年を経過したときは、登記権利者は、単独で当該登記の抹消を申請することができる。","choice_2":"不動産の収用による所有権の移転の登記は、起業者が単独で申請することができる。","choice_3":"相続人ではない者に対する遺贈による所有権の移転の登記は、登記権利者が単独で申請することができる。","choice_4":"登記名義人の住所についての変更の登記は、登記名義人が単独で申請することができる。","official_accepted_answers":"3","answer_conclusion":"《遺贈による移転登記》は原則共同申請。受遺者が相続人でない場合は単独申請できません。","answer_reason":"《==遺贈による移転登記==》は原則共同申請。受遺者が相続人でない場合は単独申請できません。","scoring_exception_note":"","deep_lecture":"登記申請は共同申請が原則・単独申請は例外。相続人への遺贈と非相続人への遺贈では単独申請できるかが変わります。買戻特約抹消の年数や収用も頻出の例外。\n\n【単元の見取り図・補足講義】不動産登記では「表示に関する登記」「権利に関する登記」「所有権保存」「移転」「抹消」で申請人の構造が異なる。 単独申請が認められる例外を、原則の共同申請と対比して覚える。\n\n【本問の四肢を使った比較】【肢1：正しい方向の記述】正しい。買戻特約の登記からではなく契約日から10年経過すれば、登記権利者は単独で抹消申請できます。 【肢2：正しい方向の記述】正しい。収用による所有権移転登記は起業者が単独申請できます。 【肢3：誤りを含む記述】誤り。相続人以外への遺贈は原則として受遺者と遺言執行者・相続人等による共同申請です。相続人への遺贈とは異なります。 【肢4：正しい方向の記述】正しい。登記名義人の住所変更登記は名義人が単独で申請できます。\n\n【設問で判断を練習する】正解につながる肢の焦点は「相続人ではない者に対する遺贈による所有権の移転の登記は」。誤り。相続人以外への遺贈は原則として受遺者と遺言執行者・相続人等による共同申請です。相続人への遺贈とは異なります。一方、「買戻しの特約に関する登記がされている場合において」を論じる肢では「正しい。買戻特約の登記からではなく契約日から10年経過すれば、登記権利者は単独で抹消申請できます」という別の結論が問題となる。","system_purpose":"【学習補助】登記申請の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:単独申請が認められる例外を、原則の]]共同申請と対比して覚える。","comparative_explanation":"【本問で混同しやすい区別】単独申請が認められる例外を、原則の共同申請と対比して覚える。","important_points":"《非相続人への遺贈＝原則共同申請》／《住所変更＝名義人単独》。\n【判定の軸】単独申請が認められる例外を、原則の共同申請と対比して覚える。","trick_patterns":"単独申請の例外規定を「[[WARN:遺贈は全部単独]]」と拡大解釈しない。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《遺贈による移転登記》は原則共同申請。受遺者が相続人でない場合は単独申請できません。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 3番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 単独申請が認められる例外を、原則の共同申請と対比して覚える。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"不動産[[NOTE:登記]]法60条・63条・69条の2／法務省 相続登記・住所等変更登記の義務化","marker_yellow_spans":"遺贈による移転登記","marker_red_spans":"遺贈は全部単独","marker_blue_spans":"単独申請が認められる例外を、原則の","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"false","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。買戻特約の登記からではなく契約日から10年経過すれば、登記権利者は単独で抹消申請できます。\n原文の「買戻しの特約に関する登記がされている場合において」にある条件が、正誤の判断を左右する。【理解を深める】不動産登記では「表示に関する登記」「権利に関する登記」「所有権保存」「移転」「抹消」で申請人の構造が異なる。\n比較対象の肢2では「不動産の収用による所有権の移転の登記は」が論点となる。正しい。収用による所有権移転登記は起業者が単独申請できます。","choice_1_corrected_statement":"原文どおりで正しい","choice_1_legal_basis":"肢別の法令照合待ち。関連出典：不動産登記法60条・63条・69条の2／法務省 相続登記・住所等変更登記の義務化","choice_1_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。買戻特約の登記からではなく契約日から10年経過すれば、登記権利者は単独で抹消申請できます。 具体的な要件は出題当時の関連条文で確認する。","choice_2_truth":"true","choice_2_is_exam_answer":"false","choice_2_wrong_part":"該当なし","choice_2_reason":"正しい。収用による所有権移転登記は起業者が単独申請できます。\n原文の「不動産の収用による所有権の移転の登記は」にある条件が、正誤の判断を左右する。【理解を深める】単独申請が認められる例外を、原則の共同申請と対比して覚える。\n比較対象の肢3では「相続人ではない者に対する遺贈による所有権の移転の登記は」が論点となる。誤り。相続人以外への遺贈は原則として受遺者と遺言執行者・相続人等による共同申請です。相続人への遺贈とは異なります。","choice_2_corrected_statement":"原文どおりで正しい","choice_2_legal_basis":"肢別の法令照合待ち。関連出典：不動産登記法60条・63条・69条の2／法務省 相続登記・住所等変更登記の義務化","choice_2_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。収用による所有権移転登記は起業者が単独申請できます。 具体的な要件は出題当時の関連条文で確認する。","choice_3_truth":"false","choice_3_is_exam_answer":"true","choice_3_wrong_part":"UNKNOWN","choice_3_reason":"誤り。相続人以外への遺贈は原則として受遺者と遺言執行者・相続人等による共同申請です。相続人への遺贈とは異なります。\n原文の「相続人ではない者に対する遺贈による所有権の移転の登記は」という断定を、そのまま一般原則として受け入れてはいけない。未検証の修正文案では「相続人以外への遺贈は原則として受遺者と遺言執行者・相続人等による共同申請です。相続人への遺贈とは異なります」であり、原文との違いを比べて制度の適用範囲を判断する。【理解を深める】非相続人への遺贈＝原則共同申請／住所変更＝名義人単独。\n比較対象の肢4では「登記名義人の住所についての変更の登記は」が論点となる。正しい。登記名義人の住所変更登記は名義人が単独で申請できます。","choice_3_corrected_statement":"【修正文案・独立照合待ち】相続人以外への遺贈は原則として受遺者と遺言執行者・相続人等による共同申請です。相続人への遺贈とは異なります。","choice_3_legal_basis":"肢別の法令照合待ち。関連出典：不動産登記法60条・63条・69条の2／法務省 相続登記・住所等変更登記の義務化","choice_3_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。相続人以外への遺贈は原則として受遺者と遺言執行者・相続人等による共同申請です。相続人への遺贈とは異なります。 具体的な要件は出題当時の関連条文で確認する。","choice_4_truth":"true","choice_4_is_exam_answer":"false","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。登記名義人の住所変更登記は名義人が単独で申請できます。\n原文の「登記名義人の住所についての変更の登記は」にある条件が、正誤の判断を左右する。【理解を深める】登記申請は共同申請が原則・単独申請は例外。相続人への遺贈と非相続人への遺贈では単独申請できるかが変わります。買戻特約抹消の年数や収用も頻出の例外。\n比較対象の肢1では「買戻しの特約に関する登記がされている場合において」が論点となる。正しい。買戻特約の登記からではなく契約日から10年経過すれば、登記権利者は単独で抹消申請できます。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"肢別の法令照合待ち。関連出典：不動産登記法60条・63条・69条の2／法務省 相続登記・住所等変更登記の義務化","choice_4_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。登記名義人の住所変更登記は名義人が単独で申請できます。 具体的な要件は出題当時の関連条文で確認する。"},{"question_id":"2024-Q15","year":2024,"session":"通常","question_no":15,"major_field":"法令上の制限","section":"都市計画法","unit":"都市計画","topic":"区域区分・用途地域・地区計画","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"都市計画法に関する次の記述のうち、誤っているものはどれか。","choice_1":"都市計画区域外においても、特に必要があるときは、都市施設に関する都市計画を定めることができる。","choice_2":"準都市計画区域については、用途地域が定められている土地の区域であっても、市街地開発事業に関する都市計画を定めることができない。","choice_3":"用途地域の一つである準住居地域は、道路の沿道としての地域の特性にふさわしい業務の利便の増進を図りつつ、これと調和した住居の環境を保護するために定める地域である。","choice_4":"地区計画は、用途地域が定められている土地の区域についてのみ都市計画に定められるものであり、また、地区計画に関する都市計画を定めるに当たっては、地区整備計画を都市計画に定めなければならない。","official_accepted_answers":"4","answer_conclusion":"《地区計画》は用途地域内に限られません。地区整備計画の扱いも絶対的義務と断定できません。","answer_reason":"《==地区計画==》は用途地域内に限られません。地区整備計画の扱いも絶対的義務と断定できません。","scoring_exception_note":"","deep_lecture":"この問題では、都市計画区域・準都市計画区域という「区域」と、都市施設・市街地開発事業・用途地域・地区計画という「都市計画の種類」を別々に整理する。まず都市施設について、都市計画法11条1項は区域内での指定を基本としつつ、==特に必要がある場合には都市計画区域外にも==計画を定められるとする。したがって区域外なら一切計画ができないという見方は誤る。次に準都市計画区域は、無秩序な土地利用の防止等を目的に用途地域など一定の地域地区を定めることができるが、市街地開発事業の区域として扱われるわけではない。第三に準住居地域は、沿道の業務利便と住環境を両立させる用途地域であり、住居専用地域とは異なる。最後に地区計画は、地区レベルで良好な街区環境を整備・保全する仕組みである。都市計画法12条の5第1項は用途地域のない一定区域も対象とし、同条8項は特別の事情がある場合の地区整備計画の例外を定める。ここが本問の正解肢4の二重の誤りとなる。たとえば用途地域の指定がない地区でも、開発状況等の法定要件を満たせば地区計画の対象候補となり得る。[[NOTE:地区計画と用途地域は同一ではない]]。出題時に強い「のみ」「必ず」が現れたら、対象区域の例外と手続の例外をそれぞれ条文で調べる。","system_purpose":"【学習補助】都市計画の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】「[[NOTE:区域外では一切定められない」「用]]途地域がある区域のみ」などの絶対表現に注意する。","comparative_explanation":"【本問で混同しやすい区別】「区域外では一切定められない」「用途地域がある区域のみ」などの絶対表現に注意する。","important_points":"《地区計画＝用途地域のある区域だけではない》／《準都市計画区域では市街地開発事業なし》。\n【判定の軸】「区域外では一切定められない」「用途地域がある区域のみ」などの絶対表現に注意する。","trick_patterns":"「[[WARN:のみ]]」「必ず」の絶対表現を法令例外と照合。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《地区計画》は用途地域内に限られません。地区整備計画の扱いも絶対的義務と断定できません。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 4番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 「区域外では一切定められない」「用途地域がある区域のみ」などの絶対表現に注意する。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"都市計画法（e-Gov、2024年9月時点） https://laws.e-gov.go.jp/law/343AC0000000100?occasion_date=20240918","marker_yellow_spans":"地区計画|特に必要がある場合には都市計画区域外にも","marker_red_spans":"のみ","marker_blue_spans":"地区計画と用途地域は同一ではない|区域外では一切定められない」「用","qa_status":"REWORK","qa_issues":"設問固有の解説・根拠条文を重点修正。ただし2026年度現行法の全肢独立検証は未完了。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"false","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。都市施設に関する都市計画は都市計画区域について定めるのが基本だが、都市計画法11条1項は、==特に必要があるとき==には都市計画区域外にも都市施設を定めることを認めている。したがって「都市計画区域外だから都市計画は一切できない」という理解は正しくない。道路などの広域的な施設を計画する際には、施設の配置が都市計画区域の境界と必ず一致するとは限らない。ここで問われているのは用途地域ではなく、都市施設に関する都市計画である。","choice_1_corrected_statement":"原文どおりで正しい","choice_1_legal_basis":"都市計画法11条1項","choice_1_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。都市計画区域外でも、特に必要があれば都市施設に関する都市計画を定めることがあります。 具体的な要件は出題当時の関連条文で確認する。","choice_2_truth":"true","choice_2_is_exam_answer":"false","choice_2_wrong_part":"該当なし","choice_2_reason":"正しい。準都市計画区域には用途地域を定められるが、そのことから市街地開発事業の都市計画も自由に定められるとは推論できない。都市計画法は、土地利用の規制としての地域地区と、土地区画整理事業等の市街地開発事業を別の種類の都市計画として扱う。用途地域の指定を許すことと、開発事業の施行区域を決められることは別問題である。[[NOTE:準都市計画区域]]という区域区分と、都市計画法12条の市街地開発事業の対象区域をそれぞれ確認する。","choice_2_corrected_statement":"原文どおりで正しい","choice_2_legal_basis":"都市計画法12条・13条（市街地開発事業の対象区域）","choice_2_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。準都市計画区域では市街地開発事業に関する都市計画は定められません。 具体的な要件は出題当時の関連条文で確認する。","choice_3_truth":"true","choice_3_is_exam_answer":"false","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい。準住居地域は、道路沿道の業務上の利便を増進しながら、住宅の環境と調和させる趣旨を持つ用途地域である。住居に関係する用途地域だからといって、店舗や沿道サービス等の業務上の利便を一切認めないわけではない。本肢は都市計画法9条に規定された準住居地域の目的を述べたものとして整合する。[[NOTE:住居専用地域]]とは名称も目的も異なるため、「準住居」という語を「住居専用」と読み替えない。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"都市計画法9条（準住居地域の趣旨）","choice_3_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。準住居地域は道路沿道の業務利便を図りつつ、住環境を調和させる用途地域です。 具体的な要件は出題当時の関連条文で確認する。","choice_4_truth":"false","choice_4_is_exam_answer":"true","choice_4_wrong_part":"「用途地域が定められている土地の区域についてのみ」「地区整備計画を都市計画に定めなければならない」","choice_4_reason":"誤りであり、これが本試験の正解肢となる。第一の誤りは「[[WARN:用途地域についてのみ]]」という限定。都市計画法12条の5第1項は、一定要件を満たす用途地域のない区域でも地区計画を認めている。第二の誤りは、地区計画を定める際に「[[WARN:地区整備計画を必ず定める]]」という断定である。特別の事情がある場合には同条8項により当面地区整備計画を定めない扱いができる。二箇所を別々に修正する必要がある。","choice_4_corrected_statement":"地区計画は、都市計画法12条の5第1項所定の用途地域のある区域のほか、同項所定の要件を満たす用途地域のない区域にも定められる。また特別の事情がある場合には、同条8項により当面地区整備計画を定めないことができる。","choice_4_legal_basis":"都市計画法12条の5第1項・第8項","choice_4_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。地区計画は用途地域のない一定区域にも定められます。「用途地域がある場所のみ」「必ず地区整備計画」という一律の説明は誤りです。 具体的な要件は出題当時の関連条文で確認する。"},{"question_id":"2024-Q16","year":2024,"session":"通常","question_no":16,"major_field":"法令上の制限","section":"都市計画法","unit":"都市計画","topic":"区域区分・用途地域・地区計画","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"都市計画法（以下この問において「法」という。）に関する次の記述のうち、正しいものはどれか。ただし、この問において条例による特別の定めはないものとし、「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。","choice_1":"市街化区域内において行う、医療法に規定する病院を建築するための1,000 m2 の開発行為については、法第29 条に基づく都道府県知事の許可を得る必要がある。","choice_2":"市街化区域内において行う、開発行為を伴わない建築物の建築で、当該建築物の床面積が1,000 m2 以上のものについては、法第29 条に基づく都道府県知事の許可を得る必要がある。","choice_3":"市街化調整区域内において行う、都市計画事業の施行のための開発行為については、法第29 条に基づく都道府県知事の許可を得る必要がある。","choice_4":"法第29 条に基づく許可を受けた者は、当該許可に係る土地についての一定の事項を開発登録簿に登録しなければならない。","official_accepted_answers":"1","answer_conclusion":"市街化区域の《1,000㎡の病院建築を目的とした開発》は、原則として許可が必要です。","answer_reason":"市街化区域の《==1,000㎡の病院建築を目的とした開発==》は、原則として許可が必要です。","scoring_exception_note":"","deep_lecture":"開発許可は「建物の規模」ではなく、まず土地の区画形質の変更という開発行為の有無を見る。市街化区域は原則1,000㎡以上、調整区域は原則面積に関係なく許可が問題です。\n\n【単元の見取り図・補足講義】都市計画区域、市街化区域、市街化調整区域、準都市計画区域の機能を分ける。用途地域や地区計画は区域によって定められる範囲が異なる。 「区域外では一切定められない」「用途地域がある区域のみ」などの絶対表現に注意する。\n\n【本問の四肢を使った比較】【肢1：正しい方向の記述】正しい。病院を建築するため土地の区画形質変更を行う1,000㎡の開発は市街化区域の許可基準（原則1,000㎡以上）に達します。 【肢2：誤りを含む記述】誤り。床面積1,000㎡以上でも開発行為を伴わない建築には都市計画法29条の開発許可は直ちに必要となりません。 【肢3：誤りを含む記述】誤り。都市計画事業の施行として行う開発は所定の許可不要事由に当たります。 【肢4：誤りを含む記述】誤り。開発登録簿の調製・登録は許可を受けた者でなく、都道府県知事等が行います。\n\n【設問で判断を練習する】正解につながる肢の焦点は「市街化区域内において行う、医療法に規定する病院を建築するための1,000 m2 の開発行為…」。正しい。病院を建築するため土地の区画形質変更を行う1,000㎡の開発は市街化区域の許可基準（原則1,000㎡以上）に達します。一方、「法第29 条に基づく許可を受けた者は」を論じる肢では「誤り。開発登録簿の調製・登録は許可を受けた者でなく、都道府県知事等が行います」という別の結論が問題となる。","system_purpose":"【学習補助】都市計画の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】「[[NOTE:区域外では一切定められない」「用]]途地域がある区域のみ」などの絶対表現に注意する。","comparative_explanation":"【本問で混同しやすい区別】「区域外では一切定められない」「用途地域がある区域のみ」などの絶対表現に注意する。","important_points":"《市街化区域の開発＝原則1,000㎡以上》／《建物の床面積と開発面積を区別》。\n【判定の軸】「区域外では一切定められない」「用途地域がある区域のみ」などの絶対表現に注意する。","trick_patterns":"自治体条例で許可対象面積が変わる場合があるため、設問の「[[WARN:条例なし]]」を読む。","memory_summary":"市街化区域の《1,000㎡の病院建築を目的とした開発》は、原則として許可が必要です。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 1番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 「区域外では一切定められない」「用途地域がある区域のみ」などの絶対表現に注意する。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"[[NOTE:都市計画法29条]]・46条・47条","marker_yellow_spans":"1,000㎡の病院建築を目的とした開発","marker_red_spans":"条例なし","marker_blue_spans":"区域外では一切定められない」「用","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"true","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。病院を建築するため土地の区画形質変更を行う1,000㎡の開発は市街化区域の許可基準（原則1,000㎡以上）に達します。 す。 【肢4：正しい方向の記述】正しい。劇場から映画館のような類似用途への変更は、一定の確認対象の用途変更と異なり確認申請を要しない場合があります。\n\n【設問で判断を練習する】正解につながる肢の焦点は「特定行政庁は、建築基準法の規定に違反した建築物（国、都道府県又は建築主事を置く市町村の建築…」。誤り。緊急の必要があるときの仮の使用禁止・使用制限では、通常の通知書交付・意見書提出手続を必ず経るとは限りません。一方、「高さ25 m の建築物には、周囲の状況によって安全上支障がない場合を除き」を論じる肢では「正しい。高さ20ｍを超える建築物は、周囲の状況によって安全上支障がない場合等を除き避雷設備が必要です。25ｍは対象です」という別の結論が問題となる。","system_purpose":"【学習補助】単体規定の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:増築10㎡の確認申請特例が防火・準]]防火地域で使えるか、用途変更が類似用途かは条件を分ける。","comparative_explanation":"【本問で混同しやすい区別】増築10㎡の確認申請特例が防火・準防火地域で使えるか、用途変更が類似用途かは条件を分ける。","important_points":"《避雷設備は原則高さ20m超》／《防火地域内10㎡以内でも確認対象の場合あり》。\n【判定の軸】増築10㎡の確認申請特例が防火・準防火地域で使えるか、用途変更が類似用途かは条件を分ける。","trick_patterns":"「[[WARN:緊急でも必ず聴聞・通知]]」という断定に注意。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《違反建築物に対する緊急の使用禁止命令》では通常の意見聴取手続を省略できる場合があります。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 2番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 増築10㎡の確認申請特例が防火・準防火地域で使えるか、用途変更が類似用途かは条件を分ける。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"[[NOTE:建築基準法6条]]・9条・33条／国土交通省 2025年4月建築基準法改正","marker_yellow_spans":"違反建築物に対する緊急の使用禁止命令","marker_red_spans":"緊急でも必ず聴聞・通知","marker_blue_spans":"増築10㎡の確認申請特例が防火・準","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"false","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。高さ20ｍを超える建築物は、周囲の状況によって安全上支障がない場合等を除き避雷設備が必要です。25ｍは対象です。\n原文の s_exam_answer":"false","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。劇場から映画館のような類似用途への変更は、一定の確認対象の用途変更と異なり確認申請を要しない場合があります。\n原文の「劇場の用途に供する建築物を映画館（その用途に供する部分の床面積の合計が500 m2）に用途…」にある条件が、正誤の判断を左右する。【理解を深める】建築確認の要否は規模地域用途変更先との類似性で判定。建築基準法違反建築物に対する是正命令の手続では、緊急性による例外も出題されます。\n比較対象の肢1では「高さ25 m の建築物には、周囲の状況によって安全上支障がない場合を除き」が論点となる。正しい。高さ20ｍを超える建築物は、周囲の状況によって安全上支障がない場合等を除き避雷設備が必要です。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"肢別の法令照合待ち。関連出典：建築基準法6条・9条・33条／国土交通省 2025年4月建築基準法改正","choice_4_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。劇場から映画館のような類似用途への変更は、一定の確認対象の用途変更と異なり確認申請を要しない場合があります。 具体的な要件は出題当時の関連条文で確認する。"},{"question_id":"2024-Q18","year":2024,"session":"通常","question_no":18,"major_field":"法令上の制限","section":"建築基準法","unit":"道路規制","topic":"道路・接道義務・2項道路","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"次の記述のうち、建築基準法の規定によれば、正しいものはどれか。","choice_1":"客席部分の床面積の合計が300 m2 の映画館については、第二種住居地域内において建築することはできないが、準住居地域内においては建築することができる。","choice_2":"特定用途誘導地区内において、都市計画で建築物の高さの最高限度が定められていたとしても、特定行政庁が用途上又は構造上やむを得ないと認めて許可したものについては、当該最高限度を超えてよい。","choice_3":"計画しようとする建築物の天空率が、道路斜線制限、隣地斜線制限又は北側斜線制限に適合する建築物の天空率未満であれば、これらの制限は適用されない。","choice_4":"都市計画で建蔽率の限度が80 ％に指定されている区域かつ防火地域内にある耐火建築物について、建蔽率の限度を超えるためには、特定行政庁による許可を得る必要がある。","official_accepted_answers":"2","answer_conclusion":"《特定用途誘導地区》の高さ最高限度は、許可を受けた建物に例外が認められます。","answer_reason":"《==特定用途誘導地区==》の高さ最高限度は、許可を受けた建物に例外が認められます。","scoring_exception_note":"","deep_lecture":"高さ・斜線・建蔽率の別を整理。天空率は空の見え方の指標で、一般的な斜線制限を満たす建物以上の天空率を確保できれば一部の斜線制限が適用されない制度です。\n\n【単元の見取り図・補足講義】用途地域による建築制限、斜線制限、天空率、建ぺい率は別々の制限。設問の地区指定・建築構造・許可主体をまず確認する。 天空率の判定は比較対象の天空率以上か、建ぺい率の緩和は法定例外か個別許可かに着目する。\n\n【本問の四肢を使った比較】【肢1：誤りを含む記述】誤り。客席300㎡の映画館の用途地域による可否を、第二種住居と準住居で記述どおりに区別することはできません。 【肢2：正しい方向の記述】正しい。特定用途誘導地区では、特定行政庁が用途上・構造上やむを得ないとして許可すれば高さの最高限度を超えることができます。 【肢3：誤りを含む記述】誤り。天空率の特例は、制限適合建物の天空率以上となることが基本で、「未満」ではありません。 【肢4：誤りを含む記述】誤り。建蔽率80%の指定かつ防火地域内の耐火建築物は、法定の建蔽率の制限が適用されない場合があります。特別許可が常に必要とはいえません。\n\n【設問で判断を練習する】正解に とはいえません。\n原文の「都市計画で建蔽率の限度が80 ％に指定されている区域かつ防火地域内にある耐火建築物について」という断定を、そのまま一般原則として受け入れてはいけない。未検証の修正文案では「建蔽率80%の指定かつ防火地域内の耐火建築物は、法定の建蔽率の制限が適用されない場合があります。特別許可が常に必要とはいえません」であり、原文との違いを比べて制度の適用範囲を判断する。【理解を深める】高さ・斜線・建蔽率の別を整理。天空率は空の見え方の指標で、一般的な斜線制限を満たす建物以上の天空率を確保できれば一部の斜線制限が適用されない制度です。\n比較対象の肢1では「客席部分の床面積の合計が300 m2 の映画館については」が論点となる。誤り。客席300㎡の映画館の用途地域による可否を、第二種住居と準住居で記述どおりに区別することはできません。","choice_4_corrected_statement":"【修正文案・独立照合待ち】建蔽率80%の指定かつ防火地域内の耐火建築物は、法定の建蔽率の制限が適用されない場合があります。特別許可が常に必要とはいえません。","choice_4_legal_basis":"肢別の法令照合待ち。関連出典：建築基準法52条・53条・56条／国土交通省 2025年4月建築基準法改正","choice_4_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。建蔽率80%の指定かつ防火地域内の耐火建築物は、法定の建蔽率の制限が適用されない場合があります。特別許可が常に必要とはいえません。 具体的な要件は出題当時の関連条文で確認する。"},{"question_id":"2024-Q19","year":2024,"session":"通常","question_no":19,"major_field":"法令上の制限","section":"盛土規制法","unit":"盛土規制","topic":"宅地造成等工事規制区域・特定盛土等","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"宅地造成及び特定盛土等規制法に関する次の記述のうち、誤っているものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市及び中核市にあってはその長をいうものとし、地方自治法に基づく施行時特例市に係る経過措置については考慮しないものとする。","choice_1":"都道府県知事は、基礎調査のために他人の占有する土地に立ち入って測量又は調査を行う必要があるときは、その必要の限度において、当該土地に、自ら立ち入り、又はその命じた者若しくは委任した者に立ち入らせることができ、当該土地の占有者は、正当な理由がない限り、その立入りを拒み、又は妨げてはならない。","choice_2":"都道府県知事は、宅地造成等工事規制区域内の土地について、宅地造成等に伴う災害を防止するために必要があると認める場合には、その土地の所有者に対して、擁壁等の設置等の措置をとることを勧告することができる。","choice_3":"工事主は、宅地造成等工事規制区域において行われる宅地造成等に関する工事について、工事着手後2 週間以内に、宅地造成等に関する工事の施行に係る土地の周辺地域の住民に対し、説明会の開催その他の当該宅地造成等に関する工事の内容を周知させるため必要な措置を講じなければならない。","choice_4":"特定盛土等規制区域内において行われる特定盛土等又は土石の堆積に関する工事については、工事主は、当該工事に着手する日の30 日前までに、主務省令で定めるところにより、当該工事の計画を都道府県知事に届け出なければならない。ただし、特定盛土等又は土石の堆積に伴う災害の発生のおそれがないと認められるものとして政令で定める工事については、この限りでない。","official_accepted_answers":"3","answer_conclusion":"《工事着手前》に周辺住民へ説明等の周知が必要。「着手後2週間以内」は誤り。","answer_reason":"《==工事着手前==》に周辺住民へ説明等の周知が必要。「着手後2週間以内」は誤り。","scoring_exception_note":"","deep_lecture":"盛土規制法は工事規制区域特定盛土等規制区域許可・届出周辺住民への事前周知の4層で覚えます。単に届出だけで工事を始められると誤解しないこと。\n\n【単元の見取り図・補足講義】宅地造成・特定盛土等・土石の堆積に関する安全規制は、区域指定、許可・届出、事前周知、勧告・命令の主体と時点を分けて読む。 2023年試験は制度の移行期に当たるため、旧法を前提とする肢と現在の盛土規制法による運用を安易に同一視しない。\n\n【本問の四肢を使った比較】【肢1：正しい方向の記述】正しい。都道府県知事等には基礎調査に必要な土地の立入り権限があり、占有者は正当理由なく拒めません。 【肢2：正しい方向の記述】正しい。災害防止上必要なら所有者等に擁壁設置等を勧告できる仕組みがあります。 【肢3：誤りを含む記述】誤り。周辺地域住民への工事内容の周知は許可申請・工事着手前に行う必要があり、着手後2週間という後回しの扱いではありません。 【肢4：正しい方向の記述】正しい。特定盛土等規制区域の一定規模の工事は、許可対象に該当しない届出型の場合には原則30日前の届出が問題になります。\n\n【設問で判断を練習する】正解につながる肢の焦点は「工事主は、宅地造成等工事規制区域において行われる宅地造成等に関する工事について」。誤り。周辺地域住民への工事内容の周知は許可申請・工事着手前に行う必要があり、着手後2週間という後回しの扱いではありません。一方、「都道府県知事は、基礎調査のために他人の占有する土地に立ち入って測量又は調査を行う必要がある…」を論じる肢では「正しい。都道府県知事等には基礎調査に必要な土地の立入り権限があり、占有者は正当理由なく拒めません」という別の結論が問題となる。","system_purpose":"【学習補助】盛土規制の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:2023年試験は制度の移行期に当た]]るため、旧法を前提とする肢と現在の盛土規制法による運用を安易に同一視しない。","comparative_explanation":"【本問で混同しやすい区別】2023年試験は制度の移行期に当たるため、旧法を前提とする肢と現在の盛土規制法による運用を安易に同一視しない。","important_points":"《住民周知＝事前》／《規制区域・工事規模によって許可と届出を分ける》。\n【判定の軸】2023年試験は制度の移行期に当たるため、旧法を前提とする肢と現在の盛土規制法による運用を安易に同一視しない。","trick_patterns":"許可対象工事と30日前届出対象工事の[[WARN:混同]]に注意。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《工事着手前》に周辺住民へ説明等の周知が必要。「着手後2週間以内」は誤り。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 3番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 2023年試験は制度の移行期に当たるため、旧法を前提とする肢と現在の盛土規制法による運用を安易に同一視しない。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"宅地造成及び特定盛土等規制法／国土交通省 盛土規制法","marker_yellow_spans":"工事着手前","marker_red_spans":"混同","marker_blue_spans":"2023年試験は制度の移行期に当た","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_check exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。周辺地域住民への工事内容の周知は許可申請・工事着手前に行う必要があり、着手後2週間という後回しの扱いではありません。 具体的な要件は出題当時の関連条文で確認する。","choice_4_truth":"true","choice_4_is_exam_answer":"false","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。特定盛土等規制区域の一定規模の工事は、許可対象に該当しない届出型の場合には原則30日前の届出が問題になります。\n原文の「特定盛土等規制区域内において行われる特定盛土等又は土石の堆積に関する工事については」にある条件が、正誤の判断を左右する。【理解を深める】盛土規制法は工事規制区域特定盛土等規制区域許可・届出周辺住民への事前周知の4層で覚えます。単に届出だけで工事を始められると誤解しないこと。\n比較対象の肢1では「都道府県知事は、基礎調査のために他人の占有する土地に立ち入って測量又は調査を行う必要がある…」が論点となる。正しい。都道府県知事等には基礎調査に必要な土地の立入り権限があり、占有者は正当理由なく拒めません。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"肢別の法令照合待ち。関連出典：宅地造成及び特定盛土等規制法／国土交通省 盛土規制法","choice_4_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。特定盛土等規制区域の一定規模の工事は、許可対象に該当しない届出型の場合には原則30日前の届出が問題になります。 具体的な要件は出題当時の関連条文で確認する。"},{"question_id":"2024-Q20","year":2024,"session":"通常","question_no":20,"major_field":"法令上の制限","section":"土地区画整理法","unit":"土地区画整理","topic":"仮換地・換地処分・組合","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。なお、この問において、同法第136 条の3 による大都市等の特例及び条例で定める事務処理の特例は考慮しないものとする。","choice_1":"仮換地が指定された場合においては、従前の宅地について権原に基づき使用し、又は収益することができる者は、仮換地の指定の効力発生の日から換地処分の公告がある日まで、仮換地又は仮換地について仮に使用し、若しくは収益することができる権利の目的となるべき宅地若しくはその部分について、従前の宅地について有する権利の内容である使用又は収益と同じ使用又は収益をすることができる。","choice_2":"市町村施行の土地区画整理事業において、市町村は、換地処分をした場合においては、その旨を公告しなければならない。","choice_3":"換地計画において定められた保留地は、換地処分の公告があった日の翌日において、施行者が取得する。","choice_4":"施行者は、仮換地を指定した場合において、特別の事情があるときは、その仮換地について使用又は収益を開始することができる日を仮換地の指定の効力発生の日と別に定めることができる。","official_accepted_answers":"2","answer_conclusion":"市町村施行の換地処分を《公告するのは都道府県知事》で、施行市町村ではありません。","answer_reason":"市町村施行の換地処分を《==公告するのは都道府県知事==》で、施行市町村ではありません。","scoring_exception_note":"","deep_lecture":"土地区画整理は仮換地指定→使用収益の移行→換地処分→公告の翌日に権利変動の時系列。誰が指定・公告するかも出題対象です。\n\n【単元の見取り図・補足講義】土地区画整理では仮換地指定、使用収益開始、換地処分・公告、清算金・保留地取得のタイミングを時系列に並べる。 公告する主体と公告日の翌日に効果が生じる事項を取り違えない。組合・公共団体等の施行主体で組織要件が異なる。\n\n【本問の四肢を使った比較】【肢1：正しい方向の記述】正しい。仮換地指定の効力発生日から換地処分公告まで、従前地の使用収益権は原則仮換地へ移ります。 【肢2：誤りを含む記述】誤り。市町村施行の換地処分について公告するのは都道府県知事です。市町村自身が公告するわけではありません。 【肢3：正しい方向の記述】正しい。保留地は換地処分公告日の翌日に施行者が取得します。 【肢4：正しい方向の記述】正しい。事情により仮換地の指定の効力発生と、実際に使用収益できる開始日を別に定めることがあります。\n\n【設問で判断を練習する】正解につながる肢の焦点は「市町村施行の土地区画整理事業において」。誤り。市町村施行の換地処分について公告するのは都道府県知事です。市町村自身が公告するわけではありません。一方、「仮換地が指定された場合においては」を論じる肢では「正しい。仮換地指定の効力発生日から換地処分公告まで、従前地の使用収益権は原則仮換地へ移ります」という別の結論が問題となる。","system_purpose":"【学習補助】土地区画整理の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:公告する主体と公告日の翌日に効果が]]生じる事項を取り違えない。組合・公共団体等の施行主体で組織要件が異なる。","comparative_explanation":"【本問で混同しやすい区別】公告する主体と公告日の翌日に効果が生じる事項を取り違えない。組合・公共団体等の施行主体で組織要件が異なる。","important_points":"《仮換地の使用収益》／《保留地取得＝公告翌日》／《市町村施行の公告主体》。\n【判定の軸】公告する主体と公告日の翌日に効果が生じる事項を取り違えない。組合・公共団体等の施行主体で組織要件が異なる。","trick_patterns":"「[[WARN:施行者が公告する]]」とまとめて暗記しない。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"市町村施行の換地処分を《公告するのは都道府県知事》で、施行市町村ではありません。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 2番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 公告する主体と公告日の翌日に効果が生じる事項を取り違えない。組合・公共団体等の施行主体で組織要件が異なる。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"[[NOTE:土地区画整理法98条]]・103条・104条","marker_yellow_spans":"公告するのは都道府県知事","marker_red_spans":"施行者が公告する","marker_blue_spans":"公告する主体と公告日の翌日に効果が","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"false","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。仮換 点となる。正しい。仮換地指定の効力発生日から換地処分公告まで、従前地の使用収益権は原則仮換地へ移ります。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"肢別の法令照合待ち。関連出典：土地区画整理法98条・103条・104条","choice_4_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。事情により仮換地の指定の効力発生と、実際に使用収益できる開始日を別に定めることがあります。 具体的な要件は出題当時の関連条文で確認する。"},{"question_id":"2024-Q21","year":2024,"session":"通常","question_no":21,"major_field":"法令上の制限","section":"農地法","unit":"農地法総合","topic":"3条・5条許可と農地賃貸借","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"農地に関する次の記述のうち、農地法（以下この問において「法」という。）の規定によれば、誤っているものはどれか。","choice_1":"法第3 条第1 項の許可があったときは所有権が移転する旨の停止条件付売買契約を原因とする所有権移転の仮登記の申請を行う場合にも、農業委員会の許可が必要である。","choice_2":"法第5 条第1 項の許可申請書の提出において、法ではその申請に係る権利の設定又は移転に関し民事調停法により調停が成立した場合など一定の場合を除き、当事者は連署した申請書を提出しなければならないとされている。","choice_3":"法では、農地の賃貸借で期間の定めがあるものについては、一定の場合を除き、期間満了の1 年前から6 か月前までの間に更新拒絶の通知をしないと従前の賃貸借と同一の条件で更に賃貸借したものとみなされる。","choice_4":"法では、農地の賃貸借の当事者は、当該賃貸借の合意による解約が民事調停法による農事調停によって行われる場合など一定の場合を除き、知事の許可を受けなければ、当該賃貸借について、解除、解約の申入れ、合意解約、更新拒絶の通知をしてはならないとされている。","official_accepted_answers":"1","answer_conclusion":"《農地法3条許可を停止条件とする所有権移転仮登記》自体には3条許可は不要です。","answer_reason":"《==農地法3条==許可を停止条件とする所有権移転仮登記》自体には3条許可は[[WARN:不要]]です。","scoring_exception_note":"","deep_lecture":"農地法は3条＝農地のまま権利移転4条＝所有者による転用5条＝転用目的の権利移転。仮登記だけでは本登記の権利移転と効果が異なるため、許可要否を分けます。\n\n【単元の見取り図・補足講義】農地法3条は農地の権利移動、4条は農地所有者による転用、5条は転用目的の権利移動を基本として分類する。 相続・特定遺贈・仮登記、農業用施設の面積、農地賃貸借の更新・解約などは一般原則に個別の例外がある。\n\n【本問の四肢を使った比較】【肢1：誤りを含む記述】誤り。許可を停止条件とする所有権移転の仮登記だけでは権利移転が生じないため、その仮登記申請自体に農地法3条許可は要りません。 【肢2：正しい方向の記述】正しい。5条の転用目的での権利移動は、調停などの例外を除き原則当事者連署による申請です。 【肢3：正しい方向の記述】正しい。農地賃貸借の更新拒絶通知は原則期間満了の1年前から6か月前までに行わなければ法定更新されます。 【肢4：正しい方向の記述】正しい。農地賃貸借の解約や更新拒絶には例外を除き都道府県知事等の許可を要します。\n\n【設問で判断を練習する】正解につながる肢の焦点は「法第3 条第1 項の許可があったときは所有権が移転する旨の停止条件付売買契約を原因とする所…」。誤り。許可を停止条件とする所有権移転の仮登記だけでは権利移転が生じないため、その仮登記申請自体に農地法3条許可は要りません。一方、「法では、農地の賃貸借の当事者は、当該賃貸借の合意による解約が民事調停法による農事調停によっ…」を論じる肢では「正しい。農地賃貸借の解約や更新拒絶には例外を除き都道府県知事等の許可を要します」という別の結論が問題となる。","system_purpose":"【学習補助】農地 -Q22","year":2024,"session":"通常","question_no":22,"major_field":"法令上の制限","section":"国土利用計画法","unit":"届出","topic":"事後届出・事前届出","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"国土利用計画法（以下この問において「法」という。）第23 条の届出（以下この問において「事後届出」という。）及び法第27 条の7 の監視区域内の届出（以下この問において「事前届出」という。）に関する次の記述のうち、正しいものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市にあってはその長をいうものとする。","choice_1":"Ａが所有する市街化区域以外の都市計画区域内の4,000 m2 の土地について、宅地建物取引業者Ｂが地上権の設定を受ける契約を締結した場合、Ｂは事後届出を行わなければならない。","choice_2":"宅地建物取引業者Ｃが所有する市街化区域内の3,000 m2 の土地と宅地建物取引業者Ｄが所有する都市計画区域外に所在する12,000 m2 の土地を金銭の授受を伴わずに交換する契約を締結した場合、Ｃ及びＤはともに事後届出を行う必要はない。","choice_3":"事前届出又は事後届出が必要な土地について、売買契約を締結したにもかかわらず所定の期間内に当該届出をしなかった者は都道府県知事からの勧告を受けることがあるが、罰則の適用を受けることはない。","choice_4":"監視区域に指定された市街化区域内に所在する土地2,500 m2 について売買契約を締結しようとする当事者は、契約締結の少なくとも6 週間前までに事前届出を行わなければならない。","official_accepted_answers":"4","answer_conclusion":"監視区域での取引は《契約締結の6週間前まで》の事前届出が問題。正解は4です。","answer_reason":"監視区域での取引は《==契約締結の6週間前まで==》の事前届出が問題。正解は4です。","scoring_exception_note":"","deep_lecture":"事後届出は市街化区域2,000㎡／その他都市計画区域5,000㎡／都市計画区域外10,000㎡を基準に。監視区域など規制区域の事前届出は別制度です。\n\n【単元の見取り図・補足講義】国土利用計画法の事後届出は面積区分と土地取得者をまず見る。市街化区域、その他都市計画区域、区域外で面積基準が異なる。 相続や国等からの取得、交換などの取引態様と、監視区域・注視区域の事前届出を区別する。\n\n【本問の四肢を使った比較】【肢1：誤りを含む記述】誤り。都市計画区域（市街化区域以外）の事後届出は原則5,000㎡以上。4,000㎡では面積要件に達しません。 【肢2：誤りを含む記述】誤り。土地交換も対価性を持つ取引に含まれ得ます。市街化区域3,000㎡と区域外12,000㎡は届出対象の面積です。 【肢3：誤りを含む記述】誤り。届出義務違反は一定の罰則対象です。勧告だけで終わるとは限りません。 【肢4：正しい方向の記述】正しい。監視区域で必要な事前届出は契約締結の少なくとも6週間前までに行います。\n\n【設問で判断を練習する】正解につながる肢の焦点は「監視区域に指定された市街化区域内に所在する土地2,500 m2 について売買契約を締結しよ…」。正しい。監視区域で必要な事前届出は契約締結の少なくとも6週間前までに行います。一方、「Ａが所有する市街化区域以外の都市計画区域内の4,000 m2 の土地について」を論じる肢では「誤り。都市計画区域（市街化区域以外）の事後届出は原則5,000㎡以上。4,000㎡では面積要件に達しません」という別の結論が問題となる。","system_purpose":"【学習補助】届出の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:相続や国等からの取得、交換などの取]]引態様と、監視区域・注視区域の事前届出を区別する。","comparative_ でに行います。 具体的な要件は出題当時の関連条文で確認する。"},{"question_id":"2024-Q23","year":2024,"session":"通常","question_no":23,"major_field":"税・その他","section":"所得税・租税特別措置法","unit":"税制特例","topic":"譲渡所得の特例・住宅ローン控除・贈与税","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"住宅借入金等を有する場合の所得税額の特別控除（以下この問において「住宅ローン控除」という。）に関する次の記述のうち、正しいものはどれか。なお、以下の居住用家屋は、令和5 年に建築基準法第6 条第1 項の確認（建築確認）を受けたものとする。","choice_1":"令和6 年中に居住用家屋を居住の用に供した場合において、その前年において居住用財産を譲渡した場合の軽減税率の特例の適用を受けているときであっても、令和6 年分以後の所得税について住宅ローン控除の適用を受けることができる。","choice_2":"令和6 年中に居住用家屋を居住の用に供した場合において、その前年において居住用財産の買換え等の場合の譲渡損失の損益通算の適用を受けているときであっても、令和6 年分以後の所得税について住宅ローン控除の適用を受けることができる。","choice_3":"令和5 年中に居住用家屋の敷地の用に供するための土地を取得した場合において、令和6年中に居住用家屋を新築して居住の用に供したときは、令和5 年分の所得税について住宅ローン控除の適用を受けることができる。","choice_4":"令和6 年中に居住用家屋を居住の用に供した場合において、その居住用家屋の取得に係る住宅借入金等の償還期間等が契約において3 年とされているときは、令和6 年以後3 年間の所得税について住宅ローン控除の適用を受けることができる。","official_accepted_answers":"2","answer_conclusion":"《買換えによる譲渡損失の損益通算》と住宅ローン控除は、設問条件では併用できます。","answer_reason":"《==買換えによる譲渡損失の損益通算==》と住宅ローン控除は、設問条件では併用できます。","scoring_exception_note":"","deep_lecture":"住宅ローン控除は入居年所得要件床面積返済期間ほかの譲渡特例との併用を分けて確認。年度により借入限度額・控除期間も変わるため、2024年度の数字を2026年度に流用しないでください。\n\n【単元の見取り図・補足講義】住宅ローン控除は居住開始時期、借入金の償還期間、対象住宅、他の譲渡特例との併用制限を各々確認する。 税制には適用年ごとの変更があるため、2024年の設問数値を2026年の申告条件にそのまま転用しない。\n\n【本問の四肢を使った比較】【肢1：誤りを含む記述】誤り。前年に居住用財産譲渡の軽減税率特例を使った場合、住宅ローン控除との重複適用制限があります。 【肢2：正しい方向の記述】正しい。居住用財産の買換え等の譲渡損失の損益通算は、設問の住宅ローン控除との併用を妨げないものです。 【肢3：誤りを含む記述】誤り。土地を前年に買っただけで、住宅の居住開始前の2023年所得税に住宅ローン控除を遡及適用できません。 【肢4：誤りを含む記述】誤り。住宅ローン控除は住宅借入金等の償還期間が原則10年以上などの要件が必要。3年返済は対象外です。\n\n【設問で判断を練習する】正解につながる肢の焦点は「令和6 年中に居住用家屋を居住の用に供した場合において」。正しい。居住用財産の買換え等の譲渡損失の損益通算は、設問の住宅ローン控除との併用を妨げないものです。一方、「令和6 年中に居住用家屋を居住の用に供した場合において」を論じる肢では「誤り。前年に居住用財産譲渡の軽減税率特例を使った場合、住宅ローン控除との重複適用制限があります」という別の結論が問題となる。","system_purpose":"【学習補助】税制特例の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowl 金等特別控除","choice_4_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。住宅ローン控除は住宅借入金等の償還期間が原則10年以上などの要件が必要。3年返済は対象外です。 具体的な要件は出題当時の関連条文で確認する。"},{"question_id":"2024-Q24","year":2024,"session":"通常","question_no":24,"major_field":"税・その他","section":"地方税法","unit":"不動産取得税","topic":"不動産取得税","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"不動産取得税に関する次の記述のうち、正しいものはどれか。","choice_1":"不動産取得税の課税標準は、不動産を取得した時における当該不動産の売買価格であるから、固定資産税の課税標準である固定資産の評価額とは異なるものである。","choice_2":"不動産取得税の課税標準となるべき額が、土地の取得にあっては10 万円、家屋の取得のうち建築に係るものにあっては1 戸につき23 万円、その他のものにあっては1 戸につき12万円に満たない場合においては、不動産取得税が課されない。","choice_3":"不動産取得税は、不動産の取得に対して課される税であるので、法人の合併により不動産を取得した場合においても、不動産取得税が課される。","choice_4":"令和6 年4 月に個人が取得した住宅及び住宅用地に係る不動産取得税の税率は3 ％であるが、住宅以外の家屋及び土地に係る不動産取得税の税率は4 ％である。","official_accepted_answers":"2","answer_conclusion":"《不動産取得税の免税点》は土地10万円・新築家屋23万円・その他家屋12万円。","answer_reason":"《==不動産取得税の免税点==》は土地10万円・新築家屋23万円・その他家屋12万円。","scoring_exception_note":"","deep_lecture":"不動産取得税は取得時に一度かかる都道府県税。取得原因課税標準免税点税率で整理しましょう。相続などは非課税、売買・贈与等は原則課税されます。\n\n【単元の見取り図・補足講義】不動産取得税は不動産取得を契機として都道府県が課する普通税。課税標準は通常、取得時の不動産評価額を基礎とする。 免税点は土地・新築家屋・その他家屋で異なる。売買代金と評価額、税率の本則と時限特例を区別する。\n\n【本問の四肢を使った比較】【肢1：誤りを含む記述】誤り。不動産取得税の課税標準は原則固定資産課税台帳の登録価格などの評価額であり、契約書の売買価格ではありません。 【肢2：正しい方向の記述】正しい。土地10万円、新築家屋23万円、その他家屋12万円に満たない場合は課税されません。 【肢3：誤りを含む記述】誤り。法人の合併に伴う不動産取得は原則として非課税の扱いです。 【肢4：誤りを含む記述】誤り。2024年4月の特例税率では住宅・土地が3％で、住宅以外の家屋は4％。土地も一律4％という記述が誤りです。\n\n【設問で判断を練習する】正解につながる肢の焦点は「不動産取得税の課税標準となるべき額が」。正しい。土地10万円、新築家屋23万円、その他家屋12万円に満たない場合は課税されません。一方、「不動産取得税の課税標準は、不動産を取得した時における当該不動産の売買価格であるから」を論じる肢では「誤り。不動産取得税の課税標準は原則固定資産課税台帳の登録価格などの評価額であり、契約書の売買価格ではありません」という別の結論が問題となる。","system_purpose":"【学習補助】不動産取得税の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:免税点は土地・新築家屋・その他家屋]]で異なる。売買代金と評価額、税率の本則と時限特例を区別する。","comparative_explanation":"【本問で混同しやすい区別】免税点は土地・新築家屋・その他家屋で異なる。売買代金と評価額 ","question_no":25,"major_field":"税・その他","section":"不動産鑑定評価基準","unit":"不動産鑑定評価","topic":"原価法・取引事例比較法・収益還元法","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"不動産の鑑定評価に関する次の記述のうち、不動産鑑定評価基準によれば、誤っているものはどれか。","choice_1":"同一需給圏とは、一般に対象不動産と代替関係が成立して、その価格の形成について相互に影響を及ぼすような関係にある他の不動産の存する圏域をいう。","choice_2":"対象不動産について、依頼目的に応じ対象不動産に係る価格形成要因のうち地域要因又は個別的要因について想定上の条件を設定する場合がある。","choice_3":"不動産の価格は、その不動産の効用が最高度に発揮される可能性に最も富む使用を前提として把握される価格を標準として形成されるが、これを適合の原則という。","choice_4":"収益還元法は、対象不動産が将来生み出すであろうと期待される純収益の現在価値の総和を求めることにより対象不動産の試算価格を求める手法であり、賃貸用不動産又は賃貸以外の事業の用に供する不動産の価格を求める場合に特に有効である。","official_accepted_answers":"3","answer_conclusion":"「最有効使用」を前提に価格を形成するのは《最有効使用の原則》。適合の原則ではありません。","answer_reason":"「最有効使用」を前提に価格を形成するのは《==最有効使用の原則==》。適合の原則ではありません。","scoring_exception_note":"","deep_lecture":"鑑定評価の三方式は原価法＝再調達原価から取引事例比較法＝類似取引から収益還元法＝将来収益から。言葉の定義と方式の使いどころをセットで学習します。\n\n【単元の見取り図・補足講義】原価法は再調達原価から減価修正、取引事例比較法は事情・時点・地域等の補正、収益還元法は将来純収益の現在価値を用いる。 適合の原則と最有効使用の原則、同一需給圏と同一用途という別概念を取り違えない。\n\n【本問の四肢を使った比較】【肢1：正しい方向の記述】正しい。同一需給圏は代替・競争関係にある不動産が相互に価格へ影響を与える範囲をいいます。 【肢2：正しい方向の記述】正しい。鑑定評価では所定の条件により地域・個別的要因に関する想定上の条件を設定する場合があります。 【肢3：誤りを含む記述】誤り。不動産の効用が最高に発揮される使い方は最有効使用の原則。適合の原則とは異なります。 【肢4：正しい方向の記述】正しい。収益還元法は将来の純収益を現在価値に還元する方法で、賃貸・事業用不動産などに適します。\n\n【設問で判断を練習する】正解につながる肢の焦点は「不動産の価格は、その不動産の効用が最高度に発揮される可能性に最も富む使用を前提として把握さ…」。誤り。不動産の効用が最高に発揮される使い方は最有効使用の原則。適合の原則とは異なります。一方、「同一需給圏とは、一般に対象不動産と代替関係が成立して」を論じる肢では「正しい。同一需給圏は代替・競争関係にある不動産が相互に価格へ影響を与える範囲をいいます」という別の結論が問題となる。","system_purpose":"【学習補助】不動産鑑定評価の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:適合の原則と最有効使用の原則、同一]]需給圏と同一用途という別概念を取り違えない。","comparative_explanation":"【本問で混同しやすい区別】適合の原則と最有効使用の原則、同一需給圏と同一用途という別概念を取り違えない。","important_points":"《最有効使用》／《収益還元法＝純収益の現在価値》／《同一需給圏＝代替関係》。\n【判定の軸】適合の原則と最有効使用の原則、同一需給圏と同一用途という別概念を取り違えない。","trick_patterns":"「[[WARN:適合の原則]]」と「 の委託を受けている者の氏名（法人にあっては、その商号又は名称）及び住所（法人にあっては、その主たる事務所の所在地）を説明しなければならない。エ　区分所有建物である中古マンションの一室の売買の媒介を行う場合、当該1 棟の建物の計画的な維持修繕のための費用の積立てを行う旨の規約の定めがあるときは、その内容及び既に積み立てられている額について説明しなければならない。","choice_1":"一つ","choice_2":"二つ","choice_3":"三つ","choice_4":"四つ","official_accepted_answers":"3","answer_conclusion":"本問の正解は選択肢3。","answer_reason":"本問の正解は選択肢3。 ア（ガス設備）○、イ（専任要件）×、ウ（管理受託者）○、エ（積立金）○。正しいのは3つ。","scoring_exception_note":"","deep_lecture":"宅地建物取引業法35条は、契約を締結する前に買主・借主等が重要な情報を理解し、十分な判断材料を持てるようにする制度です。説明する内容は、土地建物の基本情報だけでなく、将来の利用・管理・費用負担に関わる事項に及びます。本問アは、LPガスの配管設備の所有者が売買後も販売会社に残る場面です。設備が土地所有者に当然帰属すると思っている購入者には重要な情報なので、権利関係を明らかにします。ウとエは区分所有建物に特有の事項です。住居用マンションに限らず、事務所ビルの区分所有でも管理受託者の情報を説明する必要があります。修繕積立金に関する規約の内容や積立額は、将来の修繕費負担を見込むために重要です。これに対しイは宅建士と専任宅建士を混同したひっかけです。重要事項説明を行う人も35条書面に記名する人も宅地建物取引士である必要がありますが、事務所の専任取引士でなければならないわけではありません。解き方は、①各記述を○×判定、②正しい要素だけ数える、③1〜4の選択肢に対応させる、の順です。ア○・イ×・ウ○・エ○で3個となり、正解は3です。さらに、2026年4月には宅建業法施行規則の説明事項が一部追加されています。過去問の出題当時の公式正解は保存し、現行の重要事項説明の追加項目は別欄で把握してください。\n\n【単元の見取り図・補足講義】宅地建物取引業法35条の重要事項説明は、契約の成立前に、宅建士が購入・賃借の判断に必要な情報を提供する制度。37条書面は契約成立後の内容確認書面。 説明者が宅建士であることと事務所の専任宅建士であることは別。対象物件の種類や取引形態に応じて説明事項が変わる。\n\n【本問の四肢を使った比較】【肢1：選択肢の構成要素の検討が必要】誤り。ア〜エの正しい記述は一つではありません。アでは、LPガス販売会社が住宅売買後も宅地内の配管設備等の所有権を持つ場合、その所有関係を重要事項として説明する必要があります。加えてウの管理委託先の名称・住所、エの計画修繕積立金の規約と既積立額も説明対象です。イの「書面に記名する取引士は専任でなければならない」という限定だけが誤りで、正しいものは3つです。 【肢2：選択肢の構成要素の検討が必要】誤り。正しいものが二つという選択肢も数え間違いです。アのガス配管設備等の所有関係と、ウの区分所有建物の管理委託先は、購入者が今後負う管理上・費用上のリスクを理解するための情報です。エの修繕積立金に関する定めと積立額も同様に説明すべき事項として含まれます。3つの要素を別々に確認したうえで、初めて個数を判断します。 【肢3：選択肢の構成要素の検討が必要】正しい。アはガス配管の所有者、ウは区分所有建物の管理受託者、エは修繕積立金のルールと残高を説明すべきという内容で正しいです。一方、イは35条の説明者・書面記名者のいずれも「専任」の宅建士でなければならないという趣旨で誤りです。宅建士である必要性と事務所への専任性は別の要件です。ア・ウ・エの3つが正しいので「三つ」が正解です。 【肢4：選択肢の構成要素の検討が必要】誤り。イを正しいと扱って四つと数えるのは誤りです。宅建業法35条は重要事項説明を宅地建物取引士に行わせる制度ですが、取引士が事務所の専任取引士であることまで要求していません。記名についても同じ発想です。残るア・ウ・エが正しいため、正しい記述は四つではなく三つです。個数問題では一つの誤要素が全選択肢の判断に影響します。","system_purpose":"契約締結前に、設備・共用部管理・修繕費用など購入後の負担につながる情報を説明し、取引相手の合理的判断と紛争予防を確保する。","practical_examples":"例：中古マンションを購入するAは、修繕積立金が不足すると将来の一時金負担が生じ得る。管理委託先や規約・積立額を契約前に把握することが重要となる。","advanced_knowledge":"[[NOTE:2026年4月1日から管理業者管理]]者方式が導入された場合の重要事項の追加等がある。過去問の判定と現行実務で追加された説明項目を混同しない。","comparative_explanation":"35条説明は契約前の意思決定支援／37条書面は契約成立後の内容記録。宅建士であることと事務所の専任宅建士であることは別。","important_points":"==ガス設備の所有者の説明==／==区分所有建物の管理受託者==／==修繕積立金の規約と積立額==／==専任宅建士に限定されない==。","trick_patterns":"[[WARN:専任宅建士だけが記名できる]]という混同。[[WARN:事務所ビルは説明対象外]]という取引目的での誤読。","memory_summary":"ア（ガス設備）○、イ（専任要件）×、ウ（管理受託者）○、エ（積立金）○。正しいのは3つ。","review_check_questions":"Q 35条説明者は専任宅建士に限定？ A いいえ。\nQ 区分所有の事務所ビルの管理受託者も説明？ A はい。\nQ ア〜エの正しい個数は？ A 3つ。","substatement_reasoning":"ア○：売買後もガス会社に所有権が残る設備等の所有関係を説明する。\nイ×：重要事項説明・35条書面への記名をする宅建士が専任者である必要はない。\nウ○：区分所有建物の管理受託者の氏名・名称・住所を説明する。\nエ○：計画修繕積立金に関する規約の内容と既に積み立てられた金額を説明する。\n以上、正しいのは3記述。","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"宅建業法35条・国土交通省（法解釈、2026年4月改正を含む）https://www.mlit.go.jp/totikensangyo/const/1_6_bt_000268.html","marker_yellow_spans":"ガス設備の所有者の説明|区分所有建物の管理受託者|修繕積立金の規約と積立額|専任宅建士に限定されない","marker_red_spans":"専任宅建士だけが記名できる|事務所ビルは説明対象外","marker_blue_spans":"2026年4月1日から管理業者管理","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"compound","choice_1_is_exam_answer":"false","choice_1_wrong_part":"一つ","choice_1_reason":"誤り。ア〜エの正しい記述は一つではありません。アでは、LPガス販売会社が住宅売買後も宅地内の配管設備等の所有権を持つ場合、その所有関係を重要事項として説明する必要があります。加えてウの管理委託先の名称・住所、エの計画修繕積立金の規約と既積立額も説明対象です。イの「書面に記名する取引士は専任でなければならない」という限定だけが誤りで、正しいものは3つです。","choice_1_corrected_statement":"正しいものはア・ウ・エの三つである。","choice_1_legal_basis":"宅建業法35条、同法施行規則の35条説明事項","choice_1_exam_tip":"[[WARN:専任宅建士だけが記名できる]]という混同。[[WARN:事務所ビルは説明対象外]]という取引目的での誤読。","choice_2_truth":"compound","choice_2_is_exam_answer":"false","choice_2_wrong_part":"二つ","choice_2_reason":"誤り。正しいものが二つという選択肢も数え間違いです。アのガス配管設備等の所有関係と、ウの区分所有建物の管理委託先は、購入者が今後負う管理上・費用上のリスクを理解するための情報です。エの修繕積立金に関する定めと積立額も同様に説明すべき事項として含まれます。3つの要素を別々に確認したうえで、初めて個数を判断します。","choice_2_corrected_statement":"正しいものはア・ウ・エの三つである。","choice_2_legal_basis":"宅建業法35条、同法施行規則の35条説明事項","choice_2_exam_tip":"[[WARN:専任宅建士だけが記名できる]]という混同。[[WARN:事務所ビルは説明対象外]]という取引目的での誤読。","choice_3_truth":"compound","choice_3_is_exam_answer":"true","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい。アはガス配管の所有者、ウは区分所有建物の管理受託者、エは修繕積立金のルールと残高を説明すべきという内容で正しいです。一方、イは35条の説明者・書面記名者のいずれも「専任」の宅建士でなければならないという趣旨で誤りです。宅建士である必要性と事務所への専任性は別の要件です。ア・ウ・エの3つが正しいので「三つ」が正解です。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"宅建業法35条、同法施行規則の35条説明事項","choice_3_exam_tip":"[[WARN:専任宅建士だけが記名できる]]という混同。[[WARN:事務所ビルは説明対象外]]という取引目的での誤読。","choice_4_truth":"compound","choice_4_is_exam_answer":"false","choice_4_wrong_part":"四つ","choice_4_reason":"誤り。イを正しいと扱って四つと数えるのは誤りです。宅建業法35条は重要事項説明を宅地建物取引士に行わせる制度ですが、取引士が事務所の専任取引士であることまで要求していません。記名についても同じ発想です。残るア・ウ・エが正しいため、正しい記述は四つではなく三つです。個数問題では一つの誤要素が全選択肢の判断に影響します。","choice_4_corrected_statement":"正しいものはア・ウ・エの三つである。","choice_4_legal_basis":"宅建業法35条、同法施行規則の35条説明事項","choice_4_exam_tip":"[[WARN:専任宅建士だけが記名できる]]という混同。[[WARN:事務所ビルは説明対象外]]という取引目的での誤読。"},{"question_id":"2024-Q27","year":2024,"session":"通常","question_no":27,"major_field":"宅建業法","section":"宅地建物取引業法","unit":"保証協会","topic":"弁済業務保証金・保証協会","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"宅地建物取引業者Ａに関する次の記述のうち、正しいものはどれか。なお、Ａは宅地建物取引業保証協会の社員ではないものとする。","choice_1":"Ａが主たる事務所を移転したことにより、その最寄りの供託所が変更した場合において、金銭のみをもって営業保証金を供託しているときは、遅滞なく営業保証金を移転後の主たる事務所の最寄りの供託所に新たに供託しなければならない。","choice_2":"Ａの従業員が運転する車両で現地案内を受けた者が、Ａの従業員の過失による交通事故でケガをした場合に取得する損害賠償請求権は、Ａが供託した営業保証金の還付の対象債権となる。","choice_3":"Ａは、金銭と有価証券を併用して供託することができ、有価証券のみで供託する場合の当該有価証券の価額は、国債証券の場合はその額面金額の100 分の90、地方債証券の場合はその額面金額の100 分の80 である。","choice_4":"Ａは甲県内にある主たる事務所とは別に、乙県内に新たに従たる事務所を設置したときは、営業保証金を主たる事務所の最寄りの供託所に供託しなければならない。","official_accepted_answers":"4","answer_conclusion":"《従たる事務所の追加保証金》も、主たる事務所の最寄りの供託所に納めます。","answer_reason":"《==従たる事務所の追加保証金==》も、主たる事務所の最寄りの供託所に納めます。","scoring_exception_note":"","deep_lecture":"営業保証金は主たる事務所1,000万円／従たる事務所1か所500万円が原則。保証協会加入時の分担金とは制度が違います。\n\n【単元の見取り図・補足講義】営業保証金は取引の相手方を保護する制度。供託場所・額・事務所増設時の追加供託、有価証券の評価が出題される。 宅地建物取引業保証協会の弁済業務保証金分担金と、業者自身が供託する営業保証金のしくみを混同しない。\n\n【本問の四肢を使った比較】【肢1：誤りを含む記述】誤り。金銭のみ供託している場合、供託所が変われば原則保管替えの手続をします。新規供託と書いてあるので誤りです。 【肢2：誤りを含む記述】誤り。営業保証金から還付されるのは宅建業取引によって生じた一定の債権で、案内車両での交通事故の不法行為損害賠償は通常含まれません。 【肢3：誤りを含む記述】誤り。有価証券の評価割合は国債が額面100％、地方債等は原則90％などです。設問の90％・80％は誤りです。 【肢4：正しい方向の記述】正しい。営業保証金は主たる事務所の最寄りの供託所にまとめて供託します。他県の支店を増設しても同じです。\n\n【設問で判断を練習する】正解につながる肢の焦点は「Ａは甲県内にある主たる事務所とは別に」。正しい。営業保証金は主たる事務所の最寄りの供託所にまとめて供託します。他県の支店を増設しても同じです。一方、「Ａが主たる事務所を移転したことにより」を論じる肢では「誤り。金銭のみ供託している場合、供託所が変われば原則保管替えの手続をします。新規供託と書いてあるので誤りです」という別の結論が問題となる。","system_purpose":"【学習補助】保証協会の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:宅地建物取引業保証協会の弁済業務保]]証金分担金と、業者自身が供託する営業保証金のしくみを混同しない。","comparative_explanation":"【本問で混同しやすい区別】宅地建物取引業保証協会の弁済業務保証金分担金と、業者自身が供託する営業保証金のしくみを混同しない。","important_points":"《供託場所は本店最寄り》／《金銭のみの場合は保管替え》／《事故の損害賠償は還付対象外》。\n【判定の軸】宅地建物取引業保証協会の弁済業務保証金分担金と、業者自身が供託する営業保証金のしくみを混同しない。","trick_patterns":"営業保証金と弁済業務保証金を[[WARN:混同]]しない。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《従たる事務所の追加保証金》も、主たる事務所の最寄りの供託所に納めます。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 4番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 宅地建物取引業保証協会の弁済業務保証金分担金と、業者自身が供託する営業保証金のしくみを混同しない。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"[[NOTE:宅地建物取引業法25条]]・
