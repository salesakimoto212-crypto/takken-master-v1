地区の定義ではない。==。"},{"question_id":"2025-Q16","year":2025,"session":"通常","question_no":16,"major_field":"法令上の制限","section":"都市計画法","unit":"開発許可","topic":"開発行為・許可不要と許可基準","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"都市計画法に関する次の記述のうち、正しいものはどれか。ただし、この問において条例による特別の定めはないものとし、「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。","choice_1":"市街化調整区域のうち開発許可を受けた開発区域以外の区域において行う、学校教育法に規定する学校の新築については、都道府県知事の許可が不要である。","choice_2":"開発行為とは、主として建築物の建築又は特定工作物の建設の用に供する目的で行う土地の区画形質の変更をいい、ゴルフコースの建設は開発行為にはあたらない。","choice_3":"区域区分が定められていない都市計画区域において、商業施設の建築の用に供する目的で行う4,000 m2 の開発行為は都道府県知事の許可が不要である。","choice_4":"自己の居住の用に供する住宅の建築を目的として行う開発行為以外の開発行為にあっては、原則として開発区域内に建築基準法に規定する災害危険区域内の土地を含んではならない。","official_accepted_answers":"4","answer_conclusion":"自己居住用住宅以外の開発行為では、原則として《災害危険区域》内の土地を開発区域に含めません。肢4が正しいです。","answer_reason":"【結論】自己居住用住宅以外の開発行為では、原則として《災害危険区域》内の土地を開発区域に含めません。肢4が正しいです。\n【解き方】開発行為は主として建築物の建築または特定工作物の建設を目的とする土地の区画形質変更である。許可の要否は都市計画区域の区分、面積、開発行為の目的により異なる。ゴルフコースなどは特定工作物として扱われ、住宅建築だけが対象ではない。開発許可の技術基準では、自己居住用住宅とそれ以外で災害危険区域等を開発区域に含められるかが異なる。都市計画法43条の建築制限は市街化調","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】開発行為は主として建築物の建築または特定工作物の建設を目的とする土地の区画形質変更である。許可の要否は都市計画区域の区分、面積、開発行為の目的により異なる。ゴルフコースなどは特定工作物として扱われ、住宅建築だけが対象ではない。開発許可の技術基準では、自己居住用住宅とそれ以外で災害危険区域等を開発区域に含められるかが異なる。都市計画法43条の建築制限は市街化調整区域内の開発許可を受けた土地以外等を対象とするため、29条の開発行為許可と混同しない。\n【本問への当てはめ】都市計画法の開発許可は《どの区域か》《何の施設か》《面積はいくつか》《災害危険区域等を含むか》を順に判定します。都市計画区域内か外かで面積要件が異なるので、3,000㎡をすべての土地に機械適用しないようにしましょう。\n【判断順序・類題への対応】都市計画法29条の開発許可／33条の技術基準／43条の市街化調整区域の建築許可は別。\n【具体的な当てはめ】自己の居住用の一戸建て住宅と、分譲する共同住宅の開発を比べると、災害危険区域の扱いなど許可要件が異なり得る。 ","system_purpose":"制度の趣旨：開発行為は主として建築物の建築または特定工作物の建設を目的とする土地の区画形質変更である。許可の要否は都市計画区域の区分、面積、開発行為の目的により異なる。ゴルフコースなどは特定工作物として扱われ、住宅建築だけが対象ではない。開発許可の技術基準では、自己居住用住宅とそれ以外で災害危険区域等を開発区域に含められるかが異なる。都市計画法43条の建築制限は市街化調整区域内の開発許可を","practical_examples":"【具体例】自己の居住用の一戸建て住宅と、分譲する共同住宅の開発を比べると、災害危険区域の扱いなど許可要件が異なり得る。","advanced_knowledge":"【周辺・発展】都市計画法の開発許可は《どの区域か》《何の施設か》《面積はいくつか》《災害危険区域等を含むか》を順に判定します。都市計画区域内か外かで面積要件が異なるので、3,000㎡をすべての土地に機械適用しないようにしましょう。\n[[NOTE:都市計画法29条の開発許可／33条の技術基準／43条の市街化調整区域の建築許可は別。]]","comparative_explanation":"都市計画法29条の開発許可／33条の技術基準／43条の市街化調整区域の建築許可は別。","important_points":"==非線引き都市計画区域＝原則3,000㎡／ゴルフコースも特定工作物／自己居住用以外は災害危険区域を原則除外。==","trick_patterns":"「学校だから」「ゴルフ場だから」という用途だけで許可不要と決めない。｜本問特有の誤誘導：自己居住用住宅以外の開発行為では、原則として《災害危険区域》内の土地を開発区域に含めません。肢4が正しいです。\n【誤答注意】設問中の [[WARN:都道府県知事の許可が不要である]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"非線引き都市計画区域＝原則3,000㎡／ゴルフコースも特定工作物／自己居住用以外は災害危険区域を原則除外。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 4。\nQ2: 本問の主要な判断要件は何か？ A2: 都市計画法29条の開発許可／33条の技術基準／43条の市街化調整区域の建築許可は別。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"都市計画法4条・29条・33条・43条 | 都市計画法4条・29条・33条・43条 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"非線引き都市計画区域＝原則3,000㎡／ゴルフコースも特定工作物／自己居住用以外は災害危険区域を原則除外。","marker_red_spans":"都道府県知事の許可が不要である","marker_blue_spans":"都市計画法29条の開発許可／33条の技術基準／43条の市街化調整区域の建築許可は別。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"都道府県知事の許可が不要である","choice_1_reason":"誤り。市街化調整区域内の学校新築は、学校という用途だけを理由に知事許可が一律不要とはなりません。建築等の許可が必要な場合があります。\n【本肢の根拠・注意点】市街化調整区域では原則、都市計画法43条の建築許可が問題となる。学校だから許可が一切不要という包括的な免除にはならない。学校教育法上の施設と、都市計画法の開発許可・建築許可それぞれの対象外事由は条文に沿って分ける。","choice_1_corrected_statement":"市街化調整区域のうち開発許可を受けた開発区域以外の区域において行う、学校教育法に規定する学校の新築については、都市計画法43条の許可が必要となる場合がある。","choice_1_legal_basis":"都市計画法4条・29条・33条・43条（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"「学校だから」「ゴルフ場だから」という用途だけで許可不要と決めない。｜誤り。市街化調整区域内の学校新築は、学校という用途だけを理由に知事許可が一律不要とはなりません。建築等の許可が必要な場合があります。\n不要という包括的な免除にはならない。学校教育法上の施設と、都市計画法の開発許可・建築許可それぞれの対象外事由は条文に沿って分ける。\n不要という包括的な免除にはならない。学校教育法上の施設と、都市計画法の開発許可・建築許可それぞれの対象外事由は条文に沿って分ける。\nひっかけ箇所：[[WARN:都道府県知事の許可が不要である]]。正しい内容：==学校の新築については、都市計画法43条の許可が必要となる場合がある。==。","choice_2_truth":"false","choice_2_is_exam_answer":"false","choice_2_wrong_part":"ゴルフコースの建設は開発行為にはあたらない","choice_2_reason":"誤り。開発行為は建物等のための土地の区画形質変更で、一定の《特定工作物》に当たるゴルフコースも対象になり得ます。\n【本肢の根拠・注意点】ゴルフコースは第二種特定工作物として都市計画法上の開発行為に含まれ得る。建物を建築しないという理由だけで開発行為から除外するのは誤り。土地の区画形質を変更する目的が特定工作物の建設かどうかを確認する。","choice_2_corrected_statement":"開発行為とは、主として建築物の建築又は特定工作物の建設の用に供する目的で行う土地の区画形質の変更をいい、ゴルフコースの建設を目的とする区画形質の変更も開発行為に該当し得る。","choice_2_legal_basis":"都市計画法4条・29条・33条・43条（当該肢と条文の個別照合は要確認）","choice_2_exam_tip":"「学校だから」「ゴルフ場だから」という用途だけで許可不要と決めない。｜誤り。開発行為は建物等のための土地の区画形質変更で、一定の《特定工作物》に当たるゴルフコースも対象になり得ます。\n。建物を建築しないという理由だけで開発行為から除外するのは誤り。土地の区画形質を変更する目的が特定工作物の建設かどうかを確認する。\n。建物を建築しないという理由だけで開発行為から除外するのは誤り。土地の区画形質を変更する目的が特定工作物の建設かどうかを確認する。\nひっかけ箇所：[[WARN:ゴルフコースの建設は開発行為にはあたらな]]。正しい内容：==ゴルフコースの建設を目的とする区画形質の変更も開発行為に該当し得る。==。","choice_3_truth":"false","choice_3_is_exam_answer":"false","choice_3_wrong_part":"許可が不要である","choice_3_reason":"誤り。区域区分のない都市計画区域では、原則として《3,000㎡以上》の開発行為が許可対象です。4,000㎡なら一律不要とはいえません。\n【本肢の根拠・注意点】区域区分のない都市計画区域では、一定規模以上の開発行為に都道府県知事の許可を要する。原則3000㎡以上が代表基準であり、本肢の4000㎡の商業施設用地は対象外にならない。条例特例なしの前提も重要。","choice_3_corrected_statement":"区域区分が定められていない都市計画区域において、商業施設の建築の用に供する目的で行う4,000 m2 の開発行為は都道府県知事の原則として都道府県知事等の開発許可が必要である。","choice_3_legal_basis":"都市計画法4条・29条・33条・43条（当該肢と条文の個別照合は要確認）","choice_3_exam_tip":"「学校だから」「ゴルフ場だから」という用途だけで許可不要と決めない。｜誤り。区域区分のない都市計画区域では、原則として《3,000㎡以上》の開発行為が許可対象です。4,000㎡なら一律不要とはいえません。\n事の許可を要する。原則3000㎡以上が代表基準であり、本肢の4000㎡の商業施設用地は対象外にならない。条例特例なしの前提も重要。\n事の許可を要する。原則3000㎡以上が代表基準であり、本肢の4000㎡の商業施設用地は対象外にならない。条例特例なしの前提も重要。\nひっかけ箇所：[[WARN:許可が不要である]]。正しい内容：==行為は都道府県知事の原則として都道府県知事等の開発許可が必要である。==。","choice_4_truth":"true","choice_4_is_exam_answer":"true","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。自己居住用住宅の建築目的ではない開発行為では、原則として災害危険区域内の土地を含めない基準が設けられています。\n【本肢の根拠・注意点】分譲住宅や商業施設など、自己居住用住宅以外を目的とする開発行為では、原則として災害危険区域内の土地を区域に含めない設計が求められる。目的に応じた技術基準の差であり、単に災害区域ならあらゆる建築が絶対禁止という意味ではない。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"都市計画法4条・29条・33条・43条（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"「学校だから」「ゴルフ場だから」という用途だけで許可不要と決めない。｜正しい。自己居住用住宅の建築目的ではない開発行為では、原則として災害危険区域内の土地を含めない基準が設けられています。\nの土地を区域に含めない設計が求められる。目的に応じた技術基準の差であり、単に災害区域ならあらゆる建築が絶対禁止という意味ではない。\nの土地を区域に含めない設計が求められる。目的に応じた技術基準の差であり、単に災害区域ならあらゆる建築が絶対禁止という意味ではない。"},{"question_id":"2025-Q17","year":2025,"session":"通常","question_no":17,"major_field":"法令上の制限","section":"建築基準法","unit":"建築確認・防火","topic":"建築確認・大規模修繕・防火構造・手すり","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"建築基準法に関する次の記述のうち、誤っているものはどれか。","choice_1":"建築主は、建築確認が必要な建築物を建築しようとする場合は、当該建築物の計画を建築基準法令の規定に適合させるだけでなく、建築基準法令の規定以外の宅地造成及び特定盛土等規制法などの建築基準関係規定にも適合するものであることについて確認を受ける必要がある。","choice_2":"建築主は、2 階建ての木造住宅を新築しようとする場合は、当該工事に着手する前に、その計画が建築基準関係規定に適合するものであることについて、確認を受け、確認済証の交付を受ける措置が必要となるが、当該住宅の大規模の修繕をしようとする場合には、当該措置は不要である。","choice_3":"延べ面積が1,000 m2 を超える木造建築物は、その外壁及び軒裏で延焼のおそれのある部分を防火構造としなければならない。","choice_4":"高さ1 m 以下の階段の部分には、手すりを設けなくてもよい。","official_accepted_answers":"2","answer_conclusion":"2025年4月の建築確認制度見直しで、2階建木造住宅は《大規模修繕・模様替え》でも建築確認が必要となる場合があります。肢2が誤り。","answer_reason":"【結論】2025年4月の建築確認制度見直しで、2階建木造住宅は《大規模修繕・模様替え》でも建築確認が必要となる場合があります。肢2が誤り。\n【解き方】建築基準法は、建築物の新築だけでなく増築・改築や大規模な修繕・模様替えにも一定の確認手続を求める。2025年4月1日施行の制度見直しにより、従来の木造小規模建築物に対する審査省略範囲が変更された。特に木造2階建て住宅は建築確認の対象となる工事の範囲を旧制度の知識で判定しない。大規模修繕は主要構造部の一種以上について過半の修繕等をする概念で、通常の内装修繕や屋","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】建築基準法は、建築物の新築だけでなく増築・改築や大規模な修繕・模様替えにも一定の確認手続を求める。2025年4月1日施行の制度見直しにより、従来の木造小規模建築物に対する審査省略範囲が変更された。特に木造2階建て住宅は建築確認の対象となる工事の範囲を旧制度の知識で判定しない。大規模修繕は主要構造部の一種以上について過半の修繕等をする概念で、通常の内装修繕や屋根の軽微な補修とは区別する。用途変更、確認申請、防火地域等についてもそれぞれ要件を確認する。\n【本問への当てはめ】従来「4号建築物」と呼ばれた木造2階建て住宅などへの審査の特例が見直されました。今は《構造・規模》と《行為（新築／大規模修繕等）》を組み合わせて確認が必要か判断します。住宅の改修だから確認不要、と単純化しないこと。\n【判断順序・類題への対応】建築確認の対象工事と軽微な修繕／主要構造部と設備・仕上げ部分／旧4号特例と2025年4月以降の新制度。\n【具体的な当てはめ】木造2階建て住宅で屋根の主要部分を過半修繕する場合、工事種別と地域などを確認せず「木造住宅だから確認不要」と判断しない。 ","system_purpose":"制度の趣旨：建築基準法は、建築物の新築だけでなく増築・改築や大規模な修繕・模様替えにも一定の確認手続を求める。2025年4月1日施行の制度見直しにより、従来の木造小規模建築物に対する審査省略範囲が変更された。特に木造2階建て住宅は建築確認の対象となる工事の範囲を旧制度の知識で判定しない。大規模修繕は主要構造部の一種以上について過半の修繕等をする概念で、通常の内装修繕や屋根の軽微な補修とは区","practical_examples":"【具体例】木造2階建て住宅で屋根の主要部分を過半修繕する場合、工事種別と地域などを確認せず「木造住宅だから確認不要」と判断しない。","advanced_knowledge":"【周辺・発展】従来「4号建築物」と呼ばれた木造2階建て住宅などへの審査の特例が見直されました。今は《構造・規模》と《行為（新築／大規模修繕等）》を組み合わせて確認が必要か判断します。住宅の改修だから確認不要、と単純化しないこと。\n[[NOTE:建築確認の対象工事と軽微な修繕／主要構造部と設備・仕上げ部分／旧4号特例と2025年4月以降の新制度。]]","comparative_explanation":"建築確認の対象工事と軽微な修繕／主要構造部と設備・仕上げ部分／旧4号特例と2025年4月以降の新制度。","important_points":"==木造2階建ての大規模修繕／2025年4月から規制見直しを結び付ける。==","trick_patterns":"「工事が新築か修繕か」だけでなく、建築物がどの区分に該当するかが重要。｜本問特有の誤誘導：2025年4月の建築確認制度見直しで、2階建木造住宅は《大規模修繕・模様替え》でも建築確認が必要となる場合があります。肢2が誤り。\n【誤答注意】設問中の [[WARN:当該住宅の大規模の修繕をしようとする場合]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"木造2階建ての大規模修繕／2025年4月から規制見直しを結び付ける。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 2。\nQ2: 本問の主要な判断要件は何か？ A2: 建築確認の対象工事と軽微な修繕／主要構造部と設備・仕上げ部分／旧4号特例と2025年4月以降の新制度。。","substatement_reasoning":"","reform_status":"relevant_verified","reform_title":"木造2階建て等の大規模修繕に関する建築確認対象の見直し（2025年4月1日）","reform_effective_date":"2025-04-01","reform_before":"2025年4月より前の旧4号特例に基づく確認の適用範囲","reform_after":"2025年4月以降の確認手続に関する対象範囲を適用","reform_2026_impact":"2026年受験時点でも、木造2階建て住宅等の主要構造部の過半に及ぶ大規模修繕・模様替えは建築確認が必要。設備交換や仕上げ材だけの軽微な改修まで一律に確認対象とするものではない。","reform_sources":"https://www.mlit.go.jp/report/press/house05_hh_001148.html | https://www.mlit.go.jp/report/press/house05_hh_001077.html","legal_sources":"建築基準法6条等、国土交通省2025年4月建築基準法改正解説 | 国土交通省「2025年4月1日から省エネ基準適合の全面義務化」 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/ | https://www.mlit.go.jp/report/press/house05_hh_001148.html","marker_yellow_spans":"木造2階建ての大規模修繕／2025年4月から規制見直しを結び付ける。","marker_red_spans":"当該住宅の大規模の修繕をしようとする場合","marker_blue_spans":"建築確認の対象工事と軽微な修繕／主要構造部と設備・仕上げ部分／旧4号特例と2025年4月以降の新制度。","qa_status":"REWORK","qa_issues":"一次資料で一部の中核論点を再確認済。ただし4肢すべての独立検証は未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"false","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。建築確認は建築基準法の条文だけでなく、法令で定める《建築基準関係規定》への適合も審査します。盛土規制法の一部も対象となります。\n【本肢の根拠・注意点】確認申請では建築基準法令の狭い条文だけでなく、政令で定める建築基準関係規定への適合も審査対象となる。盛土規制などと切り離せない場面があるので、確認済証は建物の構造仕様だけの形式審査ではない。","choice_1_corrected_statement":"原文どおりで正しい","choice_1_legal_basis":"建築基準法6条等、国土交通省2025年4月建築基準法改正解説（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"「工事が新築か修繕か」だけでなく、建築物がどの区分に該当するかが重要。｜正しい。建築確認は建築基準法の条文だけでなく、法令で定める《建築基準関係規定》への適合も審査します。盛土規制法の一部も対象となります。\n築基準関係規定への適合も審査対象となる。盛土規制などと切り離せない場面があるので、確認済証は建物の構造仕様だけの形式審査ではない。\n築基準関係規定への適合も審査対象となる。盛土規制などと切り離せない場面があるので、確認済証は建物の構造仕様だけの形式審査ではない。","choice_2_truth":"false","choice_2_is_exam_answer":"true","choice_2_wrong_part":"当該住宅の大規模の修繕をしようとする場合には、当該措置は不要である","choice_2_reason":"誤り。2025年4月以降、2階建て木造住宅などは、一定の大規模修繕・大規模模様替えでも建築確認の対象です。「新築なら必要、修繕は一律不要」は誤り。\n【本肢の根拠・注意点】木造2階建て住宅の大規模修繕は2025年4月施行の制度見直しで建築確認を要する場合がある。新築は必要だが大規模修繕は必ず不要という断定が誤り。主要構造部の過半を修繕するか等、工事規模も確認する。","choice_2_corrected_statement":"建築主は、2 階建ての木造住宅を新築しようとする場合は、当該工事に着手する前に、その計画が建築基準関係規定に適合するものであることについて、確認を受け、確認済証の交付を受ける措置が必要となるが、当該住宅について大規模の修繕をしようとするときも、法所定の場合には確認が必要となる。","choice_2_legal_basis":"建築基準法6条等、国土交通省2025年4月建築基準法改正解説（当該肢と条文の個別照合は要確認）","choice_2_exam_tip":"「工事が新築か修繕か」だけでなく、建築物がどの区分に該当するかが重要。｜誤り。2025年4月以降、2階建て木造住宅などは、一定の大規模修繕・大規模模様替えでも建築確認の対象です。「新築なら必要、修繕は一律不要」は誤り。\n築確認を要する場合がある。新築は必要だが大規模修繕は必ず不要という断定が誤り。主要構造部の過半を修繕するか等、工事規模も確認する。\n築確認を要する場合がある。新築は必要だが大規模修繕は必ず不要という断定が誤り。主要構造部の過半を修繕するか等、工事規模も確認する。\nひっかけ箇所：[[WARN:当該住宅の大規模の修繕をしようとする場合]]。正しい内容：==大規模の修繕をしようとするときも、法所定の場合には確認が必要となる。==。","choice_3_truth":"true","choice_3_is_exam_answer":"false","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい。延べ面積1,000㎡超の木造建築物の延焼のおそれのある外壁・軒裏には、防火構造の規制があります。\n【本肢の根拠・注意点】延べ面積が1000㎡を超える木造建築物は延焼防止の観点から外壁・軒裏のうち延焼のおそれのある部分に防火構造が要求される。主要構造部全体を耐火構造にしなければならないという規定とは区別する。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"建築基準法6条等、国土交通省2025年4月建築基準法改正解説（当該肢と条文の個別照合は要確認）","choice_3_exam_tip":"「工事が新築か修繕か」だけでなく、建築物がどの区分に該当するかが重要。｜正しい。延べ面積1,000㎡超の木造建築物の延焼のおそれのある外壁・軒裏には、防火構造の規制があります。\n外壁・軒裏のうち延焼のおそれのある部分に防火構造が要求される。主要構造部全体を耐火構造にしなければならないという規定とは区別する。\n外壁・軒裏のうち延焼のおそれのある部分に防火構造が要求される。主要構造部全体を耐火構造にしなければならないという規定とは区別する。","choice_4_truth":"true","choice_4_is_exam_answer":"false","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。階段のうち高さ1m以下の部分は、手すりの設置義務の例外とされています。\n【本肢の根拠・注意点】階段の手すり義務には高さ1m以下の階段等の例外が設けられている。すべての階段へ例外なく手すりが必要という覚え方では誤る。落下防止の趣旨と法令上の具体的例外を合わせて理解する。\n【追加確認】階段であっても高さが1メートル以下なら法定の手すり規定の例外となる。高低差の数値を他の転落防止措置の基準と混同しない。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"建築基準法6条等、国土交通省2025年4月建築基準法改正解説（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"「工事が新築か修繕か」だけでなく、建築物がどの区分に該当するかが重要。｜正しい。階段のうち高さ1m以下の部分は、手すりの設置義務の例外とされています。\n外が設けられている。すべての階段へ例外なく手すりが必要という覚え方では誤る。落下防止の趣旨と法令上の具体的例外を合わせて理解する。\n外が設けられている。すべての階段へ例外なく手すりが必要という覚え方では誤る。落下防止の趣旨と法令上の具体的例外を合わせて理解する。"},{"question_id":"2025-Q18","year":2025,"session":"通常","question_no":18,"major_field":"法令上の制限","section":"建築基準法","unit":"用途制限・容積率等","topic":"用途地域・建築協定・省エネ改修","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"次の記述のうち、建築基準法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","choice_1":"都市再生特別地区内においては、建築物の容積率、建蔽率及び建築面積は当該地区に関する都市計画において定められた内容に適合するものでなければならないが、その高さは法第56 条の高さの制限に関する規定に適合させる必要がある。","choice_2":"2 階建てかつ床面積1,000 m2 の飲食店は、第一種低層住居専用地域、第二種低層住居専用地域、第一種中高層住居専用地域、工業専用地域及び田園住居地域に建築することができない。","choice_3":"特定行政庁による認可を受けて公告された建築協定は、その後、当該協定の土地の所有者等の全員で合意したときに限り、その公告のあった日以後において当該建築協定区域内の土地の所有者等となった者に対しても効力が及ぶこととなる。","choice_4":"建築物のエネルギー消費性能の向上のため必要な外壁等に関する工事を行う場合、公益性が高いことから特定行政庁の許可を受けることなく、法第52 条の規定による容積率の限度を超えることができる。","official_accepted_answers":"2","answer_conclusion":"建築可能な用途地域は建物の《用途・規模》で判定。床面積1000㎡の飲食店が建てられない地域を挙げた肢2が正しい。","answer_reason":"【結論】建築可能な用途地域は建物の《用途・規模》で判定。床面積1000㎡の飲食店が建てられない地域を挙げた肢2が正しい。\n【解き方】用途地域ごとの建築制限は建築基準法別表第二に細かく定められ、同じ店舗でも用途や床面積で可否が変わる。都市計画法が用途地域を指定するのに対し、実際の建築可能用途の判断は建築基準法の規定による。建築協定は区域内の土地所有者等による建築物の基準の合意で、適法に公告された協定の効力はその後の土地取得者にも及ぶ。道路斜線・隣地斜線・北側斜線などは要件と対象地域が違うの","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】用途地域ごとの建築制限は建築基準法別表第二に細かく定められ、同じ店舗でも用途や床面積で可否が変わる。都市計画法が用途地域を指定するのに対し、実際の建築可能用途の判断は建築基準法の規定による。建築協定は区域内の土地所有者等による建築物の基準の合意で、適法に公告された協定の効力はその後の土地取得者にも及ぶ。道路斜線・隣地斜線・北側斜線などは要件と対象地域が違うので、すべての地域で同じ制限があるわけではない。\n【本問への当てはめ】用途地域の問題では、建物の用途（飲食店・劇場・工場等）だけでなく、床面積・階数が許容基準の鍵になります。特例地区や建築協定は通常ルールの上乗せ・緩和があり、特定の条件と許可・公告の有無を確認しましょう。\n【判断順序・類題への対応】用途地域の指定（都市計画法）と建築規制（建築基準法）／建築協定と地区計画／斜線制限の適用地域を分ける。\n【具体的な当てはめ】床面積1000㎡の飲食店を建てる計画では、建物用途を単に「店舗」と分類するだけでなく、用途地域と規模の組合せで判定する。 ","system_purpose":"制度の趣旨：用途地域ごとの建築制限は建築基準法別表第二に細かく定められ、同じ店舗でも用途や床面積で可否が変わる。都市計画法が用途地域を指定するのに対し、実際の建築可能用途の判断は建築基準法の規定による。建築協定は区域内の土地所有者等による建築物の基準の合意で、適法に公告された協定の効力はその後の土地取得者にも及ぶ。道路斜線・隣地斜線・北側斜線などは要件と対象地域が違うので、すべての地域で同","practical_examples":"【具体例】床面積1000㎡の飲食店を建てる計画では、建物用途を単に「店舗」と分類するだけでなく、用途地域と規模の組合せで判定する。","advanced_knowledge":"【周辺・発展】用途地域の問題では、建物の用途（飲食店・劇場・工場等）だけでなく、床面積・階数が許容基準の鍵になります。特例地区や建築協定は通常ルールの上乗せ・緩和があり、特定の条件と許可・公告の有無を確認しましょう。\n[[NOTE:用途地域の指定（都市計画法）と建築規制（建築基準法）／建築協定と地区計画／斜線制限の適用地域を分ける。]]","comparative_explanation":"用途地域の指定（都市計画法）と建築規制（建築基準法）／建築協定と地区計画／斜線制限の適用地域を分ける。","important_points":"==別表第二＝用途別の可否／建築協定は後取得者にも効力／特例は許可条件を確認。==","trick_patterns":"都市再生特別地区と通常の用途地域、許可特例と無条件免除を混同しない。｜本問特有の誤誘導：建築可能な用途地域は建物の《用途・規模》で判定。床面積1000㎡の飲食店が建てられない地域を挙げた肢2が正しい。\n【誤答注意】設問中の [[WARN:特定行政庁の許可を受けることなく]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"別表第二＝用途別の可否／建築協定は後取得者にも効力／特例は許可条件を確認。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 2。\nQ2: 本問の主要な判断要件は何か？ A2: 用途地域の指定（都市計画法）と建築規制（建築基準法）／建築協定と地区計画／斜線制限の適用地域を分ける。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"建築基準法48条・別表第二・69条以下 | 建築基準法48条・52条・56条・69条以下・別表第二 / 都市再生特別措置法 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"別表第二＝用途別の可否／建築協定は後取得者にも効力／特例は許可条件を確認。","marker_red_spans":"特定行政庁の許可を受けることなく","marker_blue_spans":"用途地域の指定（都市計画法）と建築規制（建築基準法）／建築協定と地区計画／斜線制限の適用地域を分ける。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"その高さは法第56 条の高さの制限に関する規定に適合させる必要がある","choice_1_reason":"誤り。都市再生特別地区では、通常の高さ制限の適用関係に特例があります。「必ず建築基準法56条の高さ制限に従う」とはなりません。\n【本肢の根拠・注意点】都市再生特別地区には高度利用のための特例が設けられ、通常の建築基準法の形態規制がそのまま適用されるとは限らない。都市計画で別に定めた内容と建築基準法56条の高さ制限との関係を確認すべきである。","choice_1_corrected_statement":"都市再生特別地区内においては、建築物の容積率、建蔽率及び建築面積は当該地区に関する都市計画において定められた内容に適合するものでなければならないが、都市再生特別地区では高さ制限にも特例があり、建築基準法56条の制限がそのまま適用されるとは限らない。","choice_1_legal_basis":"建築基準法48条・別表第二・69条以下（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"都市再生特別地区と通常の用途地域、許可特例と無条件免除を混同しない。｜誤り。都市再生特別地区では、通常の高さ制限の適用関係に特例があります。「必ず建築基準法56条の高さ制限に従う」とはなりません。\n基準法の形態規制がそのまま適用されるとは限らない。都市計画で別に定めた内容と建築基準法56条の高さ制限との関係を確認すべきである。\n基準法の形態規制がそのまま適用されるとは限らない。都市計画で別に定めた内容と建築基準法56条の高さ制限との関係を確認すべきである。\nひっかけ箇所：[[WARN:その高さは法第56 条の高さの制限に関す]]。正しい内容：==特例があり、建築基準法56条の制限がそのまま適用されるとは限らない。==。","choice_2_truth":"true","choice_2_is_exam_answer":"true","choice_2_wrong_part":"該当なし","choice_2_reason":"正しい。設問の2階建て・1000㎡の飲食店は列挙された用途地域で建築できません。用途ごとの建築制限は建築基準法別表第二を確認します。\n【本肢の根拠・注意点】床面積1000㎡の飲食店は、店舗という大分類だけでなく用途地域の種類と規模の上限により可否が異なる。問題の列挙した第一種・第二種低層住居専用地域等では、この規模の飲食店は建築できないので、肢の比較が正しい。","choice_2_corrected_statement":"原文どおりで正しい","choice_2_legal_basis":"建築基準法48条・別表第二・69条以下（当該肢と条文の個別照合は要確認）","choice_2_exam_tip":"都市再生特別地区と通常の用途地域、許可特例と無条件免除を混同しない。｜正しい。設問の2階建て・1000㎡の飲食店は列挙された用途地域で建築できません。用途ごとの建築制限は建築基準法別表第二を確認します。\n上限により可否が異なる。問題の列挙した第一種・第二種低層住居専用地域等では、この規模の飲食店は建築できないので、肢の比較が正しい。\n上限により可否が異なる。問題の列挙した第一種・第二種低層住居専用地域等では、この規模の飲食店は建築できないので、肢の比較が正しい。","choice_3_truth":"false","choice_3_is_exam_answer":"false","choice_3_wrong_part":"土地の所有者等の全員で合意したときに限り","choice_3_reason":"誤り。公告済み建築協定は一定の後から土地所有者となった者にも効力が及び、加入者全員の追加合意がある場合に限るわけではありません。\n【本肢の根拠・注意点】適法に認可・公告された建築協定は、その後区域内の土地所有者になった者にも効力が及ぶ。後取得者全員が改めて合意した場合にしか効力が及ばないという説明は誤り。区域内での建築基準を維持するための対抗関係を理解する。","choice_3_corrected_statement":"特定行政庁による認可を受けて公告された建築協定は、その後、当該協定のその後の全員による合意の有無にかかわらず、法定の要件を満たす後取得者にも、その公告のあった日以後において当該建築協定区域内の土地の所有者等となった者に対しても効力が及ぶこととなる。","choice_3_legal_basis":"建築基準法48条・別表第二・69条以下（当該肢と条文の個別照合は要確認）","choice_3_exam_tip":"都市再生特別地区と通常の用途地域、許可特例と無条件免除を混同しない。｜誤り。公告済み建築協定は一定の後から土地所有者となった者にも効力が及び、加入者全員の追加合意がある場合に限るわけではありません。\n及ぶ。後取得者全員が改めて合意した場合にしか効力が及ばないという説明は誤り。区域内での建築基準を維持するための対抗関係を理解する。\n及ぶ。後取得者全員が改めて合意した場合にしか効力が及ばないという説明は誤り。区域内での建築基準を維持するための対抗関係を理解する。\nひっかけ箇所：[[WARN:土地の所有者等の全員で合意したときに限り]]。正しい内容：==協定区域内の土地の所有者等となった者に対しても効力が及ぶこととなる。==。","choice_4_truth":"false","choice_4_is_exam_answer":"false","choice_4_wrong_part":"特定行政庁の許可を受けることなく","choice_4_reason":"誤り。省エネ改修のための外壁等工事で容積率の例外を受けるには、法令で定める《特定行政庁の許可》などの条件が必要です。公益性だけで自動的に超過できません。\n【本肢の根拠・注意点】省エネルギー化の外壁改修にも、一定の容積率特例を受けるための手続要件がある。公共性が高いという一般論だけで、行政庁の許可不要で容積率を無制限に超過できるわけではない。","choice_4_corrected_statement":"建築物のエネルギー消費性能の向上のため必要な外壁等に関する工事を行う場合、公益性が高いことから法令所定の要件の下で特定行政庁の許可を受けることにより、法第52 条の規定による容積率の限度を超えることができる。","choice_4_legal_basis":"建築基準法48条・別表第二・69条以下（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"都市再生特別地区と通常の用途地域、許可特例と無条件免除を混同しない。｜誤り。省エネ改修のための外壁等工事で容積率の例外を受けるには、法令で定める《特定行政庁の許可》などの条件が必要です。公益性だけで自動的に超過できません。\n容積率特例を受けるための手続要件がある。公共性が高いという一般論だけで、行政庁の許可不要で容積率を無制限に超過できるわけではない。\n容積率特例を受けるための手続要件がある。公共性が高いという一般論だけで、行政庁の許可不要で容積率を無制限に超過できるわけではない。\nひっかけ箇所：[[WARN:特定行政庁の許可を受けることなく]]。正しい内容：==とにより、法第52 条の規定による容積率の限度を超えることができる。==。"},{"question_id":"2025-Q19","year":2025,"session":"通常","question_no":19,"major_field":"法令上の制限","section":"宅地造成及び特定盛土等規制法","unit":"盛土規制","topic":"許可時の周知・安全維持・勧告・標識","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"宅地造成及び特定盛土等規制法に関する次の記述のうち、誤っているものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市及び中核市にあってはその長をいうものとし、地方自治法に基づく施行時特例市に係る経過措置については考慮しないものとする。","choice_1":"工事主は、特定盛土等規制区域内において行われる特定盛土等又は土石の堆積に関する政令で定める規模の工事の許可の申請をするときは、あらかじめ、主務省令で定めるところにより、特定盛土等又は土石の堆積に関する工事の施行に係る土地の周辺地域の住民に対し、説明会の開催その他の当該特定盛土等又は土石の堆積に関する工事の内容を周知させるため必要な措置を講じなければならない。","choice_2":"宅地造成等工事規制区域内の土地の工事主又は工事施行者は、宅地造成等に伴う災害が生じないよう、その土地を常時安全な状態に維持するように努めなければならない。","choice_3":"都道府県知事は、宅地造成等工事規制区域内の土地について、宅地造成等に伴う災害の防止のために必要があると認める場合においては、その土地の所有者、管理者、占有者、工事主又は工事施行者に対して、擁壁等の設置等の必要な措置をとることを勧告することができる。","choice_4":"宅地造成等工事規制区域内において行われる宅地造成等に関する工事の許可を受けた工事主は、当該許可に係る土地の見やすい場所に、主務省令で定めるところにより、氏名又は名称その他の主務省令で定める事項を記載した標識を掲げなければならない。","official_accepted_answers":"2","answer_conclusion":"盛土規制区域の安全維持を直接求められる主体は《所有者・管理者・占有者》。工事主・施工者を並べた肢2が誤り。","answer_reason":"【結論】盛土規制区域の安全維持を直接求められる主体は《所有者・管理者・占有者》。工事主・施工者を並べた肢2が誤り。\n【解き方】盛土規制法は宅地造成等で発生する土砂災害を防ぐための制度で、区域の種類と主体ごとの義務を区別する。宅地造成等工事規制区域と特定盛土等規制区域では許可・届出対象や面積・規模が異なる。既存の盛土や土石の堆積について安全確保に努める主体は所有者・管理者・占有者であり、工事主・施工者と常に同一ではない。規制に違反する工事に対する勧告・命令等は対象主体と根拠条文を確認","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】盛土規制法は宅地造成等で発生する土砂災害を防ぐための制度で、区域の種類と主体ごとの義務を区別する。宅地造成等工事規制区域と特定盛土等規制区域では許可・届出対象や面積・規模が異なる。既存の盛土や土石の堆積について安全確保に努める主体は所有者・管理者・占有者であり、工事主・施工者と常に同一ではない。規制に違反する工事に対する勧告・命令等は対象主体と根拠条文を確認する。\n【本問への当てはめ】盛土規制法は《許可申請前の周知》《工事時の安全》《工事後の維持》《行政庁の監督》という流れで覚えます。安全維持の努力義務を負う者と、勧告の対象者は一致しない点に着目してください。\n【判断順序・類題への対応】土地の所有者・管理者・占有者の保全義務／工事主の許可申請義務／施工者の工事基準を整理する。\n【具体的な当てはめ】他人所有地で施工会社が盛土をした後、その土地を譲り受けた所有者の安全維持義務を考える場合、工事当時の工事主だけを見ても足りない。 \n【類題での整理】土地の所有者・管理者・占有者の保全義務／工事主の許可申請義務／施工者の工事基準を整理する。\n【参考になる法令・基準】宅地造成及び特定盛土等規制法22条・26条・27条等","system_purpose":"制度の趣旨：盛土規制法は宅地造成等で発生する土砂災害を防ぐための制度で、区域の種類と主体ごとの義務を区別する。宅地造成等工事規制区域と特定盛土等規制区域では許可・届出対象や面積・規模が異なる。既存の盛土や土石の堆積について安全確保に努める主体は所有者・管理者・占有者であり、工事主・施工者と常に同一ではない。規制に違反する工事に対する勧告・命令等は対象主体と根拠条文を確認する。","practical_examples":"【具体例】他人所有地で施工会社が盛土をした後、その土地を譲り受けた所有者の安全維持義務を考える場合、工事当時の工事主だけを見ても足りない。","advanced_knowledge":"【周辺・発展】盛土規制法は《許可申請前の周知》《工事時の安全》《工事後の維持》《行政庁の監督》という流れで覚えます。安全維持の努力義務を負う者と、勧告の対象者は一致しない点に着目してください。\n[[NOTE:土地の所有者・管理者・占有者の保全義務／工事主の許可申請義務／施工者の工事基準を整理する。]]","comparative_explanation":"土地の所有者・管理者・占有者の保全義務／工事主の許可申請義務／施工者の工事基準を整理する。","important_points":"==維持＝所有者・管理者・占有者／勧告対象には工事主等も／許可工事の標識。==","trick_patterns":"似たリストの主体を1語だけ入れ替える問題が頻出。｜本問特有の誤誘導：盛土規制区域の安全維持を直接求められる主体は《所有者・管理者・占有者》。工事主・施工者を並べた肢2が誤り。\n【誤答注意】設問中の [[WARN:土地の工事主又は工事施行者]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"維持＝所有者・管理者・占有者／勧告対象には工事主等も／許可工事の標識。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 2。\nQ2: 本問の主要な判断要件は何か？ A2: 土地の所有者・管理者・占有者の保全義務／工事主の許可申請義務／施工者の工事基準を整理する。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"宅地造成及び特定盛土等規制法22条・26条・27条等 | 宅地造成及び特定盛土等規制法22条・26条・27条・49条等 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"維持＝所有者・管理者・占有者／勧告対象には工事主等も／許可工事の標識。","marker_red_spans":"土地の工事主又は工事施行者","marker_blue_spans":"土地の所有者・管理者・占有者の保全義務／工事主の許可申請義務／施工者の工事基準を整理する。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"false","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。一定規模の特定盛土等の許可申請では、周辺住民に説明会等で工事内容を事前周知する必要があります。\n【本肢の根拠・注意点】許可を要する規模の特定盛土等を計画する工事主は、周辺住民への事前周知措置を行う必要がある。説明会等によって工事内容や土砂災害リスクを伝えることが目的で、許可申請と独立して必要な事前手続として理解する。","choice_1_corrected_statement":"原文どおりで正しい","choice_1_legal_basis":"宅地造成及び特定盛土等規制法22条・26条・27条等（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"似たリストの主体を1語だけ入れ替える問題が頻出。｜正しい。一定規模の特定盛土等の許可申請では、周辺住民に説明会等で工事内容を事前周知する必要があります。\n置を行う必要がある。説明会等によって工事内容や土砂災害リスクを伝えることが目的で、許可申請と独立して必要な事前手続として理解する。\n置を行う必要がある。説明会等によって工事内容や土砂災害リスクを伝えることが目的で、許可申請と独立して必要な事前手続として理解する。","choice_2_truth":"false","choice_2_is_exam_answer":"true","choice_2_wrong_part":"土地の工事主又は工事施行者","choice_2_reason":"誤り（正解肢）。常時安全な状態の維持について努力義務を負うのは土地の《所有者・管理者・占有者》です。工事主・工事施行者と一括りにした記述は誤りです。\n【本肢の根拠・注意点】宅地造成等工事規制区域の土地を常時安全に維持する努力義務は、土地の所有者・管理者・占有者に課される。工事主・工事施行者だけを列挙した本肢は主体を誤っている。工事完了後に土地を取得した者にも安全管理が問題となる。","choice_2_corrected_statement":"宅地造成等工事規制区域内の土地の所有者、管理者又は占有者は、宅地造成等に伴う災害が生じないよう、その土地を常時安全な状態に維持するように努めなければならない。","choice_2_legal_basis":"宅地造成及び特定盛土等規制法22条・26条・27条等（当該肢と条文の個別照合は要確認）","choice_2_exam_tip":"似たリストの主体を1語だけ入れ替える問題が頻出。｜誤り（正解肢）。常時安全な状態の維持について努力義務を負うのは土地の《所有者・管理者・占有者》です。工事主・工事施行者と一括りにした記述は誤りです。\n・占有者に課される。工事主・工事施行者だけを列挙した本肢は主体を誤っている。工事完了後に土地を取得した者にも安全管理が問題となる。\n・占有者に課される。工事主・工事施行者だけを列挙した本肢は主体を誤っている。工事完了後に土地を取得した者にも安全管理が問題となる。\nひっかけ箇所：[[WARN:土地の工事主又は工事施行者]]。正しい内容：==よう、その土地を常時安全な状態に維持するように努めなければならない。==。","choice_3_truth":"true","choice_3_is_exam_answer":"false","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい。知事は災害防止に必要がある場合、所有者・管理者・占有者だけでなく工事主等へも是正措置を勧告できます。\n【本肢の根拠・注意点】勧告の相手方には所有者・管理者・占有者のほか、工事主や施行者が含まれる場合がある。維持義務を負う主体と行政から改善勧告を受け得る主体は完全には一致しないため、制度ごとに条文の対象者を読む。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"宅地造成及び特定盛土等規制法22条・26条・27条等（当該肢と条文の個別照合は要確認）","choice_3_exam_tip":"似たリストの主体を1語だけ入れ替える問題が頻出。｜正しい。知事は災害防止に必要がある場合、所有者・管理者・占有者だけでなく工事主等へも是正措置を勧告できます。\n者が含まれる場合がある。維持義務を負う主体と行政から改善勧告を受け得る主体は完全には一致しないため、制度ごとに条文の対象者を読む。\n者が含まれる場合がある。維持義務を負う主体と行政から改善勧告を受け得る主体は完全には一致しないため、制度ごとに条文の対象者を読む。","choice_4_truth":"true","choice_4_is_exam_answer":"false","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。許可工事については土地の見やすい場所に氏名等を記載した標識を掲示する制度があります。\n【本肢の根拠・注意点】許可を受けた造成工事では、周辺の人が工事の主体や許可内容を確認できるよう標識を掲示することが求められる。責任の所在の明示と災害防止に資する制度で、標識の掲示場所・記載事項は省令基準に従う。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"宅地造成及び特定盛土等規制法22条・26条・27条等（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"似たリストの主体を1語だけ入れ替える問題が頻出。｜正しい。許可工事については土地の見やすい場所に氏名等を記載した標識を掲示する制度があります。\n確認できるよう標識を掲示することが求められる。責任の所在の明示と災害防止に資する制度で、標識の掲示場所・記載事項は省令基準に従う。\n確認できるよう標識を掲示することが求められる。責任の所在の明示と災害防止に資する制度で、標識の掲示場所・記載事項は省令基準に従う。"},{"question_id":"2025-Q20","year":2025,"session":"通常","question_no":20,"major_field":"法令上の制限","section":"土地区画整理法","unit":"換地・仮換地","topic":"換地計画・仮換地・損失補償・登記","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。","choice_1":"個人施行者は、その者以外に換地計画に係る区域内の宅地を所有する者（当該宅地の所有権について施行者に対抗することができない者を除く。）がある場合においては、換地計画について認可を申請しようとするときは、これらの者の同意を得なければならない。","choice_2":"国又は地方公共団体の所有する土地以外であって道路の用に供している土地については、土地区画整理事業の施行により当該道路に代わるべき道路が設置され、その結果、当該道路が廃止される場合等においては、換地計画において、当該土地について換地を定めないことができる。","choice_3":"従前の宅地の所有者及びその宅地について使用収益権を有する者が、仮換地について使用又は収益を開始することができる日を別に定められたため、従前の宅地について使用し、又は収益することができなくなったことにより損失を受けた場合においては、施行者は、その損失を受けた者に対して、通常生ずべき損失を補償しなければならない。","choice_4":"仮換地の指定があった日後、土地区画整理事業の施行による施行地区内の土地及び建物の変動に係る登記がされるまでの間は、登記の申請人が確定日付のある書類によりその指定前に登記原因が生じたことを証明した場合を除き、施行地区内の土地及び建物に関しては他の登記をすることができない。","official_accepted_answers":"4","answer_conclusion":"仮換地指定直後から登記が一律制限されるわけではありません。肢4が誤り。","answer_reason":"【結論】仮換地指定直後から登記が一律制限されるわけではありません。肢4が誤り。\n【解き方】土地区画整理事業では、工事の途中で指定される仮換地と、最終的な換地処分の法的効果を分ける。仮換地の指定を受けても所有権移転登記が直ちに最終確定するわけではなく、指定により従前地と仮換地の使用収益が調整される。使用開始日を別に定めた場合などの損失補償には、通常生ずべき損失の要件がある。登記の制限期間に関する規定は、換地処分の公告と登記手続の段階を基準に理解すべ","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】土地区画整理事業では、工事の途中で指定される仮換地と、最終的な換地処分の法的効果を分ける。仮換地の指定を受けても所有権移転登記が直ちに最終確定するわけではなく、指定により従前地と仮換地の使用収益が調整される。使用開始日を別に定めた場合などの損失補償には、通常生ずべき損失の要件がある。登記の制限期間に関する規定は、換地処分の公告と登記手続の段階を基準に理解すべきで、仮換地指定日から全登記が一律禁止されるのではない。\n【本問への当てはめ】仮換地の指定と換地処分は別段階です。《仮換地＝工事中の仮の使用収益先》《換地処分＝最終的な権利の確定》と理解しましょう。登記制限がどの段階で始まるかを時系列に置くと判断できます。\n【判断順序・類題への対応】仮換地指定＝暫定的な使用収益先／換地処分公告＝最終権利変動／登記制限は換地処分公告に関連する。\n【具体的な当てはめ】道路整備のため工事中の仮換地を指定された所有者が、従前地も仮換地も使用できない期間に生じた通常損失の補償を検討する。 ","system_purpose":"制度の趣旨：土地区画整理事業では、工事の途中で指定される仮換地と、最終的な換地処分の法的効果を分ける。仮換地の指定を受けても所有権移転登記が直ちに最終確定するわけではなく、指定により従前地と仮換地の使用収益が調整される。使用開始日を別に定めた場合などの損失補償には、通常生ずべき損失の要件がある。登記の制限期間に関する規定は、換地処分の公告と登記手続の段階を基準に理解すべきで、仮換地指定日か","practical_examples":"【具体例】道路整備のため工事中の仮換地を指定された所有者が、従前地も仮換地も使用できない期間に生じた通常損失の補償を検討する。","advanced_knowledge":"【周辺・発展】仮換地の指定と換地処分は別段階です。《仮換地＝工事中の仮の使用収益先》《換地処分＝最終的な権利の確定》と理解しましょう。登記制限がどの段階で始まるかを時系列に置くと判断できます。\n[[NOTE:仮換地指定＝暫定的な使用収益先／換地処分公告＝最終権利変動／登記制限は換地処分公告に関連する。]]","comparative_explanation":"仮換地指定＝暫定的な使用収益先／換地処分公告＝最終権利変動／登記制限は換地処分公告に関連する。","important_points":"==仮換地指定と換地処分公告の翌日を区別／通常損失は補償対象。==","trick_patterns":"「仮」の指定と「最終」換地の効力発生時期を混同しない。｜本問特有の誤誘導：仮換地指定直後から登記が一律制限されるわけではありません。肢4が誤り。\n【誤答注意】設問中の [[WARN:仮換地の指定があった日後]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"仮換地指定と換地処分公告の翌日を区別／通常損失は補償対象。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 4。\nQ2: 本問の主要な判断要件は何か？ A2: 仮換地指定＝暫定的な使用収益先／換地処分公告＝最終権利変動／登記制限は換地処分公告に関連する。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"土地区画整理法86条・98条・99条・101条・107条 | 土地区画整理法86条・99条・101条・107条 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"仮換地指定と換地処分公告の翌日を区別／通常損失は補償対象。","marker_red_spans":"仮換地の指定があった日後","marker_blue_spans":"仮換地指定＝暫定的な使用収益先／換地処分公告＝最終権利変動／登記制限は換地処分公告に関連する。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"false","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。個人施行者は一定の場合、換地計画の認可申請について影響を受ける土地所有者の同意を要します。\n【本肢の根拠・注意点】換地計画の認可申請に際しては個人施行者以外の権利者保護が必要で、法定の土地所有者の同意を要する。単に工事主体が個人であるから他者の権利を無視して換地の配分を決められるわけではない。","choice_1_corrected_statement":"原文どおりで正しい","choice_1_legal_basis":"土地区画整理法86条・98条・99条・101条・107条（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"「仮」の指定と「最終」換地の効力発生時期を混同しない。｜正しい。個人施行者は一定の場合、換地計画の認可申請について影響を受ける土地所有者の同意を要します。\n保護が必要で、法定の土地所有者の同意を要する。単に工事主体が個人であるから他者の権利を無視して換地の配分を決められるわけではない。\n保護が必要で、法定の土地所有者の同意を要する。単に工事主体が個人であるから他者の権利を無視して換地の配分を決められるわけではない。","choice_2_truth":"true","choice_2_is_exam_answer":"false","choice_2_wrong_part":"該当なし","choice_2_reason":"正しい。道路の付替え等で従前の道路が廃止される場合、要件を満たせば換地を定めない扱いが可能です。\n【本肢の根拠・注意点】事業によって新たな道路が整備され従来の道路が廃止される場合、所定の条件下で従前道路敷に換地を定めない計画が許される。換地がすべての従前地に必ず与えられるという原則の例外である。\n【追加確認】元の公共利用の廃止と代わる道路の設置が具体的に想定される場合の例外であり、私人の宅地全般について換地不要とする趣旨ではない。","choice_2_corrected_statement":"原文どおりで正しい","choice_2_legal_basis":"土地区画整理法86条・98条・99条・101条・107条（当該肢と条文の個別照合は要確認）","choice_2_exam_tip":"「仮」の指定と「最終」換地の効力発生時期を混同しない。｜正しい。道路の付替え等で従前の道路が廃止される場合、要件を満たせば換地を定めない扱いが可能です。\n止される場合、所定の条件下で従前道路敷に換地を定めない計画が許される。換地がすべての従前地に必ず与えられるという原則の例外である。\n止される場合、所定の条件下で従前道路敷に換地を定めない計画が許される。換地がすべての従前地に必ず与えられるという原則の例外である。","choice_3_truth":"true","choice_3_is_exam_answer":"false","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい。仮換地に使用収益開始日の定めがあり従前地も使えず、通常生じる損失があれば施行者に補償義務が生じます。\n【本肢の根拠・注意点】仮換地の使用開始日が後日に設定され、元の土地も使えなくなった人が損失を被るときは、通常生ずべき損失の補償が問題となる。仮換地を指定したから使用できない期間の損失を一律に我慢させる制度ではない。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"土地区画整理法86条・98条・99条・101条・107条（当該肢と条文の個別照合は要確認）","choice_3_exam_tip":"「仮」の指定と「最終」換地の効力発生時期を混同しない。｜正しい。仮換地に使用収益開始日の定めがあり従前地も使えず、通常生じる損失があれば施行者に補償義務が生じます。\nが損失を被るときは、通常生ずべき損失の補償が問題となる。仮換地を指定したから使用できない期間の損失を一律に我慢させる制度ではない。\nが損失を被るときは、通常生ずべき損失の補償が問題となる。仮換地を指定したから使用できない期間の損失を一律に我慢させる制度ではない。","choice_4_truth":"false","choice_4_is_exam_answer":"true","choice_4_wrong_part":"仮換地の指定があった日後","choice_4_reason":"誤り（正解肢）。登記の制限期間を《仮換地の指定日後》からとした点が違います。原則として《換地処分の公告があった日の翌日》以降、土地の変動の登記がされるまでの特則です。\n【本肢の根拠・注意点】登記制限の基準時を仮換地の指定日とするのは誤りで、原則として換地処分公告後の権利変動登記に関する特例として理解する。暫定的な使用収益の指定と最終的な換地処分は時系列上別の手続である。","choice_4_corrected_statement":"換地処分の公告があった日の翌日以後、土地区画整理事業の施行による施行地区内の土地及び建物の変動に係る登記がされるまでの間は、登記の申請人が確定日付のある書類によりその指定前に登記原因が生じたことを証明した場合を除き、施行地区内の土地及び建物に関しては他の登記をすることができない。","choice_4_legal_basis":"土地区画整理法86条・98条・99条・101条・107条（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"「仮」の指定と「最終」換地の効力発生時期を混同しない。｜誤り（正解肢）。登記の制限期間を《仮換地の指定日後》からとした点が違います。原則として《換地処分の公告があった日の翌日》以降、土地の変動の登記がされるまでの特則です。\n則として換地処分公告後の権利変動登記に関する特例として理解する。暫定的な使用収益の指定と最終的な換地処分は時系列上別の手続である。\n則として換地処分公告後の権利変動登記に関する特例として理解する。暫定的な使用収益の指定と最終的な換地処分は時系列上別の手続である。\nひっかけ箇所：[[WARN:仮換地の指定があった日後]]。正しい内容：==き、施行地区内の土地及び建物に関しては他の登記をすることができない。==。"},{"question_id":"2025-Q21","year":2025,"session":"通常","question_no":21,"major_field":"法令上の制限","section":"農地法","unit":"農地の転用","topic":"転用許可・賃借権の対抗要件・罰則","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"農地に関する次の記述のうち、農地法（以下この問において「法」という。）の規定によれば、誤っているものはどれか。","choice_1":"市街化区域外にある農地の転用の申請に係る事業が住宅の用に供される土地の造成だけを目的としている場合、申請に係る農地の全てを住宅の用に供することが確実と認められないときには、法第4 条第1 項又は法第5 条第1 項の許可を受けることができない。","choice_2":"仮設工作物を設置するため、市街化区域外にある農地の所有権を取得しようとする場合には、法第5 条第1 項の許可を受けることができない。","choice_3":"農地の賃貸借は、その登記がなくても、農地の引渡しがあったときは、これをもってその後その農地について所有権を取得した第三者に対抗することができる。","choice_4":"法人の代表者が、その法人の業務に関し、法第4 条第1 項又は法第5 条第1 項の規定に違反して農地の転用をした場合には、その代表者が罰せられるほか、その法人も300 万円以下の罰金刑が科せられる。","official_accepted_answers":"4","answer_conclusion":"農地転用の法人処罰は《300万円》とは限らず、違反に対する法人の重い罰金規定があるため肢4が誤り。","answer_reason":"【結論】農地転用の法人処罰は《300万円》とは限らず、違反に対する法人の重い罰金規定があるため肢4が誤り。\n【解き方】農地法は耕作目的の権利移動、農地の転用、転用目的の権利移動をそれぞれ別の手続として規律する。3条許可は原則として農地を農地として取得する場合、4条許可は自己所有農地を自分で転用する場合、5条許可は転用を前提として権利移動する場合に中心となる。区域による届出例外や国・地方公共団体に関する扱いも確認が必要。無許可転用に対する罰則は個人と法人で上限額が異なることが","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】農地法は耕作目的の権利移動、農地の転用、転用目的の権利移動をそれぞれ別の手続として規律する。3条許可は原則として農地を農地として取得する場合、4条許可は自己所有農地を自分で転用する場合、5条許可は転用を前提として権利移動する場合に中心となる。区域による届出例外や国・地方公共団体に関する扱いも確認が必要。無許可転用に対する罰則は個人と法人で上限額が異なることがあり、設問で「法人も300万円」と固定した場合に注意する。\n【本問への当てはめ】農地法3条は《農地として権利を動かす》、4条は《自分の農地を転用》、5条は《転用のため権利を動かす》、と機能で整理します。許可が必要かだけでなく、許可できない事例・対抗要件・罰則も出題されます。\n【判断順序・類題への対応】3条＝耕作目的の権利移動／4条＝自分で転用／5条＝転用目的の権利移動。個人と法人の罰金額は同一とは限らない。\n【具体的な当てはめ】農地を駐車場に変える所有者と、その土地を買って駐車場に変える不動産会社では、4条と5条の別を検討する。 ","system_purpose":"制度の趣旨：農地法は耕作目的の権利移動、農地の転用、転用目的の権利移動をそれぞれ別の手続として規律する。3条許可は原則として農地を農地として取得する場合、4条許可は自己所有農地を自分で転用する場合、5条許可は転用を前提として権利移動する場合に中心となる。区域による届出例外や国・地方公共団体に関する扱いも確認が必要。無許可転用に対する罰則は個人と法人で上限額が異なることがあり、設問で「法人も","practical_examples":"【具体例】農地を駐車場に変える所有者と、その土地を買って駐車場に変える不動産会社では、4条と5条の別を検討する。","advanced_knowledge":"【周辺・発展】農地法3条は《農地として権利を動かす》、4条は《自分の農地を転用》、5条は《転用のため権利を動かす》、と機能で整理します。許可が必要かだけでなく、許可できない事例・対抗要件・罰則も出題されます。\n[[NOTE:3条＝耕作目的の権利移動／4条＝自分で転用／5条＝転用目的の権利移動。個人と法人の罰金額は同一とは限らない。]]","comparative_explanation":"3条＝耕作目的の権利移動／4条＝自分で転用／5条＝転用目的の権利移動。個人と法人の罰金額は同一とは限らない。","important_points":"==3条＝権利移動／4条＝自己転用／5条＝転用目的の権利移動／賃借の対抗は引渡し。==","trick_patterns":"個人と法人の罰金上限、法定の許可対象と許可できる条件を区別。｜本問特有の誤誘導：農地転用の法人処罰は《300万円》とは限らず、違反に対する法人の重い罰金規定があるため肢4が誤り。\n【誤答注意】設問中の [[WARN:300 万円以下の罰金刑]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"3条＝権利移動／4条＝自己転用／5条＝転用目的の権利移動／賃借の対抗は引渡し。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 4。\nQ2: 本問の主要な判断要件は何か？ A2: 3条＝耕作目的の権利移動／4条＝自分で転用／5条＝転用目的の権利移動。個人と法人の罰金額は同一とは限らない。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"農地法3条・4条・5条・67条等 | 農地法3条・4条・5条・16条・67条等 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"3条＝権利移動／4条＝自己転用／5条＝転用目的の権利移動／賃借の対抗は引渡し。","marker_red_spans":"300 万円以下の罰金刑","marker_blue_spans":"3条＝耕作目的の権利移動／4条＝自分で転用／5条＝転用目的の権利移動。個人と法人の罰金額は同一とは限らない。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"false","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。住宅地造成だけが目的の転用で、農地が確実に住宅の用に供される見込みがない場合には許可基準に適合しません。\n【本肢の根拠・注意点】農地転用許可では利用目的の実現可能性が審査され、住宅用地を造成すると称しても申請農地全部を住宅用に使う見込みがなければ許可されない場合がある。3条・4条・5条という手続区分だけでなく、実現可能性の許可基準も押さえる。","choice_1_corrected_statement":"原文どおりで正しい","choice_1_legal_basis":"農地法3条・4条・5条・67条等（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"個人と法人の罰金上限、法定の許可対象と許可できる条件を区別。｜正しい。住宅地造成だけが目的の転用で、農地が確実に住宅の用に供される見込みがない場合には許可基準に適合しません。\n部を住宅用に使う見込みがなければ許可されない場合がある。3条・4条・5条という手続区分だけでなく、実現可能性の許可基準も押さえる。\n部を住宅用に使う見込みがなければ許可されない場合がある。3条・4条・5条という手続区分だけでなく、実現可能性の許可基準も押さえる。","choice_2_truth":"true","choice_2_is_exam_answer":"false","choice_2_wrong_part":"該当なし","choice_2_reason":"正しい。仮設工作物のための一時的転用で、所有権を取得するという形態は転用の一時性と整合しないため、この設問条件では許可が認められません。\n【本肢の根拠・注意点】仮設工作物の設置目的であっても農地の所有権を移転して転用する許可が常に認められるわけではない。期間限定利用を理由に転用目的の権利取得を当然に認めると誤る。賃借と所有権取得も区別する。","choice_2_corrected_statement":"原文どおりで正しい","choice_2_legal_basis":"農地法3条・4条・5条・67条等（当該肢と条文の個別照合は要確認）","choice_2_exam_tip":"個人と法人の罰金上限、法定の許可対象と許可できる条件を区別。｜正しい。仮設工作物のための一時的転用で、所有権を取得するという形態は転用の一時性と整合しないため、この設問条件では許可が認められません。\n転用する許可が常に認められるわけではない。期間限定利用を理由に転用目的の権利取得を当然に認めると誤る。賃借と所有権取得も区別する。\n転用する許可が常に認められるわけではない。期間限定利用を理由に転用目的の権利取得を当然に認めると誤る。賃借と所有権取得も区別する。","choice_3_truth":"true","choice_3_is_exam_answer":"false","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい。農地の賃借権は《引渡し》があれば登記なく第三者に対抗できる特則があります。一般の賃貸借の登記要件と区別。\n【本肢の根拠・注意点】農地の賃借権は農地法の対抗規定により、賃借権登記がなくても農地の引渡しで第三取得者へ対抗できる場合がある。通常の不動産賃貸借の登記を唯一の対抗要件と考えない。\n【追加確認】農地法の引渡しによる対抗は賃借人保護の特則であり、単に賃貸借契約書を作成しただけでは引渡しによる対抗要件を具備したとはいえない。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"農地法3条・4条・5条・67条等（当該肢と条文の個別照合は要確認）","choice_3_exam_tip":"個人と法人の罰金上限、法定の許可対象と許可できる条件を区別。｜正しい。農地の賃借権は《引渡し》があれば登記なく第三者に対抗できる特則があります。一般の賃貸借の登記要件と区別。\n定により、賃借権登記がなくても農地の引渡しで第三取得者へ対抗できる場合がある。通常の不動産賃貸借の登記を唯一の対抗要件と考えない。\n定により、賃借権登記がなくても農地の引渡しで第三取得者へ対抗できる場合がある。通常の不動産賃貸借の登記を唯一の対抗要件と考えない。","choice_4_truth":"false","choice_4_is_exam_answer":"true","choice_4_wrong_part":"300 万円以下の罰金刑","choice_4_reason":"誤り（正解肢）。法人の業務として無許可転用を行った場合には両罰規定があり、法人への罰金は《1億円以下》となる場合があります。「300万円以下」は不正確です。\n【本肢の根拠・注意点】農地法に違反した転用の罰則では行為者本人への罰則だけでなく法人への両罰規定を確認する。法人罰金の上限は本肢の300万円にとどまらないので、個人と法人で金額を同一視するひっかけに注意する。","choice_4_corrected_statement":"法人の代表者が、その法人の業務に関し、法第4 条第1 項又は法第5 条第1 項の規定に違反して農地の転用をした場合には、その代表者が罰せられるほか、その法人も法定の両罰規定により1億円以下の罰金刑が科せられる。","choice_4_legal_basis":"農地法3条・4条・5条・67条等（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"個人と法人の罰金上限、法定の許可対象と許可できる条件を区別。｜誤り（正解肢）。法人の業務として無許可転用を行った場合には両罰規定があり、法人への罰金は《1億円以下》となる場合があります。「300万円以下」は不正確です。\nく法人への両罰規定を確認する。法人罰金の上限は本肢の300万円にとどまらないので、個人と法人で金額を同一視するひっかけに注意する。\nく法人への両罰規定を確認する。法人罰金の上限は本肢の300万円にとどまらないので、個人と法人で金額を同一視するひっかけに注意する。\nひっかけ箇所：[[WARN:300 万円以下の罰金刑]]。正しい内容：==ほか、その法人も法定の両罰規定により1億円以下の罰金刑が科せられる。==。"},{"question_id":"2025-Q22","year":2025,"session":"通常","question_no":22,"major_field":"法令上の制限","section":"国土利用計画法","unit":"土地取引の届出","topic":"事後届出・面積基準・届出対象取引","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"国土利用計画法第23 条の届出（以下この問において「事後届出」という。）に関する次の記述のうち、正しいものはどれか。","choice_1":"市街化区域内においてＡが所有する面積3,500 m2 の土地について、Ｂが2,000 m2、Ｃが1,500 m2 とそれぞれ分割して購入した場合、Ｂ及びＣはともに事後届出を行わなければならない。","choice_2":"都市計画区域外においてＤが所有する面積12,000 m2 の土地について、Ｅが担保権の実行による競売を通じて所有権を取得した場合、Ｅは事後届出を行わなければならない。","choice_3":"Ｆが、自ら所有する市街化調整区域内の7,000 m2 の土地について、宅地建物取引業者Ｇと売買契約を締結した場合には、Ｇは契約を締結した日から1 か月以内に事後届出を行う必要がある。","choice_4":"市街化区域内に所在する一団の土地である甲土地（面積1,200 m2）と乙土地（面積1,300 m2）について、甲土地については売買によって所有権を取得し、乙土地については対価の授受を伴わず賃借権の設定を受けたＨは、事後届出を行う必要はない。","official_accepted_answers":"4","answer_conclusion":"事後届出の面積判定は《有償の権利移転》を基準に考えます。無償賃借権を合算しない肢4が正しい。","answer_reason":"【結論】事後届出の面積判定は《有償の権利移転》を基準に考えます。無償賃借権を合算しない肢4が正しい。\n【解き方】国土利用計画法の土地売買等の事後届出は一定規模以上の土地取引を把握する制度で、土地の利用目的などを審査する。区域別の面積基準は市街化区域2000㎡、その他の都市計画区域5000㎡、都市計画区域外10000㎡という代表値を押さえる。ただし判断対象となる権利は有償の権利移転等であり、無償の賃借権設定を面積に合算できると短絡しない。複数筆の一団の土地、契約の日から","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】国土利用計画法の土地売買等の事後届出は一定規模以上の土地取引を把握する制度で、土地の利用目的などを審査する。区域別の面積基準は市街化区域2000㎡、その他の都市計画区域5000㎡、都市計画区域外10000㎡という代表値を押さえる。ただし判断対象となる権利は有償の権利移転等であり、無償の賃借権設定を面積に合算できると短絡しない。複数筆の一団の土地、契約の日から2週間以内という期限、売主ではなく原則権利取得者が届け出る点も確認する。\n【本問への当てはめ】面積基準は《市街化区域2000㎡》《その他の都市計画区域5000㎡》《都市計画区域外1万㎡》。一団の土地では取得計画全体の面積を見るものの、届出対象となる取引の性質も重要です。誰がいつ届け出るか＝《権利取得者が契約から2週間以内》。\n【判断順序・類題への対応】面積2000/5000/10000㎡／契約日から2週間／取得者が届出／有償取引かを先に確かめる。\n【具体的な当てはめ】市街化区域の隣接する土地を買い集める場合、契約ごとの面積だけでなく一団の土地として届出要否を確認する。 ","system_purpose":"制度の趣旨：国土利用計画法の土地売買等の事後届出は一定規模以上の土地取引を把握する制度で、土地の利用目的などを審査する。区域別の面積基準は市街化区域2000㎡、その他の都市計画区域5000㎡、都市計画区域外10000㎡という代表値を押さえる。ただし判断対象となる権利は有償の権利移転等であり、無償の賃借権設定を面積に合算できると短絡しない。複数筆の一団の土地、契約の日から2週間以内という期限","practical_examples":"【具体例】市街化区域の隣接する土地を買い集める場合、契約ごとの面積だけでなく一団の土地として届出要否を確認する。","advanced_knowledge":"【周辺・発展】面積基準は《市街化区域2000㎡》《その他の都市計画区域5000㎡》《都市計画区域外1万㎡》。一団の土地では取得計画全体の面積を見るものの、届出対象となる取引の性質も重要です。誰がいつ届け出るか＝《権利取得者が契約から2週間以内》。\n[[NOTE:面積2000/5000/10000㎡／契約日から2週間／取得者が届出／有償取引かを先に確かめる。]]","comparative_explanation":"面積2000/5000/10000㎡／契約日から2週間／取得者が届出／有償取引かを先に確かめる。","important_points":"==2千・5千・1万㎡／2週間以内／取得者が届出／競売・無償権利設定は別扱い。==","trick_patterns":"一団の土地だからどんな権利の設定でも無条件に合算する、とは限りません。｜本問特有の誤誘導：事後届出の面積判定は《有償の権利移転》を基準に考えます。無償賃借権を合算しない肢4が正しい。\n【誤答注意】設問中の [[WARN:Ｅは事後届出を行わなければならない]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"2千・5千・1万㎡／2週間以内／取得者が届出／競売・無償権利設定は別扱い。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 4。\nQ2: 本問の主要な判断要件は何か？ A2: 面積2000/5000/10000㎡／契約日から2週間／取得者が届出／有償取引かを先に確かめる。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"国土利用計画法23条、国土利用計画法施行令 | 国土利用計画法23条 / 国土利用計画法施行令 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"2千・5千・1万㎡／2週間以内／取得者が届出／競売・無償権利設定は別扱い。","marker_red_spans":"Ｅは事後届出を行わなければならない","marker_blue_spans":"面積2000/5000/10000㎡／契約日から2週間／取得者が届出／有償取引かを先に確かめる。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"Ｂ及びＣはともに事後届出を行わなければならない","choice_1_reason":"誤り。市街化区域の基準は《2,000㎡以上》。Bの2000㎡は対象でもCの1500㎡は対象外で、双方届出とはいえません。\n【本肢の根拠・注意点】一団の土地の面積判断は買主ごとの取得面積や取得目的に即して行う。Bは2000㎡で基準に達するが、Cの1500㎡を売主Aの元の3500㎡と単純合算して全員へ届出義務を課すわけではない。買主別の面積要件を確認する。","choice_1_corrected_statement":"市街化区域内においてＡが所有する面積3,500 m2 の土地について、Ｂが2,000 m2、Ｃが1,500 m2 とそれぞれ分割して購入した場合、Ｂは面積要件を満たすため原則として届出が必要だが、Ｃはこの面積では届出義務を負わない。","choice_1_legal_basis":"国土利用計画法23条、国土利用計画法施行令（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"一団の土地だからどんな権利の設定でも無条件に合算する、とは限りません。｜誤り。市街化区域の基準は《2,000㎡以上》。Bの2000㎡は対象でもCの1500㎡は対象外で、双方届出とはいえません。\n基準に達するが、Cの1500㎡を売主Aの元の3500㎡と単純合算して全員へ届出義務を課すわけではない。買主別の面積要件を確認する。\n基準に達するが、Cの1500㎡を売主Aの元の3500㎡と単純合算して全員へ届出義務を課すわけではない。買主別の面積要件を確認する。\nひっかけ箇所：[[WARN:Ｂ及びＣはともに事後届出を行わなければな]]。正しい内容：==すため原則として届出が必要だが、Ｃはこの面積では届出義務を負わない。==。","choice_2_truth":"false","choice_2_is_exam_answer":"false","choice_2_wrong_part":"Ｅは事後届出を行わなければならない","choice_2_reason":"誤り。競売による取得は国土利用計画法の事後届出が不要とされる取引です。面積が大きいだけで届出義務が生じるわけではありません。\n【本肢の根拠・注意点】国土利用計画法の事後届出は一定の売買等による取得が対象で、担保権実行の競売による所有権取得は一般の売買契約と同じ届出を要求する扱いではない。取得面積だけでなく取得原因を先に確認する。","choice_2_corrected_statement":"都市計画区域外においてＤが所有する面積12,000 m2 の土地について、Ｅが担保権の実行による競売を通じて所有権を取得した場合、競売による取得であるため、Ｅはこの事後届出をする必要がない。","choice_2_legal_basis":"国土利用計画法23条、国土利用計画法施行令（当該肢と条文の個別照合は要確認）","choice_2_exam_tip":"一団の土地だからどんな権利の設定でも無条件に合算する、とは限りません。｜誤り。競売による取得は国土利用計画法の事後届出が不要とされる取引です。面積が大きいだけで届出義務が生じるわけではありません。\n象で、担保権実行の競売による所有権取得は一般の売買契約と同じ届出を要求する扱いではない。取得面積だけでなく取得原因を先に確認する。\n象で、担保権実行の競売による所有権取得は一般の売買契約と同じ届出を要求する扱いではない。取得面積だけでなく取得原因を先に確認する。\nひっかけ箇所：[[WARN:Ｅは事後届出を行わなければならない]]。正しい内容：==た場合、競売による取得であるため、Ｅはこの事後届出をする必要がない。==。","choice_3_truth":"false","choice_3_is_exam_answer":"false","choice_3_wrong_part":"1 か月以内","choice_3_reason":"誤り。市街化調整区域の基準は《5,000㎡以上》で7000㎡は対象ですが、契約後の届出期限は《2週間以内》。1か月ではありません。\n【本肢の根拠・注意点】市街化調整区域内では原則5000㎡を基準とするが、届出が必要でも期限は契約締結から2週間以内である。本肢の1か月以内という部分が誤り。土地の取得者Gが届け出る点は正しい方向である。","choice_3_corrected_statement":"Ｆが、自ら所有する市街化調整区域内の7,000 m2 の土地について、宅地建物取引業者Ｇと売買契約を締結した場合には、Ｇは契約を締結した日から2週間以内に事後届出を行う必要がある。","choice_3_legal_basis":"国土利用計画法23条、国土利用計画法施行令（当該肢と条文の個別照合は要確認）","choice_3_exam_tip":"一団の土地だからどんな権利の設定でも無条件に合算する、とは限りません。｜誤り。市街化調整区域の基準は《5,000㎡以上》で7000㎡は対象ですが、契約後の届出期限は《2週間以内》。1か月ではありません。\n届出が必要でも期限は契約締結から2週間以内である。本肢の1か月以内という部分が誤り。土地の取得者Gが届け出る点は正しい方向である。\n届出が必要でも期限は契約締結から2週間以内である。本肢の1か月以内という部分が誤り。土地の取得者Gが届け出る点は正しい方向である。\nひっかけ箇所：[[WARN:1 か月以内]]。正しい内容：==には、Ｇは契約を締結した日から2週間以内に事後届出を行う必要がある。==。","choice_4_truth":"true","choice_4_is_exam_answer":"true","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。有償の売買取得分は1200㎡で2000㎡未満。乙土地の無償の賃借権設定は届出対象取引に含めず、合算して届出義務ありとはなりません。\n【本肢の根拠・注意点】甲土地1200㎡と乙土地1300㎡の一団の土地でも、乙土地の無償賃借権の設定は有償取引に該当せず届出判定で合算しない。売買に係る1200㎡のみでは市街化区域2000㎡の基準に達しない。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"国土利用計画法23条、国土利用計画法施行令（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"一団の土地だからどんな権利の設定でも無条件に合算する、とは限りません。｜正しい。有償の売買取得分は1200㎡で2000㎡未満。乙土地の無償の賃借権設定は届出対象取引に含めず、合算して届出義務ありとはなりません。\n土地の無償賃借権の設定は有償取引に該当せず届出判定で合算しない。売買に係る1200㎡のみでは市街化区域2000㎡の基準に達しない。\n土地の無償賃借権の設定は有償取引に該当せず届出判定で合算しない。売買に係る1200㎡のみでは市街化区域2000㎡の基準に達しない。"},{"question_id":"2025-Q23","year":2025,"session":"通常","question_no":23,"major_field":"税・その他","section":"登録免許税","unit":"登録免許税の軽減","topic":"土地売買の所有権移転登記の軽減","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"土地の売買による所有権の移転登記等に係る登録免許税の税率の軽減措置に関する次の記述のうち、正しいものはどれか。","choice_1":"この税率の軽減措置は、地目が雑種地となっている土地の売買による所有権の移転登記についても適用される。","choice_2":"この税率の軽減措置の適用対象となる土地は、その価額が1,000 万円未満のものに限られる。","choice_3":"この税率の軽減措置は、法人が土地の売買による所有権の移転登記を受ける場合には適用されない。","choice_4":"この税率の軽減措置の適用対象となる土地は、その面積が1,000 m2 未満のものに限られる。","official_accepted_answers":"1","answer_conclusion":"土地売買による登録免許税の軽減は《雑種地》でも対象になり、肢1が正しい。","answer_reason":"【結論】土地売買による登録免許税の軽減は《雑種地》でも対象になり、肢1が正しい。\n【解き方】登録免許税は登記の種類や原因、課税標準と税率を組み合わせて算出する。土地の売買による所有権移転登記の軽減税率に関する特例では、地目が宅地か雑種地かを機械的な適用除外理由にしないことが重要である。土地の所有権移転登記と住宅用家屋の所有権保存・移転登記では別の特例があり、面積、築年数、自己居住等の要件も混同しやすい。税率特例は適用期限が延長・改正されることがある","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】登録免許税は登記の種類や原因、課税標準と税率を組み合わせて算出する。土地の売買による所有権移転登記の軽減税率に関する特例では、地目が宅地か雑種地かを機械的な適用除外理由にしないことが重要である。土地の所有権移転登記と住宅用家屋の所有権保存・移転登記では別の特例があり、面積、築年数、自己居住等の要件も混同しやすい。税率特例は適用期限が延長・改正されることがあるため、2025年の問題に記載の期間を2026年用の数字として使わず国税庁の当年度資料で確かめる。\n【本問への当てはめ】登録免許税は、登記申請の際に課される税です。税率軽減は《登記の種類》《土地か建物か》《取得原因》を見て判定します。個人か法人か、雑種地か宅地かといった条件を、問題文にないのに付け足さないこと。\n【判断順序・類題への対応】土地売買の所有権移転／住宅用家屋の保存・移転／抵当権設定は特例・税率が別。適用期限は毎年確認。\n【具体的な当てはめ】雑種地と登記された土地の売買で所有権移転登記を申請する場合、土地売買の軽減税率の適用条件を地目だけで否定しない。 ","system_purpose":"制度の趣旨：登録免許税は登記の種類や原因、課税標準と税率を組み合わせて算出する。土地の売買による所有権移転登記の軽減税率に関する特例では、地目が宅地か雑種地かを機械的な適用除外理由にしないことが重要である。土地の所有権移転登記と住宅用家屋の所有権保存・移転登記では別の特例があり、面積、築年数、自己居住等の要件も混同しやすい。税率特例は適用期限が延長・改正されることがあるため、2025年の問","practical_examples":"【具体例】雑種地と登記された土地の売買で所有権移転登記を申請する場合、土地売買の軽減税率の適用条件を地目だけで否定しない。","advanced_knowledge":"【周辺・発展】登録免許税は、登記申請の際に課される税です。税率軽減は《登記の種類》《土地か建物か》《取得原因》を見て判定します。個人か法人か、雑種地か宅地かといった条件を、問題文にないのに付け足さないこと。\n[[NOTE:土地売買の所有権移転／住宅用家屋の保存・移転／抵当権設定は特例・税率が別。適用期限は毎年確認。]]","comparative_explanation":"土地売買の所有権移転／住宅用家屋の保存・移転／抵当権設定は特例・税率が別。適用期限は毎年確認。","important_points":"==土地売買の所有権移転登記／地目・面積・価格を一律の除外条件にしない。==","trick_patterns":"軽減措置には適用期限があるため、2025年と2026年の制度の有効期間を必ず分ける。｜本問特有の誤誘導：土地売買による登録免許税の軽減は《雑種地》でも対象になり、肢1が正しい。\n【誤答注意】設問中の [[WARN:価額が1,000 万円未満のものに限られる]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"土地売買の所有権移転登記／地目・面積・価格を一律の除外条件にしない。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 1。\nQ2: 本問の主要な判断要件は何か？ A2: 土地売買の所有権移転／住宅用家屋の保存・移転／抵当権設定は特例・税率が別。適用期限は毎年確認。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"租税特別措置法72条等、国税庁登録免許税資料 | 租税特別措置法72条 / 国税庁・登録免許税の軽減措置 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"土地売買の所有権移転登記／地目・面積・価格を一律の除外条件にしない。","marker_red_spans":"価額が1,000 万円未満のものに限られる","marker_blue_spans":"土地売買の所有権移転／住宅用家屋の保存・移転／抵当権設定は特例・税率が別。適用期限は毎年確認。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"true","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。軽減措置の対象は土地売買による所有権移転登記であり、地目が雑種地でも対象となる場合があります。\n【本肢の根拠・注意点】軽減税率は土地の売買を原因とする所有権移転登記について適用され、対象地の地目が雑種地であることだけでは排除されない。家屋と違って住宅用家屋特例の所有者要件等を持ち込まない。\n【追加確認】土地の所有権移転登記に関する軽減であり、住宅用家屋の保存登記などに課される居住・床面積要件と区別する必要がある。","choice_1_corrected_statement":"原文どおりで正しい","choice_1_legal_basis":"租税特別措置法72条等、国税庁登録免許税資料（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"軽減措置には適用期限があるため、2025年と2026年の制度の有効期間を必ず分ける。｜正しい。軽減措置の対象は土地売買による所有権移転登記であり、地目が雑種地でも対象となる場合があります。\n登記について適用され、対象地の地目が雑種地であることだけでは排除されない。家屋と違って住宅用家屋特例の所有者要件等を持ち込まない。\n登記について適用され、対象地の地目が雑種地であることだけでは排除されない。家屋と違って住宅用家屋特例の所有者要件等を持ち込まない。","choice_2_truth":"false","choice_2_is_exam_answer":"false","choice_2_wrong_part":"価額が1,000 万円未満のものに限られる","choice_2_reason":"誤り。軽減対象を《価額1000万円未満》に限定する条件はありません。\n【本肢の根拠・注意点】土地の売買の所有権移転登記の税率軽減に、価格1000万円未満という一般的な上限要件はない。取引価格が高いから当然に特例を受けられない、とする数字のひっかけに注意する。\n【追加確認】価額1000万円という境界はこの特例の適用条件ではない。税額算定の基礎となる不動産の価額と、特例を受ける条件は別々に検討する。","choice_2_corrected_statement":"この税率の軽減措置の適用対象となる土地は、その価額が1,000万円未満という一律の条件はない。","choice_2_legal_basis":"租税特別措置法72条等、国税庁登録免許税資料（当該肢と条文の個別照合は要確認）","choice_2_exam_tip":"軽減措置には適用期限があるため、2025年と2026年の制度の有効期間を必ず分ける。｜誤り。軽減対象を《価額1000万円未満》に限定する条件はありません。\nに、価格1000万円未満という一般的な上限要件はない。取引価格が高いから当然に特例を受けられない、とする数字のひっかけに注意する。\nに、価格1000万円未満という一般的な上限要件はない。取引価格が高いから当然に特例を受けられない、とする数字のひっかけに注意する。\nひっかけ箇所：[[WARN:価額が1,000 万円未満のものに限られ]]。正しい内容：==象となる土地は、その価額が1,000万円未満という一律の条件はない。==。","choice_3_truth":"false","choice_3_is_exam_answer":"false","choice_3_wrong_part":"法人が土地の売買による所有権の移転登記を受ける場合には適用されない","choice_3_reason":"誤り。土地の売買登記であれば《法人》が取得する場合も対象になり得ます。\n【本肢の根拠・注意点】この土地売買の登録免許税特例は、買主が法人という属性だけで除外されるわけではない。住宅用家屋で個人居住を要件にする別の優遇措置と取り違えない。\n【追加確認】法人であっても土地の売買に基づく所有権移転登記という行為は同じであり、買主の属性のみで一律に除外される制度ではない。","choice_3_corrected_statement":"この税率の軽減措置は、法人が土地の売買による所有権の移転登記を受ける場合にも、適用要件を満たせば利用できる。","choice_3_legal_basis":"租税特別措置法72条等、国税庁登録免許税資料（当該肢と条文の個別照合は要確認）","choice_3_exam_tip":"軽減措置には適用期限があるため、2025年と2026年の制度の有効期間を必ず分ける。｜誤り。土地の売買登記であれば《法人》が取得する場合も対象になり得ます。\nの登録免許税特例は、買主が法人という属性だけで除外されるわけではない。住宅用家屋で個人居住を要件にする別の優遇措置と取り違えない。\nの登録免許税特例は、買主が法人という属性だけで除外されるわけではない。住宅用家屋で個人居住を要件にする別の優遇措置と取り違えない。\nひっかけ箇所：[[WARN:法人が土地の売買による所有権の移転登記を]]。正しい内容：==よる所有権の移転登記を受ける場合にも、適用要件を満たせば利用できる。==。","choice_4_truth":"false","choice_4_is_exam_answer":"false","choice_4_wrong_part":"面積が1,000 m2 未満のものに限られる","choice_4_reason":"誤り。《面積1000㎡未満》という一般的な面積制限はありません。\n【本肢の根拠・注意点】軽減税率の適用対象となる土地を一律1000㎡未満に限定する要件はない。面積で区切る農地転用や開発許可の許可要件と、登録免許税の軽減特例を区別する。\n【追加確認】面積の基準が存在する都市計画・農地転用の規制をこの租税特例に持ち込んではならない。土地売買の登記と適用期間を確認する。","choice_4_corrected_statement":"この税率の軽減措置の適用対象となる土地は、その面積1,000平方メートル未満という一律の条件はない。","choice_4_legal_basis":"租税特別措置法72条等、国税庁登録免許税資料（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"軽減措置には適用期限があるため、2025年と2026年の制度の有効期間を必ず分ける。｜誤り。《面積1000㎡未満》という一般的な面積制限はありません。\n象となる土地を一律1000㎡未満に限定する要件はない。面積で区切る農地転用や開発許可の許可要件と、登録免許税の軽減特例を区別する。\n象となる土地を一律1000㎡未満に限定する要件はない。面積で区切る農地転用や開発許可の許可要件と、登録免許税の軽減特例を区別する。\nひっかけ箇所：[[WARN:面積が1,000 m2 未満のものに限ら]]。正しい内容：==る土地は、その面積1,000平方メートル未満という一律の条件はない。==。"},{"question_id":"2025-Q24","year":2025,"session":"通常","question_no":24,"major_field":"税・その他","section":"地方税法","unit":"固定資産税","topic":"住宅用地特例・台帳・免税点・納税義務者","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"固定資産税に関する次の記述のうち、正しいものはどれか。","choice_1":"住宅用地のうち小規模住宅用地（200 m2 以下）に対して課する固定資産税の課税標準は、当該小規模住宅用地に係る固定資産税の課税標準となるべき価格の3 分の1 の額である。","choice_2":"市町村長は、納税義務者等の求めに応じ、法令で定めるところにより固定資産課税台帳を閲覧に供しなければならない。ただし、当該部分に記載されている住所が明らかにされることにより人の生命又は身体に危害を及ぼすおそれがある場合、当該住所を削除する等の措置を講じたもの又はその写しを閲覧に供することができる。","choice_3":"市町村は、土地、家屋又は償却資産に対して課する固定資産税額が、土地にあっては30万円、家屋にあっては20 万円、償却資産にあっては150 万円に満たない場合においては、原則として固定資産税を課することができない。","choice_4":"固定資産税は、固定資産の所有者として、登記簿又は土地補充課税台帳若しくは家屋補充課税台帳に所有者として登記又は登録されている者に対して課されるため、所有者として登記又は登録されている個人が賦課期日前に死亡している場合、固定資産課税台帳に新たな所有者が登録されていなければ何人に対しても固定資産税を課することはできない。","official_accepted_answers":"2","answer_conclusion":"固定資産課税台帳の閲覧では、安全確保のため《住所を削除する等の措置》が認められます。肢2が正しい。","answer_reason":"【結論】固定資産課税台帳の閲覧では、安全確保のため《住所を削除する等の措置》が認められます。肢2が正しい。\n【解き方】固定資産税は原則1月1日現在の固定資産の所有者を納税義務者とし、課税標準額や住宅用地特例に応じて計算する。小規模住宅用地の課税標準は原則6分の1、一般住宅用地は3分の1の特例があり、面積200㎡以下の部分など条件を確かめる。免税点は単純な評価額ではなく課税標準額で判断する。課税台帳の閲覧では所有者等の権利がある一方、個人の権利利益保護のため住所を削除する等の","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】固定資産税は原則1月1日現在の固定資産の所有者を納税義務者とし、課税標準額や住宅用地特例に応じて計算する。小規模住宅用地の課税標準は原則6分の1、一般住宅用地は3分の1の特例があり、面積200㎡以下の部分など条件を確かめる。免税点は単純な評価額ではなく課税標準額で判断する。課税台帳の閲覧では所有者等の権利がある一方、個人の権利利益保護のため住所を削除する等の措置が認められる。閲覧と証明の範囲・対象者も区別する。\n【本問への当てはめ】固定資産税は市町村税で、原則1月1日（賦課期日）の所有者に課されます。《課税標準》《税額》《免税点》は別の概念です。住宅用地特例は小規模200㎡以下が6分の1、それを超える一般住宅用地の部分が3分の1です。\n【判断順序・類題への対応】賦課期日1月1日／住宅用地1/6と1/3／免税点は課税標準額／台帳閲覧時の個人情報保護を区別。\n【具体的な当てはめ】住宅用地として使われる200㎡の宅地と、その一部に店舗が建つ土地では、用途や特例の適用部分を確認して課税標準額を計算する。 ","system_purpose":"制度の趣旨：固定資産税は原則1月1日現在の固定資産の所有者を納税義務者とし、課税標準額や住宅用地特例に応じて計算する。小規模住宅用地の課税標準は原則6分の1、一般住宅用地は3分の1の特例があり、面積200㎡以下の部分など条件を確かめる。免税点は単純な評価額ではなく課税標準額で判断する。課税台帳の閲覧では所有者等の権利がある一方、個人の権利利益保護のため住所を削除する等の措置が認められる。閲","practical_examples":"【具体例】住宅用地として使われる200㎡の宅地と、その一部に店舗が建つ土地では、用途や特例の適用部分を確認して課税標準額を計算する。","advanced_knowledge":"【周辺・発展】固定資産税は市町村税で、原則1月1日（賦課期日）の所有者に課されます。《課税標準》《税額》《免税点》は別の概念です。住宅用地特例は小規模200㎡以下が6分の1、それを超える一般住宅用地の部分が3分の1です。\n[[NOTE:賦課期日1月1日／住宅用地1/6と1/3／免税点は課税標準額／台帳閲覧時の個人情報保護を区別。]]","comparative_explanation":"賦課期日1月1日／住宅用地1/6と1/3／免税点は課税標準額／台帳閲覧時の個人情報保護を区別。","important_points":"==小規模住宅用地1/6／一般住宅用地1/3／免税点は課税標準額／1月1日基準。==","trick_patterns":"「固定資産税額30万円未満で非課税」とは書かれていません。｜本問特有の誤誘導：固定資産課税台帳の閲覧では、安全確保のため《住所を削除する等の措置》が認められます。肢2が正しい。\n【誤答注意】設問中の [[WARN:固定資産税額が]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"小規模住宅用地1/6／一般住宅用地1/3／免税点は課税標準額／1月1日基準。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 2。\nQ2: 本問の主要な判断要件は何か？ A2: 賦課期日1月1日／住宅用地1/6と1/3／免税点は課税標準額／台帳閲覧時の個人情報保護を区別。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"地方税法341条・343条・349条の3の2・351条・382条の2 | 地方税法341条・343条・349条の3の2・351条・382条の2 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"小規模住宅用地1/6／一般住宅用地1/3／免税点は課税標準額／1月1日基準。","marker_red_spans":"固定資産税額が","marker_blue_spans":"賦課期日1月1日／住宅用地1/6と1/3／免税点は課税標準額／台帳閲覧時の個人情報保護を区別。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"3 分の1","choice_1_reason":"誤り。小規模住宅用地200㎡以下の固定資産税の課税標準は、原則《価格の6分の1》。3分の1は誤りです。\n【本肢の根拠・注意点】住宅用地の小規模部分は課税標準を原則価格の6分の1とする制度であり、3分の1は一般住宅用地部分の特例である。200㎡の境目と特例割合をペアで覚えないと数字の入替えに惑わされる。","choice_1_corrected_statement":"住宅用地のうち小規模住宅 はそれぞれ市場比較、再調達原価、純収益という異なる観点を用いる。似た用語を使った選択肢では「広く全不動産か、地域か、個別物件か」を読み分ける。\n【本問への当てはめ】価格形成要因は《一般的要因（経済情勢・政策など）》《地域要因（交通・周辺環境など）》《個別的要因（接道・形状・建物状態など）》の3層。鑑定評価の3手法は《取引事例比較法》《収益還元法》《原価法》で、どれに重点を置くかは対象物件の性質で決まります。\n【判断順序・類題への対応】一般・地域・個別の価格形成要因／取引事例比較・原価・収益の3手法。\n【具体的な当てはめ】同じ駅徒歩10分の地域でも、角地か旗竿地かという差は個別的要因。市場全体の金利上昇は一般的要因。 ","system_purpose":"制度の趣旨：不動産鑑定評価では、価格形成要因を一般的要因、地域要因、個別的要因に分ける。一般的要因は人口・経済・社会情勢等の広域的要因、地域要因は対象地域の街路・環境・接近条件等、個別的要因は対象不動産特有の形状・接道・利用状況等である。取引事例比較法、原価法、収益還元法はそれぞれ市場比較、再調達原価、純収益という異なる観点を用いる。似た用語を使った選択肢では「広く全不動産か、地域か、個別","practical_examples":"【具体例】同じ駅徒歩10分の地域でも、角地か旗竿地かという差は個別的要因。市場全体の金利上昇は一般的要因。","advanced_knowledge":"【周辺・発展】価格形成要因は《一般的要因（経済情勢・政策など）》《地域要因（交通・周辺環境など）》《個別的要因（接道・形状・建物状態など）》の3層。鑑定評価の3手法は《取引事例比較法》《収益還元法》《原価法》で、どれに重点を置くかは対象物件の性質で決まります。\n[[NOTE:一般・地域・個別の価格形成要因／取引事例比較・原価・収益の3手法。]]","comparative_explanation":"一般・地域・個別の価格形成要因／取引事例比較・原価・収益の3手法。","important_points":"==一般・地域・個別／取引・収益・原価の3手法。==","trick_patterns":"「社会的・経済的要因だから個別的」というすり替えに注意。｜本問特有の誤誘導：価格形成要因の説明で《一般的要因》と《個別的要因》を入れ替えた肢1が誤り。\n【誤答注意】設問中の [[WARN:個別的要因]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"一般・地域・個別／取引・収益・原価の3手法。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 1。\nQ2: 本問の主要な判断要件は何か？ A2: 一般・地域・個別の価格形成要因／取引事例比較・原価・収益の3手法。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"国土交通省 不動産鑑定評価基準 | 国土交通省 不動産鑑定評価基準 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"一般・地域・個別／取引・収益・原価の3手法。","marker_red_spans":"個別的要因","marker_blue_spans":"一般・地域・個別の価格形成要因／取引事例比較・原価・収益の3手法。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"true","choice_1_wrong_part":"個別的要因","choice_1_reason":"誤り（正解肢）。経済社会全体に影響する自然的・社会的・経済的・行政的な要因は《一般的要因》です。個別的要因ではありません。\n【本肢の根拠・注意点】社会・経済・行政・自然の広範な条件が不動産価格全般に及ぼす影響は一般的要因の説明である。個別的要因は接道、形状、建物の維持状態等、対象不動産そのものに固有の事情なので、要因の分類名が入れ替わっている。","choice_1_corrected_statement":"価格形成要因のうち一般的要因とは、一般経済社会における不動産のあり方及びその価格の水準に影響を与える要因をいい、自然的要因、社会的要因、経済的要因及び行政的要因に大別される。","choice_1_legal_basis":"国土交通省 不動産鑑定評価基準（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"「社会的・経済的要因だから個別的」というすり替えに注意。｜誤り（正解肢）。経済社会全体に影響する自然的・社会的・経済的・行政的な要因は《一般的要因》です。個別的要因ではありません。\n要因の説明である。個別的要因は接道、形状、建物の維持状態等、対象不動産そのものに固有の事情なので、要因の分類名が入れ替わっている。\n要因の説明である。個別的要因は接道、形状、建物の維持状態等、対象不動産そのものに固有の事情なので、要因の分類名が入れ替わっている。\nひっかけ箇所：[[WARN:個別的要因]]。正しい内容：==いい、自然的要因、社会的要因、経済的要因及び行政的要因に大別される。==。","choice_2_truth":"true","choice_2_is_exam_answer":"false","choice_2_wrong_part":"該当なし","choice_2_reason":"正しい。収益還元法は賃貸用・事業用に有効で、自己使用の不動産も賃貸を仮定した収益から評価することがあります。\n【本肢の根拠・注意点】収益還元法は将来の純収益等から不動産価値を求める。実際に賃貸している不動産だけでなく、自用であっても賃貸を想定して収益力を試算できる場合がある。用途を過度に限定しない。","choice_2_corrected_statement":"原文どおりで正しい","choice_2_legal_basis":"国土交通省 不動産鑑定評価基準（当該肢と条文の個別照合は要確認）","choice_2_exam_tip":"「社会的・経済的要因だから個別的」というすり替えに注意。｜正しい。収益還元法は賃貸用・事業用に有効で、自己使用の不動産も賃貸を仮定した収益から評価することがあります。\n値を求める。実際に賃貸している不動産だけでなく、自用であっても賃貸を想定して収益力を試算できる場合がある。用途を過度に限定しない。\n値を求める。実際に賃貸している不動産だけでなく、自用であっても賃貸を想定して収益力を試算できる場合がある。用途を過度に限定しない。","choice_3_truth":"true","choice_3_is_exam_answer":"false","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい。原価法の減価修正では耐用年数に基づく方法と観察減価法を組み合わせて判断します。\n【本肢の根拠・注意点】原価法は再調達原価から減価を控除して積算価格を求める。耐用年数からの減価把握と観察減価法はそれぞれ長所・欠点があり、基準は両者の併用を求める。手法名だけでなく補完関係を理解する。\n【追加確認】減価の把握方法は一方を排除する二者択一ではなく、経年や現実の劣化状況を複数の角度から補う考え方である。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"国土交通省 不動産鑑定評価基準（当該肢と条文の個別照合は要確認）","choice_3_exam_tip":"「社会的・経済的要因だから個別的」というすり替えに注意。｜正しい。原価法の減価修正では耐用年数に基づく方法と観察減価法を組み合わせて判断します。\nめる。耐用年数からの減価把握と観察減価法はそれぞれ長所・欠点があり、基準は両者の併用を求める。手法名だけでなく補完関係を理解する。\nめる。耐用年数からの減価把握と観察減価法はそれぞれ長所・欠点があり、基準は両者の併用を求める。手法名だけでなく補完関係を理解する。","choice_4_truth":"true","choice_4_is_exam_answer":"false","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。未完成建物でも、完成を前提にする条件付きの鑑定評価が認められる場合があります。\n【本肢の根拠・注意点】建設中の建物でも、完成を前提とした条件を設定して鑑定評価を行う場合がある。現時点で工事が完了していないため一切評価できないというわけではなく、条件と想定時点を明確にすることが重要。\n【追加確認】鑑定条件として完成を想定する場合には、その条件を明らかにした評価であることが重要で、現状の完成済建物と同じ前提とはしない。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"国土交通省 不動産鑑定評価基準（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"「社会的・経済的要因だから個別的」というすり替えに注意。｜正しい。未完成建物でも、完成を前提にする条件付きの鑑定評価が認められる場合があります。\n定評価を行う場合がある。現時点で工事が完了していないため一切評価できないというわけではなく、条件と想定時点を明確にすることが重要。\n定評価を行う場合がある。現時点で工事が完了していないため一切評価できないというわけではなく、条件と想定時点を明確にすることが重要。"},{"question_id":"2025-Q26","year":2025,"session":"通常","question_no":26,"major_field":"宅建業法","section":"宅建業法","unit":"報酬額の制限","topic":"賃貸借媒介・代理・低廉な空き家等の報酬","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"combination","question_text":"宅地建物取引業者Ａ（消費税課税事業者）及び宅地建物取引業者Ｂ（消費税課税事業者）が受領した報酬に関するアからウの記述のうち、宅地建物取引業法の規定によれば、誤っているものを全て掲げたものは1 から4 のうちどれか。なお、代理、媒介に当たり、広告の依頼は行われていないものとする。ア　Ａが単独で貸主と借主の双方から店舗用建物の貸借の媒介の依頼を受け、1 か月の借賃24 万円（消費税等相当額を含まない。）、権利金1,400 万円（権利設定の対価として支払われるもので、返還されないものをいい、消費税等相当額を含まない。）の賃貸借契約を成立させ、依頼者の双方からそれぞれ52 万8,000 円を報酬として受領したことは、宅地建物取引業法に違反する。イ　現に長期間にわたって居住の用、事業の用その他の用途に供されておらず、かつ将来にわたり居住の用、事業の用その他の用途に供される見込みがない宅地（1 か月の借賃5 万円。消費税等相当額を含まない。）について、Ａは貸主から代理を依頼され、Ｂは借主から代理を依頼され、賃貸借契約が成立したので、Ａは貸主から4 万円を、Ｂは、代理の依頼を受けるに当たって、報酬が借賃の1.1 か月分を超えることについて借主から承諾を得たうえで、借主から7 万円を報酬として受領したことは、宅地建物取引業法に違反しない。ウ　Ａは売主から媒介の依頼を、Ｂは買主から媒介の依頼を、それぞれ受けて、代金200 万円（消費税等相当額を含み、土地代金は90 万円である。）の土地付建物の売買契約を成立させた場合に、依頼者と宅地建物取引業者との間であらかじめ報酬の額を定めていなかったときは、売主はＡに対して少なくとも10 万4,500 円、買主はＢに対して少なくとも10 万4,500円を支払わなければならない。","choice_1":"ア、イ","choice_2":"イ、ウ","choice_3":"ア、ウ","choice_4":"ア、イ、ウ","official_accepted_answers":"4","answer_conclusion":"《ア・イ・ウのすべてが誤り》なので選択肢4。権利金の特例と長期空家等の賃貸報酬上限を区別します。","answer_reason":"【結論】《ア・イ・ウのすべてが誤り》なので選択肢4。権利金の特例と長期空家等の賃貸報酬上限を区別します。\n【解き方】宅建業者の報酬は依頼者との合意があっても法令の上限を超えて受領できない。貸借の媒介では原則として借賃の1か月分に相当する額と消費税の計算が基本となる一方、居住用以外の賃貸借で返還されない権利金等がある場合には、その額を売買代金とみなした報酬計算を使える場合がある。長期の空家等の貸借には特例があり、貸主側・借主側それぞれの上限を正確に見分ける。もっとも告示は上","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】宅建業者の報酬は依頼者との合意があっても法令の上限を超えて受領できない。貸借の媒介では原則として借賃の1か月分に相当する額と消費税の計算が基本となる一方、居住用以外の賃貸借で返還されない権利金等がある場合には、その額を売買代金とみなした報酬計算を使える場合がある。長期の空家等の貸借には特例があり、貸主側・借主側それぞれの上限を正確に見分ける。もっとも告示は上限を定めるもので、依頼者が常に一定額以上を支払う下限義務ではない。個数・組合せ問題はア・イ・ウを別々に判定してから選択肢の組を選ぶ。\n【本問への当てはめ】《ア》誤り：居住用以外の建物賃貸で返還されない権利金1400万円を売買代金とみなすと、依頼者それぞれから（1400万円×3％＋6万円）×1.1＝《52万8000円》まで受領可能。したがって「違反する」が誤り。《イ》誤り：長期空家等の賃貸代理でも借主側から受ける額は《賃料1.1か月分＝5万5000円》が上限で、7万円は不可。《ウ》誤り：報酬告示は《上限》を定めるもので、「少なくとも10万4500円を払う義務」を定めません。\n【判断順序・類題への対応】権利金特例／貸借報酬の総額上限／長期空家等の特例／報酬は上限であって最低保証ではない。\n【構成記述の検討】ア：誤り。居住用以外の建物賃貸で返還されない権利金1400万円は売買代金とみなして報酬上限を計算でき、各依頼者から52万8000円の受領を直ちに違反とはしない。 イ：誤り。長期空家等の貸借代理でも借主側の上限を超える7万円を受け取ることはできず、事前承諾で上限を超えられるわけではない。 ウ：誤り。報酬告示は上限規制であり、報酬を事前に合意しなかった依頼者に最低10万4500円の法定支払義務が発生するわけではない。\n【報酬の二段階判定】まず取引類型（売買・貸借）と媒介／代理を確定し、次に借主・貸主の誰が依頼者なのかを見る。長期空家等の賃貸特例で総額が賃料の2.2か月分まで認められる場合でも、借主側から取れる額まで自由に増えるわけではない。上限告示は業者の請求できる最高額を定めるのであって、合意していない相手に最低報酬の支払義務を生じさせない。","system_purpose":"制度の趣旨：宅建業者の報酬は依頼者との合意があっても法令の上限を超えて受領できない。貸借の媒介では原則として借賃の1か月分に相当する額と消費税の計算が基本となる一方、居住用以外の賃貸借で返還されない権利金等がある場合には、その額を売買代金とみなした報酬計算を使える場合がある。長期の空家等の貸借には特例があり、貸主側・借主側それぞれの上限を正確に見分ける。もっとも告示は上限を定めるもので、依","practical_examples":"【具体例】権利金1400万円の店舗賃貸借と、月額5万円の長期空家の賃貸借では報酬計算に適用する規律が異なる。","advanced_knowledge":"【周辺・発展】《ア》誤り：居住用以外の建物賃貸で返還されない権利金1400万円を売買代金とみなすと、依頼者それぞれから（1400万円×3％＋6万円）×1.1＝《52万8000円》まで受領可能。したがって「違反する」が誤り。《イ》誤り：長期空家等の賃貸代理でも借主側から受ける額は《賃料1.1か月分＝5万5000円》が上限で、7万円は不可。《ウ》誤り：報酬告示は《上限》を定めるもので、「少なくとも10万4500円を払う義務」を定めません。\n[[NOTE:権利金特例／貸借報酬の総額上限／長期空家等の特例／報酬は上限であって最低保証ではない。]]","comparative_explanation":"権利金特例／貸借報酬の総額上限／長期空家等の特例／報酬は上限であって最低保証ではない。","important_points":"==居住用以外の権利金＝売買代金換算あり／借主側1.1か月分／報酬額は上限で最低額ではない。==","trick_patterns":"「違反する／違反しない」「上限／下限」を読み違えない。｜本問特有の誤誘導：《ア・イ・ウのすべてが誤り》なので選択肢4。権利金の特例と長期空家等の賃貸報酬上限を区別します。\n【誤答注意】設問中の [[WARN:ア、イ]] を無条件で 取引業者は、自身が売主となる場合に、重要事項説明書の交付に当たり、専任の宅地建物取引士をして当該書面に記名させなければならず、また、買主にも当該書面に記名させなければならない。","choice_3":"宅地建物取引業者は、重要事項を説明する際には、宅地建物取引業者の事務所において行わなければならない。","choice_4":"宅地建物取引業者は、自身が売主となる場合であっても、買主に対して、天災その他不可抗力による損害の負担に関する定めがあるときは、その内容を説明しなければならない。","official_accepted_answers":"1","answer_conclusion":"マンション管理の委託先の《名称・主たる事務所所在地》は重要事項説明事項です。肢1が正しい。","answer_reason":"【結論】マンション管理の委託先の《名称・主たる事務所所在地》は重要事項説明事項です。肢1が正しい。\n【解き方】宅建業法35条の重要事項説明は買主・借主が契約するかどうかを判断できるよう契約成立前に行う制度で、37条書面は成立した契約内容を残す制度である。建物区分所有の取引では共用部分・専用使用権・修繕積立金・管理の委託先など、住戸だけで分からない管理上の情報が重要事項となる。設問の管理委託先について名称だけでなく主たる事務所所在地の説明を要する場合がある。電子交付等","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】宅建業法35条の重要事項説明は買主・借主が契約するかどうかを判断できるよう契約成立前に行う制度で、37条書面は成立した契約内容を残す制度である。建物区分所有の取引では共用部分・専用使用権・修繕積立金・管理の委託先など、住戸だけで分からない管理上の情報が重要事項となる。設問の管理委託先について名称だけでなく主たる事務所所在地の説明を要する場合がある。電子交付等の条件、業者間取引時の扱いも別途確認し、説明・書面交付の場面を取り違えない。\n【本問への当てはめ】35条は《契約成立前の判断材料》を説明する制度、37条は《契約成立後の内容確認》を書面にする制度です。誰が説明するか、誰が記名するか、どのタイミングで交付するか、取引士証提示の有無を横断比較すると得点につながります。\n【判断順序・類題への対応】35条＝契約前の説明／37条＝成立後の書面化／マンション管理事項は重要事項として別建て。\n【具体的な当てはめ】マンション購入検討者には専有部分の面積だけでなく、管理委託先や管理費の負担など共同住宅固有の事項を契約前に示す。\n【2026年の追加説明事項】管理委託会社の氏名・住所（法人なら商号又は名称・主たる事務所所在地）を説明する肢1は、以前からの重要事項である。2026年4月1日からは区分所有建物の売買・交換について管理業者管理者方式の有無も追加説明事項になった。「委託先を示す義務」と「管理者等が管理会社であるかを示す新義務」を二つに分けて覚える。","system_purpose":"制度の趣旨：宅建業法35条の重要事項説明は買主・借主が契約するかどうかを判断できるよう契約成立前に行う制度で、37条書面は成立した契約内容を残す制度である。建物区分所有の取引では共用部分・専用使用権・修繕積立金・管理の委託先など、住戸だけで分からない管理上の情報が重要事項となる。設問の管理委託先について名称だけでなく主たる事務所所在地の説明を要する場合がある。電子交付等の条件、業者間取引時","practical_examples":"【具体例】マンション購入検討者には専有部分の面積だけでなく、管理委託先や管理費の負担など共同住宅固有の事項を契約前に示す。","advanced_knowledge":"【周辺・発展】35条は《契約成立前の判断材料》を説明する制度、37条は《契約成立後の内容確認》を書面にする制度です。誰が説明するか、誰が記名するか、どのタイミングで交付するか、取引士証提示の有無を横断比較すると得点につながります。\n[[NOTE:35条＝契約前の説明／37条＝成立後の書面化／マンション管理事項は重要事項として別建て。]]","comparative_explanation":"35条＝契約前の説明／37条＝成立後の書面化／マンション管理事項は重要事項として別建て。","important_points":"==35条＝契約前・取引士が説明／37条＝成立後・取引条件を書面化で整理。==","trick_patterns":"「専任の取引士だけ」「買主の署名が必要」「必ず事務所で」という断定に注意。｜本問特有の誤誘導：マンション管理の委託先の《名称・主たる事務所所在地》は重要事項説明事項です。肢1が正しい。\n【誤答注意】設問中の [[WARN:その内容を説明しなければならない]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"35条＝契約前・取引士が説明／37条＝成立後・取引条件を書面化で整理。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 1。\nQ2: 本問の主要な判断要件は何か？ A2: 35条＝契約前の説明／37条＝成立後の書面化／マンション管理事項は重要事項として別建て。。","substatement_reasoning":"","reform_status":"relevant_verified","reform_title":"管理業者管理者方式の有無を重要事項説明事項へ追加","reform_effective_date":"2026-04-01","reform_before":"区分所有建物の管理委託先の名称・所在地等を説明する義務は改正前からある。管理業者管理者方式の有無の追加項目は2026年4月施行前にはなかった。","reform_after":"区分所有建物の売買・交換では、管理委託先の氏名／住所等に加え、所定の場合に管理業者管理者方式であるか否かの説明が必要になった。","reform_2026_impact":"肢1の管理受託法人の名称・所在地を説明する義務は改正後も正しい。2026年からは、区分所有建物の売買・交換で管理業者管理者方式の有無も追加確認する。肢2〜4の誤りはこの改正で正しくならない。","reform_sources":"https://www.mlit.go.jp/totikensangyo/const/1_6_bt_000268.html","legal_sources":"宅地建物取引業法35条、同施行規則 | 宅地建物取引業法35条・37条 / 宅地建物取引業法施行規則 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/ | https://www.mlit.go.jp/totikensangyo/const/1_6_bt_000268.html | https://laws.e-gov.go.jp/law/327AC1000000176","marker_yellow_spans":"35条＝契約前・取引士が説明／37条＝成立後・取引条件を書面化で整理。","marker_red_spans":"その内容を説明しなければならない","marker_blue_spans":"35条＝契約前の説明／37条＝成立後の書面化／マンション管理事項は重要事項として別建て。","qa_status":"PASS","qa_issues":"","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"true","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"true","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。区分所有建物の売買の媒介で管理を法人へ委託している場合、管理受託者の商号等と主たる事務所所在地を説明します。\n【本肢の根拠・注意点】区分所有建物の取引では一棟の建物と敷地の管理状況が購入後の費用・維持管理に直結する。法人へ管理委託されている場合、その法人名・主たる事務所所在地は35条の説明事項となる。購入者が管理の問い合わせ先を理解する趣旨。","choice_1_corrected_statement":"原文どおりで正しい","choice_1_legal_basis":"宅建業法35条1項6号、同施行規則16条の2第8号｜https://laws.e-gov.go.jp/law/327AC1000000176","choice_1_exam_tip":"「専任の取引士だけ」「買主の署名が必要」「必ず事務所で」という断定に注意。｜正しい。区分所有建物の売買の媒介で管理を法人へ委託している場合、管理受託者の商号等と主たる事務所所在地を説明します。\n。法人へ管理委託されている場合、その法人名・主たる事務所所在地は35条の説明事項となる。購入者が管理の問い合わせ先を理解する趣旨。","choice_2_truth":"false","choice_2_is_exam_answer":"false","choice_2_wrong_part":"専任の宅地建物取引士をして当該書面に記名させなければならず、また、買主にも当該書面に記名させなければならない","choice_2_reason":"誤り。35条書面の記名は宅地建物取引士が行いますが、必ず《専任》である必要はありません。また、買主の記名は法定要件ではありません。\n【本肢の根拠・注意点】重要事項説明書に記名するのは宅地建物取引士であり、「専任の」取引士であることや買主本人が必ず記名することは一律の法定要件ではない。説明を担う取引士と事務所に設置する専任取引士の制度を分ける。","choice_2_corrected_statement":"宅地建物取引業者は、自身が売主となる場合に、重要事項説明書の交付に当たり、宅地建物取引士に当該書面へ記名させる必要があるが、専任取引士に限定されず買主の記名も一律には必要ない。","choice_2_legal_basis":"宅建業法35条5項（宅建士の記名）｜https://laws.e-gov.go.jp/law/327AC1000000176","choice_2_exam_tip":"「専任の取引士だけ」「買主の署名が必要」「必ず事務所で」という断定に注意。｜誤り。35条書面の記名は宅地建物取引士が行いますが、必ず《専任》である必要はありません。また、買主の記名は法定要件ではありません。\n取引士であることや買主本人が必ず記名することは一律の法定要件ではない。説明を担う取引士と事務所に設置する専任取引士の制度を分ける。\nひっかけ箇所：[[WARN:専任の宅地建物取引士をして当該書面に記名]]。正しい内容：==る必要があるが、専任取引士に限定されず買主の記名も一律には必要ない。==。","choice_3_truth":"false","choice_3_is_exam_answer":"false","choice_3_wrong_part":"宅地建物取引業者の事務所において行わなければならない","choice_3_reason":"誤り。重要事項説明を行う《場所》は事務所に限定されません。一定の条件を満たすIT重説も利用可能です。\n【本肢の根拠・注意点】重要事項説明は契約前に法定の方法で行う必要があるが、宅建業者の事務所に場所を限定する規定ではない。オンライン説明などの法定要件を満たす方法もあり、買主の理解と説明の適正が本質である。","choice_3_corrected_statement":"宅地建物取引業者は、重要事項を説明する際には、法令の要件を満たしていれば事務所以外の場所や適法なオンライン方式でも行うことができる。","choice_3_legal_basis":"宅建業法35条1項・4項（場所の事務所限定なし）｜https://laws.e-gov.go.jp/law/327AC1000000176","choice_3_exam_tip":"「専任の取引士だけ」「買主の署名が必要」「必ず事務所で」という断定に注意。｜誤り。重要事項説明を行う《場所》は事務所に限定されません。一定の条件を満たすIT重説も利用可能です。\n宅建業者の事務所に場所を限定する規定ではない。オンライン説明などの法定要件を満たす方法もあり、買主の理解と説明の適正が本質である。\nひっかけ箇所：[[WARN:宅地建物取引業者の事務所において行わなけ]]。正しい内容：==ていれば事務所以外の場所や適法なオンライン方式でも行うことができる。==。","choice_4_truth":"false","choice_4_is_exam_answer":"false","choice_4_wrong_part":"その内容を説明しなければならない","choice_4_reason":"誤り。天災等の不可抗力による危険負担について定めがある場合の記載は、原則《37条書面》の論点です。35条の説明事項と混同しないでください。\n【本肢の根拠・注意点】天災等による危険負担は、契約に定めがある場合に37条書面へ記載すべき項目として扱われる一方、35条の説明事項へ同じ内容を無条件に加えるものではない。説明義務と契約成立後の書面化を区別する。","choice_4_corrected_statement":"宅地建物取引業者は、自身が売主となる場合であっても、買主に対して、天災その他不可抗力による損害の負担に関する定めがあるときは、危険負担の特約は重要事項説明の一律必須項目ではないが、定めがあれば37条書面に記載しなければならない。","choice_4_legal_basis":"宅建業法35条・37条1項（危険負担の定めは37条書面の記載事項）｜https://laws.e-gov.go.jp/law/327AC1000000176","choice_4_exam_tip":"「専任の取引士だけ」「買主の署名が必要」「必ず事務所で」という断定に注意。｜誤り。天災等の不可抗力による危険負担について定めがある場合の記載は、原則《37条書面》の論点です。35条の説明事項と混同しないでください。\n記載すべき項目として扱われる一方、35条の説明事項へ同じ内容を無条件に加えるものではない。説明義務と契約成立後の書面化を区別する。\nひっかけ箇所：[[WARN:その内容を説明しなければならない]]。正しい内容：==必須項目ではないが、定めがあれば37条書面に記載しなければならない。==。"},{"question_id":"2025-Q28","year":2025,"session":"通常","question_no":28,"major_field":"宅建業法","section":"宅建業法","unit":"広告・媒介等の業務規制","topic":"誇大広告・未完成物件・他人物売買・レインズ","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"count_true","question_text":"宅地建物取引業者の業務に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはいくつあるか。ア　自ら売主として販売する宅地又は建物の広告に取引態様の別を明示しなかった場合は、罰則の対象とはならないが監督処分の対象となり、宅地又は建物の規模について著しく事実に相違する表示をした場合は、罰則の対象にも監督処分の対象にもなる。イ　自ら売主として土地付建物の売買契約を締結しようとする場合、当該土地上に建てようとする建物が建築確認申請前であっても、広告することはできるが、建築確認を受けるまで、契約を締結することはできない。ウ　宅地建物取引業者は、自ら売主として、宅地建物取引業者である買主との間で、自ら所有しない造成前の宅地の売買契約を締結するためには、法第41 条の規定による手付金等の保全措置を講じ、かつ、売主である宅地建物取引業者が当該宅地を取得する契約を締結しなければならない。エ　宅地建物取引業者は、宅地の売買の専属専任媒介契約を締結した場合、当該媒介契約締結の日から5 日以内（休業日を除く。）に、当該宅地について指定流通機構に所定の事項を登録しなければならない。","choice_1":"一つ","choice_2":"二つ","choice_3":"三つ","choice_4":"なし","official_accepted_answers":"2","answer_conclusion":"正しい記述は《アとエの2つ》で選択肢2が正解。広告開始時期と未完成物件の契約時期を区別します。","answer_reason":"【結論】正しい記述は《アとエの2つ》で選択肢2が正解。広告開始時期と未完成物件の契約時期を区別します。\n【解き方】広告の開始時期と未完成物件の契約締結時期は、宅建業法上別々の規律である。宅地造成や建築工事に関する必要な許可・確認等が得られる前の広告は原則できない。同様に一定の未完成物件では許可等の前に売買契約等を締結できないが、例外や対象行為を法文に沿って確認する。媒介契約の指定流通機構登録は専属専任で5日、専任で7日（業者の休業日を除く）が代表的な期限となる。業者間取","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】広告の開始時期と未完成物件の契約締結時期は、宅建業法上別々の規律である。宅地造成や建築工事に関する必要な許可・確認等が得られる前の広告は原則できない。同様に一定の未完成物件では許可等の前に売買契約等を締結できないが、例外や対象行為を法文に沿って確認する。媒介契約の指定流通機構登録は専属専任で5日、専任で7日（業者の休業日を除く）が代表的な期限となる。業者間取引で自ら売主となる場合の8種制限には適用除外があるため、他の義務と混同しない。\n【本問への当てはめ】《ア》正しい：取引態様の広告記載義務違反は監督処分の対象で、誇大広告は監督処分・罰則の対象。《イ》誤り：建築確認を要する建物は《建築確認前に広告も契約も不可》。「広告は可能」が誤り。《ウ》誤り：業者間取引には他人物売買の規制等の8種制限が適用されない場面があり、保全措置を条件として定めた説明が誤り。《エ》正しい：専属専任媒介の指定流通機構登録期限は《5日以内（休業日除く）》。\n【判断順序・類題への対応】広告開始規制33条／契約締結等の時期規制33条の2／媒介契約34条の2／8種制限の業者間適用除外。\n【構成記述の検討】ア：正しい。取引態様の明示違反と誇大広告では監督処分・罰則の適用関係が異なる。本肢の対比は出題時の制度に沿う。 イ：誤り。建築確認を要する物件では、確認を受ける前は契約締結だけでなく広告開始にも規制が及ぶ。「広告だけは可能」が誤り。 ウ：誤り。宅建業者同士の売買に、非業者買主を保護する手付金等保全措置などの8種制限を一律に適用しない。 エ：正しい。専属専任媒介契約の指定流通機構登録は、締結日から休業日を除いて5日以内が原則。","system_purpose":"制度の趣旨：広告の開始時期と未完成物件の契約締結時期は、宅建業法上別々の規律である。宅地造成や建築工事に関する必要な許可・確認等が得られる前の広告は原則できない。同様に一定の未完成物件では許可等の前に売買契約等を締結できないが、例外や対象行為を法文に沿って確認する。媒介契約の指定流通機構登録は専属専任で5日、専任で7日（業者の休業日を除く）が代表的な期限となる。業者間取引で自ら売主となる場","practical_examples":"【具体例】建築確認前の分譲マンションを広告する行為と、予約・契約を取る行為について、それぞれの禁止規定を確認する。","advanced_knowledge":"【周辺・発展】《ア》正しい：取引態様の広告記載義務違反は監督処分の対象で、誇大広告は監督処分・罰則の対象。《イ》誤り：建築確認を要する建物は《建築確認前に広告も契約も不可》。「広告は可能」が誤り。《ウ》誤り：業者間取引には他人物売買の規制等の8種制限が適用されない場面があり、保全措置を条件として定めた説明が誤り。《エ》正しい：専属専任媒介の指定流通機構登録期限は《5日以内（休業日除く）》。\n[[NOTE:広告開始規制33条／契約締結等の時期規制33条の2／媒介契約34条の2／8種制限の業者間適用除外。]]","comparative_explanation":"広告開始規制33条／契約締結等の時期規制33条の2／媒介契約34条の2／8種制限の業者間適用除外。","important_points":"==建築確認前の広告・契約不可／専属専任5日・専任7日／業者間の8種制限の適用確認。==","trick_patterns":"未完成物件では「広告の開始時期」と「契約の締結時期」を別々の条文で確認。｜本問特有の誤誘導：正しい記述は《アとエの2つ》で選択肢2が正解。広告開始時期と未完成物件の契約時期を区別します。\n【誤答注意】設問中の [[WARN:一つ]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"建築確認前の広告・契約不可／専属専任5日・専任7日／業者間の8種制限の適用確認。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 2。\nQ2: 本問の主要な判断要件は何か？ A2: 広告開始規制33条／契約締結等の時期規制33条の2／媒介契約34条の2／8種制限の業者間適用除外。。\nQ3: ア〜エの各判定は？ A3: ア：正しい。取引態様の明示違反と誇大広告では監督処分・罰則の適用関係が異なる。本肢の対比は出題時の制度に沿う。／イ：誤り。建築確認を要する物件では、確認を受ける前は契約締結だけでなく広告開始にも規制が及ぶ。「広告だけは可能」が誤り。／ウ：誤り。宅建業者同士の売買に、非業者買主を保護する手付金等保全措置などの8種制限を一律に適用しない。／エ：正しい。専属専任媒介契約の指定流通機構登録は、締結日から休業日を除いて5日以内が原則。","substatement_reasoning":"ア：正しい。取引態様の明示違反と誇大広告では監督処分・罰則の適用関係が異なる。本肢の対比は出題時の制度に沿う。\nイ：誤り。建築確認を要する物件では、確認を受ける前は契約締結だけでなく広告開始にも規制が及ぶ。「広告だけは可能」が誤り。\nウ：誤り。宅建業者同士の売買に、非業者買主を保護する手付金等保全措置などの8種制限を一律に適用しない。\nエ：正しい。専属専任媒介契約の指定流通機構登録は、締結日から休業日を除いて5日以
