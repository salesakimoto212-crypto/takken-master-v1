れません。 具体的な要件は出題当時の関連条文で確認する。","choice_3_truth":"false","choice_3_is_exam_answer":"false","choice_3_wrong_part":"UNKNOWN","choice_3_reason":"誤り。有価証券の評価割合は国債が額面100％、地方債等は原則90％などです。設問の90％・80％は誤りです。\n原文の「Ａは、金銭と有価証券を併用して供託することができ、有価証券のみで供託する場合の当該有価証券…」という断定を、そのまま一般原則として受け入れてはいけない。未検証の修正文案では「有価証券の評価割合は国債が額面100％、地方債等は原則90％などです。設問の90％・80％は誤りです」であり、原文との違いを比べて制度の適用範囲を判断する。【理解を深める】供託場所は本店最寄り／金銭のみの場合は保管替え／事故の損害賠償は還付対象外。\n比較対象の肢4では「Ａは甲県内にある主たる事務所とは別に」が論点となる。正しい。営業保証金は主たる事務所の最寄りの供託所にまとめて供託します。他県の支店を増設しても同じです。","choice_3_corrected_statement":"【修正文案・独立照合待ち】有価証券の評価割合は国債が額面100％、地方債等は原則90％などです。設問の90％・80％は誤りです。","choice_3_legal_basis":"肢別の法令照合待ち。関連出典：宅地建物取引業法25条・26条・27条","choice_3_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。有価証券の評価割合は国債が額面100％、地方債等は原則90％などです。設問の90％・80％は誤りです。 具体的な要件は出題当時の関連条文で確認する。","choice_4_truth":"true","choice_4_is_exam_answer":"true","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。営業保証金は主たる事務所の最寄りの供託所にまとめて供託します。他県の支店を増設しても同じです。\n原文の「Ａは甲県内にある主たる事務所とは別に」にある条件が、正誤の判断を左右する。【理解を深める】営業保証金は主たる事務所1,000万円／従たる事務所1か所500万円が原則。保証協会加入時の分担金とは制度が違います。\n比較対象の肢1では「Ａが主たる事務所を移転したことにより」が論点となる。誤り。金銭のみ供託している場合、供託所が変われば原則保管替えの手続をします。新規供託と書いてあるので誤りです。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"肢別の法令照合待ち。関連出典：宅地建物取引業法25条・26条・27条","choice_4_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。営業保証金は主たる事務所の最寄りの供託所にまとめて供託します。他県の支店を増設しても同じです。 具体的な要件は出題当時の関連条文で確認する。"},{"question_id":"2024-Q28","year":2024,"session":"通常","question_no":28,"major_field":"宅建業法","section":"宅地建物取引業法","unit":"報酬","topic":"報酬の制限","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"combination","question_text":"宅地建物取引業者Ａ（消費税課税事業者）及び宅地建物取引業者Ｂ（消費税免税事業者）が受領した報酬に関するアからウの記述のうち、宅地建物取引業法の規定に違反しないものの組合せは1 から4 のうちどれか。なお、代理、媒介に当たり、広告の依頼は行われていないものとする。ア　居住用建物（1 か月の借賃12 万円。消費税等相当額を含まない。）について、Ａは貸主から代理を依頼され、Ｂは借主から媒介を依頼され、Ａは貸主から6.7 万円、Ｂは借主から6.5 万円を報酬として受領した。なお、Ｂは、媒介の依頼を受けるに当たって、報酬について借主から特段の承諾を得ていない。イ　Ｂは、事業用建物について、貸主と借主双方から媒介を依頼され、借賃1 か月分10 万円（消費税等相当額を含まない。）、権利金90 万円（権利設定の対価として支払われる金銭であって返還されないもので、消費税等相当額を含まない。）の賃貸借契約を成立させ、貸主と借主からそれぞれ5 万円を報酬として受領した。ウ　Ａは、土地付建物について、売主と買主双方から媒介を依頼され、代金3,500 万円（消費税等相当額を含み、土地代金は2,400 万円である。）の売買契約を成立させ、売主と買主からそれぞれ110 万円を報酬として受領したほか、売主の特別の依頼に基づき行った遠隔地への現地調査に要した実費の費用について、売主が事前に負担を承諾していたので、売主から9 万円を受領した。","choice_1":"ア、イ","choice_2":"イ、ウ","choice_3":"ア、ウ","choice_4":"ア、イ、ウ","official_accepted_answers":"2","answer_conclusion":"《違反しないのはイとウ》。アは借主の特段の承諾なしに居住用賃貸借の片側報酬上限を超えています。","answer_reason":"《==違反しないのはイとウ==》。アは借主の特段の承諾なしに居住用賃貸借の片側報酬上限を超えています。","scoring_exception_note":"","deep_lecture":"ア：居住用借主から承諾なく受けられるのは原則借賃0.5か月分以内＋税相当額で、Bの6.5万円は上限を超えます。イ：事業用賃貸借で合計10万円は月額借賃10万円以下。ウ：売買価格から建物消費税を除いて報酬計算し、特別依頼・実費承諾がある調査費は別途受領可能な範囲です。\n\n【単元の見取り図・補足講義】宅建業者の報酬は国土交通大臣告示の上限があり、売買・交換・貸借で計算構造が異なる。 双方から受領できる場合でも総額上限を確認する。低廉な空家等の特例など、改正時期・適用条件に注意する。\n\n【本問の四肢を使った比較】【肢1：選択肢の構成要素の検討が必要】誤り。アが違反なのでアを含む組合せは正解になりません。イは適法です。 【肢2：選択肢の構成要素の検討が必要】正しい。イは事業用建物の貸借媒介で双方5万円ずつの受領が許容範囲。ウも売買媒介報酬110万円ずつと、依頼・事前承諾に基づく特別調査実費9万円の受領で適法です。 【肢3：選択肢の構成要素の検討が必要】誤り。アが違反なので、ウが適法でもア・ウの組合せは誤りです。 【肢4：選択肢の構成要素の検討が必要】誤り。イ・ウは適法ですが、アを含む全て適法とはいえません。","system_purpose":"【学習補助】報酬の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:双方から受領できる場合でも総額上限]]を確認する。低廉な空家等の特例など、改正時期・適用条件に注意する。","comparative_explanation":"【本問で混同しやすい区別】双方から受領できる場合でも総額上限を確認する。低廉な空家等の特例など、改正時期・適用条件に注意する。","important_points":"《ア×／イ○／ウ○》／《居住用賃貸は片側原則0.5か月》／《特別依頼の実費は別途の場合あり》。","trick_patterns":"課税事業者・[[WARN:免税事業者で報酬計算上の扱いが異なる]]。建物部分の消費税を売買代金から除く。","memory_summary":"《違反しないのはイとウ》。アは借主の特段の承諾なしに居住用賃貸借の片側報酬上限を超えています。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 2番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 双方から受領できる場合でも総額上限を確認する。低廉な空家等の特例など、改正時期・適用条件に注意する。","substatement_reasoning":"ア：× 居住用賃貸借の借主側媒介報酬は、事前承諾の有無や代理・媒介側の合計上限を確認し、本記述は適法とならない。／イ：○ 事業用賃貸借の媒介報酬は本件の受領額で違反しない。／ウ：○ 売買媒介報酬と依頼を受けた特別な調査実費を区別して適法。→適法なのはイ・ウ。報酬告示の適用時点と計算過程は追加監査が必要。","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"宅地建物取引業法46条／国土交通省 宅地建物取引業者が受け取る報酬の額（告示）","marker_yellow_spans":"違反しないのはイとウ","marker_red_spans":"免税事業者で報酬計算上の扱いが異なる","marker_blue_spans":"双方から受領できる場合でも総額上限","qa_status":"REWORK","qa_issues":"設問固有の解説・根拠条文を重点修正。ただし2026年度現行法の全肢独立検証は未完了。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"compound","choice_1_is_exam_answer":"false","choice_1_wrong_part":"UNKNOWN","choice_1_reason":"この組合せ「ア、イ」は誤りである。アでは、居住用建物の借主から媒介の依頼を受けたBが、特段の承諾を得ていないのに片側報酬の原則的な上限を超えて6.5万円を受領しているため、違反が生じる。一方、イで説明される事業用建物の貸借媒介は、貸主・借主から各5万円を受領したという条件で適法と判断する。==アは違反、イは適法==なので、適法なものだけを選ぶ設問ではアを含む肢1は正解にはならない。","choice_1_corrected_statement":"UNKNOWN","choice_1_legal_basis":"肢別の法令照合待ち。関連出典：宅地建物取引業法46条／国土交通省 宅地建物取引業者が受け取る報酬の額（告示）","choice_1_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。アが違反なのでアを含む組合せは正解になりません。イは適法です。 具体的な要件は出題当時の関連条文で確認する。","choice_2_truth":"compound","choice_2_is_exam_answer":"true","choice_2_wrong_part":"該当なし","choice_2_reason":"正解となる組合せは「イ、ウ」である。イは事業用建物の媒介で貸主と借主からそれぞれ5万円を受領しており、設問の報酬上限の範囲内である。ウは売買の報酬計算において売買代金から建物に係る消費税相当額を除くことに留意する。加えて、特別の依頼に基づく遠隔地調査の実費9万円は、事前の負担承諾などの事情を満たすものとして別途受領できる。[[NOTE:報酬本体と特別依頼の実費]]を分けることが鍵で、イとウが適法となる。","choice_2_corrected_statement":"原文どおりで正しい","choice_2_legal_basis":"肢別の法令照合待ち。関連出典：宅地建物取引業法46条／国土交通省 宅地建物取引業者が受け取る報酬の額（告示）","choice_2_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。イは事業用建物の貸借媒介で双方5万円ずつの受領が許容範囲。ウも売買媒介報酬110万円ずつと、依頼・事前承諾に基づく特別調査実費9万円の受領で適法です。 具体的な要件は出題当時の関連条文で確認する。","choice_3_truth":"compound","choice_3_is_exam_answer":"false","choice_3_wrong_part":"UNKNOWN","choice_3_reason":"この組合せ「ア、ウ」は不正解である。ウについては、売買媒介の報酬上限と事前承諾がある特別調査の実費という二つの受領を区別すれば適法と整理できる。しかしアでは居住用賃貸借の借主Bが、特段の承諾なしに片側報酬上限を超える金額を受領している。[[WARN:組合せ全体が適法とは限らない]]。先にア・イ・ウを個別に検査し、最後に解答候補と照合する順番を守る。","choice_3_corrected_statement":"UNKNOWN","choice_3_legal_basis":"肢別の法令照合待ち。関連出典：宅地建物取引業法46条／国土交通省 宅地建物取引業者が受け取る報酬の額（告示）","choice_3_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。アが違反なので、ウが適法でもア・ウの組合せは誤りです。 具体的な要件は出題当時の関連条文で確認する。","choice_4_truth":"compound","choice_4_is_exam_answer":"false","choice_4_wrong_part":"UNKNOWN","choice_4_reason":"この組合せ「ア、イ、ウ」は不正解である。問題は違反しないものの組合せを求めているため、一つでも違反となる構成要素が混ざる選択肢は採れない。イの事業用賃貸借の媒介報酬と、ウの売買媒介報酬・特別調査実費は適法としても、アの居住用賃貸借には借主Bからの受領額と事前承諾の有無に問題がある。したがって==ア×・イ○・ウ○==となり、三つすべてを適法とする肢4は排除される。報酬額だけでなく誰から承諾を得たかも必要な情報である。","choice_4_corrected_statement":"UNKNOWN","choice_4_legal_basis":"肢別の法令照合待ち。関連出典：宅地建物取引業法46条／国土交通省 宅地建物取引業者が受け取る報酬の額（告示）","choice_4_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。イ・ウは適法ですが、アを含む全て適法とはいえません。 具体的な要件は出題当時の関連条文で確認する。"},{"question_id":"2024-Q29","year":2024,"session":"通常","question_no":29,"major_field":"宅建業法","section":"宅地建物取引業法","unit":"宅建士証","topic":"宅地建物取引士証","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"宅地建物取引士に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","choice_1":"宅地建物取引士資格試験に合格した者は、宅地又は建物の取引に関する実務の経験期間が2 年に満たない場合であっても、試験に合格した日から1 年以内に登録を受けようとするときには、都道府県知事が指定する講習を受講することにより、宅地建物取引士の登録を受けることができる。","choice_2":"宅地建物取引士証は、更新を受けることなくその有効期間が経過した場合、その効力を失うが、当該宅地建物取引士証を都道府県知事に返納する必要はない。","choice_3":"宅地建物取引士は、他人に自己の名義の使用を許し、当該他人がその名義で宅地建物取引士である旨の表示をしたときは、法第68 条の規定に基づく処分の対象となるが、当該他人が宅地建物取引士の登録を受けた者であるときはこの限りでない。","choice_4":"宅地建物取引業者は、その事務所唯一の専任の宅地建物取引士が宅地建物取引士証の有効期間の経過により効力を失い宅地建物取引士でなくなったときは、2 週間以内に法第31 条の3 第1 項の規定に適合させるため必要な措置を執らなければならない。","official_accepted_answers":"4","answer_conclusion":"唯一の《専任宅建士の資格証が失効》したら、業者は2週間以内に法定員数を満たす措置が必要です。","answer_reason":"唯一の《==専任宅建士の資格証が失効==》したら、業者は2週間以内に法定員数を満たす措置が必要です。","scoring_exception_note":"","deep_lecture":"宅建士資格試験合格→登録→宅建士証の交付→5年ごとの更新と、業者の専任宅建士設置義務は別段階です。従業者5人に1人以上の専任宅建士が原則で、欠員時は2週間以内の補充等が必要です。\n\n【単元の見取り図・補足講義】宅建士の登録、取引士証の交付、更新、法定講習は別の段階。交付済の宅建士証の有効期間と事務手続を区別して覚える。 変更届が必要な登録事項と、取引士証の返納・提示・更新講習の条件を整理する。\n\n【本問の四肢を使った比較】【肢1：誤りを含む記述】誤り。登録に必要な実務経験2年がない場合、登録実務講習等の所定要件が問題です。「試験合格から1年以内の講習」だけで当然登録とはなりません。 【肢2：誤りを含む記述】誤り。宅建士証が期限切れで効力を失った場合は、速やかに返納しなければなりません。 【肢3：誤りを含む記述】誤り。名義貸しは禁止され、相手が登録を受けた宅建士であるか否かによって当然許されるわけではありません。 【肢4：正しい方向の記述】正しい。唯一の専任宅建士を欠く状態になった事務所は2週間以内に必要な措置を取らなければなりません。\n\n【設問で判断を練習する】正解につながる肢の焦点は「宅地建物取引業者は、その事務所唯一の専任の宅地建物取引士が宅地建物取引士証の有効期間の経過…」。正しい。唯一の専任宅建士を欠く状態になった事務所は2週間以内に必要な措置を取らなければなりません。一方、「宅地建物取引士資格試験に合格した者は」を論じる肢では「誤り。登録に必要な実務経験2年がない場合、登録実務講習等の所定要件が問題です」という別の結論が問題となる。","system_purpose":"【学習補助】宅建士証の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:変更届が必要な登録事項と、取引士証]]の返納・提示・更新講習の条件を整理する。","comparative_explanation":"【本問で混同しやすい区別】変更届が必要な登録事項と、取引士証の返納・提示・更新講習の条件を整理する。","important_points":"《専任宅建士＝従業者5人に1人以上》／《不足したら2週間以内》／《名義貸し禁止》。\n【判定の軸】変更届が必要な登録事項と、取引士証の返納・提示・更新講習の条件を整理する。","trick_patterns":"「[[WARN:試験合格だけで宅建士になる]]」「宅建士証の更新は任意」という誤解を避ける。","memory_summary":"唯一の《専任宅建士の資格証が失効》したら、業者は2週間以内に法定員数を満たす措置が必要です。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 4番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 変更届が必要な登録事項と、取引士証の返納・提示・更新講習の条件を整理する。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"宅地建物取引業法18条・22条の2・31条の3・68条","marker_yellow_spans":"専任宅建士の資格証が失効","marker_red_spans":"試験合格だけで宅建士になる","marker_blue_spans":"変更届が必要な登録事項と、取引士証","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"UNKNOWN","choice_1_reason":"誤り。登録に必要な実務経験2年がない ら売主となり相手方が非業者のときは手付額や損害賠償額の予定などに特別な制限がある。 手付解除は相手方が履行に着手するまでの原則と、解約手付としての扱いを分ける。\n\n【本問の四肢を使った比較】【肢1：正しい方向の記述】正しい。告知書面には業者の名称・住所・免許番号等が必要ですが、宅建士の記名を必ず要するわけではありません。 【肢2：正しい方向の記述】正しい。買主の申出による買主勤務先での申込み等は法定の除外場所となり、クーリング・オフできない場合があります。 【肢3：正しい方向の記述】正しい。買主が申し出た喫茶店は、買主の自宅・勤務先のような除外場所には通常当たりません。 【肢4：誤りを含む記述】誤り。一般の銀行で申込み・契約をしただけでは、買主の申出による場所でもクーリング・オフを排除できる法定場所には該当しません。\n\n【設問で判断を練習する】正解につながる肢の焦点は「Ｂは、自らの申出により、Ｂが融資を受ける銀行（宅地建物取引業者ではない」。誤り。一般の銀行で申込み・契約をしただけでは、買主の申出による場所でもクーリング・オフを排除できる法定場所には該当しません。一方、「Ａがクーリング・オフについて告げるときに交付すべき書面には」を論じる肢では「正しい。告知書面には業者の名称・住所・免許番号等が必要ですが、宅建士の記名を必ず要するわけではありません」という別の結論が問題となる。","system_purpose":"【学習補助】手付制限の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:手付解除は相手方が履行に着手するま]]での原則と、解約手付としての扱いを分ける。","comparative_explanation":"【本問で混同しやすい区別】手付解除は相手方が履行に着手するまでの原則と、解約手付としての扱いを分ける。","important_points":"《事務所等ではクーリング・オフ不可》／《買主申出の自宅・勤務先は除外》／《喫茶店・銀行は原則対象》。","trick_patterns":"契約の場所だけではなく《買受け申込みの場所と経緯》も確認。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《買主が自ら申し出た銀行での契約》はクーリング・オフ除外の法定場所とは限りません。肢4が誤りです。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 4番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 手付解除は相手方が履行に着手するまでの原則と、解約手付としての扱いを分ける。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"宅地建物取引業法37条の2・[[NOTE:施行]]規則16条の5","marker_yellow_spans":"買主が自ら申し出た銀行での契約","marker_red_spans":"誤り","marker_blue_spans":"手付解除は相手方が履行に着手するま","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_questio は該当しません。\n原文の「Ｂは、自らの申出により、Ｂが融資を受ける銀行（宅地建物取引業者ではない」という断定を、そのまま一般原則として受け入れてはいけない。未検証の修正文案では「一般の銀行で申込み・契約をしただけでは、買主の申出による場所でもクーリング・オフを排除できる法定場所には該当しません」であり、原文との違いを比べて制度の適用範囲を判断する。【理解を深める】宅建業法37条の2は業者売主・非業者買主の取引について、原則として事務所等以外での申込みを対象とします。買主の自宅・勤務先に買主の申出で出向く場合は除外ですが、銀行・喫茶店は別です。\n比較対象の肢1では「Ａがクーリング・オフについて告げるときに交付すべき書面には」が論点となる。正しい。告知書面には業者の名称・住所・免許番号等が必要ですが、宅建士の記名を必ず要するわけではありません。","choice_4_corrected_statement":"【修正文案・独立照合待ち】一般の銀行で申込み・契約をしただけでは、買主の申出による場所でもクーリング・オフを排除できる法定場所には該当しません。","choice_4_legal_basis":"肢別の法令照合待ち。関連出典：宅地建物取引業法37条の2・施行規則16条の5","choice_4_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。一般の銀行で申込み・契約をしただけでは、買主の申出による場所でもクーリング・オフを排除できる法定場所には該当しません。 具体的な要件は出題当時の関連条文で確認する。"},{"question_id":"2024-Q31","year":2024,"session":"通常","question_no":31,"major_field":"宅建業法","section":"宅地建物取引業法","unit":"監督処分","topic":"監督処分・罰則","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","choice_1":"国土交通大臣又は都道府県知事は、その免許を受けた宅地建物取引業者が法第65 条第1項の規定による指示に従わない場合、その業務の全部又は一部の停止を命ずることができ、業務の停止の処分に違反した場合、免許を取り消さなければならない。","choice_2":"国土交通大臣又は都道府県知事は、その免許を受けた宅地建物取引業者の事務所の所在地を確知できないときは、その事実を公告し、その公告の日から2 週間を経過しても当該宅地建物取引業者から申出がないときは、免許を取り消すことができる。","choice_3":"国土交通大臣又は都道府県知事は、法第66 条の規定による免許の取消しの処分をしようとするときは、聴聞を行わなければならないが、当該聴聞は、公開することが相当と認められる場合を除き、公開されない。","choice_4":"国土交通大臣又は都道府県知事は、法第66 条の規定による免許の取消しの処分をしたときはその旨を公告しなければならないが、法第65 条第2 項の規定による業務の停止の処分をしたときはその旨の公告はしなくともよい。","official_accepted_answers":"1","answer_conclusion":"《指示違反→業務停止可能》《停止命令違反→免許取消し義務》の段階を押さえます。","answer_reason":"《==指示違反→業務停止可能==》《停止命令違反→免許取消し義務》の段階を押さえます。","scoring_exception_note":"","deep_lecture":"監督処分は指示→業務停止→免許取消しと強まる場合がありますが、事由によって直ちに取消しが必要なものもあります。対象・聴聞・公告の手続を横断して整理します。\n\n【単元の見取り図・補足講義】宅建業法違反の監督処分には指示処分・業務停止処分・免許取消し等があり、行政上の処分と刑事罰は区別する。 公示・聴聞・処分権者・事実の重大さによって結論が変わる。違反があれば直ちに必ず免許取消しとなるわけではない。\n\n【本問の四肢を使った比較】【肢1：正しい方向の記述】正しい。指示処分に従わない場合は業務停止命令が可能で、業務停止命令に違反した場合は必要的免許取消しとなります。 【肢2：誤りを含む記述】誤り。所在不明による公告後の期間は2週間ではなく30日です。 【肢3：誤りを含む記述】誤り。免許取消し等のための聴聞は原則公開であり、非公開が通常ではありません。 【肢4：誤りを含む記述】誤り。免許取消しだけでなく業務停止処分についても所定の公告が必要です。\n\n【設問で判断を練習する】正解につながる肢の焦点は「国土交通大臣又は都道府県知事は」。正しい。指示処分に従わない場合は業務停止命令が可能で、業務停止命令に違反した場合は必要的免許取消しとなります。一方、「国土交通大臣又は都道府県知事は」を論じる肢では「誤り。免許取消しだけでなく業務停止処分についても所定の公告が必要です」という別の結論が問題となる。","system_purpose":"【学習補助】監督処分の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:公示・聴聞・処分権者・事実の重大さ]]によって結論が変わる。違反があれば直ちに必ず免許取消しとなるわけではない。","comparative_explanation":"【本問で混同しやすい区別】公示・聴聞・処分権者・事実の重大さによって結論が変わる。違反があれば直ちに必ず免許取消しとなるわけではない。","important_points":"《所在不明公告→30日》／《取消し聴聞＝原則公開》／《停止処分も公告》。\n【判定の軸】公示・聴聞・処分権者・事実の重大さによって結論が変わる。違反があれば直ちに必ず免許取消しとなるわけではない。","trick_patterns":"「[[WARN:できる（裁量）]]」と「しなければならない（義務）」に注目。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《指示違反→業務停止可能》《停止命令違反→免許取消し義務》の段階を押さえます。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 1番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 公示・聴聞・処分権者・事実の重大さによって結論が変わる。違反があれば直ちに必ず免許取消しとなるわけではない。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"宅地建物取引業法65条・66条・67条","marker_yellow_spans":"指示違反→業務停止可能","marker_red_spans":"できる（裁量）","marker_blue_spans":"公示・聴聞・処分権者・事実の重大さ","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"true","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。指示処分に従わない場合は業務停止命令が可能で、業務停止命令に違反した場合は必要的免許取消しとなります。\n原文の「国土交通大臣又は都道府県知事は」にある条件が、正誤の判断を左右する。【理解を深める】宅建業法違反の監督処分には指示処分・業務 sion":"通常","question_no":34,"major_field":"宅建業法","section":"宅地建物取引業法","unit":"手付金保全","topic":"手付金等の保全","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"宅地建物取引業者Ａが、自ら売主として、宅地建物取引業者ではない個人Ｂとの間で、土地付建物を4,000 万円で売却する売買契約（所有権の登記は当該土地付建物の引渡し時に行うものとする。）を締結する場合における宅地建物取引業法（以下この問において「法」という。）第41 条又は第41 条の2 の規定に基づく手付金等の保全措置（以下この問において「保全措置」という。）に関する次の記述のうち、誤っているものはどれか。","choice_1":"Ａが、保全措置を講じずにＢから手付金100 万円を受領する場合、その旨を、法第35 条の規定に基づく重要事項説明書に記載する必要があるが、法第37 条の規定により交付する書面に記載する必要はない。","choice_2":"当該建物が建築工事の完了後の建物である場合、ＡがＢから手付金100 万円を受領する際には保全措置は不要であるが、その後、当該土地付建物を引き渡す前に中間金400 万円を受領するためには、手付金100 万円と合わせて保全措置を講じた後でなければ、その中間金を受領することができない。","choice_3":"当該建物が建築工事の完了前の建物である場合において、Ａは、保全措置を講じずに、Ｂから手付金300 万円を受領することができる。","choice_4":"当該土地付建物の引渡し前に、ＢはＡに対して2,000 万円を中間金として支払う契約になっていたが、Ａがその中間金について保全措置を講じていないときは、Ｂはこの中間金の支払いを拒むことができる。","official_accepted_answers":"3","answer_conclusion":"《未完成物件で300万円の手付》は代金4,000万円の5％を超えるため、保全なし受領不可。","answer_reason":"《==未完成物件で300万円の手付==》は代金4,000万円の5％を超えるため、保全なし受領不可。","scoring_exception_note":"","deep_lecture":"業者自ら売主・買主が非宅建業者のケース。未完成5％・1,000万円、完成10％・1,000万円を比べます。保全の要否は手付金だけでなく中間金等との累計受領額で判断します。\n\n【単元の見取り図・補足講義】業者自ら売主の未完成・完成物件について、手付金等の保全措置が必要になる受領額・割合・時点を分ける。 代金に充当する前受金等も対象となり得る。買主が業者の場合や所有権移転登記後の例外も確認する。\n\n【本問の四肢を使った比較】【肢1：正しい方向の記述】正しい。35条書面では手付金等の保全措置の概要が重要事項に関係しますが、37条書面への記載義務とは区別されます。 【肢2：正しい方向の記述】正しい。完成物件では代金4,000万円の10％または1,000万円超の条件に注意。100万円だけなら保全不要でも、合計500万円受領前には保全が必要です。 【肢3：誤りを含む記述】誤り。未完成物件では保全不要の上限が代金5％以下かつ1,000万円以下。300万円は4,000万円の7.5％で、事前保全なしには受領できません。 【肢4：正しい方向の記述】正しい。保全措置が必要なのに講じていない中間金は、買主が支払を拒める場合があります。","system_purpose":"【学習補助】手付金保全の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:代金に充当する前受金等も対象となり]]得る。買主が業者の場合や所有権移転登記後の例外も確認する。","comparative_explanation":"【本問で混同しやすい区別】代金に充当する前受金等も対象となり得る。買主が業者の場合や所有権移転登記後の例外も確認する。","important_points":"《未完成＝5％・1,000万円》《完成＝10％ 宅地建物取引業者Ａが宅地建物取引業法第37 条の規定により交付すべき書面（以下この問において「37 条書面」という。）に記載すべき事項を電磁的方法により提供すること（以下この問において「37 条書面の電磁的方法による提供」という。）に関する次の記述のうち、正しいものはどれか。","choice_1":"Ａが自ら売主として締結する宅地の売買契約において、37 条書面の電磁的方法による提供を行う場合、当該契約の相手方に対し、あらかじめ、電磁的方法による提供に用いる電磁的方法の種類及び内容を宅地建物取引士に説明させなければならない。","choice_2":"Ａが媒介業者として関与する建物賃貸借契約において、37 条書面の電磁的方法による提供を行う場合、その方法は37 条書面の交付に係る宅地建物取引士が明示されるものでなければならない。","choice_3":"Ａが自ら売主として締結する宅地の売買契約において、契約の相手方から37 条書面の電磁的方法による提供を行うことについて書面により承諾を得た場合は、その後に当該契約の相手方から書面で電磁的方法による提供を受けない旨の申出があったときでも、37 条書面の電磁的方法による提供をすることができる。","choice_4":"Ａが媒介業者として関与する宅地の売買契約において、37 条書面の電磁的方法による提供を行う場合であっても、提供後速やかに37 条書面を交付しなければならない。","official_accepted_answers":"2","answer_conclusion":"《37条書面の電子提供》では、書面に記名すべき宅建士が電子的に明示される方式が必要です。","answer_reason":"《==37条書面の電子提供==》では、書面に記名すべき宅建士が電子的に明示される方式が必要です。","scoring_exception_note":"","deep_lecture":"35条・37条書面は相手方の承諾等により電磁的方法で提供可能。ポイントは事前承諾方法・内容保存・出力可能性宅建士の明示。\n\n【単元の見取り図・補足講義】37条書面は契約の成立後、遅滞なく交付するもので、35条の契約前説明とは時点と記載事項が異なる。 電子的方法は法定要件と相手方の承諾が必要で、相手方に無断で紙交付を電子交付に切り替えることはできない。\n\n【本問の四肢を使った比較】【肢1：誤りを含む記述】誤り。電子提供の方法の説明を、必ず宅建士自身にさせる義務とはされていません。 【肢2：正しい方向の記述】正しい。賃貸借の媒介で電子提供を行う場合、37条書面に係る宅建士が明示される必要があります。 【肢3：誤りを含む記述】誤り。相手方が電子提供を拒否する旨の申出をした後は、以前の承諾だけで電子提供を継続できません。 【肢4：誤りを含む記述】誤り。適法な電子提供で書面交付に代えられるので、提供後に必ず紙の37条書面を再交付する必要はありません。\n\n【設問で判断を練習する】正解につながる肢の焦点は「Ａが媒介業者として関与する建物賃貸借契約において」。正しい。賃貸借の媒介で電子提供を行う場合、37条書面に係る宅建士が明示される必要があります。一方、「Ａが自ら売主として締結する宅地の売買契約において」を論じる肢では「誤り。電子提供の方法の説明を、必ず宅建士自身にさせる義務とはされていません」という別の結論が問題となる。","system_purpose":"【学習補助】37条書面の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:電子的方法は法定要件と相手方の承諾]]が必要で、相手方に無断で紙交付を電子交付に切り替えることはできない。","comparative_explanation":"【本問で混同しやすい区別】電子的方法は法定要件と相手方の承諾が必要で、相手方に無断で紙交付を電子交付に切り替えることはできない。","important_points":"《電子提供は相手方の承諾》／《37条書面の宅建士を明示》／《紙の二重交付は[[WARN:不要]]》。","trick_patterns":"電子で提供しても必要記載事項や宅建士に関するルールは消えない。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_ ば、誤っているものはどれか。","choice_1":"宅地建物取引業者で保証協会に加入しようとする者は、その加入しようとする日までに、政令で定める額の弁済業務保証金分担金を当該保証協会に納付しなければならない。","choice_2":"保証協会の社員と宅地建物取引業に関し取引をした者（宅地建物取引業者に該当する者を除く。）は、その取引により生じた債権に関し、当該社員が社員ではないとしたならばその者が供託すべき営業保証金の額に相当する額の範囲内で弁済を受ける権利を有する。","choice_3":"宅地建物取引業者は、保証協会の社員の地位を失ったときは、保証協会が弁済業務保証金の還付請求権者に対し、一定期間内に宅地建物取引業法第64 条の8 第2 項の規定による認証を受けるため申し出るべき旨の公告をした後でなければ、弁済業務保証金分担金の返還を受けることができない。","choice_4":"宅地建物取引業者は、一部の事務所を廃止し営業保証金を取り戻そうとする場合には、供託した営業保証金につき還付を請求する権利を有する者に対し、公告をすることなく営業保証金を取り戻すことができる。","official_accepted_answers":"4","answer_conclusion":"《営業保証金の一部取戻し》は原則として公告手続が必要。肢4の「公告なく」は誤りです。","answer_reason":"《==営業保証金の一部取戻し==》は原則として公告手続が必要。肢4の「公告なく」は誤りです。","scoring_exception_note":"","deep_lecture":"営業保証金の取戻しは、取引相手方の弁済を確保するための手続を経ます。一方、保証協会制度では弁済業務保証金と社員が支払う分担金の流れを区別します。\n\n【単元の見取り図・補足講義】営業保証金は取引の相手方を保護する制度。供託場所・額・事務所増設時の追加供託、有価証券の評価が出題される。 宅地建物取引業保証協会の弁済業務保証金分担金と、業者自身が供託する営業保証金のしくみを混同しない。\n\n【本問の四肢を使った比較】【肢1：正しい方向の記述】正しい。保証協会加入者は加入日までに所定の弁済業務保証金分担金を納付します。 【肢2：正しい方向の記述】正しい。保証協会社員との宅建取引で生じた一定の債権は、相手が宅建業者でない場合に弁済対象となります。 【肢3：正しい方向の記述】正しい。社員資格を失った場合、保証協会による認証申出を促す公告を経た後で分担金が返還されます。 【肢4：誤りを含む記述】誤り。一部事務所廃止による営業保証金の取戻しでは、原則所定の公告手続が必要です。公告不要と一律にはいえません。\n\n【設問で判断を練習する】正解につながる肢の焦点は「宅地建物取引業者は、一部の事務所を廃止し営業保証金を取り戻そうとする場合には」。誤り。一部事務所廃止による営業保証金の取戻しでは、原則所定の公告手続が必要です。公告不要と一律にはいえません。一方、「宅地建物取引業者で保証協会に加入しようとする者は」を論じる肢では「正しい。保証協会加入者は加入日までに所定の弁済業務保証金分担金を納付します」という別の結論が問題となる。","system_purpose":"【学習補助】保証協会の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:宅地建物取引業保証協会の弁済業務保]]証金分担金と、業者自身が供託する営業保証金のしくみを混同しない。","comparative_explanation":"【本問で混同しやすい区別】宅地建物取引業保証協会の弁済業務保証金分担金と、業者自身が供託する営業保証金のしくみを混同しない。","important_points":"《営業保証金の取戻し＝原則公告》／《保証協会の分担金返還も公告等》。\n【判定の軸】宅地建物取引業保証協会の弁済業務保証金分担金と、業者自身が供託する営業保証金のしくみを混同しない。","trick_patterns":"「[[WARN:事務所を減らせば直ちに自由に取り戻せる]]」と考えない。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《営業保証金の一部取戻し》は原則として公告手続が必要。肢4の ない。ウ　宅地の売買を行う場合、宅地の造成に関する工事の完了前のものであるときは、完了時における当該宅地に接する道路の構造及び幅員を説明しなければならない。エ　建物の貸借の媒介を行う場合、私道に関する負担の有無や内容を事前に調査し、説明しなければならない。","choice_1":"一つ","choice_2":"二つ","choice_3":"三つ","choice_4":"四つ","official_accepted_answers":"3","answer_conclusion":"《35条説明で正しいのはア・イ・ウの3つ》。建物の貸借では、私道負担について一律に35条の説明事項とはなりません。","answer_reason":"《==35条説明で正しいのはア・イ・ウの3つ==》。建物の貸借では、私道負担について一律に35条の説明事項とはなりません。","scoring_exception_note":"","deep_lecture":"水害ハザードマップは提供されているものに所在地を示す説明が必要。既存住宅の建物状況調査は売買等での説明事項、未完成宅地の接道計画も重要。エの「私道負担」は宅地の取引では重要でも、建物貸借では法律上の35条説明事項の範囲が異なります。\n\n【単元の見取り図・補足講義】宅地建物取引業法35条の重要事項説明は、契約の成立前に、宅建士が購入・賃借の判断に必要な情報を提供する制度。37条書面は契約成立後の内容確認書面。 説明者が宅建士であることと事務所の専任宅建士であることは別。対象物件の種類や取引形態に応じて説明事項が変わる。\n\n【本問の四肢を使った比較】【肢1：選択肢の構成要素の検討が必要】誤り。「一つ」ではありません。ア・イ・ウの3つが正しいためです。 【肢2：選択肢の構成要素の検討が必要】誤り。「二つ」ではありません。建物状況調査と未完成宅地の道路情報も説明事項です。 【肢3：選択肢の構成要素の検討が必要】正しい。ア＝水害ハザードマップでの所在地、イ＝所定期間内の建物状況調査、ウ＝造成完了時の道路の構造・幅員が正しく、エ＝建物貸借の私道負担説明を義務化する記述は誤りです。 【肢4：選択肢の構成要素の検討が必要】誤り。「四つ」ではありません。エが誤りです。","system_purpose":"【学習補助】重要事項説明の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:説明者が宅建士であることと事務所の]]専任宅建士であることは別。対象物件の種類や取引形態に応じて説明事項が変わる。","comparative_explanation":"【本問で混同しやすい区別】説明者が宅建士であることと事務所の専任宅建士であることは別。対象物件の種類や取引形態に応じて説明事項が変わる。","important_points":"《ア○・イ○・ウ○・エ×》／《宅地売買・建物売買・建物貸借で35条対象が違う》。\n【判定の軸】説明者が宅建士であることと事務所の専任宅建士であることは別。対象物件の種類や取引形態に応じて説明事項が変わる。","trick_patterns":"重要事項を「[[WARN:全種類の契約で同じ]]」と暗記しない。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《35条説明で正しいのはア・イ・ウの3つ》。建物の貸借では、私道負担について一律に35条の説明事項とはなりません。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 3番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 説明者が宅建士であることと事務所の専任宅建士であることは別。対象物件の種類や取引形態に応じて説明事項が変わる。","substatement_reasoning":"ア〜エの各記述について、35条説明の対象物件・取引形態・義務者を個別に確認する必要があります。現在の短文解説だけでは構成要素別判定の裏づけが十分でないため、独立確認待ち。","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"", り。知事免許の業者でも、事務所を置いていない他県の物件を媒介することはできます。免許換えは事務所の所在が変わった場合の問題です。 【肢4：正しい方向の記述】正しい。免許更新に条件を付すことが可能で、条件違反は法定の免許取消し事由となります。\n\n【設問で判断を練習する】正解につながる肢の焦点は「宅地建物取引業者Ｅ（丙県知事免許）の免許の更新に当たって」。正しい。免許更新に条件を付すことが可能で、条件違反は法定の免許取消し事由となります。一方、「宅地建物取引業者Ａが、免許の更新の申請をした場合において」を論じる肢では「誤り。有効期間内に更新申請して審査未了の場合、従前の免許は結果が出るまで効力を維持する扱いです」という別の結論が問題となる。","system_purpose":"【学習補助】免許の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:事務所数ではなく所在する都道府県数]]が免許権者の決定に関係する。","comparative_explanation":"【本問で混同しやすい区別】事務所数ではなく所在する都道府県数が免許権者の決定に関係する。","important_points":"《更新審査中も従前免許が継続》／《名義貸し禁止》／《別県の物件媒介は可能》。\n【判定の軸】事務所数ではなく所在する都道府県数が免許権者の決定に関係する。","trick_patterns":"「[[WARN:物件の県＝免許の県]]」という勘違いが頻出。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《免許更新時の条件違反》は免許取消し事由になり得ます。正解は4です。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 4番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 事務所数ではなく所在する都道府県数が免許権者の決定に関係する。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"宅地建物取引業法3条・3条の2・7条・13条・66条","marker_yellow_spans":"免許更新時の条件違反","marker_red_spans":"物件の県＝免許の県","marker_blue_spans":"事務所数ではなく所在する都道府県数","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"UNKNOWN","choice_1_reason":"誤り。有効期間内に更新申請して審査未了の場合、従前の免許は結果が出るまで効力を維持する扱いです。\n原文の「宅地建物取引業者Ａが、免許の更新の申請をした場合において」という断定を、そのまま一般原則として受け入れてはいけない。未検証の修正文案では「有効期間内に更新申請して審査未了の場合、従前の免許は結果が出るまで効力を維持する扱いです」 り。開始10日前の届出は所在地を管轄する知事だけでなく、免許権者である大臣・知事にも必要です。\n\n【設問で判断を練習する】正解につながる肢の焦点は「届出をすべき場所として、宅地建物取引業者が業務に関し展示会その他これに類する催しを実施する…」。誤り。開始10日前の届出は所在地を管轄する知事だけでなく、免許権者である大臣・知事にも必要です。一方、「届出をすべき場所として、継続的に業務を行うことができる施設を有する場合で事務所以外のものが…」を論じる肢では「正しい。契約・申込みを取り扱う一定の案内所等では成年者である専任宅建士1人以上の設置義務があります」という別の結論が問題となる。","system_purpose":"【学習補助】事務所の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:事務所に当たるか、案内所等に当たる]]かで手続や設置義務が異なる。","comparative_explanation":"【本問で混同しやすい区別】事務所に当たるか、案内所等に当たるかで手続や設置義務が異なる。","important_points":"《案内所の届出＝10日前》／《所在地知事＋免許権者》／《専任宅建士1人以上》。\n【判定の軸】事務所に当たるか、案内所等に当たるかで手続や設置義務が異なる。","trick_patterns":"[[WARN:届出先を所在地知事だけに限定しない]]。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《案内所等の届出》は、所定期限までに所在地知事と免許権者等の両方に必要です。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 4番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 事務所に当たるか、案内所等に当たるかで手続や設置義務が異なる。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"宅地建物取引業法31条の3・37条の2・50条","marker_yellow_spans":"案内所等の届出","marker_red_spans":"届出先を所在地知事だけに限定しない","marker_blue_spans":"事務所に当たるか、案内所等に当たる","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"false","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。契約・申込みを取り扱う一定の案内所等では成年者である専任宅建士1人以上の設置義務があります。\n原文の「届出をすべき場所として、継続的に業務を行うことができる施設を有する場合で事務所以外のものが…」にある条件が、正誤の判断を左右する。【理解を深める】事務所等では専任宅建士の設置、標識、従業者名簿等の規制がある。専任者の不足が生じた場合の是正期限に注意する。\n比較対象の肢2では「届 合、当該建物が住宅の品質確保の促進等に関する法律第5 条第1 項に規定する住宅性能評価を受けた新築住宅であるときは、その旨を説明しなければならない。エ　宅地の売買の媒介を行う場合、当該宅地が急傾斜地の崩壊による災害の防止に関する法律第3 条の規定に基づく急傾斜地崩壊危険区域内にあることは説明しなければならないが、当該区域内における行為の制限の概要については説明しなくてもよい。","choice_1":"一つ","choice_2":"二つ","choice_3":"三つ","choice_4":"なし","official_accepted_answers":"1","answer_conclusion":"《35条で正しいのはイだけ》。抵当権の登記は抹消予定でも説明が必要、危険区域の行為制限も説明対象です。","answer_reason":"《==35条で正しいのはイだけ==》。抵当権の登記は抹消予定でも説明が必要、危険区域の行為制限も説明対象です。","scoring_exception_note":"","deep_lecture":"ア（誤）抹消予定でも登記された権利を説明。イ（正）借地終了時の建物取壊しの定めを説明。ウ（誤）住宅性能評価の新築住宅である旨の説明は建物の貸借には要求されない。エ（誤）災害危険区域の制限内容まで説明。\n\n【単元の見取り図・補足講義】宅地建物取引業法35条の重要事項説明は、契約の成立前に、宅建士が購入・賃借の判断に必要な情報を提供する制度。37条書面は契約成立後の内容確認書面。 説明者が宅建士であることと事務所の専任宅建士であることは別。対象物件の種類や取引形態に応じて説明事項が変わる。\n\n【本問の四肢を使った比較】【肢1：選択肢の構成要素の検討が必要】正しい。ア×：抹消予定の抵当権でも説明対象。イ○：借地契約終了時の建物取壊しの定めは説明対象。ウ×：住宅性能評価の説明は建物貸借では必須対象外。エ×：急傾斜地崩壊危険区域内の行為制限の概要も説明対象。 【肢2：選択肢の構成要素の検討が必要】誤り。「二つ」ではありません。ア・ウ・エは説明義務に関する対象・範囲を誤っています。 【肢3：選択肢の構成要素の検討が必要】誤り。「三つ」ではありません。アは抵当権の抹消予定だけで説明を省略できない点が誤りです。 【肢4：選択肢の構成要素の検討が必要】誤り。「なし」ではありません。イは契約終了時の建物取壊しに関する定めの説明が必要なので正しいです。","system_purpose":"【学習補助】重要事項説明の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:説明者が宅建士であることと事務所の]]専任宅建士であることは別。対象物件の種類や取引形態に応じて説明事項が変わる。","comparative_explanation":"【本問で混同しやすい区別】説明者が宅建士であることと事務所の専任宅建士であることは別。対象物件の種類や取引形態に応じて説明事項が変わる。","important_points":"《ア×・イ○・ウ×・エ×》／《抵当権は抹消予定でも説明》／《法令制限は概要まで》。\n【判定の軸】説明者が宅建士であることと事務所の専任宅建士であることは別。対象物件の種類や取引形態に応じて説明事項が変わる。","trick_patterns":"「[[WARN:契約までに解決予定]]」という将来の見込みだけで説明省略をしない。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《35条で正しいのはイだけ》。抵当権の登記は抹消予定でも説明が必要、危険区域の行為制限も説明対象です。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 1番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 説明者が宅建士であることと事務所の専任宅建士であることは別。対象物件の種類や取引形態に応じて説明事項が変わる。","substatement_reasoning":"構成要素の正誤判定は未照合です。既存解説は組合せの選択肢に対する説明であり、ア〜エ等の独立検証ではありません。","reform_status":"review_required", 行為は、契約後の37条書面で正しく書けば免責されるわけではありません。","scoring_exception_note":"","deep_lecture":"告知の判断は売買か賃貸か自然死か否か特殊清掃の有無経過期間買主・借主から質問があったかで変わります。心理的瑕疵については国交省ガイドラインを確認。\n\n【単元の見取り図・補足講義】守秘義務、帳簿・名簿・標識など業務管理の義務は、誰に対して、どの期間、どの場所で対応するかを確認する。 従業者名簿と業務帳簿の保存期間、退職後の守秘義務、掲示の主体をそれぞれ分ける。\n\n【本問の四肢を使った比較】【肢1：正しい方向の記述】正しい。利益が確実に得られると誤信させる断定的判断の提供は禁止されています。 【肢2：誤りを含む記述】誤り。引渡時期について故意に不実を告げる勧誘は規制対象。契約成立後に正しい37条書面を出しても違反がなくなるわけではありません。 【肢3：正しい方向の記述】正しい。通常の自然死等は、特殊清掃・大規模改修など特段の事情がなければ原則告知不要とされます。 【肢4：正しい方向の記述】正しい。賃貸取引では、自然死等以外の死も発覚から概ね3年経過後は、特段の事情がない限り原則告知不要とする取扱いがあります。\n\n【設問で判断を練習する】正解につながる肢の焦点は「宅地建物取引業者は、宅地又は建物の売買の契約の締結の勧誘をするに際し」。誤り。引渡時期について故意に不実を告げる勧誘は規制対象。契約成立後に正しい37条書面を出しても違反がなくなるわけではありません。一方、「宅地建物取引業者は、宅地建物取引業に係る契約の締結の勧誘をするに際し」を論じる肢では「正しい。利益が確実に得られると誤信させる断定的判断の提供は禁止されています」という別の結論が問題となる。","system_purpose":"【学習補助】業務上の規制の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:従業者名簿と業務帳簿の保存期間、退]]職後の守秘義務、掲示の主体をそれぞれ分ける。","comparative_explanation":"【本問で混同しやすい区別】従業者名簿と業務帳簿の保存期間、退職後の守秘義務、掲示の主体をそれぞれ分ける。","important_points":"《故意の不実告知は後日の訂正だけで帳消しにならない》／《賃貸の概ね3年ルール》。\n【判定の軸】従業者名簿と業務帳簿の保存期間、退職後の守秘義務、掲示の主体をそれぞれ分ける。","trick_patterns":"人の死の告知は全案件で[[WARN:一律]]3年、というわけではありません。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《引渡時期を故意に偽って勧誘》する行為は、契約後の37条書面で正しく書けば免責されるわけではありません。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 2番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 従業者名簿と業務帳簿の保存期間、退職後の守秘義務、掲示の主体をそれぞれ分ける。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"宅地建物取引業法47条／国土交通省 宅地建物取引業者による人の死の告知に関するガイドライン","marker_yellow_spans":"引渡時期を故意に偽って勧誘","marker_red_spans":"一律","marker_blue_spans":"従業者名簿と業務帳簿の保存期間、退","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはRE 習の条件を整理する。\n\n【本問の四肢を使った比較】【肢1：正しい方向の記述】正しい。登録者の住所が変われば、宅建士証の交付を受けていない登録者も変更登録の申請が必要です。 【肢2：正しい方向の記述】正しい。宅建士の信用・品位を損なう行為の禁止には、職務と直接関係しない私的な行為も含まれ得ます。 【肢3：正しい方向の記述】正しい。所定の方法で宅建士証の住所欄をシール等により覆って提示する運用が認められています。 【肢4：誤りを含む記述】誤り。宅建士証の氏名に旧姓を併記することができ、現姓のみとする義務はありません。\n\n【設問で判断を練習する】正解につながる肢の焦点は「宅地建物取引士証に記載される宅地建物取引士の氏名については現姓を用いなければならず」。誤り。宅建士証の氏名に旧姓を併記することができ、現姓のみとする義務はありません。一方、「宅地建物取引士の登録を受けている者は」を論じる肢では「正しい。登録者の住所が変われば、宅建士証の交付を受けていない登録者も変更登録の申請が必要です」という別の結論が問題となる。","system_purpose":"【学習補助】宅建士証の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:変更届が必要な登録事項と、取引士証]]の返納・提示・更新講習の条件を整理する。","comparative_explanation":"【本問で混同しやすい区別】変更届が必要な登録事項と、取引士証の返納・提示・更新講習の条件を整理する。","important_points":"《登録事項変更→変更登録》／《旧姓併記可》／《宅建士証の提示義務》。\n【判定の軸】変更届が必要な登録事項と、取引士証の返納・提示・更新講習の条件を整理する。","trick_patterns":"「[[WARN:変更届は宅建士証を持つ者だけ]]」という限定に注意。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"宅建士証には《旧姓併記》も認められているため「現姓しか使えない」が誤りです。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 4番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 変更届が必要な登録事項と、取引士証の返納・提示・更新講習の条件を整理する。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"宅地建物取引業法20条・22条の2・15条の2","marker_yellow_spans":"旧姓併記","marker_red_spans":"変更届は宅建士証を持つ者だけ","marker_blue_spans":"変更届が必要な登録事項と、取引士証","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"false","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。登 う別の結論が問題となる。","system_purpose":"【学習補助】重要事項説明の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:説明者が宅建士であることと事務所の]]専任宅建士であることは別。対象物件の種類や取引形態に応じて説明事項が変わる。","comparative_explanation":"【本問で混同しやすい区別】説明者が宅建士であることと事務所の専任宅建士であることは別。対象物件の種類や取引形態に応じて説明事項が変わる。","important_points":"《未完成建物の表示には図面利用可》／《業者間でも37条書面》／《当事者同意でも必須事項省略不可》。","trick_patterns":"[[WARN:図面による補完と]]、事項そのものの省略は違う。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《未完成建物の特定表示》は、35条説明に使用した図面を37条書面の一部として交付する方法が認められます。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 1番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 説明者が宅建士であることと事務所の専任宅建士であることは別。対象物件の種類や取引形態に応じて説明事項が変わる。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"宅地建物取引業法37条","marker_yellow_spans":"未完成建物の特定表示","marker_red_spans":"図面による補完と","marker_blue_spans":"説明者が宅建士であることと事務所の","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"true","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。未完成建物について35条説明で使った図面等を交付して、37条書面に必要な物件表示を補う方法は認められます。\n原文の「Ａは、建築工事完了前の建物の売買契約を媒介したときに」にある条件が、正誤の判断を左右する。【理解を深める】宅地建物取引業法35条の重要事項説明は、契約の成立前に、宅建士が購入・賃借の判断に必要な情報を提供する制度。37条書面は契約成立後の内容確認書面。\n比較対象の肢2では「Ａは、貸主Ｂと借主Ｃとの間で締結された建物の賃貸借契約を媒介したときに、借賃の額」が論点となる。誤り。借賃の額・支払時期・方法は37条書面の記載義務で、当事者の承諾があっても省略できません。","choice_1_corrected_statement":"原文どおりで正しい","choice_1_legal_basis":"肢別の法令照合待ち。関連出典：宅地建物取引業法37条","choice_1_exam_tip":"本肢ではこの肢の主張する主体・時期・条件 の法令照合待ち。関連出典：国土交通省 宅地防災マニュアル／盛土規制法関連技術基準","choice_2_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。高さが2m以下でも水が溜まれば土圧増加や倒壊が起こり得ます。排水対策を不要とはいえません。 具体的な要件は出題当時の関連条文で確認する。","choice_3_truth":"true","choice_3_is_exam_answer":"false","choice_3_wrong_part":"UNKNOWN","choice_3_reason":"適当。重力式擁壁はコンクリートなどの自重で背面からの土圧に抵抗します。\n原文の「重力式擁壁は、擁壁の自重により、背面からの土圧に抵抗するコンクリート構造物である」にある条件が、正誤の判断を左右する。【理解を深める】擁壁高さが低くても排水必要／重力式＝自重で土圧に抵抗。\n比較対象の肢4では「工場跡地や埋立地などでは、重金属や揮発性有機化合物などによる土壌汚染が問題となることがある」が論点となる。適当。工場跡地・埋立地には重金属・揮発性有機化合物による土壌汚染リスクがあります。","choice_3_corrected_statement":"UNKNOWN","choice_3_legal_basis":"肢別の法令照合待ち。関連出典：国土交通省 宅地防災マニュアル／盛土規制法関連技術基準","choice_3_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。重力式擁壁はコンクリートなどの自重で背面からの土圧に抵抗します。 具体的な要件は出題当時の関連条文で確認する。","choice_4_truth":"true","choice_4_is_exam_answer":"false","choice_4_wrong_part":"UNKNOWN","choice_4_reason":"適当。工場跡地・埋立地には重金属・揮発性有機化合物による土壌汚染リスクがあります。\n原文の「工場跡地や埋立地などでは、重金属や揮発性有機化合物などによる土壌汚染が問題となることがある」にある条件が、正誤の判断を左右する。【理解を深める】擁壁には重力式L型逆T型などがあり、背面水の排除が耐久性を左右します。盛土や地下水を考慮した地盤調査が必要。\n比較対象の肢1では「30 度以上の角度をなす斜面を背後に控える宅地は」が論点となる。適当。30度以上の急斜面の背後地では崖崩れ対策や擁壁等が必要になる場合があります。","choice_4_corrected_statement":"UNKNOWN","choice_4_legal_basis":"肢別の法令照合待ち。関連出典：国土交通省 宅地防災マニュアル／盛土規制法関連技術基準","choice_4_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。工場跡地・埋立地には重金属・揮発性有機化合物による土壌汚染リスクがあります。 具体的な要件は出題当時の関連条文で確認する。"},{"question_id":"2024-Q50","year":2024,"session":"通常","question_no":50,"major_field":"税・その他","section":"建物","unit":"5問免除・建物","topic":"建物の構造・設備","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"建物の構造に関する次の記述のうち、最も不適当なものはどれか。","choice_1":"ラーメン構造は、柱を鉛直方向、梁 を水平方向に配置し、接合部を強く固めた構造である。","choice_2":"ブレース構造は、柱や梁などで構成された四角形の対角線上に部材を入れた構造である。","choice_3":"ブレース構造は、骨組全てに用いることが多く、ラーメン構造など他の構造と併用することはない。","choice_4":"壁式構造は、板状の壁と床を箱形に組み、建物とする構造で、原則として、柱や梁 は用いない。","official_accepted_answers":"3","answer_conclusion":"《ブレース構造》はラーメン構造と併用されることもあります。「併用しない」が誤り。","answer_reason":"《==ブレース構造==》はラーメン構造と併用されることもあります。「併用しない」が誤り。","scoring_exception_note":"","deep_lecture":"地震や風の力に対して建物のどの部材が抵抗するかを理解すると、建物構造の4択は単なる名称暗記ではなくなる。ラーメン構造は柱と梁を剛接合し、骨組の曲げ抵抗を活用する。ブレース構造は斜材を使い、引張り・圧縮などの軸方向の力によって骨組の変形を抑える。壁式構造は壁と床を箱形に組み、耐力壁などの面状部材が建物の力を支える方式である。==ラーメン＝剛接合==、==ブレース＝斜材==、==壁式＝壁と床==を最初に整理する。ここで重要なのは三つの方式が互いに排他的な分類ではないこと。実際の構造計画では、ブレースをラーメン架構の一部に設けるなど、複数の抵抗機構を併用することがある。したがって肢3の[[WARN:他の構造と併用することはない]]という断定は不適当となる。ラーメン構造では骨組の接合部と部材の曲げ挙動、ブレース構造では斜材の配置と軸力、壁式構造では耐力壁の配置や開口部を考えると違いが分かる。同じ「地震に強い建物」でも、どの構造形式が採用されているかで設計上の確認点が変わる。[[NOTE:構造形式の併用]]という発展知識を合わせて覚えると、断定的な誤肢に対応できる。さらに図面を見るときは、斜材が配置される位置、柱梁接合部の形式、耐力壁の連続性を確認する。構造形式の名称だけで耐震性能が決まるのではなく、部材の配置と施工品質も重要となる。","system_purpose":"【学習補助】5問免除・建物の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:複数の耐震形式を併用する建物もあり]]「必ず一方式のみ」などの断定に注意する。","comparative_explanation":"【本問で混同しやすい区別】複数の耐震形式を併用する建物もあり「必ず一方式のみ」などの断定に注意する。","important_points":"《ラーメン＝剛接合》／《ブレース＝斜材》／《壁式＝壁と床》。\n【判定の軸】複数の耐震形式を併用する建物もあり「必ず一方式のみ」などの断定に注意する。","trick_patterns":"「[[WARN:全て]]」「併用しない」など断定形に注意。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《ブレース構造》はラーメン構造と併用されることもあります。「併用しない」が誤り。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 3番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 複数の耐震形式を併用する建物もあり「必ず一方式のみ」などの断定に注意する。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"国土交通省 建築構造の基礎資料","marker_yellow_spans":"ブレース構造|ラーメン＝剛接合|ブレース＝斜材|壁式＝壁と床","marker_red_spans":"他の構造と併用することはない|全て","marker_blue_spans":"構造形式の併用|複数の耐震形式を併用する建物もあり","qa_status":"REWORK","qa_issues":"設問固有の解説・根拠条文を重点修正。ただし2026年度現行法の全肢独立検証は未完了。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"false","choice_1_wrong_part":"該当なし","choice_1_reason":"適当な記述である。ラーメン構造では、柱と梁の接合部を強く一体化させ、骨組自体の曲げ抵抗により地震や風による水平力に耐える。柱が鉛直、梁が水平という配置そのものだけでなく、==接合部を剛接合する==点が仕組みの核心となる。たとえば同じ柱と梁の骨組でも、接合方法が異なれば水平力に対する力の流れや変形のしかたは変わる。ブレースを用いる構造との比較では、斜材が主として軸方向の力を担うかどうかを押さえる。","choice_1_corrected_statement":"原文どおりで正しい（出題時点の判定）","choice_1_legal_basis":"肢別の法令照合待ち。関連出典：国土交通省 建築構造の基礎資料","choice_1_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。ラーメン構造は柱と梁を剛接合して骨組で力に抵抗する構造です。 具体的な要件は出題当時の関連条文で確認する。","choice_2_truth":"true","choice_2_is_exam_answer":"false","choice_2_wrong_part":"該当なし","choice_2_reason":"適当な記述である。ブレース構造は柱・梁でつくられる骨組の対角線方向に斜材を設け、主として部材の軸方向の力を利用して水平力に抵抗する方式である。地震や強風の際、斜めに入った部材が骨組の変形を抑える役割を担う。==斜材を追加すること==が本肢の判断ポイントであり、柱と梁の接合部で抵抗するラーメン構造とは基本の説明が異なる。ただし両者は互いに排他的ではなく、建物の設計に応じて併用できる。","choice_2_corrected_statement":"原文どおりで正しい（出題時点の判定）","choice_2_legal_basis":"肢別の法令照合待ち。関連出典：国土交通省 建築構造の基礎資料","choice_2_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。ブレース構造は柱・梁の骨組に斜材を設け、水平力に抵抗します。 具体的な要件は出題当時の関連条文で確認する。","choice_3_truth":"false","choice_3_is_exam_answer":"true","choice_3_wrong_part":"ラーメン構造など他の構造と併用することはない","choice_3_reason":"不適当な記述であり、これが正解肢である。ブレースは柱・梁の骨組と組み合わせて使われることがあり、[[WARN:他の構造と併用することはない]]という断定は誤りである。例えば骨組の一部に斜材を配置し、別の部分ではラーメン構造の柱・梁が水平力を負担する設計も考えられる。すべての骨組に一律に斜材を設けるとは限らない。名称の異なる耐震方式は建物の全体で混合してはならない、という規制があるわけではない点を押さえる。","choice_3_corrected_statement":"ブレース構造はラーメン構造など他の構造と併用される場合がある。","choice_3_legal_basis":"肢別の法令照合待ち。関連出典：国土交通省 建築構造の基礎資料","choice_3_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。ブレースはラーメン構造など他方式と併用されることも多く、「併用しない」は誤りです。 具体的な要件は出題当時の関連条文で確認する。","choice_4_truth":"true","choice_4_is_exam_answer":"false","choice_4_wrong_part":"該当なし","choice_4_reason":"適当な記述である。壁式構造は、板状の壁と床を主要な構造要素として箱状の空間を構成し、その壁が鉛直荷重や水平力を負担する方式である。柱と梁の線状部材を骨組として組み立てるラーメン構造と比べると、==耐力壁が中心==という荷重の受け方に違いがある。設計上は開口部の大きさや配置も構造性能に影響し得る。肢4の「原則として」は、すべての細部に柱や梁に似た部材が絶対に現れない、という意味で読まない。","choice_4_corrected_statement":"原文どおりで正しい（出題時点の判定）","choice_4_legal_basis":"肢別の法令照合待ち。関連出典：国土交通省 建築構造の基礎資料","choice_4_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。壁式構造は壁と床を箱状に構成し、柱・梁を基本としない形式です。 具体的な要件は出題当時の関連条文で確認する。"},{"question_id":"2025-Q01","year":2025,"session":"通常","question_no":1,"major_field":"権利関係","section":"民法","unit":"物権変動","topic":"不動産登記・解除と第三者","importance_1_5":"5","difficulty_1_3":"2","question_type":"single_correct","question_text":"所有者ＡがＢに甲土地を売却し、その後にＢがＣに甲土地を売却した場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。なお、この問において、Ｃは背信的悪意者ではないものとする。","choice_1":"甲土地の所有権登記がＡの名義のままであったとしても、Ｂは、Ｃに甲土地を売却した後は、Ａに対して自己に甲土地の所有権移転登記をするよう請求することはできない。","choice_2":"Ｃは、甲土地の所有権移転登記を備えなければ、Ａに対して自己が所有者であることを主張することができない。","choice_3":"ＡＢ間の売買契約が、ＢＣ間の売買契約締結よりも前にＡにより解除されていた場合、又は、ＢＣ間の売買契約締結後にＡにより解除された場合のいずれの場合であっても、Ｃは、甲土地の所有権移転登記を備えれば、Ａに対して自己の所有権を主張することができる。","choice_4":"ＡＢ間の売買契約が、ＢＣ間の売買契約よりも前にＢの強迫を理由として取り消されていた場合、又は、ＢＣ間の売買契約締結後にＢの強迫を理由として取り消された場合のいずれの場合であっても、Ｃは、Ｂの強迫につき善意でかつ過失がなければ、Ａに対して自己の所有権を主張することができる。","official_accepted_answers":"3","answer_conclusion":"正解：3。肢3が正しい。Aによる解除とCの取得の先後で法律構成は異なるが、解除前の第三者については民法545条1項ただし書と登記、解除後の第三者については民法177条の登記の先後が重要になる。設問はCが所有権移転登記を備えた場合を明記しており、どちらの時系列でもAに対抗できる。","answer_reason":"肢3が正しい。Aによる解除とCの取得の先後で法律構成は異なるが、解除前の第三者については民法545条1項ただし書と登記、解除後の第三者については民法177条の登記の先後が重要になる。設問はCが所有権移転登記を備えた場合を明記しており、どちらの時系列でもAに対抗できる。","scoring_exception_note":"","deep_lecture":"不動産の権利変動では、まず「売買当事者間で所有権が移ったか」と「その権利を第三者に主張できるか」を分ける。AがBに売り、BがCに転売した場合、BがCに売却したという事実だけで、Aに対するBの登記請求権が当然に消えるわけではない。登記を順に備えるため、AからBへの登記を要求できる。民法177条は、不動産に関する物権変動を第三者に対抗するには登記が必要と定めるが、誰もがこの「第三者」に当たるわけではない。売主のような前主と、独立の競合する権利を持つ者を区別する。\n次に解除を考える。AB契約の解除より前にCが取得していた場合、民法545条1項ただし書が第三者の権利を害することを防ぐ。もっとも土地の権利の公示として登記が問題になる。他方、解除によりAへ権利が戻った後にBからCが取得した場合、Aへの復帰とCへの移転が競合し、177条により登記の先後を比較する。設問の肢3は両方の場合につきCが登記を備えると明記している。\n一方、取消しは解除と同じに考えてはならない。詐欺の取消し前第三者は善意無過失なら民法96条3項で保護されるが、強迫の場合は同項の適用を受けない。善意・悪意だけで判断せず、原因が解除か取消しか、取消しの原因が詐欺か強迫か、Cが登場する時期がいつか、登記が誰にあるかを時系列に記載することが重要である。","system_purpose":"不動産登記は、相対立する権利主張の優劣を第三者に分かるようにし、二重譲渡などの紛争を処理するための公示制度である。第三者保護規定は、契約解除の遡及効による取引安全への影響を調整する。","practical_examples":"Aが土地をBへ売り、BがCへ売った。Aが代金不払を理由に解除した後でも、Cが先に登記を備えていれば、Aは自分への所有権復帰をCに主張できない場面がある。解除とCの取得の時刻、AとCの登記を表にすると整理できる。","advanced_knowledge":"解除前の第三者には545条1項ただし書、解除後の第三者には177条という整理が基本。錯誤取消し・詐欺取消し・強迫取消しには、保護される第三者の要件が異なるため、事由別に条文を引く。","comparative_explanation":"解除前取得：545条1項ただし書＋不動産では登記。解除後取得：177条の対抗関係。詐欺取消し前：96条3項で善意無過失保護。強迫取消し前：96条3項の保護なし。","important_points":"登記を要する相手が177条の「第三者」かを先に確認 ／ 解除前／解除後の取得は別構成 ／ 詐欺と強迫の第三者保護を区別 ／ 登記の先後を時系列で検討","trick_patterns":"登記は相手が誰でも必要、とする一律化 ／ 解除前後をまとめて同一根拠とする表現 ／ 「善意無過失」を強迫に流用\n【誤答注意】設問中の [[WARN:「売却した後は、…請求することはできない」]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"==解除前の第三者＝545条ただし書==、==解除後の第三者＝177条==。[[WARN:強迫取消しと詐欺取消しの混同]]に注意。[[NOTE:転売後も中間登記の請求を検討]]。","review_check_questions":"Q:解除後に現れた第三者と解除者の優劣は何を比べる？ A:原則、登記の先後。 | Q:詐欺取消し前の第三者の保護要件は？ A:善意かつ無過失。 | Q:強迫取消しにも96条3項の保護がある？ A:ない。","substatement_reasoning":"","reform_status":"none_confirmed","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法96条・177条・545条1項ただし書、不動産物権変動に関する判例 | https://laws.e-gov.go.jp/law/129AC0000000089","marker_yellow_spans":"解除前の第三者＝545条ただし書|解除後の第三者＝177条","marker_red_spans":"「売却した後は、…請求することはできない」","marker_blue_spans":"転売後も中間登記の請求を検討","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"「売却した後は、…請求することはできない」","choice_1_reason":"誤り。BがCに転売すると、Bは契約上Cに所有権を移転する立場に立つが、A・B間の売買に基づく登記請求権が当然に消滅するわけではない。A名義のままではCへ移す前提となる中間登記の処理が必要になり、BはAへ自己名義への移転登記を求めることができる。「所有権を転売した＝売主に登記を請求できない」という短絡が誤りである。","choice_1_corrected_statement":"BがCに甲土地を売却した後も、BはAに対して自己への所有権移転登記を請求できる。登記をA→B→Cの順に整えることが可能である。","choice_1_legal_basis":"民法177条","choice_1_exam_tip":"転売＝登記請求権消滅、ではない。","choice_2_truth":"false","choice_2_is_exam_answer":"false","choice_2_wrong_part":"「登記を備えなければ、Ａに対して…主張することができない」","choice_2_reason":"誤り。民法177条で登記が必要なのは、原則として登記の欠缺を主張する正当な利益を有する第三者との対抗関係である。土地をBへ売ったAは所有権移転の前主であり、Cは通常、Aに対して登記がなければ絶対に所有権を主張できないわけではない。ただしAが契約を解除し、Cと対抗関係に立つなど事情が変われば登記の優劣を検討する必要がある。","choice_2_corrected_statement":"Cは、原則として、前主に当たるAに対して所有権を主張するのに、Aとの関係で所有権移転登記を必ずしも要しない。","choice_2_legal_basis":"民法177条","choice_2_exam_tip":"民法177条の「第三者」に前主を機械的に含めない。","choice_3_truth":"true","choice_3_is_exam_answer":"true","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい。AB売買の解除前にBから取得したCは、解除の遡及効によって直ちに権利を奪われない第三者として保護されるが、不動産では権利の公示として登記が問題になる。解除後にBから取得したCは、解除によるAへの権利復帰とCへの譲渡が競合するため、登記の先後で処理する。いずれも本肢のようにCが登記を備えることが結論を支える。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"民法545条・177条","choice_3_exam_tip":"解除前の第三者と解除後の第三者は保護根拠を分ける。","choice_4_truth":"false","choice_4_is_exam_answer":"false","choice_4_wrong_part":"「いずれの場合であっても、…善意でかつ過失がなければ」","choice_4_reason":"誤り。民法96条3項の善意無過失の第三者保護は詐欺取消しについて定めたもので、強迫による意思表示の取消しには同じ保護規定が置かれていない。取消し前のCは、Bの強迫を知らなくてもAに対抗できるとは限らない。取消し後の第三者が関係する場合は登記の問題も生じるので、「取消し前後いずれも善意無過失ならよい」という断定はできない。","choice_4_corrected_statement":"AB間の売買がBの強迫を理由に取り消された場合、取消し前にBから取得したCであっても、善意無過失というだけではAに対抗できない。取消し後の第三者との関係は別途登記の対抗関係を検討する。","choice_4_legal_basis":"民法96条","choice_4_exam_tip":"詐欺の第三者保護を強迫にそのまま移さない。"},{"question_id":"2025-Q02","year":2025,"session":"通常","question_no":2,"major_field":"権利関係","section":"民法","unit":"保証","topic":"個人根保証・連帯保証・主債務情報","importance_1_5":"5","difficulty_1_3":"2","question_type":"single_correct","question_text":"個人であるＡが、①賃貸人Ｂと賃借人Ｃとの間の期間を2 年とする居住用甲建物の賃貸借契約に基づくＣの一切の債務の連帯保証契約をＢと締結した場合、②売主Ｄと買主Ｅとの間の居住用乙建物の売買契約に基づく代金支払債務の保証契約をＤと締結した場合、に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choice_1":"①の連帯保証契約は書面によってしなければ無効であるのに対し、②の保証契約は書面によらず、口頭で契約を締結しても有効である。","choice_2":"①のＢがＡに対して連帯保証債務の履行を請求してきた場合には、ＡはまずＣに請求するように主張できるのに対し、②のＤがＡに対して保証債務の履行を請求してきた場合には、ＡはまずＥに請求するように主張することはできない。","choice_3":"①の連帯保証契約は保証の限度額である極度額を定めなければ無効であるのに対し、②の保証契約は極度額を定める必要はない。","choice_4":"①も②もＡが主たる債務者Ｃ及びＥの委託を受けて保証した場合において、Ａが債権者Ｂ及びＤに対して主たる債務の履行状況に関する情報を提供するよう請求したときは、①のＢは、これらの情報を、遅滞なく、Ａに提供しなければならないのに対し、②のＤは、守秘義務を理由にこれらの情報の提供を拒否することができる。","official_accepted_answers":"3","answer_conclusion":"正解：3。正しいのは肢3。居住用賃貸借に伴う個人の「一切の債務」の保証は、将来発生する不特定債務を対象とする個人根保証である。民法465条の2により極度額の定めがなければ無効となる。これに対し売買代金支払債務は特定債務なので、根保証特有の極度額規制は当然には及ばない。","answer_reason":"正しいのは肢3。居住用賃貸借に伴う個人の「一切の債務」の保証は、将来発生する不特定債務を対象とする個人根保証である。民法465条の2により極度額の定めがなければ無効となる。これに対し売買代金支払債務は特定債務なので、根保証特有の極度額規制は当然には及ばない。","scoring_exception_note":"","deep_lecture":"保証は主債務者が支払えないときに保証人が責任を負う仕組みだが、日常の賃貸借と売買代金では保証対象が違う。まず「契約の方式」を押さえる。保証契約は民法446条2項で書面を要し、一定の電磁的記録も認められる。口約束で当然に有効とはならない。\n次に保証人の責任の強さを見る。通常保証人は、債権者が請求してきた際に、原則として先に主債務者に催告するよう求められる。これが催告の抗弁である。連帯保証人にはこの抗弁がなく、債権者は連帯保証人に直接請求できる。検索の抗弁や分別の利益との区別も基本となる。\nさらに保証対象が「特定債務」か「将来の不特定債務」かを分ける。毎月の家賃、退去時の原状回復費用など一切の債務を保証する場合、保証契約時には最大負担額を読みづらい。民法465条の2は個人根保証について極度額の定めがなければ契約を無効とし、個人保証人の過大な予測不能の負担を抑える。売買代金のように契約で特定された債務の保証は、同条の根保証とは異なる。\n最後に情報提供義務を見る。主債務者の委託を受けて保証した者は、債権者へ主債務の履行状況を請求できる。債権者は所定事項を遅滞なく回答しなければならない。これは保証人に保証リスクを見える化するための制度であり、売買代金保証で一律に拒絶できるとの理解は不正確。","system_purpose":"個人保証人が予測不能に大きな債務を負うのを防ぎ、保証の方式を明確にし、主債務の履行状況を把握できるようにする。","practical_examples":"月額家賃10万円の賃貸で保証人Aが家賃・原状回復費用を保証する場合、極度額120万円と定めれば上限を把握できる。一方、建物売買代金3,000万円の支払債務を保証する場合は、対象が特定債務である。","advanced_knowledge":"連帯保証では催告の抗弁と検索の抗弁がない。個人貸金等根保証には元本確定期日の規律もあるが、居住用賃貸の個人根保証へそのまま当てはめない。根保証の極度額は保証契約の効力要件である。","comparative_explanation":"保証契約方式：通常・連帯とも原則書面。催告の抗弁：通常保証は原則あり／連帯保証はなし。極度額：個人根保証は必須／特定債務の通常保証には根保証規制なし。","important_points":"保証契約は原則書面 ／ 連帯保証人に催告の抗弁はない ／ 個人根保証には極度額が必要 ／ 委託保証人への履行状況提供義務","trick_patterns":"口頭の保証でも有効、という誤誘導 ／ 通常保証と連帯保証の抗弁を逆にする ／ 特定債務保証に根保証の極度額を一律適用 ／ 守秘義務を万能の拒絶理由にする\n【誤答注意】設問中の [[WARN:「②の保証契約は…口頭で…有効」]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"==保証は書面等==。==連帯保証に催告の抗弁なし==。==個人根保証には極度額必須==。[[WARN:通常保証と連帯保証の逆転]]。[[NOTE:委託保証人への履行情報提供義務]]。","review_check_questions":"Q:連帯保証人はまず主債務者へ請求してと言える？ A:原則言えない。 | Q:個人根保証に極度額がないと？ A:無効。 | Q:特定売買代金の保証にも極度額は必須？ A:根保証としては不要。","substatement_reasoning":"","reform_status":"none_confirmed","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法446条2・3項、452条・453条、454条、458条の2、465条の2 | https://laws.e-gov.go.jp/law/129AC0000000089","marker_yellow_spans":"保証は書面等|連帯保証に催告の抗弁なし|個人根保証には極度額必須","marker_red_spans":"「②の保証契約は…口頭で…有効」","marker_blue_spans":"委託保証人への履行情報提供義務","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"「②の保証契約は…口頭で…有効」","choice_1_reason":"誤り。保証契約は、賃貸借の連帯保証も売買代金の通常保証も、民法446条2項によって原則として書面でしなければ効力を生じない。電磁的記録による保証契約は法定条件の下で書面と同様に扱う。①だけ書面が必要で②は口頭で足りるとする区別には根拠がない。極度額が必要かという問題と、保証契約自体の方式は別個の論点である。","choice_1_corrected_statement":"①も②も、保証契約は原則として書面でしなければ効力を生じない。法定要件を満たす電磁的記録による場合は例外として認められる。","choice_1_legal_basis":"民法446条","choice_1_exam_tip":"保証契約の方式は根保証・通常保証の双方に共通。","choice_2_truth":"false","choice_2_is_exam_answer":"false","choice_2_wrong_part":"「①はまずCに請求するよう主張できる」「②はまずEに請求するよう主張できない」","choice_2_reason":"誤り。連帯保証人は、主債務者への先行請求を求める「催告の抗弁権」を行使できない。対して通常の保証人は、原則として先に主債務者に催告するよう主張できる。民法452条・454条により①と②は設問とは逆になる。通常保証にも例外があるが、少なくとも「連帯保証のほうが催告できる」という理解は誤っている。","choice_2_corrected_statement":"①の連帯保証人Aには催告の抗弁権がない。他方、②の通常保証人Aは、原則としてまず主債務者Eに催告するよう請求できる。","choice_2_legal_basis":"民法452条・454条","choice_2_exam_tip":"催告の抗弁権は原則として通常保証だけ。","choice_3_truth":"true","choice_3_is_exam_answer":"true","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい。①の居住用賃貸借に基づく一切の債務には、将来の賃料、原状回復費用など、契約時点で額が確定していない債務が含まれる。個人が保証する根保証であるため、465条の2に基づく極度額がなければ無効となる。②はすでに特定された建物売買代金債務を保証する契約であり、根保証の「将来の不特定債務」とは異なるため極度額の法定要件はない。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"民法465条の2","choice_3_exam_tip":"個人根保証に極度額必須、特定債務保証は別。","choice_4_truth":"false","choice_4_is_exam_answer":"false","choice_4_wrong_part":"「②のDは、守秘義務を理由に…提供を拒否することができる」","choice_4_reason":"誤り。主債務者の委託を受けた保証人が履行状況の提供を請求したとき、債権者は元本、利息、違約金、損害賠償などについて不履行の有無や残額等を遅滞なく提供する義務を負う。民法458条の2は連帯保証か通常保証かで情報提供義務を区別していない。②の売主Dが「守秘義務」を理由に一律に拒むことはできない。","choice_4_corrected_statement":"①・②とも主債務者の委託を受けた保証人が履行状況を請求したとき、債権者は民法458条の2所定の情報を遅滞なく提供しなければならない。","choice_4_legal_basis":"民法458条の2","choice_4_exam_tip":"委託を受けた保証人の情報請求権を確認。"},{"question_id":"2025-Q03","year":2025,"session":"通常","question_no":3,"major_field":"権利関係","section":"民法","unit":"意思表示","topic":"心裡留保・虚偽表示・錯誤・詐欺","importance_1_5":"5","difficulty_1_3":"2","question_type":"count_false","question_text":"意思表示に関する次の記述のうち、民法の規定によれば、誤っているものはいくつあるか。ア　表意者が真意でないことを知ってした意思表示は無効であるが、相手方がその意思表示が表意者の真意ではないことを知らなければ、知らないことにつき過失があっても、当該意思表示は有効となる。イ　相手方と通じてした虚偽の意思表示は無効であり、第三者がその虚偽表示につき善意であっても、過失があれば、当該第三者にその無効を対抗することができる。ウ　意思表示は、当該意思表示に対応する意思を欠く錯誤に基づくものであって、その錯誤が法律行為の目的及び取引上の社会通念に照らして重要なものであるときは、無効であるが、その錯誤につき善意でかつ過失がない第三者には、その無効を対抗することができない。エ　詐欺による意思表示は取り消すことができるが、その詐欺につき善意でかつ過失がない取消し前の第三者には、その取消しを対抗することができない。","choice_1":"一つ","choice_2":"二つ","choice_3":"三つ","choice_4":"四つ","official_accepted_answers":"3","answer_conclusion":"正解：3。誤りはア・イ・ウの3個である。アは心裡留保を原則無効と誤認、イは虚偽表示の善意第三者に無過失まで要求、ウは錯誤を取消しではなく無効としている。エは詐欺取消し前の善意無過失第三者の保護であり正しい。したがって「三つ」の肢3が正解。","answer_reason":"誤りはア・イ・ウの3個である。アは心裡留保を原則無効と誤認、イは虚偽表示の善意第三者に無過失まで要求、ウは錯誤を取消しではなく無効としている。エは詐欺取消し前の善意無過失第三者の保護であり正しい。したがって「三つ」の肢3が正解。","scoring_exception_note":"","deep_lecture":"意思表示とは内心の意思を外部に示すことだが、真意と表示がずれた場合にも同一の結果になるわけではない。まず93条の心裡留保は、本人が「本当はそのつもりがない」と分かって表示した場合である。原則として表示どおり有効となり、相手方が真意でないと知っていたか知ることができたときに無効となる。原則と例外を逆に覚えない。\n94条の通謀虚偽表示は相手方と示し合わせた架空取引であり、当事者間では無効となる。ただし無効を善意の第三者には対抗できない。ここで第三者に「過失がない」ことまで要求する条文ではない点がポイント。\n95条の錯誤では、意思表示に対応する意思を欠く錯誤や基礎事情の錯誤が一定の重要性を持つときは「取り消すことができる」。この効果を「無効」とした過去の学習内容と混同しない。重過失がある場合の例外や、基礎事情の錯誤で表示が必要になる条件は発展論点として押さえる。取消しを善意無過失の第三者へ対抗できないという別の保護もある。\n96条の詐欺・強迫は共に取消しが認められるが、詐欺取消しについては善意無過失の第三者を保護する規定がある。強迫の場合の第三者保護とは異なる。これらの4制度を、①当事者間の効力、②取消しか無効か、③第三者の善意・無過失の要否、の3軸で比較する。個数問題ではア〜エの真偽を四つ確定し、最後に選択肢「一つ〜四つ」へ当てはめる。","system_purpose":"本人の意思と取引相手方・第三者の信頼のどちらを保護するかを、原因ごとに調整するための制度である。","practical_examples":"AがBと相談して架空の土地売買を装う場合は虚偽表示で当事者間無効。ただし事情を知らずBから買ったCは一定の保護を受ける。Aが土地面積を重要な錯誤により勘違いして購入した場合は、無効とせず取消しの問題になる。","advanced_knowledge":"錯誤の重大な過失、基礎事情の表示、第三者保護の要件は95条2〜4項まで確認する。心裡留保・通謀虚偽表示・詐欺・強迫は、「誰が何を知っているか」の主体と時点を問われやすい。","comparative_explanation":"心裡留保：原則有効、例外無効／通謀虚偽表示：原則無効、善意第三者保護／錯誤：取消し、善意無過失第三者保護／詐欺：取消し、善意無過失第三者保護。","important_points":"心裡留保は原則有効 ／ 虚偽表示の第三者は善意で足りる ／ 錯誤の効果は取消し ／ 詐欺取消しの第三者は善意無過失","trick_patterns":"錯誤を無効とする旧法的表現 ／ 虚偽表示の第三者に無過失を追加 ／ 心裡留保の原則有効を逆転 ／ 個数問題でア〜エを一部だけ判定\n【誤答注意】設問中の [[WARN:「一つ」]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"ア・イ・ウが誤り、==誤り3つ==。[[WARN:錯誤は無効ではなく取消し]]。[[NOTE:虚偽表示の第三者は善意のみで保護]]。","review_check_questions":"Q:錯誤の効果は無効か取消しか？ A:取消し。 | Q:通謀虚偽表示の第三者に無過失は必要？ A:原則不要。 | Q:本問の誤りは何個？ A:ア・イ・ウの3個。","substatement_reasoning":"ア：誤り（93条：心裡留保は原則有効。相手方が悪意又は有過失なら無効）。イ：誤り（94条2項：虚偽表示の無効は善意第三者に対抗不可。無過失までは不要）。ウ：誤り（95条：重大な重要錯誤は取消し得る。無効ではない）。エ：正しい（96条3項：詐欺取消しは善意無過失第三者に対抗できない）。誤り3個＝選択肢3。","reform_status":"none_confirmed","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法93条・94条・95条・96条 | https://laws.e-gov.go.jp/law/129AC0000000089","marker_yellow_spans":"誤り3つ","marker_red_spans":"「一つ」","marker_blue_spans":"虚偽表示の第三者は善意のみで保護","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜選択肢真偽はcompoundに補正。ア〜エの論拠をさらに独立照合する必要","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"compound","choice_1_is_exam_answer":"false","choice_1_wrong_part":"「一つ」","choice_1_reason":"誤り。誤っているものが一つという選択肢だが、ア、イ、ウの三つが誤りである。アの心裡留保は原則有効で、相手方が真意でないと知り又は知ることができた場合に例外的に無効となる。イは通謀虚偽表示の第三者保護に無過失を要求した点、ウは錯誤の効果を無効とした点が誤る。個数問題では各記述を先に判定してから選択肢を見る。","choice_1_corrected_statement":"誤っている記述は三つである。","choice_1_legal_basis":"民法93条・94条・95条・96条","choice_1_exam_tip":"選択肢の数字より先にア〜エを個別判定。","choice_2_truth":"compound","choice_2_is_exam_answer":"false","choice_2_wrong_part":"「二つ」","choice_2_reason":"誤り。誤っている記述をア・イの二つだけと数えると、ウを正しいものとして扱うことになる。しかし現行民法95条の重要な錯誤の効果は「取り消すことができる」であり、当然無効ではない。ウも誤りと数える必要がある。他方エの詐欺による取消しは善意無過失の第三者に対抗できないため正しい。したがって二つという個数は成り立たない。","choice_2_corrected_statement":"誤っている記述は三つである。","choice_2_legal_basis":"民法93条・94条・95条・96条","choice_2_exam_tip":"錯誤は取消し。","choice_3_truth":"compound","choice_3_is_exam_answer":"true","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい。アは93条の原則を逆転しているため誤り。イは94条2項の保護要件を「善意かつ無過失」と誤って加重しているため誤り。ウは95条1項の効果を「取消し」ではなく「無効」としたため誤り。エは96条3項どおり、詐欺取消し前の善意無過失第三者が保護されることを述べているので正しい。誤りは合計3つである。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"民法93条・94条・95条・96条","choice_3_exam_tip":"通謀虚偽表示の第三者は善意で足りる。","choice_4_truth":"compound","choice_4_is_exam_answer":"false","choice_4_wrong_part":"「四つ」","choice_4_reason":"誤り。四つ全てを誤りとするにはエも誤りである必要があるが、エは民法96条1項・3項の内容を適切に表している。詐欺による意思表示は取り消すことができ、その取消しを善意で過失のない第三者に対抗できない。詐欺と強迫では第三者保護の規律が異なるので混同しない。四つという数え方はエを誤って判定している。","choice_4_corrected_statement":"誤っている記述は三つである。","choice_4_legal_basis":"民法93条・94条・95条・96条","choice_4_exam_tip":"詐欺は善意無過失の第三者を保護。"},{"question_id":"2025-Q04","year":2025,"session":"通常","question_no":4,"major_field":"権利関係","section":"民法","unit":"担保物権・債権","topic":"質権・留置権・先取特権・相殺","importance_1_5":"5","difficulty_1_3":"2","question_type":"single_correct","question_text":"ＡがＢから弁済の期限の定めなく金1,000 万円を借り入れる金銭消費貸借契約（以下この問において「本件契約」という。）における次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choice_1":"Ａは、本件契約におけるＡの債務を担保するために、Ａが所有する不動産に対し、Ｂのために、抵当権を設定することはできるが、質権を設定することはできない。","choice_2":"Ａが本件契約に基づく債務の弁済を怠ったときに、ＢがＡから預かっている動産を占有している場合には、Ｂは当該動産の返還時期が到来しても弁済を受けるまでその動産に関して留置権を行使することができる。","choice_3":"Ａが本件契約に基づく債務の弁済を怠った場合には、ＢはＡの総財産に対して先取特権を行使することができる。","choice_4":"Ａが、期限が到来しているＢの悪意による不法行為に基づく金1,000 万円の損害賠償請求債権をＢに対して有している場合、Ａは本件契約に基づく返還債務をＢに対する当該損害賠償請求債権で相殺することができる。","official_accepted_answers":"4","answer_conclusion":"正解：4。肢4が正しい。民法509条の相殺制限は、悪意の不法行為に基づく賠償債務を負う加害者が一方的な相殺で賠償義務を免れることを防ぐ趣旨である。被害者Aが自己の損害賠償請求権を自働債権として借入金の返還債務と相殺することは妨げられない。","answer_reason":"肢4が正しい。民法509条の相殺制限は、悪意の不法行為に基づく賠償債務を負う加害者が一方的な相殺で賠償義務を免れることを防ぐ趣旨である。被害者Aが自己の損害賠償請求権を自働債権として借入金の返還債務と相殺することは妨げられない。","scoring_exception_note":"","deep_lecture":"担保物権には、不動産に設定し、使用収益を続けながら担保化できる抵当権、担保物の引渡し・占有と結び付く質権、一定の債権者に物を手元に残す権利を認める留置権、法律上所定の債権に優先弁済を認める先取特権がある。それぞれ成立要件が異なるため、ひとまとめにしない。\n抵当権は不動産取引で一般的だが、質権を動産専用と決めつけてはならず、不動産質権も認められる。留置権では、単に人の物を預かっているだけでは足りない。「物に関して生じた債権」であるという牽連性が必要である。例として自動車の修理代と修理した車は結び付きやすいが、別件の貸付金と保管中の車には通常牽連性がない。\n先取特権は、債務者の総財産に当然発生する一般的な金融機関の優先権ではない。債権の種類に応じ、法律が特別に認めた場合だけ成立する。以上は担保の論点。これに対し肢4は債権を互いに消し合う「相殺」の論点である。民法509条は、悪意の不法行為に基づく損害賠償債務を負う人が、債務を一方的な相殺で消すことを制限する。被害者の現実の救済機会を守るためである。被害者が相殺を利用することを禁じる制度ではない。\n試験では、担保物の種類、占有の有無、担保される債権と物との関連、相殺する人が加害者か被害者か、の4軸で選択肢を整理する。","system_purpose":"担保制度は一定の債権を回収しやすくする仕組みであり、相殺制限は故意の加害者が損害賠償を相殺で免れて被害者救済を空洞化させるのを防ぐ。","practical_examples":"BがAに1000万円を貸した後、Bの故意の加害行為でAに1000万円の損害が発生した。AはBへの返済債務と、Bに対する賠償請求権を相殺できる。他方Bが加害者として相殺を主張する方向なら509条を検討する。","advanced_knowledge":"509条には人の生命・身体を侵害した不法行為の賠償債務も規定される。相殺の適状（弁済期など）の要件は別途検討し、同じ「相殺」でも誰が何を自働債権とするかで規制が異なる。","comparative_explanation":"抵当権：典型的に不動産、目的物の占有を移さない。質権：不動産質権も存在。留置権：占有＋物と債権の牽連性。先取特権：法定の債権に優先権。相殺：二つの債権債務を差し引く。","important_points":"不動産にも質権は成立し得る ／ 留置権には牽連性が必要 ／ 先取特権は法定された債権に限る ／ 悪意不法行為の被害者からの相殺は可能","trick_patterns":"質権を動産だけに限定 ／ 預かった動産なら無条件で留置権とする ／ 貸金債権なら総財産に先取特権とする ／ 相殺を加害者・被害者の区別なく禁止\n【誤答注意】設問中の [[WARN:「質権を設定することはできない」]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"==留置権には牽連性==。==先取特権は法律で限定==。[[WARN:509条は加害者側の相殺を制限]]。[[NOTE:被害者は相殺を使える]]。","review_check_questions":"Q:不動産に質権を設定できる？ A:できる。 | Q:留置権に必要な債権と物との関係は？ A:牽連性。 | Q:故意不法行為の被害者Aの相殺は一律禁止？ A:禁止されない。","substatement_reasoning":"","reform_status":"none_confirmed","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法295条・303条・306条・343条・356条・509条 | https://laws.e-gov.go.jp/law/129AC0000000089","marker_yellow_spans":"留置権には牽連性|先取特権は法律で限定","marker_red_spans":"「質権を設定することはできない」","marker_blue_spans":"被害者は相殺を使える","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"「質権を設定することはできない」","choice_1_reason":"誤り。質権は動産だけに設定できる権利ではなく、不動産質権も法律上認められている。抵当権と質権は、公示・占有や利用の仕方が異なる担保制度である。債務者Aが自分の不動産にBのために抵当権を設定できることは正しいが、「質権は設定できない」と一律に排除している点が誤り。質権の対象物を動産に限定して記憶しない。","choice_1_corrected_statement":"不動産についても、抵当権だけでなく質権を設定することができる。","choice_1_legal_basis":"民法343条・356条","choice_1_exam_tip":"不動産質権もある。","choice_2_truth":"false","choice_2_is_exam_answer":"false","choice_2_wrong_part":"「動産を占有していれば返還期でも…留置できる」","choice_2_reason":"誤り。民法295条の留置権は、他人の物の占有に加え、その物に関して生じた債権であることなどを要件とする。単にBがAから動産を預かっているだけでは、預り動産と別個の1000万円貸金債権との牽連性が認められない。返還時期が来た後に貸金不払を理由として当然に留置できるわけではない。保管料・修理代など物と関係する債権の事例と比較する。","choice_2_corrected_statement":"留置権は、占有する物とその物に関して生じた債権との牽連性などの要件を満たす場合に成立する。無関係な貸金債権だけでは留置できない。","choice_2_legal_basis":"民法295条","choice_2_exam_tip":"留置権はその物に関して生じた債権か検討。","choice_3_truth":"false","choice_3_is_exam_answer":"false","choice_3_wrong_part":"「Aの総財産に対して先取特権を行使」","choice_3_reason":"誤り。先取特権は法律上特別に認められた一定の債権を担保する法定担保物権である。民法306条の一般先取特権にも債権の種類について限定があり、どの貸金債権でも債務者の総財産について優先弁済を受けられる制度ではない。契約で特別な担保を取っていないからといって先取特権が自動発生するものでもない。","choice_3_corrected_statement":"単なる金銭消費貸借契約に基づく返還請求権では、通常、Aの総財産について先取特権を行使できない。","choice_3_legal_basis":"民法303条・306条","choice_3_exam_tip":"先取特権は法定原因が必要。","choice_4_truth":"true","choice_4_is_exam_answer":"true","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。AはBに借入金返還債務を負う一方、Bの悪意による不法行為で損害賠償請求権を持つ。509条の禁止は、その不法行為に基づく賠償債務を負うBが相殺によって被害者Aへの賠償を免れることを阻止するものである。被害者A自身が賠償債権を使って借金と相殺することまで禁じない。相殺の方向と自働債権の主体が決め手になる。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"民法509条","choice_4_exam_tip":"509条は加害者側からの相殺を制限する。"},{"question_id":"2025-Q05","year":2025,"session":"通常","question_no":5,"major_field":"権利関係","section":"民法","unit":"相続","topic":"代襲相続・欠格・廃除・放棄","importance_1_5":"5","difficulty_1_3":"2","question_type":"combination","question_text":"Ａの子がＢであり、Ｂの子がＣであり、ＣがＡの直系卑属である場合において、民法の規定によれば、次のアからエまでの記述のうち、Ａが死亡した際にＣがＢを代襲してＡの相続人となるときを全て掲げたものはどれか。ア　Ａが死亡する以前にＢが死亡したときイ　Ｂが相続に関するＡの遺言書を偽造して相続権を失ったときウ　ＢがＡによって相続人から廃除されて相続権を失ったときエ　Ｂが相続放棄をしたとき","choice_1":"ア、エ","choice_2":"イ、ウ","choice_3":"ア、ウ、エ","choice_4":"ア、イ、ウ","official_accepted_answers":"4","answer_conclusion":"正解：4。代襲相続が生じるのは、被相続人Aの子Bが相続開始前に死亡したとき、相続欠格となったとき、又は廃除で相続権を失ったときである。放棄は代襲相続の原因ではない。本問ではア・イ・ウが該当しエは該当しないため、組合せを全て含む肢4が正解。","answer_reason":"代襲相続が生じるのは、被相続人Aの子Bが相続開始前に死亡したとき、相続欠格となったとき、又は廃除で相続権を失ったときである。放棄は代襲相続の原因ではない。本問ではア・イ・ウが該当しエは該当しないため、組合せを全て含む肢4が正解。","scoring_exception_note":"","deep_lecture":"相続は被相続人が死亡したときに開始し、法律が定める順位の相続人に権利義務が承継される。子が第1順位の相続人となるが、その子が被相続人より先に死亡した場合などに孫が代わって相続する仕組みが「代襲相続」である。祖父A、子B、孫Cの3世代を図にして考える。通常はAが死亡するとBが相続する。ところがAより前にBが死亡していれば、CがBに代わって相続人になる。\n代襲の原因は民法887条2項の条文に沿って「死亡・相続欠格・廃除」をまとめて覚える。相続欠格は、被相続人の遺言書の偽造など、相続制度の公正を害する所定の行為をした者から法律上当然に相続資格を奪う仕組みである。廃除は被相続人への虐待など一定の事由がある場合に、家庭裁判所の手続などによって相続資格を失わせるもので、単なる不仲だけで当然に成立するわけではない。\n放棄は他の三事由と区別する。相続放棄をした者は民法939条によってその相続に関して初めから相続人とならなかったものとみなされる。887条の代襲原因には放棄がなく、Bが相続放棄してもCがBを代襲するわけではない。Cが別の資格で相続人になるかは別問題である。\n代襲の要件を問う組合せ問題では、各記述について「代襲原因に当たるか」と「子・孫の関係が満たされるか」を個別確認する。本問はCが直系卑属であることを与えているため、原因の判定に集中できる。ア＝◯、イ＝◯、ウ＝◯、エ＝×を確定してから、全て含む選択肢を選ぶ。","system_purpose":"相続人の子が先に死亡・欠格・廃除となっても、その直系卑属の相続期待を一定の範囲で保護し、相続の公平を図る。","practical_examples":"祖父Aの相続開始前に息子Bが死亡していれば、孫CはBを代襲できる。BがAの遺言書を偽造した場合や、BがAから廃除された場合も代襲の可能性がある。Bが家庭裁判所へ相続放棄を申述した場合は代襲しない。","advanced_knowledge":"兄弟姉妹の代襲については再代襲の扱いが直系卑属と異なる。相続欠格は法定の原因に当たれば生じるが、廃除は所定の手続を要する。相続放棄の熟慮期間や方法は別に整理する。","comparative_explanation":"死亡・欠格・廃除：子への代襲あり。放棄：代襲なし。相続欠格：法律上の資格喪失。廃除：一定の事由と手続による排除。","important_points":"代襲原因は死亡・欠格・廃除 ／ 相続放棄は代襲原因ではない ／ 孫Cと被相続人Aの直系卑属関係を確認 ／ 「全て」を問う組合せは漏れも誤り","trick_patterns":"放棄も相続人でなくなるから代襲すると誤解 ／ 遺言書偽造による欠格を忘れる ／ 正しい要素が一部入れば組合せを選んでしまう\n【誤答注意】設問中の [[WARN:「ア、ウ、エ」]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"==代襲は死亡・欠格・廃除==。[[WARN:相続放棄は代襲しない]]。[[NOTE:遺言書偽造は欠格事由]]。ア・イ・ウ＝肢4。","review_check_questions":"Q:代襲の3原因は？ A:死亡・相続欠格・廃除。 | Q:相続放棄をしたBの子CはBを代襲する？ A:しない。 | Q:本問の該当記述は？ A:ア・イ・ウ。","substatement_reasoning":"ア：該当する（Bの先死亡は887条2項）。イ：該当する（遺言書偽造は891条の欠格事由となり887条2項で代襲）。ウ：該当する（廃除は892条等・887条2項により代襲）。エ：該当しない（放棄は939条により初めから相続人でなかったものとみなされ、代襲原因に列挙されない）。正しい組合せ＝ア・イ・ウ、肢4。","reform_status":"none_confirmed","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法887条2・3項、891条、892条、893条、939条 | https://laws.e-gov.go.jp/law/129AC0000000089","marker_yellow_spans":"代襲は死亡・欠格・廃除","marker_red_spans":"「ア、ウ、エ」","marker_blue_spans":"遺言書偽造は欠格事由","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜選択肢真偽はcompoundに補正。ア〜エの論拠をさらに独立照合する必要","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"compound","choice_1_is_exam_answer":"false","choice_1_wrong_part":"「ア、エ」","choice_1_reason":"誤り。アの「BがAより前に死亡」は民法887条2項の代襲原因であり、CがBの地位を代襲する。一方、エの「Bが相続放棄」は代襲原因ではない。放棄したBは初めから相続人でなかったものとみなされるため、孫Cが当然にBの代わりに相続人になるわけではない。さらにイ・ウも代襲原因であるのに選択肢1には含まれない。","choice_1_corrected_statement":"代襲相続に当たるのはア・イ・ウであり、エを含めない。","choice_1_legal_basis":"民法887条・939条","choice_1_exam_tip":"「全て掲げた」を読み飛ばさない。","choice_2_truth":"compound","choice_2_is_exam_answer":"false","choice_2_wrong_part":"「イ、ウ」","choice_2_reason":"誤り。イの遺言書偽造による相続欠格とウの廃除は、いずれもBが相続権を失う代襲原因である。ただしこれだけでは不十分で、アのBがAより先に死亡した場合も同じく代襲相続が認められる。設問は「全て掲げたもの」を求めるため、二つとも正しい要素を含んでいるだけでは正解にならない。欠落したアを必ず数える。","choice_2_corrected_statement":"代襲相続に当たるのはア・イ・ウであり、アも含める。","choice_2_legal_basis":"民法887条・891条","choice_2_exam_tip":"相続放棄では代襲しない。","choice_3_truth":"compound","choice_3_is_exam_answer":"false","choice_3_wrong_part":"「ア、ウ、エ」","choice_3_reason":"誤り。アの死亡、ウの廃除は代襲原因だが、エの相続放棄を誤って含んでいる。加えて、イの相続欠格による代襲が抜けている。死亡・欠格・廃除を並べ、放棄は代襲なしと判定するのが民法887条2項の基本である。消去法だけに頼ると「放棄も相続権がなくなるから代襲」と誤認しやすい。","choice_3_corrected_statement":"代襲相続に当たるのはア・イ・ウであり、イを含め、エを除く。","choice_3_legal_basis":"民法887条・939条","choice_3_exam_tip":"遺言書偽造は欠格原因。","choice_4_truth":"compound","choice_4_is_exam_answer":"true","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。ア＝被相続人Aより先にBが死亡、イ＝Bによる遺言書偽造で相続欠格、ウ＝AによるBの廃除。これら三事由では、Bの子でAの直系卑属に当たるCが代襲相続人となる。エの相続放棄だけは代襲原因ではなく、Bが初めから相続人でなかったものと扱われる。したがってア・イ・ウを全て掲げた肢4が正しい。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"民法887条・891条・892条","choice_4_exam_tip":"廃除も代襲原因になる。"},{"question_id":"2025-Q06","year":2025,"session":"通常","question_no":6,"major_field":"権利関係","section":"民法","unit":"物権変動","topic":"他人物売買・無効登記・時効取得・立木","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"Ａが所有している甲土地についての物権変動に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","choice_1":"Ｂが甲土地をＡに無断でＣに売却し、その後、ＢがＡから甲土地を購入した場合、Ｃは、Ｂから甲土地を購入した時点に遡って甲土地の所有権を取得する。","choice_2":"Ｄが甲土地につき、Ａに無断でＤへの虚偽の所有権の移転の登記をした上で、甲土地をＥに売却してその旨の登記をした場合において、その後、ＡがＦに甲土地を売却したときは、Ｆは、Ｅに対し、甲土地の所有権を主張することができる。","choice_3":"Ｇが甲土地の所有権を時効取得した場合、Ｇはその後にＡを単独相続したＨに対して、登記を備えていなくても、甲土地の所有権を主張することができる。","choice_4":"Ａが甲土地上の立木の所有権を留保して甲土地をＪに売却し、その後、ＪがＫに甲土地及びその上の立木を売却した場合には、Ａは、Ｋに対し、立木の所有権の留保につき登記又は明認方法を備えない限り、立木の所有権を主張することができない。","official_accepted_answers":"1","answer_conclusion":"《他人物売買》の売主が後から所有権を得ても、買主の取得が売買契約時に遡るわけではありません。肢1が誤り。","answer_reason":"【結論】《他人物売買》の売主が後から所有権を得ても、買主の取得が売買契約時に遡るわけではありません。肢1が誤り。\n【解き方】他人物売買は債権契約として成立しても、買主が契約日に当然に権利を取得するわけではない。売主が後から所有権を取得した場合には、その取得を基礎として買主に権利が移転する。他方、無権限者による登記は実体的権利を創設しない。時効取得の完成後に元所有者を相続した者は通常その地位を承継するにすぎない。立木は土地と別の所有権を主張するなら登記や明認方法による公示が重要にな","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】他人物売買は債権契約として成立しても、買主が契約日に当然に権利を取得するわけではない。売主が後から所有権を取得した場合には、その取得を基礎として買主に権利が移転する。他方、無権限者による登記は実体的権利を創設しない。時効取得の完成後に元所有者を相続した者は通常その地位を承継するにすぎない。立木は土地と別の所有権を主張するなら登記や明認方法による公示が重要になる。すべてを「登記がある・ない」の一言で決めず、登記の原因、真の所有者、第三者の地位を確かめる。\n【本問への当てはめ】《契約を有効に結ぶこと》と《直ちに所有権を移せること》は別です。民法561条により他人物売買は有効でも売主は権利を取得して移転する義務を負います。物権変動では虚偽登記、時効完成と相続、立木の公示方法を別々に整理しましょう。\n【判断順序・類題への対応】他人物売買の有効性と所有権移転の時期／真実の登記と虚偽登記／時効完成後の相続人と新たな第三取得者の対抗関係を区別する。\n【具体的な当てはめ】A所有地を無断でBがCに売り、数か月後にBがAから取得した例では、Cの取得時点を最初の売買契約日まで遡らせない。 ","system_purpose":"制度の趣旨：他人物売買は債権契約として成立しても、買主が契約日に当然に権利を取得するわけではない。売主が後から所有権を取得した場合には、その取得を基礎として買主に権利が移転する。他方、無権限者による登記は実体的権利を創設しない。時効取得の完成後に元所有者を相続した者は通常その地位を承継するにすぎない。立木は土地と別の所有権を主張するなら登記や明認方法による公示が重要になる。すべてを「登記が","practical_examples":"【具体例】A所有地を無断でBがCに売り、数か月後にBがAから取得した例では、Cの取得時点を最初の売買契約日まで遡らせない。","advanced_knowledge":"【周辺・発展】《契約を有効に結ぶこと》と《直ちに所有権を移せること》は別です。民法561条により他人物売買は有効でも売主は権利を取得して移転する義務を負います。物権変動では虚偽登記、時効完成と相続、立木の公示方法を別々に整理しましょう。\n[[NOTE:他人物売買の有効性と所有権移転の時期／真実の登記と虚偽登記／時効完成後の相続人と新たな第三取得者の対抗関係を区別する。]]","comparative_explanation":"他人物売買の有効性と所有権移転の時期／真実の登記と虚偽登記／時効完成後の相続人と新たな第三取得者の対抗関係を区別する。","important_points":"==他人物売買は有効だが後発取得の効力は過去に遡らない／虚偽登記だけで所有権は移らない。==","trick_patterns":"物権変動は「当事者か第三者か」と「いつ権利を取得したか」を時系列で書く。｜本問特有の誤誘導：《他人物売買》の売主が後から所有権を得ても、買主の取得が売買契約時に遡るわけではありません。肢1が誤り。\n【誤答注意】設問中の [[WARN:購入した時点に遡って]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"他人物売買は有効だが後発取得の効力は過去に遡らない／虚偽登記だけで所有権は移らない。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 1。\nQ2: 本問の主要な判断要件は何か？ A2: 他人物売買の有効性と所有権移転の時期／真実の登記と虚偽登記／時効完成後の相続人と新たな第三取得者の対抗関係を区別する。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法176条・177条・561条、時効取得・立木 1_3":"UNKNOWN","question_type":"single_correct","question_text":"Ａは自己の所有する甲建物を事務所としてＢに賃貸し（以下この問において「本件契約」という。）、その後、本件契約の期間中に甲建物の屋根に雨漏りが生じたため、ＣがＢから甲建物の屋根の修理を請け負い、Ｃによる修理が完了した。この場合における次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choice_1":"ＢがＣに修理代金を支払わないまま無資力となり、賃料を滞納して本件契約が解除されたことにより甲建物はＡに明け渡された。この場合、ＣはＡに対して、事務管理に基づいて修理費用相当額の支払を求めることはできない。","choice_2":"ＢがＣに修理代金を支払ったとしても、本件契約において、Ａの負担に属するとされる甲建物の屋根の修理費用について直ちに償還請求することができる旨の特約がない限り、契約終了時でなければ、ＢはＡに対して償還を求めることはできない。","choice_3":"ＢがＣに修理代金を支払わない場合、Ｃは、Ｂが占有する甲建物につき、当然に不動産工事の先取特権を行使することができる。","choice_4":"ＢがＣに修理代金を支払わないまま無資力となり、賃料を滞納して本件契約が解除されたことにより甲建物はＡに明け渡された。本件契約において、ＢがＡに権利金を支払わないことの代償として、甲建物の修理費用をＢの負担とする旨の特約が存し、当該屋根の修理費用と権利金が相応していたときであっても、ＣはＡに対して、不当利得に基づいて修理費用相当額の支払を求めることができる。","official_accepted_answers":"1","answer_conclusion":"屋根修理の請負契約は《BとC》の間で成立しています。CはAに事務管理として当然に修理費を請求できず、肢1が正しい。","answer_reason":"【結論】屋根修理の請負契約は《BとC》の間で成立しています。CはAに事務管理として当然に修理費を請求できず、肢1が正しい。\n【解き方】建物修理に関する費用の請求先は、その契約の相手方と法定請求権の成立要件から決める。屋根の修理を発注したBと工事をしたCは請負関係にあり、建物所有者Aが工事の恩恵を受けたという事実のみで、AとCの請負契約が成立するわけではない。事務管理は他人のために義務なく事務を処理する制度、不当利得は法律上の原因なく利益を受けたときの返還制度であり、それぞれ要件が違う。賃借","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】建物修理に関する費用の請求先は、その契約の相手方と法定請求権の成立要件から決める。屋根の修理を発注したBと工事をしたCは請負関係にあり、建物所有者Aが工事の恩恵を受けたという事実のみで、AとCの請負契約が成立するわけではない。事務管理は他人のために義務なく事務を処理する制度、不当利得は法律上の原因なく利益を受けたときの返還制度であり、それぞれ要件が違う。賃借人自身が賃貸人負担の必要費を支出した場合には即時償還請求が可能で、契約終了時の有益費と区別する。不動産工事の先取特権も登記など厳格な要件があり、費用未払いなら自動的に行使できる権利ではない。\n【本問への当てはめ】三者を図にすると、所有者A―賃借人B（賃貸借）、B―施工者C（請負）です。費用償還請求（B→A）、請負代金（C→B）、事務管理（義務なく他人事務を行う）、不当利得（法律上の原因なく利益）の要件を分けます。\n【判断順序・類題への対応】必要費＝直ちに償還請求／有益費＝終了時の償還が原則。事務管理・不当利得・請負代金・先取特権は根拠と相手方がそれぞれ違う。","system_purpose":"制度の趣旨：建物修理に関する費用の請求先は、その契約の相手方と法定請求権の成立要件から決める。屋根の修理を発注したBと工事をしたCは請負関係にあり、建物所有者Aが工事の恩恵を受けたという事実のみで、AとCの請負契約が成立するわけではない。事務管理は他人のために義務なく事務を処理する制度、不当利得は法律上の原因なく利益を受けたときの返還制度であり、それぞれ要件が違う。賃借人自身が賃貸人負担の","practical_examples":"【具体例】借主Bが雨漏り修繕を施工業者Cに依頼し、建物を退去した後にCが所有者Aへ直接請求できるかは、BとCの工事契約とは別に検討する。","advanced_knowledge":"【周辺・発展】三者を図にすると、所有者A―賃借人B（賃貸借）、B―施工者C（請負）です。費用償還請求（B→A）、請負代金（C→B）、事務管理（義務なく他人事務を行う）、不当利得（法律上の原因なく利益）の要件を分けます。\n[[NOTE:必要費＝直ちに償還請求／有益費＝終了時の償還が原則。事務管理・不当利得・請負代金・先取特権は根拠と相手方がそれぞれ違う。]]","comparative_explanation":"必要費＝直ちに償還請求／有益費＝終了時の償還が原則。事務管理・不当利得・請負代金・先取特権は根拠と相手方がそれぞれ違う。","important_points":"==必要費は直ちに償還／契約相手方を確認／不当利得は法律上の原因の有無。==","trick_patterns":"修理を受けて建物価値が上がったから所有者が必ず払う、とは限りません。｜本問特有の誤誘導：屋根修理の請負契約は《BとC》の間で成立しています。CはAに事務管理として当然に修理費を請求できず、肢1が正しい。","memory_summary":"必要費は直ちに償還／契約相手方を確認／不当利得は法律上の原因の有無。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 1。\nQ2: 本問の主要な判断要件は何か？ A2: 必要費＝直ちに償還請求／有益費＝終了時の償還が原則。事務管理・不当利得・請負代金・先取特権は根拠と相手方がそれぞれ違う。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法196条・608条・697条・703条・327条・338条 | 民法608条・697条・703条 / 民法不動産工事先取特権の規定 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"必要費は直ちに償還／契約相手方を確認／不当利得は法律上の原因の有無。","marker_red_spans":"当然に","marker_blue_spans":"必要費＝直ちに償還請求／有益費＝終了時の償還が原則。事務管理・不当利得・請負代金・先取特権は根拠と相手方がそれぞれ違う。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"true","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。CはBとの請負契約に基づき修理したのであって、Aの事務を法律上の義務なく管理したわけではありません。Cの請求相手は原則Bです。\n【本肢の根拠・注意点】Cの工事はBから注文を受けた請負契約の履行であり、Aのために義務なく事務管理したという構造ではない。Bが無資力になっても、Cの請負代金債権が自動的にAへ移るわけではなく、事務管理に基づく請求は成立しないと判断する。","choice_1_corrected_statement":"原文どおりで正しい","choice_1_legal_basis":"民法196条・608条・697条・703条・327条・338条（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"修理を受けて建物価値が上がったから所有者が必ず払う、とは限りません。｜正しい。CはBとの請負契約に基づき修理したのであって、Aの事務を法律上の義務なく管理したわけで 分割の対象となる共有持分と、遺産外の持分を有する他の共有者との関係を分けて考える。また共有者の一人が目的物全部を使用していても、その占有が直ちに無権原になるとは限らず、他の共有者が自己への全部明渡しを当然に請求できるわけではない。\n【本問への当てはめ】共有については《保存行為は各共有者単独》《管理は持分の価格の過半数》《変更は原則全員の同意》の区別を理解することが出発点。持分放棄と共有物分割は別の問題で、持分放棄は残存共有者に帰属します。\n【判断順序・類題への対応】保存行為は各共有者が単独で可能／管理や変更は別途の要件／共有物分割と遺産分割は手続が異なる。\n【具体的な当てはめ】A・B・C各3分の1の土地でAが持分放棄をすれば、BとCに持分が帰属するのが原則である。 ","system_purpose":"制度の趣旨：共有は、各人が物の全体について持分に応じた権利を有する法律関係である。共有者は保存行為を単独で行えるため、無権利者による虚偽登記を除去する請求が問題になる。持分を放棄した場合は原則として他の共有者に帰属し、当然に国庫に移るわけではない。共有者の一人が死亡して相続が生じた場合、遺産分割の対象となる共有持分と、遺産外の持分を有する他の共有者との関係を分けて考える。また共有者の一人が","practical_examples":"【具体例】A・B・C各3分の1の土地でAが持分放棄をすれば、BとCに持分が帰属するのが原則である。","advanced_knowledge":"【周辺・発展】共有については《保存行為は各共有者単独》《管理は持分の価格の過半数》《変更は原則全員の同意》の区別を理解することが出発点。持分放棄と共有物分割は別の問題で、持分放棄は残存共有者に帰属します。\n[[NOTE:保存行為は各共有者が単独で可能／管理や変更は別途の要件／共有物分割と遺産分割は手続が異なる。]]","comparative_explanation":"保存行為は各共有者が単独で可能／管理や変更は別途の要件／共有物分割と遺産分割は手続が異なる。","important_points":"==持分放棄→他の共有者へ／保存行為→1人で可能／単独占有者に当然の明渡請求は不可。==","trick_patterns":"「持ち主がいない財産＝国庫」を共有持分の放棄にそのまま当てはめない。｜本問特有の誤誘導：共有持分を放棄すると、原則として《他の共有者》に帰属します。国庫に帰属するとした肢2が誤りです。","memory_summary":"持分放棄→他の共有者へ／保存行為→1人で可能／単独占有者に当然の明渡請求は不可。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 2。\nQ2: 本問の主要な判断要件は何か？ A2: 保存行為は各共有者が単独で可能／管理や変更は別途の要件／共有物分割と遺産分割は手続が異なる。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法249条・252条・255条・256条・258条 | 民法251条・252条・255条 / 法務省 所有者不明土地解消に向けた民事基本法制の見直し | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"持分放棄→他の共有者へ／保存行為→1人で可能／単独占有者に当然の明渡請求は不可。","marker_red_spans":"国庫に帰属する","marker_blue_spans":"保存行為は各共有者が単独で可能／管理や変更は別途の要件／共有物分割と遺産分割は手続が異なる。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_pa
