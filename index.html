'use strict';
const BANK=[{"question_id":"2023-Q01","year":2023,"session":"通常","question_no":1,"major_field":"権利関係","section":"民法","unit":"相続","topic":"相続・遺言・遺留分・遺産分割","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"次の1 から4 までの記述のうち、民法の規定、判例及び下記判決文によれば、誤っているものはどれか。（判決文）遺産は、相続人が数人あるときは、相続開始から遺産分割までの間、共同相続人の共有に属するものであるから、この間に遺産である賃貸不動産を使用管理した結果生ずる金銭債権たる賃料債権は、遺産とは別個の財産というべきであって、各共同相続人がその相続分に応じて分割単独債権として確定的に取得するものと解するのが相当である。","choice_1":"遺産である不動産から、相続開始から遺産分割までの間に生じた賃料債権は、遺産である不動産が遺産分割によって複数の相続人のうちの一人に帰属することとなった場合、当該不動産が帰属することになった相続人が相続開始時にさかのぼって取得する。","choice_2":"相続人が数人あるときは、相続財産は、その共有に属し、各共同相続人は、その相続分に応じて被相続人の権利義務を承継する。","choice_3":"遺産分割の効力は、相続開始の時にさかのぼって生ずる。ただし、第三者の権利を害することはできない。","choice_4":"遺産である不動産が遺産分割によって複数の相続人のうちの一人に帰属することとなった場合、当該不動産から遺産分割後に生じた賃料債権は、遺産分割によって当該不動産が帰属した相続人が取得する。","official_accepted_answers":"1","answer_conclusion":"本問の正解は選択肢1。","answer_reason":"本問の正解は選択肢1。 賃貸建物自体の遺産分割と分割前の賃料は別。分割前の賃料は各相続分で確定、分割後は取得者。","scoring_exception_note":"","deep_lecture":"共同相続では、相続人が複数いると相続財産は共同相続人の共有になります（民法898条）。その後に遺産分割を行うと、民法909条により原則としてその効力は相続開始時にさかのぼります。しかし、==遺産そのもの==である賃貸建物と、相続開始後に建物の利用から新たに生じた==賃料債権==は区別しなければなりません。最判平成17年9月8日は、相続開始から遺産分割までの間に生じた賃料債権は、遺産とは別個の財産であり、各共同相続人が相続分に応じて分割された単独債権として==確定的に==取得すると示しました。この「確定的に」が試験上重要で、後日建物を特定の一人が取得したからといって、過去の家賃までその一人がさかのぼって独占するわけではありません。一方、遺産分割によって建物の帰属が決まった後に新しく発生する家賃は、その建物を取得した人が受け取ります。判定手順は、①相続開始日を確認、②遺産分割の日を確認、③問題の賃料がその前か後かを分ける、④分割前なら相続分、分割後なら取得者、です。遺産分割の遡及効という条文を知っていても、判例による賃料債権の例外的な取扱いを知らないと誤答します。なお、預貯金債権の遺産分割上の扱いは別論点であり、同じ可分債権として単純に処理しないようにします。","system_purpose":"相続人間で家賃収入を公平に清算し、遺産分割が遅れることによる帰属の不確実性を解消する。分割の遡及効と既に発生した債権の安定を調整する。","practical_examples":"A死亡後、家賃月20万円の建物を子B・Cが各2分の1の相続分で共同相続。3か月後の遺産分割でBが建物を取得しても、分割前の60万円はB・Cが各30万円の賃料債権を取得する。分割後の賃料はBが取得。","advanced_knowledge":"賃料債権は相続開始後に生じた財産であり、被相続人が死亡時点で有していた[[NOTE:預貯金等]]と同じ論点ではありません。相続人間の別段の合意の有無など実務上の事情にも留意します。","comparative_explanation":"民法909条：遺産分割の効力は原則相続開始時に遡及／最判平成17年9月8日：分割前に生じた賃料は相続分によって確定し、後の分割で変動しない／分割後賃料：建物取得者。","important_points":"==分割前の賃料==は各相続分に応じて確定取得／==分割後の賃料==は建物取得者／遡及効を賃料に機械適用しない。","trick_patterns":"[[WARN:遺産分割の遡及効]]を分割前に発生した賃料へそのまま及ぼす誤答。[[WARN:賃貸建物と賃料債権]]を混同する誤答。","memory_summary":"賃貸建物自体の遺産分割と分割前の賃料は別。分割前の賃料は各相続分で確定、分割後は取得者。","review_check_questions":"Q 分割前の賃料は誰が取得？ A 各共同相続人が相続分に応じて取得。\nQ 後の分割で過去の賃料は一人に遡及？ A しない。\nQ 分割後の賃料は？ A 建物取得者。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法898条・899条・909条 https://laws.e-gov.go.jp/law/129AC0000000089 ／最高裁平成17年9月8日（平成16年(受)第1222号）https://yuhikaku.com/articles/-/15050","marker_yellow_spans":"遺産そのもの|賃料債権|確定的に|分割前の賃料|分割後の賃料","marker_red_spans":"遺産分割の遡及効|賃貸建物と賃料債権","marker_blue_spans":"預貯金等","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R5_qestion_answer%E3%80%80.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"true","choice_1_wrong_part":"相続開始時にさかのぼって取得する","choice_1_reason":"誤り。最判平成17年9月8日は、共同相続の賃貸不動産から相続開始後・遺産分割前に発生した賃料債権を、共同相続人が各相続分に応じて確定的に取得すると判断しています。後で不動産が一人の相続人に帰属したとしても、その遺産分割に過去の賃料債権の帰属を覆す効力はありません。「相続開始時にさかのぼって取得」の部分を賃料にまで当てはめるのが誤りです。","choice_1_corrected_statement":"遺産分割までに発生した賃料債権は、各共同相続人が相続分に応じて確定的に取得し、後の遺産分割によって帰属は変動しない。","choice_1_legal_basis":"最判平成17年9月8日・民法898条・899条・909条","choice_1_exam_tip":"[[WARN:遺産分割の遡及効]]を分割前に発生した賃料へそのまま及ぼす誤答。[[WARN:賃貸建物と賃料債権]]を混同する誤答。","choice_2_truth":"true","choice_2_is_exam_answer":"false","choice_2_wrong_part":"該当なし","choice_2_reason":"正しい。民法898条は相続人が数人あるときの相続財産の共有を定め、899条は各共同相続人が相続分に応じて被相続人の権利義務を承継することを定めます。本問の賃貸不動産も、相続開始から分割まで共同相続財産として管理されます。ただし、賃貸不動産自体が共有であることと、管理によって後から発生する賃料債権が誰に帰属するかは別の判断を要します。","choice_2_corrected_statement":"原文どおりで正しい","choice_2_legal_basis":"民法898条・899条","choice_2_exam_tip":"[[WARN:遺産分割の遡及効]]を分割前に発生した賃料へそのまま及ぼす誤答。[[WARN:賃貸建物と賃料債権]]を混同する誤答。","choice_3_truth":"true","choice_3_is_exam_answer":"false","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい。民法909条は遺産分割に相続開始時への遡及効を認め、ただし第三者の権利を害することはできないとしています。この条文は不動産自体の取得を分割時点から相続開始時点にさかのぼらせる考え方ですが、すでに各共同相続人に確定的に帰属した遺産分割前の賃料債権の分配まで覆すことにはなりません。遡及効の対象を広げすぎない点が重要です。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"民法909条","choice_3_exam_tip":"[[WARN:遺産分割の遡及効]]を分割前に発生した賃料へそのまま及ぼす誤答。[[WARN:賃貸建物と賃料債権]]を混同する誤答。","choice_4_truth":"true","choice_4_is_exam_answer":"false","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。遺産分割後に発生した賃料は、遺産分割によってその不動産を取得した相続人の収益になります。ここで問われるのは、どの時期の賃料かという区切りです。分割前の賃料債権は相続分に応じて各相続人が取得する一方で、分割後の賃料は分割によって不動産を取得した人が取得します。分割前後を同じ扱いにしないでください。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"最判平成17年9月8日・民法909条","choice_4_exam_tip":"[[WARN:遺産分割の遡及効]]を分割前に発生した賃料へそのまま及ぼす誤答。[[WARN:賃貸建物と賃料債権]]を混同する誤答。"},{"question_id":"2023-Q02","year":2023,"session":"通常","question_no":2,"major_field":"権利関係","section":"民法","unit":"相隣関係","topic":"相隣関係","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"相隣関係に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choice_1":"土地の所有者は、境界標の調査又は境界に関する測量等の一定の目的のために必要な範囲内で隣地を使用することができる場合であっても、住家については、その家の居住者の承諾がなければ、当該住家に立ち入ることはできない。","choice_2":"土地の所有者は、隣地の竹木の枝が境界線を越える場合、その竹木の所有者にその枝を切除させることができるが、その枝を切除するよう催告したにもかかわらず相当の期間内に切除しなかったときであっても、自らその枝を切り取ることはできない。","choice_3":"相隣者の一人は、相隣者間で共有する障壁の高さを増すときは、他方の相隣者の承諾を得なければならない。","choice_4":"他の土地に囲まれて公道に通じない土地の所有者は、公道に出るためにその土地を囲んでいる他の土地を自由に選んで通行することができる。","official_accepted_answers":"1","answer_conclusion":"本問の正解は選択肢1。","answer_reason":"本問の正解は選択肢1。 住家は承諾必須。枝は催告等の例外で切除可、根は切除可。囲繞地通行は必要・損害最少で選択。","scoring_exception_note":"","deep_lecture":"==相隣関係==は、隣接する土地の所有者が土地を有効利用できるようにしつつ、他人の所有権や生活の平穏を不必要に害さないための調整ルールです。第一に==隣地の使用==民法209条では境界や工作物の修繕、測量、越境枝の切除など特定の目的で必要な範囲内に限り隣地の使用が認められます。しかし、住家の内部には居住者の承諾がなければ立ち入れません。第二に==越境する枝==民法233条では竹木の所有者に切除させるのが原則ですが、催告後の不履行、所有者不明等、急迫の事情など定められた場合は自分で切り取れる例外があります。これは放置された越境枝によって隣地の利用が妨げられる問題への対応です。第三に共同の境界障壁高さを増すことに相手方の同意が常に必要だと考えると誤ります。費用負担と損害にも目を向ける必要があります。第四に==囲繞地通行権==。公道へ出られない土地から通行する場合、必要な通行を認めつつ損害の少ない位置・方法を選ばなければなりません。設問では「必ず承諾」「どこでも自由」「催告しても一切不可」という絶対表現を疑います。相隣関係は、自由に使えるという権利だけではなく、その行使に伴う要件・通知・方法の制限を組にして覚えます。 具体的には隣地使用の必要性だけでなく、相手方の住居への立入りや損害を抑える方法も考慮する。","system_purpose":"境界で生じる利用上の対立を解決し、必要な測量・修繕・通行を可能にするとともに、居住者と隣地所有者の生活・所有権を保護する。","practical_examples":"例：Aが境界の測量をするためBの敷地を使う必要があっても、Bの住家に承諾なく入れない。越境枝についてBに催告しても相当期間放置された場合には民法233条3項の条件で切除を検討できる。","advanced_knowledge":"[[NOTE:枝と根]]の区別も頻出。越境した根は民法233条4項により切り取れる一方、枝は3項の例外要件を先に確認。改正民法209条は必要な範囲で隣地使用を認めるが、住家の同意例外は維持される。","comparative_explanation":"住家への立入り→居住者の承諾が必要／越境枝→原則所有者に切除させ、法定例外で自力切除／越境根→切取り可／囲繞地通行→必要かつ損害最少の場所・方法。","important_points":"==住家立入り＝居住者の承諾==／==越境枝には自力切除の例外==／==囲繞地通行は損害最少==。","trick_patterns":"[[WARN:枝と根]]の区別、[[WARN:絶対に切れない]]という過度の断定、[[WARN:自由に選んで通行]]という必要性・損害最少要件の見落としに注意。","memory_summary":"住家は承諾必須。枝は催告等の例外で切除可、根は切除可。囲繞地通行は必要・損害最少で選択。","review_check_questions":"Q 住家に立ち入る条件は？ A 居住者の承諾。\nQ 越境枝は絶対に自力切除できない？ A 法定の場合はできる。\nQ 囲繞地の通路は自由？ A 必要かつ損害最少の場所・方法。","substatement_reasoning":"","reform_status":"review_required","reform_title":"令和5年4月1日施行・相隣関係規定見直し","reform_effective_date":"2023-04-01","reform_before":"","reform_after":"","reform_2026_impact":"2023年試験は改正後規定による出題。2026年時点でも相隣関係における改正部分の条件を確認する。","reform_sources":"https://laws.e-gov.go.jp/law/129AC0000000089","legal_sources":"民法209条・210条・211条・231条・233条 https://laws.e-gov.go.jp/law/129AC0000000089","marker_yellow_spans":"相隣関係|隣地の使用|越境する枝|囲繞地通行権|住家立入り＝居住者の承諾|越境枝には自力切除の例外|囲繞地通行は損害最少","marker_red_spans":"枝と根|絶対に切れない|自由に選んで通行","marker_blue_spans":"枝と根","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R5_qestion_answer%E3%80%80.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"true","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。民法209条1項は境界標調査や境界測量などの必要な範囲で隣地を使用できる場合を認めます。しかし、同項ただし書は==住家への立入りには居住者の承諾==が必要と定めています。隣地の敷地を使用することと、家屋の内部へ入ることは保護される利益が異なります。調査に必要だという理由だけで住居の平穏を破ることはできません。","choice_1_corrected_statement":"原文どおりで正しい","choice_1_legal_basis":"民法209条1項","choice_1_exam_tip":"[[WARN:枝と根]]の区別、[[WARN:絶対に切れない]]という過度の断定、[[WARN:自由に選んで通行]]という必要性・損害最少要件の見落としに注意。","choice_2_truth":"false","choice_2_is_exam_answer":"false","choice_2_wrong_part":"相当の期間内に切除しなかったときであっても、自らその枝を切り取ることはできない","choice_2_reason":"誤り。民法233条は越境した枝の切除を原則として竹木の所有者にさせる制度ですが、3項は例外的に越境を受けた土地の所有者が切り取れる場合を定めます。竹木の所有者に枝の切除を催告し、相当期間内に切除されない場合などには自力切除が可能です。「催告しても絶対に自分では切れない」という断定が、令和5年4月施行の改正後の規定に反します。","choice_2_corrected_statement":"竹木の所有者に切除を催告しても相当期間内に切除されないときなど、民法233条3項所定の場合には、越境された土地の所有者が枝を切り取ることができる。","choice_2_legal_basis":"民法233条3項","choice_2_exam_tip":"[[WARN:枝と根]]の区別、[[WARN:絶対に切れない]]という過度の断定、[[WARN:自由に選んで通行]]という必要性・損害最少要件の見落としに注意。","choice_3_truth":"false","choice_3_is_exam_answer":"false","choice_3_wrong_part":"他方の相隣者の承諾を得なければならない","choice_3_reason":"誤り。共有の境界障壁について高さを増す場面では、民法231条等の規定により、他方の承諾がなくても増築できる場合があります。その場合、増築費用は増築者側が負担し、高さの増加による損害についても問題になり得ます。「承諾を得なければならない」と一律の同意要件を置いた点を疑います。境界障壁の共用と工事実施者の負担を分けて検討してください。","choice_3_corrected_statement":"共有障壁の高さは、法定要件に従って他方の承諾なく増すことができる場合があり、増築者が費用を負担する。","choice_3_legal_basis":"民法231条・232条（境界障壁）","choice_3_exam_tip":"[[WARN:枝と根]]の区別、[[WARN:絶対に切れない]]という過度の断定、[[WARN:自由に選んで通行]]という必要性・損害最少要件の見落としに注意。","choice_4_truth":"false","choice_4_is_exam_answer":"false","choice_4_wrong_part":"自由に選んで通行することができる","choice_4_reason":"誤り。囲繞地通行権は、公道に出られない土地の必要な通行を確保する制度ですが、囲んでいる土地を所有者が完全に自由に選べるわけではありません。民法211条は通行する場所・方法について、通行権者の必要を満たし、かつ他の土地に生ずる損害が最も少ない方法を要求します。交通の便宜と隣地所有者の負担軽減のバランスを取ります。","choice_4_corrected_statement":"囲繞地通行権の場所・方法は、通行のため必要で、かつ他の土地に生じる損害が最も少ないものを選ばなければならない。","choice_4_legal_basis":"民法210条・211条","choice_4_exam_tip":"[[WARN:枝と根]]の区別、[[WARN:絶対に切れない]]という過度の断定、[[WARN:自由に選んで通行]]という必要性・損害最少要件の見落としに注意。"},{"question_id":"2023-Q03","year":2023,"session":"通常","question_no":3,"major_field":"権利関係","section":"民法","unit":"請負","topic":"請負契約","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"Ａを注文者、Ｂを請負人として、Ａ所有の建物に対して独立性を有さずその構成部分となる増築部分の工事請負契約を締結し、Ｂは3 か月間で増築工事を終了させた。この場合に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。なお、この問において「契約不適合」とは品質に関して契約の内容に適合しないことをいい、当該請負契約には契約不適合責任に関する特約は定められていなかったものとする。","choice_1":"ＡがＢに請負代金を支払っていなくても、Ａは増築部分の所有権を取得する。","choice_2":"Ｂが材料を提供して増築した部分に契約不適合がある場合、Ａは工事が終了した日から1年以内にその旨をＢに通知しなければ、契約不適合を理由とした修補をＢに対して請求することはできない。","choice_3":"Ｂが材料を提供して増築した部分に契約不適合があり、Ｂは不適合があることを知りながらそのことをＡに告げずに工事を終了し、Ａが工事終了日から3 年後に契約不適合を知った場合、ＡはＢに対して、消滅時効が完成するまでは契約不適合を理由とした修補を請求することができる。","choice_4":"増築した部分にＡが提供した材料の性質によって契約不適合が生じ、Ｂが材料が不適当であることを知らずに工事を終了した場合、ＡはＢに対して、Ａが提供した材料によって生じた契約不適合を理由とした修補を請求することはできない。","official_accepted_answers":"2","answer_conclusion":"《請負の契約不適合通知期間》は原則、不適合を「知った時から1年」。工事終了日からではありません。","answer_reason":"2023-Q03の公式解答は選択肢2。「誤っているもの」を選ぶ問題であり、問題文の各条件を満たすかを4肢ごとに判断する。所有権＝独立性がない増築は付合／通知期間＝発見時から1年／請負人の悪意＝通知期間制限の例外／注文者の材料＝原則請負人免責。","scoring_exception_note":"","deep_lecture":"請負は仕事の完成を約し、注文者が成果に対して報酬を支払う契約である（民法632条）。建物の増築が既存建物に物理的・機能的に組み込まれ、独立性を持たない場合、原則として[[NOTE:不動産への付合]]（242条）により増築部分の所有権は既存建物所有者に帰属する。この判断と請負報酬を完済したかどうかは別問題である。仕事の目的物が契約の品質に適合しない場合、注文者には追完等の救済が認められ得るが、請負については通知の期間制限がある。民法637条1項は、注文者が「==不適合を知った時から1年以内==」にその旨を請負人に通知しなければ、原則として契約不適合を理由とする請求ができないとする。工事終了日から1年ではない。さらに請負人が引渡し時等に不適合を知り、又は重大な過失により知らなかった場合は、この通知期間制限が適用されない（637条2項）。ただし消滅時効がなくなるわけではない。他方、注文者が提供した材料の性質又は注文者の指図によって不適合が生じた場合は、原則として請負人は責任を負わない（636条）。請負人が材料等の不適当さを知りながら告げなかった場合などは例外がある。付合による所有権、通知期間、請負人の認識、材料の提供者の四点を順番に分けると解ける。","system_purpose":"制度趣旨：請負は仕事の完成を約し、注文者が成果に対して報酬を支払う契約である（民法632条）。建物の増築が既存建物に物理的・機能的に組み込まれ、独立性を持たない場合、原則として不動産への付合（242条）により増築部分の所有権は既存建物所有者に帰属する。この判断と請負報酬を完済したかどうかは別問題である。仕事の目的物が契約の品質に適合しない場合、注文者には追完等の救済が認められ得","practical_examples":"2023年5月に引渡しを受け、2025年4月に壁内の施工不良に気付いた注文者は、工事終了日を基準に請求を諦めず、発見時からの通知期間をまず確認する。","advanced_knowledge":"契約不適合責任の通知期間と、一般的な消滅時効（166条）は別。追完の方法や費用負担も契約の趣旨から考える。","comparative_explanation":"所有権＝独立性がない増築は付合／通知期間＝発見時から1年／請負人の悪意＝通知期間制限の例外／注文者の材料＝原則請負人免責。","important_points":"①所有権＝独立性がない増築は付合／通知期間＝発見時から1年／請負人の悪意＝通知期間制限の例外／注文者の材料＝原則請負人免責。　②契約不適合責任の通知期間と、一般的な消滅時効（166条）は別。追完の方法や費用負担も契約の趣旨から考える。","trick_patterns":"(1)所有権＝独立性がない増築は付合／通知期間＝発見時から1年／請負人の悪意＝通知期間制限の例外／注文者の材料＝原則請負人免責。　(2)民法637条の1年の起算点は「仕事を終えた日」ではなく「注文者が品質不適合を知った時」である。引渡しから2年後に隠れたひび割れを初めて認識したなら、その時から通知期間を検討する。だ\n【要注意の表現】[[WARN:工事が終了した日から1年以内]]","memory_summary":"所有権＝独立性がない増築は付合／通知期間＝発見時から1年／請負人の悪意＝通知期間制限の例外／注文者の材料＝原則請負人免責。","review_check_questions":"Q.請負の品質不適合の通知期間はいつから？→知った時から1年。|Q.請負人が不適合を知って隠していたら？→637条の通知制限は適用されない。|Q.独立性のない増築部分の所有者は？→原則既存建物所有者。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法・特別法一次資料照合入口：https://laws.e-gov.go.jp/law/129AC0000000089 ; https://laws.e-gov.go.jp/law/403AC0000000090","marker_yellow_spans":"不適合を知った時から1年以内","marker_red_spans":"工事が終了した日から1年以内","marker_blue_spans":"不動産への付合","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R5_qestion_answer%E3%80%80.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"false","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。独立性のない増築部分は原則として既存建物に付合して所有者Aに帰属し、請負代金未払いだけでBの所有にはなりません。\n増築部分が独立して一棟の建物として認められるか、それとも元の建物の構成部分に過ぎないかが所有権帰属の前提となる。本問では独立性がないと明示されているため、建物所有者Aに付合する。請負人Bへの代金未払は債務不履行の問題であり、付合後の増築部分をBの所有物に戻す理由にはならない。","choice_1_corrected_statement":"原文どおりで正しい","choice_1_legal_basis":"民法242条・632条","choice_1_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／所有権＝独立性がない増築は付合／通知期間＝発見時から1年／請負人の悪意＝通知期間制限の例外／注文者の材料＝原則請負人免責。","choice_2_truth":"false","choice_2_is_exam_answer":"true","choice_2_wrong_part":"工事が終了した日から1年以内","choice_2_reason":"誤り（正解肢）。通知期限の原則は「注文者が不適合を知った時から1年」。[[WARN:工事終了日から1年]]という起算点が誤りです。\n民法637条の1年の起算点は「仕事を終えた日」ではなく「注文者が品質不適合を知った時」である。引渡しから2年後に隠れたひび割れを初めて認識したなら、その時から通知期間を検討する。だから工事終了時から一律1年で修補請求権が失われるという選択肢は誤り。通知と消滅時効も別の制限である。","choice_2_corrected_statement":"Ｂが材料を提供して増築した部分に契約不適合がある場合、Ａは契約不適合を知った時から1年以内にその旨をＢに通知しなければ、契約不適合を理由とした修補をＢに対して請求することはできない。","choice_2_legal_basis":"民法637条1項","choice_2_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／所有権＝独立性がない増築は付合／通知期間＝発見時から1年／請負人の悪意＝通知期間制限の例外／注文者の材料＝原則請負人免責。","choice_3_truth":"true","choice_3_is_exam_answer":"false","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい。請負人が不適合を知りながら告げなかった場合、知った時から1年の通知制限をそのまま適用できず、別途消滅時効などが問題となります。\n不適合を知りながら告げない請負人まで、注文者が知ってから1年の通知制度で保護するのは不公平である。このため637条2項が通知制限の例外を定める。本問ではBが認識していたため通知期間による失権は問題とならない。ただし一般の消滅時効は別途進行するので、永遠に請求できるという意味ではない。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"民法637条2項・166条","choice_3_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／所有権＝独立性がない増築は付合／通知期間＝発見時から1年／請負人の悪意＝通知期間制限の例外／注文者の材料＝原則請負人免責。","choice_4_truth":"true","choice_4_is_exam_answer":"false","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。注文者Aの提供した材料の性質に起因する不適合は原則請負人Bの責任外。ただしBが不適当と知って告げなかった場合などには例外があります。\n注文者Aが自分で選んだ材料に問題があり、その性質だけが原因で不適合が発生したなら、請負人Bに全面的な責任を負わせるのは不合理である。民法636条は原則としてAの追完等の請求を制限する。もっともBが材料の不適当さを知っているのに告げなかった場合は例外となる。誰が材料を提供し、誰が不適当さを認識していたかが分岐点。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"民法636条","choice_4_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／所有権＝独立性がない増築は付合／通知期間＝発見時から1年／請負人の悪意＝通知期間制限の例外／注文者の材料＝原則請負人免責。"},{"question_id":"2023-Q04","year":2023,"session":"通常","question_no":4,"major_field":"権利関係","section":"民法","unit":"意思表示","topic":"意思能力・意思表示・錯誤・詐欺・強迫","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"ＡがＢに対して貸金債権である甲債権を、ＢがＡに対して貸金債権である乙債権をそれぞれ有している場合において、民法の規定及び判例によれば、次のアからエまでの記述のうち、Ａが一方的な意思表示により甲債権と乙債権とを対当額にて相殺できないものを全て掲げたものは、次の1 から4 のうちどれか。なお、いずれの債権も相殺を禁止し又は制限する旨の意思表示はされていないものとする。ア　弁済期の定めのない甲債権と、弁済期到来前に、ＡがＢに対して期限の利益を放棄する旨の意思表示をした乙債権イ　弁済期が到来している甲債権と、弁済期の定めのない乙債権ウ　弁済期の定めのない甲債権と、弁済期が到来している乙債権エ　弁済期が到来していない甲債権と、弁済期が到来している乙債権","choice_1":"ア、イ、ウ","choice_2":"イ、ウ","choice_3":"ウ、エ","choice_4":"エ","official_accepted_answers":"4","answer_conclusion":"《相殺する側の債権（自働債権）》は弁済期が到来している必要があるため、相殺できないのはエだけです。","answer_reason":"2023-Q04の公式解答は選択肢4。問題文の各条件を満たすかを4肢ごとに判断する。自働債権＝相殺する側が相手に持つ請求権／受働債権＝相殺する側の支払義務。自働債権の弁済期が鍵。","scoring_exception_note":"","deep_lecture":"相殺とは、二人が互いに同種の債務を負う場合に、一方の意思表示によって対当額の債権債務を消滅させる制度である（民法505条・506条）。相殺する側AがBに持つ債権を「==自働債権==」、BがAに持つ債権を「[[NOTE:受働債権]]」という。大切なのは、Aは自分がまだ弁済期になっていない自働債権を、相手方Bの意思に反して強制的に相殺に使うことは原則できないことである。自働債権は、期限の定めがない場合には原則として請求可能なため、相殺の弁済期要件を満たし得る。一方、受働債権はA自身が負う債務であり、Aが期限の利益を有するなら、相殺で自らその利益を放棄して早めに弁済したのと同様に処理できる局面がある。反対に相手方Bの期限利益を一方的に放棄することはできない。アではAが受働債権乙について自分の期限利益を放棄しているため相殺可能、イでは甲の弁済期到来、ウでは期限の定めのない甲が請求可能であるため相殺可能、エでは甲の弁済期が未到来であるためAは一方的に相殺できない。組合せ選択肢に目を奪われず、ア〜エを先に独立判定する。\nなお、相殺の意思表示は相手方に対して行い、条件や期限を付けることはできない。いつ対当額で消滅したものとして扱うかは民法506条2項により相殺適状の時点までさかのぼるが、弁済期の要件を無視してよいわけではない。","system_purpose":"制度趣旨：相殺とは、二人が互いに同種の債務を負う場合に、一方の意思表示によって対当額の債権債務を消滅させる制度である（民法505条・506条）。相殺する側AがBに持つ債権を「自働債権」、BがAに持つ債権を「受働債権」という。大切なのは、Aは自分がまだ弁済期になっていない自働債権を、相手方Bの意思に反して強制的に相殺に使うことは原則できないことである。自働債権は、期限の定めがない","practical_examples":"AがBに100万円を来月請求でき、BがAに60万円を今日請求できる場合、甲100万円を自働債権として今日相殺することは原則できない。","advanced_knowledge":"相殺の効力は相殺適状になった時にさかのぼる（506条2項）が、意思表示そのものが必要。差押えや不法行為などの相殺禁止も別途ある。","comparative_explanation":"自働債権＝相殺する側が相手に持つ請求権／受働債権＝相殺する側の支払義務。自働債権の弁済期が鍵。","important_points":"①自働債権＝相殺する側が相手に持つ請求権／受働債権＝相殺する側の支払義務。自働債権の弁済期が鍵。　②相殺の効力は相殺適状になった時にさかのぼる（506条2項）が、意思表示そのものが必要。差押えや不法行為などの相殺禁止も別途ある。","trick_patterns":"(1)自働債権＝相殺する側が相手に持つ請求権／受働債権＝相殺する側の支払義務。自働債権の弁済期が鍵。　(2)相殺できないのはエのみ。Aが使いたい自働債権甲はまだ弁済期が来ておらず、Bに対して即時の弁済を強制できないため一方的相殺は認められない。アは受働債権乙についてA自身が期限の利益を放\n【要注意の表現】[[WARN:(1)自働債権＝相殺する側が相手]]","memory_summary":"自働債権＝相殺する側が相手に持つ請求権／受働債権＝相殺する側の支払義務。自働債権の弁済期が鍵。","review_check_questions":"Q.Aの自働債権の弁済期が未到来なら？→原則一方的相殺不可。|Q.相殺の受働債権とは？→AがBに負っている債務。|Q.本問で相殺不能な記述は？→エのみ。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法・特別法一次資料照合入口：https://laws.e-gov.go.jp/law/129AC0000000089 ; https://laws.e-gov.go.jp/law/403AC0000000090","marker_yellow_spans":"自働債権","marker_red_spans":"(1)自働債権＝相殺する側が相手","marker_blue_spans":"受働債権","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R5_qestion_answer%E3%80%80.pdf","choice_1_truth":"compound","choice_1_is_exam_answer":"false","choice_1_wrong_part":"ア、イ、ウ","choice_1_reason":"誤り。ア・イ・ウを全部「相殺できない」とするのは過大です。弁済期の定めのない債権や、相手方の期限利益を放棄できる局面を区別します。\nアは相殺可能なので「相殺できない」の一覧に入れてはならない。イも甲債権の弁済期が到来しているため自働債権側の要件を満たす。ウは期限の定めのない甲債権をAが原則請求できるため相殺可能である。これら三つをまとめて不可とするのは、受働債権の期限と自働債権の期限を区別できていないため。","choice_1_corrected_statement":"相殺できないのはエのみ","choice_1_legal_basis":"民法136条・505条","choice_1_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／自働債権＝相殺する側が相手に持つ請求権／受働債権＝相殺する側の支払義務。自働債権の弁済期が鍵。","choice_2_truth":"compound","choice_2_is_exam_answer":"false","choice_2_wrong_part":"イ、ウ","choice_2_reason":"誤り。イ・ウはいずれも自働債権の弁済期要件を満たし得るため、相殺不能の組合せではありません。\nイではAがBに対して持つ甲債権は弁済期到来済みである。またウでも甲債権は期限の定めがなく、Aは原則として直ちに請求可能である。したがってどちらも相殺不能の例には当たらない。設問は「一方的な意思表示で相殺できないもの」を聞いているので、相殺可能な記述を一つでも含む組合せは誤り。","choice_2_corrected_statement":"相殺できないのはエのみ","choice_2_legal_basis":"民法505条","choice_2_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／自働債権＝相殺する側が相手に持つ請求権／受働債権＝相殺する側の支払義務。自働債権の弁済期が鍵。","choice_3_truth":"compound","choice_3_is_exam_answer":"false","choice_3_wrong_part":"ウ、エ","choice_3_reason":"誤り。ウまで相殺不能とする点が誤りです。期限の定めのない自働債権は原則いつでも弁済請求可能です。\nウでは自働債権甲に期限の定めがなく、Aは支払請求できる状態にある。一方エでは自働債権甲の[[WARN:弁済期がまだ来ていない]]。この違いは決定的で、相手方Bは本来の弁済期まで甲の支払を拒める利益がある。ウを不可とするのは、期限が定められていないことと、期限がまだ到来していないことを混同している。","choice_3_corrected_statement":"相殺できないのはエのみ","choice_3_legal_basis":"民法505条","choice_3_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／自働債権＝相殺する側が相手に持つ請求権／受働債権＝相殺する側の支払義務。自働債権の弁済期が鍵。","choice_4_truth":"compound","choice_4_is_exam_answer":"true","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい（正解肢）。相殺できないのはエのみ。Aの自働債権の弁済期が未到来だと、原則Aは一方的に相殺できません。\n相殺できないのはエのみ。Aが使いたい自働債権甲はまだ弁済期が来ておらず、Bに対して即時の弁済を強制できないため一方的相殺は認められない。アは受働債権乙についてA自身が期限の利益を放棄でき、イ・ウの自働債権は相殺に用いられる状態である。各記述の成否はア可・イ可・ウ可・エ不可。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"民法505条1項","choice_4_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／自働債権＝相殺する側が相手に持つ請求権／受働債権＝相殺する側の支払義務。自働債権の弁済期が鍵。"},{"question_id":"2023-Q05","year":2023,"session":"通常","question_no":5,"major_field":"権利関係","section":"民法","unit":"不在者財産管理","topic":"財産管理人の選任・権限・許可","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"従来の住所又は居所を去った者（以下この問において「不在者」という。）の財産の管理に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。なお、この問において「管理人」とは、不在者の財産の管理人をいうものとする。","choice_1":"不在者が管理人を置かなかったときは、当該不在者の生死が7 年間明らかでない場合に限り、家庭裁判所は、利害関係人又は検察官の請求により、その財産の管理について必要な処分を命ずることができる。","choice_2":"不在者が管理人を置いた場合において、その不在者の生死が明らかでないときは、家庭裁判所は、利害関係人又は検察官から請求があったとしても管理人を改任することはできない。","choice_3":"家庭裁判所により選任された管理人は、不在者を被告とする建物収去土地明渡請求を認容した第一審判決に対して控訴を提起するには、家庭裁判所の許可が必要である。","choice_4":"家庭裁判所により選任された管理人は、保存行為として不在者の自宅を修理することができるほか、家庭裁判所の許可を得てこれを売却することができる。","official_accepted_answers":"4","answer_conclusion":"《不在者財産管理人》は保存行為ができ、売却など権限を超える行為には家庭裁判所の許可が必要です。","answer_reason":"2023-Q05の公式解答は選択肢4。問題文の各条件を満たすかを4肢ごとに判断する。不在者財産管理＝管理空白の解消・7年不要／失踪宣告＝7年などの生死不明期間を要件とする死亡擬制。","scoring_exception_note":"","deep_lecture":"不在者とは従来の住所または居所を去って容易に財産を管理できない人をいい、その人の生死不明と財産の管理の必要性を制度上切り分ける。民法25条は不在者が管理人を置かなかったときなどに、利害関係人や検察官の請求により家庭裁判所が財産管理に必要な処分を命じられると定める。これに[[WARN:7年の待機期間]]はない。「7年」は普通失踪宣告（30条）の数字であり、[[NOTE:不在者財産管理]]制度とは目的も効果も異なる。本人が管理人を選んでいた場合でも、その後生死が不明になったなどの事情があれば、家庭裁判所による改任が問題となる（26条）。家庭裁判所に選任された管理人の権限は無制限ではなく、==保存行為==や物・権利の性質を変えない利用・改良のような通常の管理行為と、建物売却のような処分行為を分けて考える。権限を超える行為は家庭裁判所の許可を要する（28条、103条）。損害を防ぐための修理は保存行為として行えるのに対し、家屋を第三者に売却するには許可が必要というのが典型である。訴訟上の上訴も必ず権限外とは限らず、権利保全のための行動として許可不要とされる場面がある。\n本人の生死が不明になった場合でも、管理人は自分の利益のために不在者の資産を処分できるわけではない。財産維持に必要な支出は何か、不可逆的な処分を伴うかを判定し、権限外なら裁判所許可を得る。","system_purpose":"制度趣旨：不在者とは従来の住所または居所を去って容易に財産を管理できない人をいい、その人の生死不明と財産の管理の必要性を制度上切り分ける。民法25条は不在者が管理人を置かなかったときなどに、利害関係人や検察官の請求により家庭裁判所が財産管理に必要な処分を命じられると定める。これに7年の待機期間はない。「7年」は普通失踪宣告（30条）の数字であり、不在者財産管理制度とは目的も効果","practical_examples":"行方不明の所有者Aの空き家で屋根が壊れた場合、管理人は修理を検討できる。一方、家を売り払う場合は家庭裁判所の許可が必要になる。","advanced_knowledge":"不在者の財産管理制度と所有者不明土地管理命令は異なる制度で、対象財産の範囲や選任要件が違う。","comparative_explanation":"不在者財産管理＝管理空白の解消・7年不要／失踪宣告＝7年などの生死不明期間を要件とする死亡擬制。","important_points":"①不在者財産管理＝管理空白の解消・7年不要／失踪宣告＝7年などの生死不明期間を要件とする死亡擬制。　②不在者の財産管理制度と所有者不明土地管理命令は異なる制度で、対象財産の範囲や選任要件が違う。","trick_patterns":"(1)不在者財産管理＝管理空白の解消・7年不要／失踪宣告＝7年などの生死不明期間を要件とする死亡擬制。　(2)雨漏りが生じている不在者宅の修理は、財産価値の減少を防ぐ保存行為であり、管理人が権限内でできる。他方、住宅を売却すると所有権自体が変わるため通常の保存・管理を超え、家庭裁判所の許可","memory_summary":"不在者財産管理＝管理空白の解消・7年不要／失踪宣告＝7年などの生死不明期間を要件とする死亡擬制。","review_check_questions":"Q.不在者財産管理に7年経過は必要？→不要。|Q.家屋の売却には通常どのような手続？→家庭裁判所の許可。|Q.雨漏り修理はどの種類？→保存行為。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法・特別法一次資料照合入口：https://laws.e-gov.go.jp/law/129AC0000000089 ; https://laws.e-gov.go.jp/law/403AC0000000090","marker_yellow_spans":"保存行為","marker_red_spans":"7年の待機期間","marker_blue_spans":"不在者財産管理","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R5_qestion_answer%E3%80%80.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"生死が7 年間明らかでない場合に限り","choice_1_reason":"誤り。7年という期間は普通失踪宣告に関するもの。不在者の財産管理の裁判所関与に7年の経過は不要です。\nこの選択肢は不在者財産管理と失踪宣告を混同している。財産管理の空白によって賃料の回収や税金納付が滞る状況では、7年待ってから管理人を選ぶのでは財産が傷む。不在者が管理人を置いていないなどの要件を満たせば、家庭裁判所は必要な処分を命じられる。生死不明期間7年は別制度の話。","choice_1_corrected_statement":"不在者が管理人を置かなかったときは、当該不在者の不在者財産管理の処分には7年の経過を要しない、家庭裁判所は、利害関係人又は検察官の請求により、その財産の管理について必要な処分を命ずることができる。","choice_1_legal_basis":"民法25条・30条","choice_1_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／不在者財産管理＝管理空白の解消・7年不要／失踪宣告＝7年などの生死不明期間を要件とする死亡擬制。","choice_2_truth":"false","choice_2_is_exam_answer":"false","choice_2_wrong_part":"管理人を改任することはできない","choice_2_reason":"誤り。不在者が自ら管理人を置いていても、生死不明など法定事情の下では家庭裁判所が改任できる場合があります。\n不在者が自分で管理人を置いた場合でも、その人の生死が明らかでなくなったときには、家庭裁判所が管理人を改任できる仕組みがある。本人が先に選任したという事実だけで裁判所の管理監督が永遠に遮断されるわけではない。元の管理人が不適切な運用をしているなど、財産保全の必要性がある状況を想定する。","choice_2_corrected_statement":"不在者が管理人を置いた場合において、その不在者の生死が明らかでないときは、家庭裁判所は、利害関係人又は検察官から請求があったとしても要件を満たせば家庭裁判所は管理人を改任できる。","choice_2_legal_basis":"民法26条","choice_2_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／不在者財産管理＝管理空白の解消・7年不要／失踪宣告＝7年などの生死不明期間を要件とする死亡擬制。","choice_3_truth":"false","choice_3_is_exam_answer":"false","choice_3_wrong_part":"控訴を提起するには、家庭裁判所の許可が必要","choice_3_reason":"誤り。権利保存のための上訴は通常の管理・保存行為として扱われ、当然に家庭裁判所の許可が必要というわけではありません。\n管理人が不在者を被告とする訴訟の不利益判決について控訴することは、財産権を守るための行為として権限内に含まれ得る。建物を売却する場合のように財産を積極的に処分することとは性質が異なり、控訴のたびに当然家庭裁判所の許可が必要とするのは誤り。訴訟行為すべてが処分行為になるとは限らない。","choice_3_corrected_statement":"家庭裁判所により選任された管理人は、不在者を被告とする建物収去土地明渡請求を認容した第一審判決に対して権利保存のための控訴には当然には許可を要しないである。","choice_3_legal_basis":"民法28条・103条・関連判例","choice_3_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／不在者財産管理＝管理空白の解消・7年不要／失踪宣告＝7年などの生死不明期間を要件とする死亡擬制。","choice_4_truth":"true","choice_4_is_exam_answer":"true","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。修理などの保存行為は権限内。家屋の売却は処分行為なので、原則として家庭裁判所の権限外行為許可を要します。\n雨漏りが生じている不在者宅の修理は、財産価値の減少を防ぐ保存行為であり、管理人が権限内でできる。他方、住宅を売却すると所有権自体が変わるため通常の保存・管理を超え、家庭裁判所の許可が必要となる。行為の名称だけではなく、財産を現状維持するのか権利を手放すのかという効果で分ける。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"民法28条・103条","choice_4_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／不在者財産管理＝管理空白の解消・7年不要／失踪宣告＝7年などの生死不明期間を要件とする死亡擬制。"},{"question_id":"2023-Q06","year":2023,"session":"通常","question_no":6,"major_field":"権利関係","section":"民法","unit":"時効","topic":"取得時効・消滅時効","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"count_true","question_text":"Ａ所有の甲土地について、Ｂが所有の意思をもって平穏にかつ公然と時効取得に必要な期間占有を継続した場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはいくつあるか。ア　ＡがＣに対して甲土地を売却し、Ｃが所有権移転登記を備えた後にＢの取得時効が完成した場合には、Ｂは登記を備えていなくても、甲土地の所有権の時効取得をＣに対抗することができる。イ　Ｂの取得時効が完成した後に、ＡがＤに対して甲土地を売却しＤが所有権移転登記を備え、Ｂが、Ｄの登記の日から所有の意思をもって平穏にかつ公然と時効取得に必要な期間占有を継続した場合、所有権移転登記を備えていなくても、甲土地の所有権の時効取得をＤに対抗することができる。ウ　Ｂの取得時効完成後、Ｂへの所有権移転登記がなされないままＥがＡを債務者として甲土地にＡから抵当権の設定を受けて抵当権設定登記をした場合において、Ｂがその後引き続き所有の意思をもって平穏にかつ公然と時効取得に必要な期間占有を継続した場合、特段の事情がない限り、再度の時効取得により、Ｂは甲土地の所有権を取得し、Ｅの抵当権は消滅する。","choice_1":"一つ","choice_2":"二つ","choice_3":"三つ","choice_4":"なし","official_accepted_answers":"3","answer_conclusion":"《時効完成の前後》で登記対抗の結論が変わります。設問のア・イ・ウはすべて正しいです。","answer_reason":"2023-Q06の公式解答は選択肢3。問題文の各条件を満たすかを4肢ごとに判断する。時効完成前に登場した第三者＝登記なしで対抗可能／時効完成後に登場した第三者＝原則登記必要／その後さらに時効完成＝再度の時効取得を検討。","scoring_exception_note":"","deep_lecture":"取得時効は一定期間、所有の意思をもって平穏かつ公然に占有を続けた者に所有権取得を認める制度である（民法162条）。時効完成と登記との関係は「第三者がいつ現れたか」により区別される。==時効完成前==に旧所有者から土地を譲り受け登記した第三者Cに対し、占有者Bはその後の時効完成による取得を登記なしで主張できるとされる。Cは時効完成時には所有者の地位にあり、Bの時効取得はCとの関係で完成するからである。一方、いったんAに対してBの時効が完成した後、Bが未登記のまま第三者DがAから登記を得たとき、原則としてBは既に完成した時効取得を未登記でDに対抗できない。しかしBがDの登記後さらに時効取得に必要な期間占有を継続すれば、[[NOTE:再度の時効取得]]により対抗できることがある。抵当権が設定された場合も、同様に抵当権設定登記後の継続占有による再度の時効取得と抵当権消滅の関係が問題となる。アは完成前第三者、イは完成後第三者＋再度の時効、ウは抵当権登記後の再度の時効を扱い、判例の枠組みではいずれも正しい。\n時効取得の計算では、第三者が登記した前後を一本の期間として見るのか、登記後に新たな期間を積み上げるのかに意味がある。土地の取得と抵当権への対抗も分けることで、似た判例の結論を正確に使い分けられる。","system_purpose":"制度趣旨：取得時効は一定期間、所有の意思をもって平穏かつ公然に占有を続けた者に所有権取得を認める制度である（民法162条）。時効完成と登記との関係は「第三者がいつ現れたか」により区別される。時効完成前に旧所有者から土地を譲り受け登記した第三者Cに対し、占有者Bはその後の時効完成による取得を登記なしで主張できるとされる。Cは時効完成時には所有者の地位にあり、Bの時効取得はCとの関","practical_examples":"Aの土地をBが占有し続け、占有15年目にCが土地を買って登記した後、占有20年目に時効が完成した場合、Cは完成前の第三者として扱われる。","advanced_knowledge":"取得時効には20年の通常型と、占有開始時に善意無過失である場合の10年型がある。時効の援用や占有継続の要件も忘れない。","comparative_explanation":"時効完成前に登場した第三者＝登記なしで対抗可能／時効完成後に登場した第三者＝原則登記必要／その後さらに時効完成＝再度の時効取得を検討。","important_points":"①時効完成前に登場した第三者＝登記なしで対抗可能／時効完成後に登場した第三者＝原則登記必要／その後さらに時効完成＝再度の時効取得を検討。　②取得時効には20年の通常型と、占有開始時に善意無過失である場合の10年型がある。時効の援用や占有継続の要件も忘れない。","trick_patterns":"(1)時効完成前に登場した第三者＝登記なしで対抗可能／時効完成後に登場した第三者＝原則登記必要／その後さらに時効完成＝再度の時効取得を検討。　(2)アはBの時効完成時点でCが登記所有者であり、BはCに登記なしで取得を対抗できる。イはDの登記後にあらためて必要期間占有することで再度の時効取得を主張できる。ウも抵当権者Eの登記後に\n【要注意の表現】[[WARN:(1)時効完成前に登場した第三者]]","memory_summary":"時効完成前に登場した第三者＝登記なしで対抗可能／時効完成後に登場した第三者＝原則登記必要／その後さらに時効完成＝再度の時効取得を検討。","review_check_questions":"Q.時効完成前に登記した買主には対抗できる？→完成後は登記なしで対抗できる場合がある。|Q.時効完成後第三者の登記後に再度占有したら？→再度の取得時効を検討。|Q.本問は何個正しい？→3個。","substatement_reasoning":"ア：○ 取得時効の完成前に権利取得したCには、後に完成した時効取得を登記なく対抗できる。／イ：○ 時効完成後に所有権を得たDでも、その後の占有継続による再度の時効完成が問題となる。／ウ：○ 抵当権設定登記後にさらに時効取得が完成した場合、所定の条件で抵当権の消滅が問題となる。→3つ。ただし各判例の射程について独立再検証が必要。","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法・特別法一次資料照合入口：https://laws.e-gov.go.jp/law/129AC0000000089 ; https://laws.e-gov.go.jp/law/403AC0000000090","marker_yellow_spans":"時効完成前","marker_red_spans":"(1)時効完成前に登場した第三者","marker_blue_spans":"再度の時効取得","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R5_qestion_answer%E3%80%80.pdf","choice_1_truth":"compound","choice_1_is_exam_answer":"false","choice_1_wrong_part":"一つ","choice_1_reason":"誤り。正しい記述は1つではなく3つです。[[WARN:時効完成後]]に成立した第三者関係で登記が必要になる一般則と、再度の時効取得を区別します。\nア・イ・ウの三つが正しいので、「一つ」ではない。アではCの所有権移転登記が先で、その後Bの時効が完成している点に注目する。イは一度の時効完成だけならDとの登記対抗が問題となるが、Dの登記後に再び法定期間を占有したことに意味がある。ウは抵当権登記後の継続占有という第三の型である。","choice_1_corrected_statement":"正しいものは三つであり、選択肢3を選ぶ。","choice_1_legal_basis":"民法162条・177条・時効完成前第三者の判例","choice_1_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／時効完成前に登場した第三者＝登記なしで対抗可能／時効完成後に登場した第三者＝原則登記必要／その後さらに時効完成＝再度の時効取得を検討。","choice_2_truth":"compound","choice_2_is_exam_answer":"false","choice_2_wrong_part":"二つ","choice_2_reason":"誤り。正しい記述は2つではなく3つです。イの再度の時効取得も認められる点が重要です。\n「二つ」となるのは三つのうち一つを誤りとする場合だが、本問ではどれも判例上正しい。時効完成後の第三者Dが登場すると必ずBが負ける、と短絡するとイを落とす。最初の時効完成後に権利変動があっても、その後さらに時効取得に必要な期間占有を継続すれば、別の時効取得という構成が認められる点を押さえる。","choice_2_corrected_statement":"正しいものは三つであり、選択肢3を選ぶ。","choice_2_legal_basis":"民法162条・177条・再度の取得時効の判例","choice_2_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／時効完成前に登場した第三者＝登記なしで対抗可能／時効完成後に登場した第三者＝原則登記必要／その後さらに時効完成＝再度の時効取得を検討。","choice_3_truth":"compound","choice_3_is_exam_answer":"true","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい（正解肢）。ア・イ・ウのすべてが正しい。アは時効完成前の譲受人への対抗、イ・ウは再度の時効取得の考え方です。\nアはBの時効完成時点でCが登記所有者であり、BはCに登記なしで取得を対抗できる。イはDの登記後にあらためて必要期間占有することで再度の時効取得を主張できる。ウも抵当権者Eの登記後に引き続き占有して再度時効を完成する場合に、特段の事情がなければ対抗関係を整理できる。だから三つという数え方になる。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"民法162条・177条・再度の取得時効と抵当権の判例","choice_3_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／時効完成前に登場した第三者＝登記なしで対抗可能／時効完成後に登場した第三者＝原則登記必要／その後さらに時効完成＝再度の時効取得を検討。","choice_4_truth":"compound","choice_4_is_exam_answer":"false","choice_4_wrong_part":"なし","choice_4_reason":"誤り。ア・イ・ウのいずれも、判例上の要件に照らして正しいため「なし」ではありません。\n「なし」はア〜ウがすべて誤りのときの組合せであり、設問の時系列に照らして成立しない。取得時効と登記の問題では、所有権移転登記がいつされたか、時効完成前か後か、登記後にさらに何年占有したかを分ける。時効取得後の登記を一律に不可欠と考えると、完成前第三者や再度の時効という例外を見落とす。","choice_4_corrected_statement":"正しいものは三つであり、選択肢3を選ぶ。","choice_4_legal_basis":"民法162条・177条","choice_4_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／時効完成前に登場した第三者＝登記なしで対抗可能／時効完成後に登場した第三者＝原則登記必要／その後さらに時効完成＝再度の時効取得を検討。"},{"question_id":"2023-Q07","year":2023,"session":"通常","question_no":7,"major_field":"権利関係","section":"民法","unit":"相続","topic":"相続・遺言・遺留分・遺産分割","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"甲建物を所有するＡが死亡し、Ａの配偶者Ｂが甲建物の配偶者居住権を、Ａの子Ｃが甲建物の所有権をそれぞれ取得する旨の遺産分割協議が成立した場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choice_1":"遺産分割協議において、Ｂの配偶者居住権の存続期間が定められなかった場合、配偶者居住権の存続期間は20 年となる。","choice_2":"Ｂが高齢となり、バリアフリーのマンションに転居するための資金が必要になった場合、Ｂは、Ｃの承諾を得ずに甲建物を第三者Ｄに賃貸することができる。","choice_3":"Ｃには、Ｂに対し、配偶者居住権の設定の登記を備えさせる義務がある。","choice_4":"Ｃは、甲建物の通常の必要費を負担しなければならない。","official_accepted_answers":"3","answer_conclusion":"《配偶者居住権》は原則終身で、所有者には登記に協力する義務があります。","answer_reason":"2023-Q07の公式解答は選択肢3。問題文の各条件を満たすかを4肢ごとに判断する。所有権＝Cに帰属／配偶者居住権＝Bの使用収益。期間の定めなし＝Bの終身／登記協力義務＝C／通常必要費＝B。","scoring_exception_note":"","deep_lecture":"配偶者居住権は、被相続人が所有する建物に居住していた配偶者に対して、相続後も引き続きその建物を無償で使用収益できる権利を確保する制度である（民法1028条以下）。所有権そのものを配偶者が取得する制度ではないため、建物所有者と配偶者居住権者の権利を区別する。存続期間は==原則として配偶者の終身==であり、遺産分割協議などで期間が定められればそれに従う（1030条）。したがって期間を定めないと20年になるのではない。配偶者居住権は譲渡できず、建物を[[WARN:第三者に賃貸する]]などの一定行為には所有者の承諾が必要になる（1032条）。居住権を取得した配偶者は、所有者に対して設定登記を備えさせることを請求でき、所有者側には登記協力義務がある（1031条）。登記によって第三者に対抗できる地位が確保される。建物の通常の必要費については、実際に使用収益する配偶者居住権者が原則として負担する（1034条）。所有権者が当然に全部負担するわけではない。終身・譲渡不可・賃貸には承諾・登記協力義務・通常必要費は居住権者、という五点が柱である。\n配偶者居住権を設定した場合、建物の所有権を受け継いだ人は居住権による使用収益を尊重する。所有者と居住者で権利が分かれるため、登記の手続や費用の分担を相続時に明確にしておく意味がある。","system_purpose":"制度趣旨：配偶者居住権は、被相続人が所有する建物に居住していた配偶者に対して、相続後も引き続きその建物を無償で使用収益できる権利を確保する制度である（民法1028条以下）。所有権そのものを配偶者が取得する制度ではないため、建物所有者と配偶者居住権者の権利を区別する。存続期間は原則として配偶者の終身であり、遺産分割協議などで期間が定められればそれに従う（1030条）。したがって期","practical_examples":"父Aが亡くなり母Bが住み続け、子Cが家を相続した。Bは原則終身住めるが、別の人に貸す場合はCの承諾が必要で、通常の維持費はBが負担する。","advanced_knowledge":"[[NOTE:配偶者短期居住権]]は配偶者居住権とは別制度。成立要件・期間・登記可否などが異なるため、名称が似ていても混同しない。","comparative_explanation":"所有権＝Cに帰属／配偶者居住権＝Bの使用収益。期間の定めなし＝Bの終身／登記協力義務＝C／通常必要費＝B。","important_points":"①所有権＝Cに帰属／配偶者居住権＝Bの使用収益。期間の定めなし＝Bの終身／登記協力義務＝C／通常必要費＝B。　②配偶者短期居住権は配偶者居住権とは別制度。成立要件・期間・登記可否などが異なるため、名称が似ていても混同しない。","trick_patterns":"(1)所有権＝Cに帰属／配偶者居住権＝Bの使用収益。期間の定めなし＝Bの終身／登記協力義務＝C／通常必要費＝B。　(2)配偶者居住権を建物に設定しても、それを第三者に主張するには登記による対抗関係を整える必要がある。民法1031条は所有者Cに設定登記を備えさせる義務を負わせている。Bの権利がCの単な","memory_summary":"所有権＝Cに帰属／配偶者居住権＝Bの使用収益。期間の定めなし＝Bの終身／登記協力義務＝C／通常必要費＝B。","review_check_questions":"Q.配偶者居住権の期間未定は？→原則終身。|Q.第三者に賃貸するには？→所有者の承諾が必要。|Q.通常必要費は誰が負担？→配偶者居住権者。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法・特別法一次資料照合入口：https://laws.e-gov.go.jp/law/129AC0000000089 ; https://laws.e-gov.go.jp/law/403AC0000000090","marker_yellow_spans":"原則として配偶者の終身","marker_red_spans":"第三者に賃貸する","marker_blue_spans":"配偶者短期居住権","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R5_qestion_answer%E3%80%80.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"20 年","choice_1_reason":"誤り。存続期間を定めなければ原則配偶者の終身。20年固定ではありません。\n配偶者居住権の存続期間を遺産分割協議で決めない場合、原則としてBの終身となる。これは高齢の配偶者が生涯住まいを失わないようにする趣旨に合う。20年と固定するのは、借地借家法の更新期間など他制度の数字との混同。本問は「期間を定めなかった場合」と明記しているので、原則を当てはめる。","choice_1_corrected_statement":"遺産分割協議において、Ｂの配偶者居住権の存続期間が定められなかった場合、配偶者居住権の存続期間は原則として配偶者の終身となる。","choice_1_legal_basis":"民法1030条","choice_1_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／所有権＝Cに帰属／配偶者居住権＝Bの使用収益。期間の定めなし＝Bの終身／登記協力義務＝C／通常必要費＝B。","choice_2_truth":"false","choice_2_is_exam_answer":"false","choice_2_wrong_part":"Ｃの承諾を得ずに","choice_2_reason":"誤り。配偶者居住権者が第三者に建物を賃貸するには所有者の承諾が必要です。\n配偶者居住権者Bは自分の居住を保護される一方、所有者Cの財産権に影響する第三者賃貸を独断で行うことはできない。民法1032条により賃貸には所有者の承諾が必要となる。Bが引っ越し資金を必要とするという事情は承諾要件を消す例外ではない。権利の使用と賃貸による収益化を分けて判断する。","choice_2_corrected_statement":"Ｂが高齢となり、バリアフリーのマンションに転居するための資金が必要になった場合、Ｂは、Ｃの承諾を得て甲建物を第三者Ｄに賃貸することができる。","choice_2_legal_basis":"民法1032条","choice_2_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／所有権＝Cに帰属／配偶者居住権＝Bの使用収益。期間の定めなし＝Bの終身／登記協力義務＝C／通常必要費＝B。","choice_3_truth":"true","choice_3_is_exam_answer":"true","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい。建物所有者Cは配偶者居住権者Bに対し、その権利の登記を備えさせる義務があります。\n配偶者居住権を建物に設定しても、それを第三者に主張するには登記による対抗関係を整える必要がある。民法1031条は所有者Cに設定登記を備えさせる義務を負わせている。Bの権利がCの単なる厚意に左右されないようにする制度である。実際に登記を申請するには関係書類や手続を整える必要がある。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"民法1031条","choice_3_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／所有権＝Cに帰属／配偶者居住権＝Bの使用収益。期間の定めなし＝Bの終身／登記協力義務＝C／通常必要費＝B。","choice_4_truth":"false","choice_4_is_exam_answer":"false","choice_4_wrong_part":"Ｃは、甲建物の通常の必要費を負担","choice_4_reason":"誤り。建物の通常の必要費は原則配偶者居住権者Bが負担します。\n通常の必要費、例えば日常的な設備維持や軽微な修繕等に要する支出は、原則として利用する配偶者居住権者Bが負担する。Cは所有者だからすべての費用を出すという理解は誤り。他方、大規模修繕などの費用関係は別途条文や事情によって整理するので、「通常の必要費」という設問の限定を読み落とさない。","choice_4_corrected_statement":"Ｂは甲建物の通常の必要費を負担しなければならない。","choice_4_legal_basis":"民法1034条","choice_4_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／所有権＝Cに帰属／配偶者居住権＝Bの使用収益。期間の定めなし＝Bの終身／登記協力義務＝C／通常必要費＝B。"},{"question_id":"2023-Q08","year":2023,"session":"通常","question_no":8,"major_field":"権利関係","section":"民法","unit":"制限行為能力","topic":"未成年者・成年後見・制限行為能力","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"未成年者Ａが、法定代理人Ｂの同意を得ずに、Ｃから甲建物を買い受ける契約（以下この問において「本件売買契約」という。）を締結した場合における次の記述のうち、民法の規定によれば、正しいものはどれか。なお、Ａに処分を許された財産はなく、Ａは、営業を許されてはいないものとする。","choice_1":"ＡがＢの同意を得ずに制限行為能力を理由として本件売買契約を取り消した場合、Ｂは、自己が本件売買契約の取消しに同意していないことを理由に、Ａの当該取消しの意思表示を取り消すことができる。","choice_2":"本件売買契約締結時にＡが未成年者であることにつきＣが善意無過失であった場合、Ｂは、Ａの制限行為能力を理由として、本件売買契約を取り消すことはできない。","choice_3":"本件売買契約につき、取消しがなされないままＡが成年に達した場合、本件売買契約についてＢが反対していたとしても、自らが取消権を有すると知ったＡは、本件売買契約を追認することができ、追認後は本件売買契約を取り消すことはできなくなる。","choice_4":"本件売買契約につき、Ｂが追認しないまま、Ａが成年に達する前にＢの同意を得ずに甲建物をＤに売却した場合、ＢがＤへの売却について追認していないときでも、Ａは制限行為能力を理由として、本件売買契約を取り消すことはできなくなる。","official_accepted_answers":"3","answer_conclusion":"《成年に達した後の追認》は、元未成年者本人が取消権を知って行えば有効です。","answer_reason":"2023-Q08の公式解答は選択肢3。問題文の各条件を満たすかを4肢ごとに判断する。取消し＝初めは有効だが後に遡及的無効となる／無効＝初めから効力を生じない。成年後の追認と成年前の処分を区別。","scoring_exception_note":"","deep_lecture":"未成年者は単独で有効な法律行為をする能力が制限されているため、原則として法定代理人の同意を要する（民法5条）。法定代理人の同意なく土地建物を買うなどの行為は取り消せるが、「無効」とは異なり、取り消されるまでは契約が一応有効に存在する。==取消権==者には未成年者本人も法定代理人も含まれ（120条）、本人の取消しにさらに法定代理人の同意を要求する制度ではない。相手方が未成年者であることを善意無過失で知らなかったという事情だけで、未成年者側の取消権が消えるわけでもない。未成年者が成年となり、取消権を持つことを認識した上で追認すれば、以後同じ理由による取消しはできなくなる（122条・124条）。一方、成年になる前に法定代理人の同意なしで目的物を第三者に譲渡した行為が、直ちに[[NOTE:法定追認]]となるわけではない。法定追認の行為類型や、追認できる状況にあるかを検討する必要がある（125条）。選択肢では、取消しを本人ができること、相手方の善意は原則抗弁にならないこと、成年後の追認、成年前の処分の効果の四点を別々に問う。\n取消しと追認の違いは、本人が契約を維持したいか解消したいかを後から判断できる点にある。成年に達した後に何もせず放置しただけで直ちに追認とはならず、意思表示や法定追認の行為・要件を検討する。","system_purpose":"制度趣旨：未成年者は単独で有効な法律行為をする能力が制限されているため、原則として法定代理人の同意を要する（民法5条）。法定代理人の同意なく土地建物を買うなどの行為は取り消せるが、「無効」とは異なり、取り消されるまでは契約が一応有効に存在する。取消権者には未成年者本人も法定代理人も含まれ（120条）、本人の取消しにさらに法定代理人の同意を要求する制度ではない。相手方が未成年者で","practical_examples":"17歳のAが親Bの同意なしでマンションを買ったとき、A自身も取消しできる。その後18歳になり取消権を知って追認したなら、未成年を理由に取消しできない。","advanced_knowledge":"未成年者が法定代理人の同意を得ずにした行為でも、単に権利を得・義務を免れる行為、処分を許された財産、許可営業など別の例外がある。","comparative_explanation":"取消し＝初めは有効だが後に遡及的無効となる／無効＝初めから効力を生じない。成年後の追認と成年前の処分を区別。","important_points":"①取消し＝初めは有効だが後に遡及的無効となる／無効＝初めから効力を生じない。成年後の追認と成年前の処分を区別。　②未成年者が法定代理人の同意を得ずにした行為でも、単に権利を得・義務を免れる行為、処分を許された財産、許可営業など別の例外がある。","trick_patterns":"(1)取消し＝初めは有効だが後に遡及的無効となる／無効＝初めから効力を生じない。成年後の追認と成年前の処分を区別。　(2)Aが成年に達して独立に法律行為をできる状態となり、取消権があることも認識して契約を追認したなら、追認後はその未成年を理由として取り消せなくなる。Bが以前反対していたことは、成年した\n【要注意の表現】[[WARN:取消しに同意していないことを理由に]]","memory_summary":"取消し＝初めは有効だが後に遡及的無効となる／無効＝初めから効力を生じない。成年後の追認と成年前の処分を区別。","review_check_questions":"Q.未成年者本人にも取消権はある？→ある。|Q.相手方が善意無過失なら取消し不可？→それだけでは不可にならない。|Q.成年後に適法追認したら？→取消しできなくなる。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法・特別法一次資料照合入口：https://laws.e-gov.go.jp/law/129AC0000000089 ; https://laws.e-gov.go.jp/law/403AC0000000090","marker_yellow_spans":"取消権","marker_red_spans":"取消しに同意していないことを理由に","marker_blue_spans":"法定追認","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R5_qestion_answer%E3%80%80.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"取消しに同意していないことを理由に","choice_1_reason":"誤り。未成年者本人にも取消権が認められるため、法定代理人が「同意していない」ことだけで本人の取消しを取り消せません。\n未成年者Aには自ら取消権があるため、取消しの意思表示をするのにBの同意を得る必要はない。取消しによってAを保護する制度なのに、Bの同意がなければA自身が取り消せないとすれば保護が狭くなりすぎる。Bは法定代理人として別途取消権を持つが、それはAがした取消しを後から取消す権利とは異なる。","choice_1_corrected_statement":"ＡがＢの同意を得ずに制限行為能力を理由として本件売買契約を取り消した場合、Ｂは、自己が本件売買契約のA自身の有効な取消しをBが同意欠如だけで取り消すことはできない、Ａの当該取消しの意思表示を取り消すことができる。","choice_1_legal_basis":"民法5条・120条","choice_1_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／取消し＝初めは有効だが後に遡及的無効となる／無効＝初めから効力を生じない。成年後の追認と成年前の処分を区別。","choice_2_truth":"false","choice_2_is_exam_answer":"false","choice_2_wrong_part":"取り消すことはできない","choice_2_reason":"誤り。相手方が未成年者であることを知らず、無過失だったとしても、未成年者保護の取消権は原則失われません。\n制限行為能力制度は本人保護のために設けられており、相手方Cの[[WARN:善意無過失]]だけで取消権が失われるとはされていない。相手方保護は、詐術（21条）、催告権（20条）など別の規定で調整される。建物の購入という重大な義務を伴う行為なので、単に権利を得る例外でもない。","choice_2_corrected_statement":"本件売買契約締結時にＡが未成年者であることにつきＣが善意無過失であった場合、Ｂは、Ａの制限行為能力を理由として、本件売買契約を相手方の善意無過失だけでは取消権は消滅しない。","choice_2_legal_basis":"民法5条・20条・21条","choice_2_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／取消し＝初めは有効だが後に遡及的無効となる／無効＝初めから効力を生じない。成年後の追認と成年前の処分を区別。","choice_3_truth":"true","choice_3_is_exam_answer":"true","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい。成年に達した本人は、取消権を認識して追認することができ、追認後は取り消せません。\nAが成年に達して独立に法律行為をできる状態となり、取消権があることも認識して契約を追認したなら、追認後はその未成年を理由として取り消せなくなる。Bが以前反対していたことは、成年したAの有効な追認を一般的に妨げない。追認と取消しは選択的に行使されるもので、一度有効な追認をすれば後から撤回できない。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"民法122条・124条","choice_3_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／取消し＝初めは有効だが後に遡及的無効となる／無効＝初めから効力を生じない。成年後の追認と成年前の処分を区別。","choice_4_truth":"false","choice_4_is_exam_answer":"false","choice_4_wrong_part":"取り消すことはできなくなる","choice_4_reason":"誤り。成年前の無断転売をもって、当然に法定追認が成立し取消権が消滅するわけではありません。\n成年前のAがBの同意を得ずに建物をDへ転売しても、Aはなお制限行為能力者である。法定追認の制度を適用する際には、追認をできる状態で行われたかが問題となるので、成年前の無断処分を当然の有効な追認とみなすことはできない。Cとの売買の取消可能性とDとの別契約の取消可能性は区別する。","choice_4_corrected_statement":"本件売買契約につき、Ｂが追認しないまま、Ａが成年に達する前にＢの同意を得ずに甲建物をＤに売却した場合、ＢがＤへの売却について追認していないときでも、Ａは制限行為能力を理由として、本件売買契約を成年前の無断処分で当然に追認となるわけではない。","choice_4_legal_basis":"民法124条・125条","choice_4_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／取消し＝初めは有効だが後に遡及的無効となる／無効＝初めから効力を生じない。成年後の追認と成年前の処分を区別。"},{"question_id":"2023-Q09","year":2023,"session":"通常","question_no":9,"major_field":"権利関係","section":"民法","unit":"賃貸借","topic":"賃貸借・敷金・転貸","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"Ａを貸主、Ｂを借主として甲建物の賃貸借契約が令和5 年7 月1 日に締結された場合の甲建物の修繕に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。","choice_1":"甲建物の修繕が必要であることを、Ａが知ったにもかかわらず、Ａが相当の期間内に必要な修繕をしないときは、Ｂは甲建物の修繕をすることができる。","choice_2":"甲建物の修繕が必要である場合において、ＢがＡに修繕が必要である旨を通知したにもかかわらず、Ａが必要な修繕を直ちにしないときは、Ｂは甲建物の修繕をすることができる。","choice_3":"Ｂの責めに帰すべき事由によって甲建物の修繕が必要となった場合は、Ａは甲建物を修繕する義務を負わない。","choice_4":"甲建物の修繕が必要である場合において、急迫の事情があるときは、Ｂは甲建物の修繕をすることができる。","official_accepted_answers":"2","answer_conclusion":"《借主による修繕》は「通知しただけで直ちに」できるわけではなく、原則相当期間を要します。","answer_reason":"《==借主による修繕==》は「通知しただけで直ちに」できるわけではなく、原則相当期間を要します。","scoring_exception_note":"","deep_lecture":"賃借物の修繕については、最初に==誰が修繕義務を負うか==、次に==借主が自ら修繕できる場合==、最後に費用の精算を区別する。民法606条1項本文では、貸主は借主が建物を使用・収益するために必要な修繕を行う義務を負う。例えば通常の使用による設備の故障は貸主側の修繕問題になり得るが、借主に責められる原因で生じた損傷については同項ただし書の例外が問題になる。民法607条の2は借主による修繕を認める二つの場面を示す。第一は、借主が貸主に修繕を通知した、または貸主が必要性を知ったにもかかわらず、==相当期間内に貸主が修繕をしない==場合。通知した翌日だから当然に自己修繕してよいという規定ではない。第二は、[[NOTE:急迫の事情]]がある場合。放置すると危険や被害が拡大するような緊急の修繕では、相当期間の経過を待つ必要がない。この二つは「どちらか一方」でよい要件であり、両方の成立を求めてはならない。さらに修繕した借主から貸主への費用償還は民法608条の別問題である。本問では肢1は通知・認識と相当期間の関係、肢2は[[WARN:直ちに]]という要件の抜け、肢3は借主帰責による義務除外、肢4は緊急時の特則と、4つの独立したチェックポイントを問う。修繕が必要になった原因も欠かせない判断材料である。","system_purpose":"【学習補助】賃貸借の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】「[[NOTE:契約が終了した時」「建物を明け渡]]した時」「所有者が変わった時」は別の基準時。解除の有効性と敷金返還の時期を分けて覚える。","comparative_explanation":"【本問で混同しやすい区別】「契約が終了した時」「建物を明け渡した時」「所有者が変わった時」は別の基準時。解除の有効性と敷金返還の時期を分けて覚える。","important_points":"《通知＋相当期間の未修繕》または《急迫の事情》が鍵。\n【判定の軸】「契約が終了した時」「建物を明け渡した時」「所有者が変わった時」は別の基準時。解除の有効性と敷金返還の時期を分けて覚える。","trick_patterns":"「[[WARN:直ちに]]」「相当期間」「急迫」の言葉の差が頻出。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《借主による修繕》は「通知しただけで直ちに」できるわけではなく、原則相当期間を要します。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 2番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 「契約が終了した時」「建物を明け渡した時」「所有者が変わった時」は別の基準時。解除の有効性と敷金返還の時期を分けて覚える。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法（e-Gov、第606条〜608条） https://laws.e-gov.go.jp/law/129AC0000000089/20220401_430AC0000000059","marker_yellow_spans":"借主による修繕|誰が修繕義務を負うか|借主が自ら修繕できる場合|相当期間内に貸主が修繕をしない","marker_red_spans":"直ちに","marker_blue_spans":"急迫の事情|契約が終了した時」「建物を明け渡","qa_status":"REWORK","qa_issues":"設問固有の解説・根拠条文を重点修正。ただし2026年度現行法の全肢独立検証は未完了。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R5_qestion_answer%E3%80%80.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"false","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。民法607条の2第1号は、借主が修繕の必要を知らせた場合だけでなく、貸主が修繕の必要を既に知っていた場合も対象にしている。修繕義務を負う貸主が==相当の期間内に必要な修繕をしない==ときは、借主による修繕が認められる。本肢は「貸主Aが知った」「相当期間内に修繕しなかった」の二要件を満たしている。一方、通知を受けた直後に必ず借主が修繕できるというものではなく、肢2の「直ちに」との違いを確認する。","choice_1_corrected_statement":"原文どおりで正しい","choice_1_legal_basis":"民法607条の2第1号","choice_1_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。賃貸人が修繕の必要を知り、相当期間内に対応しない場合には、賃借人が修繕できる場合があります。 具体的な要件は出題当時の関連条文で確認する。","choice_2_truth":"false","choice_2_is_exam_answer":"true","choice_2_wrong_part":"「必要な修繕を直ちにしないとき」だけで借主が修繕できるとする部分","choice_2_reason":"誤りで、これが正解肢である。民法607条の2第1号では、借主Bが貸主Aに修繕の必要を通知しただけで直ちに修繕権限が生じるわけではない。通常は、通知または貸主の認識があった後、貸主が[[WARN:相当の期間内に修繕しない]]ことが必要となる。設問の[[WARN:直ちにしないとき]]は「相当期間」の要件を落としている。なお急迫の事情がある場合は別途同条2号の規定により待機期間なしに修繕できる場面があるため、通常時と緊急時を混同しない。","choice_2_corrected_statement":"修繕が必要で、借主が通知したか貸主が修繕の必要を知ったにもかかわらず、貸主が相当の期間内に必要な修繕をしないとき、又は急迫の事情があるときは、借主はその修繕をすることができる。","choice_2_legal_basis":"民法607条の2第1号・第2号","choice_2_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。通知後、貸主が直ちに修繕しなかったというだけでは足りません。原則として相当期間の経過が必要です。 具体的な要件は出題当時の関連条文で確認する。","choice_3_truth":"true","choice_3_is_exam_answer":"false","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい。民法606条1項本文は、賃貸人が賃貸物の使用・収益に必要な修繕をする義務を定めるが、ただし書は、==賃借人の責めに帰すべき事由==で修繕が必要になった場合を除いている。たとえば借主の不注意による破損と、経年使用に伴う設備の故障とでは原因が異なる。誰が費用を負担するかは契約内容等も関係するが、この肢が問うのは貸主の修繕義務そのものである。必要費の償還請求（民法608条）とは論点を分ける。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"民法606条1項ただし書","choice_3_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。修繕が借主の責めに帰すべき事由で必要になった場合、賃貸人は原則修繕義務を負いません。 具体的な要件は出題当時の関連条文で確認する。","choice_4_truth":"true","choice_4_is_exam_answer":"false","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。水漏れの拡大を止めるため緊急修繕が必要なような==急迫の事情==では、貸主への通知後に相当期間が過ぎるのを待っていると損害が拡大する。民法607条の2第2号は、そのような場合に借主自身が修繕できると定める。肢1の「貸主が必要性を知り、相当期間内に動かなかった場合」とは異なる独立の要件であり、両方の要件を満たす必要はない。必要性や緊急性のない改装まで自由に認められる制度ではない。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"民法607条の2第2号","choice_4_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。急迫の事情があるときは、相当期間を待たず賃借人が修繕できる場合があります。 具体的な要件は出題当時の関連条文で確認する。"},{"question_id":"2023-Q10","year":2023,"session":"通常","question_no":10,"major_field":"権利関係","section":"民法","unit":"抵当権","topic":"抵当権・根抵当権","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"債務者Ａが所有する甲土地には、債権者Ｂが一番抵当権（債権額1,000 万円）、債権者Ｃが二番抵当権（債権額1,200 万円）、債権者Ｄが三番抵当権（債権額2,000 万円）をそれぞれ有しているが、ＢがＤの利益のため、Ａの承諾を得て抵当権の順位を放棄した。甲土地の競売に基づく売却代金が2,400 万円であった場合、Ｂの受ける配当額として、民法の規定によれば、正しいものはどれか。","choice_1":"0 円","choice_2":"200 万円","choice_3":"400 万円","choice_4":"800 万円","official_accepted_answers":"3","answer_conclusion":"《抵当権の順位放棄》は、放棄の対象者との間で配当を再配分します。Bの配当は400万円です。","answer_reason":"《==抵当権の順位放棄==》は、放棄の対象者との間で配当を再配分します。Bの配当は400万円です。","scoring_exception_note":"","deep_lecture":"順位「放棄」は受益者との間で原則債権額に応じて配当を分けます。順位「譲渡」では譲渡人の順位を譲受人が優先利用する場面となり、計算が違います。\n\n【単元の見取り図・補足講義】抵当権は担保物の占有を移さずに債権の優先弁済を確保する制度。物上代位、順位、担保権の実行、根抵当権の確定前後は制度ごとに要件が違う。 抵当権の順位と配当額は、債権額だけでなく先順位・後順位、順位変更や放棄の相手方を確かめて算出する。\n\n【本問の四肢を使った比較】【肢1：誤りを含む記述】誤り。Bの配当は0円ではありません。順位放棄によってDとの配当が調整されます。 【肢2：誤りを含む記述】誤り。Bの配当は200万円ではありません。順位放棄したBと受益者Dの配当原資の再配分が必要です。 【肢3：正しい方向の記述】正しい。通常配当B1,000万円、C1,200万円、D200万円。BとDが合計1,200万円を債権額比1,000対2,000で按分→B400万円、D800万円。Cは1,200万円。 【肢4：誤りを含む記述】誤り。800万円は順位放棄の受益者D側の配当額であり、Bの配当ではありません。\n\n【設問で判断を練習する】正解につながる肢の焦点は「400 万円」。正しい。通常配当B1,000万円、C1,200万円、D200万円。BとDが合計1,200万円を債権額比1,000対2,000で按分→B400万…。一方、「0 円」を論じる肢では「誤り。Bの配当は0円ではありません。順位放棄によってDとの配当が調整されます」という別の結論が問題となる。","system_purpose":"【学習補助】抵当権の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:抵当権の順位と配当額は、債権額だけ]]でなく先順位・後順位、順位変更や放棄の相手方を確かめて算出する。","comparative_explanation":"【本問で混同しやすい区別】抵当権の順位と配当額は、債権額だけでなく先順位・後順位、順位変更や放棄の相手方を確かめて算出する。","important_points":"《B＋Dの原資＝1,200万円》／《按分比率＝1:2》／《B＝400万円》。\n【判定の軸】抵当権の順位と配当額は、債権額だけでなく先順位・後順位、順位変更や放棄の相手方を確かめて算出する。","trick_patterns":"順位放棄と順位譲渡を[[WARN:混同]]しない。Cの配当は順位放棄の相対的効果で変わりません。"," 万円ではありません。順位放棄したBと受益者Dの配当原資の再配分が必要です。","choice_2_legal_basis":"肢別の法令照合待ち。関連出典：民法376条","choice_2_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。Bの配当は200万円ではありません。順位放棄したBと受益者Dの配当原資の再配分が必要です。 具体的な要件は出題当時の関連条文で確認する。","choice_3_truth":"true","choice_3_is_exam_answer":"true","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい。通常配当B1,000万円、C1,200万円、D200万円。BとDが合計1,200万円を債権額比1,000対2,000で按分→B400万円、D800万円。Cは1,200万円。\n原文の「400 万円」にある条件が、正誤の判断を左右する。【理解を深める】B＋Dの原資＝1,200万円／按分比率＝1:2／B＝400万円。\n比較対象の肢4では「800 万円」が論点となる。誤り。800万円は順位放棄の受益者D側の配当額であり、Bの配当ではありません。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"肢別の法令照合待ち。関連出典：民法376条","choice_3_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。通常配当B1,000万円、C1,200万円、D200万円。BとDが合計1,200万円を債権額比1,000対2,000で按分→B400万円、D800万円。 具体的な要件は出題当時の関連条文で確認する。","choice_4_truth":"false","choice_4_is_exam_answer":"false","choice_4_wrong_part":"UNKNOWN","choice_4_reason":"誤り。800万円は順位放棄の受益者D側の配当額であり、Bの配当ではありません。\n原文の「800 万円」という断定を、そのまま一般原則として受け入れてはいけない。未検証の修正文案では「800万円は順位放棄の受益者D側の配当額であり、Bの配当ではありません」であり、原文との違いを比べて制度の適用範囲を判断する。【理解を深める】順位「放棄」は受益者との間で原則債権額に応じて配当を分けます。順位「譲渡」では譲渡人の順位を譲受人が優先利用する場面となり、計算が違います。\n比較対象の肢1では「0 円」が論点となる。誤り。Bの配当は0円ではありません。順位放棄によってDとの配当が調整されます。","choice_4_corrected_statement":"【修正文案・独立照合待ち】800万円は順位放棄の受益者D側の配当額であり、Bの配当ではありません。","choice_4_legal_basis":"肢別の法令照合待ち。関連出典：民法376条","choice_4_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。800万円は順位放棄の受益者D側の配当額であり、Bの配当ではありません。 具体的な要件は出題当時の関連条文で確認する。"},{"question_id":"2023-Q11","year":2023,"session":"通常","question_no":11,"major_field":"権利関係","section":"借地借家法","unit":"借家","topic":"借家権・更新・定期建物賃貸借","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"ＡがＢとの間で、Ａ所有の甲土地につき建物所有目的で期間を50 年とする賃貸借契約（以下この問において「本件契約」という。）を締結する場合に関する次の記述のうち、借地借家法の規定及び判例によれば、正しいものはどれか。","choice_1":"本件契約に、当初の10 年間は地代を減額しない旨の特約を定めた場合、その期間内は、ＢはＡに対して地代の減額請求をすることはできない。","choice_2":"本件契約が甲土地上で専ら賃貸アパート事業用の建物を所有する目的である場合、契約の更新や建物の築造による存続期間の延長がない旨を定めるためには、公正証書で合意しなければならない。","choice_3":"本件契約に建物買取請求権を排除する旨の特約が定められていない場合、本件契約が終了したときは、その終了事由のいかんにかかわらず、ＢはＡに対してＢが甲土地上に所有している建物を時価で買い取るべきことを請求することができる。","choice_4":"本件契約がＢの居住のための建物を所有する目的であり契約の更新がない旨を定めていない契約であって、期間満了する場合において甲土地上に建物があり、Ｂが契約の更新を請求したとしても、Ａが遅滞なく異議を述べ、その異議に更新を拒絶する正当な事由があると認められる場合は、本件契約は更新されない。","official_accepted_answers":"4","answer_conclusion":"《普通借地》の更新拒絶には正当事由が必要。借地人が更新請求しても、適法な異議があれば更新されません。","answer_reason":"《==普通借地==》の更新拒絶には正当事由が必要。借地人が更新請求しても、適法な異議があれば更新されません。","scoring_exception_note":"","deep_lecture":"普通借地権は原則30年以上、定期借地権は要件を満たすと更新を排除できます。一般定期借地権は50年以上などの要件があり、居住用アパートでも利用余地がありますが、事業用定期借地権とは別です。\n\n【単元の見取り図・補足講義】借地権と建物賃借権は対象が異なり、更新・解約・正当事由・定期契約の書面要件も区別して判断する。地代増減額請求と家賃増減額請求を同じ文言で暗記しない。 普通借地の当初期間や更新期間、定期借地の事業用・一般定期の要件、建物買取請求の発生時点を比較する。\n\n【本問の四肢を使った比較】【肢1：誤りを含む記述】誤り。普通借地権では地代減額請求を排除する特約は原則効力が認められません。地代が不相当になれば法定の減額請求が問題となります。 【肢2：誤りを含む記述】誤り。専ら「居住用賃貸アパート」を建てる事業は、事業用定期借地権の事業用建物要件を満たしません。公正証書ならすべて事業用定期借地にできるわけではありません。 【肢3：誤りを含む記述】誤り。建物買取請求権が常に生じるわけではありません。借地権の存続期間満了・契約更新の不成立など、法律の要件が必要です。 【肢4：正しい方向の記述】正しい。普通借地権の更新請求に対し、貸主が遅滞なく異議を述べ、正当事由があれば更新が拒絶されます。","system_purpose":"【学習補助】借家の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:普通借地の当初期間や更新期間、定期]]借地の事業用・一般定期の要件、建物買取請求の発生時点を比較する。","comparative_explanation":"【本問で混同しやすい区別】普通借地の当初期間や更新期間、定期借地の事業用・一般定期の要件、建物買取請求の発生時点を比較する。","important_points":"《普通借地更新拒絶＝正当事由》／《事業用定期借地＝居住用不可》。\n【判定の軸】普通借地の当初期間や更新期間、定期借地の事業用・一般定期の要件、建物買取請求の発生時点を比較する。","trick_patterns":"「[[WARN:賃貸アパートで事業をする]]」から事業用定期借地と考えない。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《普通借地》の更新拒絶には正当事由が必要。借地人が更新請求しても、適法な異議があれば更新されません。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 4番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 普通借地の当初期間や更新期間、定期借地の事業用・一般定期の要件、建物買取請求の発生時点を比較する。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","le _1":"期間を1 年未満とする建物の賃貸借契約は、期間を1 年とするものとみなされる。","choice_2":"当事者間において、一定の期間は建物の賃料を減額しない旨の特約がある場合、現行賃料が不相当になったなどの事情が生じたとしても、この特約は有効である。","choice_3":"賃借人が建物の引渡しを受けている場合において、当該建物の賃貸人が当該建物を譲渡するに当たり、当該建物の譲渡人及び譲受人が、賃貸人たる地位を譲渡人に留保する旨及び当該建物の譲受人が譲渡人に賃貸する旨の合意をしたときは、賃貸人たる地位は譲受人に移転しない。","choice_4":"現行賃料が定められた時から一定の期間が経過していなければ、賃料増額請求は、認められない。","official_accepted_answers":"3","answer_conclusion":"《建物の対抗力＝引渡し》。建物を売却しても、賃貸人の地位を旧所有者に留保する合意などの例外があります。","answer_reason":"《==建物の対抗力＝引渡し==》。建物を売却しても、賃貸人の地位を旧所有者に留保する合意などの例外があります。","scoring_exception_note":"","deep_lecture":"建物の賃借人が引渡しを受けていると、後の所有者にも賃借権を対抗できます。原則新所有者が賃貸人の地位を承継しますが、賃貸借の地位留保の合意など法定例外があります。\n\n【単元の見取り図・補足講義】賃貸借では賃料支払、目的物の使用収益、修繕、敷金精算、転貸、賃貸人の地位移転を区別する。建物賃貸借には借地借家法の特則も働く。 「契約が終了した時」「建物を明け渡した時」「所有者が変わった時」は別の基準時。解除の有効性と敷金返還の時期を分けて覚える。\n\n【本問の四肢を使った比較】【肢1：誤りを含む記述】誤り。普通建物賃貸借で1年未満の期間を定めると、原則期間の定めがないものとみなされます。 【肢2：誤りを含む記述】誤り。賃料減額請求を排除する特約は原則として効力が制限されます。借主保護の強行規定に注意します。 【肢3：正しい方向の記述】正しい。譲渡人と譲受人が賃貸人の地位を留保し、譲受人が譲渡人に賃貸する旨の合意をすれば、賃貸人の地位は直ちには譲受人に移転しません。 【肢4：誤りを含む記述】誤り。賃料増額請求に「必ず一定の年月経過」が必要という一般的条件はありません。不相当な事情があるかを検討します。","system_purpose":"【学習補助】賃貸借の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】「[[NOTE:契約が終了した時」「建物を明け渡]]した時」「所有者が変わった時」は別の基準時。解除の有効性と敷金返還の時期を分けて覚える。","comparative_explanation":"【本問で混同しやすい区別】「契約が終了した時」「建物を明け渡した時」「所有者が変わった時」は別の基準時。解除の有効性と敷金返還の時期を分けて覚える。","important_points":"《1年未満の普通借家＝期間の定めなし》／《引渡し＝対抗力》／《賃貸人地位の留保可能》。\n【判定の軸】「契約が終了した時」「建物を明け渡した時」「所有者が変わった時」は別の基準時。解除の有効性と敷金返還の時期を分けて覚える。","trick_patterns":"定期建物賃貸借の書面等の要件と、普通建物賃貸借を[[WARN:混同]]しない。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《建物の対抗力＝引渡し》。建物を売却しても、賃貸人の地位を旧所有者に留保する合意などの例外があります。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 3番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 「契約が終了した時」「建物を明け渡した時」「所有者が変わった時」は別の基準時。解除の有効性と敷金返還の時期を分けて覚える。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effe の定めがある場合を除いて、各共有者がすることができるため集会の決議を必要としない。","choice_4":"一部共用部分に関する事項で区分所有者全員の利害に関係しないものについての区分所有者全員の規約は、当該一部共用部分を共用すべき区分所有者が8 人である場合、3 人が反対したときは変更することができない。","official_accepted_answers":"2","answer_conclusion":"《2023年当時の区分所有法》では、招集手続を省略するには区分所有者全員の同意が必要でした。","answer_reason":"《==2023年当時の区分所有法==》では、招集手続を省略するには区分所有者全員の同意が必要でした。","scoring_exception_note":"","deep_lecture":"区分所有法の集会手続は、共同管理を進めるための多数決と、区分所有者が議案を知り意思を表明するための手続保障との調整によって成り立ちます。第1に集会の招集通知。出題当時、通知であらかじめ会議目的を知らせるのが原則でしたが、普通決議事項では規約による例外が認められる場面がありました。第2に==招集手続の省略==。2023年の問題では、手続そのものを省略して集会を開催するには[[WARN:全員の同意]]が必要であり、4分の3では足りないことが正解の決め手です。第3に共用部分の保存行為。これは変更や管理と異なり、規約の別段の定めがなければ個々の共有者で行えるものとされていました。第4に[[NOTE:一部共用部分]]。廊下など一部区分所有者だけが利用する場所は、全体の集会・規約だけで利害を無視して扱えるわけではありません。設問では8人のうち3人という数字が、一部共用部分の規約変更に反対できる人数の判断材料となります。解法としては、①招集手続か決議か、②普通決議か特別決議か、③保存か変更か、④全体共用部分か一部共用部分かを順に切り分けます。2026年4月施行の改正では集会の招集・議決制度に関する規律が変更され、招集手続開始時期に応じた経過措置もあるので、古い過去問の条文番号・手続をそのまま暗記してはいけません。","system_purpose":"【学習補助】区分所有の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"管理組合が急ぎの集会を開こうとしても、出題当時は「区分所有者の4分の3が賛成だから招集通知を省略できる」という扱いではありません。決議要件と開催手続を先に分けて判断する必要があります。","advanced_knowledge":"【関連論点】2026年4月施行の区分所有法改正があるため、集会手続・決議要件の出題当時の扱いをそのまま現行法に置き換えない。","comparative_explanation":"【本問で混同しやすい区別】2026年4月施行の区分所有法改正があるため、集会手続・決議要件の出題当時の扱いをそのまま現行法に置き換えない。","important_points":"《旧法：招集手続の省略＝全員同意》／《特別決議は普通決議と別》。\n【判定の軸】2026年4月施行の区分所有法改正があるため、集会手続・決議要件の出題当時の扱いをそのまま現行法に置き換えない。","trick_patterns":"【最重要】2026年4月の区分所有法改正により規定の構成・決議要件等が変わるため、旧法の数字を2026[[WARN:年度の正答根拠にしない]]。","memory_summary":"《2023年当時の区分所有法》では、招集手続を省略するには区分所有者全員の同意が必要でした。","review_check_questions":"Q1. 2023年法で招集手続を省略するのに必要な同意は？ A. 区分所有者全員。Q2. 共用部分の保存行為は常に集会決議が必要？ A. 出題当時は規約に別段の定めがない限り各共有者が行えた。Q3. 一部共用部分に関する規約変更では誰の利害を見る？ A. その一部共用部分の共用者。","substatement_reasoning":"","reform_status":"review_required","reform_title":"区分所有法の2026年4月1日施行改正・集会の経過措置","reform_effective_date":"2026-04-01","reform_before":"本問は試験当時の区分所有法を前提に判定する。","reform_after":"2026年4月1日に区分所有法等の改正が施行。","reform_2026_impact":"施行日前に招集手続を開始した集会と施行日後に開始した集会では適用される規律が異なる。出題当時の全員同意等の記述は、2026年度の手続へ無条件に置き換えない。","reform_sources":"https://www.moj.go.jp/content/001460460.pdf","legal_sources":"[[NOTE:区分所有法]]（2023年当時）35条・36条・17条・31条","marker_yellow_spans":"2023年当時の区分所有法|招集手続の省略","marker_red_spans":"全員の同意|年度の正答根拠にしない","marker_blue_spans":"一部共用部分","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R5_qestion_answer%E3%80%80.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"false","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい（2023年出題当時）。区分所有法の集会では、招集通知で会議の目的事項を明らかにすることが基本ですが、出席者が想定していない議案を決議できるかは事項の種類で異なります。特別多数決を必要とする重要事項を除き、規約に別段の定めがあれば通知していない事項も決議できる場合がありました。規約の存在だけで何でも自由に決議できるわけではなく、法律があらかじめ通知すべきとする特別事項との区別が必要です。","choice_1_corrected_statement":"原文どおりで正しい","choice_1_legal_basis":"肢別の法令照合待ち。関連出典：区分所有法（2023年当時）35条・36条・17条・31条","choice_1_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。普通決議事項では、規約に別段の定めがあれば通知した事項以外を決議できる場合があります。特別決議事項は除きます。 具体的な要件は出題当時の関連条文で確認する。","choice_2_truth":"false","choice_2_is_exam_answer":"true","choice_2_wrong_part":"区分所有者の4 分の3 以上の同意","choice_2_reason":"誤り（正解肢、2023年法）。出題当時、集会の招集手続を経ずに集会を開くためには、区分所有者全員の同意が必要でした。本肢は4分の3以上で足りるとしていますが、これは共用部分の変更や規約の変更等で目にする特別多数決の数字と混同したものです。開催手続そのものを省略することと、適法に招集した集会で特定議案を決議することは別問題です。2026年4月施行後は集会手続が改正されているため、現行条文と経過措置を改めて確認してください。","choice_2_corrected_statement":"2023年の出題当時の区分所有法では、集会の招集手続を経ないで集会を開くには、区分所有者全員の同意が必要であった。2026年施行後の手続は改正後条文により別途判断する。","choice_2_legal_basis":"肢別の法令照合待ち。関連出典：区分所有法（2023年当時）35条・36条・17条・31条","choice_2_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。集会の招集手続を省くには、旧法上は区分所有者全員の同意が必要で、4分の3では足りません。 具体的な要件は出題当時の関連条文で確認する。","choice_3_truth":"true","choice_3_is_exam_answer":"false","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい（2023年法）。共用部分の保存行為とは、共用部分の現状を維持し損傷や権利侵害を防ぐための行為をいいます。日常的な修繕を超えて権利関係や利用方法を大きく変える行為とは異なり、出題当時は規約に別段の定めがない限り各共有者が単独で保存行為をすることが認められていました。集会の決議を経なければ雨漏り防止などの保全措置も取れないとすると、建物の維持管理に支障が生じるためです。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"肢別の法令照合待ち。関連出典：区分所有法（2023年当時）35条・36条・17条・31条","choice_3_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。共用部分の保存行為は、規約で別段の定めがない限り各共有者が行えます。 具体的な要件は出題当時の関連条文で確認する。","choice_4_truth":"true","choice_4_is_exam_answer":"false","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい（2023年法）。一部共用部分について、その共用者だけに利害関係がある事項を区分所有者全体の規約で定めたり変更したりする場合、対象者側の一定数の反対による制限がありました。設問では一部共用部分を共有する区分所有者8人のうち3人が反対しています。3人は8人の4分の1を超えるため、記述の条件下では全体規約の変更を強行できません。単に「全体の多数決だから少数区分所有者の意向は不要」と考えないことが肝心です。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"肢別の法令照合待ち。関連出典：区分所有法（2023年当時）35条・36条・17条・31条","choice_4_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。一部共用部分に関する規約変更に特別の影響がある場合など、対象者の一定の反対があると変更できない制限があり、本設問の反対3人はその制限に該当します。 具体的な要件は出題当時の関連条文で確認する。"},{"question_id":"2023-Q14","year":2023,"session":"通常","question_no":14,"major_field":"権利関係","section":"不動産登記法","unit":"登記","topic":"表示登記・権利登記・仮登記","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"不動産の登記に関する次の記述のうち、不動産登記法の規定によれば、誤っているものはどれか。","choice_1":"建物が滅失したときは、表題部所有者又は所有権の登記名義人は、その滅失の日から1 か月以内に、当該建物の滅失の登記を申請しなければならない。","choice_2":"何人も、理由の有無にかかわらず、登記官に対し、手数料を納付して、登記簿の附属書類である申請書を閲覧することができる。","choice_3":"共有物分割禁止の定めに係る権利の変更の登記の申請は、当該権利の共有者である全ての登記名義人が共同してしなければならない。","choice_4":"区分建物の所有権の保存の登記は、表題部所有者から所有権を取得した者も、申請することができる。","official_accepted_answers":"2","answer_conclusion":"《登記簿附属書類の閲覧》は何人にも無条件に認められるわけではありません。","answer_reason":"《==登記簿附属書類の閲覧==》は何人にも無条件に認められるわけではありません。","scoring_exception_note":"","deep_lecture":"「登記事項証明書」は原則だれでも交付請求できますが、「申請書等の附属書類の閲覧」には制限があります。また表題登記と権利登記、区分建物の例外は別に覚えます。\n\n【単元の見取り図・補足講義】表示登記は不動産の物理的現況、権利登記は権利関係を公示する。申請義務や閲覧範囲は登記簿本体と附属書類で異なる。 建物滅失の期限、附属書類閲覧に必要な利害関係、区分建物の保存登記の特則を区別する。\n\n【本問の四肢を使った比較】【肢1：正しい方向の記述】正しい。建物の滅失登記は、表題部所有者または所有権の登記名義人が原則滅失の日から1か月以内に申請します。 【肢2：誤りを含む記述】誤り（正解肢）。登記申請書などの附属書類の閲覧は、法律上の利害関係等の要件を満たす範囲に限られます。「理由の有無にかかわらず何人も」は誤りです。 【肢3：正しい方向の記述】正しい。共有物分割禁止の定めの登記等は、関係する共有名義人全員で申請する場面があります。 【肢4：正しい方向の記述】正しい。区分建物では、表題部所有者から所有権を取得した者も所有権保存登記の申請ができる特則があります。\n\n【設問で判断を練習する】正解につながる肢の焦点は「何人も、理由の有無にかかわらず、登記官に対し、手数料を納付して」。誤り（正解肢）。登記申請書などの附属書類の閲覧は、法律上の利害関係等の要件を満たす範囲に限られます。「理由の有無にかかわらず何人も」は誤りです。一方、「建物が滅失したときは、表題部所有者又は所有権の登記名義人は、その滅失の日から1 か月以内に」を論じる肢では「正しい。建物の滅失登記は、表題部所有者または所有権の登記名義人が原則滅失の日から1か月以内に申請します」という別の結論が問題となる。","system_purpose":"【学習補助】登記の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:建物滅失の期限、附属書類閲覧に必要]]な利害関係、区分建物の保存登記の特則を区別する。","comparative_explanation":"【本問で混同しやすい区別】建物滅失の期限、附属書類閲覧に必要な利害関係、区分建物の保存登記の特則を区別する。","important_points":"《滅失登記＝原則1か月》／《附属書類閲覧＝無制限ではない》。\n【判定の軸】建物滅失の期限、附属書類閲覧に必要な利害関係、区分建物の保存登記の特則を区別する。","trick_patterns":"登記事項証明書と附属書類を[[WARN:混同]]しない。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《登記簿附属書類の閲覧》は何人にも無条件に認められるわけではありません。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 2番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 建物滅失の期限、附属書類閲覧に必要な利害関係、区分建物の保存登記の特則を区別する。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"不動産[[NOTE:登記]]法49条・119条・121条・74条","marker_yellow_spans":"登記簿附属書類の閲覧","marker_red_spans":"混同","marker_blue_spans":"建物滅失の期限、附属書類閲覧に必要","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R5_qestion_answer%E3%80%80.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"false","choice_1 ている土地の区域のほか、一定の場合には」にある条件が、正誤の判断を左右する。【理解を深める】市街化区域＝計画的市街化、市街化調整区域＝市街化を抑制、準都市計画区域＝都市周辺の乱開発防止のための区域です。地区計画と特定用途制限地域は「用途地域の内外」を確認しましょう。\n比較対象の肢1では「市街化調整区域は、土地利用を整序し、又は環境を保全するための措置を講ずることなく放置すれば」が論点となる。誤り。記述は準都市計画区域に関する趣旨との混同です。市街化調整区域は市街化を抑制すべき区域です。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"肢別の法令照合待ち。関連出典：都市計画法7条・8条・12条の5","choice_4_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。地区計画は用途地域内だけでなく、一定の用途地域の定めのない区域でも定めることができます。 具体的な要件は出題当時の関連条文で確認する。"},{"question_id":"2023-Q16","year":2023,"session":"通常","question_no":16,"major_field":"法令上の制限","section":"都市計画法","unit":"開発許可","topic":"開発行為・開発許可","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"都市計画法に関する次の記述のうち、正しいものはどれか。ただし、この問において条例による特別の定めはないものとし、「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。","choice_1":"開発許可を申請しようとする者は、あらかじめ、開発行為に関係がある公共施設の管理者と協議し、その同意を得なければならない。","choice_2":"開発許可を受けた者は、当該許可を受ける際に申請書に記載した事項を変更しようとする場合においては、都道府県知事に届け出なければならないが、当該変更が国土交通省令で定める軽微な変更に当たるときは、届け出なくてよい。","choice_3":"開発許可を受けた者は、当該開発行為に関する工事が完了し、都道府県知事から検査済証を交付されたときは、遅滞なく、当該工事が完了した旨を公告しなければならない。","choice_4":"市街化調整区域のうち開発許可を受けた開発区域以外の区域内において、自己の居住用の住宅を新築しようとする全ての者は、当該建築が開発行為を伴わない場合であれば、都道府県知事の許可を受けなくてよい。","official_accepted_answers":"1","answer_conclusion":"《開発許可》の前には関係する公共施設管理者の同意などが必要です。","answer_reason":"《==開発許可==》の前には関係する公共施設管理者の同意などが必要です。","scoring_exception_note":"","deep_lecture":"開発許可は許可前（公共施設管理者との協議）、許可後（変更手続）、工事完了時（届出・検査・公告）と順序に沿って覚えます。\n\n【単元の見取り図・補足講義】開発許可の対象は建築物の床面積そのものではなく、建築等を目的とする土地の区画形質の変更。区域区分・面積・許可不要事由を順に判定する。 事前協議、変更許可と軽微変更届、完了検査、公告の主体を取り違えない。\n\n【本問の四肢を使った比較】【肢1：正しい方向の記述】正しい。開発許可申請者は、あらかじめ関係する公共施設の管理者と協議してその同意を得るなど、法定手続きを踏みます。 【肢2：誤りを含む記述】誤り。軽微な変更は「届出も不要」ではなく、変更許可が不要でも原則届出が必要な場合があります。 【肢3：誤りを含む記述】誤り。工事完了届→知事等の検査→検査済証交付→公告、という流れで、公告を行うのは原則行政庁です。 【肢4：誤りを含む記述】誤り。市街化調整区域では開発行為を伴わない建築でも、建築許可が必要となる場面があります。「全ての自己居住用は不要」とはいえません。\n\n【設問で判断を練習する】正解につながる肢の焦点は「開発許可を申請しようとする者は」。正しい。開発許可申請者は、あらかじめ関係する公共施設の管理者と協議してその同意を得るなど、法定手続きを踏みます。一方、「市街化調整区域のうち開発許可を受けた開発区域以外の区域内において」を論じる肢では「誤り。市街化調整区域では開発行為を伴わない建築でも、建築許可が必要となる場面があります」という別の結論が問題となる。","system_purpose":"【学習補助】開発許可の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:事前協議、変更許可と軽微変更届、完]]了検査、公告の主体を取り違えない。","comparative_explanation":"【本問で混同しやすい区別】事前協議、変更許可と軽微変更届、完了検査、公告の主体を取り違えない。","important_points":"《公共施設管理者の同意》／《軽微変更＝届出を確認》／《公告＝行政庁》。\n【判定の軸】事前協議、変更許可と軽微変更届、完了検査、公告の主体を取り違えない。","trick_patterns":"変更許可[[WARN:不要]]と届出不要は別。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《開発許可》の前には関係する公共施設管理者の同意などが必要です。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 1番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 事前協議、変更許可と軽微変更届、完了検査、公告の主体を取り違えない。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"[[NOTE:都市計画法32条]]・35条の2・36条・43条","marker_yellow_spans":"開発許可","marker_red_spans":"不要","marker_blue_spans":"事前協議、変更許可と軽微変更届、完","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R5_qestion_answer%E3%80%80.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"true","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。開発許可申請者は、あらかじめ関係する公共施設の管理者と協議してその同意を得るなど、法定手続きを踏みます。\n原文の「開発許可を申請しようとする者は」にある条件が、正誤の判断を左右する。【理解を深める】開発許可の対象は建築物の床面積そのものではなく、建築等を目的とする土地の区画形質の変更。区域区分・面積・許可不要事由を順に判定する。\n比較対象の肢2では「開発許可を受けた者は、当該許可を受ける際に申請書に記載した事項を変更しようとする場合におい…」が論点となる。誤り。軽微な変更は「届出も不要」ではなく、変更許可が不要でも原則届出が必要な場合があります。","choice_1_corrected_statement":"原文どおりで正しい","choice_1_legal_basis":"肢別の法令照合待ち。関連出典：都市計画法32条・35条の2・36条・43条","choice_1_exam_tip":"本肢ではこの肢の 8","year":2023,"session":"通常","question_no":18,"major_field":"法令上の制限","section":"建築基準法","unit":"防火規制","topic":"防火地域・準防火地域","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"次の記述のうち、建築基準法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","choice_1":"法第53 条第1 項及び第2 項の建蔽率制限に係る規定の適用については、準防火地域内にある準耐火建築物であり、かつ、街区の角にある敷地又はこれに準ずる敷地で特定行政庁が指定するものの内にある建築物にあっては同条第1 項各号に定める数値に10 分の2 を加えたものをもって当該各号に定める数値とする。","choice_2":"建築物又は敷地を造成するための擁壁は、道路内に、又は道路に突き出して建築し、又は築造してはならず、地盤面下に設ける建築物においても同様である。","choice_3":"地方公共団体は、その敷地が袋路状道路にのみ接する建築物であって、延べ面積が150 m2を超えるものについては、一戸建ての住宅であっても、条例で、その敷地が接しなければならない道路の幅員、その敷地が道路に接する部分の長さその他その敷地又は建築物と道路との関係に関して必要な制限を付加することができる。","choice_4":"冬至日において、法第56 条の2 第1 項の規定による日影規制の対象区域内の土地に日影を生じさせるものであっても、対象区域外にある建築物であれば一律に、同項の規定は適用されない。","official_accepted_answers":"1","answer_conclusion":"《建ぺい率の緩和》は、防火・準防火の耐火性能による加算と角地加算を組み合わせられます。","answer_reason":"《==建ぺい率の緩和==》は、防火・準防火の耐火性能による加算と角地加算を組み合わせられます。","scoring_exception_note":"","deep_lecture":"建ぺい率を8/10超に緩和できるケースなど、数字が絡むと混乱します。「防火性能による加算」「角地による加算」を独立した条件として確認します。\n\n【単元の見取り図・補足講義】防火・準防火地域の構造制限、建ぺい率の緩和、災害危険区域の条例、接道制限は制度の目的と適用単位が違う。 防火地域と準防火地域にまたがる建築物、指定角地と耐火建築物が重なる場面、区域外建築物の日影を分けて検討する。\n\n【本問の四肢を使った比較】【肢1：正しい方向の記述】正しい。準防火地域内の準耐火建築物等の緩和に、指定角地の緩和が重なると建ぺい率の限度に2/10を加える場合があります。 【肢2：誤りを含む記述】誤り。道路内建築制限にも地盤面下の建築物など法定の例外があります。「地盤面下でも同様に一律禁止」は誤りです。 【肢3：誤りを含む記述】誤り。接道等に関する条例の追加制限には法定の対象区分があり、本肢の一戸建て住宅を当然含むとする記述は認められません。 【肢4：誤りを含む記述】誤り。区域外にある建物でも、一定の高さ・距離等の条件で対象区域内へ日影を落とす場合は日影規制の適用対象となることがあります。\n\n【設問で判断を練習する】正解につながる肢の焦点は「法第53 条第1 項及び第2 項の建蔽率制限に係る規定の適用については」。正しい。準防火地域内の準耐火建築物等の緩和に、指定角地の緩和が重なると建ぺい率の限度に2/10を加える場合があります。一方、「冬至日において、法第56 条の2 第1 項の規定による日影規制の対象区域内の土地に日影を生…」を論じる肢では「誤り。区域外にある建物でも、一定の高さ・距離等の条件で対象区域内へ日影を落とす場合は日影規制の適用対象となることがあり…」という別の結論が問題となる。","system_purpose":"【学習補助】防火規制の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:防火地域と準防火地域にまたがる建築]]物、指定角地 場合は日影規制の適用対象となることがあります。","choice_4_legal_basis":"肢別の法令照合待ち。関連出典：建築基準法53条・44条・56条の2","choice_4_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。区域外にある建物でも、一定の高さ・距離等の条件で対象区域内へ日影を落とす場合は日影規制の適用対象となることがあります。 具体的な要件は出題当時の関連条文で確認する。"},{"question_id":"2023-Q19","year":2023,"session":"通常","question_no":19,"major_field":"法令上の制限","section":"盛土規制法","unit":"盛土規制","topic":"宅地造成等工事規制区域・特定盛土等","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"宅地造成等規制法に関する次の記述のうち、誤っているものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。","choice_1":"都道府県知事は、関係市町村長の意見を聴いて、宅地造成工事規制区域内で、宅地造成に伴う災害で相当数の居住者その他の者に危害を生ずるものの発生のおそれが大きい一団の造成宅地の区域であって、一定の基準に該当するものを、造成宅地防災区域として指定することができる。","choice_2":"都道府県知事は、その地方の気候、風土又は地勢の特殊性により、宅地造成等規制法の規定のみによっては宅地造成に伴うがけ崩れ又は土砂の流出の防止の目的を達し難いと認める場合は、都道府県（地方自治法に基づく指定都市、中核市又は施行時特例市の区域にあっては、それぞれ指定都市、中核市又は施行時特例市）の規則で、宅地造成工事規制区域内において行われる宅地造成に関する工事の技術的基準を強化し、又は付加することができる。","choice_3":"都道府県知事は、宅地造成工事規制区域内の宅地について、宅地造成に伴う災害を防止するために必要があると認める場合には、その宅地の所有者に対して、擁壁等の設置等の措置をとることを勧告することができる。","choice_4":"宅地造成工事規制区域内の宅地において、雨水その他の地表水又は地下水を排除するための排水施設の除却工事を行おうとする場合は、一定の場合を除き、都道府県知事への届出が必要となる。","official_accepted_answers":"1","answer_conclusion":"《造成宅地防災区域》は旧宅地造成工事規制区域「外」で指定する点が重要でした。旧法出題です。","answer_reason":"《==造成宅地防災区域==》は旧宅地造成工事規制区域「外」で指定する点が重要でした。旧法出題です。","scoring_exception_note":"","deep_lecture":"この問題は、2023年度試験の基準となった旧宅地造成等規制法の規律を問う過去問です。まず旧法では宅地造成工事規制区域の指定を前提として、宅地造成工事の許可や土地の安全管理を規制していました。同法の造成宅地防災区域は規制区域との関係が厳密に定められていたため、両者を同じ場所で指定できるとする選択肢1に誤りがあります。その他の肢は、都道府県等による技術基準の付加、宅地の所有者への防災措置の勧告、排水施設除却時の届出など、異なる行政権限を問うものです。==出題当時の制度==を軸に、区域指定・技術基準・勧告・届出を分けて読むことが重要です。さらに、2023年5月26日には「宅地造成及び特定盛土等規制法」、通称[[NOTE:盛土規制法]]が施行され、土地の用途にかかわらず危険な盛土等を包括的に規制する体系に移行しました。現行制度では規制区域の名称や許可・届出の対象範囲が見直されており、2023年の公式正解を保持した上で、2026年度の現行法を別途確認する必要があります。古い条文の数字を覚えて新法の問題に当てはめることが最大のひっかけです。\n\n【設問で判断を練習する】正解につながる肢の焦点は「都道府県知事は、関係市町村長の意見を聴いて、宅地造成工事規制区域内で」。誤り（2023年公式正解）。旧法上、造成宅地防災区域は宅地造成工事規制区域の外側で指定する制度でした。「規制区域内で指定」は誤りです。一方、「宅地造成工事規制区域内の宅地において」を論じる肢では「正しい（旧法）。一定の排水施設除却工事などは行政庁への届出対象でした」という別の結論が問題となる。","system_purpose":"【学習補助】盛土規制の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】2023年試験は制度の移行期に当たるため、旧法を前提とする肢と現在の盛土規制法による運用を安易に同一視しない。","comparative_explanation":"【本問で混同しやすい区別】2023年試験は制度の移行期に当たるため、旧法を前提とする肢と現在の盛土規制法による運用を安易に同一視しない。","important_points":"《旧法問題》／《2026年は宅地造成及び特定盛土等規制法の現行区分で学ぶ》。\n【判定の軸】2023年試験は制度の移行期に当たるため、旧法を前提とする肢と現在の盛土規制法による運用を安易に同一視しない。","trick_patterns":"試験当時の[[WARN:誤り]]1を現行法の問題として暗記しない。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《造成宅地防災区域》は旧宅地造成工事規制区域「外」で指定する点が重要でした。旧法出題です。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 1番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 2023年試験は制度の移行期に当たるため、旧法を前提とする肢と現在の盛土規制法による運用を安易に同一視しない。","substatement_reasoning":"","reform_status":"relevant_verified","reform_title":"盛土規制法施行による旧法からの制度移行","reform_effective_date":"2023-05-26","reform_before":"旧宅地造成等規制法は宅地造成工事規制区域等の規律を中心とした。","reform_after":"宅地造成及び特定盛土等規制法により、土地の用途を問わず危険な盛土等を包括的に規制する体系へ移行。","reform_2026_impact":"旧法の制度名・区域指定・届出を現行法の要件として暗記しない。2023年過去問の正解は当時の基準で保存する。","reform_sources":"https://www.mlit.go.jp/toshi/morido-gaiyou.html","legal_sources":"宅地造成等規制法（旧法）・宅地造成及び特定盛土等規制法","marker_yellow_spans":"造成宅地防災区域|出題当時の制度","marker_red_spans":"誤り","marker_blue_spans":"盛土規制法","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R5_qestion_answer%E3%80%80.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"true","choice_1_wrong_part":"UNKNOWN","choice_1_reason":"誤り（2023年公式正解）。旧法上、造成宅地防災区域は宅地造成工事規制区域の外側で指定する制度でした。「規制区域内で指定」は誤りです。\n原文の「都道府県知事は、関係市町村長の意見を聴いて、宅地造成工事規制区域内で」という断定を、そのまま一般原則として受け入れてはいけない。未検証の修 工事規制区域内で」が論点となる。誤り（2023年公式正解）。旧法上、造成宅地防災区域は宅地造成工事規制区域の外側で指定する制度でした。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"肢別の法令照合待ち。関連出典：宅地造成等規制法（旧法）・宅地造成及び特定盛土等規制法","choice_4_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。一定の排水施設除却工事などは行政庁への届出対象でした。 具体的な要件は出題当時の関連条文で確認する。"},{"question_id":"2023-Q20","year":2023,"session":"通常","question_no":20,"major_field":"法令上の制限","section":"土地区画整理法","unit":"土地区画整理","topic":"仮換地・換地処分・組合","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。","choice_1":"換地計画において定められた清算金は、換地処分の公告があった日の翌日において確定する。","choice_2":"現に施行されている土地区画整理事業の施行地区となっている区域については、その施行者の同意を得なければ、その施行者以外の者は、土地区画整理事業を施行することができない。","choice_3":"施行者は、換地処分の公告があった場合において、施行地区内の土地及び建物について土地区画整理事業の施行により変動があったときは、遅滞なく、その変動に係る登記を申請し、又は嘱託しなければならない。","choice_4":"土地区画整理組合は、仮換地を指定しようとする場合においては、あらかじめ、その指定について、土地区画整理審議会の同意を得なければならない。","official_accepted_answers":"4","answer_conclusion":"《仮換地の指定》は施行者の種類により必要な手続が違い、組合に土地区画整理審議会の同意が一律必要ではありません。","answer_reason":"《==仮換地の指定==》は施行者の種類により必要な手続が違い、組合に土地区画整理審議会の同意が[[WARN:一律]]必要ではありません。","scoring_exception_note":"","deep_lecture":"土地区画整理は仮換地指定→工事→換地計画→換地処分公告の流れで整理します。仮換地で使用収益地が変わっても、所有権移転時点とは区別します。\n\n【単元の見取り図・補足講義】土地区画整理では仮換地指定、使用収益開始、換地処分・公告、清算金・保留地取得のタイミングを時系列に並べる。 公告する主体と公告日の翌日に効果が生じる事項を取り違えない。組合・公共団体等の施行主体で組織要件が異なる。\n\n【本問の四肢を使った比較】【肢1：正しい方向の記述】正しい。清算金は換地処分公告日の翌日に確定するという時点が重要です。 【肢2：正しい方向の記述】正しい。既に土地区画整理事業が行われている施行地区に他者が重ねて事業を行う場合、既存施行者の同意が必要です。 【肢3：正しい方向の記述】正しい。換地処分後に権利関係が変動した土地・建物について、施行者には必要な登記を遅滞なく申請・嘱託する義務があります。 【肢4：誤りを含む記述】誤り（正解肢）。土地区画整理組合の仮換地指定に土地区画整理審議会の同意を一律必要とするのは誤りです。施行主体により機関・要件が異なります。\n\n【設問で判断を練習する】正解につながる肢の焦点は「土地区画整理組合は、仮換地を指定しようとする場合においては、あらかじめ、その指定について」。誤り（正解肢）。土地区画整理組合の仮換地指定に土地区画整理審議会の同意を一律必要とするのは誤りです。施行主体により機関・要件が異なります。一方、「換地計画において定められた清算金は」を論じる肢では「正しい。清算金は換地処分公告日の翌日に確定するという時点が重要です」という別の結論が問題となる。","system_purpose":"【学習補助】土地区画整理の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:公告する主体と公告日の翌日に効果が]]生じる事項を取り違えない。組合・公共団体等の施行主体で組織要件が異なる。","comparative_explanation":"【本問で混同しやすい区別】公告する主体と公告日の翌日に効果が生じる事項を取り違えない。組合・公共団体等の施行主体で組織要件が異なる。","important_points":"《換地処分公告の翌日》／《土地区画整理組合に審議会同意を機械適用しない》。\n【判定の軸】公告する主体と公告日の翌日に効果が生じる事項を取り違えない。組合・公共団体等の施行主体で組織要件が異なる。","trick_patterns":"施行者の種類（個人・組合・公共団体）を読み落とさない。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《仮換地の指定》は施行者の種類により必要な手続が違い、組合に土地区画整理審議会の同意が一律必要ではありません。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 4番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 公告する主体と公告日の翌日に効果が生じる事項を取り違えない。組合・公共団体等の施行主体で組織要件が異なる。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"[[NOTE:土地区画整理法98条]]・103条・104条・107条","marker_yellow_spans":"仮換地の指定","marker_red_spans":"一律","marker_blue_spans":"公告する主体と公告日の翌日に効果が","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R5_qestion_answer%E3%80%80.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"false","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。清算金は換地処分公告日の翌日に確定するという時点が重要です。\n原文の「換地計画において定められた清算金は」にある条件が、正誤の判断を左右する。【理解を深める】土地区画整理では仮換地指定、使用収益開始、換地処分・公告、清算金・保留地取得のタイミングを時系列に並べる。\n比較対象の肢2では「現に施行されている土地区画整理事業の施行地区となっている区域については」が論点となる。正しい。既に土地区画整理事業が行われている施行地区に他者が重ねて事業を行う場合、既存施行者の同意が必要です。","choice_1_corrected_statement":"原文どおりで正しい","choice_1_legal_basis":"肢別の法令照合待ち。関連出典：土地区画整理法98条・103条・104条・107条","choice_1_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。清算金は換地処分公告日の翌日に確定するという時点が重要です。 具体的な要件は出題当時の関連条文で確認する。","choice_2_truth":"true","choice_2_is_exam_answer":"false","
