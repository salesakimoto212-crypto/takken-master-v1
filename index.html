異なります。 具体的な要件は出題当時の関連条文で確認する。"},{"question_id":"2023-Q21","year":2023,"session":"通常","question_no":21,"major_field":"法令上の制限","section":"農地法","unit":"農地法総合","topic":"相続・特定遺贈・農地転用・許可の効力","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"農地に関する次の記述のうち、農地法（以下この問において「法」という。）の規定によれば、誤っているものはどれか。","choice_1":"相続により農地を取得する場合は、法第3 条第1 項の許可を要しないが、相続人に該当しない者が特定遺贈により農地を取得する場合は、同項の許可を受ける必要がある。","choice_2":"自己の所有する面積4 アールの農地を農作物の育成又は養畜の事業のための農業用施設に転用する場合は、法第4 条第1 項の許可を受ける必要はない。","choice_3":"法第3 条第1 項又は法第5 条第1 項の許可が必要な農地の売買について、これらの許可を受けずに売買契約を締結しても、その所有権の移転の効力は生じない。","choice_4":"社会福祉事業を行うことを目的として設立された法人（社会福祉法人）が、農地をその目的に係る業務の運営に必要な施設の用に供すると認められる場合、農地所有適格法人でなくても、農業委員会の許可を得て、農地の所有権を取得することができる。","official_accepted_answers":"2","answer_conclusion":"《自己農地の農業用施設への転用》の許可不要特例は面積要件があり、4アールは超えています。","answer_reason":"《==自己農地の農業用施設への転用==》の許可[[WARN:不要]]特例は面積要件があり、4アールは超えています。","scoring_exception_note":"","deep_lecture":"農地法3条＝権利移動、4条＝自己転用、5条＝転用目的の権利移動。「そもそも許可不要となる取得原因」や公共性ある法人の例外も押さえます。\n\n【単元の見取り図・補足講義】農地法3条は農地の権利移動、4条は農地所有者による転用、5条は転用目的の権利移動を基本として分類する。 相続・特定遺贈・仮登記、農業用施設の面積、農地賃貸借の更新・解約などは一般原則に個別の例外がある。\n\n【本問の四肢を使った比較】【肢1：正しい方向の記述】正しい。相続での取得は農地法3条許可不要。相続人以外への特定遺贈による取得は原則許可が必要です。 【肢2：誤りを含む記述】誤り（正解肢）。耕作者が自己農地を農業用施設に転用するときの許可不要特例は2アール未満。4アール＝400㎡は対象外なので原則4条許可が必要です。 【肢3：正しい方向の記述】正しい。3条・5条許可が必要な農地の売買は、許可を得ない限り所有権移転の効力が生じません。 【肢4：正しい方向の記述】正しい。社会福祉法人などは、一定要件・許可のもとで農地所有適格法人でなくとも農地取得できる例外があります。\n\n【設問で判断を練習する】正解につながる肢の焦点は「自己の所有する面積4 アールの農地を農作物の育成又は養畜の事業のための農業用施設に転用する…」。誤り（正解肢）。耕作者が自己農地を農業用施設に転用するときの許可不要特例は2アール未満。4アール＝400㎡は対象外なので原則4条許可が必要です。一方、「相続により農地を取得する場合は」を論じる肢では「正しい。相続での取得は農地法3条許可不要。相続人以外への特定遺贈による取得は原則許可が必要です」という別の結論が問題となる。","system_purpose":"【学習補助】農地法総合の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:相続・特定遺贈・仮登記、農業用施設]]の面積、農地賃貸借の更新・解約などは一般原則に個別の例外がある。","comparative_explanation":"【本問で混同しやすい区別】相続・特定遺贈・仮 れか。なお、この問において「事後届出」とは、国土利用計画法第23 条の届出をいい、「重要土地等調査法」とは、重要施設周辺及び国境離島等における土地等の利用状況の調査及び利用の規制等に関する法律をいうものとする。","choice_1":"都市計画区域外において、国から一団の土地である6,000 m2 と5,000 m2 の土地を購入した者は、事後届出を行う必要はない。","choice_2":"市街化区域を除く都市計画区域内において、Ａが所有する7,000 m2 の土地をＢが相続により取得した場合、Ｂは事後届出を行う必要がある。","choice_3":"市街化区域において、Ｃが所有する3,000 m2 の土地をＤが購入する契約を締結した場合、Ｃ及びＤは事後届出を行わなければならない。","choice_4":"重要土地等調査法の規定による特別注視区域内にある100 m2 の規模の土地に関する所有権又はその取得を目的とする権利の移転をする契約を締結する場合には、当事者は、一定の事項を、あらかじめ、内閣総理大臣に届け出なければならない。","official_accepted_answers":"1","answer_conclusion":"《国からの土地取得》は国土利用計画法の事後届出対象外。土地面積だけで判定しないこと。","answer_reason":"《==国からの土地取得==》は国土利用計画法の事後届出対象外。土地面積だけで判定しないこと。","scoring_exception_note":"","deep_lecture":"国土法の事後届出は原則として市街化区域2,000㎡、その他の都市計画区域5,000㎡、区域外10,000㎡以上が目安。ただし権利移転の原因・相手方が国か等、届出除外も確認します。\n\n【単元の見取り図・補足講義】国土利用計画法の事後届出は面積区分と土地取得者をまず見る。市街化区域、その他都市計画区域、区域外で面積基準が異なる。 相続や国等からの取得、交換などの取引態様と、監視区域・注視区域の事前届出を区別する。\n\n【本問の四肢を使った比較】【肢1：正しい方向の記述】正しい。国からの取得は、面積が基準を超えていても法定の届出除外事由に当たります。 【肢2：誤りを含む記述】誤り。相続は対価を伴う土地売買等の契約ではなく、原則事後届出の対象ではありません。 【肢3：誤りを含む記述】誤り。事後届出義務を負うのは原則土地取得者側。売主・買主の双方に同じ事後届出義務が生じるわけではありません。 【肢4：誤りを含む記述】誤り。特別注視区域の届出要件・面積基準は法律に定められ、100㎡なら必ず届出という記述は誤りです。\n\n【設問で判断を練習する】正解につながる肢の焦点は「都市計画区域外において、国から一団の土地である6,000 m2 と5,000 m2 の土地…」。正しい。国からの取得は、面積が基準を超えていても法定の届出除外事由に当たります。一方、「重要土地等調査法の規定による特別注視区域内にある100 m2 の規模の土地に関する所有権又…」を論じる肢では「誤り。特別注視区域の届出要件・面積基準は法律に定められ、100㎡なら必ず届出という記述は誤りです」という別の結論が問題となる。","system_purpose":"【学習補助】届出の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:相続や国等からの取得、交換などの取]]引態様と、監視区域・注視区域の事前届出を区別する。","comparative_explanation":"【本問で混同しやすい区別】相続や国等からの取得、交換などの取引態様と、監視区域・注視区域の事前届出を区別する。","important_points":"《売買等の契約・土地取得者》／《国からの取得や相続は除外》／《面積基準2千・5千・1万㎡》。","trick_patterns":"[[WARN:重要土地等調査法は国土利用計画]]法と別制度。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《国からの土地取得》は国土利用計画法の事後届出対象外。土地面積だけで判定しないこと。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. Ｂが土地の譲渡契約書を3 通作成し、Ａ、Ｂ及び仲介人Ｃがそれぞれ1 通ずつ保存する場合、当該契約書3 通には印紙税が課される。","choice_2":"一の契約書に土地の譲渡契約（譲渡金額5,000 万円）と建物の建築請負契約（請負金額6,000 万円）をそれぞれ区分して記載した場合、印紙税の課税標準となる当該契約書の記載金額は1 億1,000 万円である。","choice_3":"「Ｄの所有する甲土地（時価2,000 万円）をＥに贈与する」旨を記載した贈与契約書を作成した場合、印紙税の課税標準となる当該契約書の記載金額は、2,000 万円である。","choice_4":"当初作成の「土地を1 億円で譲渡する」旨を記載した土地譲渡契約書の契約金額を変更するために作成する契約書で、「当初の契約書の契約金額を1,000 万円減額し、9,000 万円とする」旨を記載した変更契約書について、印紙税の課税標準となる当該変更契約書の記載金額は、1,000 万円である。","official_accepted_answers":"1","answer_conclusion":"《印紙税》では契約書原本を3通作れば、保存者が仲介人でも3通それぞれ課税文書となり得ます。","answer_reason":"《==印紙税==》では契約書原本を3通作れば、保存者が仲介人でも3通それぞれ課税文書となり得ます。","scoring_exception_note":"","deep_lecture":"課税は「契約の内容」と「作成された課税文書」の両方で判断します。複数契約の併記と、変更契約書の増額・減額とでは取り扱いが変わります。\n\n【単元の見取り図・補足講義】印紙税は課税文書の作成に課され、同一取引でも課税文書の原本が複数あればそれぞれ課税対象になり得る。 不動産譲渡・請負の兼用文書、贈与・減額変更契約の記載金額は単純合算しない。\n\n【本問の四肢を使った比較】【肢1：正しい方向の記述】正しい。土地譲渡の課税契約書を3通作り、各当事者等がそれぞれ保有すれば、原本として作られた3通が課税対象です。 【肢2：誤りを含む記述】誤り。土地売買契約と請負契約が一書面に併記されても、記載金額は機械的に5,000万＋6,000万とはしません。契約書の所属・記載金額ルールを確認します。 【肢3：誤りを含む記述】誤り。贈与契約書に土地の時価を記しても、譲渡対価としての記載金額にはなりません。 【肢4：誤りを含む記述】誤り。契約金額の減額のみを記載した変更契約書では、減額部分の1,000万円をそのまま課税上の記載金額にするわけではありません。\n\n【設問で判断を練習する】正解につながる肢の焦点は「売主Ａと買主Ｂが土地の譲渡契約書を3 通作成し」。正しい。土地譲渡の課税契約書を3通作り、各当事者等がそれぞれ保有すれば、原本として作られた3通が課税対象です。一方、「当初作成の「土地を1 億円で譲渡する」旨を記載した土地譲渡契約書の契約金額を変更するために…」を論じる肢では「誤り。契約金額の減額のみを記載した変更契約書では、減額部分の1,000万円をそのまま課税上の記載金額にするわけではあり…」という別の結論が問題となる。","system_purpose":"【学習補助】印紙税の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:不動産譲渡・請負の兼用文書、贈与]]・減額変更契約の記載金額は単純合算しない。","comparative_explanation":"【本問で混同しやすい区別】不動産譲渡・請負の兼用文書、贈与・減額変更契約の記載金額は単純合算しない。","important_points":"《原本3通＝原則3通課税》／《贈与の時価は譲渡対価ではない》／《減額変更は別ルール》。\n【判定の軸】不動産譲渡・請負の兼用文書、贈与・減額変更契約の記載金額は単純合算しない。","trick_patterns":"コピーと独立した原本を[[WARN:混同]]しない。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《印紙税》では契約書原本を3通作れば、保存者が仲介人でも3通それぞれ課税文書となり得ます。","review_check_questions":" UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"不動産取得税に関する次の記述のうち、正しいものはどれか。","choice_1":"不動産取得税の徴収については、特別徴収の方法によることができる。","choice_2":"不動産取得税は、目的税である。","choice_3":"不動産取得税は、不動産の取得に対し、当該不動産所在の市町村及び特別区において、当該不動産の取得者に課する。","choice_4":"不動産取得税は、市町村及び特別区に対して、課することができない。","official_accepted_answers":"4","answer_conclusion":"《不動産取得税》は原則都道府県の普通税。市町村・特別区は課税対象ではありません。","answer_reason":"《==不動産取得税==》は原則都道府県の普通税。市町村・特別区は課税対象ではありません。","scoring_exception_note":"","deep_lecture":"不動産取得税は「都道府県税」「取得時に一度」「相続取得などは非課税」「住宅・土地等の軽減制度」の組合せで押さえます。\n\n【単元の見取り図・補足講義】不動産取得税は不動産取得を契機として都道府県が課する普通税。課税標準は通常、取得時の不動産評価額を基礎とする。 免税点は土地・新築家屋・その他家屋で異なる。売買代金と評価額、税率の本則と時限特例を区別する。\n\n【本問の四肢を使った比較】【肢1：誤りを含む記述】誤り。不動産取得税は原則普通徴収によって課税され、特別徴収を利用できるとする記述は誤りです。 【肢2：誤りを含む記述】誤り。不動産取得税は目的税ではなく普通税です。都市計画税などと区別します。 【肢3：誤りを含む記述】誤り。不動産取得税の課税主体は原則不動産所在の都道府県で、市町村・特別区ではありません。 【肢4：正しい方向の記述】正しい。市町村や特別区が取得する不動産については非課税となります。\n\n【設問で判断を練習する】正解につながる肢の焦点は「不動産取得税は、市町村及び特別区に対して、課することができない」。正しい。市町村や特別区が取得する不動産については非課税となります。一方、「不動産取得税の徴収については」を論じる肢では「誤り。不動産取得税は原則普通徴収によって課税され、特別徴収を利用できるとする記述は誤りです」という別の結論が問題となる。","system_purpose":"【学習補助】不動産取得税の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:免税点は土地・新築家屋・その他家屋]]で異なる。売買代金と評価額、税率の本則と時限特例を区別する。","comparative_explanation":"【本問で混同しやすい区別】免税点は土地・新築家屋・その他家屋で異なる。売買代金と評価額、税率の本則と時限特例を区別する。","important_points":"《都道府県税》／《普通税》／《市町村・特別区には非課税》。\n【判定の軸】免税点は土地・新築家屋・その他家屋で異なる。売買代金と評価額、税率の本則と時限特例を区別する。","trick_patterns":"固定資産税・都市[[WARN:計画税と課税主体や納付時点を取り違え]]ない。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《不動産取得税》は原則都道府県の普通税。市町村・特別区は課税対象ではありません。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 4番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 免税点は土地・新築家屋・その他家屋で異なる。売買代金と評価額、税率の本則と時限特例を区別する。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_af on_note":"","deep_lecture":"不動産鑑定評価の3手法：原価法＝費用性、取引事例比較法＝市場性、収益還元法＝収益性。いずれも適用可能性・説得力を検討します。\n\n【単元の見取り図・補足講義】原価法は再調達原価から減価修正、取引事例比較法は事情・時点・地域等の補正、収益還元法は将来純収益の現在価値を用いる。 適合の原則と最有効使用の原則、同一需給圏と同一用途という別概念を取り違えない。\n\n【本問の四肢を使った比較】【肢1：誤りを含む記述】誤り。原価法は再調達原価を求めて減価修正する手法で、収益価格から比準価格を作る手法ではありません。 【肢2：誤りを含む記述】誤り。土地でも再調達原価を適切に求められる場合など、原価法が絶対に使えないわけではありません。 【肢3：誤りを含む記述】誤り。特殊事情があっても、その事情が把握でき適切に補正できる事例なら取引事例に採用することがあります。 【肢4：正しい方向の記述】正しい。同一需給圏の類似地域・代替競争不動産など、比較に適した取引事例があれば取引事例比較法は有効です。\n\n【設問で判断を練習する】正解につながる肢の焦点は「取引事例比較法は、近隣地域若しくは同一需給圏内の類似地域等において対象不動産と類似の不動産…」。正しい。同一需給圏の類似地域・代替競争不動産など、比較に適した取引事例があれば取引事例比較法は有効です。一方、「原価法は、価格時点における対象不動産の収益価格を求め」を論じる肢では「誤り。原価法は再調達原価を求めて減価修正する手法で、収益価格から比準価格を作る手法ではありません」という別の結論が問題となる。","system_purpose":"【学習補助】不動産鑑定評価の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:適合の原則と最有効使用の原則、同一]]需給圏と同一用途という別概念を取り違えない。","comparative_explanation":"【本問で混同しやすい区別】適合の原則と最有効使用の原則、同一需給圏と同一用途という別概念を取り違えない。","important_points":"《原価法＝再調達原価−減価修正》／《取引事例比較法＝類似取引と補正》／《収益還元法＝将来純収益》。","trick_patterns":"「[[WARN:土地には原価法が絶対使えない]]」は誤り。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《取引事例比較法》は類似物件の取引事例があると有効です。事情補正・時点修正で比較します。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 4番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 適合の原則と最有効使用の原則、同一需給圏と同一用途という別概念を取り違えない。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"国土交通省 [[NOTE:不動産鑑定評価基準]]","marker_yellow_spans":"取引事例比較法","marker_red_spans":"土地には原価法が絶対使えない","marker_blue_spans":"適合の原則と最有効使用の原則、同一","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","so "","deep_lecture":"宅建業法37条は、成立した売買・賃貸借等の契約内容を当事者間で明確化し、後日の争いを防ぐために書面を交付する制度です。2022年5月から、法定の要件を満たせば電磁的方法による提供が可能になりました。ただし紙をPDFに変えれば自動的に適法となるわけではありません。まず==相手方の承諾==が必要です。利用する電磁的方法やファイルの記録形式などを示し、あらかじめ相手方の承諾を得ます。次に、受け取った情報が==書面に出力できる==形式であることが求められます。さらに、受領後に内容が書き換えられていないか確認できるよう、電子署名等による==改変確認措置==が必要です。電子的な情報の真正性・保存性を確保するためです。加えて、37条書面に係る宅地建物取引士を明示する義務があります。イのように、承諾を取る際の通知文に宅建士を紹介しただけで、実際の電子提供時の表示を省略できるとは限りません。試験ではア○・イ×・ウ○・エ○の三つが正しいため、選択肢3が正解です。ここで35条の重要事項説明と37条書面を混同しないことも大切です。35条は契約成立前の説明、37条は契約成立後の契約内容の書面化が中心です。電子提供でも契約当事者の同意、形式、真正性の確保、取引士の明示をそれぞれ独立して確認します。","system_purpose":"紙の書面に代わる電子的な提供方法を認めながら、受領者が内容を保存・印刷し、改ざんされていないことを確認できる状態を確保する。","practical_examples":"例：宅建業者が売買契約締結後に37条書面をPDFで提供する場合、買主の事前承諾を得た上で、印刷可能で改変確認できる方式を用い、取引士を適切に明示する。","advanced_knowledge":"[[NOTE:国土交通省は電磁的方法による重要事]]項説明書等の提供に関し、IT環境への対応確認や到達確認等の留意事項を示しています。単なるファイル送信と法令上の提供要件を区別する。","comparative_explanation":"35条説明：契約成立前・判断材料を説明／37条書面：契約成立後・契約内容を確定記録／37条電子提供：承諾・出力可能・改変確認・宅建士明示が重要。","important_points":"==電子提供は相手方の承諾==／==書面出力可能==／==改変有無の確認措置==／提供時の宅建士明示を省略しない。","trick_patterns":"[[WARN:承諾通知で取引士を示したから十分]]という誤り。[[WARN:電子化すれば形式は自由]]という誤り。","memory_summary":"ア○イ×ウ○エ○。承諾、書面出力、改変確認、宅建士明示は別々に確認する。","review_check_questions":"Q 電磁的方法で37条書面を出す前に必要なのは？ A 相手方の承諾。\nQ 改変確認は必要？ A 必要。\nQ 正しいものは何個？ A 三つ。","substatement_reasoning":"ア○：相手方の事前承諾を受ける必要がある。\nイ×：承諾取得通知に宅建士が記されていても、提供時の宅建士の明示を省略できない。\nウ○：受け取った情報を印刷して書面を作成できる形式が必要。\nエ○：電子署名等により記載事項が改変されていないか確認できる措置が必要。\n正しいのはア・ウ・エの三つ。","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"宅建業法37条、国土交通省電子書面化資料 https://www.mlit.go.jp/report/press/tochi_fudousan_kensetsugyo16_hh_000001_00036.html","marker_yellow_spans":"相手方の承諾|書面に出力できる|改変確認措置|電子提供は相手方の承諾|書面出力可能|改変有無の確認措置","marker_red_spans":"承諾通知で取引士を示したから十分|電子化すれば形式は自由","marker_blue_spans":"国土交通省は電磁的方法による重要事","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R5_qestion_answer%E3%80%80.pdf","choice_1_truth":"compound","choice_1_is_exam_answer":"false","choice_1_wrong_part":"一つ","choice_1_reason":"誤り。ア〜エのうち、正しい記述は一つではなく三つです。アは電子提供に相手方の承諾を必要とする点で正しく、ウの出力可能なファイル形式、エの改変の有無を確認できる措置も正しい要件です。イだけが、承諾取得通知の段階で宅建士を明示すれば提供時の明示まで省けるとする点で誤りです。したがって「一つ」という選択肢は選べません。","choice_1_corrected_statement":"正しい記述はア・ウ・エの三つである。","choice_1_legal_basis":"宅建業法37条・施行令3条の4・施行規則の電子提供基準","choice_1_exam_tip":"[[WARN:承諾通知で取引士を示したから十分]]という誤り。[[WARN:電子化すれば形式は自由]]という誤り。","choice_2_truth":"compound","choice_2_is_exam_answer":"false","choice_2_wrong_part":"二つ","choice_2_reason":"誤り。二つという数え方では、ア・ウ・エの三要素のうち一つを見落としています。37条書面を電磁的方法で提供するには、相手方の事前承諾が必要となるほか、相手方が内容を確認し保存できるように出力可能な形式を採用し、改変有無の確認措置も必要になります。電子化したからといって、書面交付時に求められる情報の信用性や関係者の明示が不要になるわけではありません。","choice_2_corrected_statement":"正しい記述はア・ウ・エの三つである。","choice_2_legal_basis":"宅建業法37条・施行令3条の4・施行規則の電子提供基準","choice_2_exam_tip":"[[WARN:承諾通知で取引士を示したから十分]]という誤り。[[WARN:電子化すれば形式は自由]]という誤り。","choice_3_truth":"compound","choice_3_is_exam_answer":"true","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい。ア○、イ×、ウ○、エ○と判定され、正しい記述は三つです。電子提供における承諾（ア）、書面への出力可能性（ウ）、改変の有無を確認できる措置（エ）はいずれも相手方保護の要件です。他方、イのように承諾取得用の通知に宅建士を示したというだけでは、37条書面に係る宅建士を電子提供の際に明示する要請を満たしたことにはなりません。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"宅建業法37条・施行令3条の4・施行規則の電子提供基準","choice_3_exam_tip":"[[WARN:承諾通知で取引士を示したから十分]]という誤り。[[WARN:電子化すれば形式は自由]]という誤り。","choice_4_truth":"compound","choice_4_is_exam_answer":"false","choice_4_wrong_part":"四つ","choice_4_reason":"誤り。四つと数えるためにはイも正しい必要があります。しかし、電子提供についての事前承諾と、電子提供される37条書面に記載・明示すべき事項は別の問題です。承諾取得時の案内に宅建士名があっても、提供データ側で必要な宅建士の明示を省略できません。ア・ウ・エは正しく、イのみ誤りなので四つにはなりません。\nこの選択肢に並ぶ「四つ」は、複数の記述の正誤を整理してから照合する解答候補である。記述自体の真偽ではなく、設問が求める組合せ又は個数との一致を確認する必要がある。【理解を深める】宅建業法37条は、成立した売買・賃貸借等の契約内容を当事者間で明確化し、後日の争いを防ぐために書面を交付する制度です。2022年5月から、法定の要件を満たせば電磁的方法による提供が可能になりました。ただし紙をPDFに変えれば自動的に適法となるわけではありません。まず相手方の承諾が必要です。\n比較する肢1は「一つ」。","choice_4_corrected_statement":"正しい記述はア・ウ・エの三つである。","choice_4_legal_basis":"宅建業法37条・施行令3条の4・施行規則の電子提供基準","choice_4_exam_tip":"[[WARN:承諾通知で取引士を示したから十分]]という誤り。[[WARN:電子化すれば形式は自由]]という誤り。"},{"question_id":"2023-Q27","year":2023,"session":"通常","question_no":27,"major_field":"宅建業法","section":"宅地建物取引業法","unit":"報酬","topic":"報酬の制限","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"宅地建物取引業法第34 条の2 第1 項第4 号に規定する建物状況調査（以下この問において「建物状況調査」という。）に関する次の記述のうち、誤っているものはどれか。","choice_1":"建物状況調査とは、建物の構造耐力上主要な部分又は雨水の浸入を防止する部分として国土交通省令で定めるものの状況の調査であって、経年変化その他の建物に生じる事象に関する知識及び能力を有する者として国土交通省令で定める者が実施するものをいう。","choice_2":"宅地建物取引業者が建物状況調査を実施する者のあっせんを行う場合、建物状況調査を実施する者は建築士法第2 条第1 項に規定する建築士であって国土交通大臣が定める講習を修了した者でなければならない。","choice_3":"既存住宅の売買の媒介を行う宅地建物取引業者が売主に対して建物状況調査を実施する者のあっせんを行った場合、宅地建物取引業者は売主から報酬とは別にあっせんに係る料金を受領することはできない。","choice_4":"既存住宅の貸借の媒介を行う宅地建物取引業者は、宅地建物取引業法第37 条の規定により交付すべき書面に建物の構造耐力上主要な部分等の状況について当事者の双方が確認した事項を記載しなければならない。","official_accepted_answers":"4","answer_conclusion":"《建物状況調査》の結果説明・媒介契約・37条書面の記載は、売買と賃貸で義務が異なります。","answer_reason":"《==建物状況調査==》の結果説明・媒介契約・37条書面の記載は、売買と賃貸で義務が異なります。","scoring_exception_note":"","deep_lecture":"建物状況調査では、①媒介契約時のあっせんの有無、②重要事項説明時の結果概要、③契約成立後の書面記載と役割が異なります。賃貸・売買の適用範囲まで確かめます。\n\n【単元の見取り図・補足講義】宅建業者の報酬は国土交通大臣告示の上限があり、売買・交換・貸借で計算構造が異なる。 双方から受領できる場合でも総額上限を確認する。低廉な空家等の特例など、改正時期・適用条件に注意する。\n\n【本問の四肢を使った比較】【肢1：正しい方向の記述】正しい。建物状況調査は構造耐力上主要な部分・雨水の侵入を防止する部分等を専門的に調査するものです。 【肢2：正しい方向の記述】正しい。国土交通大臣の定める講習を修了した建築士など、所定の資格者による調査が必要です。 【肢3：正しい方向の記述】正しい。調査実施者をあっせんしただけで、法定媒介報酬とは別にあっせん料を徴収することは原則できません。 【肢4：誤りを含む記述】誤り（正解肢）。37条書面で建物の主要部分等の確認事項を記載する仕組みは既存建物の売買等についてのもので、賃貸媒介に本肢の記載義務が当然に生じるわけではありません。\n\n【設問で判断を練習する】正解につながる肢の焦点は「既存住宅の貸借の媒介を行う宅地建物取引業者は」。誤り（正解肢）。37条書面で建物の主要部分等の確認事項を記載する仕組みは既存建物の売買等についてのもので。一方、「建物状況調査とは、建物の構造耐力上主要な部分又は雨水の浸入を防止する部分として国土交通省令…」を論じる肢では「正しい。建物状況調査は構造耐力上主要な部分・雨水の侵入を防止する部分等を専門的に調査するものです」という別の結論が問題となる。","system_purpose":"【学習補助】報酬の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:双方から受領できる場合でも総額上限]]を確認する。低廉な空家等の特例など、改正時期・適用条件に注意する。","comparative_explanation":"【本問で混同しやすい区別】双方から受領できる場合でも総額上限を確認する。低廉な空家等の特例など、改正時期・適用条件に注意する。","important_points":"《建物状況調査＝既存住宅の状態確認》／《賃貸と売買の記載義務は別》。\n【判定の軸】双方から受領できる場合でも総額上限を確認する。低廉な空家等の特例など、改正時期・適用条件に注意する。","trick_patterns":"建物状況調査の「[[WARN:実施]]」と「実施者のあっせん」を混同しない。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《建物状況調査》の結果説明・媒介契約・37条書面の記載は、売買と賃貸で義務が異なります。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 4番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 双方から受領できる場合でも総額上限を確認する。低廉な空家等の特例など、改正時期・適用条件に注意する。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"[[NOTE:宅地建物取引業法34条の2]]・35条・37条","marker_yellow_spans":"建物状況調査","marker_red_spans":"実施","marker_blue_spans":"双方から受領できる場合でも総額上限","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R5_qestion_answer%E3%80%80.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"false","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。建物状況調査は構造耐力上主要な部分・雨水の侵入を防止する部分等を専門的に調査するものです。\n原文の「建物状況調査とは、建物の構造耐力上主要な部分又は雨水の浸入を防止する部分として国土交通省令…」にある条件が、正誤の判断を左右する。【理解を深める】宅建業者の報酬は国土交通大臣告示の上限があり、売買・交換・貸借で計算構造が異なる。\n比較対象の肢2では「宅地建物取引業者が建物状況調査を実施する者のあっせんを行う場合」が論点となる。正しい。国土交通大臣の定める講習を修了した建築士など、所定の資格者による調査が必要です。","choice_1_corrected_statement":"原文どおりで正しい","choice_1_legal_basis":"肢別の法令照合待ち。関連出典：宅地建物取引業法 わけではありません。","choice_4_legal_basis":"肢別の法令照合待ち。関連出典：宅地建物取引業法34条の2・35条・37条","choice_4_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。37条書面で建物の主要部分等の確認事項を記載する仕組みは既存建物の売買等についてのもので、賃貸媒介に本肢の記載義務が当然に生じるわけではありません。 具体的な要件は出題当時の関連条文で確認する。"},{"question_id":"2023-Q28","year":2023,"session":"通常","question_no":28,"major_field":"宅建業法","section":"宅地建物取引業法","unit":"業務上の禁止行為","topic":"再勧誘・不実告知・迷惑勧誘と37条書面","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"count_false","question_text":"宅地建物取引業者Ａの業務に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定に違反するものはいくつあるか。ア　Ａの従業員Ｂが、Ｃが所有する戸建住宅の買取りを目的とした訪問勧誘をＣに対して行ったところ、Ｃから「契約の意思がないので今後勧誘に来ないでほしい」と言われたことから、後日、Ａは、別の従業員Ｄに同じ目的で訪問勧誘を行わせて、当該勧誘を継続した。イ　Ａの従業員Ｅは、Ｆが所有する戸建住宅の買取りを目的とした電話勧誘をＦに対して行った際に、不実のことと認識しながら「今後5 年以内にこの一帯は再開発されるので、急いで売却した方がよい。」と説明した。ウ　Ａの従業員Ｇは、Ｈが所有する戸建住宅の買取りを目的とした電話勧誘をＨに対して行おうと考え、23 時頃にＨの自宅に電話をかけ、勧誘を行い、Ｈの私生活の平穏を害し、Ｈを困惑させた。エ　Ａは、Ｊとの間でＪが所有する戸建住宅を買い取る売買契約を締結し、法第37 条の規定に基づく書面をＪに交付したが、Ａの宅地建物取引士に、当該書面に記名のみさせ、押印させることを省略した。","choice_1":"一つ","choice_2":"二つ","choice_3":"三つ","choice_4":"四つ","official_accepted_answers":"3","answer_conclusion":"《しつこい再勧誘・不実告知・深夜の迷惑勧誘》は違反。37条書面の押印省略は違反ではありません。","answer_reason":"《==しつこい再勧誘・不実告知・深夜の迷惑勧誘==》は違反。37条書面の押印省略は違反ではありません。","scoring_exception_note":"","deep_lecture":"ア＝違反（拒絶後の再勧誘）、イ＝違反（不実告知）、ウ＝違反（迷惑な時刻の勧誘）、エ＝適法（記名で足りる）。物件を買い取る勧誘にも違反規制が及びます。\n\n【単元の見取り図・補足講義】不実告知、断定的判断の提供、しつこい再勧誘などの禁止は取引の公正を守るための規制。 禁止の主体・相手方・事実関係・例外を含めて一つずつ判定する。\n\n【本問の四肢を使った比較】【肢1：選択肢の構成要素の検討が必要】誤り。違反行為は1つではなく3つです。再勧誘・不実告知・深夜の迷惑勧誘が各々問題になります。 【肢2：選択肢の構成要素の検討が必要】誤り。違反行為は2つではなく3つです。ア・イ・ウが違反となります。 【肢3：選択肢の構成要素の検討が必要】正しい（正解肢）。ア・イ・ウが違反で計3つ。エの宅建士の記名のみ（押印なし）は違反ではありません。 【肢4：選択肢の構成要素の検討が必要】誤り。4つ目のエは違反ではありません。37条書面の宅建士の押印要件は廃止されています。\n\n【本問の判断を再現する】まず「三つ」という解答肢の番号を暗記するのではなく、本文中のア・イ・ウ等の命題ごとに、適法性・正誤・個数を判定する。正しい（正解肢）。ア・イ・ウが違反で計3つ。エの宅建士の記名のみ（押印なし）は違反ではありません。その上で「一つ」という別の組合せと照合し、正しい構成要素の集合が一致するものを選ぶ。組合せ選択肢自体は法文の真偽を述べる文章ではないため、構成要素と解答番号を混同しない。","system_purpose":"【学習補助】業務上の禁止行為の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本 規定に違反したことにより罰金の刑に処せられたとしても、Ｃの免許は取り消されることはない。","choice_4":"宅地建物取引業者Ｄ社の非常勤の取締役が、刑法第222 条（脅迫）の罪を犯したことにより罰金の刑に処せられたとしても、Ｄ社の免許は取り消されることはない。","official_accepted_answers":"2","answer_conclusion":"《免許欠格事由》では、刑の種類と罪名、役員・政令使用人かを分けて判断します。","answer_reason":"《==免許欠格事由==》では、刑の種類と罪名、役員・政令使用人かを分けて判断します。","scoring_exception_note":"","deep_lecture":"免許欠格は原則、一定の拘禁刑以上か、宅建業法違反・暴行・脅迫など特定の罰金刑かで判断。取締役・政令使用人に欠格者がいる場合、法人免許にも影響します。\n\n【単元の見取り図・補足講義】宅建業法違反の監督処分には指示処分・業務停止処分・免許取消し等があり、行政上の処分と刑事罰は区別する。 公示・聴聞・処分権者・事実の重大さによって結論が変わる。違反があれば直ちに必ず免許取消しとなるわけではない。\n\n【本問の四肢を使った比較】【肢1：誤りを含む記述】誤り。支店代表者など政令で定める使用人が拘禁刑（当時の懲役等）に処せられると、免許欠格・取消しに関わります。道路交通法違反でも刑の種類が重要です。 【肢2：正しい方向の記述】正しい。所得税法違反で単に罰金刑となったことだけでは、宅建業法の列挙する特定犯罪による罰金欠格に当然該当しません。 【肢3：誤りを含む記述】誤り。宅地建物取引業法違反による罰金刑は免許欠格事由になり得ます。 【肢4：誤りを含む記述】誤り。脅迫罪により罰金刑となった役員は、列挙された罪の欠格事由に関わります。非常勤役員も役員です。\n\n【設問で判断を練習する】正解につながる肢の焦点は「宅地建物取引業者Ｂ社の取締役が」。正しい。所得税法違反で単に罰金刑となったことだけでは、宅建業法の列挙する特定犯罪による罰金欠格に当然該当しません。一方、「宅地建物取引業者Ａ社の使用人であって」を論じる肢では「誤り。支店代表者など政令で定める使用人が拘禁刑（当時の懲役等）に処せられると、免許欠格・取消しに関わります」という別の結論が問題となる。","system_purpose":"【学習補助】監督処分の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:公示・聴聞・処分権者・事実の重大さ]]によって結論が変わる。違反があれば直ちに必ず免許取消しとなるわけではない。","comparative_explanation":"【本問で混同しやすい区別】公示・聴聞・処分権者・事実の重大さによって結論が変わる。違反があれば直ちに必ず免許取消しとなるわけではない。","important_points":"《刑の種類》×《罪名》×《誰が処罰されたか》。\n【判定の軸】公示・聴聞・処分権者・事実の重大さによって結論が変わる。違反があれば直ちに必ず免許取消しとなるわけではない。","trick_patterns":"「[[WARN:罰金ならすべて免許取消し]]」も「罰金は軽いから無関係」も誤り。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《免許欠格事由》では、刑の種類と罪名、役員・政令使用人かを分けて判断します。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 2番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 公示・聴聞・処分権者・事実の重大さによって結論が変わる。違反があれば直ちに必ず免許取消しとなるわけではない。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_so とができない。","choice_1":"一つ","choice_2":"二つ","choice_3":"三つ","choice_4":"四つ","official_accepted_answers":"1","answer_conclusion":"《営業保証金》の供託届出前には事業開始不可。正しい記述はイだけで1つです。","answer_reason":"《==営業保証金==》の供託届出前には事業開始不可。正しい記述はイだけで1つです。","scoring_exception_note":"","deep_lecture":"ア×：催告開始の時期を誤る。イ○：供託＋届出後に事業開始。ウ×：不足額供託・届出に法定のより短い期限。エ×：取戻し公告期間は原則6か月以上で3か月ではない。\n\n【単元の見取り図・補足講義】営業保証金は取引の相手方を保護する制度。供託場所・額・事務所増設時の追加供託、有価証券の評価が出題される。 宅地建物取引業保証協会の弁済業務保証金分担金と、業者自身が供託する営業保証金のしくみを混同しない。\n\n【本問の四肢を使った比較】【肢1：選択肢の構成要素の検討が必要】正しい（正解肢）。ア×、イ○、ウ×、エ×で正しい記述は1つ。営業保証金の供託届出をした後でなければ営業を開始できません。 【肢2：選択肢の構成要素の検討が必要】誤り。正しい記述は2つありません。ウの不足供託後の届出期限は30日ではありません。 【肢3：選択肢の構成要素の検討が必要】誤り。正しい記述は3つではありません。免許後6か月経過を催告起点とするアの記述などに誤りがあります。 【肢4：選択肢の構成要素の検討が必要】誤り。すべて正しいわけではありません。営業保証金取戻し公告期間のエにも誤りがあります。\n\n【本問の判断を再現する】まず「一つ」という解答肢の番号を暗記するのではなく、本文中のア・イ・ウ等の命題ごとに、適法性・正誤・個数を判定する。正しい（正解肢）。ア×、イ○、ウ×、エ×で正しい記述は1つ。営業保証金の供託届出をした後でなければ営業を開始できません。その上で「四つ」という別の組合せと照合し、正しい構成要素の集合が一致するものを選ぶ。組合せ選択肢自体は法文の真偽を述べる文章ではないため、構成要素と解答番号を混同しない。","system_purpose":"【学習補助】保証協会の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:宅地建物取引業保証協会の弁済業務保]]証金分担金と、業者自身が供託する営業保証金のしくみを混同しない。","comparative_explanation":"【本問で混同しやすい区別】宅地建物取引業保証協会の弁済業務保証金分担金と、業者自身が供託する営業保証金のしくみを混同しない。","important_points":"《供託＋届出後に営業開始》／《営業保証金取戻し公告＝原則6か月以上》。\n【判定の軸】宅地建物取引業保証協会の弁済業務保証金分担金と、業者自身が供託する営業保証金のしくみを混同しない。","trick_patterns":"営業保証金（本店1,000万＋従たる事務所500万）と保証協会の分担金を[[WARN:混同]]しない。","memory_summary":"《営業保証金》の供託届出前には事業開始不可。正しい記述はイだけで1つです。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 1番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 宅地建物取引業保証協会の弁済業務保証金分担金と、業者自身が供託する営業保証金のしくみを混同しない。","substatement_reasoning":"構成要素の正誤判定は未照合です。既存解説は組合せの選択肢に対する説明であり、ア〜エ等の独立検証ではありません。","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"[[NOTE:宅地建物取引業法25条] 広告にも及びます。 【肢4：正しい方向の記述】正しい。著しく事実と違う表示など誇大広告は禁止され、監督処分に加えて刑事罰の対象になることがあります。\n\n【設問で判断を練習する】正解につながる肢の焦点は「販売する宅地又は建物の広告に関し」。正しい。著しく事実と違う表示など誇大広告は禁止され、監督処分に加えて刑事罰の対象になることがあります。一方、「宅地又は建物の売買に関する注文を受けたときは」を論じる肢では「誤り。広告で取引態様を示していても、注文を受けたときに遅滞なく取引態様を明らかにする義務は別にあります」という別の結論が問題となる。","system_purpose":"【学習補助】広告規制の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:契約可能時期と広告可能時期は別]]。開発許可等の処分を受ける前に広告できるかは宅建業法33条を確認する。","comparative_explanation":"【本問で混同しやすい区別】契約可能時期と広告可能時期は別。開発許可等の処分を受ける前に広告できるかは宅建業法33条を確認する。","important_points":"《誇大広告NG》／《広告時＋注文時の取引態様明示》／《建築確認前広告NG》。\n【判定の軸】契約可能時期と広告可能時期は別。開発許可等の処分を受ける前に広告できるかは宅建業法33条を確認する。","trick_patterns":"「[[WARN:売買だけ対象で賃貸は自由]]」という誤解を避ける。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《誇大広告》は監督処分だけでなく刑事罰の対象。取引態様の明示も重ねて必要です。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 4番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 契約可能時期と広告可能時期は別。開発許可等の処分を受ける前に広告できるかは宅建業法33条を確認する。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"[[NOTE:宅地建物取引業法32条]]・33条・34条","marker_yellow_spans":"誇大広告","marker_red_spans":"売買だけ対象で賃貸は自由","marker_blue_spans":"契約可能時期と広告可能時期は別","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R5_qestion_answer%E3%80%80.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"UNKNOWN","choice_1_reason":"誤り。広告で取引態様を示していても、注文を受けたときに遅滞なく取引態様を明らかにする義務は別にあります。\n原文の「宅地又は建物の売買に関する注文を受けたときは」という断定を、そのまま一般原則として受け入れてはいけない。未検証の修正文案では「広告で取引態様 ","topic":"35条・重要事項説明","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"宅地建物取引業法第35 条に規定する重要事項の説明に関する次の記述のうち、正しいものはどれか。","choice_1":"甲宅地を所有する宅地建物取引業者Ａが、乙宅地を所有する宅地建物取引業者ではない個人Ｂと、甲宅地と乙宅地の交換契約を締結するに当たって、Ｂに対して、甲宅地に関する重要事項の説明を行う義務はあるが、乙宅地に関する重要事項の説明を行う義務はない。","choice_2":"宅地の売買における当該宅地の引渡しの時期について、重要事項説明において説明しなければならない。","choice_3":"宅地建物取引業者が売主となる宅地の売買に関し、売主が買主から受領しようとする金銭のうち、買主への所有権移転の登記以後に受領するものに対して、宅地建物取引業法施行規則第16 条の4 に定める保全措置を講ずるかどうかについて、重要事項説明書に記載する必要がある。","choice_4":"重要事項説明書の電磁的方法による提供については、重要事項説明を受ける者から電磁的方法でよいと口頭で依頼があった場合、改めて電磁的方法で提供することについて承諾を得る必要はない。","official_accepted_answers":"1","answer_conclusion":"《35条説明》では宅建業者が自ら売主となる交換取引について説明する対象物件を確認します。","answer_reason":"《==35条説明==》では宅建業者が自ら売主となる交換取引について説明する対象物件を確認します。","scoring_exception_note":"","deep_lecture":"35条は原則契約成立前の重要事項説明、37条は契約成立後の契約内容書面。35条では宅建士が説明・取引士証提示、37条では宅建士の記名が求められます。\n\n【単元の見取り図・補足講義】宅地建物取引業法35条の重要事項説明は、契約の成立前に、宅建士が購入・賃借の判断に必要な情報を提供する制度。37条書面は契約成立後の内容確認書面。 説明者が宅建士であることと事務所の専任宅建士であることは別。対象物件の種類や取引形態に応じて説明事項が変わる。\n\n【本問の四肢を使った比較】【肢1：正しい方向の記述】正しい。宅建業者Aが自ら所有する甲宅地を非業者Bの乙宅地と交換する場合、Aは相手方Bに甲宅地の重要事項を説明します。B所有の乙宅地についてまでAが当然35条説明義務を負うわけではありません。 【肢2：誤りを含む記述】誤り。引渡時期は原則37条書面の記載事項であり、35条重要事項説明の一般的な必要説明事項ではありません。 【肢3：誤りを含む記述】誤り。保全措置に関する35条説明は、所有権移転登記後に受領する金銭すべてに及ぶものではありません。 【肢4：誤りを含む記述】誤り。電子交付には相手方の承諾取得等の要件があり、「口頭で希望した」だけで法定承諾手続きを省略できるわけではありません。","system_purpose":"【学習補助】重要事項説明の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:説明者が宅建士であることと事務所の]]専任宅建士であることは別。対象物件の種類や取引形態に応じて説明事項が変わる。","comparative_explanation":"【本問で混同しやすい区別】説明者が宅建士であることと事務所の専任宅建士であることは別。対象物件の種類や取引形態に応じて説明事項が変わる。","important_points":"《35条＝成立前・内容説明》／《37条＝成立後・書面交付》／《電子提供＝承諾要》。\n【判定の軸】説明者が宅建士であることと事務所の専任宅建士であることは別。対象物件の種類や取引形態に応じて説明事項が変わる。","trick_patterns":"35条と37条の記載事項を[[WARN:混同]]しない。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《35条説明》では宅建業 ":"UNKNOWN","question_type":"count_false","question_text":"宅地建物取引業者Ａ（消費税課税事業者）は貸主Ｂから建物の貸借の媒介の依頼を受け、宅地建物取引業者Ｃ（消費税課税事業者）は借主Ｄから建物の貸借の媒介の依頼を受け、ＢとＤとの間で、1 か月分の借賃を12 万円（消費税等相当額を含まない。）とする賃貸借契約（以下この問において「本件契約」という。）を成立させた場合における次の記述のうち、宅地建物取引業法の規定に違反するものはいくつあるか。ア　本件契約が建物を住居として貸借する契約である場合に、Ｃは、媒介の依頼を受けるに当たってＤから承諾を得ないまま、132,000 円の報酬を受領した。イ　ＡはＢから事前に特別な広告の依頼があったので、依頼に基づく大手新聞掲載広告料金に相当する額をＢに請求し、受領した。ウ　ＣはＤに対し、賃貸借契約書の作成費を、Ｄから限度額まで受領した媒介報酬の他に請求して受領した。エ　本件契約が建物を事務所として貸借する契約である場合に、報酬として、ＡはＢから132,000 円を、ＣはＤから132,000 円をそれぞれ受領した。","choice_1":"一つ","choice_2":"二つ","choice_3":"三つ","choice_4":"四つ","official_accepted_answers":"3","answer_conclusion":"《居住用建物の賃貸媒介報酬》には原則片側0.5か月分（承諾の例外）があり、通常書類作成費の二重取りも不可。違反は3つです。","answer_reason":"《==居住用建物の賃貸媒介報酬==》には原則片側0.5か月分（承諾の例外）があり、通常書類作成費の二重取りも不可。違反は3つです。","scoring_exception_note":"","deep_lecture":"ア：居住用の借主から承諾なく132,000円（1か月＋税）は超過。イ：特別依頼広告費は別途可。ウ：媒介業務の一部である通常の契約書作成費は媒介報酬に含まれる。エ：複数業者でも双方合計上限は原則1か月分＋税。\n\n【単元の見取り図・補足講義】宅建業者の報酬は国土交通大臣告示の上限があり、売買・交換・貸借で計算構造が異なる。 双方から受領できる場合でも総額上限を確認する。低廉な空家等の特例など、改正時期・適用条件に注意する。\n\n【本問の四肢を使った比較】【肢1：選択肢の構成要素の検討が必要】誤り。違反は1つではありません。ア・ウ・エの3つが違反となります。 【肢2：選択肢の構成要素の検討が必要】誤り。違反は2つではありません。居住用媒介の事前承諾と、双方合計限度の両方が論点です。 【肢3：選択肢の構成要素の検討が必要】正しい（正解肢）。ア×（承諾なし1か月分受領）、イ○（事前依頼特別広告費）、ウ×（通常書面作成費の二重請求）、エ×（双方で各1か月分受領）。違反3つです。 【肢4：選択肢の構成要素の検討が必要】誤り。特別な広告の依頼費用を依頼主から受け取るイまで違反に含めるのは誤りです。\n\n【本問の判断を再現する】まず「三つ」という解答肢の番号を暗記するのではなく、本文中のア・イ・ウ等の命題ごとに、適法性・正誤・個数を判定する。正しい（正解肢）。ア×（承諾なし1か月分受領）、イ○（事前依頼特別広告費）、ウ×（通常書面作成費の二重請求）、エ×（双方で各1か月分受領）。その上で「一つ」という別の組合せと照合し、正しい構成要素の集合が一致するものを選ぶ。組合せ選択肢自体は法文の真偽を述べる文章ではないため、構成要素と解答番号を混同しない。","system_purpose":"【学習補助】報酬の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:双方から受領できる場合でも総額上限]]を確認する。低廉な空家等の特例など、改正時期・適用条件に注意する。","comparative_explanation":"【本問で混同しやすい区別】双方から受領できる場合でも総額上限を確認する。低廉な空家等の特例など、改正時期・適用条件に注意する。","important_points":"《居住用＝事前承諾なし片側0.5か月分》／《双方合計1か月分》／《特別依頼広告費は例外》。","trick_patterns":"[[ ip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。違反は2つではありません。居住用媒介の事前承諾と、双方合計限度の両方が論点です。 具体的な要件は出題当時の関連条文で確認する。","choice_3_truth":"compound","choice_3_is_exam_answer":"true","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい（正解肢）。ア×（承諾なし1か月分受領）、イ○（事前依頼特別広告費）、ウ×（通常書面作成費の二重請求）、エ×（双方で各1か月分受領）。違反3つです。\nこの選択肢に並ぶ「三つ」は、複数の記述の正誤を整理してから照合する解答候補である。構成要素の正誤を確かめずに選択肢の番号だけで判断すると、正解と解説が食い違う原因になる。【理解を深める】居住用＝事前承諾なし片側0.5か月分／双方合計1か月分／特別依頼広告費は例外。\n比較する肢4は「四つ」。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"肢別の法令照合待ち。関連出典：宅建業法46条・国土交通大臣報酬告示","choice_3_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。ア×（承諾なし1か月分受領）、イ○（事前依頼特別広告費）、ウ×（通常書面作成費の二重請求）、エ×（双方で各1か月分受領）。違反3つです。 具体的な要件は出題当時の関連条文で確認する。","choice_4_truth":"compound","choice_4_is_exam_answer":"false","choice_4_wrong_part":"UNKNOWN","choice_4_reason":"誤り。特別な広告の依頼費用を依頼主から受け取るイまで違反に含めるのは誤りです。\nこの選択肢に並ぶ「四つ」は、複数の記述の正誤を整理してから照合する解答候補である。記述自体の真偽ではなく、設問が求める組合せ又は個数との一致を確認する必要がある。【理解を深める】ア：居住用の借主から承諾なく132,000円（1か月＋税）は超過。イ：特別依頼広告費は別途可。ウ：媒介業務の一部である通常の契約書作成費は媒介報酬に含まれる。エ：複数業者でも双方合計上限は原則1か月分＋税。\n比較する肢1は「一つ」。","choice_4_corrected_statement":"UNKNOWN","choice_4_legal_basis":"肢別の法令照合待ち。関連出典：宅建業法46条・国土交通大臣報酬告示","choice_4_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。特別な広告の依頼費用を依頼主から受け取るイまで違反に含めるのは誤りです。 具体的な要件は出題当時の関連条文で確認する。"},{"question_id":"2023-Q35","year":2023,"session":"通常","question_no":35,"major_field":"宅建業法","section":"宅地建物取引業法","unit":"クーリング・オフ","topic":"クーリング・オフ","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"宅地建物取引業者Ａが、自ら売主として、宅地建物取引業者ではない買主Ｂから宅地の買受けの申込みを受けた場合における宅地建物取引業法第37 条の2 の規定に基づくいわゆるクーリング・オフに関する次の記述のうち、正しいものはどれか。","choice_1":"Ａは、仮設テント張りの案内所でＢから買受けの申込みを受けた際、以後の取引について、その取引に係る書類に関してＢから電磁的方法で提供をすることについての承諾を得た場合、クーリング・オフについて電磁的方法で告げることができる。","choice_2":"Ａが、仮設テント張りの案内所でＢから買受けの申込みを受けた場合、Ｂは、クーリング・オフについて告げられた日から8 日以内に電磁的方法により当該申込みの撤回を申し出れば、申込みの撤回を行うことができる。","choice_3":"Ａが、Ａの事務所でＢから買受けの申込みを受けた場合、Ｂは、申込みの日から8 日以内に電磁的方法により当該申込みの撤回を申し出れば、申込みの撤回を行うことができる。","choice_4":"Ａが、売却の媒介を依頼している宅地建物取引業者Ｃの事務所でＢから買受けの申込みを受けた場合、Ｂは、申込みの日から8 日以内に書面により当該申込みの撤回を申し出ても、申込みの撤回を行うことができない。","official_accepted_answers":"4","answer_conclusion":"《クーリング・オフ》は申込場所で判断します。媒介業者の事務所で申し込んだ場合は原則対象外です。","answer_reason":"《==クーリング・オフ==》は申込場所で判断します。媒介業者の事務所で申し込んだ場合は原則対象外です。","scoring_exception_note":"","deep_lecture":"クーリング・オフは原則、宅建業者が自ら売主かつ買主が非業者で、申込場所が事務所等以外の場合に問題になります。「告知から8日」を覚える前に、対象となる場所を判定します。\n\n【単元の見取り図・補足講義】業者自ら売主で買主が非業者の取引について、申込み場所・契約場所と書面告知・期間・代金支払・引渡しを検討する。 宅建業者の事務所等での申込みかどうか、告知から8日、引渡しと代金支払完了の条件を区別する。\n\n【本問の四肢を使った比較】【肢1：誤りを含む記述】誤り。単に別の取引書類を電子交付することへの承諾があるだけでは、クーリング・オフ告知の電磁的方法の要件を満たしません。 【肢2：誤りを含む記述】誤り。2023年度の法令上、撤回等の通知方法は書面で行う必要があり、電磁的方法による撤回を当然に認める記述は誤りです。 【肢3：誤りを含む記述】誤り。業者Aの事務所で申込みを受けた場合、原則クーリング・オフ対象外です。8日以内ならいつでも撤回できるわけではありません。 【肢4：正しい方向の記述】正しい。売主側が売却媒介を依頼している宅建業者Cの事務所で申込みを受けた場合も、原則クーリング・オフできない場所に該当します。","system_purpose":"【学習補助】クーリング・オフの制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:宅建業者の事務所等での申込みかどう]]か、告知から8日、引渡しと代金支払完了の条件を区別する。","comparative_explanation":"【本問で混同しやすい区別】宅建業者の事務所等での申込みかどうか、告知から8日、引渡しと代金支払完了の条件を区別する。","important_points":"《売主業者・買主非業者》／《場所＝事務所等外》／《8日》。\n【判定の軸】宅建業者の事務所等での申込みかどうか、告知から8日、引渡しと代金支払完了の条件を区別する。","trick_patterns":"「[[WARN:契約した場所]]」ではなく申込みをした場所が重要となるケースがあります。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《クーリング・オフ》は申込場所で判断します。媒介業者の事務所で申し込んだ場合は原則対象外です。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 4番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 宅建業者の事務所等での申込みかどうか、告知から8日、引渡しと代金支払完了の条件を区別する。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"[[NOTE:宅地建物取引業法37条の2]]","marker_yellow_spans":"クーリング・オフ","marker_red_spans":"契約した場所","marker_blue_spans":"宅建業者の事務所等での申込みかどう","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合 ときの措置を法第34 条の2 第1 項の規定に基づく書面に記載しなければならない。","official_accepted_answers":"4","answer_conclusion":"《専任媒介契約》では購入申込の報告を勝手に省略できず、依頼者が他社で成約した場合の措置を書面に記載します。","answer_reason":"《==専任媒介契約==》では購入申込の報告を勝手に省略できず、依頼者が他社で成約した場合の措置を書面に記載します。","scoring_exception_note":"","deep_lecture":"一般媒介と専任媒介と専属専任媒介では自己発見取引の可否、報告頻度、レインズ登録期限が変わります。専任は「7日以内（休業日除く）」、専属専任は「5日以内（同）」が基本。\n\n【単元の見取り図・補足講義】媒介契約では一般・専任・専属専任で、依頼者の自己発見取引、指定流通機構登録、業務処理状況報告の義務が異なる。 媒介価額の意見の根拠、契約有効期間、レインズへの登録証明書、報告頻度をまとめて比較する。\n\n【本問の四肢を使った比較】【肢1：誤りを含む記述】誤り。購入申込みがあれば依頼者に報告する義務があり、仲介業者の判断で条件不一致だから通知不要とはできません。 【肢2：誤りを含む記述】誤り。建物状況調査実施者のあっせん有無は媒介契約書に記載する事項で、書面交付後に初めて確認すればよいわけではありません。 【肢3：誤りを含む記述】誤り。専任媒介の指定流通機構登録は契約締結後7日以内ですが、休業日数は算入しません。本肢の「休業日数を含め」が誤り。 【肢4：正しい方向の記述】正しい。依頼者が他の宅建業者の媒介・代理によって契約を成立させた場合の措置は、媒介契約書の記載事項です。\n\n【設問で判断を練習する】正解につながる肢の焦点は「Ａは、Ｂが他の宅地建物取引業者の媒介又は代理によって売買の契約を成立させたときの措置を法第…」。正しい。依頼者が他の宅建業者の媒介・代理によって契約を成立させた場合の措置は、媒介契約書の記載事項です。一方、「Ａは、当該中古住宅について購入の申込みがあったときは、遅滞なく」を論じる肢では「誤り。購入申込みがあれば依頼者に報告する義務があり、仲介業者の判断で条件不一致だから通知不要とはできません」という別の結論が問題となる。","system_purpose":"【学習補助】媒介契約の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:媒介価額の意見の根拠、契約有効期間]]、レインズへの登録証明書、報告頻度をまとめて比較する。","comparative_explanation":"【本問で混同しやすい区別】媒介価額の意見の根拠、契約有効期間、レインズへの登録証明書、報告頻度をまとめて比較する。","important_points":"《専任＝7日以内（休業日除外）》／《専属専任＝5日以内（休業日除外）》／《購入申込は報告》。","trick_patterns":"「[[WARN:契約日から7日]]」でも休業日を含めると誤り。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《専任媒介契約》では購入申込の報告を勝手に省略できず、依頼者が他社で成約した場合の措置を書面に記載します。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 4番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 媒介価額の意見の根拠、契約有効期間、レインズへの登録証明書、報告頻度をまとめて比較する。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"[[NOTE:宅地建物取引業法34条の2]]","marker_yellow_spans":"専任媒介契約","marker_re りで正しい","choice_4_legal_basis":"肢別の法令照合待ち。関連出典：宅地建物取引業法37条","choice_4_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。天災その他不可抗力による損害負担について定めがある場合、その内容は37条書面に記載します。 具体的な要件は出題当時の関連条文で確認する。"},{"question_id":"2023-Q44","year":2023,"session":"通常","question_no":44,"major_field":"宅建業法","section":"宅地建物取引業法","unit":"保証協会","topic":"弁済業務保証金・保証協会","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"宅地建物取引業保証協会（以下この問において「保証協会」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choice_1":"保証協会の社員は、自らが取り扱った宅地建物取引業に係る取引の相手方から当該取引に関する苦情について解決の申出が保証協会にあり、保証協会から関係する資料の提出を求められたときは、正当な理由がある場合でなければ、これを拒んではならない。","choice_2":"保証協会は、社員がその一部の事務所を廃止したことに伴って弁済業務保証金分担金を当該社員に返還しようとするときは、弁済業務保証金の還付請求権者に対し、一定期間内に認証を受けるため申し出るべき旨の公告を行わなければならない。","choice_3":"保証協会は、宅地建物取引業者の相手方から、社員である宅地建物取引業者の取り扱った宅地建物取引業に係る取引に関する損害の還付請求を受けたときは、直ちに弁済業務保証金から返還しなければならない。","choice_4":"保証協会は、手付金等保管事業について国土交通大臣の承認を受けた場合、社員が自ら売主となって行う宅地又は建物の売買で、宅地の造成又は建築に関する工事の完了前における買主からの手付金等の受領について、当該事業の対象とすることができる。","official_accepted_answers":"1","answer_conclusion":"《保証協会》は苦情処理に関して、社員に資料提出協力義務があります。","answer_reason":"《==保証協会==》は苦情処理に関して、社員に資料提出協力義務があります。","scoring_exception_note":"","deep_lecture":"保証協会には苦情解決、研修、弁済業務保証金などの法定業務があります。保証協会社員は一般の営業保証金制度ではなく弁済業務保証金分担金を納付します。\n\n【単元の見取り図・補足講義】営業保証金は取引の相手方を保護する制度。供託場所・額・事務所増設時の追加供託、有価証券の評価が出題される。 宅地建物取引業保証協会の弁済業務保証金分担金と、業者自身が供託する営業保証金のしくみを混同しない。\n\n【本問の四肢を使った比較】【肢1：正しい方向の記述】正しい。保証協会は取引相手方からの苦情について社員へ資料提出を求められ、社員は正当な理由なく拒めません。 【肢2：誤りを含む記述】誤り。社員が一部事務所を廃止し分担金の一部返還を受ける場合に、還付請求権者へ一律公告が必要というわけではありません。 【肢3：誤りを含む記述】誤り。弁済業務保証金からの弁済には原則保証協会の認証等の制度上の手続があり、申し出があれば直ちに返還するわけではありません。 【肢4：誤りを含む記述】誤り。手付金等保管事業の対象には一定の完成物件等の条件があり、本肢の工事完成前の取引まで当然に対象となるわけではありません。\n\n【設問で判断を練習する】正解につながる肢の焦点は「保証協会の社員は、自らが取り扱った宅地建物取引業に係る取引の相手方から当該取引に関する苦情…」。正しい。保証協会は取引相手方からの苦情について社員へ資料提出を求められ、社員は正当な理由なく拒めません。一方、「保証協会は、手付金等保管事業について国土交通大臣の承認を受けた場合」を論じる肢では「誤り。手付金等保管事業の対象には一定の完成物件等の条件があり、本肢の工事完成前の取引まで当然に対象となるわけではありま…」という別の結論が問題となる。","system_purpose":"【学習補助】保証協会の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目 保険加入等の義務を免れません。\n\n【設問で判断を練習する】正解につながる肢の焦点は「ＡＢ間の売買契約において、当該住宅の構造耐力上主要な部分に瑕 疵 があってもＡが瑕疵か し…」。正しい。住宅の構造耐力上主要な部分等の瑕疵担保責任を免責する特約があっても、資力確保のための供託または保険加入等の義務を免れません。一方、「Ａが信託会社又は金融機関の信託業務の兼営等に関する法律第1 条第1 項の認可を受けたか し…」を論じる肢では「誤り。信託会社や兼営金融機関としての業態だけで、宅建業者が新築住宅を売る際の資力確保義務が当然に免除されるわけではあり…」という別の結論が問題となる。","system_purpose":"【学習補助】担保責任特約の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:通知期間の特約で引渡しから2年以上]]とする場合など、民法の一般ルールと宅建業法の特則を分ける。","comparative_explanation":"【本問で混同しやすい区別】通知期間の特約で引渡しから2年以上とする場合など、民法の一般ルールと宅建業法の特則を分ける。","important_points":"《新築住宅》／《供託または保険》／《免責特約で資力確保義務は消えない》。\n【判定の軸】通知期間の特約で引渡しから2年以上とする場合など、民法の一般ルールと宅建業法の特則を分ける。","trick_patterns":"供託場所や情報提供方法を、一般の営業保証金の手続と[[WARN:混同]]しない。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《新築住宅の資力確保措置》は「瑕疵責任を負わない」との特約があっても免れません。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 4番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 通知期間の特約で引渡しから2年以上とする場合など、民法の一般ルールと宅建業法の特則を分ける。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"[[NOTE:住宅瑕疵担保履行法11条]]以下、住宅品質確保法95条","marker_yellow_spans":"新築住宅の資力確保措置","marker_red_spans":"混同","marker_blue_spans":"通知期間の特約で引渡しから2年以上","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R5_qestion_answer%E3%80%80.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"UNKNOWN","choice_1_reason":"誤り。信託会社や兼営金融機関としての業態だけで、宅建業者が新築住宅を売る際の資力確保義務が当然に免除されるわけではありません。\n原文の「Ａが信託会社又は金融機関の信託業務の兼営等に関する法律第1 条第1 項の認可を受けたか も富んでいる。","choice_2":"鉄筋コンクリート構造は、躯 体の断面が大きく、材料の質量が大きいので、建物の自重が大きくなる。","choice_3":"鉄筋コンクリート構造では、鉄筋とコンクリートを一体化するには、断面が円形の棒鋼である丸鋼の方が表面に突起をつけた棒鋼である異形棒鋼より、優れている。","choice_4":"鉄筋コンクリート構造は、コンクリートが固まって所定の強度が得られるまでに日数がかかり、現場での施工も多いので、工事期間が長くなる。","official_accepted_answers":"3","answer_conclusion":"《鉄筋コンクリート》のコンクリートは引張に弱く、鉄筋と組み合わせて補います。誤りは肢3です。","answer_reason":"《==鉄筋コンクリート==》のコンクリートは引張に弱く、鉄筋と組み合わせて補います。[[WARN:誤り]]は肢3です。","scoring_exception_note":"","deep_lecture":"RC＝コンクリートが圧縮力、鉄筋が引張力を主に分担。互いの付着・近い熱膨張特性により一体で働きます。鉄筋はコンクリートのかぶりで腐食・火災から守られます。\n\n【単元の見取り図・補足講義】ラーメン構造、ブレース構造、壁式構造などは力を支える部材・接合方法が異なる。 複数の耐震形式を併用する建物もあり「必ず一方式のみ」などの断定に注意する。\n\n【本問の四肢を使った比較】【肢1：正しい方向の記述】正しい。RC構造は地震・風などの外力に対し躯体として抵抗するため、構造設計・材料性能が重要です。 【肢2：正しい方向の記述】正しい。RC構造は部材断面が大きくなることが多く、建物の自重が増える点が構造上の特性です。 【肢3：誤りを含む記述】誤り（正解肢）。丸鋼よりも、表面に節・突起がある異形棒鋼の方がコンクリートとの付着力が高く、一体化に適しています。「丸鋼の方が優れる」が逆です。 【肢4：正しい方向の記述】正しい。コンクリートは所定の養生期間を経て固まり、規定の強度を発揮するよう適切に管理します。\n\n【設問で判断を練習する】正解につながる肢の焦点は「鉄筋コンクリート構造では、鉄筋とコンクリートを一体化するには」。誤り（正解肢）。丸鋼よりも、表面に節・突起がある異形棒鋼の方がコンクリートとの付着力が高く、一体化に適しています。「丸鋼の方が優れる」が逆です。一方、「鉄筋コンクリート構造は、地震や風の力を受けても、躯 体の変形は比較的小さく」を論じる肢では「正しい。RC構造は地震・風などの外力に対し躯体として抵抗するため、構造設計・材料性能が重要です」という別の結論が問題となる。","system_purpose":"【学習補助】5問免除・建物の制度は、関係する当事者・行政主体の権利義務と取引の安全を調整する。具体的な目的は各法令の趣旨を確認する。","practical_examples":"【事例で考える】本問と同じ取引条件を実務で検討するときは、行為者、対象、時期、例外事由を別々に確認する。具体的な適用要件は当該条文・公的解説を照合する。","advanced_knowledge":"【関連論点】[[NOTE:複数の耐震形式を併用する建物もあり]]「必ず一方式のみ」などの断定に注意する。","comparative_explanation":"【本問で混同しやすい区別】複数の耐震形式を併用する建物もあり「必ず一方式のみ」などの断定に注意する。","important_points":"《コンクリート＝圧縮に強い》／《鉄筋＝引張に強い》／《一体性＝異形棒鋼の付着力が高い》。\n【判定の軸】複数の耐震形式を併用する建物もあり「必ず一方式のみ」などの断定に注意する。","trick_patterns":"コンクリートが引張に強い、鉄筋は圧縮だけを負担する、と逆に覚えない。\n【断定表現の点検】行為主体と適用場面・例外を入れ替えた選択肢は、記述を分割して確認する。","memory_summary":"《鉄筋コンクリート》のコンクリートは引張に弱く、鉄筋と組み合わせて補います。誤りは肢3です。","review_check_questions":"Q1. 本問の正解肢は何番か？ A. 3番（出題当時の公式正解）。\nQ2. 本問の判定で最初に区別すべき条件は？ A. 複数の耐震形式を併用する建物もあり「必ず一方式のみ」などの断定に注意する。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effectiv では、鉄筋とコンクリートを一体化するには」という断定を、そのまま一般原則として受け入れてはいけない。未検証の修正文案では「丸鋼よりも、表面に節・突起がある異形棒鋼の方がコンクリートとの付着力が高く、一体化に適しています。「丸鋼の方が優れる」が逆です」であり、原文との違いを比べて制度の適用範囲を判断する。【理解を深める】コンクリート＝圧縮に強い／鉄筋＝引張に強い／一体性＝異形棒鋼の付着力が高い。\n比較対象の肢4では「鉄筋コンクリート構造は、コンクリートが固まって所定の強度が得られるまでに日数がかかり」が論点となる。正しい。コンクリートは所定の養生期間を経て固まり、規定の強度を発揮するよう適切に管理します。","choice_3_corrected_statement":"【修正文案・独立照合待ち】丸鋼よりも、表面に節・突起がある異形棒鋼の方がコンクリートとの付着力が高く、一体化に適しています。「丸鋼の方が優れる」が逆です。","choice_3_legal_basis":"肢別の法令照合待ち。関連出典：建築学会 鉄筋コンクリート構造の基礎、建築基準法関連基準","choice_3_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。丸鋼よりも、表面に節・突起がある異形棒鋼の方がコンクリートとの付着力が高く、一体化に適しています。「丸鋼の方が優れる」が逆です。 具体的な要件は出題当時の関連条文で確認する。","choice_4_truth":"true","choice_4_is_exam_answer":"false","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。コンクリートは所定の養生期間を経て固まり、規定の強度を発揮するよう適切に管理します。\n原文の「鉄筋コンクリート構造は、コンクリートが固まって所定の強度が得られるまでに日数がかかり」にある条件が、正誤の判断を左右する。【理解を深める】RC＝コンクリートが圧縮力、鉄筋が引張力を主に分担。互いの付着・近い熱膨張特性により一体で働きます。鉄筋はコンクリートのかぶりで腐食・火災から守られます。\n比較対象の肢1では「鉄筋コンクリート構造は、地震や風の力を受けても、躯 体の変形は比較的小さく」が論点となる。正しい。RC構造は地震・風などの外力に対し躯体として抵抗するため、構造設計・材料性能が重要です。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"肢別の法令照合待ち。関連出典：建築学会 鉄筋コンクリート構造の基礎、建築基準法関連基準","choice_4_exam_tip":"本肢ではこの肢の主張する主体・時期・条件が判定の分かれ目。コンクリートは所定の養生期間を経て固まり、規定の強度を発揮するよう適切に管理します。 具体的な要件は出題当時の関連条文で確認する。"},{"question_id":"2024-Q01","year":2024,"session":"通常","question_no":1,"major_field":"権利関係","section":"民法","unit":"意思表示","topic":"意思能力・意思表示・錯誤・詐欺・強迫","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"法律行為に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choice_1":"営業を許された未成年者が、その営業に関する意思表示をした時に意思能力を有しなかった場合は、その法律行為は無効である。","choice_2":"公の秩序に反する法律行為であっても、当事者が納得して合意した場合には、その法律行為は有効である。","choice_3":"詐欺による意思表示は取り消すことによって初めから無効であったとみなされるのに対し、強迫による意思表示は取り消すまでもなく無効である。","choice_4":"他人が所有している土地を目的物にした売買契約は無効であるが、当該他人がその売買契約を追認した場合にはその売買契約は有効となる。","official_accepted_answers":"1","answer_conclusion":"本問の正解は選択肢1。","answer_reason":"本問の正解は選択肢1。 意思能力なし・公序良俗違反は無効。詐欺・強迫は取消し。他人物売買は有効。営業許可は意思能力まで補わない。","scoring_exception_note":"","deep_lecture":"この問題は、法律行為が有効になるための「入口」と、意思表示に欠陥がある場合の「救済」を区別する問題です。まず==意思能力==とは、自分の行為の意味や法律上の結果を理解し判断する能力のことです。民法3条の2は、意思表示時にこれを欠く法律行為を無効とします。年齢や職業だけで画一的に判断せず、行為時点に理解力があったかを問題にします。次に==行為能力==は、単独で確定的に有効な法律行為を行う資格・能力です。未成年者は原則として法定代理人の同意を要しますが、民法6条により営業を許可された範囲では成年者と同一の行為能力を持ちます。ただし、営業の許可は意思能力の不足を治癒しません。さらに、民法90条の==公序良俗違反==は無効であり、契約自由の原則があっても当事者の合意だけで有効にはできません。一方で詐欺と強迫は、民法96条により==取消し可能==という扱いです。「取消し前から当然無効」と「取り消した場合に初めから無効とみなされる」は異なります。最後に他人物売買では、契約時に売主が所有権を有することは契約成立の必要条件ではありません。民法561条は売主に権利を取得して移転する義務を負わせます。したがって、本問の判断軸は、意思能力欠如・公序良俗違反の無効、詐欺・強迫の取消し、他人物売買の有効性という四分類です。","system_purpose":"意思能力を欠く人の保護、反社会的取引の抑止、欺罔・威迫を受けた人の救済、所有権移転が将来予定される売買の取引安全を、それぞれ異なる制度で確保する。","practical_examples":"例：17歳のAが親の許可を受けて店舗を営業していても、意思表示時に意思能力がなければ契約は無効。成年BがCの土地をDに売る契約は有効だが、BはCから土地を取得しDへ移転する義務を負う。","advanced_knowledge":"無効は原則として法律行為の効力が初めから生じないこと、取消しは取消権の行使によって遡及的に無効と扱われることに注意。[[NOTE:第三者保護]]のルールは詐欺・強迫で異なるので別途確認する。","comparative_explanation":"意思能力なし→無効（3条の2）／営業を許された未成年者→その営業に関する行為能力（6条）／公序良俗違反→無効（90条）／詐欺・強迫→取消し（96条）／他人物売買→契約自体は有効（561条）。","important_points":"==意思能力なし＝無効==／==営業許可は行為能力の例外==／==詐欺・強迫は取消し==／他人物売買でも契約は有効。","trick_patterns":"[[WARN:営業許可があるから必ず有効]]という誤読、[[WARN:強迫は当然無効]]という取消し・無効の混同、[[WARN:他人の土地は売れない]]という債権契約と所有権移転の混同が典型。","memory_summary":"意思能力なし・公序良俗違反は無効。詐欺・強迫は取消し。他人物売買は有効。営業許可は意思能力まで補わない。","review_check_questions":"Q 意思能力を欠く状態での意思表示は？ A 無効。\nQ 強迫による意思表示は当然無効？ A いいえ、原則取消し可能。\nQ 他人の土地の売買契約は？ A 契約自体は有効。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法（e-Gov）https://laws.e-gov.go.jp/law/129AC0000000089","marker_yellow_spans":"意思能力|行為能力|公序良俗違反|取消し可能|意思能力なし＝無効|営業許可は行為能力の例外|詐欺・強迫は取消し","marker_red_spans":"営業許可があるから必ず有効|強迫は当然無効|他人の土地は売れない","marker_blue_spans":"第三者保護","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"true","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。民法6条は、営業を許された未成年者がその営業について成年者と同じ「行為能力」を持つことを定めています。しかし、契約内容やその結果を理解して意思決定する「意思能力」は別の要件です。民法3条の2は意思表示時に意思能力を欠いた法律行為を無効としています。許可された営業の範囲内であってもこの無効規定は排除されないため、本肢が正解です。","choice_1_corrected_statement":"原文どおりで正しい","choice_1_legal_basis":"民法3条の2・6条","choice_1_exam_tip":"[[WARN:営業許可があるから必ず有効]]という誤読、[[WARN:強迫は当然無効]]という取消し・無効の混同、[[WARN:他人の土地は売れない]]という債権契約と所有権移転の混同が典型。","choice_2_truth":"false","choice_2_is_exam_answer":"false","choice_2_wrong_part":"当事者が納得して合意した場合には、その法律行為は有効である","choice_2_reason":"誤り。公の秩序または善良の風俗に反する法律行為は、民法90条により無効です。契約当事者が双方とも納得して署名したという事情では、法秩序が容認できない内容を有効にすることはできません。判断するのは「当事者の合意の有無」ではなく、「法律行為の内容が公序良俗に反するか」です。合意があれば有効とする部分が、法の例外を設けてしまっています。","choice_2_corrected_statement":"公の秩序又は善良の風俗に反する法律行為は、当事者が合意していても無効である。","choice_2_legal_basis":"民法90条","choice_2_exam_tip":"[[WARN:営業許可があるから必ず有効]]という誤読、[[WARN:強迫は当然無効]]という取消し・無効の混同、[[WARN:他人の土地は売れない]]という債権契約と所有権移転の混同が典型。","choice_3_truth":"false","choice_3_is_exam_answer":"false","choice_3_wrong_part":"強迫による意思表示は取り消すまでもなく無効である","choice_3_reason":"誤り。民法96条1項は、詐欺による意思表示も強迫による意思表示も取り消せると定めています。取り消されると、民法121条により原則として初めから無効であったものとみなされます。強迫だから契約時点で当然に無効になるわけではありません。「取消しが必要か」と「取消し後の効果」を別々に整理しないと、この肢のような表現に誘導されます。","choice_3_corrected_statement":"詐欺による意思表示も強迫による意思表示も、取り消すことができる。取り消されると、原則として初めから無効であったものとみなされる。","choice_3_legal_basis":"民法96条1項・121条","choice_3_exam_tip":"[[WARN:営業許可があるから必ず有効]]という誤読、[[WARN:強迫は当然無効]]という取消し・無効の混同、[[WARN:他人の土地は売れない]]という債権契約と所有権移転の混同が典型。","choice_4_truth":"false","choice_4_is_exam_answer":"false","choice_4_wrong_part":"他人が所有している土地を目的物にした売買契約は無効である","choice_4_reason":"誤り。他人の土地でも売買契約自体は有効に成立します。民法561条は、他人の権利を売った売主に、その権利を取得して買主に移転する義務を負わせています。売主が現時点で所有者でないことは、契約が最初から無効になる理由ではありません。売主が権利を取得できない場合に、別途、契約不適合・債務不履行等の問題が起こり得ることと、契約の成立・有効性を区別します。","choice_4_corrected_statement":"他人が所有している土地を目的とする売買契約も有効であり、売主はその権利を取得して買主へ移転する義務を負う。","choice_4_legal_basis":"民法561条","choice_4_exam_tip":"[[WARN:営業許可があるから必ず有効]]という誤読、[[WARN:強迫は当然無効]]という取消し・無効の混同、[[WARN:他人の土地は売れない]]という債権契約と所有権移転の混同が典型。"},{"question_id":"2024-Q02","year":2024,"session":"通常","question_no":2,"major_field":"権利関係","section":"民法","unit":"委任","topic":"委任契約","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"委任契約・準委任契約に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","choice_1":"売主が、売買契約の付随義務として、買主に対して、マンション専有部分内の防火戸の操作方法につき説明義務を負う場合、業務において密接な関係にある売主から委託を受け、売主と一体となって当該マンションの販売に関する一切の事務を行っていた宅地建物取引業者も、買主に対して、防火戸の操作方法について説明する信義則上の義務を負うことがある。","choice_2":"受任者は、委任者の許諾を得たとき、又はやむを得ない事由があるときでなければ、復受任者を選任することができない。","choice_3":"委任契約で本人が死亡しても代理権が消滅しない旨を合意して代理人に代理権を与えた場合、本人が死亡しても代理権は消滅しない。","choice_4":"委任は、当事者の一方が仕事を完成することを相手方に約し、相手方がその仕事の結果に対しその報酬を支払うことを約さなければ、その効力を生じない。","official_accepted_answers":"4","answer_conclusion":"《委任は事務処理を委託する契約》であり、仕事の完成を約束するのは請負。誤りは4です。","answer_reason":"2024-Q02の公式解答は選択肢4。「誤っているもの」を選ぶ問題であり、問題文の各条件を満たすかを4肢ごとに判断する。委任＝事務処理・善管注意義務／請負＝仕事の完成・成果への報酬。復受任者の選任は許諾又はやむを得ない事由が原則。","scoring_exception_note":"","deep_lecture":"委任とは、法律行為をすることを相手方に委託し、受任者が承諾することによって成立する契約である（民法643条）。法律行為以外の事務処理を任せる準委任にも原則として委任の規定が準用される（656条）。ここで重要なのは、受任者の義務の中心が「仕事の完成」ではなく「==善良な管理者の注意==をもった事務処理」にある点である。受任者は目的が達成されなかったという結果だけで直ちに債務不履行になるわけではないが、事務処理の過程で必要な注意を欠けば責任を負う。これに対し、請負は仕事の完成とその成果に対する報酬を約する契約であり（632条）、完成が義務の核心となる。委任の受任者が[[NOTE:復受任者]]を選ぶ際は、委任者の許諾またはやむを得ない事由が必要となる（644条の2）。さらに不動産販売で売主と事実上一体となり買主の安全に関わる説明業務を担った業者には、契約当事者でない買主に対しても、取引の具体的事情によって信義則上の説明義務が認められることがある。これは形式的な契約名だけで責任範囲を判断できないことを示す。任意代理権の本人死亡による消滅も原則と例外を区別する。意思表示や委託目的、当事者の合意を具体的に確認する必要があり、単純に「本人の死亡なら常に消滅」と覚えてはならない。","system_purpose":"制度趣旨：委任とは、法律行為をすることを相手方に委託し、受任者が承諾することによって成立する契約である（民法643条）。法律行為以外の事務処理を任せる準委任にも原則として委任の規定が準用される（656条）。ここで重要なのは、受任者の義務の中心が「仕事の完成」ではなく「善良な管理者の注意をもった事務処理」にある点である。受任者は目的が達成されなかったという結果だけで直ちに債務不履","practical_examples":"マンション販売会社が販売事務一式を系列業者に委託し、引渡し時に防火戸の操作を一切案内しなかった場合、設備の危険性や業務分担によってその業者の説明義務が問題になる。","advanced_knowledge":"委任は原則として各当事者が解除できるが、相手方の不利な時期に解除した場合の損害賠償などは別途検討する（651条）。","comparative_explanation":"委任＝事務処理・善管注意義務／請負＝仕事の完成・成果への報酬。復受任者の選任は許諾又はやむを得ない事由が原則。","important_points":"①委任＝事務処理・善管注意義務／請負＝仕事の完成・成果への報酬。復受任者の選任は許諾又はやむを得ない事由が原則。　②委任は原則として各当事者が解除できるが、相手方の不利な時期に解除した場合の損害賠償などは別途検討する（651条）。","trick_patterns":"(1)委任＝事務処理・善管注意義務／請負＝仕事の完成・成果への報酬。復受任者の選任は許諾又はやむを得ない事由が原則。　(2)この説明は委任ではなく請負の定義をそのまま当てはめたもの。委任は有償にも無償にもなり得て、特約がなければ受任者は報酬を請求できないのが原則である。仕事の完成と報酬という二要素を委任\n【要注意の表現】[[WARN:当事者の一方が仕事を完成することを]]","memory_summary":"委任＝事務処理・善管注意義務／請負＝仕事の完成・成果への報酬。復受任者の選任は許諾又はやむを得ない事由が原則。","review_check_questions":"Q.仕事の完成を約する契約は？→請負。|Q.復受任者を選任できる典型的条件は？→委任者の許諾またはやむを得ない事由。|Q.委任は必ず有償か？→いいえ。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法・特別法一次資料照合入口：https://laws.e-gov.go.jp/law/129AC0000000089 ; https://laws.e-gov.go.jp/law/403AC0000000090","marker_yellow_spans":"善良な管理者の注意","marker_red_spans":"当事者の一方が仕事を完成することを","marker_blue_spans":"復受任者","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"false","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。マンション販売を一体的に行う業者が、売主の説明義務に密接に関与すると、買主に対して信義則上の説明義務を負う場合があります。\n売主と業者との委託契約だけを見て「買主との契約関係はないから説明義務なし」と断定するのは危険である。防火戸は火災時の避難・安全に直結する設備であり、販売活動を一体として担当していた事情から買主への注意義務が基礎付けられるかを判断する。すべての媒介業者に無条件で同じ義務が発生するという意味ではない。","choice_1_corrected_statement":"原文どおりで正しい","choice_1_legal_basis":"民法1条2項・判例（防火戸説明義務）","choice_1_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／委任＝事務処理・善管注意義務／請負＝仕事の完成・成果への報酬。復受任者の選任は許諾又はやむを得ない事由が原則。","choice_2_truth":"true","choice_2_is_exam_answer":"false","choice_2_wrong_part":"該当なし","choice_2_reason":"正しい。受任者が自由に復受任者を選べるわけではなく、委任者の許諾またはやむを得ない事情が必要です。\n委任者が事務処理を特定の受任者に任せた以上、受任者の都合だけで自由に第三者に委ねることは許されない。許諾・やむを得ない事情という入口要件と、復受任者の権限の範囲を分けて考える。例えば受任者が長期療養で急きょ代理対応を必要とするときでも、当然に無制限の再委任が許されるわけではない。","choice_2_corrected_statement":"原文どおりで正しい","choice_2_legal_basis":"民法644条の2","choice_2_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／委任＝事務処理・善管注意義務／請負＝仕事の完成・成果への報酬。復受任者の選任は許諾又はやむを得ない事由が原則。","choice_3_truth":"true","choice_3_is_exam_answer":"false","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい。任意代理権は原則として本人の死亡で消滅しますが、委任の内容・当事者の合意によって死後も存続させることが認められる場合があります。\n本人死亡による代理権消滅の原則と、代理権を死後も存続させる特別の合意がある場合の取扱いを混同させる記述である。本人の死後に処理すべき事務を委託した事情や代理権授与の趣旨を検討する。契約そのものの終了と、代理行為の相手方に対する効力も別々に考える必要がある。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"民法111条・代理権存続に関する判例","choice_3_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／委任＝事務処理・善管注意義務／請負＝仕事の完成・成果への報酬。復受任者の選任は許諾又はやむを得ない事由が原則。","choice_4_truth":"false","choice_4_is_exam_answer":"true","choice_4_wrong_part":"当事者の一方が仕事を完成することを相手方に約し、相手方がその仕事の結果に対しその報酬を支払うことを約さなければ","choice_4_reason":"誤り。[[WARN:仕事の完成]]と成果に対する報酬を約束するのは請負（民法632条）。委任は法律行為の事務処理を委託し、受任者が承諾して成立します。\nこの説明は委任ではなく請負の定義をそのまま当てはめたもの。委任は有償にも無償にもなり得て、特約がなければ受任者は報酬を請求できないのが原則である。仕事の完成と報酬という二要素を委任の成立要件とするところが決定的に誤る。弁護士への法律事務の委託と建物の新築請負を対比すると覚えやすい。","choice_4_corrected_statement":"委任は、委任は、当事者の一方が法律行為をすることを相手方に委託し、相手方がこれを承諾することにより効力を生ずる。、その効力を生じない。","choice_4_legal_basis":"民法632条・643条・648条","choice_4_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／委任＝事務処理・善管注意義務／請負＝仕事の完成・成果への報酬。復受任者の選任は許諾又はやむを得ない事由が原則。"},{"question_id":"2024-Q03","year":2024,"session":"通常","question_no":3,"major_field":"権利関係","section":"民法","unit":"共有","topic":"共有・共有物分割","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"甲土地につき、Ａ、Ｂ、Ｃ、Ｄの4 人がそれぞれ4 分の1 の共有持分を有していて、Ａ、Ｂ、ＣのいずれもＤの所在を知ることができない場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。なお、Ｄの共有持分は、相続財産には属していないものとする。","choice_1":"甲土地に、その形状又は効用の著しい変更を伴う変更を加える場合には、共有者の過半数の同意が必要であり、本件ではＡ、Ｂ、Ｃ3 人の同意が必要となる。","choice_2":"甲土地の所有権の登記名義人となっている者が所有者ではないＥである場合、持分に基づいてＥに対して登記の抹消を求めるためには、所在が判明しているＡ、Ｂ、Ｃのうち2 人の同意が必要である。","choice_3":"Ａ、Ｂ、Ｃ3 人の同意があれば、甲土地を資材置場として賃借したいＦとの間で期間を3年とする賃貸借契約を締結することができる。","choice_4":"Ａが裁判所に請求して、裁判所がＤの持分をＡに取得させる旨の決定をした場合、Ｄは、その決定から3 年以内に限り、Ａが取得したＤの共有持分の時価相当額をＡに対して支払うよう請求することができる。","official_accepted_answers":"3","answer_conclusion":"《資材置場としての3年の土地賃貸借》は管理行為の範囲内。4分の3の持分があれば成立します。","answer_reason":"2024-Q03の公式解答は選択肢3。問題文の各条件を満たすかを4肢ごとに判断する。保存＝単独可／管理＝持分価格の過半数／著しい変更＝原則全員同意。短期賃貸借は土地5年、建物3年。","scoring_exception_note":"","deep_lecture":"共有の法律問題は、①保存行為、②管理行為、③変更行為をまず分類する。保存行為は共有物の現状を維持し権利を保全する行為であり、共有者が単独でできる（民法252条5項）。無権利者の登記の抹消請求はその典型である。管理行為は原則として各共有者の==持分価格の過半数==で決定する（252条1項）。「共有者の人数の過半数」と「持分価格の過半数」は一致しないことがあるので計算に注意する。共有物に大きな物理的変更を加える行為は原則全員の同意を要する（251条1項）。ただし形状又は効用の著しい変更を伴わない軽微な変更は管理の枠組みに属する。短期賃貸借も管理として可能で、土地の賃借権等は原則5年、建物は3年という期間上限を覚える（252条4項）。[[NOTE:所在等不明共有者]]がいる場合は裁判所の決定を得る制度もあるが、所在が判明している共有者だけで自動的に全員同意の要件を満たすわけではない。所在等不明共有者の持分取得決定では、裁判所の決定により取得者に持分が移転し、所在不明者はその持分の時価相当額の支払を請求できる側に立つ。誰が誰に金銭を請求するか、権利の向きを必ず確認する。\n共有者が4人で持分が同じ場合には「3人」の賛成はたまたま持分価格4分の3と一致するが、共有持分が異なる場合は人数で判断してはいけない。まず持分割合を書き出して計算する。","system_purpose":"制度趣旨：共有の法律問題は、①保存行為、②管理行為、③変更行為をまず分類する。保存行為は共有物の現状を維持し権利を保全する行為であり、共有者が単独でできる（民法252条5項）。無権利者の登記の抹消請求はその典型である。管理行為は原則として各共有者の持分価格の過半数で決定する（252条1項）。「共有者の人数の過半数」と「持分価格の過半数」は一致しないことがあるので計算に注意する。","practical_examples":"Aの持分1/2、BとCの持分各1/4なら、Aの賛成だけでは「過半数」ではなくちょうど1/2。AとBが賛成すれば3/4で管理決議ができる。","advanced_knowledge":"不明共有者の持分の取得と、全共有者が第三者に譲渡する際の持分譲渡権限の付与は別制度（262条の2、262条の3）。","comparative_explanation":"保存＝単独可／管理＝持分価格の過半数／著しい変更＝原則全員同意。短期賃貸借は土地5年、建物3年。","important_points":"①保存＝単独可／管理＝持分価格の過半数／著しい変更＝原則全員同意。短期賃貸借は土地5年、建物3年。　②不明共有者の持分の取得と、全共有者が第三者に譲渡する際の持分譲渡権限の付与は別制度（262条の2、262条の3）。","trick_patterns":"(1)保存＝単独可／管理＝持分価格の過半数／著しい変更＝原則全員同意。短期賃貸借は土地5年、建物3年。　(2)資材置場として3年間使用させる土地賃貸借は、土地に関する5年以内の短期賃借権に当たるため、共有物の管理として持分価格過半数で決められる。A・B・Cは合計4分の3を有するので過半数を\n【要注意の表現】[[WARN:共有者の過半数の同意が必要であり]]","memory_summary":"保存＝単独可／管理＝持分価格の過半数／著しい変更＝原則全員同意。短期賃貸借は土地5年、建物3年。","review_check_questions":"Q.共有物の保存行為は誰ができる？→共有者が単独でできる。|Q.土地の管理として設定できる賃借権の上限は？→原則5年。|Q.著しい変更の原則要件は？→全員同意。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法・特別法一次資料照合入口：https://laws.e-gov.go.jp/law/129AC0000000089 ; https://laws.e-gov.go.jp/law/403AC0000000090","marker_yellow_spans":"持分価格の過半数","marker_red_spans":"共有者の過半数の同意が必要であり","marker_blue_spans":"所在等不明共有者","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"共有者の過半数の同意が必要であり、本件ではＡ、Ｂ、Ｃ3 人の同意が必要","choice_1_reason":"誤り。形状・効用の著しい変更は原則共有者[[WARN:全員の同意]]が必要です。持分過半数で足りる管理行為とは異なります。\n土地の形状・効用を著しく変えることは他の共有者の利用を大きく制約するので、管理の持分過半数決議では足りない。本件ではA・B・Cの持分は合計4分の3だが、Dの同意を欠く以上、通常の全員同意要件を満たさない。所在不明だから不要になるのではなく、別途裁判所の制度を利用するかが問題となる。","choice_1_corrected_statement":"甲土地にその形状又は効用の著しい変更を伴う変更を加える場合、原則として共有者全員の同意を要する。Dの所在等が不明なら、民法251条2項の裁判所の決定等の手続を検討する。A・B・Cのみの同意で当然に足りるわけではない。","choice_1_legal_basis":"民法251条1項・252条","choice_1_exam_tip":"【判定】4人が各4分の1を持つためA・B・Cは持分4分の3。ただし著しい変更は過半数管理ではなく原則全員同意。所在不明者の例外は裁判所の手続が前提。","choice_2_truth":"false","choice_2_is_exam_answer":"false","choice_2_wrong_part":"2 人の同意が必要","choice_2_reason":"誤り。無権利者の虚偽登記の抹消は保存行為に当たり、共有者の一人が単独で請求できます。\n無権利者Eが所有者として登記されている状態は、共有者全員の権利行使を妨げる。これを抹消させる請求は新たな用途を決める行為ではなく、権利を元の状態に保つ保存行為である。したがってAだけでもでき、A・B・Cから2人選ぶ多数決を要しない。訴訟上の当事者適格の問題とも区別して整理する。","choice_2_corrected_statement":"甲土地の所有 権の登記名義人となっている者が所有者ではないＥである場合、持分に基づいてＥに対して登記の抹消を求めるためには、所在が判明しているＡ、Ｂ、Ｃのうち共有者の1人が単独で保存行為として請求できるである。","choice_2_legal_basis":"民法252条5項","choice_2_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／保存＝単独可／管理＝持分価格の過半数／著しい変更＝原則全員同意。短期賃貸借は土地5年、建物3年。","choice_3_truth":"true","choice_3_is_exam_answer":"true","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい。土地の3年の短期賃貸借は共有物の管理として持分の価格の過半数で決められ、A・B・Cで4分の3を有します。\n資材置場として3年間使用させる土地賃貸借は、土地に関する5年以内の短期賃借権に当たるため、共有物の管理として持分価格過半数で決められる。A・B・Cは合計4分の3を有するので過半数を超える。賃貸借が短期でも、特別法による存続期間や対抗力があるときは慎重に判断する必要がある。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"民法252条1項・4項2号","choice_3_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／保存＝単独可／管理＝持分価格の過半数／著しい変更＝原則全員同意。短期賃貸借は土地5年、建物3年。","choice_4_truth":"false","choice_4_is_exam_answer":"false","choice_4_wrong_part":"決定から3 年以内に限り","choice_4_reason":"誤り。所在等不明共有者の持分取得を命じる決定後、代金相当額の供託・請求の関係は説明文のような「DがAに支払を請求する」形ではありません。\n持分取得決定によって持分を失うのはDであり、対価を請求するのもDである。この肢ではDがAに対して「時価を支払うよう請求する」と述べるが、時効期間を3年に限定する根拠はない。所在等不明共有者の制度は、勝手な無償取得ではなく対価の確保と権利救済を組み合わせた制度である。","choice_4_corrected_statement":"Ａが裁判所に請求して、裁判所がＤの持分をＡに取得させる旨の決定をした場合、Ｄは、そのこのような3年の一律制限はない、Ａが取得したＤの共有持分の時価相当額をＡに対して支払うよう請求することができる。","choice_4_legal_basis":"民法262条の2","choice_4_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／保存＝単独可／管理＝持分価格の過半数／著しい変更＝原則全員同意。短期賃貸借は土地5年、建物3年。"},{"question_id":"2024-Q04","year":2024,"session":"通常","question_no":4,"major_field":"権利関係","section":"民法","unit":"売買","topic":"売買・手付・契約不適合責任","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"Ａを売主、Ｂを買主として甲土地の売買契約（以下この問において「本件契約」という。）が締結された直後にＡが死亡し、ＣがＡを単独相続した場合における次の記述のうち、民法の規定によれば、正しいものはどれか。","choice_1":"売買代金を受領したＣが甲土地の引渡しを拒絶する意思を明確に表示したとしても、Ｂは、Ｃに対して相当の期間を定めた催告をしなければ、本件契約を解除することができない。","choice_2":"Ｂが期日までに売買代金を支払わない場合であっても、本件契約の解除権はＡの一身に専属した権利であるため、Ｃは本件契約を解除することはできない。","choice_3":"Ｂは、売買代金が支払い済みだったとしても、甲土地の所有権登記を備えなければ、Ｃに対して甲土地の引渡しを請求することはできない。","choice_4":"本件契約が、Ａの詐欺により締結されたものである場合、ＢはＣに対して、本件契約の取消しを主張することができる。","official_accepted_answers":"4","answer_conclusion":"《相続人は売主の契約上の地位を承継》。買主は亡くなった売主の詐欺を相続人に対して主張できます。","answer_reason":"2024-Q04の公式解答は選択肢4。問題文の各条件を満たすかを4肢ごとに判断する。催告解除＝原則として履行請求後の不履行／無催告解除＝履行拒絶など。登記の対抗＝第三者関係／契約上の請求＝当事者・包括承継人関係。","scoring_exception_note":"","deep_lecture":"売買契約の締結後に売主が死亡すると、その==相続人==は、原則として被相続人の財産上の権利義務を承継する（民法896条）。相続人が新しい売主になり、土地の引渡義務や代金請求権だけでなく、契約を解除する地位も原則引き継ぐ。契約上の債務が履行されないとき、解除には催告解除（541条）と無催告解除（542条）がある。催告解除では相当期間を定めて履行を求め、その期間内に履行がなければ解除できる。他方、債務者が[[WARN:履行を明確に拒絶]]した場合など、催告しても意味がないケースでは無催告解除ができる。所有権移転登記は主に第三者との対抗関係を処理する制度であり、契約当事者又はその包括承継人に対する履行請求権の成立要件ではない。売主Aが買主Bを欺いて売却したなら、Bの[[NOTE:詐欺取消権]]（96条）はAの相続人Cにも主張できる。Cは独立した第三者ではなく、Aの権利義務を包括的に引き継いだからである。大切なのは、相続を「契約がなかったことになる出来事」と考えず、「原則として同じ契約上の地位が移る」と把握することである。\nなお、Cが単独相続する設定のため、解除権の行使をめぐって相続人間の共同処分を考える必要はない。複数相続の場合の解除権の扱いは別に整理する。","system_purpose":"制度趣旨：売買契約の締結後に売主が死亡すると、その相続人は、原則として被相続人の財産上の権利義務を承継する（民法896条）。相続人が新しい売主になり、土地の引渡義務や代金請求権だけでなく、契約を解除する地位も原則引き継ぐ。契約上の債務が履行されないとき、解除には催告解除（541条）と無催告解除（542条）がある。催告解除では相当期間を定めて履行を求め、その期間内に履行がなければ","practical_examples":"AがマンションをBに販売し、代金受領後に死亡した場合、相続人Cは鍵と登記関係書類を引き渡す義務を承継する。Cが履行を拒絶すればBは解除を検討できる。","advanced_knowledge":"解除の可否は債権者側の帰責性（543条）等にも左右される。詐欺取消し後の原状回復は民法121条の2の問題である。","comparative_explanation":"催告解除＝原則として履行請求後の不履行／無催告解除＝履行拒絶など。登記の対抗＝第三者関係／契約上の請求＝当事者・包括承継人関係。","important_points":"①催告解除＝原則として履行請求後の不履行／無催告解除＝履行拒絶など。登記の対抗＝第三者関係／契約上の請求＝当事者・包括承継人関係。　②解除の可否は債権者側の帰責性（543条）等にも左右される。詐欺取消し後の原状回復は民法121条の2の問題である。","trick_patterns":"(1)催告解除＝原則として履行請求後の不履行／無催告解除＝履行拒絶など。登記の対抗＝第三者関係／契約上の請求＝当事者・包括承継人関係。　(2)Aが詐欺をしたことで成立した売買の取消権は、被害者Bに帰属する。Aが死亡してCが売主の地位を相続しても、Bの詐欺を理由とする取消しは消滅しない。詐欺による取消しと、善意無過失の第三","memory_summary":"催告解除＝原則として履行請求後の不履行／無催告解除＝履行拒絶など。登記の対抗＝第三者関係／契約上の請求＝当事者・包括承継人関係。","review_check_questions":"Q.売主死亡で引渡義務は消える？→原則消えず相続人が承継。|Q.明確な履行拒絶の解除に催告は必要？→原則不要。|Q.売主の相続人は登記対抗上の第三者か？→通常は当事者地位の承継人。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法・特別法一次資料照合入口：https://laws.e-gov.go.jp/law/129AC0000000089 ; https://laws.e-gov.go.jp/law/403AC0000000090","marker_yellow_spans":"相続人","marker_red_spans":"履行を明確に拒絶","marker_blue_spans":"詐欺取消権","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"催告をしなければ","choice_1_reason":"誤り。売主側が履行を明確に拒むなら、催告を要しない解除が認められます。\nCは売主Aの相続人として引渡義務を負う。Cが明確に履行を拒む場合、Bに再度催告させても実現可能性はなく、民法542条1項2号による無催告解除の典型となる。「引渡しが遅れた」だけなら通常は541条の催告を検討するが、履行拒絶という強い事情を読み落としてはいけない。","choice_1_corrected_statement":"売買代金を受領したＣが甲土地の引渡しを拒絶する意思を明確に表示したとしても、Ｂは、Ｃに対して相当の期間を定めた履行を明確に拒絶した場合には催告なしに解除できる、本件契約を解除することができない。","choice_1_legal_basis":"民法542条1項2号・896条","choice_1_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／催告解除＝原則として履行請求後の不履行／無催告解除＝履行拒絶など。登記の対抗＝第三者関係／契約上の請求＝当事者・包括承継人関係。","choice_2_truth":"false","choice_2_is_exam_answer":"false","choice_2_wrong_part":"解除権はＡの一身に専属した権利","choice_2_reason":"誤り。売買上の解除権は原則として相続されます。一身専属権ではありません。\n解除権は原則として財産上の契約上の地位に付随する権利であり、一身専属とは扱われない。Aの死亡後、Bが代金を支払わない場合には、Cが売主として催告解除などを検討できる。ただし解除の要件は従前の契約から決まり、単に相続したから無条件で解除できるわけではない。","choice_2_corrected_statement":"Ｂが期日までに売買代金を支払わない場合であっても、本件契約の解除権は原則として相続人に承継されるであるため、Ｃは本件契約を解除することはできない。","choice_2_legal_basis":"民法541条・896条","choice_2_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／催告解除＝原則として履行請求後の不履行／無催告解除＝履行拒絶など。登記の対抗＝第三者関係／契約上の請求＝当事者・包括承継人関係。","choice_3_truth":"false","choice_3_is_exam_answer":"false","choice_3_wrong_part":"所有権登記を備えなければ","choice_3_reason":"誤り。買主は売主の相続人に対して契約に基づく引渡しを求められ、登記を常に要求されるわけではありません。\nBとAとの売買契約に基づく履行請求は、Aの地位を承継したCにも主張できる。「登記がないと第三者に対抗できない」という民法177条の仕組みを、売主本人やその相続人との契約関係に持ち込んでいるのが誤り。二重譲渡などC以外の第三者が現れた場合は、登記の先後を別に検討する。","choice_3_corrected_statement":"Ｂは、売買代金が支払い済みだったとしても、甲土地の売主の相続人に対する履行請求では登記を要しない、Ｃに対して甲土地の引渡しを請求することはできない。","choice_3_legal_basis":"民法177条・555条・896条","choice_3_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／催告解除＝原則として履行請求後の不履行／無催告解除＝履行拒絶など。登記の対抗＝第三者関係／契約上の請求＝当事者・包括承継人関係。","choice_4_truth":"true","choice_4_is_exam_answer":"true","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。詐欺を行った売主Aの地位をCが単独相続した場合、買主BはCに対しても取消しを主張できます。\nAが詐欺をしたことで成立した売買の取消権は、被害者Bに帰属する。Aが死亡してCが売主の地位を相続しても、Bの詐欺を理由とする取消しは消滅しない。詐欺による取消しと、善意無過失の第三者に対する対抗制限（96条3項）は異なる場面であり、Aの相続人Cをそのまま第三者扱いしない。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"民法96条・896条","choice_4_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／催告解除＝原則として履行請求後の不履行／無催告解除＝履行拒絶など。登記の対抗＝第三者関係／契約上の請求＝当事者・包括承継人関係。"},{"question_id":"2024-Q05","year":2024,"session":"通常","question_no":5,"major_field":"権利関係","section":"民法","unit":"債務不履行","topic":"債務不履行・契約解除","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"履行遅滞に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choice_1":"不法行為の加害者は、不法行為に基づく損害賠償債務について、履行の請求を受けた時から遅滞の責任を負う。","choice_2":"善意の受益者は、その不当利得返還債務について、履行の請求を受けた時から遅滞の責任を負う。","choice_3":"請負人の報酬債権に対して、注文者がこれと同時履行の関係にある目的物の瑕 疵修補に代わる損害賠償債権を自働債権とする相殺の意思表示をした場合、注文者は、請負人に対する相殺後の報酬残債務について、当該残債務の履行の請求を受けた時から遅滞の責任を負う。","choice_4":"債務の履行について不確定期限があるときは、債務者は、その期限の到来したことを知った後に履行の請求を受けた時から遅滞の責任を負う。","official_accepted_answers":"2","answer_conclusion":"不当利得の《善意受益者》の返還債務は、原則として請求時から履行遅滞になります。","answer_reason":"2024-Q05の公式解答は選択肢2。問題文の各条件を満たすかを4肢ごとに判断する。確定期限＝期限到来／不確定期限＝知った時又は期限後の請求時の早い方／期限なし＝請求時。不法行為は損害発生時。","scoring_exception_note":"","deep_lecture":"履行遅滞とは、履行可能な債務について、履行すべき時期を過ぎても履行しない状態をいう。民法412条は、確定期限のある債務は期限到来時、不確定期限のある債務は期限到来後の請求時又は債務者が期限到来を知った時のいずれか早い時、期限の定めのない債務は==請求を受けた時==を基本として区分する。ところが債務の発生原因によって判例法理が加わる。不法行為に基づく損害賠償債務は、被害者による催告を待たず損害発生時から遅滞に陥ると解される。他方、善意の不当利得受益者の返還債務は、期限の定めのない債務と同じ扱いで請求時から遅滞する。請負の契約不適合に関する損害賠償債権と報酬債権が[[NOTE:同時履行関係]]にある場合、注文者が損害賠償債権を自働債権として相殺したときの残額については、判例が相殺の意思表示の翌日から遅滞責任を認めることがある。したがって「いつも催告された日から」と機械的に解くことはできない。条文の3分類と、原因別の判例という2段階で考えるのが正しい。\n出題文の「善意」は不当利得の受益者が法律上の原因の不存在を知らないことを指す。不法行為加害者の故意過失と別概念であり、同じ「悪意」「善意」の単語から一律に遅滞の始期を決めない。","system_purpose":"制度趣旨：履行遅滞とは、履行可能な債務について、履行すべき時期を過ぎても履行しない状態をいう。民法412条は、確定期限のある債務は期限到来時、不確定期限のある債務は期限到来後の請求時又は債務者が期限到来を知った時のいずれか早い時、期限の定めのない債務は請求を受けた時を基本として区分する。ところが債務の発生原因によって判例法理が加わる。不法行為に基づく損害賠償債務は、被害者による","practical_examples":"AがBの塀を壊した場合の損害賠償は原則として損害発生時から遅滞。一方、誤振込を善意で受け取った人への返還請求は、履行請求時が原則となる。","advanced_knowledge":"遅延損害金は債務の種類や特約等により計算が異なる。同時履行抗弁権があるかと、相殺後の残額について遅滞するかは切り分ける。","comparative_explanation":"確定期限＝期限到来／不確定期限＝知った時又は期限後の請求時の早い方／期限なし＝請求時。不法行為は損害発生時。","important_points":"①確定期限＝期限到来／不確定期限＝知った時又は期限後の請求時の早い方／期限なし＝請求時。不法行為は損害発生時。　②遅延損害金は債務の種類や特約等により計算が異なる。同時履行抗弁権があるかと、相殺後の残額について遅滞するかは切り分ける。","trick_patterns":"(1)確定期限＝期限到来／不確定期限＝知った時又は期限後の請求時の早い方／期限なし＝請求時。不法行為は損害発生時。　(2)善意受益者とは法律上の原因がないことを知らずに利益を受けた者をいう。返還義務は民法703条を基礎とし、その履行期が指定されていない場合は請求を受けた時が遅滞の出発点となる。悪意受益\n【要注意の表現】[[WARN:履行の請求を受けた時から]]","memory_summary":"確定期限＝期限到来／不確定期限＝知った時又は期限後の請求時の早い方／期限なし＝請求時。不法行為は損害発生時。","review_check_questions":"Q.不法行為賠償債務はいつから遅滞？→原則損害発生時。|Q.不確定期限の遅滞はいつ？→知った時・期限後の請求時の早い方。|Q.本問の相殺後残額は？→意思表示の翌日から。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法・特別法一次資料照合入口：https://laws.e-gov.go.jp/law/129AC0000000089 ; https://laws.e-gov.go.jp/law/403AC0000000090","marker_yellow_spans":"請求を受けた時","marker_red_spans":"履行の請求を受けた時から","marker_blue_spans":"同時履行関係","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"履行の請求を受けた時から","choice_1_reason":"誤り。不法行為の損害賠償債務は原則として不法行為時から当然に遅滞します。請求まで待ちません。\n交通事故など不法行為により損害が生じたとき、被害者が請求書を発送するまで加害者の遅滞責任が発生しないとすると、請求に必要な時間が被害者の不利益になる。判例は不法行為による賠償債務を損害発生時から遅滞に陥るものとする。通常の期限の定めのない金銭債務と同じに扱わない。","choice_1_corrected_statement":"不法行為の加害者は、不法行為に基づく損害賠償債務について、損害発生時から原則として遅滞の責任を負う遅滞の責任を負う。","choice_1_legal_basis":"民法709条・最高裁昭和37年9月4日判決","choice_1_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／確定期限＝期限到来／不確定期限＝知った時又は期限後の請求時の早い方／期限なし＝請求時。不法行為は損害発生時。","choice_2_truth":"true","choice_2_is_exam_answer":"true","choice_2_wrong_part":"該当なし","choice_2_reason":"正しい。善意受益者の返還債務は期限の定めのない債務として、履行請求を受けてから遅滞責任を負います。\n善意受益者とは法律上の原因がないことを知らずに利益を受けた者をいう。返還義務は民法703条を基礎とし、その履行期が指定されていない場合は請求を受けた時が遅滞の出発点となる。悪意受益者には民法704条の利息等の特則があるので、善意か悪意かを読まずに答えてはならない。","choice_2_corrected_statement":"原文どおりで正しい","choice_2_legal_basis":"民法412条3項・703条・704条","choice_2_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／確定期限＝期限到来／不確定期限＝知った時又は期限後の請求時の早い方／期限なし＝請求時。不法行為は損害発生時。","choice_3_truth":"false","choice_3_is_exam_answer":"false","choice_3_wrong_part":"履行の請求を受けた時から","choice_3_reason":"誤り。同時履行関係にある債権を相殺した場合の残額について、遅滞の発生を一律に相殺後の請求時からとすることはできません。\n注文者の損害賠償債権と請負人の報酬債権が同時履行関係にあるとき、相殺前の履行拒絶の正当性と、相殺後に残った報酬債務の遅滞を区別する。判例上、この設問の残額は[[WARN:相殺の意思表示の翌日]]から遅滞となり、残額について再び履行請求を受けるまで遅滞しないという説明が誤る。","choice_3_corrected_statement":"請負人の報酬債権に対して、注文者がこれと同時履行の関係にある目的物の瑕 疵修補に代わる損害賠償債権を自働債権とする相殺の意思表示をした場合、注文者は、請負人に対する相殺後の報酬残債務について、当該残債務の本問の相殺後の残額は相殺の意思表示の翌日から遅滞の責任を負う遅滞の責任を負う。","choice_3_legal_basis":"民法505条・506条・最高裁平成9年7月15日判決","choice_3_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／確定期限＝期限到来／不確定期限＝知った時又は期限後の請求時の早い方／期限なし＝請求時。不法行為は損害発生時。","choice_4_truth":"false","choice_4_is_exam_answer":"false","choice_4_wrong_part":"知った後に履行の請求を受けた時","choice_4_reason":"誤り。不確定期限は債務者が期限到来を知った時または期限到来後に請求を受けた時のいずれか早い時から遅滞します。\n不確定期限とは到来することは確実でも、その日時がまだ決まらない期限である。債務者が期限の到来を知った場合には、後から履行請求されるのを待たずに遅滞に入る。逆に期限到来後に請求を受けたなら、知らなかったと主張しても遅滞を免れない。両条件を「かつ」ではなく「または」で覚える。","choice_4_corrected_statement":"債務の履行について不確定期限があるときは、債務者は、その期限の到来したことを期限到来後に請求を受けた時又は到来を知った時のいずれか早い時から遅滞の責任を負う。","choice_4_legal_basis":"民法412条2項","choice_4_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／確定期限＝期限到来／不確定期限＝知った時又は期限後の請求時の早い方／期限なし＝請求時。不法行為は損害発生時。"},{"question_id":"2024-Q06","year":2024,"session":"通常","question_no":6,"major_field":"権利関係","section":"民法","unit":"抵当権","topic":"抵当権・根抵当権","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"count_true","question_text":"Ａの所有する甲土地にＢを地上権者とする地上権（以下この問において「本件地上権」という。）が設定され、その旨の登記がされた後に、甲土地にＣを抵当権者とする抵当権が設定され、その旨の登記がされた場合における次の記述のうち、民法の規定によれば、正しいものはいくつあるか。ア　ＢがＡとの売買契約に基づき、甲土地の所有権を取得したときは、本件地上権は消滅する。イ　Ａが死亡してＢがＡを単独相続し、甲土地の所有権を取得したときは、本件地上権は消滅する。ウ　ＢがＡとの代物弁済契約に基づき、甲土地の所有権を取得したときは、本件地上権は消滅する。エ　ＢがＡとの贈与契約に基づき、甲土地の所有権を取得したときは、本件地上権は消滅する。","choice_1":"一つ","choice_2":"二つ","choice_3":"三つ","choice_4":"なし","official_accepted_answers":"4","answer_conclusion":"本問の正解は選択肢4。","answer_reason":"本問の正解は選択肢4。 同一人に集まれば混同が原則。ただし第三者の権利があれば例外。売買・相続・代物弁済・贈与は全て×。","scoring_exception_note":"","deep_lecture":"==混同==とは、所有権とその所有物に設定された他の物権が同じ人に帰属したように、権利主体が一致することです。たとえば土地所有者Aが地上権者Bに土地を売れば、通常、Bは自分の土地について自分の地上権を持つ必要がなくなるため、民法179条1項本文に従って地上権が消滅します。しかし、本問はここで終わらず、==第三者の権利==が先に付いているかが決め手です。Bの地上権が設定・登記された後に、土地にCの抵当権が設定・登記されています。このように他の権利関係を保護する必要がある場合、民法179条1項ただし書は、物または物権が第三者の権利の目的となっていれば混同による消滅を認めません。設問のアは売買、イは相続、ウは代物弁済、エは贈与と、Bが土地の所有者になる原因を変えています。しかし、それは結論を左右する論点ではありません。どの原因でも所有権がBに帰属する点は同じであり、Cの権利が付着しているという例外の適用要件も同じだからです。初学者は「所有権と地上権が同じ人に集まった」時点で「消滅」と即断しがちですが、==本文→ただし書==の順に考えます。また、本問の4肢は、各取得原因を直接列挙するア〜エの真偽を数える選択肢です。正しい組合せを答える形式ではなく「正しいものはいくつあるか」なので、ア〜エの全判定後に0個と数えます。","system_purpose":"自分自身に対する物権を不要なものとして整理する一方、混同によって他人の既存の権利が不当に損なわれないよう保護する。","practical_examples":"例：Aの土地にBの地上権が登記され、その後Cの抵当権が登記された。BがAから土地を贈与されても、混同の例外を先に確認する。Cの権利を無視して地上権が消えると判断しない。","advanced_knowledge":"[[NOTE:民法179条2項]]も、所有権以外の物権とこれを目的とする他の権利の混同を扱います。3項は占有権には前2項を適用しないとするため、混同の対象となる権利の性質にも注意。","comparative_explanation":"原則：所有権＋他の物権が同一人に帰属→消滅／例外：その物・物権が第三者の権利の目的→消滅しない。取得原因が売買・相続・贈与等であること自体は例外の分岐点ではない。","important_points":"==民法179条本文は混同による消滅==／==第三者の権利の目的なら例外==／ア〜エ全て×／正しいものは0個。","trick_patterns":"[[WARN:取得原因の違い]]に目を奪われず第三者Cの抵当権を見る。[[WARN:原則だけで判断]]せず179条ただし書まで確認する。","memory_summary":"同一人に集まれば混同が原則。ただし第三者の権利があれば例外。売買・相続・代物弁済・贈与は全て×。","review_check_questions":"Q 混同の原則は何条？ A 民法179条。\nQ 混同で消えない典型例は？ A 第三者の権利の目的となっている場合。\nQ ア〜エの正しい個数は？ A 0個。","substatement_reasoning":"ア×：売買によるBの所有権取得でも、Cの抵当権が付着するため地上権は当然には消滅しない。\nイ×：相続も取得原因の違いだけで結論は変わらない。\nウ×：代物弁済でも同じ。\nエ×：贈与でも同じ。\nしたがって正しい記述は0個で、選択肢4「なし」。","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法179条（e-Gov）https://laws.e-gov.go.jp/law/129AC0000000089","marker_yellow_spans":"混同|第三者の権利|本文→ただし書|民法179条本文は混同による消滅|第三者の権利の目的なら例外","marker_red_spans":"取得原因の違い|原則だけで判断","marker_blue_spans":"民法179条2項","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"compound","choice_1_is_exam_answer":"false","choice_1_wrong_part":"一つ","choice_1_reason":"誤り。アからエまでのうち、正しい記述が一つあると数える肢ですが、アも含め全て誤りです。アは売買によってBが甲土地の所有権を取得すると地上権が消えるとします。しかし、既に設定・登記された地上権を前提に、後からCの抵当権が設定されています。民法179条1項ただし書により、第三者の権利の目的である場合には混同による消滅が妨げられます。","choice_1_corrected_statement":"正しい記述の数は一つではなく、なしである。","choice_1_legal_basis":"民法179条1項ただし書","choice_1_exam_tip":"[[WARN:取得原因の違い]]に目を奪われず第三者Cの抵当権を見る。[[WARN:原則だけで判断]]せず179条ただし書まで確認する。","choice_2_truth":"compound","choice_2_is_exam_answer":"false","choice_2_wrong_part":"二つ","choice_2_reason":"誤り。イの単独相続による所有権取得だけを特別に扱うことはできません。民法179条の混同消滅は、所有権が一人に集まる取得原因が相続か売買かでなく、第三者の権利が付着しているかで決まります。土地にはCの抵当権がありますから、Bが相続しても、地上権の存在を当然に消してしまうことはできません。正しい記述が二つという結論にはなりません。","choice_2_corrected_statement":"正しい記述の数は二つではなく、なしである。","choice_2_legal_basis":"民法179条1項ただし書","choice_2_exam_tip":"[[WARN:取得原因の違い]]に目を奪われず第三者Cの抵当権を見る。[[WARN:原則だけで判断]]せず179条ただし書まで確認する。","choice_3_truth":"compound","choice_3_is_exam_answer":"false","choice_3_wrong_part":"三つ","choice_3_reason":"誤り。ウの代物弁済によって所有権がBに帰属する場合も、既存のCの抵当権を無視して地上権が消滅するわけではありません。エの贈与についても同様です。売買・相続・代物弁済・贈与を一つずつ暗記するのではなく、民法179条本文とただし書を同じ順序で適用します。ア〜エが全て誤っている以上、正しいものが三つあるという肢は選べません。","choice_3_corrected_statement":"正しい記述の数は三つではなく、なしである。","choice_3_legal_basis":"民法179条1項ただし書","choice_3_exam_tip":"[[WARN:取得原因の違い]]に目を奪われず第三者Cの抵当権を見る。[[WARN:原則だけで判断]]せず179条ただし書まで確認する。","choice_4_truth":"compound","choice_4_is_exam_answer":"true","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。ア・イ・ウ・エは全部「所有権取得で地上権は消滅する」という内容ですが、甲土地には地上権の設定後にCの抵当権が登記されています。民法179条1項ただし書は、物または物権が第三者の権利の目的であるときは混同によって他の物権を消さないと規定しています。全四記述が誤りで、正しいものは==なし==なので選択肢4が公式正解です。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"民法179条1項","choice_4_exam_tip":"[[WARN:取得原因の違い]]に目を奪われず第三者Cの抵当権を見る。[[WARN:原則だけで判断]]せず179条ただし書まで確認する。"},{"question_id":"2024-Q07","year":2024,"session":"通常","question_no":7,"major_field":"権利関係","section":"民法","unit":"賃貸借","topic":"賃貸借・敷金・転貸","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"Ａを貸主、Ｂを借主として甲建物の賃貸借契約（以下この問において「本件契約」という。）が締結され、Ｂが甲建物の引渡しを受けた場合における次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choice_1":"ＣがＢに対し甲建物をＡから買受けたとの虚偽の話をしたので、これを信じたＢが甲建物の占有を任意にＣに移転した場合、ＡはＣに対して、占有回収の訴えにより甲建物の返還を請求することはできない。","choice_2":"Ｂが、Ａの甲建物への立ち入りを建物入り口を閉ざして拒んだときは、Ａは甲建物の間接占有が侵奪されたものとして、Ｂに対して、占有回収の訴えにより甲建物の返還を請求することができる。","choice_3":"Ｂが死亡して、ＤがＢを単独相続した場合、Ｄは相続開始を知るまでは、Ｂによる甲建物の占有を承継しない。","choice_4":"ＡとＢのいずれもが死亡した場合、本件契約は当然に終了する。","official_accepted_answers":"1","answer_conclusion":"《占有回収の訴え》は占有の侵奪を前提とします。詐欺を信じて任意に渡した場面は侵奪に当たりません。","answer_reason":"2024-Q07の公式解答は選択肢1。問題文の各条件を満たすかを4肢ごとに判断する。占有回収＝侵奪を前提とする／所有権に基づく返還＝所有権侵害を前提とする。賃貸人＝間接占有、賃借人＝直接占有。","scoring_exception_note":"","deep_lecture":"占有は、物を事実上支配する状態を法的に保護する制度である。賃借人Bが建物を直接支配していれば直接占有者、賃貸人Aは賃貸借に基づく[[NOTE:間接占有者]]となる。占有回収の訴え（民法200条）は、==占有を「侵奪」==されたときに占有の回復を求める特別の救済である。侵奪には占有者の意思に反して事実的支配を奪われることが必要で、騙されてでも本人が[[WARN:任意に占有を引き渡した]]場合には、直ちに侵奪が成立するとはいえない。これとは別に、詐欺を理由とする意思表示の取消し、契約上の返還請求、所有権に基づく物権的請求などの可能性を区別する。賃貸人が建物に入れてもらえないことだけで間接占有が当然失われるわけではない。相続では相続人が被相続人の占有を承継するため（896条、187条など）、知った時まで相続による占有移転が保留されるわけではない。また賃貸借の当事者が死亡しても契約上の地位は原則として承継される。占有訴権の「侵奪」と、物の所有権や契約上の返還請求の「権利」を混同しないことが本問の核心である。\n占有の保護は紛争当事者が実力行使で奪い合わないように事実的支配を守るのが目的である。そのため所有権の有無とは独立して占有訴権が成立するが、占有移転が任意か侵奪かは厳密に区別される。","system_purpose":"制度趣旨：占有は、物を事実上支配する状態を法的に保護する制度である。賃借人Bが建物を直接支配していれば直接占有者、賃貸人Aは賃貸借に基づく間接占有者となる。占有回収の訴え（民法200条）は、占有を「侵奪」されたときに占有の回復を求める特別の救済である。侵奪には占有者の意思に反して事実的支配を奪われることが必要で、騙されてでも本人が任意に占有を引き渡した場合には、直ちに侵奪が成立","practical_examples":"建物を借りているBが、所有者を騙るCに自分で鍵を渡した場合と、CがBを締め出して鍵を奪った場合では、占有の侵奪の有無が異なる。","advanced_knowledge":"占有回収は占有侵奪を知る・知らないにかかわらず一定の法定期間制限があり、第三者に対する行使の条件も別に定められる。","comparative_explanation":"占有回収＝侵奪を前提とする／所有権に基づく返還＝所有権侵害を前提とする。賃貸人＝間接占有、賃借人＝直接占有。","important_points":"①占有回収＝侵奪を前提とする／所有権に基づく返還＝所有権侵害を前提とする。賃貸人＝間接占有、賃借人＝直接占有。　②占有回収は占有侵奪を知る・知らないにかかわらず一定の法定期間制限があり、第三者に対する行使の条件も別に定められる。","trick_patterns":"(1)占有回収＝侵奪を前提とする／所有権に基づく返還＝所有権侵害を前提とする。賃貸人＝間接占有、賃借人＝直接占有。　(2)BはCの虚偽説明に惑わされていても、自ら鍵を渡すなど占有の移転を選んでいる。占有回収の訴えに必要な「侵奪」ではないため、Aが間接占有に基づいて同訴えを提起しても要件を欠く。この結論","memory_summary":"占有回収＝侵奪を前提とする／所有権に基づく返還＝所有権侵害を前提とする。賃貸人＝間接占有、賃借人＝直接占有。","review_check_questions":"Q.騙されて任意に占有を渡したら常に侵奪？→いいえ。|Q.相続人の占有承継には相続を知ることが必要？→不要。|Q.賃貸借は双方の死亡で当然終了？→原則しない。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法・特別法一次資料照合入口：https://laws.e-gov.go.jp/law/129AC0000000089 ; https://laws.e-gov.go.jp/law/403AC0000000090","marker_yellow_spans":"占有を「侵奪」","marker_red_spans":"任意に占有を引き渡した","marker_blue_spans":"間接占有者","qa_status":"REWORK","qa_issues":"肢別解説150字・詳細講義500字の文章量と構造は再点検済み。未検証の修正文案・全肢の法令適合・2026年の改正・原文逐字照合は残っているため、最終法令QAはREWORK。","question_text_verified":"false","choice_text_verified":"false","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/03/R6_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"true","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。Bが騙されても自分の意思で占有をCに移転したときは「侵奪」とはされず、Aが占有回収の訴えで取り戻すことはできません。\nBはCの虚偽説明に惑わされていても、自ら鍵を渡すなど占有の移転を選んでいる。占有回収の訴えに必要な「侵奪」ではないため、Aが間接占有に基づいて同訴えを提起しても要件を欠く。この結論はAに一切の救済手段がないことを意味しない。所有権・賃貸借・不法行為など他の根拠は別に検討する。","choice_1_corrected_statement":"原文どおりで正しい","choice_1_legal_basis":"民法200条・占有侵奪に関する判例","choice_1_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／占有回収＝侵奪を前提とする／所有権に基づく返還＝所有権侵害を前提とする。賃貸人＝間接占有、賃借人＝直接占有。","choice_2_truth":"false","choice_2_is_exam_answer":"false","choice_2_wrong_part":"間接占有が侵奪されたものとして","choice_2_reason":"誤り。賃借人Bが貸主Aの立入りを拒んだだけで、貸主Aの間接占有が直ちに侵奪されたことにはなりません。\n賃貸借ではBが通常の使用収益をする権利を持つので、貸主Aが自由に立ち入れるわけではない。Bが立入りを拒否したとしても、AとBの賃貸借関係による間接占有の基礎が直ちに失われるとは限らない。侵奪には占有の事実的支配を奪う行為が必要で、契約上の立入権の有無と同視するのが誤り。","choice_2_corrected_statement":"Ｂが、Ａの甲建物への立ち入りを建物入り口を閉ざして拒んだときは、Ａは甲建物の立入りを拒まれただけで直ちに侵奪とはならない、Ｂに対して、占有回収の訴えにより甲建物の返還を請求することができる。","choice_2_legal_basis":"民法200条・賃貸借の占有関係","choice_2_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／占有回収＝侵奪を前提とする／所有権に基づく返還＝所有権侵害を前提とする。賃貸人＝間接占有、賃借人＝直接占有。","choice_3_truth":"false","choice_3_is_exam_answer":"false","choice_3_wrong_part":"相続開始を知るまでは","choice_3_reason":"誤り。相続人は被相続人の占有を相続開始時に承継します。相続開始を知っていたかは要件ではありません。\nBの死亡による権利義務の包括承継は、相続人Dが相続開始を認識していることを要件としない。相続の開始によって占有も承継するので、占有訴権や取得時効の占有期間の検討では、被相続人の占有を引き継げることがある。ただしDが自分の占有と前主の占有を合わせて主張するときは前主の瑕疵も承継する。","choice_3_corrected_statement":"Ｂが死亡して、ＤがＢを単独相続した場合、Ｄは相続開始時から占有を承継する、Ｂによる甲建物の占有を承継しない。","choice_3_legal_basis":"民法187条・896条","choice_3_exam_tip":"個別化未完了。設問全体の注意点はひっかけ対策欄を参照。／占有回収＝侵奪を前提とする／所有権に基づく返還＝所有権侵害を前提とする。賃貸人＝間接占有、賃借人＝直接占有。","choice_4_truth":"false","choice_4_is_exam_answer":"false","choice_4_wrong_part":"当然に終了する","choice_4_reason":"誤り。当事者の死亡だけで賃貸借が当然終了するわけではなく、原則として相続人が契約上の地位を承継します。\n死亡は賃貸借の一般的な当然終了事由ではない。A側の賃貸人地位もB側の賃借人地位も、通常は各相続人に承継され、賃料支払義務や目的物使用権も続く。期間満了、解除、合意解約など
