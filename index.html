:"原文どおりで正しい","choice_3_legal_basis":"民法249条・252条・255条・256条・258条（当該肢と条文の個別照合は要確認）","choice_3_exam_tip":"「持ち主がいない財産＝国庫」を共有持分の放棄にそのまま当てはめない。｜正しい。持分が相続された後、共同相続人と他の共有者の間で共有物分割を求められる場合があります。設問のB・Cは遺産分割前でもE・Fに対し分割の訴えが可能です。\nが済んでいなくても、遺産外の共有者が共有物分割訴訟を提起することが直ちに排除されるわけではない。遺産分割と共有物分割を混同しない。\nが済んでいなくても、遺産外の共有者が共有物分割訴訟を提起することが直ちに排除されるわけではない。遺産分割と共有物分割を混同しない。\nが済んでいなくても、遺産外の共有者が共有物分割訴訟を提起することが直ちに排除されるわけではない。遺産分割と共有物分割を混同しない。","choice_4_truth":"true","choice_4_is_exam_answer":"false","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。Aも共有持分を持つため、Bの持分だけを理由にAへ土地全部の明渡しを当然に要求できるわけではありません。\n【本肢の根拠・注意点】Aも共有権を持っているので、Aが土地を占有している事実だけで無権限占有とはいえない。他の共有者BはAへ当然に土地全部を自己へ明け渡せと請求できない。共有物の利用調整や持分に応じた利益の問題として検討する。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"民法249条・252条・255条・256条・258条（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"「持ち主がいない財産＝国庫」を共有持分の放棄にそのまま当てはめない。｜正しい。Aも共有持分を持つため、Bの持分だけを理由にAへ土地全部の明渡しを当然に要求できるわけではありません。\nいえない。他の共有者BはAへ当然に土地全部を自己へ明け渡せと請求できない。共有物の利用調整や持分に応じた利益の問題として検討する。\nいえない。他の共有者BはAへ当然に土地全部を自己へ明け渡せと請求できない。共有物の利用調整や持分に応じた利益の問題として検討する。\nいえない。他の共有者BはAへ当然に土地全部を自己へ明け渡せと請求できない。共有物の利用調整や持分に応じた利益の問題として検討する。"},{"question_id":"2025-Q09","year":2025,"session":"通常","question_no":9,"major_field":"権利関係","section":"民法","unit":"連帯債務","topic":"履行請求・混同・相殺・更改の効力","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"連帯債務者の一人について生じた次の事由のうち、民法の規定によれば、他の連帯債務者に対して効力が生じないものとして正しいものはどれか。なお、この問において、連帯債務者の一人について生じた事由が他の連帯債務者に対して効力が生じる旨の別段の意思表示はないものとする。","choice_1":"債権者がした連帯債務者の一人に対する履行の請求","choice_2":"連帯債務者の一人と債権者との間の混同","choice_3":"連帯債務者の一人が債権者に対して債権を有する場合において、その連帯債務者がした相殺の援用","choice_4":"連帯債務者の一人と債権者との間の更改","official_accepted_answers":"1","answer_conclusion":"連帯債務者の1人への《履行請求》は原則として他の連帯債務者に効力が及びません。肢1が正しい。","answer_reason":"【結論】1。設問は「他の連帯債務者に効力が生じない事由」を尋ねている。連帯債務者Aへの履行請求は原則としてAに対してのみ効力を生じ、他のBには及ばない（民法441条）。一方、混同（440条）、連帯債務者自身による相殺の援用（439条1項）、更改（438条）は、いずれも他の連帯債務者に影響する法定例外である。したがって、他の連帯債務者に効力が生じないのは肢1だけである。","scoring_exception_note":"","deep_lecture":"【制度の全体像】連帯債務とは、複数の債務者が同じ内容の給付について、各自が全部を履行する義務を負う関係である。債権者は債務者の一人または複数に対して請求できるが、「一人に請求できる」ことと「請求行為の効果が他の人にも及ぶ」ことは同じではない。【原則】民法441条本文は、一人の連帯債務者について生じた事由の効果は、原則として他の債務者には及ばないと定めている。これが相対的効力である。したがって、Aへの履行請求だけでBに対する請求の効果を生じさせることはできない。各人の時効管理も別々に考える必要がある。【例外①更改】438条によって、債権者とAの間で更改が成立すると、従前の債権は全員の利益のために消滅する。債務の内容を置き換える契約である点が、単なる請求と違う。【例外②相殺】439条1項によって、Aが債権者に対して持つ反対債権を使い相殺を援用すると、その範囲で他の連帯債務者にも共同免責が及ぶ。援用前には、同条2項により別の連帯債務者がAの負担部分の限度で履行拒絶できる場面があるので、援用済みか未援用かを必ず読む。【例外③混同】440条により、Aと債権者の地位が同一人に帰属した場合はAが弁済したものとみなされ、他の連帯債務者にも効力が生じる。【別段の意思表示】441条ただし書は、債権者と他の連帯債務者との間に別段の意思表示がある場合の効力を認める。本問ではこれがないと明記されているため考慮しない。【考え方の手順】①設問が「効力が及ぶ／及ばない」のどちらを問うか確認する。②更改・相殺の援用・混同を見つけたら法定の例外として処理する。③それ以外は相対効が基本。④当事者の別段の意思表示の有無を確認する。","system_purpose":"連帯債務者間で他人の請求や債務関係の変更を無限定に波及させることを防ぎ、債権消滅に結びつく典型事由だけを法定の例外として統一処理する制度設計である。","practical_examples":"銀行がA・Bを連帯債務者として1,000万円を貸した。銀行がAだけに返済請求をしてもBへの請求の効力にはならない。他方、Aが銀行に対する100万円の反対債権を使って適法に相殺すれば、その範囲でBも債務を免れる。","advanced_knowledge":"[[NOTE:439条2項は相殺未援用時の履行拒絶を規定する。]] Aに反対債権があるだけの場合とAが相殺の意思表示をした場合を区別する。また441条ただし書の別段の意思表示があると原則が修正され得る。","comparative_explanation":"【相対効】一人への履行請求（441条）。【絶対効】更改（438条）、相殺の援用（439条1項）、混同（440条）。【例外的な別段の意思表示】441条ただし書。","important_points":"==履行請求は相対効==｜==更改・相殺の援用・混同は原則として他の連帯債務者にも効力が及ぶ==｜==相殺「未援用」なら439条2項も確認==","trick_patterns":"[[WARN:「全額支払義務」と「一人への請求の効力」を混同させる]]｜相殺「することができる」と「相殺を援用した」を入れ替える｜旧法時代の請求の絶対効と現行法の相対効を混同させる","memory_summary":"1人への請求＝相対効。更改438、相殺439、混同440＝法定の絶対効。原則441、例外に別段の意思表示。","review_check_questions":"Q1: Aだけへの履行請求はBにも効力が及ぶか？ A: 原則及ばない（441条）。｜Q2: Aが相殺を援用した場合は？ A: 相殺された限度で他の連帯債務者にも効力が及ぶ（439条1項）。｜Q3: 更改と混同の根拠条文は？ A: 438条・440条。","substatement_reasoning":"","reform_status":"none_confirmed","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法438条・439条1項2項・440条・441条（e-Gov法令検索） https://laws.e-gov.go.jp/law/129AC0000000089 | e-Gov 民法 https://laws.e-gov.go.jp/law/129AC0000000089 | https://laws.e-gov.go.jp/law/129AC0000000089","marker_yellow_spans":"履行請求は相対効|更改・相殺の援用・混同は原則として他の連帯債務者にも効力が及ぶ|相殺「未援用」なら439条2項も確認","marker_red_spans":"「全額支払義務」と「一人への請求の効力」を混同させる","marker_blue_spans":"439条2項は相殺未援用時の履行拒絶を規定する。","qa_status":"PASS","qa_issues":"","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"true","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"conditional","choice_1_is_exam_answer":"true","choice_1_wrong_part":"該当なし","choice_1_reason":"肢1は本問の正解である。債権者が連帯債務者Aに履行を請求しても、連帯債務者Bに対してまで請求したのと同じ扱いにはならない。民法441条本文は、同438条・439条1項・440条の例外を除いて相対的効力を原則とするためである。例えばAだけに催告・訴訟上の請求をしたとき、それを理由としてBの消滅時効に当然に同じ効果が生ずるわけではない。設問は「別段の意思表示なし」と明記しているので、441条ただし書の例外による拡張も考えない。連帯債務者が全額支払義務を負うことと、個別の請求の効力が全員に及ぶかは別論点である。","choice_1_corrected_statement":"原文どおりで正しい（設問条件に該当する）。","choice_1_legal_basis":"民法441条（相対的効力の原則）｜https://laws.e-gov.go.jp/law/129AC0000000089","choice_1_exam_tip":"履行請求は相対効。ただし、441条ただし書の別段の意思表示に注意。","choice_2_truth":"conditional","choice_2_is_exam_answer":"false","choice_2_wrong_part":"該当なし（記述は事由名であり、文としての誤りではない）","choice_2_reason":"肢2は正解とはならない。混同とは、債権者と連帯債務者の地位が同一人に帰属することをいう。民法440条は、この場合、その連帯債務者を弁済したものとみなしている。したがって、Aと債権者の間で混同が生じれば、他の連帯債務者Bにも共同免責の効果が及ぶ。これは履行の請求と異なり、債権関係の消滅に直接結び付く法定の例外である。例えばAが債権者の地位を相続したときは、単なる請求があった場合と結論が異なる。「混同＝相対効」と取り違えないこと。元の肢が述べる事由そのものは存在し得るが、本問で問う「効力が生じないもの」には該当しない。","choice_2_corrected_statement":"本問で他の連帯債務者に効力が及ばない事由は「履行の請求」。本肢の事由には法定の絶対効がある。","choice_2_legal_basis":"民法440条（混同）｜https://laws.e-gov.go.jp/law/129AC0000000089","choice_2_exam_tip":"混同は440条：弁済したものとみなす。","choice_3_truth":"conditional","choice_3_is_exam_answer":"false","choice_3_wrong_part":"該当なし（記述は事由名であり、文としての誤りではない）","choice_3_reason":"肢3は正解とはならない。民法439条1項によれば、連帯債務者Aが債権者に対する自己の債権を持ち、有効に相殺を援用したとき、対象債権は全連帯債務者の利益のために消滅する。したがって、相殺された範囲でBも債務を免れる。単にAに反対債権が存在しているだけの段階と、Aが相殺を援用した後とは区別しなければならない。未援用なら同条2項の別ルールが問題となる。選択肢は明確に「その連帯債務者がした相殺の援用」と書いているため、1項の絶対的効力に該当する。「相殺は常に一人だけに効く」という理解は誤りである。","choice_3_corrected_statement":"本問で他の連帯債務者に効力が及ばない事由は「履行の請求」。本肢の事由には法定の絶対効がある。","choice_3_legal_basis":"民法439条1項（相殺の援用）｜https://laws.e-gov.go.jp/law/129AC0000000089","choice_3_exam_tip":"439条は相殺の援用済み／未援用で効果を区別。","choice_4_truth":"conditional","choice_4_is_exam_answer":"false","choice_4_wrong_part":"該当なし（記述は事由名であり、文としての誤りではない）","choice_4_reason":"肢4は正解とはならない。更改は従前の債務を消滅させ、新たな債務を成立させる契約上の事由である。民法438条は、債権者と連帯債務者Aの間で更改があった場合、従前の債権が全連帯債務者の利益のために消滅すると定める。つまり、Aとの更改による旧債権の消滅は、他のBにも効果が及ぶ。履行請求は既存の債権を行使するだけだが、更改では債権自体の内容・存否が変わる。両者を同じ「Aにだけ生じた出来事」として一括判定しないこと。設問が求める「他の債務者に効力が生じない」事由には該当しない。","choice_4_corrected_statement":"本問で他の連帯債務者に効力が及ばない事由は「履行の請求」。本肢の事由には法定の絶対効がある。","choice_4_legal_basis":"民法438条（更改）｜https://laws.e-gov.go.jp/law/129AC0000000089","choice_4_exam_tip":"更改は438条：旧債権は全員の利益のために消滅。"},{"question_id":"2025-Q10","year":2025,"session":"通常","question_no":10,"major_field":"権利関係","section":"民法・宅建業法","unit":"契約不適合責任","topic":"通知期間・免責特約・業者売主の規制","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"Ａを売主、Ｂを買主とする甲土地の売買契約による甲土地の引渡し後に、目的物の品質に関して契約の内容に適合しない土壌汚染が見つかった場合の売主の担保の責任（以下この問において「契約不適合責任」という。）に基づく損害賠償に関する次の記述のうち、民法の規定、宅地建物取引業法の規定及び判例によれば、誤っているものはどれか。","choice_1":"Ｂは、甲土地の引渡しの日から11 年が経過した時点で甲土地の土壌汚染を発見し、発見した時点から1 年以内にＡに通知した。Ａが当該土壌汚染があることを重大な過失なく知らなかった場合、Ａが宅地建物取引業者であるか否かにかかわらず、Ｂは損害賠償を請求することはできない。","choice_2":"甲土地の引渡しの日から3 年以内に契約不適合の通知をしなければ売主は契約不適合責任を負わない旨の特約があり、Ｂが引渡しの日から4 年が経過した時点で土壌汚染を発見して直ちにＡに通知した。Ａが当該土壌汚染があることを重大な過失なく知らなかった場合、Ａが宅地建物取引業者であるか否かにかかわらず、Ｂは損害賠償を請求することはできない。","choice_3":"甲土地の引渡しの日から1 年以内に契約不適合の通知をしなければ売主は契約不適合責任を負わない旨の特約があり、Ａは甲土地に土壌汚染があることを売買契約締結時点で知っていて告げていなかった。Ｂが引渡しの日から3 年が経過した時点で当該土壌汚染を発見して直ちにＡに通知した場合、Ａが宅地建物取引業者であるか否かによって、Ｂが損害賠償を請求できるか否かの結論が異なる。","choice_4":"売主は契約不適合責任を一切負わない旨の特約があり、Ｂは引渡しの日から1 年が経過した時点で土壌汚染を発見して直ちにＡに通知した。Ａが当該土壌汚染があることを重大な過失なく知らなかった場合、Ａが宅地建物取引業者であるか否かによって、Ｂが損害賠償を請求できるか否かの結論が異なる。","official_accepted_answers":"3","answer_conclusion":"特約があっても、《知りながら告げなかった不適合》について売主は免責されません。肢3が誤り。","answer_reason":"【結論】特約があっても、《知りながら告げなかった不適合》について売主は免責されません。肢3が誤り。\n【解き方】契約不適合責任では、売主の目的物が契約内容に適合しているかをまず判定し、買主の権利行使の種類と期間を分けて考える。品質の不適合を知った買主の通知期間と、損害賠償請求権の消滅時効は同じ制度ではない。期間内に通知すれば永久に請求できるというものではなく、一般的な債権の時効も検討する。また売主が知りながら告げなかった事情については免責特約では責任を免れない。業者が","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】契約不適合責任では、売主の目的物が契約内容に適合しているかをまず判定し、買主の権利行使の種類と期間を分けて考える。品質の不適合を知った買主の通知期間と、損害賠償請求権の消滅時効は同じ制度ではない。期間内に通知すれば永久に請求できるというものではなく、一般的な債権の時効も検討する。また売主が知りながら告げなかった事情については免責特約では責任を免れない。業者が自ら売主で買主が非業者である売買には宅建業法40条の特約制限が重なり、私人間売買と結論が変わる場合がある。\n【本問への当てはめ】契約不適合では《買主が知った時から1年以内の通知》と《権利の消滅時効》は別の時計です。売主の故意・重過失や知って告げない事実については、期間特約や免責特約がどう作用するかが変わります。宅建業法40条は業者売主・一般買主の取引に関する追加保護です。\n【判断順序・類題への対応】「不適合を知った時から1年」の通知と一般消滅時効／業者売主の最低2年の通知特約／知りながら告げない売主の免責不可を区別する。\n【具体的な当てはめ】土壌汚染が引渡し3年後に分かり、売主が契約前から知って隠していた場合、引渡しから1年の特約だけで請求を切り捨てられるとは限らない。 ","system_purpose":"制度の趣旨：契約不適合責任では、売主の目的物が契約内容に適合しているかをまず判定し、買主の権利行使の種類と期間を分けて考える。品質の不適合を知った買主の通知期間と、損害賠償請求権の消滅時効は同じ制度ではない。期間内に通知すれば永久に請求できるというものではなく、一般的な債権の時効も検討する。また売主が知りながら告げなかった事情については免責特約では責任を免れない。業者が自ら売主で買主が非業","practical_examples":"【具体例】土壌汚染が引渡し3年後に分かり、売主が契約前から知って隠していた場合、引渡しから1年の特約だけで請求を切り捨てられるとは限らない。","advanced_knowledge":"【周辺・発展】契約不適合では《買主が知った時から1年以内の通知》と《権利の消滅時効》は別の時計です。売主の故意・重過失や知って告げない事実については、期間特約や免責特約がどう作用するかが変わります。宅建業法40条は業者売主・一般買主の取引に関する追加保護です。\n[[NOTE:「不適合を知った時から1年」の通知と一般消滅時効／業者売主の最低2年の通知特約／知りながら告げない売主の免責不可を区別する。]]","comparative_explanation":"「不適合を知った時から1年」の通知と一般消滅時効／業者売主の最低2年の通知特約／知りながら告げない売主の免責不可を区別する。","important_points":"==通知1年と消滅時効を区別／知りながら告げない売主は免責不可／業者売主なら40条。==","trick_patterns":"「通知さえすればいつでも請求できる」「免責特約は万能」と思わない。｜本問特有の誤誘導：特約があっても、《知りながら告げなかった不適合》について売主は免責されません。肢3が誤り。\n【誤答注意】設問中の [[WARN:宅地建物取引業者であるか否かによって]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"通知1年と消滅時効を区別／知りながら告げない売主は免責不可／業者売主なら40条。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 3。\nQ2: 本問の主要な判断要件は何か？ A2: 「不適合を知った時から1年」の通知と一般消滅時効／業者売主の最低2年の通知特約／知りながら告げない売主の免責不可を区別する。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法166条・415条・566条・572条、宅地建物取引業法40条 | 民法166条・566条・572条 / 宅地建物取引業法40条 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"通知1年と消滅時効を区別／知りながら告げない売主は免責不可／業者売主なら40条。","marker_red_spans":"宅地建物取引業者であるか否かによって","marker_blue_spans":"「不適合を知った時から1年」の通知と一般消滅時効／業者売主の最低2年の通知特約／知りながら告げない売主の免責不可を区別する。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"false","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。損害賠償請求権には消滅時効の制限があり、引渡し後11年経過の本事例では権利行使が認められません。通知を1年内にしても時効が自動で延びるわけではありません。\n【本肢の根拠・注意点】買主が不適合を知って1年内に通知しても、損害賠償請求権そのものの消滅時効が完成する場合がある。引渡しから11年も経過した本肢では、民法166条の客観的起算点等を検討する。通知制度と一般債権の時効は重なる別の制約である。","choice_1_corrected_statement":"原文どおりで正しい","choice_1_legal_basis":"民法166条・415条・566条・572条、宅地建物取引業法40条（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"「通知さえすればいつでも請求できる」「免責特約は万能」と思わない。｜正しい。損害賠償請求権には消滅時効の制限があり、引渡し後11年経過の本事例では権利行使が認められません。通知を1年内にしても時効が自動で延びるわけではありません。\nある。引渡しから11年も経過した本肢では、民法166条の客観的起算点等を検討する。通知制度と一般債権の時効は重なる別の制約である。\nある。引渡しから11年も経過した本肢では、民法166条の客観的起算点等を検討する。通知制度と一般債権の時効は重なる別の制約である。\nある。引渡しから11年も経過した本肢では、民法166条の客観的起算点等を検討する。通知制度と一般債権の時効は重なる別の制約である。","choice_2_truth":"true","choice_2_is_exam_answer":"false","choice_2_wrong_part":"該当なし","choice_2_reason":"正しい。引渡しから3年以内に通知する特約が有効な状況では、4年後の発見・通知では責任を追及できません。宅建業者売主の場合でも、買主に民法より不利でない一定の期間特約には例外があります。\n【本肢の根拠・注意点】売主が土壌汚染を知らず重大な過失もないという事実を踏まえると、特約で「引渡し後3年以内」とした通知期限を超える4年後の通知では買主は責任追及できない。業者売主の場合でも買主を保護する最低期間との関係で適法性を判定する。","choice_2_corrected_statement":"原文どおりで正しい","choice_2_legal_basis":"民法166条・415条・566条・572条、宅地建物取引業法40条（当該肢と条文の個別照合は要確認）","choice_2_exam_tip":"「通知さえすればいつでも請求できる」「免責特約は万能」と思わない。｜正しい。引渡しから3年以内に通知する特約が有効な状況では、4年後の発見・通知では責任を追及できません。宅建業者売主の場合でも、買主に民法より不利でない一定の期間特約には例外があります。\nとした通知期限を超える4年後の通知では買主は責任追及できない。業者売主の場合でも買主を保護する最低期間との関係で適法性を判定する。\nとした通知期限を超える4年後の通知では買主は責任追及できない。業者売主の場合でも買主を保護する最低期間との関係で適法性を判定する。\nとした通知期限を超える4年後の通知では買主は責任追及できない。業者売主の場合でも買主を保護する最低期間との関係で適法性を判定する。","choice_3_truth":"false","choice_3_is_exam_answer":"true","choice_3_wrong_part":"宅地建物取引業者であるか否かによって","choice_3_reason":"誤り（正解肢）。Aが土壌汚染を《知って告げなかった》場合、民法572条により免責特約で責任を免れません。宅建業者かどうかで結論が変わる、とする点が誤りです。\n【本肢の根拠・注意点】知りながら告げなかった土壌汚染については、売主は免責・責任制限の特約を盾にできない。私人か宅建業者かによってこの点の結論が当然に異なるわけではなく、民法572条の例外を先に見る。「告知しなかった事実」が核心。","choice_3_corrected_statement":"売主Aが不適合を知りながら告げなかった場合、民法572条により免責特約で責任を免れず、宅建業者か否かによって当然に結論が分かれるわけではない。","choice_3_legal_basis":"民法166条・415条・566条・572条、宅地建物取引業法40条（当該肢と条文の個別照合は要確認）","choice_3_exam_tip":"「通知さえすればいつでも請求できる」「免責特約は万能」と思わない。｜誤り（正解肢）。Aが土壌汚染を《知って告げなかった》場合、民法572条により免責特約で責任を免れません。宅建業者かどうかで結論が変わる、とする点が誤りです。\nない。私人か宅建業者かによってこの点の結論が当然に異なるわけではなく、民法572条の例外を先に見る。「告知しなかった事実」が核心。\nない。私人か宅建業者かによってこの点の結論が当然に異なるわけではなく、民法572条の例外を先に見る。「告知しなかった事実」が核心。\nない。私人か宅建業者かによってこの点の結論が当然に異なるわけではなく、民法572条の例外を先に見る。「告知しなかった事実」が核心。\nひっかけ箇所：[[WARN:宅地建物取引業者であるか否かによって]]。正しい内容：==任を免れず、宅建業者か否かによって当然に結論が分かれるわけではない。==。","choice_4_truth":"true","choice_4_is_exam_answer":"false","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。知らなかった売主が私人なら免責特約が有効となる余地がありますが、宅建業者が自ら売主となり非業者に売る場合には宅建業法40条の制限が問題になります。\n【本肢の根拠・注意点】契約不適合責任を一切負わない特約は私人間売買では原則有効となる余地があるが、業者売主・非業者買主の取引では宅建業法40条の不利な特約の制限に抵触し得る。民法572条で告知義務違反がない場合でも、宅建業法の強行的な保護が重なる。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"民法166条・415条・566条・572条、宅地建物取引業法40条（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"「通知さえすればいつでも請求できる」「免責特約は万能」と思わない。｜正しい。知らなかった売主が私人なら免責特約が有効となる余地がありますが、宅建業者が自ら売主となり非業者に売る場合には宅建業法40条の制限が問題になります。\nの取引では宅建業法40条の不利な特約の制限に抵触し得る。民法572条で告知義務違反がない場合でも、宅建業法の強行的な保護が重なる。\nの取引では宅建業法40条の不利な特約の制限に抵触し得る。民法572条で告知義務違反がない場合でも、宅建業法の強行的な保護が重なる。\nの取引では宅建業法40条の不利な特約の制限に抵触し得る。民法572条で告知義務違反がない場合でも、宅建業法の強行的な保護が重なる。"},{"question_id":"2025-Q11","year":2025,"session":"通常","question_no":11,"major_field":"権利関係","section":"借地借家法","unit":"借地権","topic":"対抗要件・定期借地・事業用定期借地","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"ＡがＢとの間で、Ａ所有の甲土地につき建物の所有を目的として一時使用目的ではない賃貸借契約（以下この問において「本件契約」という。）を締結する場合に関する次の記述のうち、借地借家法の規定及び判例によれば、正しいものはどれか。","choice_1":"甲土地にＢが賃借権の登記をしなくても、Ｂの配偶者であるＣを所有者として登記されている建物が甲土地上に存在する場合には、甲土地がＡからＤに売却されても、ＢはＤに対して甲土地に賃借権を有していることを主張できる。","choice_2":"本件契約の存続期間が50 年であり、契約の更新及び建物の築造による存続期間の延長がない旨を定める場合、一定期間地代を減額せず、その期間は地代の減額請求ができない旨の特約を有効に定めることができる。","choice_3":"本件契約が専らＢの事業の用に供する建物の所有を目的とし、存続期間が50 年である場合、契約の更新及び建物の築造による存続期間の延長がない旨、並びにＢが借地借家法第13 条の規定による建物の買取りの請求をしない旨の特約を書面で有効に定めることができる。","choice_4":"本件契約が公正証書によって行われていれば、専らＢの居住の用に供する建物の所有を目的とし、存続期間を20 年と定めていても、Ａは正当事由があれば、20 年が経過した時点で遅滞なく異議を述べて更新を拒絶することができる。","official_accepted_answers":"3","answer_conclusion":"50年以上の《一般定期借地権》は書面で更新なし等を定められます。肢3が正しい。","answer_reason":"【結論】50年以上の《一般定期借地権》は書面で更新なし等を定められます。肢3が正しい。\n【解き方】借地借家法の借地権は建物所有を目的とする地上権・土地賃借権で、普通借地権か定期借地権かが中心となる。普通借地権は初回存続期間が原則30年以上で、更新の制度がある。一般定期借地権は50年以上の存続期間を定め、更新・建物再築による延長・建物買取請求をしない特約を書面ですることができる。事業用定期借地権等は用途・期間・方式が別で、単に事業用の建物であるというだけで","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】借地借家法の借地権は建物所有を目的とする地上権・土地賃借権で、普通借地権か定期借地権かが中心となる。普通借地権は初回存続期間が原則30年以上で、更新の制度がある。一般定期借地権は50年以上の存続期間を定め、更新・建物再築による延長・建物買取請求をしない特約を書面ですることができる。事業用定期借地権等は用途・期間・方式が別で、単に事業用の建物であるというだけで方式を取り違えない。土地賃借権の対抗要件としては借地権者自身の建物登記が重要であり、配偶者名義の建物で足りると考えない。地代減額請求に反する特約の有効性も別途検討する。\n【本問への当てはめ】借地権は、通常借地権（初回は原則30年以上）、一般定期借地権（50年以上・書面で特約）、事業用定期借地権（事業用建物が目的・期間により方式が異なる）に分けます。設問に「50年」とある場合、《一般定期借地権》をまず検討し、事業用と書かれていても排除しないことが大切です。\n【判断順序・類題への対応】普通借地30年以上／一般定期借地50年以上・書面／事業用定期借地は公正証書などの別要件／借地上建物登記の名義を区別する。","system_purpose":"制度の趣旨：借地借家法の借地権は建物所有を目的とする地上権・土地賃借権で、普通借地権か定期借地権かが中心となる。普通借地権は初回存続期間が原則30年以上で、更新の制度がある。一般定期借地権は50年以上の存続期間を定め、更新・建物再築による延長・建物買取請求をしない特約を書面ですることができる。事業用定期借地権等は用途・期間・方式が別で、単に事業用の建物であるというだけで方式を取り違えない。","practical_examples":"【具体例】借地人Bが50年の定期借地で事務所を建てる場合、一般定期借地権の書面特約の要件を満たすかを確かめる。","advanced_knowledge":"【周辺・発展】借地権は、通常借地権（初回は原則30年以上）、一般定期借地権（50年以上・書面で特約）、事業用定期借地権（事業用建物が目的・期間により方式が異なる）に分けます。設問に「50年」とある場合、《一般定期借地権》をまず検討し、事業用と書かれていても排除しないことが大切です。\n[[NOTE:普通借地30年以上／一般定期借地50年以上・書面／事業用定期借地は公正証書などの別要件／借地上建物登記の名義を区別する。]]","comparative_explanation":"普通借地30年以上／一般定期借地50年以上・書面／事業用定期借地は公正証書などの別要件／借地上建物登記の名義を区別する。","important_points":"==普通借地権は初回30年／一般定期借地権は50年以上／更新等の不適用は書面が頻出。==","trick_patterns":"「事業用」と書かれたら必ず「事業用定期借地権」と決めつけるのは誤り。期間を確認。｜本問特有の誤誘導：50年以上の《一般定期借地権》は書面で更新なし等を定められます。肢3が正しい。\n【誤答注意】設問中の [[WARN:配偶者であるＣを所有者として]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"普通借地権は初回30年／一般定期借地権は50年以上／更新等の不適用は書面が頻出。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 3。\nQ2: 本問の主要な判断要件は何か？ A2: 普通借地30年以上／一般定期借地50年以上・書面／事業用定期借地は公正証書などの別要件／借地上建物登記の名義を区別する。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"借地借家法3条・10条・11条・13条・22条・23条 | 借地借家法3条・10条・11条・22条 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"普通借地権は初回30年／一般定期借地権は50年以上／更新等の不適用は書面が頻出。","marker_red_spans":"配偶者であるＣを所有者として","marker_blue_spans":"普通借地30年以上／一般定期借地50年以上・書面／事業用定期借地は公正証書などの別要件／借地上建物登記の名義を区別する。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"配偶者であるＣを所有者として","choice_1_reason":"誤り。土地賃借権の対抗には原則登記が必要ですが、借地人《本人名義》で登記された土地上の建物があれば借地借家法10条による対抗が可能です。配偶者名義だけでは原則足りません。\n【本肢の根拠・注意点】借地借家法10条による対抗は、借地権者が土地上に自己名義で登記した建物を所有していることが基礎になる。Bの配偶者Cの登記名義では、B自身の借地権を新所有者Dに対抗できると直ちにはいえない。建物の所有者と借地権者の同一性に注意。","choice_1_corrected_statement":"借地上の建物に借地権者B自身の所有権登記がある場合には、賃借権登記がなくても借地権を第三者に対抗できる。","choice_1_legal_basis":"借地借家法3条・10条・11条・13条・22条・23条（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"「事業用」と書かれたら必ず「事業用定期借地権」と決めつけるのは誤り。期間を確認。｜誤り。土地賃借権の対抗には原則登記が必要ですが、借地人《本人名義》で登記された土地上の建物があれば借地借家法10条による対抗が可能です。配偶者名義だけでは原則足りません。\nなる。Bの配偶者Cの登記名義では、B自身の借地権を新所有者Dに対抗できると直ちにはいえない。建物の所有者と借地権者の同一性に注意。\nなる。Bの配偶者Cの登記名義では、B自身の借地権を新所有者Dに対抗できると直ちにはいえない。建物の所有者と借地権者の同一性に注意。\nなる。Bの配偶者Cの登記名義では、B自身の借地権を新所有者Dに対抗できると直ちにはいえない。建物の所有者と借地権者の同一性に注意。\nひっかけ箇所：[[WARN:配偶者であるＣを所有者として]]。正しい内容：==登記がある場合には、賃借権登記がなくても借地権を第三者に対抗できる。==。","choice_2_truth":"false","choice_2_is_exam_answer":"false","choice_2_wrong_part":"その期間は地代の減額請求ができない","choice_2_reason":"誤り。50年以上の一般定期借地権でも、地代等の減額請求をあらかじめ全面排除する特約は有効とはなりません。増減額請求の制約を混同しないこと。\n【本肢の根拠・注意点】地代等の減額請求は周辺経済事情や土地価格等の変動を受けて法律が認める制度で、一般の普通借地・定期借地でも一律に不行使特約が効力を持つわけではない。地代増額を一定期間行わない特約の扱いとも取り違えない。","choice_2_corrected_statement":"地代減額請求権を排除する特約の効力は借地借家法11条の制約を受ける。","choice_2_legal_basis":"借地借家法3条・10条・11条・13条・22条・23条（当該肢と条文の個別照合は要確認）","choice_2_exam_tip":"「事業用」と書かれたら必ず「事業用定期借地権」と決めつけるのは誤り。期間を確認。｜誤り。50年以上の一般定期借地権でも、地代等の減額請求をあらかじめ全面排除する特約は有効とはなりません。増減額請求の制約を混同しないこと。\n度で、一般の普通借地・定期借地でも一律に不行使特約が効力を持つわけではない。地代増額を一定期間行わない特約の扱いとも取り違えない。\n度で、一般の普通借地・定期借地でも一律に不行使特約が効力を持つわけではない。地代増額を一定期間行わない特約の扱いとも取り違えない。\n度で、一般の普通借地・定期借地でも一律に不行使特約が効力を持つわけではない。地代増額を一定期間行わない特約の扱いとも取り違えない。\nひっかけ箇所：[[WARN:その期間は地代の減額請求ができない]]。正しい内容：==地代減額請求権を排除する特約の効力は借地借家法11条の制約を受ける。==。","choice_3_truth":"true","choice_3_is_exam_answer":"true","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい。存続期間を50年以上とする一般定期借地権では、書面で《更新なし・建物築造による期間延長なし・建物買取請求なし》を定められます。事業用建物であっても50年なら利用できます。\n【本肢の根拠・注意点】50年以上という期間で更新や再築による延長、建物買取請求をしない特約を書面で設けるのは一般定期借地権の制度である。専ら事業用の建物でも一般定期借地権の要件を満たすことはでき、事業用定期借地権とだけ決めつけない。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"借地借家法3条・10条・11条・13条・22条・23条（当該肢と条文の個別照合は要確認）","choice_3_exam_tip":"「事業用」と書かれたら必ず「事業用定期借地権」と決めつけるのは誤り。期間を確認。｜正しい。存続期間を50年以上とする一般定期借地権では、書面で《更新なし・建物築造による期間延長なし・建物買取請求なし》を定められます。事業用建物であっても50年なら利用できます。\nるのは一般定期借地権の制度である。専ら事業用の建物でも一般定期借地権の要件を満たすことはでき、事業用定期借地権とだけ決めつけない。\nるのは一般定期借地権の制度である。専ら事業用の建物でも一般定期借地権の要件を満たすことはでき、事業用定期借地権とだけ決めつけない。\nるのは一般定期借地権の制度である。専ら事業用の建物でも一般定期借地権の要件を満たすことはでき、事業用定期借地権とだけ決めつけない。","choice_4_truth":"false","choice_4_is_exam_answer":"false","choice_4_wrong_part":"存続期間を20 年と定めていても","choice_4_reason":"誤り。通常の借地権は期間を20年と約束しても、初回期間は原則30年に引き上げられます。公正証書にしただけで20年の普通借地権を有効化できません。\n【本肢の根拠・注意点】公正証書の形式を採用しただけでは、普通借地権の初回期間に関する30年以上という法の規律を外せない。20年を定めた住宅用借地でも普通借地権の期間規制が及ぶため、正当事由さえあれば20年目に更新拒絶できるという結論にはならない。","choice_4_corrected_statement":"本件契約が公正証書によって行われていれば、専らＢの居住の用に供する建物の所有を目的とし、普通借地権の最初の存続期間は原則30年以上となるので、20年の特約はそのまま有効にならない、Ａは正当事由があれば、20 年が経過した時点で遅滞なく異議を述べて更新を拒絶することができる。","choice_4_legal_basis":"借地借家法3条・10条・11条・13条・22条・23条（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"「事業用」と書かれたら必ず「事業用定期借地権」と決めつけるのは誤り。期間を確認。｜誤り。通常の借地権は期間を20年と約束しても、初回期間は原則30年に引き上げられます。公正証書にしただけで20年の普通借地権を有効化できません。\nい。20年を定めた住宅用借地でも普通借地権の期間規制が及ぶため、正当事由さえあれば20年目に更新拒絶できるという結論にはならない。\nい。20年を定めた住宅用借地でも普通借地権の期間規制が及ぶため、正当事由さえあれば20年目に更新拒絶できるという結論にはならない。\nい。20年を定めた住宅用借地でも普通借地権の期間規制が及ぶため、正当事由さえあれば20年目に更新拒絶できるという結論にはならない。\nひっかけ箇所：[[WARN:存続期間を20 年と定めていても]]。正しい内容：== 年が経過した時点で遅滞なく異議を述べて更新を拒絶することができる。==。"},{"question_id":"2025-Q12","year":2025,"session":"通常","question_no":12,"major_field":"権利関係","section":"民法・借地借家法","unit":"建物賃貸借","topic":"解約申入れ・法定更新・造作買取","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"Ａを賃貸人、Ｂを賃借人とする甲建物の賃貸借契約（定期建物賃貸借契約及び一時使用目的の建物の賃貸借契約を除く。以下この問において「本件契約」という。）に関する次の記述のうち、民法及び借地借家法の規定によれば、正しいものはどれか。","choice_1":"本件契約が期間の定めがないものである場合において、Ａ又はＢから相手方に対して解約の申入れをしたときは、当該申入れの日から6 か月を経過することによって、本件契約は終了する。","choice_2":"本件契約が期間を2 年とするものである場合において、Ａ及びＢのいずれも期間の満了の1 年前から6 か月前までの間に相手方に対して更新をしない旨の通知をしなかったときは、本件契約は、期間を2 年として、従前の契約と同一の条件で更新されたものとみなされる。","choice_3":"ＡＢ間において、造作買取請求権は行使しない旨の特約があった場合、この特約は有効である。","choice_4":"本件契約が借地借家法第39 条に規定する取壊し予定の建物の賃貸借であり、甲建物を取り壊すこととなる時に本件契約が終了する旨の特約を定める場合、本件契約は、公正証書によってしなければならない。","official_accepted_answers":"3","answer_conclusion":"造作買取請求権を《行使しない特約》は有効であるため、肢3が正解です。","answer_reason":"【結論】造作買取請求権を《行使しない特約》は有効であるため、肢3が正解です。\n【解き方】普通建物賃貸借では、貸主からの解約申入れと借主からの解約申入れを同じ期間で処理しない。貸主側には原則6か月経過の要件に加え、正当事由が必要となる。期間の定めのある普通借家で更新拒絶通知をしなければ法定更新されるが、更新後は期間の定めがないものとなる。賃貸人の同意を得て付加した造作についての買取請求権は特約で排除できると解される。取壊し予定の建物の賃貸借は、法","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】普通建物賃貸借では、貸主からの解約申入れと借主からの解約申入れを同じ期間で処理しない。貸主側には原則6か月経過の要件に加え、正当事由が必要となる。期間の定めのある普通借家で更新拒絶通知をしなければ法定更新されるが、更新後は期間の定めがないものとなる。賃貸人の同意を得て付加した造作についての買取請求権は特約で排除できると解される。取壊し予定の建物の賃貸借は、法定の条件を書面で明確にすることが重要で、公正証書でなければ一切認められないとするのは行き過ぎ。\n【本問への当てはめ】普通の建物賃貸借では借主保護が強く、貸主側の更新拒絶や解約申入れには《正当事由》が必要です。一方、造作買取請求権は特約で排除でき、建物の取壊し予定を理由に賃貸借を終了させる特約では書面等の条件があります。\n【判断順序・類題への対応】貸主6か月と正当事由／借主の解約申入れ／法定更新後は期間の定めなし／取壊し予定は書面要件を確認。\n【具体的な当てはめ】貸主が更新拒絶をしたいケースと借主が途中で退去したいケースで必要な期間と正当事由が違う。 ","system_purpose":"制度の趣旨：普通建物賃貸借では、貸主からの解約申入れと借主からの解約申入れを同じ期間で処理しない。貸主側には原則6か月経過の要件に加え、正当事由が必要となる。期間の定めのある普通借家で更新拒絶通知をしなければ法定更新されるが、更新後は期間の定めがないものとなる。賃貸人の同意を得て付加した造作についての買取請求権は特約で排除できると解される。取壊し予定の建物の賃貸借は、法定の条件を書面で明確","practical_examples":"【具体例】貸主が更新拒絶をしたいケースと借主が途中で退去したいケースで必要な期間と正当事由が違う。","advanced_knowledge":"【周辺・発展】普通の建物賃貸借では借主保護が強く、貸主側の更新拒絶や解約申入れには《正当事由》が必要です。一方、造作買取請求権は特約で排除でき、建物の取壊し予定を理由に賃貸借を終了させる特約では書面等の条件があります。\n[[NOTE:貸主6か月と正当事由／借主の解約申入れ／法定更新後は期間の定めなし／取壊し予定は書面要件を確認。]]","comparative_explanation":"貸主6か月と正当事由／借主の解約申入れ／法定更新後は期間の定めなし／取壊し予定は書面要件を確認。","important_points":"==貸主申入れ6か月＋正当事由借主申入れ原則3か月法定更新＝期間の定めなし造作買取請求権は特約で排除可。==","trick_patterns":"定期建物賃貸借と普通借家を混同しない。「公正証書」と「書面」の違いも頻出。｜本問特有の誤誘導：造作買取請求権を《行使しない特約》は有効であるため、肢3が正解です。\n【誤答注意】設問中の [[WARN:期間を2 年として]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"貸主申入れ6か月＋正当事由借主申入れ原則3か月法定更新＝期間の定めなし造作買取請求権は特約で排除可。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 3。\nQ2: 本問の主要な判断要件は何か？ A2: 貸主6か月と正当事由／借主の解約申入れ／法定更新後は期間の定めなし／取壊し予定は書面要件を確認。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"民法617条、借地借家法26条・27条・28条・33条・39条 | 民法617条 / 借地借家法26条・27条・28条・33条・39条 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"貸主申入れ6か月＋正当事由借主申入れ原則3か月法定更新＝期間の定めなし造作買取請求権は特約で排除可。","marker_red_spans":"期間を2 年として","marker_blue_spans":"貸主6か月と正当事由／借主の解約申入れ／法定更新後は期間の定めなし／取壊し予定は書面要件を確認。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"Ａ又はＢ","choice_1_reason":"誤り。期間の定めがない普通建物賃貸借では、賃貸人からの解約申入れは原則6か月後、賃借人からは原則3か月後で、両者一律6か月ではありません。賃貸人には正当事由も必要です。\n【本肢の根拠・注意点】期間の定めのない普通建物賃貸借は、貸主からの解約申入れと借主からの解約申入れで要件が異なる。貸主には原則6か月と正当事由、借主には民法617条に基づく別の期間が問題になるため、「AまたはB」という一律処理が誤り。","choice_1_corrected_statement":"期間の定めがない普通建物賃貸借で、賃貸人からの解約申入れには原則6か月と正当事由が必要だが、賃借人側は同一の6か月期間ではない。","choice_1_legal_basis":"民法617条、借地借家法26条・27条・28条・33条・39条（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"定期建物賃貸借と普通借家を混同しない。「公正証書」と「書面」の違いも頻出。｜誤り。期間の定めがない普通建物賃貸借では、賃貸人からの解約申入れは原則6か月後、賃借人からは原則3か月後で、両者一律6か月ではありません。賃貸人には正当事由も必要です。\nが異なる。貸主には原則6か月と正当事由、借主には民法617条に基づく別の期間が問題になるため、「AまたはB」という一律処理が誤り。\nが異なる。貸主には原則6か月と正当事由、借主には民法617条に基づく別の期間が問題になるため、「AまたはB」という一律処理が誤り。\nが異なる。貸主には原則6か月と正当事由、借主には民法617条に基づく別の期間が問題になるため、「AまたはB」という一律処理が誤り。","choice_2_truth":"false","choice_2_is_exam_answer":"false","choice_2_wrong_part":"期間を2 年として","choice_2_reason":"誤り。期間満了の所定期間内に更新拒絶等の通知がなければ法定更新されますが、更新後の契約は《期間の定めのないもの》とみなされます。2年のままではありません。\n【本肢の根拠・注意点】期間満了前の更新拒絶通知がなければ、従前の条件で法定更新される。ただし更新後の存続期間については期間の定めがない扱いとなる。元の契約が2年だったから次も自動的に2年になる、とする箇所を修正する。","choice_2_corrected_statement":"本件契約が期間を2 年とするもので る場合、取壊し事由を記載した書面等による要件が重要。公正証書を唯一の方式とするのは定期借地権の別制度と混同している。\nひっかけ箇所：[[WARN:公正証書によって]]。正しい内容：==べき事由を記載した書面で行うことが要件であり、公正証書に限られない。==。"},{"question_id":"2025-Q13","year":2025,"session":"通常","question_no":13,"major_field":"権利関係","section":"区分所有法","unit":"区分所有","topic":"共用部分・議事録・共同利益背反行為","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"建物の区分所有等に関する法律に関する次の記述のうち、誤っているものはどれか。","choice_1":"共用部分は、原則として区分所有者全員の共有に属するが、規約で別段の定めをすることを妨げず、管理者であっても、規約に特別の定めがあるときは、共用部分を所有することができる。","choice_2":"共用部分の持分の割合について、各共有者の共用部分の持分は、規約で別段の定めをしない限り、その有する専有部分の床面積の割合による。","choice_3":"集会の議事については、議長は、書面又は電磁的記録により、議事録を作成しなければならず、当該議事録には議事の経過の要領及びその結果を記載し、又は記録しなければならないとされているが、当該議事録が書面で作成されているときは、議長及び集会に出席した区分所有者全員がこれに署名しなければならない。","choice_4":"区分所有者が、建物の保存に有害な行為その他建物の管理又は使用に関し区分所有者の共同の利益に反する行為をした場合又はその行為をするおそれがある場合には、他の区分所有者の全員又は管理組合法人は、区分所有者の共同の利益のため、その行為を停止し、その行為の結果を除去し、又はその行為を予防するため必要な措置を執ることを請求することができる。","official_accepted_answers":"3","answer_conclusion":"議事録に出席者《全員》の署名を要求する肢3が誤り。改正区分所有法の2026年4月施行にも注意してください。","answer_reason":"【結論】議事録に出席者《全員》の署名を要求する肢3が誤り。改正区分所有法の2026年4月施行にも注意してください。\n【解き方】区分所有建物では専有部分と共用部分を分け、共用部分は原則区分所有者全員の共有となる。規約共用部分や共有持分割合には特則があり、床面積割合が常に不変というわけではない。集会議事録については、作成義務者、記載事項、署名者を別々に確認する。2025年出題当時の区分所有法42条では、議長および集会に出席した区分所有者2人の署名が要件であり、出席者全員の署名ではな","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】区分所有建物では専有部分と共用部分を分け、共用部分は原則区分所有者全員の共有となる。規約共用部分や共有持分割合には特則があり、床面積割合が常に不変というわけではない。集会議事録については、作成義務者、記載事項、署名者を別々に確認する。2025年出題当時の区分所有法42条では、議長および集会に出席した区分所有者2人の署名が要件であり、出席者全員の署名ではなかった。さらに2026年4月1日に改正区分所有法が施行されたため、旧法の正誤理由をそのまま現行法の暗記に用いてはいけない。共同利益背反行為への差止請求も、単なる迷惑行為と法律上の共同利益を害する行為を区別する。\n【本問への当てはめ】区分所有法は「専有部分」「共用部分」「敷地利用権」「集会」「管理者」という制度の位置関係で理解します。議事録と決議要件では、《誰が作成するか》《誰が署名するか》《どの多数決が必要か》を切り離して整理しましょう。\n【判断順序・類題への対応】2025年旧法の議事録署名と2026年改正後の実務／共用部分の帰属と持分割合／集会手続と共同利益背反行為を分ける。\n【2026年4月改正との関係】同日施行の改正区分所有法は管理・再生に関する多数決の仕組みなどを改めたが、本問で問われる書面議事録の署名人数は議長と出席区分所有者2人であり、全員署名が必要になるわけではない。署名と押印を混同しない。","system_purpose":"制度の趣旨：区分所有建物では専有部分と共用部分を分け、共用部分は原則区分所有者全員の共有となる。規約共用部分や共有持分割合には特則があり、床面積割合が常に不変というわけではない。集会議事録については、作成義務者、記載事項、署名者を別々に確認する。2025年出題当時の区分所有法42条では、議長および集会に出席した区分所有者2人の署名が要件であり、出席者全員の署名ではなかった。さらに202","practical_examples":"【具体例】20戸のマンションの集会議事録に出席者20人全員の署名が必要という設問は出題当時誤り。2026年以降の集会は招集開始日による経過措置にも注意する。","advanced_knowledge":"【周辺・発展】区分所有法は「専有部分」「共用部分」「敷地利用権」「集会」「管理者」という制度の位置関係で理解します。議事録と決議要件では、《誰が作成するか》《誰が署名するか》《どの多数決が必要か》を切り離して整理しましょう。\n[[NOTE:2025年旧法の議事録署名と2026年改正後の実務／共用部分の帰属と持分割合／集会手続と共同利益背反行為を分ける。]]","comparative_explanation":"2025年旧法の議事録署名と2026年改正後の実務／共用部分の帰属と持分割合／集会手続と共同利益背反行為を分ける。","important_points":"==「出席者全員の署名」はひっかけ。「議事録の記載」「署名者」「保存」を分けて覚える。==","trick_patterns":"《2026年4月に区分所有法が改正施行》されたため、古い過去問の条文は現在の制度で再確認が必要です。｜本問特有の誤誘導：議事録に出席者《全員》の署名を要求する肢3が誤り。改正区分所有法の2026年4月施行にも注意してください。\n【誤答注意】設問中の [[WARN:出席した区分所有者全員]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"「出席者全員の署名」はひっかけ。「議事録の記載」「署名者」「保存」を分けて覚える。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 3。\nQ2: 本問の主要な判断要件は何か？ A2: 2025年旧法の議事録署名と2026年改正後の実務／共用部分の帰属と持分割合／集会手続と共同利益背反行為を分ける。。","substatement_reasoning":"","reform_status":"relevant_verified","reform_title":"令和7年法律第47号による区分所有法改正（2026年施行）","reform_effective_date":"2026-04-01","reform_before":"本問の議事録署名要件（42条3項）：議長と集会出席区分所有者2人の署名。2025年時点で押印要件ではない。","reform_after":"2026年4月1日に管理・再生の決議要件等が改正されたが、本問の書面議事録署名者は議長と出席区分所有者2人のまま。","reform_2026_impact":"設問3は2026年法でも「全員署名」の部分が誤り。改正による議事録署名者の全員化はない。管理・再生の新決議制度は関連学習事項として別途扱う。","reform_sources":"https://www.moj.go.jp/MINJI/minji07_00375.html | https://laws.e-gov.go.jp/law/337AC0000000069","legal_sources":"区分所有法11条・14条・42条（2025年旧法）、改正区分所有法、法務省施行・経過措置資料 | 国土交通省「改正マンション関係法の施行」2025-11-21 / 法務省・2025年法律47号 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/ | https://www.moj.go.jp/MINJI/minji07_00375.html | https://laws.e-gov.go.jp/law/337AC0000000069","marker_yellow_spans":"「出席者全員の署名」はひっかけ。「議事録の記載」「署名者」「保存」を分けて覚える。","marker_red_spans":"出席した区分所有者全員","marker_blue_spans":"2025年旧法の議事録署名と2026年改正後の実務／共用部分の帰属と持分割合／集会手続と共同利益背反行為を分ける。","qa_status":"PASS","qa_issues":"","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"true","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"false","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい（出題当時）。共用部分は原則区分所有者全員の共有ですが、規約で特別な定めができ、管理者が所有する場合もあります。\n【本肢の根拠・注意点】共用部分は区分所有者全員の共有が出発点だが、規約により別段の定めを設けられ、管理者が共用部分を所有する仕組みもある。管理者の管理権限と所有権そのものは別なので、規約による特別の定めという条件を読み落とさない。","choice_1_corrected_statement":"原文どおりで正しい","choice_1_legal_basis":"区分所有法11条1・2項、27条1項（規約による管理所有）｜https://laws.e-gov.go.jp/law/337AC0000000069","choice_1_exam_tip":"《2026年4月に区分所有法が改正施行》されたため、古い過去問の条文は現在の制度で再確認が必要です。｜正しい（出題当時）。共用部分は原則区分所有者全員の共有ですが、規約で特別な定めができ、管理者が所有する場合もあります。\n理者が共用部分を所有する仕組みもある。管理者の管理権限と所有権そのものは別なので、規約による特別の定めという条件を読み落とさない。\n理者が共用部分を所有する仕組みもある。管理者の管理権限と所有権そのものは別なので、規約による特別の定めという条件を読み落とさない。\n理者が共用部分を所有する仕組みもある。管理者の管理権限と所有権そのものは別なので、規約による特別の定めという条件を読み落とさない。","choice_2_truth":"true","choice_2_is_exam_answer":"false","choice_2_wrong_part":"該当なし","choice_2_reason":"正しい（出題当時）。共用部分の持分は原則、専有部分の床面積割合で決まり、規約で別段の定めが可能です。\n【本肢の根拠・注意点】各区分所有者の共用部分共有持分は専有部分の床面積割合が原則。ただし規約で別の割合を定めることが認められる。専有部分の価額割合が常に用いられるという制度ではなく、面積の測り方等にも定義がある。","choice_2_corrected_statement":"原文どおりで正しい","choice_2_legal_basis":"区分所有法14条1項（専有部分の床面積割合）｜https://laws.e-gov.go.jp/law/337AC0000000069","choice_2_exam_tip":"《2026年4月に区分所有法が改正施行》されたため、古い過去問の条文は現在の制度で再確認が必要です。｜正しい（出題当時）。共用部分の持分は原則、専有部分の床面積割合で決まり、規約で別段の定めが可能です。\nただし規約で別の割合を定めることが認められる。専有部分の価額割合が常に用いられるという制度ではなく、面積の測り方等にも定義がある。\nただし規約で別の割合を定めることが認められる。専有部分の価額割合が常に用いられるという制度ではなく、面積の測り方等にも定義がある。\nただし規約で別の割合を定めることが認められる。専有部分の価額割合が常に用いられるという制度ではなく、面積の測り方等にも定義がある。","choice_3_truth":"false","choice_3_is_exam_answer":"true","choice_3_wrong_part":"出席した区分所有者全員","choice_3_reason":"誤り（出題当時）。書面議事録の署名を出席した区分所有者《全員》がする必要はありません。議長と集会に出席した区分所有者のうち《2人》の署名という規定です（出題当時の区分所有法42条3項）。\n【本肢の根拠・注意点】出題当時の区分所有法では、書面議事録に必要なのは議長と出席区分所有者のうち2人の署名で、出席者全員ではなかった。議事録の作成義務者・内容・署名者を切り分け、2026年改正後の手続は別途確認する。","choice_3_corrected_statement":"書面で議事録を作成するときは、議長及び集会に出席した区分所有者2人がこれに署名しなければならない（区分所有法42条3項）。出席した区分所有者全員の署名は要求されない。","choice_3_legal_basis":"建物の区分所有等に関する法律42条1〜4項（議事録）｜https://laws.e-gov.go.jp/law/337AC0000000069","choice_3_exam_tip":"《2026年4月に区分所有法が改正施行》されたため、古い過去問の条文は現在の制度で再確認が必要です。｜誤り（出題当時）。書面議事録の署名を出席した区分所有者《全員》がする必要はありません。議長と集会に出席した区分所有者のうち《2人》の署名という規定です（出題当時の区分所有法42条3項）。\nのうち2人の署名で、出席者全員ではなかった。議事録の作成義務者・内容・署名者を切り分け、2026年改正後の手続は別途確認する。\nのうち2人の署名で、出席者全員ではなかった。議事録の作成義務者・内容・署名者を切り分け、2026年改正後の手続は別途確認する。\nのうち2人の署名で、出席者全員ではなかった。議事録の作成義務者・内容・署名者を切り分け、2026年改正後の手続は別途確認する。\nひっかけ箇所：[[WARN:出席した区分所有者全員]]。正しい内容：==要で、出席者全員ではない。2026年4月以降も議長と出席区分所有者2人が署名する。。==。","choice_4_truth":"true","choice_4_is_exam_answer":"false","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい（出題当時）。共同利益に反する行為について、停止・結果除去・予防措置を請求する仕組みがあります。\n【本肢の根拠・注意点】区分所有者の共同利益に反する行為やそのおそれがある場合、法は差止め・結果除去・予防措置等の請求を認める。単なる多数決で他人の専有部分を奪えるという意味ではなく、共同利益を害する具体的な行為を要件とする。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"区分所有法6条1項・57条1項（共同利益背反行為の差止等）｜https://laws.e-gov.go.jp/law/337AC0000000069","choice_4_exam_tip":"《2026年4月に区分所有法が改正施行》されたため、古い過去問の条文は現在の制度で再確認が必要です。｜正しい（出題当時）。共同利益に反する行為について、停止・結果除去・予防措置を請求する仕組みがあります。\n除去・予防措置等の請求を認める。単なる多数決で他人の専有部分を奪えるという意味ではなく、共同利益を害する具体的な行為を要件とする。\n除去・予防措置等の請求を認める。単なる多数決で他人の専有部分を奪えるという意味ではなく、共同利益を害する具体的な行為を要件とする。\n除去・予防措置等の請求を認める。単なる多数決で他人の専有部分を奪えるという意味ではなく、共同利益を害する具体的な行為を要件とする。"},{"question_id":"2025-Q14","year":2025,"session":"通常","question_no":14,"major_field":"権利関係","section":"不動産登記法","unit":"不動産登記","topic":"分筆・証明書・共同申請・合併","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"不動産の登記に関する次の記述のうち、不動産登記法の規定によれば、誤っているものはどれか。","choice_1":"登記官は、一筆の土地の一部が別の地目となったときであっても、職権でその土地の分筆の登記をすることができない。","choice_2":"登記事項証明書の交付の請求は、請求情報を電子情報処理組織を使用して登記所に提供する方法によりすることができる。","choice_3":"権利に関する登記の申請は、法令に別段の定めがある場合を除き、登記権利者及び登記義務者が共同してしなければならない。","choice_4":"建物の合併の登記は、表題部所有者又は所有権の登記名義人以外の者は、申請することができない。","official_accepted_answers":"1","answer_conclusion":"土地の一部が別の地目になった場合、登記官が《職権で分筆登記できる場合》があります。肢1が誤り。","answer_reason":"【結論】土地の一部が別の地目になった場合、登記官が《職権で分筆登記できる場合》があります。肢1が誤り。\n【解き方】不動産登記は不動産の客観的な現況を示す表示に関する登記と、所有権その他の権利を公示する権利に関する登記に分かれる。土地の一部の地目が変わった場合、登記官の職権による分筆登記が認められる場面がある。登記事項証明書の交付請求はオンラインでも可能。権利の登記では、登記権利者・登記義務者による共同申請が原則で、例外は法令上の根拠を必要とする。建物合併の登記申請人も限","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】不動産登記は不動産の客観的な現況を示す表示に関する登記と、所有権その他の権利を公示する権利に関する登記に分かれる。土地の一部の地目が変わった場合、登記官の職権による分筆登記が認められる場面がある。登記事項証明書の交付請求はオンラインでも可能。権利の登記では、登記権利者・登記義務者による共同申請が原則で、例外は法令上の根拠を必要とする。建物合併の登記申請人も限定されるため、「誰でも可能」と取り違えない。\n【本問への当てはめ】登記は《表示に関する登記》と《権利に関する登記》で申請ルールが異なります。地目・分筆・合筆は表示登記、所有権移転や抵当権は権利登記です。まず何を登記するのか決め、その後に申請者や職権の可否を判断します。\n【判断順序・類題への対応】表題登記と権利登記／共同申請と単独申請の例外／登記証明の電子申請と所有権移転の登記申請は別制度。\n【具体的な当てはめ】一筆の宅地の一部が道路用地となり、現況と登記上の地目が異なる場合には、職権分筆の可否が論点になる。 ","system_purpose":"制度の趣旨：不動産登記は不動産の客観的な現況を示す表示に関する登記と、所有権その他の権利を公示する権利に関する登記に分かれる。土地の一部の地目が変わった場合、登記官の職権による分筆登記が認められる場面がある。登記事項証明書の交付請求はオンラインでも可能。権利の登記では、登記権利者・登記義務者による共同申請が原則で、例外は法令上の根拠を必要とする。建物合併の登記申請人も限定されるため、「誰で","practical_examples":"【具体例】一筆の宅地の一部が道路用地となり、現況と登記上の地目が異なる場合には、職権分筆の可否が論点になる。","advanced_knowledge":"【周辺・発展】登記は《表示に関する登記》と《権利に関する登記》で申請ルールが異なります。地目・分筆・合筆は表示登記、所有権移転や抵当権は権利登記です。まず何を登記するのか決め、その後に申請者や職権の可否を判断します。\n[[NOTE:表題登記と権利登記／共同申請と単独申請の例外／登記証明の電子申請と所有権移転の登記申請は別制度。]]","comparative_explanation":"表題登記と権利登記／共同申請と単独申請の例外／登記証明の電子申請と所有権移転の登記申請は別制度。","important_points":"==一部地目変更→職権分筆もあり／権利登記は原則共同申請／オンライン証明請求可能。==","trick_patterns":"「申請義務」と「職権でできること」を混同しない。｜本問特有の誤誘導：土地の一部が別の地目になった場合、登記官が《職権で分筆登記できる場合》があります。肢1が誤り。\n【誤答注意】設問中の [[WARN:することができない]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"一部地目変更→職権分筆もあり／権利登記は原則共同申請／オンライン証明請求可能。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 1。\nQ2: 本問の主要な判断要件は何か？ A2: 表題登記と権利登記／共同申請と単独申請の例外／登記証明の電子申請と所有権移転の登記申請は別制度。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"不動産登記法39条・60条・不動産登記規則 | 不動産登記法39条・60条ほか / 法務省 不動産登記制度・登記申請義務化 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"一部地目変更→職権分筆もあり／権利登記は原則共同申請／オンライン証明請求可能。","marker_red_spans":"することができない","marker_blue_spans":"表題登記と権利登記／共同申請と単独申請の例外／登記証明の電子申請と所有権移転の登記申請は別制度。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"true","choice_1_wrong_part":"することができない","choice_1_reason":"誤り（正解肢）。土地の一部が他の地目となった場合、登記官は職権で土地の分筆登記ができます。「職権では絶対できない」が誤りです。\n【本肢の根拠・注意点】地目が土地の一部分で変わった場合に、登記官が職権で分筆登記を行える制度がある。不動産の表示に関する登記の職権主義に関係する事項で、所有権移転など権利登記の共同申請原則と混同しない。「できない」と全面否定した点が誤り。","choice_1_corrected_statement":"一筆の土地の一部が別の地目となった場合には、登記官が職権で分筆登記をすることができる場合がある。","choice_1_legal_basis":"不動産登記法39条・60条・不動産登記規則（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"「申請義務」と「職権でできること」を混同しない。｜誤り（正解肢）。土地の一部が他の地目となった場合、登記官は職権で土地の分筆登記ができます。「職権では絶対できない」が誤りです。\n表示に関する登記の職権主義に関係する事項で、所有権移転など権利登記の共同申請原則と混同しない。「できない」と全面否定した点が誤り。\n表示に関する登記の職権主義に関係する事項で、所有権移転など権利登記の共同申請原則と混同しない。「できない」と全面否定した点が誤り。\n表示に関する登記の職権主義に関係する事項で、所有権移転など権利登記の共同申請原則と混同しない。「できない」と全面否定した点が誤り。\nひっかけ箇所：[[WARN:することができない]]。正しい内容：==なった場合には、登記官が職権で分筆登記をすることができる場合がある。==。","choice_2_truth":"true","choice_2_is_exam_answer":"false","choice_2_wrong_part":"該当なし","choice_2_reason":"正しい。登記事項証明書は登記所へのオンライン請求が認められています。申請手続そのものと登記事項の閲覧・証明を区別。\n【本肢の根拠・注意点】登記事項証明書はオンラインで交付請求できる。電子情報処理組織により請求情報を登記所へ提供する手続であり、オンライン請求を利用しても証明の対象は登記簿の情報である。権利の登記申請と証明書請求は別。","choice_2_corrected_statement":"原文どおりで正しい","choice_2_legal_basis":"不動産登記法39条・60条・不動産登記規則（当該肢と条文の個別照合は要確認）","choice_2_exam_tip":"「申請義務」と「職権でできること」を混同しない。｜正しい。登記事項証明書は登記所へのオンライン請求が認められています。申請手続そのものと登記事項の閲覧・証明を区別。\nり請求情報を登記所へ提供する手続であり、オンライン請求を利用しても証明の対象は登記簿の情報である。権利の登記申請と証明書請求は別。\nり請求情報を登記所へ提供する手続であり、オンライン請求を利用しても証明の対象は登記簿の情報である。権利の登記申請と証明書請求は別。\nり請求情報を登記所へ提供する手続であり、オンライン請求を利用しても証明の対象は登記簿の情報である。権利の登記申請と証明書請求は別。","choice_3_truth":"true","choice_3_is_exam_answer":"false","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい。所有権移転など権利に関する登記は原則《権利者と義務者の共同申請》。相続登記等の例外もあります。\n【本肢の根拠・注意点】権利の登記は、利益を得る登記権利者と不利益を受ける登記義務者が共同申請するのが原則。相続など法令が単独申請を認める例外は別途あるため、「原則」「例外」を区別して判断する。\n【追加確認】登記義務者が協力しない場合に確定判決等による単独申請が可能となる別の手続もあるため、「原則共同申請」という限定が重要である。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"不動産登記法39条・60条・不動産登記規則（当該肢と条文の個別照合は要確認）","choice_3_exam_tip":"「申請義務」と「職権でできること」を混同しない。｜正しい。所有権移転など権利に関する登記は原則《権利者と義務者の共同申請》。相続登記等の例外もあります。\n益を受ける登記義務者が共同申請するのが原則。相続など法令が単独申請を認める例外は別途あるため、「原則」「例外」を区別して判断する。\n益を受ける登記義務者が共同申請するのが原則。相続など法令が単独申請を認める例外は別途あるため、「原則」「例外」を区別して判断する。\n益を受ける登記義務者が共同申請するのが原則。相続など法令が単独申請を認める例外は別途あるため、「原則」「例外」を区別して判断する。","choice_4_truth":"true","choice_4_is_exam_answer":"false","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。建物合併登記の申請権者には法定の制限があり、表題部所有者または所有権登記名義人が基本です。\n【本肢の根拠・注意点】建物の合併登記は建物の表示を統合する登記で、申請権者は表題部所有者または所有権登記名義人に限定される。単に使用している賃借人や工事施工者が申請できるものではない。\n【追加確認】この申請主体の限定は表題登記に関する手続であり、売買による所有権移転登記の申請人と機械的に同一視してはならない。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"不動産登記法39条・60条・不動産登記規則（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"「申請義務」と「職権でできること」を混同しない。｜正しい。建物合併登記の申請権者には法定の制限があり、表題部所有者または所有権登記名義人が基本です。\nする登記で、申請権者は表題部所有者または所有権登記名義人に限定される。単に使用している賃借人や工事施工者が申請できるものではない。\nする登記で、申請権者は表題部所有者または所有権登記名義人に限定される。単に使用している賃借人や工事施工者が申請できるものではない。\nする登記で、申請権者は表題部所有者または所有権登記名義人に限定される。単に使用している賃借人や工事施工者が申請できるものではない。"},{"question_id":"2025-Q15","year":2025,"session":"通常","question_no":15,"major_field":"法令上の制限","section":"都市計画法","unit":"地域地区","topic":"風致地区・特定街区・用途地域・生産緑地","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"都市計画法に関する次の記述のうち、誤っているものはどれか。","choice_1":"風致地区は、都市の風致を維持するため定める地区であり、当該地区内における建築物の建築について、政令の定める基準に従い、地方公共団体の条例で、都市の風致を維持するため必要な規制をすることができる。","choice_2":"特定街区は、市街地の整備改善を図るため街区の整備又は造成が行われる地区について、その街区内における建築物の容積率並びに建築物の高さの最高限度及び壁面の位置の制限を定める街区である。","choice_3":"近隣商業地域は、近隣の住宅地の住民に対する日用品の供給を行うことを主たる内容とする商業その他の業務の利便を増進するため定める地域である。","choice_4":"生産緑地地区は、農業の利便の増進を図りつつ、これと調和した低層住宅に係る良好な住居の環境を保護するため定める地区である。","official_accepted_answers":"4","answer_conclusion":"「農業の利便と調和した低層住宅地」は《田園住居地域》の目的で、生産緑地地区ではありません。肢4が誤りです。","answer_reason":"【結論】「農業の利便と調和した低層住宅地」は《田園住居地域》の目的で、生産緑地地区ではありません。肢4が誤りです。\n【解き方】都市計画の地域地区は目的から名称を識別することが重要である。風致地区は都市の風致・景観の維持のため条例により建築などを規制する。特定街区は街区単位で容積率、高さの最高限度、壁面位置などを定める。近隣商業地域は近隣住民の日用品供給を中心とする商業等の利便を増進する。農業の利便と調和した低層住宅地の良好な住環境を保護するのは田園住居地域の説明であり、生産緑地地区","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】都市計画の地域地区は目的から名称を識別することが重要である。風致地区は都市の風致・景観の維持のため条例により建築などを規制する。特定街区は街区単位で容積率、高さの最高限度、壁面位置などを定める。近隣商業地域は近隣住民の日用品供給を中心とする商業等の利便を増進する。農業の利便と調和した低層住宅地の良好な住環境を保護するのは田園住居地域の説明であり、生産緑地地区とは異なる。生産緑地地区は市街化区域内農地等の保全に関する制度で、名称が似ていても規制目的を混同しない。\n【本問への当てはめ】都市計画の用語は、区分の違いが得点差になります。《用途地域》は住宅・商業・工業などの用途の調整、《特別用途地区》は用途地域を補完する規制、《生産緑地地区》は農地等の保全という機能です。問題は制度名に説明文が正しく対応しているかを見ています。\n【判断順序・類題への対応】田園住居地域＝用途地域／生産緑地地区＝農地等の保全に着目した地域地区。近隣商業と商業地域も別区分。\n【具体的な当てはめ】戸建住宅と農地が共存する都市部の用途地域が田園住居地域かどうかを考え、生産緑地地区の指定目的とは分ける。 ","system_purpose":"制度の趣旨：都市計画の地域地区は目的から名称を識別することが重要である。風致地区は都市の風致・景観の維持のため条例により建築などを規制する。特定街区は街区単位で容積率、高さの最高限度、壁面位置などを定める。近隣商業地域は近隣住民の日用品供給を中心とする商業等の利便を増進する。農業の利便と調和した低層住宅地の良好な住環境を保護するのは田園住居地域の説明であり、生産緑地地区とは異なる。生産緑地","practical_examples":"【具体例】戸建住宅と農地が共存する都市部の用途地域が田園住居地域かどうかを考え、生産緑地地区の指定目的とは分ける。","advanced_knowledge":"【周辺・発展】都市計画の用語は、区分の違いが得点差になります。《用途地域》は住宅・商業・工業などの用途の調整、《特別用途地区》は用途地域を補完する規制、《生産緑地地区》は農地等の保全という機能です。問題は制度名に説明文が正しく対応しているかを見ています。\n[[NOTE:田園住居地域＝用途地域／生産緑地地区＝農地等の保全に着目した地域地区。近隣商業と商業地域も別区分。]]","comparative_explanation":"田園住居地域＝用途地域／生産緑地地区＝農地等の保全に着目した地域地区。近隣商業と商業地域も別区分。","important_points":"==田園住居地域＝農業の利便と調和した低層住宅／生産緑地地区＝農地等の保全。==","trick_patterns":"似た用語を入れ替えた肢が
