引を行う目的及び職業について、確認した。","choice_2":"Ａは、価額が5,000 万円の土地付建物の売買を行ったとき、直ちに、一定の方法により、当該売買契約の相手方である買主の確認記録を検索するための事項、当該取引の期日及び内容その他の事項に関する記録を作成して保存していたが、当該取引の行われた日から5 年経過したので、当年度末に当該記録を廃棄した。","choice_3":"Ａは、土地付建物の売買契約の相手方である買主から収受した代金について犯罪により得た収益であるとの疑いがあったので、速やかに、所定の事項を行政庁に届け出た。","choice_4":"Ａは、取引時確認、取引記録等の保存、疑わしい取引の届出等の措置を的確に行うため、顧客と実際に接する営業担当者に対する教育訓練を実施した。","official_accepted_answers":"2","answer_conclusion":"取引記録は原則《取引日から7年間》保存するため、5年で廃棄した肢2が法律違反です。","answer_reason":"【結論】取引記録は原則《取引日から7年間》保存するため、5年で廃棄した肢2が法律違反です。\n【解き方】宅建業者は犯罪収益移転防止法の特定事業者に該当し、一定の宅地・建物取引で取引時確認・確認記録・取引記録の作成保存等の義務を負う。取引記録は原則取引日から7年間保存し、5年で一律廃棄できるものではない。一方、確認記録の保存期間は所定の契約終了日等を起点とするため、同じ「7年」でも起算点を混同しない。疑わしい取引の届出は個別取引の事情に応じて判断する。","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】宅建業者は犯罪収益移転防止法の特定事業者に該当し、一定の宅地・建物取引で取引時確認・確認記録・取引記録の作成保存等の義務を負う。取引記録は原則取引日から7年間保存し、5年で一律廃棄できるものではない。一方、確認記録の保存期間は所定の契約終了日等を起点とするため、同じ「7年」でも起算点を混同しない。疑わしい取引の届出は個別取引の事情に応じて判断する。\n【本問への当てはめ】犯罪収益移転防止法では《本人確認》《確認記録》《取引記録》《疑わしい取引の届出》を区別します。保存期間は、確認記録が契約終了等から7年間、取引記録は取引日から7年間と、起算点まで問われることがあります。\n【判断順序・類題への対応】取引記録＝取引日から7年／確認記録＝特定の契約終了日等から7年。起算点の違いがひっかけ。\n【具体的な当てはめ】不動産の売買記録を決済5年後に廃棄する事業者は、取引日から7年の保存義務に抵触する可能性がある。 \n【類題での整理】取引記録＝取引日から7年／確認記録＝特定の契約終了日等から7年。起算点の違いがひっかけ。\n【参考になる法令・基準】犯罪収益移転防止法4条・6条・7条・8条\n【保存期間の条文上の違い】確認記録は犯罪収益移転防止法6条2項により契約終了日等から7年間、取引記録等は同法7条3項により取引日から7年間保存する。「7年」という年数だけでなく、何を保存する記録か、いつを起算点とするかをセットで区別する。","system_purpose":"制度の趣旨：宅建業者は犯罪収益移転防止法の特定事業者に該当し、一定の宅地・建物取引で取引時確認・確認記録・取引記録の作成保存等の義務を負う。取引記録は原則取引日から7年間保存し、5年で一律廃棄できるものではない。一方、確認記録の保存期間は所定の契約終了日等を起点とするため、同じ「7年」でも起算点を混同しない。疑わしい取引の届出は個別取引の事情に応じて判断する。","practical_examples":"【具体例】不動産の売買記録を決済5年後に廃棄する事業者は、取引日から7年の保存義務に抵触する可能性がある。","advanced_knowledge":"【周辺・発展】犯罪収益移転防止法では《本人確認》《確認記録》《取引記録》《疑わしい取引の届出》を区別します。保存期間は、確認記録が契約終了等から7年間、取引記録は取引日から7年間と、起算点まで問われることがあります。\n[[NOTE:取引記録＝取引日から7年／確認記録＝特定の契約終了日等から7年。起算点の違いがひっかけ。]]","comparative_explanation":"取引記録＝取引日から7年／確認記録＝特定の契約終了日等から7年。起算点の違いがひっかけ。","important_points":"==取引記録は取引日から7年／確認記録は所定の契約終了日等から7年を区別。==","trick_patterns":"「5年」「直ちに届け出不要」「不動産会社は対象外」などの文言に注意。｜本問特有の誤誘導：取引記録は原則《取引日から7年間》保存するため、5年で廃棄した肢2が法律違反です。\n【誤答注意】設問中の [[WARN:取引の行われた日から5 年経過したので]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"取引記録は取引日から7年／確認記録は所定の契約終了日等から7年を区別。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 2。\nQ2: 本問の主要な判断要件は何か？ A2: 取引記録＝取引日から7年／確認記録＝特定の契約終了日等から7年。起算点の違いがひっかけ。。","substatement_reasoning":"","reform_status":"none_confirmed","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"犯罪収益移転防止法4条・6条・7条・8条 | 犯罪収益移転防止法6条・7条・8条 / 警察庁「令和8年犯罪収益移転防止法の改正」 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/ | https://laws.e-gov.go.jp/law/419AC0000000022 | https://www.mlit.go.jp/totikensangyo/const/1_6_bf_000025.html","marker_yellow_spans":"取引記録は取引日から7年／確認記録は所定の契約終了日等から7年を区別。","marker_red_spans":"取引の行われた日から5 年経過したので","marker_blue_spans":"取引記録＝取引日から7年／確認記録＝特定の契約終了日等から7年。起算点の違いがひっかけ。","qa_status":"PASS","qa_issues":"","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"true","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"false","choice_1_wrong_part":"該当なし","choice_1_reason":"違反しません。自然人の不動産売買取引時確認では、本人特定事項、取引目的、職業などを確認します。\n【本肢の根拠・注意点】土地付建物の売買は一定の取引時確認が必要となる。買主が自然人なら本人特定事項の氏名・住居・生年月日だけでなく取引目的や職業等の確認事項がある。対象取引・本人確認方法・記録作成を区別する。","choice_1_corrected_statement":"原文どおりで正しい。","choice_1_legal_basis":"犯罪による収益の移転防止に関する法律4条（取引時確認）｜https://laws.e-gov.go.jp/law/419AC0000000022","choice_1_exam_tip":"「5年」「直ちに届け出不要」「不動産会社は対象外」などの文言に注意。｜違反しません。自然人の不動産売買取引時確認では、本人特定事項、取引目的、職業などを確認します。\n然人なら本人特定事項の氏名・住居・生年月日だけでなく取引目的や職業等の確認事項がある。対象取引・本人確認方法・記録作成を区別する。","choice_2_truth":"false","choice_2_is_exam_answer":"true","choice_2_wrong_part":"取引の行われた日から5 年経過したので、当年度末に当該記録を廃棄した","choice_2_reason":"違反します。取引記録等は原則として当該取引が行われた日から《7年間》保存します。5年で廃棄するのは早すぎます。\n【本肢の根拠・注意点】取引記録は原則取引日から7年間保存する義務がある。5年間保存していたとしても法定の保存期間を満たさず、年度末に廃棄することは違反となる。確認記録は起算点に別の規律があるので混同しない。","choice_2_corrected_statement":"Ａは、価額が5,000 万円の土地付建物の売買を行ったとき、直ちに、一定の方法により、当該売買契約の相手方である買主の確認記録を検索するための事項、当該取引の期日及び内容その他の事項に関する記録を作成して保存していたが、当該取引が行われた日から原則7年間、取引記録等を保存する。","choice_2_legal_basis":"犯罪による収益の移転防止に関する法律7条3項（取引日から7年間保存）｜https://laws.e-gov.go.jp/law/419AC0000000022","choice_2_exam_tip":"「5年」「直ちに届け出不要」「不動産会社は対象外」などの文言に注意。｜違反します。取引記録等は原則として当該取引が行われた日から《7年間》保存します。5年で廃棄するのは早すぎます。\n間保存していたとしても法定の保存期間を満たさず、年度末に廃棄することは違反となる。確認記録は起算点に別の規律があるので混同しない。\nひっかけ箇所：[[WARN:取引の行われた日から5 年経過したので、]]。正しい内容：==ていたが、当該取引が行われた日から原則7年間、取引記録等を保存する。==。","choice_3_truth":"true","choice_3_is_exam_answer":"false","choice_3_wrong_part":"該当なし","choice_3_reason":"違反しません。犯罪収益が疑われる場合、行政庁へ疑わしい取引の届出を速やかに行います。\n【本肢の根拠・注意点】不動産売買代金に犯罪収益の疑いがあるなど、疑わしい取引に該当すると判断したときは所定の行政庁への届出義務が生じる。捜査で犯罪が確定してからでないと届け出られないという制度ではない。\n【補足】疑わしい理由は犯罪が確定した事実とは異なる。","choice_3_corrected_statement":"原文どおりで正しい。","choice_3_legal_basis":"犯罪による収益の移転防止に関する法律8条（疑わしい取引の届出）｜https://laws.e-gov.go.jp/law/419AC0000000022","choice_3_exam_tip":"「5年」「直ちに届け出不要」「不動産会社は対象外」などの文言に注意。｜違反しません。犯罪収益が疑われる場合、行政庁へ疑わしい取引の届出を速やかに行います。\n取引に該当すると判断したときは所定の行政庁への届出義務が生じる。捜査で犯罪が確定してからでないと届け出られないという制度ではない。","choice_4_truth":"true","choice_4_is_exam_answer":"false","choice_4_wrong_part":"該当なし","choice_4_reason":"違反しません。取引時確認を適切に実施するため、営業担当者への教育訓練を行うことは適切です。\n【本肢の根拠・注意点】取引時確認や疑わしい取引の届出を的確に行うため、実際に顧客と接する従業者への教育訓練を行うことは必要な体制整備措置として適切。管理部門だけが法令を知っていても現場で実践できなければ意味がない。\n犯収法11条は教育訓練の実施を、取引時確認等の措置の的確な実施のために「講ずるように努めなければならない」措置の一つに位置付けている。したがって営業担当者へ研修を実施すること自体が違反になるという理解は逆である。努力義務であることと、教育訓練をしてはならないことは全く異なる。","choice_4_corrected_statement":"原文どおりで正しい。","choice_4_legal_basis":"犯罪収益移転防止法11条1号（使用人に対する教育訓練は努力義務の一つ）｜https://laws.e-gov.go.jp/law/419AC0000000022","choice_4_exam_tip":"「5年」「直ちに届け出不要」「不動産会社は対象外」などの文言に注意。｜違反しません。取引時確認を適切に実施するため、営業担当者への教育訓練を行うことは適切です。\nする従業者への教育訓練を行うことは必要な体制整備措置として適切。管理部門だけが法令を知っていても現場で実践できなければ意味がない。"},{"question_id":"2025-Q45","year":2025,"session":"通常","question_no":45,"major_field":"宅建業法","section":"住宅瑕疵担保履行法","unit":"新築住宅の瑕疵担保","topic":"供託・保険・住宅紛争処理","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"特定住宅瑕疵担保責任の履行の確保等に関する法律に基づく住宅販売瑕疵担保保証金（以下この問において「保証金」という。）の供託又は住宅販売瑕疵担保責任保険契約（以下この問において「保険契約」という。）の締結に関する次の記述のうち、正しいものはどれか。","choice_1":"宅地建物取引業者は、基準日から3 週間を経過する日までの間において、当該基準日前15 年間に自ら売主となる売買契約に基づき宅地建物取引業者ではない買主に引き渡した新築住宅（保険契約に係る新築住宅を除く。）について、保証金の供託をしていなければならない。","choice_2":"宅地建物取引業者は、自ら売主となる売買契約に基づき新築住宅を引き渡す場合だけでなく、新築住宅の売買の媒介をする場合においても、保証金の供託又は保険契約の締結をしなければならない。","choice_3":"保険契約を締結している宅地建物取引業者は、新築住宅を引き渡した時から10 年間、構造耐力上主要な部分の瑕疵 によって生じた損害についてのみ当該保険契約に係る保険金を請求することができる。","choice_4":"保険契約を締結している宅地建物取引業者及び当該業者が売主となっている新築住宅の買主は、指定住宅紛争処理機関に特別住宅紛争処理の申請をすることにより、当該新築住宅の売買契約に関する宅地建物取引業者と買主との間の紛争について、あっせん、調停又は仲裁を受けることができる。","official_accepted_answers":"4","answer_conclusion":"新築住宅売買で紛争が生じた場合、《指定住宅紛争処理機関》へあっせん等を申し立てられます。肢4が正しい。","answer_reason":"【結論】新築住宅売買で紛争が生じた場合、《指定住宅紛争処理機関》へあっせん等を申し立てられます。肢4が正しい。\n【解き方】新築住宅の売主である宅建業者等には、構造耐力上主要な部分や雨水の浸入を防止する部分について10年間の瑕疵担保責任の履行を確保する仕組みがある。販売業者は供託または保険加入により資力を確保する。保証金の供託と保険は制度目的が共通するが、手続・計算・届出は異なる。紛争が発生した場合には指定住宅紛争処理機関であっせん・調停・仲裁などを利用できる場合がある。","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】新築住宅の売主である宅建業者等には、構造耐力上主要な部分や雨水の浸入を防止する部分について10年間の瑕疵担保責任の履行を確保する仕組みがある。販売業者は供託または保険加入により資力を確保する。保証金の供託と保険は制度目的が共通するが、手続・計算・届出は異なる。紛争が発生した場合には指定住宅紛争処理機関であっせん・調停・仲裁などを利用できる場合がある。\n【本問への当てはめ】新築住宅については《構造耐力上主要な部分》と《雨水の浸入を防止する部分》について原則10年間の責任が生じます。売主業者は資力確保のため保証金の供託または保険加入を行う仕組みです。紛争処理制度は保証金・保険とは別の救済ルートです。\n【判断順序・類題への対応】住宅瑕疵担保の10年責任／供託と保険／指定住宅紛争処理機関のあっせん等を区別。\n【具体的な当てはめ】新築マンションの引渡し後に雨漏りが生じたとき、売主の責任と供託・保険による資力確保、紛争処理の窓口を分ける。 \n【類題での整理】住宅瑕疵担保の10年責任／供託と保険／指定住宅紛争処理機関のあっせん等を区別。\n【参考になる法令・基準】住宅瑕疵担保履行法、住宅品質確保法","system_purpose":"制度の趣旨：新築住宅の売主である宅建業者等には、構造耐力上主要な部分や雨水の浸入を防止する部分について10年間の瑕疵担保責任の履行を確保する仕組みがある。販売業者は供託または保険加入により資力を確保する。保証金の供託と保険は制度目的が共通するが、手続・計算・届出は異なる。紛争が発生した場合には指定住宅紛争処理機関であっせん・調停・仲裁などを利用できる場合がある。","practical_examples":"【具体例】新築マンションの引渡し後に雨漏りが生じたとき、売主の責任と供託・保険による資力確保、紛争処理の窓口を分ける。","advanced_knowledge":"【周辺・発展】新築住宅については《構造耐力上主要な部分》と《雨水の浸入を防止する部分》について原則10年間の責任が生じます。売主業者は資力確保のため保証金の供託または保険加入を行う仕組みです。紛争処理制度は保証金・保険とは別の救済ルートです。\n[[NOTE:住宅瑕疵担保の10年責任／供託と保険／指定住宅紛争処理機関のあっせん等を区別。]]","comparative_explanation":"住宅瑕疵担保の10年責任／供託と保険／指定住宅紛争処理機関のあっせん等を区別。","important_points":"==新築売主の資力確保／構造＋防水の2領域／10年間／紛争処理＝あっせん・調停・仲裁。==","trick_patterns":"「売買を媒介しただけ」でも義務があると混同しない。｜本問特有の誤誘導：新築住宅売買で紛争が生じた場合、《指定住宅紛争処理機関》へあっせん等を申し立てられます。肢4が正しい。\n【誤答注意】設問中の [[WARN:基準日前15 年間]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"新築売主の資力確保／構造＋防水の2領域／10年間／紛争処理＝あっせん・調停・仲裁。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 4。\nQ2: 本問の主要な判断要件は何か？ A2: 住宅瑕疵担保の10年責任／供託と保険／指定住宅紛争処理機関のあっせん等を区別。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"住宅瑕疵担保履行法、住宅品質確保法 | 住宅瑕疵担保履行法 / 住宅品質確保法 / 国土交通省 住宅紛争処理支援制度 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/ | 国交省住宅瑕疵担保履行 https://www.mlit.go.jp/jutakukentiku/jutaku-kentiku.files/kashitanpocorner/jigyousya/obligation.html","marker_yellow_spans":"新築売主の資力確保／構造＋防水の2領域／10年間／紛争処理＝あっせん・調停・仲裁。","marker_red_spans":"基準日前15 年間","marker_blue_spans":"住宅瑕疵担保の10年責任／供託と保険／指定住宅紛争処理機関のあっせん等を区別。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"基準日前15 年間","choice_1_reason":"誤り。供託対象住宅の対象期間など法定条件を、基準日前15年間とした記述は不正確です。\n【本肢の根拠・注意点】売主業者の保証金供託では、基準日前の対象新築住宅について法令所定の算定期間と届出・供託期限を守る。過去15年間の引渡し数を一律算入するという本肢は対象期間を誤っている。保証金と保険の対象も二重計上しない。","choice_1_corrected_statement":"宅地建物取引業者は、基準日から3 週間を経過する日までの間において、当該基準日前10年間に自ら売主となる売買契約に基づき宅地建物取引業者ではない買主に引き渡した新築住宅（保険契約に係る新築住宅を除く。）について、保証金の供託をしていなければならない。","choice_1_legal_basis":"住宅瑕疵担保履行法、住宅品質確保法（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"「売買を媒介しただけ」でも義務があると混同しない。｜誤り。供託対象住宅の対象期間など法定条件を、基準日前15年間とした記述は不正確です。\nと届出・供託期限を守る。過去15年間の引渡し数を一律算入するという本肢は対象期間を誤っている。保証金と保険の対象も二重計上しない。\nひっかけ箇所：[[WARN:基準日前15 年間]]。正しい内容：==る新築住宅を除く。）について、保証金の供託をしていなければならない。==。","choice_2_truth":"false","choice_2_is_exam_answer":"false","choice_2_wrong_part":"新築住宅の売買の媒介をする場合においても、保証金の供託又は保険契約の締結をしなければならない","choice_2_reason":"誤り。資力確保義務の対象は原則として《宅建業者が自ら売主となる新築住宅の売買》。媒介しただけの業者にまで一律に課すものではありません。\n【本肢の根拠・注意点】住宅瑕疵担保履行法の資力確保義務は原則として新築住宅を自ら売主として販売する業者などに課される。売主・買主の媒介だけを行う宅建業者が、媒介した全新築住宅について供託または保険に加入する義務ではない。","choice_2_corrected_statement":"宅地建物取引業者は、自ら売主となる売買契約に基づき新築住宅を引き渡す場合だけでなく、単に新築住宅の売買を媒介するだけの宅建業者には、当該新築住宅の売主としての資力確保義務は課されない。","choice_2_legal_basis":"住宅瑕疵担保履行法、住宅品質確保法（当該肢と条文の個別照合は要確認）","choice_2_exam_tip":"「売買を媒介しただけ」でも義務があると混同しない。｜誤り。資力確保義務の対象は原則として《宅建業者が自ら売主となる新築住宅の売買》。媒介しただけの業者にまで一律に課すものではありません。\n販売する業者などに課される。売主・買主の媒介だけを行う宅建業者が、媒介した全新築住宅について供託または保険に加入する義務ではない。\nひっかけ箇所：[[WARN:新築住宅の売買の媒介をする場合においても]]。正しい内容：==の宅建業者には、当該新築住宅の売主としての資力確保義務は課されない。==。","choice_3_truth":"false","choice_3_is_exam_answer":"false","choice_3_wrong_part":"構造耐力上主要な部分の瑕疵によって生じた損害についてのみ","choice_3_reason":"誤り。新築住宅の瑕疵担保保険は構造耐力上主要な部分《だけ》ではなく、雨水浸入を防止する部分の瑕疵も対象になります。\n【本肢の根拠・注意点】新築住宅の瑕疵担保責任は構造耐力上主要な部分だけでなく、雨水の浸入を防止する部分も対象となる。保険契約による損害補填を構造部分の瑕疵のみに限定する文言が誤り。\n【補足】防水性能の確保も新築住宅で重大な保護対象となる。","choice_3_corrected_statement":"保険契約を締結している宅地建物取引業者は、新築住宅を引き渡した時から10 年間、構造耐力上主要な部分の瑕疵 によって生じた損害についてのみ当該保険契約に係る保険金を請求することができる。","choice_3_legal_basis":"住宅瑕疵担保履行法、住宅品質確保法（当該肢と条文の個別照合は要確認）","choice_3_exam_tip":"「売買を媒介しただけ」でも義務があると混同しない。｜誤り。新築住宅の瑕疵担保保険は構造耐力上主要な部分《だけ》ではなく、雨水浸入を防止する部分の瑕疵も対象になります。\n耐力上主要な部分だけでなく、雨水の浸入を防止する部分も対象となる。保険契約による損害補填を構造部分の瑕疵のみに限定する文言が誤り。\nひっかけ箇所：[[WARN:構造耐力上主要な部分の瑕疵によって生じた]]。正しい内容：==じた損害についてのみ当該保険契約に係る保険金を請求することができる。==。","choice_4_truth":"true","choice_4_is_exam_answer":"true","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。売主の業者と新築住宅買主は、指定住宅紛争処理機関に申請して、あっせん・調停・仲裁を受けられる制度があります。\n【本肢の根拠・注意点】資力確保措置として保険契約がある売主と買主は、指定住宅紛争処理機関を利用し、法定の紛争処理手続であっせん・調停・仲裁を受けることができる。通常の訴訟だけが紛争解決方法ではない。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"住宅瑕疵担保履行法、住宅品質確保法（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"「売買を媒介しただけ」でも義務があると混同しない。｜正しい。売主の業者と新築住宅買主は、指定住宅紛争処理機関に申請して、あっせん・調停・仲裁を受けられる制度があります。\n指定住宅紛争処理機関を利用し、法定の紛争処理手続であっせん・調停・仲裁を受けることができる。通常の訴訟だけが紛争解決方法ではない。"},{"question_id":"2025-Q46","year":2025,"session":"通常","question_no":46,"major_field":"税・その他","section":"住宅金融支援機構法","unit":"住宅金融支援機構","topic":"災害復興住宅融資・証券化・高齢者向け融資","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"独立行政法人住宅金融支援機構（以下この問において「機構」という。）に関する次の記述のうち、誤っているものはどれか。","choice_1":"機構は、災害により住宅が滅失した場合におけるその住宅に代わるべき住宅の建設又は購入に係る貸付金について、一定の元金返済の据置期間を設けることができる。","choice_2":"機構は、証券化支援事業（買取型）において、債務者又は債務者の親族が居住する住宅のみならず、賃貸住宅の建設又は購入に必要な資金の貸付けに係る金融機関の貸付債権についても譲受けの対象としている。","choice_3":"機構は、高齢者が自ら居住する住宅に対して行うバリアフリー工事に係る貸付けについて、貸付金の償還を高齢者の死亡時に一括して行うという制度を設けている。","choice_4":"機構は、市街地の土地の合理的な利用に寄与する一定の建築物の建設に必要な資金の貸付けを業務として行っている。","official_accepted_answers":"2","answer_conclusion":"住宅金融支援機構の買取型証券化は《一般の賃貸住宅投資融資》まで対象にしません。肢2が誤り。","answer_reason":"【結論】住宅金融支援機構の買取型証券化は《一般の賃貸住宅投資融資》まで対象にしません。肢2が誤り。\n【解き方】住宅金融支援機構は住宅の建設・購入等に必要な資金調達を支援する公的機関で、長期固定金利型の住宅ローンを促進する証券化支援事業などを行う。買取型証券化支援は民間金融機関の住宅ローン債権を買い取って証券化する仕組みで、一般の投資用賃貸住宅購入ローンを幅広く対象とする制度ではない。災害復興住宅融資や高齢者向け返済特例など、政策目的に応じた別事業もある。","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】住宅金融支援機構は住宅の建設・購入等に必要な資金調達を支援する公的機関で、長期固定金利型の住宅ローンを促進する証券化支援事業などを行う。買取型証券化支援は民間金融機関の住宅ローン債権を買い取って証券化する仕組みで、一般の投資用賃貸住宅購入ローンを幅広く対象とする制度ではない。災害復興住宅融資や高齢者向け返済特例など、政策目的に応じた別事業もある。\n【本問への当てはめ】機構の柱は《住宅ローンの証券化支援》《災害復興支援》《政策的に必要な住宅融資》。住宅ローンの長期固定金利を実現する仕組みと、賃貸住宅への投資事業は区別して理解しましょう。\n【判断順序・類題への対応】買取型証券化／災害復興住宅融資／高齢者向け融資・返済特例という目的別事業を分ける。\n【具体的な当てはめ】自分で住む住宅の取得資金融資を扱う金融機関と、アパート投資用の融資とを同じ買取型証券化支援の対象として扱わない。 \n【類題での整理】買取型証券化／災害復興住宅融資／高齢者向け融資・返済特例という目的別事業を分ける。\n【参考になる法令・基準】独立行政法人住宅金融支援機構法、住宅金融支援機構事業案内","system_purpose":"制度の趣旨：住宅金融支援機構は住宅の建設・購入等に必要な資金調達を支援する公的機関で、長期固定金利型の住宅ローンを促進する証券化支援事業などを行う。買取型証券化支援は民間金融機関の住宅ローン債権を買い取って証券化する仕組みで、一般の投資用賃貸住宅購入ローンを幅広く対象とする制度ではない。災害復興住宅融資や高齢者向け返済特例など、政策目的に応じた別事業もある。","practical_examples":"【具体例】自分で住む住宅の取得資金融資を扱う金融機関と、アパート投資用の融資とを同じ買取型証券化支援の対象として扱わない。","advanced_knowledge":"【周辺・発展】機構の柱は《住宅ローンの証券化支援》《災害復興支援》《政策的に必要な住宅融資》。住宅ローンの長期固定金利を実現する仕組みと、賃貸住宅への投資事業は区別して理解しましょう。\n[[NOTE:買取型証券化／災害復興住宅融資／高齢者向け融資・返済特例という目的別事業を分ける。]]","comparative_explanation":"買取型証券化／災害復興住宅融資／高齢者向け融資・返済特例という目的別事業を分ける。","important_points":"==買取型証券化＝住宅取得ローンの支援／災害融資／高齢者向け返済特例。==","trick_patterns":"証券化支援の対象を「住宅関係なら何でも」と広げない。｜本問特有の誤誘導：住宅金融支援機構の買取型証券化は《一般の賃貸住宅投資融資》まで対象にしません。肢2が誤り。\n【誤答注意】設問中の [[WARN:賃貸住宅の建設又は購入に必要な資金の貸付]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"買取型証券化＝住宅取得ローンの支援／災害融資／高齢者向け返済特例。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 2。\nQ2: 本問の主要な判断要件は何か？ A2: 買取型証券化／災害復興住宅融資／高齢者向け融資・返済特例という目的別事業を分ける。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"独立行政法人住宅金融支援機構法、住宅金融支援機構事業案内 | 独立行政法人住宅金融支援機構法 / 住宅金融支援機構 事業案内 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"買取型証券化＝住宅取得ローンの支援／災害融資／高齢者向け返済特例。","marker_red_spans":"賃貸住宅の建設又は購入に必要な資金の貸付","marker_blue_spans":"買取型証券化／災害復興住宅融資／高齢者向け融資・返済特例という目的別事業を分ける。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"false","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。災害復興住宅融資等では元金返済の据置期間を設ける制度があります。\n【本肢の根拠・注意点】災害により住宅を失った人の建設・購入を支援する融資では、返済開始時の負担軽減のため元金据置期間を設けられる。一般の住宅ローンではなく災害復興目的の公的融資の特徴である。\n【補足】据置期間は元本支払猶予であり、債務免除ではない。","choice_1_corrected_statement":"原文どおりで正しい","choice_1_legal_basis":"独立行政法人住宅金融支援機構法、住宅金融支援機構事業案内（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"証券化支援の対象を「住宅関係なら何でも」と広げない。｜正しい。災害復興住宅融資等では元金返済の据置期間を設ける制度があります。\n支援する融資では、返済開始時の負担軽減のため元金据置期間を設けられる。一般の住宅ローンではなく災害復興目的の公的融資の特徴である。","choice_2_truth":"false","choice_2_is_exam_answer":"true","choice_2_wrong_part":"賃貸住宅の建設又は購入に必要な資金の貸付けに係る金融機関の貸付債権についても譲受けの対象としている","choice_2_reason":"誤り（正解肢）。機構の買取型証券化支援は自ら・親族が居住する住宅等の取得資金に関するもので、賃貸住宅投資の融資債権を当然に買い取る制度ではありません。\n【本肢の根拠・注意点】買取型証券化支援は原則として本人または親族が居住する住宅を対象とする住宅取得融資を支援する制度。一般の投資用賃貸住宅の建設・購入資金融資まで買取対象としているという範囲の拡張が誤り。","choice_2_corrected_statement":"機構は、証券化支援事業（買取型）において、債務者又は債務者の親族が居住する住宅のみならず、投資用の賃貸住宅取得資金を対象とする貸付債権は、一般の買取型証券化支援の対象ではない。","choice_2_legal_basis":"独立行政法人住宅金融支援機構法、住宅金融支援機構事業案内（当該肢と条文の個別照合は要確認）","choice_2_exam_tip":"証券化支援の対象を「住宅関係なら何でも」と広げない。｜誤り（正解肢）。機構の買取型証券化支援は自ら・親族が居住する住宅等の取得資金に関するもので、賃貸住宅投資の融資債権を当然に買い取る制度ではありません。\n住宅を対象とする住宅取得融資を支援する制度。一般の投資用賃貸住宅の建設・購入資金融資まで買取対象としているという範囲の拡張が誤り。\nひっかけ箇所：[[WARN:賃貸住宅の建設又は購入に必要な資金の貸付]]。正しい内容：==得資金を対象とする貸付債権は、一般の買取型証券化支援の対象ではない。==。","choice_3_truth":"true","choice_3_is_exam_answer":"false","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい。高齢者のバリアフリー改修融資には、死亡時に元金を一括返済するリバースモーゲージ型の仕組みがあります。\n【本肢の根拠・注意点】高齢者の自宅バリアフリー工事について、死亡時に元金を一括返済する形式を認める融資制度がある。通常の住宅ローンと異なり、在宅生活を支援する目的に沿った返済設計になっている。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"独立行政法人住宅金融支援機構法、住宅金融支援機構事業案内（当該肢と条文の個別照合は要確認）","choice_3_exam_tip":"証券化支援の対象を「住宅関係なら何でも」と広げない。｜正しい。高齢者のバリアフリー改修融資には、死亡時に元金を一括返済するリバースモーゲージ型の仕組みがあります。\n亡時に元金を一括返済する形式を認める融資制度がある。通常の住宅ローンと異なり、在宅生活を支援する目的に沿った返済設計になっている。","choice_4_truth":"true","choice_4_is_exam_answer":"false","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。市街地の土地の合理的利用に寄与する一定の建築物の建設を支援する融資業務があります。\n【本肢の根拠・注意点】機構の業務には住宅取得支援だけでなく、市街地の土地の合理的な利用に寄与する一定の建築事業への融資等が含まれる。住宅取得ローンの証券化支援と直接融資の対象事業は区別して覚える。\n【補足】適用事業の目的や融資要件を法令で確認する。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"独立行政法人住宅金融支援機構法、住宅金融支援機構事業案内（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"証券化支援の対象を「住宅関係なら何でも」と広げない。｜正しい。市街地の土地の合理的利用に寄与する一定の建築物の建設を支援する融資業務があります。\nの土地の合理的な利用に寄与する一定の建築事業への融資等が含まれる。住宅取得ローンの証券化支援と直接融資の対象事業は区別して覚える。"},{"question_id":"2025-Q47","year":2025,"session":"通常","question_no":47,"major_field":"税・その他","section":"不動産公正競争規約","unit":"不動産広告","topic":"徒歩所要時間・管理費・新駅予定の表示","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"宅地建物取引業者が行う広告に関する次の記述のうち、不当景品類及び不当表示防止法（不動産の表示に関する公正競争規約を含む。）の規定によれば、正しいものはどれか。","choice_1":"団地（一団の宅地又は建物をいう。）と駅との間の道路距離は、取引する区画のうち駅から最も近い区画（マンション及びアパートにあっては、駅から最も近い建物の出入口）を起点として算出した数値又は駅から最も遠い区画（マンション及びアパートにあっては、駅から最も遠い建物の出入口）を起点として算出した数値のいずれかを表示しなければならない。","choice_2":"新築分譲マンションを販売するに当たり、住戸により管理費の額が異なる場合であって、その全ての住宅の管理費を表示することが困難であるときは、最高額のみで表示することができる。","choice_3":"物件の近くに新設される予定の駅等又はバスの停留所については、当該路線の運行主体が公表していれば、現に利用できるものではなくても新設予定時期を明示して表示することができる。","choice_4":"道路距離80 m につき1 分間を要するものとして、賃貸物件から最寄りの駅までの徒歩による所要時間を算出したところ15 分50 秒であった。この場合、当該所要時間を15 分と表示してよい。","official_accepted_answers":"3","answer_conclusion":"計画中の新駅は、《運行主体が公表》し新設予定時期を示せば表示できます。肢3が正しい。","answer_reason":"【結論】計画中の新駅は、《運行主体が公表》し新設予定時期を示せば表示できます。肢3が正しい。\n【解き方】不動産広告の表示規約では、消費者が物件の所在や利便性、価格等を誤認しないよう表示方法が定められる。徒歩所要時間は道路距離80mにつき1分とし端数を切り上げる。複数棟等で管理費などに幅がある場合、最低額だけでなく必要な範囲を示す。未開業の駅などの交通施設は、事業主体による公表や開業予定時期など、規約が認める条件を満たしたときに限って表示できる。将来の予定を確定","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】不動産広告の表示規約では、消費者が物件の所在や利便性、価格等を誤認しないよう表示方法が定められる。徒歩所要時間は道路距離80mにつき1分とし端数を切り上げる。複数棟等で管理費などに幅がある場合、最低額だけでなく必要な範囲を示す。未開業の駅などの交通施設は、事業主体による公表や開業予定時期など、規約が認める条件を満たしたときに限って表示できる。将来の予定を確定済み事実であるかのように宣伝しない。\n【本問への当てはめ】不動産広告の徒歩所要時間は《直線距離ではなく道路距離》で計算します。徒歩1分＝80mで端数は切り上げ。広告規約は宅建業法の誇大広告規制とは別の、業界の公正競争規約として出題されます。\n【判断順序・類題への対応】徒歩80m＝1分・端数切上げ／未開業駅の表示条件／管理費等の表示範囲を整理。\n【具体的な当てはめ】640mの駅距離は徒歩8分だが、650mなら徒歩9分として端数を切り上げる。新駅の表示では公表主体と予定時期を確認する。 ","system_purpose":"制度の趣旨：不動産広告の表示規約では、消費者が物件の所在や利便性、価格等を誤認しないよう表示方法が定められる。徒歩所要時間は道路距離80mにつき1分とし端数を切り上げる。複数棟等で管理費などに幅がある場合、最低額だけでなく必要な範囲を示す。未開業の駅などの交通施設は、事業主体による公表や開業予定時期など、規約が認める条件を満たしたときに限って表示できる。将来の予定を確定済み事実であるかのよ","practical_examples":"【具体例】640mの駅距離は徒歩8分だが、650mなら徒歩9分として端数を切り上げる。新駅の表示では公表主体と予定時期を確認する。","advanced_knowledge":"【周辺・発展】不動産広告の徒歩所要時間は《直線距離ではなく道路距離》で計算します。徒歩1分＝80mで端数は切り上げ。広告規約は宅建業法の誇大広告規制とは別の、業界の公正競争規約として出題されます。\n[[NOTE:徒歩80m＝1分・端数切上げ／未開業駅の表示条件／管理費等の表示範囲を整理。]]","comparative_explanation":"徒歩80m＝1分・端数切上げ／未開業駅の表示条件／管理費等の表示範囲を整理。","important_points":"==徒歩80m/分・端数切上げ／管理費は最低〜最高／未開業駅は公表済み＋予定時期。==","trick_patterns":"15分50秒を四捨五入で15分としない。｜本問特有の誤誘導：計画中の新駅は、《運行主体が公表》し新設予定時期を示せば表示できます。肢3が正しい。\n【誤答注意】設問中の [[WARN:15 分と表示してよい]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"徒歩80m/分・端数切上げ／管理費は最低〜最高／未開業駅は公表済み＋予定時期。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 3。\nQ2: 本問の主要な判断要件は何か？ A2: 徒歩80m＝1分・端数切上げ／未開業駅の表示条件／管理費等の表示範囲を整理。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"不動産の表示に関する公正競争規約・同施行規則 | 不動産の表示に関する公正競争規約・同施行規則 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"徒歩80m/分・端数切上げ／管理費は最低〜最高／未開業駅は公表済み＋予定時期。","marker_red_spans":"15 分と表示してよい","marker_blue_spans":"徒歩80m＝1分・端数切上げ／未開業駅の表示条件／管理費等の表示範囲を整理。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"いずれかを表示しなければならない","choice_1_reason":"誤り。団地から駅への距離表示は、最も近い区画《または》最も遠い区画を任意に選ぶのではなく、法定の表示ルールに従います。\n【本肢の根拠・注意点】団地の駅からの道路距離表示では、複数区画・棟がある場合の表示方法は規約で定める正確な範囲表示が求められ、最も近いか遠いかの一方のみを自由に選んで表示できるわけではない。都合のよい所要時間表示を避ける趣旨。","choice_1_corrected_statement":"団地（一団の宅地又は建物をいう。）と駅との間の道路距離は、取引する区画のうち駅から最も近い区画（マンション及びアパートにあっては、駅から最も近い建物の出入口）を起点として算出した数値又は駅から最も遠い区画（マンション及びアパートにあっては、駅から最も遠い建物の出入口）を起点として算出した数値の最も近い区画等と最も遠い区画等を用いて定められた方法により距離を表示する。","choice_1_legal_basis":"不動産の表示に関する公正競争規約・同施行規則（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"15分50秒を四捨五入で15分としない。｜誤り。団地から駅への距離表示は、最も近い区画《または》最も遠い区画を任意に選ぶのではなく、法定の表示ルールに従います。\nめる正確な範囲表示が求められ、最も近いか遠いかの一方のみを自由に選んで表示できるわけではない。都合のよい所要時間表示を避ける趣旨。\nひっかけ箇所：[[WARN:いずれかを表示しなければならない]]。正しい内容：==い区画等と最も遠い区画等を用いて定められた方法により距離を表示する。==。","choice_2_truth":"false","choice_2_is_exam_answer":"false","choice_2_wrong_part":"最高額のみ","choice_2_reason":"誤り。管理費が住戸ごとに異なり全表示が困難なら《最低額と最高額》などの表示が必要で、最高額のみでは足りません。\n【本肢の根拠・注意点】新築分譲マンションの住戸ごとに管理費が異なる場合、全住戸の額を示すのが困難なら最低額から最高額までの幅など必要な表示をする。最高額のみを示してよいという一律処理ではない。","choice_2_corrected_statement":"新築分譲マンションを販売するに当たり、住戸により管理費の額が異なる場合であって、その全ての住宅の管理費を表示することが困難であるときは、最低額及び最高額で表示することができる。","choice_2_legal_basis":"不動産の表示に関する公正競争規約・同施行規則（当該肢と条文の個別照合は要確認）","choice_2_exam_tip":"15分50秒を四捨五入で15分としない。｜誤り。管理費が住戸ごとに異なり全表示が困難なら《最低額と最高額》などの表示が必要で、最高額のみでは足りません。\nなる場合、全住戸の額を示すのが困難なら最低額から最高額までの幅など必要な表示をする。最高額のみを示してよいという一律処理ではない。\nひっかけ箇所：[[WARN:最高額のみ]]。正しい内容：==することが困難であるときは、最低額及び最高額で表示することができる。==。","choice_3_truth":"true","choice_3_is_exam_answer":"true","choice_3_wrong_part":"該当なし","choice_3_reason":"正しい。新駅・新停留所の計画を運行主体が公表した場合、現時点で開業前でも予定時期を明記して表示できる条件があります。\n【本肢の根拠・注意点】新設予定の駅やバス停は運行主体が公表した内容であれば、実際の利用開始前でも新設予定時期を付記して表示できる。未確定の社内構想を完成済みの交通施設のように示すことは認められない。","choice_3_corrected_statement":"原文どおりで正しい","choice_3_legal_basis":"不動産の表示に関する公正競争規約・同施行規則（当該肢と条文の個別照合は要確認）","choice_3_exam_tip":"15分50秒を四捨五入で15分としない。｜正しい。新駅・新停留所の計画を運行主体が公表した場合、現時点で開業前でも予定時期を明記して表示できる条件があります。\nあれば、実際の利用開始前でも新設予定時期を付記して表示できる。未確定の社内構想を完成済みの交通施設のように示すことは認められない。","choice_4_truth":"false","choice_4_is_exam_answer":"false","choice_4_wrong_part":"15 分と表示してよい","choice_4_reason":"誤り。徒歩時間は道路距離《80mにつき1分》、端数切上げ。15分50秒は《16分》であり15分と記載できません。\n【本肢の根拠・注意点】徒歩所要時間は道路距離80mを1分として換算し、端数は1分に切り上げる。算出値15分50秒なら表示は16分であり15分に切り捨てない。利便性を過大に見せないための統一基準である。","choice_4_corrected_statement":"道路距離80 m につき1 分間を要するものとして、賃貸物件から最寄りの駅までの徒歩による所要時間を算出したところ15 分50 秒であった。この場合、当該所要時間を16分と表示しなければならない。","choice_4_legal_basis":"不動産の表示に関する公正競争規約・同施行規則（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"15分50秒を四捨五入で15分としない。｜誤り。徒歩時間は道路距離《80mにつき1分》、端数切上げ。15分50秒は《16分》であり15分と記載できません。\n端数は1分に切り上げる。算出値15分50秒なら表示は16分であり15分に切り捨てない。利便性を過大に見せないための統一基準である。\nひっかけ箇所：[[WARN:15 分と表示してよい]]。正しい内容：==秒であった。この場合、当該所要時間を16分と表示しなければならない。==。"},{"question_id":"2025-Q48","year":2025,"session":"通常","question_no":48,"major_field":"税・その他","section":"統計","unit":"土地・住宅の統計","topic":"法人企業統計・住宅着工・地価公示・土地白書","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"次の記述のうち、正しいものはどれか。","choice_1":"年次別法人企業統計調査（令和5 年度。令和6 年9 月公表）によれば、令和5 年度における不動産業の営業利益は7 兆円を超えているが、前年度に比べ減少した。","choice_2":"建築着工統計調査報告（令和6 年計。令和7 年1 月公表）によれば、令和6 年の新設住宅着工戸数は、持家、分譲住宅のいずれにおいても前年に比べ減少した。","choice_3":"令和7 年地価公示（令和7 年3 月公表）によれば、令和6 年1 月以降の1 年間の地価変動率は、三大都市圏平均では住宅地、商業地ともに上昇となったものの、地方圏平均では住宅地、商業地ともに下落となった。","choice_4":"令和7 年版土地白書（令和7 年5 月公表）によれば、土地取引について、売買による所有権の移転登記の件数でその動向を見ると、令和6 年の全国の土地取引件数は200 万件を超えており、前年に比べ大きく増加した。","official_accepted_answers":"2","answer_conclusion":"2025年度の統計設問では、《2024年の持家・分譲住宅着工戸数が双方減少》とした肢2が正しい。","answer_reason":"【結論】2025年度の統計設問では、《2024年の持家・分譲住宅着工戸数が双方減少》とした肢2が正しい。\n【解き方】宅建統計問題は年度・対象期間・前年比の方向性を正確に読むことが重要である。2025年度試験では2024年計の建築着工や、その時点の地価公示・土地白書などの公表資料が対象だった。持家・分譲住宅の新設住宅着工戸数の前年比がどちらも減少したという設問の正誤を、当時の資料に基づいて判断する。2026年度の試験では参照すべき統計年度が変わるため、この問題の数値を無条件","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】宅建統計問題は年度・対象期間・前年比の方向性を正確に読むことが重要である。2025年度試験では2024年計の建築着工や、その時点の地価公示・土地白書などの公表資料が対象だった。持家・分譲住宅の新設住宅着工戸数の前年比がどちらも減少したという設問の正誤を、当時の資料に基づいて判断する。2026年度の試験では参照すべき統計年度が変わるため、この問題の数値を無条件に最新値として暗記しない。\n【本問への当てはめ】統計問題は《公表された年度・対象期間》を明示して学習することが重要です。2025年試験の統計正解は「2026年の最新統計」を示すわけではありません。直前期には2026年試験の指定最新統計（建築着工・地価公示・土地白書など）を別教材で更新しましょう。\n【判断順序・類題への対応】暦年と年度／実数と増減率／出題当時2024年計と2026年度対策の最新版を区別。\n【具体的な当てはめ】前年の住宅着工戸数を暗記する場合、持家・分譲・貸家のどの区分かと、暦年統計か年度統計かを先に確認する。 ","system_purpose":"制度の趣旨：宅建統計問題は年度・対象期間・前年比の方向性を正確に読むことが重要である。2025年度試験では2024年計の建築着工や、その時点の地価公示・土地白書などの公表資料が対象だった。持家・分譲住宅の新設住宅着工戸数の前年比がどちらも減少したという設問の正誤を、当時の資料に基づいて判断する。2026年度の試験では参照すべき統計年度が変わるため、この問題の数値を無条件に最新値として暗記し","practical_examples":"【具体例】前年の住宅着工戸数を暗記する場合、持家・分譲・貸家のどの区分かと、暦年統計か年度統計かを先に確認する。","advanced_knowledge":"【周辺・発展】統計問題は《公表された年度・対象期間》を明示して学習することが重要です。2025年試験の統計正解は「2026年の最新統計」を示すわけではありません。直前期には2026年試験の指定最新統計（建築着工・地価公示・土地白書など）を別教材で更新しましょう。\n[[NOTE:暦年と年度／実数と増減率／出題当時2024年計と2026年度対策の最新版を区別。]]","comparative_explanation":"暦年と年度／実数と増減率／出題当時2024年計と2026年度対策の最新版を区別。","important_points":"==統計は年号と公表時点で判定／古い問題の数字を新年度へ流用しない。==","trick_patterns":"2025年の正解統計値を2026年度の選択肢に機械的に転用しない。｜本問特有の誤誘導：2025年度の統計設問では、《2024年の持家・分譲住宅着工戸数が双方減少》とした肢2が正しい。\n【誤答注意】設問中の [[WARN:前年度に比べ減少した]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"統計は年号と公表時点で判定／古い問題の数字を新年度へ流用しない。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 2。\nQ2: 本問の主要な判断要件は何か？ A2: 暦年と年度／実数と増減率／出題当時2024年計と2026年度対策の最新版を区別。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"国土交通省 建築着工統計調査報告（2024年計）、地価公示、土地白書 | 国土交通省 建築着工統計調査報告（令和6年計） / 令和7年地価公示 / 令和7年版土地白書 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"統計は年号と公表時点で判定／古い問題の数字を新年度へ流用しない。","marker_red_spans":"前年度に比べ減少した","marker_blue_spans":"暦年と年度／実数と増減率／出題当時2024年計と2026年度対策の最新版を区別。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜統計は年度依存。2026年受験用の新公表資料との比較は別に必要｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"前年度に比べ減少した","choice_1_reason":"誤り。令和5年度の不動産業営業利益について、設問の金額・増減の組み合わせが統計と一致しません。\n【本肢の根拠・注意点】法人企業統計では調査年度、産業分類、利益の種類を対応させる必要がある。営業利益が7兆円を超えるという数字だけでなく前年比が増加か減少かという記述も正確に照合し、出題時点の2023年度公表値を2026年度へ流用しない。","choice_1_corrected_statement":"年次別法人企業統計調査（令和5 年度。令和6 年9 月公表）によれば、令和5 年度における不動産業の営業利益は7 兆円を超えているが、前年度に比べ増加した。","choice_1_legal_basis":"国土交通省 建築着工統計調査報告（2024年計）、地価公示、土地白書（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"2025年の正解統計値を2026年度の選択肢に機械的に転用しない。｜誤り。令和5年度の不動産業営業利益について、設問の金額・増減の組み合わせが統計と一致しません。\nを超えるという数字だけでなく前年比が増加か減少かという記述も正確に照合し、出題時点の2023年度公表値を2026年度へ流用しない。\nひっかけ箇所：[[WARN:前年度に比べ減少した]]。正しい内容：==る不動産業の営業利益は7 兆円を超えているが、前年度に比べ増加した。==。","choice_2_truth":"true","choice_2_is_exam_answer":"true","choice_2_wrong_part":"該当なし","choice_2_reason":"正しい。令和6年の新設住宅着工は、持家・分譲住宅のいずれも前年比で減少しました。\n【本肢の根拠・注意点】2024年計の建築着工統計では、新設住宅着工の持家と分譲住宅のいずれも前年より減少した。分譲住宅と貸家など統計区分を置換した選択肢と混同しない。2025年度試験時点の正しい統計判断。\n【補足】出題当時の前年との増減を分野別に区別する。","choice_2_corrected_statement":"原文どおりで正しい","choice_2_legal_basis":"国土交通省 建築着工統計調査報告（2024年計）、地価公示、土地白書（当該肢と条文の個別照合は要確認）","choice_2_exam_tip":"2025年の正解統計値を2026年度の選択肢に機械的に転用しない。｜正しい。令和6年の新設住宅着工は、持家・分譲住宅のいずれも前年比で減少しました。\n分譲住宅のいずれも前年より減少した。分譲住宅と貸家など統計区分を置換した選択肢と混同しない。2025年度試験時点の正しい統計判断。","choice_3_truth":"false","choice_3_is_exam_answer":"false","choice_3_wrong_part":"地方圏平均では住宅地、商業地ともに下落","choice_3_reason":"誤り。令和7年地価公示では地方圏平均でも住宅地・商業地は上昇しており、双方下落との記述が誤りです。\n【本肢の根拠・注意点】2025年地価公示では三大都市圏だけでなく地方圏の平均地価も住宅地・商業地の動向を見分ける必要がある。地方圏がいずれも下落したという本肢の記述は当時の資料と整合せず、地域別の増減方向を誤っている。","choice_3_corrected_statement":"令和7 年地価公示（令和7 年3 月公表）によれば、令和6 年1 月以降の1 年間の地価変動率は、三大都市圏平均では住宅地、商業地ともに上昇となったものの、地方圏平均でも住宅地、商業地ともに上昇となった。","choice_3_legal_basis":"国土交通省 建築着工統計調査報告（2024年計）、地価公示、土地白書（当該肢と条文の個別照合は要確認）","choice_3_exam_tip":"2025年の正解統計値を2026年度の選択肢に機械的に転用しない。｜誤り。令和7年地価公示では地方圏平均でも住宅地・商業地は上昇しており、双方下落との記述が誤りです。\n・商業地の動向を見分ける必要がある。地方圏がいずれも下落したという本肢の記述は当時の資料と整合せず、地域別の増減方向を誤っている。\nひっかけ箇所：[[WARN:地方圏平均では住宅地、商業地ともに下落]]。正しい内容：==上昇となったものの、地方圏平均でも住宅地、商業地ともに上昇となった。==。","choice_4_truth":"false","choice_4_is_exam_answer":"false","choice_4_wrong_part":"200 万件を超えており、前年に比べ大きく増加した","choice_4_reason":"誤り。令和6年全国土地取引件数が200万件を超え大きく増加した、との記述は土地白書の数値に合致しません。\n【本肢の根拠・注意点】土地白書の売買による所有権移転登記件数は統計上の定義と該当年の件数を確認する。全国土地取引件数が200万件超で大きく増加したという説明は出題時のデータと一致しない。年度を限定した数値問題である。","choice_4_corrected_statement":"令和7 年版土地白書（令和7 年5 月公表）によれば、土地取引について、売買による所有権の移転登記の件数でその動向を見ると、令和6 年の全国の土地取引件数は約132万件で、前年に比べほぼ横ばいであった。","choice_4_legal_basis":"国土交通省 建築着工統計調査報告（2024年計）、地価公示、土地白書（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"2025年の正解統計値を2026年度の選択肢に機械的に転用しない。｜誤り。令和6年全国土地取引件数が200万件を超え大きく増加した、との記述は土地白書の数値に合致しません。\n数を確認する。全国土地取引件数が200万件超で大きく増加したという説明は出題時のデータと一致しない。年度を限定した数値問題である。\nひっかけ箇所：[[WARN:200 万件を超えており、前年に比べ大き]]。正しい内容：==の全国の土地取引件数は約132万件で、前年に比べほぼ横ばいであった。==。"},{"question_id":"2025-Q49","year":2025,"session":"通常","question_no":49,"major_field":"税・その他","section":"土地・地盤","unit":"土地の知識","topic":"低地・砂州・砂丘・丘陵・台地","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"土地に関する次の記述のうち、最も不適当なものはどれか。","choice_1":"川沿いの低地に堆積している川が運んだ土砂は、重い構造物を支持できる。","choice_2":"砂州や砂丘には、粒径のそろった砂が堆積しており、地下水位が浅い箇所では、液状化しやすくなる。","choice_3":"丘陵地は、山地ほど斜面の勾配がきつくなく、山地に比べ斜面崩壊は生じ難いといえる。","choice_4":"台地は低地より古い時代に形成された地盤であり、一般に構造物を支持できる強度を有している。","official_accepted_answers":"1","answer_conclusion":"河川沿いの低地に堆積した沖積土は《軟弱地盤》になり得るため、無条件に重い構造物を支持できる肢1が不適当。","answer_reason":"【結論】河川沿いの低地に堆積した沖積土は《軟弱地盤》になり得るため、無条件に重い構造物を支持できる肢1が不適当。\n【解き方】地盤の安全性は地形・地質・地下水・造成履歴などを総合して判断する。河川沿いの沖積低地は新しい堆積物からなり、軟弱地盤や不同沈下のリスクがあるため、重い建物を常に安全に支持できるとは限らない。砂質地盤に高い地下水位が重なると、地震時の液状化の可能性がある。台地や丘陵は一般に低地より条件が良いことが多いが、盛土・切土や斜面崩壊の危険がないと断定できない。","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】地盤の安全性は地形・地質・地下水・造成履歴などを総合して判断する。河川沿いの沖積低地は新しい堆積物からなり、軟弱地盤や不同沈下のリスクがあるため、重い建物を常に安全に支持できるとは限らない。砂質地盤に高い地下水位が重なると、地震時の液状化の可能性がある。台地や丘陵は一般に低地より条件が良いことが多いが、盛土・切土や斜面崩壊の危険がないと断定できない。\n【本問への当てはめ】宅地の地盤は《地形・地層・地下水》の組み合わせで判断します。沖積低地は軟弱・浸水、砂質地盤は高地下水位なら液状化、谷埋め盛土は不等沈下や崩壊に注意。台地でも盛土・切土の履歴を確認する必要があります。\n【判断順序・類題への対応】沖積低地の軟弱地盤／砂質地盤の液状化／台地・丘陵の切盛り・斜面リスクを比較する。\n【具体的な当てはめ】河川沿いの埋立・沖積低地に倉庫を建てる場合、地盤調査と支持力・地下水条件の検討を欠かせない。 \n【類題での整理】沖積低地の軟弱地盤／砂質地盤の液状化／台地・丘陵の切盛り・斜面リスクを比較する。\n【参考になる法令・基準】国土交通省 宅地防災資料、地盤工学の基礎","system_purpose":"制度の趣旨：地盤の安全性は地形・地質・地下水・造成履歴などを総合して判断する。河川沿いの沖積低地は新しい堆積物からなり、軟弱地盤や不同沈下のリスクがあるため、重い建物を常に安全に支持できるとは限らない。砂質地盤に高い地下水位が重なると、地震時の液状化の可能性がある。台地や丘陵は一般に低地より条件が良いことが多いが、盛土・切土や斜面崩壊の危険がないと断定できない。","practical_examples":"【具体例】河川沿いの埋立・沖積低地に倉庫を建てる場合、地盤調査と支持力・地下水条件の検討を欠かせない。","advanced_knowledge":"【周辺・発展】宅地の地盤は《地形・地層・地下水》の組み合わせで判断します。沖積低地は軟弱・浸水、砂質地盤は高地下水位なら液状化、谷埋め盛土は不等沈下や崩壊に注意。台地でも盛土・切土の履歴を確認する必要があります。\n[[NOTE:沖積低地の軟弱地盤／砂質地盤の液状化／台地・丘陵の切盛り・斜面リスクを比較する。]]","comparative_explanation":"沖積低地の軟弱地盤／砂質地盤の液状化／台地・丘陵の切盛り・斜面リスクを比較する。","important_points":"==河川沿い沖積低地＝軟弱の可能性／砂地＋高い地下水＝液状化／台地＝一般に支持力良好。==","trick_patterns":"地形は一般論です。個別土地の安全性の断定には地盤調査が必要。｜本問特有の誤誘導：河川沿いの低地に堆積した沖積土は《軟弱地盤》になり得るため、無条件に重い構造物を支持できる肢1が不適当。\n【誤答注意】設問中の [[WARN:重い構造物を支持できる]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"河川沿い沖積低地＝軟弱の可能性／砂地＋高い地下水＝液状化／台地＝一般に支持力良好。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 1。\nQ2: 本問の主要な判断要件は何か？ A2: 沖積低地の軟弱地盤／砂質地盤の液状化／台地・丘陵の切盛り・斜面リスクを比較する。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"国土交通省 宅地防災資料、地盤工学の基礎 | 国土交通省 宅地防災・地盤の基礎知識 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"河川沿い沖積低地＝軟弱の可能性／砂地＋高い地下水＝液状化／台地＝一般に支持力良好。","marker_red_spans":"重い構造物を支持できる","marker_blue_spans":"沖積低地の軟弱地盤／砂質地盤の液状化／台地・丘陵の切盛り・斜面リスクを比較する。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"true","choice_1_wrong_part":"重い構造物を支持できる","choice_1_reason":"不適当（正解肢）。川が運んだ新しい堆積層は軟弱で圧密沈下等の危険があり、地盤調査・改良なしに大きな荷重を支えられるとは限りません。\n【本肢の根拠・注意点】河川が運んだ沖積堆積物からなる低地は地下水位が高く、軟らかい地層が堆積している場合がある。地盤調査なしに重い構造物を安全に支持できると断定するのは不適当。地形区分と支持力を結びつけて判断する。","choice_1_corrected_statement":"川沿いの低地に堆積している川が運んだ土砂は、支持力が不足する場合もあるため地盤調査等で確認を要する。","choice_1_legal_basis":"国土交通省 宅地防災資料、地盤工学の基礎（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"地形は一般論です。個別土地の安全性の断定には地盤調査が必要。｜不適当（正解肢）。川が運んだ新しい堆積層は軟弱で圧密沈下等の危険があり、地盤調査・改良なしに大きな荷重を支えられるとは限りません。\n層が堆積している場合がある。地盤調査なしに重い構造物を安全に支持できると断定するのは不適当。地形区分と支持力を結びつけて判断する。\nひっかけ箇所：[[WARN:重い構造物を支持できる]]。正しい内容：==んだ土砂は、支持力が不足する場合もあるため地盤調査等で確認を要する。==。","choice_2_truth":"true","choice_2_is_exam_answer":"false","choice_2_wrong_part":"該当なし","choice_2_reason":"適当。砂州・砂丘で地下水位が高い場合、地震時の液状化に注意が必要です。\n【本肢の根拠・注意点】砂州・砂丘の砂は粒径がそろい、浅い地下水位と地震による繰返しせん断が重なると液状化し得る。砂質地盤すべてが必ず液状化するわけではなく、地下水や密度などの要件を見る。\n【補足】透水性が高くても液状化の危険が消えるわけではない。","choice_2_corrected_statement":"原文どおりで正しい。","choice_2_legal_basis":"国土交通省 宅地防災資料、地盤工学の基礎（当該肢と条文の個別照合は要確認）","choice_2_exam_tip":"地形は一般論です。個別土地の安全性の断定には地盤調査が必要。｜適当。砂州・砂丘で地下水位が高い場合、地震時の液状化に注意が必要です。\n地下水位と地震による繰返しせん断が重なると液状化し得る。砂質地盤すべてが必ず液状化するわけではなく、地下水や密度などの要件を見る。","choice_3_truth":"true","choice_3_is_exam_answer":"false","choice_3_wrong_part":"該当なし","choice_3_reason":"適当。丘陵は一般に山地より傾斜が緩いことが多いですが、斜面崩壊のリスクがゼロとは限りません。\n【本肢の根拠・注意点】丘陵は山地に比べ傾斜が緩やかなことが多く、一般論として斜面崩壊の発生可能性を比較できる。ただし谷埋め盛土や人工改変、降雨条件によっては危険もあるため、無条件に安全とは評価しない。\n【補足】安全性は崩壊危険箇所の個別判定が必要。","choice_3_corrected_statement":"原文どおりで正しい。","choice_3_legal_basis":"国土交通省 宅地防災資料、地盤工学の基礎（当該肢と条文の個別照合は要確認）","choice_3_exam_tip":"地形は一般論です。個別土地の安全性の断定には地盤調査が必要。｜適当。丘陵は一般に山地より傾斜が緩いことが多いですが、斜面崩壊のリスクがゼロとは限りません。\nとして斜面崩壊の発生可能性を比較できる。ただし谷埋め盛土や人工改変、降雨条件によっては危険もあるため、無条件に安全とは評価しない。","choice_4_truth":"true","choice_4_is_exam_answer":"false","choice_4_wrong_part":"該当なし","choice_4_reason":"適当。台地は一般に低地より古い地層で構造物を支持しやすい地盤であることが多いです。\n【本肢の根拠・注意点】台地は低地に比べ古い時期に形成された比較的締まった地盤が多く、一般に支持力が期待できる。ただし局所的な盛土や崖地などは別途調査が必要で、地盤の性質を具体的に確認する。\n【補足】局所的な地層の不均一さは別途考慮する。","choice_4_corrected_statement":"原文どおりで正しい。","choice_4_legal_basis":"国土交通省 宅地防災資料、地盤工学の基礎（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"地形は一般論です。個別土地の安全性の断定には地盤調査が必要。｜適当。台地は一般に低地より古い地層で構造物を支持しやすい地盤であることが多いです。\n比較的締まった地盤が多く、一般に支持力が期待できる。ただし局所的な盛土や崖地などは別途調査が必要で、地盤の性質を具体的に確認する。"},{"question_id":"2025-Q50","year":2025,"session":"通常","question_no":50,"major_field":"税・その他","section":"建築構造","unit":"建物の知識","topic":"鋼材の性質・防錆・耐火","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"建物の構造と材料に関する次の記述のうち、最も不適当なものはどれか。","choice_1":"鋼材の素材の鋼は、鉄や炭素などの成分を含んでおり、炭素量が多いものほど、軟質で強度が小さい。","choice_2":"鋼材は、熱に弱く、さびやすいので、耐火や防錆 の処理を施す必要がある。","choice_3":"鋼材は、強度が高く、粘りがあり、比較的小さな断面部材で荷重に耐えることができる。","choice_4":"鋼材の素材の鋼の密度は、木材やコンクリートに比べて大きい。","official_accepted_answers":"1","answer_conclusion":"鋼材は炭素量が増えると一般に《硬く強くなる方向》です。「軟質で弱い」という肢1が不適当。","answer_reason":"【結論】鋼材は炭素量が増えると一般に《硬く強くなる方向》です。「軟質で弱い」という肢1が不適当。\n【解き方】鋼材は鉄に炭素などを含む材料で、炭素量が増えると一般に硬さや強度が上がる一方、靱性・加工性等に影響することがある。従って炭素が多いほど軟らかく強度が小さいとする説明は反対である。鋼材は引張・圧縮に対して高い強度を持ち比較的小断面の構造部材を使えるが、高温で強度が低下し腐食にも弱いため耐火被覆と防錆対策が重要。木材・コンクリートに比べ密度が大きいことも押さえる","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】鋼材は鉄に炭素などを含む材料で、炭素量が増えると一般に硬さや強度が上がる一方、靱性・加工性等に影響することがある。従って炭素が多いほど軟らかく強度が小さいとする説明は反対である。鋼材は引張・圧縮に対して高い強度を持ち比較的小断面の構造部材を使えるが、高温で強度が低下し腐食にも弱いため耐火被覆と防錆対策が重要。木材・コンクリートに比べ密度が大きいことも押さえる。\n【本問への当てはめ】鋼構造は《強度が高い》一方で《火災時の温度上昇に弱い》《錆びる》弱点を持ちます。鋼の組成による硬さ・強さの変化、耐火被覆、防錆塗装、接合方法（溶接・ボルト）が関連論点です。\n【判断順序・類題への対応】鋼材の炭素量と強度／火災時の強度低下／腐食／密度と部材断面の関係を整理する。\n【具体的な当てはめ】鉄骨造の梁を設計する際、高い強度により断面を小さくできるが、耐火被覆や錆止めを省略できる意味ではない。 \n【類題での整理】鋼材の炭素量と強度／火災時の強度低下／腐食／密度と部材断面の関係を整理する。\n【参考になる法令・基準】国土交通省 建築材料・構造の基礎資料","system_purpose":"制度の趣旨：鋼材は鉄に炭素などを含む材料で、炭素量が増えると一般に硬さや強度が上がる一方、靱性・加工性等に影響することがある。従って炭素が多いほど軟らかく強度が小さいとする説明は反対である。鋼材は引張・圧縮に対して高い強度を持ち比較的小断面の構造部材を使えるが、高温で強度が低下し腐食にも弱いため耐火被覆と防錆対策が重要。木材・コンクリートに比べ密度が大きいことも押さえる。","practical_examples":"【具体例】鉄骨造の梁を設計する際、高い強度により断面を小さくできるが、耐火被覆や錆止めを省略できる意味ではない。","advanced_knowledge":"【周辺・発展】鋼構造は《強度が高い》一方で《火災時の温度上昇に弱い》《錆びる》弱点を持ちます。鋼の組成による硬さ・強さの変化、耐火被覆、防錆塗装、接合方法（溶接・ボルト）が関連論点です。\n[[NOTE:鋼材の炭素量と強度／火災時の強度低下／腐食／密度と部材断面の関係を整理する。]]","comparative_explanation":"鋼材の炭素量と強度／火災時の強度低下／腐食／密度と部材断面の関係を整理する。","important_points":"==炭素量↑ → 硬さ・強度↑の傾向／高温で弱くなる／防錆処理が必要。==","trick_patterns":"炭素量が増えればすべての性能が向上するわけではなく、靭性が下がることがあります。｜本問特有の誤誘導：鋼材は炭素量が増えると一般に《硬く強くなる方向》です。「軟質で弱い」という肢1が不適当。\n【誤答注意】設問中の [[WARN:炭素量が多いものほど、軟質で強度が小さい]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"炭素量↑ → 硬さ・強度↑の傾向／高温で弱くなる／防錆処理が必要。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 1。\nQ2: 本問の主要な判断要件は何か？ A2: 鋼材の炭素量と強度／火災時の強度低下／腐食／密度と部材断面の関係を整理する。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"国土交通省 建築材料・構造の基礎資料 | 国土交通省 建築物の構造・建築材料の基礎 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"炭素量↑ → 硬さ・強度↑の傾向／高温で弱くなる／防錆処理が必要。","marker_red_spans":"炭素量が多いものほど、軟質で強度が小さい","marker_blue_spans":"鋼材の炭素量と強度／火災時の強度低下／腐食／密度と部材断面の関係を整理する。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"true","choice_1_wrong_part":"炭素量が多いものほど、軟質で強度が小さい","choice_1_reason":"不適当（正解肢）。炭素量が多い鋼は一般に硬さ・強度が上がる傾向があり、「軟質で強度が小さい」は反対です。靭性や溶接性とのトレードオフもあります。\n【本肢の根拠・注意点】一般的な鋼材では炭素量が増えると硬さ・引張強度が大きくなる傾向がある。炭素が多いほど軟質・低強度という本肢は方向を逆にしており不適当。靱性や溶接性への影響は強度とは分ける。","choice_1_corrected_statement":"鋼材の素材の鋼は、鉄や炭素などの成分を含んでおり、炭素量が増えると一般に硬さや強度が増す一方、靱性・加工性に影響する場合がある。","choice_1_legal_basis":"国土交通省 建築材料・構造の基礎資料（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"炭素量が増えればすべての性能が向上するわけではなく、靭性が下がることがあります。｜不適当（正解肢）。炭素量が多い鋼は一般に硬さ・強度が上がる傾向があり、「軟質で強度が小さい」は反対です。靭性や溶接性とのトレードオフもあります。\n強度が大きくなる傾向がある。炭素が多いほど軟質・低強度という本肢は方向を逆にしており不適当。靱性や溶接性への影響は強度とは分ける。\nひっかけ箇所：[[WARN:炭素量が多いものほど、軟質で強度が小さい]]。正しい内容：==えると一般に硬さや強度が増す一方、靱性・加工性に影響する場合がある。==。","choice_2_truth":"true","choice_2_is_exam_answer":"false","choice_2_wrong_part":"該当なし","choice_2_reason":"適当。鋼は高温で強度が落ち、腐食しやすいため、耐火被覆・塗装等による防火防錆対策が重要です。\n【本肢の根拠・注意点】鋼材は火災等の高温環境で耐力が低下し、湿気や塩分で腐食することがある。構造物の安全性を維持するために耐火被覆や防錆塗装等を施すのは合理的で、強度が高いこととは矛盾しない。\n【補足】鋼材の耐火・防錆は適正な設計維持管理と一体である。","choice_2_corrected_statement":"原文どおりで正しい。","choice_2_legal_basis":"国土交通省 建築材料・構造の基礎資料（当該肢と条文の個別照合は要確認）","choice_2_exam_tip":"炭素量が増えればすべての性能が向上するわけではなく、靭性が下がることがあります。｜適当。鋼は高温で強度が落ち、腐食しやすいため、耐火被覆・塗装等による防火防錆対策が重要です。\n気や塩分で腐食することがある。構造物の安全性を維持するために耐火被覆や防錆塗装等を施すのは合理的で、強度が高いこととは矛盾しない。","choice_3_truth":"true","choice_3_is_exam_answer":"false","choice_3_wrong_part":"該当なし","choice_3_reason":"適当。鋼材は高強度かつ粘り強さがあり、細い柱・梁で大荷重を支えられます。\n【本肢の根拠・注意点】鋼材は強度と靱性を兼ね備え、同じ荷重を支えるために比較的小さい断面で部材を構成できる。この特徴が大スパン建築や高層建築等で鋼構造を採用する理由となる。ただし座屈等への配慮は必要。\n【補足】長いスパンの架構設計にも用いられる。","choice_3_corrected_statement":"原文どおりで正しい。","choice_3_legal_basis":"国土交通省 建築材料・構造の基礎資料（当該肢と条文の個別照合は要確認）","choice_3_exam_tip":"炭素量が増えればすべての性能が向上するわけではなく、靭性が下がることがあります。｜適当。鋼材は高強度かつ粘り強さがあり、細い柱・梁で大荷重を支えられます。\nに比較的小さい断面で部材を構成できる。この特徴が大スパン建築や高層建築等で鋼構造を採用する理由となる。ただし座屈等への配慮は必要。","choice_4_truth":"true","choice_4_is_exam_answer":"false","choice_4_wrong_part":"該当なし","choice_4_reason":"適当。鋼の密度は木材や一般的なコンクリートより高いので、部材重量も設計上考慮します。\n【本肢の根拠・注意点】鋼の密度は木材や一般的なコンクリートより大きい。部材の断面が比較的小さくできることと素材自体の密度が小さいことは別であり、重量計算には密度と部材体積の両方を用いる。\n【補足】素材の重さと構造全体の重さは別の指標である。","choice_4_corrected_statement":"原文どおりで正しい。","choice_4_legal_basis":"国土交通省 建築材料・構造の基礎資料（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"炭素量が増えればすべての性能が向上するわけではなく、靭性が下がることがあります。｜適当。鋼の密度は木材や一般的なコンクリートより高いので、部材重量も設計上考慮します。\nトより大きい。部材の断面が比較的小さくできることと素材自体の密度が小さいことは別であり、重量計算には密度と部材体積の両方を用いる。"}];

 return `<div class="eyebrow">PERFORMANCE ANALYTICS</div><h1>階層別の成績と正答率推移</h1><p class="lead">全体から4大分野→セクション→単元→論点まで絞り込み。初回・復習・累計をそれぞれ計測します。</p><div class="surface"><div class="filterbar extra">${opts('major_field','a-field',ui.analysisField).replace('major_field','4大分野')}${opts('section','a-section',ui.analysisSection)}${opts('unit','a-unit',ui.analysisUnit)}${opts('topic','a-topic',ui.analysisTopic)}</div></div>
 <div class="section-head"><h2>集計対象 ${qs.length}問</h2><span class="small muted">計測：実際に回答した回のみ</span></div><div class="grid kpis">${kpi('累計正答率',s.attempts?s.allCorrect+'%':'—',s.attempts+'回答')}${kpi('初回正答率',s.firstN?s.initialCorrect+'%':'—',s.firstN+'回答')}${kpi('復習正答率',s.reviewN?s.reviewCorrect+'%':'—',s.reviewN+'回答')}${kpi('初回学習率',pct(s.done,qs.length)+'%',s.done+' / '+qs.length+'問',pct(s.done,qs.length))}</div>
 <div class="section-head"><h2>日・週・月の推移</h2></div><div class="surface">${chartControls()}<div class="chart">${trendSvg(qs,ui.trend)}</div>${chartLegend()}<p class="small muted" style="margin:11px 0 0">直近7日 ${currentRate===null?'データなし':currentRate+'%'} ／ それ以前 ${prevRate===null?'データなし':prevRate+'%'}${currentRate!==null&&prevRate!==null?` ／ 変化 ${currentRate-prevRate>=0?'+':''}${currentRate-prevRate}pt`:''}</p></div>
 <div class="section-head"><h2>階層別の結果</h2><select id="a-level" class="control short">${options.map(([k,v])=>`<option value="${k}" ${ui.analyticsLevel===k?'selected':''}>${v}別</option>`).join('')}</select></div><div class="surface">${groupRows(qs,ui.analyticsLevel,'analytics',ui.analyticsLevel)}</div>`}
function plan(){const qs=pool(),s=historyCounts(qs),R=Math.max(1,Number(state.settings.reviewRounds)||1),remainFirst=qs.length-s.done,remainReviews=qs.reduce((z,q)=>z+Math.max(0,R-gotReview(q)),0),f=pace(state.settings.firstTarget,remainFirst),r=pace(state.settings.reviewTarget,remainReviews);const exam=daydiff(today(),state.settings.examDate);return `<div class="eyebrow">LEARNING ROADMAP</div><h1>初回学習と復習の計画</h1><p class="lead">初回学習と復習は別の締切・必要ペースで管理します。試験日までの残日数に応じて自動で更新。</p>
 <div class="grid twocol"><div class="surface"><h2>目標と締切の設定</h2><div class="grid thirds"><label class="formitem"><span class="formlabel">試験日</span><input class="control" type="date" id="p-exam" value="${htmlEscape(state.settings.examDate)}"></label><label class="formitem"><span class="formlabel">初回学習の完了期限</span><input class="control" type="date" id="p-first" value="${htmlEscape(state.settings.firstTarget)}"></label><label class="formitem"><span class="formlabel">復習の目標期限</span><input class="control" type="date" id="p-review" value="${htmlEscape(state.settings.reviewTarget)}"></label></div><div class="gap12"></div><label class="formitem"><span class="formlabel">1問あたりの目標復習回数</span><select class="control short" id="p-rounds">${[1,2,3,4,5].map(n=>`<option value="${n}" ${R===n?'selected':''}>${n}回</option>`).join('')}</select></label><div class="gap12"></div><button class="btn primary" id="plan-save">計画を保存</button><p class="tiny muted" style="margin-top:12px">カウントダウンは画面上部の日付を基準に自動更新。日付は日本時間です。</p></div><div class="surface"><div class="small muted">試験日まで</div><div class="kpi-number">${exam>=0?exam+'日':Math.abs(exam)+'日経過'}</div><h3>進捗とアラート</h3><div class="subtle"><div class="between"><b>初回学習</b><span class="mono">${s.done} / ${qs.length}問</span></div><div class="progress"><i style="width:${pct(s.done,qs.length)}%"></i></div><div class="small muted">必要ペース：${f.daily}問 / 日、残り${remainFirst}問</div></div><div class="gap12"></div><div class="subtle"><div class="between"><b>復習</b><span class="mono">${qs.length*R-remainReviews} / ${qs.length*R}回</span></div><div class="progress"><i style="width:${pct(qs.length*R-remainReviews,qs.length*R)}%"></i></div><div class="small muted">必要ペース：${r.daily}回 / 日、期限到来 ${s.due}問</div></div></div></div>
 <div class="section-head"><h2>優先する学習</h2></div><div class="grid thirds"><div class="surface"><h3>未着手問題</h3><div class="kpi-number">${remainFirst}問</div><button class="btn" data-view="practice" data-prep="new">初回学習へ</button></div><div class="surface"><h3>復習期限到来</h3><div class="kpi-number">${s.due}問</div><button class="btn" data-view="review">期限到来の復習へ</button></div><div class="surface"><h3>間違えた経験のある問題</h3><div class="kpi-number">${s.wrong}問</div><button class="btn" data-view="review" data-review="wrong">苦手の克服へ</button></div></div><p class="small muted" style="margin-top:14px">※ 期限が来ていない問題は「復習期限到来」に表示しません。「初回済み全件」から繰り返し復習できます。</p>`}
function manage(){const s=historyCounts(BANK),persist=Object.keys(state.history).length;return `<div class="eyebrow">DATA & QUALITY</div><h1>データ管理</h1><p class="lead">2023〜2025年の150問だけを収録した単独HTMLです。以前の600問・旧HTMLの問題データは含めていません。</p><div class="grid twocol"><div class="surface"><h2>学習データの保存・復元</h2><p class="small muted">学習履歴は、このブラウザのローカルストレージに保存します。別端末へ移す場合は、JSONバックアップをご利用ください。</p><div class="flex"><button class="btn primary" data-action="export">学習履歴をJSONで保存</button><button class="btn" data-action="import">JSONを読み込む</button></div><div class="separator"></div><p class="small muted">保存済み学習記録：${persist}問 ／ 合計${s.attempts}回答</p><button class="btn" style="color:var(--bad)" data-action="reset">この統合版の学習履歴を初期化</button>${ui.importError?`<p class="small" style="color:var(--bad)">${htmlEscape(ui.importError)}</p>`:''}</div><div class="surface"><h2>収録問題・品質監査</h2><p>2025年 50問 ／ 2024年 50問 ／ 2023年 50問</p><p class="small muted">解説QA PASS：${BANK.filter(q=>q.qa_status==='PASS').length}問 ／ REWORK：${BANK.filter(q=>q.qa_status!=='PASS').length}問</p><div class="alerts">問題の4肢選択と採点を提供していますが、解説の法令根拠および2026年度改正適合性は全問最終確認済みではありません。過去問の正解と2026年時点の判断を混同しないでください。</div></div></div><div class="section-head"><h2>問題一覧</h2><button class="btn smallbtn" data-view="practice">問題演習へ</button></div><div class="surface">${[2025,2024,2023].map(y=>{const qs=BANK.filter(q=>q.year===y);return `<h3>${y}年（50問）</h3><div class="question-list">${qs.map(q=>`<button class="qid ${gotFirst(q)?'done':''} ${hasWrong(q)?'wrong':''}" data-jump="${q.question_id}">${q.question_no.toString().padStart(2,'0')}<em>${gotReview(q)?'復習済':gotFirst(q)?'初回済':'未着手'}</em></button>`).join('')}</div><div class="gap12"></div>`}).join('')}</div>`}
function render(){setupChrome();const el=document.querySelector('#app');let html=ui.view==='dashboard'?dashboard():ui.view==='modes'?modesPage():ui.view==='practice'||ui.view==='review'?questionView():ui.view==='analytics'?analytics():ui.view==='plan'?plan():manage();el.innerHTML=html+(ui.toast?`<p role="status" class="small muted" style="padding:12px">${htmlEscape(ui.toast)}</p>`:'');ui.toast=''}
function resetFilters(){ui.field=ui.section=ui.unit=ui.topic='all';ui.search='';ui.status='all';ui.qa='all';ui.page=0}
function updateFilters(id,value){if(id==='f-search')ui.search=value;else if(id==='f-field'){ui.field=value;ui.section=ui.unit=ui.topic='all'}else if(id==='f-section'){ui.section=value;ui.unit=ui.topic='all'}else if(id==='f-unit'){ui.unit=value;ui.topic='all'}else if(id==='f-topic')ui.topic=value;else if(id==='f-status')ui.status=value;else if(id==='f-qa')ui.qa=value;else if(id==='f-order')ui.order=value;else if(id==='f-size'){ui.pageSize=Number(value);state.settings.pageSize=ui.pageSize;save()}ui.page=0;render();if(id==='f-search'){const input=document.querySelector('#f-search');input?.focus();input?.setSelectionRange(value.length,value.length)}}
function recordAnswer(q,n){const id=q.question_id,accepted=q.official_accepted_answers.split('|'),right=accepted.includes(String(n));let h=state.history[id]??={attempts:[],star:false,streak:0};if(!Array.isArray(h.attempts))h.attempts=[];const phase=h.attempts.length?'review':'first';h.attempts.push({t:new Date().toISOString(),choice:Number(n),correct:right,phase});h.streak=right?(h.streak||0)+1:0;const interval=right?[0,2,4,7,14,30][Math.min(5,h.streak)]||30:1;h.due=plusDays(today(),interval);ui.selected[id]=n;ui.expanded[id]=true;ui.revealed[id]=true;ui.expTab[id]='choices';if(ui.session&&ui.session.ids.includes(id))ui.session.answered[id]=right;save()}
function jumpTo(qid){const q=BYID[qid];if(!q)return;ui.session=null;ui.view='practice';ui.year=String(q.year);ui.field=ui.section=ui.unit=ui.topic='all';ui.status=ui.qa='all';ui.search='';ui.order='year';ui.page=Math.floor((q.question_no-1)/ui.pageSize);render();requestAnimationFrame(()=>document.getElementById('q-'+qid)?.scrollIntoView({behavior:'smooth',block:'start'}))}
function downloadJson(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function refreshKeep(){const y=window.scrollY;render();window.scrollTo(0,y)}
document.addEventListener('click',ev=>{const target=ev.target.closest('button,[data-pick]');if(!target)return;
 if(target.dataset.mode){ui.modeDraft=target.dataset.mode;ui.modeError='';if(ui.modeDraft==='exam'&&ui.modeYear==='all')ui.modeYear='2025';if(ui.modeDraft!=='exam'&&ui.modeYear==='2025'&&ui.modeField==='all')ui.modeYear='all';ui.modeCount=ui.modeDraft==='exam'?'all':(ui.modeCount==='all'?'10':ui.modeCount);render();return}
 if(target.dataset.action==='start-mode'){startMode();return}
 if(target.dataset.action==='reshuffle'){startMode();return}
 if(target.dataset.view){showView(target.dataset.view);if(target.dataset.prep==='new'){ui.status='new';render()}if(target.dataset.review){ui.reviewMode=target.dataset.review;render()}return}
 if(target.dataset.jump){jumpTo(target.dataset.jump);return}
 if(target.dataset.group){const group=target.dataset.group,key=target.dataset.groupKey,view=target.dataset.groupView; if(view==='analytics'){if(key==='major_field'){ui.analysisField=group;ui.analysisSection=ui.analysisUnit=ui.analysisTopic='all'}else if(key==='section'){ui.analysisSection=group;ui.analysisUnit=ui.analysisTopic='all'}else if(key==='unit'){ui.analysisUnit=group;ui.analysisTopic='all'}else ui.analysisTopic=group;render()}else{ui.view='practice';ui.field=key==='major_field'?group:'all';ui.section=key==='section'?group:'all';ui.unit=key==='unit'?group:'all';ui.topic=key==='topic'?group:'all';ui.status='all';ui.page=0;render();window.scrollTo(0,0)}return}
 if(target.dataset.trend){ui.trend=target.dataset.trend;refreshKeep();return}
 if(target.dataset.page){let qs=filtered();ui.page=Math.max(0,Math.min(Math.ceil(qs.length/ui.pageSize)-1,ui.page+(target.dataset.page==='next'?1:-1)));render();window.scrollTo({top:0,behavior:'auto'});return}
 if(target.dataset.reviewMode){ui.reviewMode=target.dataset.reviewMode;ui.page=0;render();return}
 if(target.dataset.pick){const id=target.dataset.pick;if(ui.revealed[id]&&ui.expanded[id]!=='retry')return;ui.selected[id]=Number(target.dataset.choice);refreshKeep();return}
 if(target.dataset.grade){const q=BYID[target.dataset.grade],n=ui.selected[q.question_id];if(!n)return;recordAnswer(q,n);refreshKeep();return}
 if(target.dataset.retry){const id=target.dataset.retry;state.history[id].attempts=state.history[id].attempts||[];ui.selected[id]='';ui.expanded[id]=false;ui.revealed[id]=false; // Keep past attempts but hide the old answer
 refreshKeep();return}
 if(target.dataset.expand){const id=target.dataset.expand;ui.expanded[id]=!ui.expanded[id];refreshKeep();return}
 if(target.dataset.star){const id=target.dataset.star;state.history[id]??={attempts:[]};state.history[id].star=!state.history[id].star;save();refreshKeep();return}
 if(target.dataset.exp){ui.expTab[target.dataset.exp]=target.dataset.tab;refreshKeep();return}
 if(target.dataset.saveNote){const id=target.dataset.saveNote;state.history[id]??={attempts:[]};state.history[id].note=document.getElementById('note-'+id)?.value||'';save();ui.toast='メモを保存しました。';refreshKeep();return}
 if(target.dataset.action==='clear-filter'){resetFilters();render();return}
 if(target.dataset.action==='export'){downloadJson({app:'takken_master_2023_2025',version:2,exported_at:new Date().toISOString(),history:state.history,settings:state.settings},'takken_master_study_backup_'+today()+'.json');return}
 if(target.dataset.action==='import'){document.querySelector('#import-file').click();return}
 if(target.dataset.action==='reset'){if(confirm('この統合版の学習履歴・メモ・お気に入りを初期化します。よろしいですか？')){state.history={};save();render()}return}
 if(target.id==='plan-save'){for(const [id,key] of [['p-exam','examDate'],['p-first','firstTarget'],['p-review','reviewTarget']]){const val=document.getElementById(id)?.value;if(val)state.settings[key]=val}state.settings.reviewRounds=Number(document.querySelector('#p-rounds')?.value)||1;save();ui.toast='計画を保存しました。';render();return}
 if(target.id==='theme-top'){state.settings.theme=state.settings.theme==='dark'?'light':'dark';save();render();return}
 });
document.addEventListener('change',e=>{const id=e.target.id,v=e.target.value;
 if(id.startsWith('m-')){if(id==='m-year'){ui.modeYear=v;ui.modeField=ui.modeSection=ui.modeUnit=ui.modeTopic='all'}else if(id==='m-field'){ui.modeField=v;ui.modeSection=ui.modeUnit=ui.modeTopic='all'}else if(id==='m-section'){ui.modeSection=v;ui.modeUnit=ui.modeTopic='all'}else if(id==='m-unit'){ui.modeUnit=v;ui.modeTopic='all'}else if(id==='m-topic')ui.modeTopic=v;else if(id==='m-count')ui.modeCount=v;else if(id==='m-size'){ui.pageSize=Number(v);state.settings.pageSize=ui.pageSize;save()}ui.modeError='';render();return}
 if(id==='session-size'){ui.pageSize=Number(v);state.settings.pageSize=ui.pageSize;ui.page=0;save();render();return}if(id==='year-top'){if(ui.view==='modes'){ui.modeYear=v;ui.modeField=ui.modeSection=ui.modeUnit=ui.modeTopic='all';if(ui.modeDraft==='exam'&&v==='all')ui.modeYear='2025';render();return}if(ui.session){ui.session=null;ui.modeYear=v;ui.modeDraft=v==='all'?'random':'exam';ui.modeCount='all';ui.view='modes';ui.modeError='対象年度を変更しました。出題条件を確認して開始してください。';ui.year=v;render();return}ui.year=v;state.settings.year=v;resetFilters();ui.selected={};ui.expanded={};ui.revealed={};ui.page=0;save();render();return}if(id.startsWith('f-')){updateFilters(id,v);return}if(id==='a-level'){ui.analyticsLevel=v;render();return}if(id.startsWith('a-')){let mapping={'a-field':'analysisField','a-section':'analysisSection','a-unit':'analysisUnit','a-topic':'analysisTopic'};ui[mapping[id]]=v;if(id==='a-field'){ui.analysisSection=ui.analysisUnit=ui.analysisTopic='all'}if(id==='a-section')ui.analysisUnit=ui.analysisTopic='all';if(id==='a-unit')ui.analysisTopic='all';render();return}});
let searchDebounce;document.addEventListener('input',e=>{if(e.target.id!=='f-search')return;clearTimeout(searchDebounce);const v=e.target.value;searchDebounce=setTimeout(()=>updateFilters('f-search',v),230)});
document.querySelector('#import-file').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const raw=JSON.parse(await f.text());if(raw.app!=='takken_master_2023_2025'||typeof raw.history!=='object'||!raw.history)throw Error('この統合版で書き出したJSONではありません。');const filteredHistory={};for(const [id,h] of Object.entries(raw.history)){if(BYID[id]&&h&&typeof h==='object'&&Array.isArray(h.attempts)){filteredHistory[id]={...h,attempts:h.attempts.filter(a=>a&&[1,2,3,4].includes(Number(a.choice))&&typeof a.correct==='boolean')}}}if(!confirm(`${Object.keys(filteredHistory).length}問分の学習履歴を取り込みます。現在の履歴を上書きしてよろしいですか？`))return;state.history=filteredHistory;save();ui.importError='';ui.toast='履歴を復元しました。'}catch(err){ui.importError=err.message}finally{e.target.value='';render()}});
// Search input focus and year navigation work without any external requests.
render();
</script></body></html>
