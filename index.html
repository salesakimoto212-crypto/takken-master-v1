関係が異なる。本肢の対比は出題時の制度に沿う。 イ：誤り。建築確認を要する物件では、確認を受ける前は契約締結だけでなく広告開始にも規制が及ぶ。「広告だけは可能」が誤り。 ウ：誤り。宅建業者同士の売買に、非業者買主を保護する手付金等保全措置などの8種制限を一律に適用しない。 エ：正しい。専属専任媒介契約の指定流通機構登録は、締結日から休業日を除いて5日以内が原則。 【数え方】正しいものは2つ。","choice_4_corrected_statement":"正しい判断は「アとエが正しく、イとウは誤り」。設問に対する正解の選択肢は2である。","choice_4_legal_basis":"宅地建物取引業法33条・33条の2・34条の2・40条以下（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"個数・組合せ問題ではア〜エの真偽を先に確定し、数だけ最後に合わせる。未完成物件では「広告の開始時期」と「契約の締結時期」を別々の条文で確認。｜誤り。「なし」ではありません。ア・エは適法な内容です。"},{"question_id":"2025-Q29","year":2025,"session":"通常","question_no":29,"major_field":"宅建業法","section":"宅建業法","unit":"37条書面","topic":"交付義務・記載事項・既存建物","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"宅地建物取引業者Ａが宅地建物取引業法第37 条の規定により交付すべき書面（以下この問において「37 条書面」という。）に関する次の記述のうち、正しいものはどれか。","choice_1":"Ａが媒介により事業用宅地の賃貸借契約を成立させた場合、37 条書面を交付しなければならないが、契約の当事者Ｂが宅地建物取引業者であるときは、交付する必要はない。","choice_2":"Ａが自ら売主としてＣと既存の建物の売買契約を締結した場合、建物の構造耐力上主要な部分等の状況について当事者の双方が確認した事項を37 条書面に記載しなければならない。","choice_3":"ＡがＤを売主としＥを買主とする宅地の売買契約を媒介した場合、天災その他不可抗力による損害の負担に関する定めがないときは、定めがない旨を37 条書面に記載しなければならない。","choice_4":"Ａが自ら売主としてＦと建物の売買契約を締結した場合、代金についての金銭の貸借のあっせんに関する定めがある場合における当該あっせんに係る金銭の貸借が成立しないときの措置については、37 条書面に記載する必要はない。","official_accepted_answers":"2","answer_conclusion":"既存建物の売買では、当事者双方が確認した《構造耐力上主要な部分等の状況》を37条書面に記載します。肢2が正しい。","answer_reason":"【結論】既存建物の売買では、当事者双方が確認した《構造耐力上主要な部分等の状況》を37条書面に記載します。肢2が正しい。\n【解き方】37条書面は宅地建物取引業者が売買・交換・貸借の契約が成立した後に契約当事者へ交付する書面で、契約の当事者、価格・支払時期、引渡し等の重要な合意内容を記載する。既存建物の売買では、建物の構造耐力上主要な部分または雨水の浸入を防止する部分の状況について当事者双方が確認した事項を記載する規定がある。建物状況調査の結果概要を説明する35条の問題と、成立後の双方確認","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】37条書面は宅地建物取引業者が売買・交換・貸借の契約が成立した後に契約当事者へ交付する書面で、契約の当事者、価格・支払時期、引渡し等の重要な合意内容を記載する。既存建物の売買では、建物の構造耐力上主要な部分または雨水の浸入を防止する部分の状況について当事者双方が確認した事項を記載する規定がある。建物状況調査の結果概要を説明する35条の問題と、成立後の双方確認事項を記録する37条の問題は近接するが別の義務である。\n【本問への当てはめ】37条書面は成立後の紛争防止が目的です。《必ず記載する事項》と《定めがある場合のみ記載する事項》を分けて学習しましょう。既存住宅で双方が確認した建物の状態について書面に残すのは、雨漏り・主要構造部の不具合などの認識違いを防ぐためです。\n【判断順序・類題への対応】35条は購入判断の説明／37条は当事者が合意・確認した事実の書面化。既存建物の確認事項を混同しない。\n【具体的な当てはめ】中古住宅で買主と売主が雨漏りの状況について双方確認したなら、取引士の説明資料と契約成立後の書面記載を分けて確認する。 ","system_purpose":"制度の趣旨：37条書面は宅地建物取引業者が売買・交換・貸借の契約が成立した後に契約当事者へ交付する書面で、契約の当事者、価格・支払時期、引渡し等の重要な合意内容を記載する。既存建物の売買では、建物の構造耐力上主要な部分または雨水の浸入を防止する部分の状況について当事者双方が確認した事項を記載する規定がある。建物状況調査の結果概要を説明する35条の問題と、成立後の双方確認事項を記録する37条","practical_examples":"【具体例】中古住宅で買主と売主が雨漏りの状況について双方確認したなら、取引士の説明資料と契約成立後の書面記載を分けて確認する。","advanced_knowledge":"【周辺・発展】37条書面は成立後の紛争防止が目的です。《必ず記載する事項》と《定めがある場合のみ記載する事項》を分けて学習しましょう。既存住宅で双方が確認した建物の状態について書面に残すのは、雨漏り・主要構造部の不具合などの認識違いを防ぐためです。\n[[NOTE:35条は購入判断の説明／37条は当事者が合意・確認した事実の書面化。既存建物の確認事項を混同しない。]]","comparative_explanation":"35条は購入判断の説明／37条は当事者が合意・確認した事実の書面化。既存建物の確認事項を混同しない。","important_points":"==37条＝契約成立後／既存建物の双方確認事項／業者間でも交付を暗記。==","trick_patterns":"「書面の交付義務」と「取引士の説明義務」を同じものとして扱わない。｜本問特有の誤誘導：既存建物の売買では、当事者双方が確認した《構造耐力上主要な部分等の状況》を37条書面に記載します。肢2が正しい。\n【誤答注意】設問中の [[WARN:37 条書面に記載する必要はない]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"37条＝契約成立後／既存建物の双方確認事項／業者間でも交付を暗記。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 2。\nQ2: 本問の主要な判断要件は何か？ A2: 35条は購入判断の説明／37条は当事者が合意・確認した事実の書面化。既存建物の確認事項を混同しない。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"宅地建物取引業法37条1項2号の2 | 宅地建物取引業法37条1項2号の2 / 国土交通省「37条書面への当事者双方確認事項の記載」 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"37条＝契約成立後／既存建物の双方確認事項／業者間でも交付を暗記。","marker_red_spans":"37 条書面に記載する必要はない","marker_blue_spans":"35条は購入判断の説明／37条は当事者が合意・確認した事実の書面化。既存建物の確認事項を混同しない。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"契約の当事者Ｂが宅地建物取引業者であるときは、交付する必要はない","choice_1_reason":"誤り。37条書面は相手方が宅建業者であっても必要です。業者間取引でも書面交付義務が一律になくなるわけではありません。\n【本肢の根拠・注意点】37条書面の交付義務は取引の相手方が宅建業者であっても原則として残る。業者間取引で特定の消費者保護規制が適用されないことと、契約内容を書面で確定する37条の義務は別。賃貸借の媒介にも交付が必要。","choice_1_corrected_statement":"Ａが媒介により事業用宅地の賃貸借契約を成立させた場合、37 条書面を交付しなければならないが、相手方Ｂが宅地建物取引業者であるときも37条書面を交付しなければならない。","choice_1_legal_basis":"宅地建物取引業法37条1項2号の2（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"「書面の交付義務」と「取引士の説明義務」を同じものとして扱わない。｜誤り。37条書面は相手方が宅建業者であっても必要です。業者間取引でも書面交付義務が一律になくなるわけではありません。\n残る。業者間取引で特定の消費者保護規制が適用されないことと、契約内容を書面で確定する37条の義務は別。賃貸借の媒介にも交付が必要。\nひっかけ箇所：[[WARN:契約の当事者Ｂが宅地建物取引業者であると]]。正しい内容：==Ｂが宅地建物取引業者であるときも37条書面を交付しなければならない。==。","choice_2_truth":"true","choice_2_is_exam_answer":"true","choice_2_wrong_part":"該当なし","choice_2_reason":"正しい。既存建物の売買で双方が確認した構造耐力上主要な部分等の状況は、37条書面の法定記載事項です。\n【本肢の根拠・注意点】既存住宅の売買で構造耐力上主要な部分等について当事者双方が確認した事項があるなら、37条書面への記載対象となる。インスペクションの実施有無の説明と、契約当事者が確認した内容の記録は役割が違う。","choice_2_corrected_statement":"原文どおりで正しい","choice_2_legal_basis":"宅地建物取引業法37条1項2号の2（当該肢と条文の個別照合は要確認）","choice_2_exam_tip":"「書面の交付義務」と「取引士の説明義務」を同じものとして扱わない。｜正しい。既存建物の売買で双方が確認した構造耐力上主要な部分等の状況は、37条書面の法定記載事項です。\nした事項があるなら、37条書面への記載対象となる。インスペクションの実施有無の説明と、契約当事者が確認した内容の記録は役割が違う。","choice_3_truth":"false","choice_3_is_exam_answer":"false","choice_3_wrong_part":"定めがない旨を37 条書面に記載しなければならない","choice_3_reason":"誤り。危険負担に関する《定めがあるとき》に記載する事項で、定めがないことを一律に記載しなければならないわけではありません。\n【本肢の根拠・注意点】天災その他不可抗力による損害の負担は、契約でその定めを置いた場合に37条書面へ記載する条件付き項目。定めがない契約で「定めなし」と積極的に記載する義務を常に課すことはできない。","choice_3_corrected_statement":"ＡがＤを売主としＥを買主とする宅地の売買契約を媒介した場合、天災その他不可抗力による損害の負担に関する定めがないときは、危険負担について定めがない場合に「定めなし」と記載する法定義務はない。","choice_3_legal_basis":"宅地建物取引業法37条1項2号の2（当該肢と条文の個別照合は要確認）","choice_3_exam_tip":"「書面の交付義務」と「取引士の説明義務」を同じものとして扱わない。｜誤り。危険負担に関する《定めがあるとき》に記載する事項で、定めがないことを一律に記載しなければならないわけではありません。\nの定めを置いた場合に37条書面へ記載する条件付き項目。定めがない契約で「定めなし」と積極的に記載する義務を常に課すことはできない。\nひっかけ箇所：[[WARN:定めがない旨を37 条書面に記載しなけれ]]。正しい内容：==険負担について定めがない場合に「定めなし」と記載する法定義務はない。==。","choice_4_truth":"false","choice_4_is_exam_answer":"false","choice_4_wrong_part":"37 条書面に記載する必要はない","choice_4_reason":"誤り。融資のあっせんの定めがある場合、その貸借が成立しないときの措置は37条書面の記載事項です。\n【本肢の根拠・注意点】代金について融資のあっせんを定めたときは、融資が成立しない場合の措置も37条書面の条件付き記載対象になる。住宅ローン不成立時に契約をどう扱うかは当事者の重要な合意であり、省略できない。","choice_4_corrected_statement":"Ａが自ら売主としてＦと建物の売買契約を締結した場合、代金についての金銭の貸借のあっせんに関する定めがある場合における当該あっせんに係る金銭の貸借が成立しないときの措置については、37条書面に記載しなければならない。","choice_4_legal_basis":"宅地建物取引業法37条1項2号の2（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"「書面の交付義務」と「取引士の説明義務」を同じものとして扱わない。｜誤り。融資のあっせんの定めがある場合、その貸借が成立しないときの措置は37条書面の記載事項です。\nない場合の措置も37条書面の条件付き記載対象になる。住宅ローン不成立時に契約をどう扱うかは当事者の重要な合意であり、省略できない。\nひっかけ箇所：[[WARN:37 条書面に記載する必要はない]]。正しい内容：==成立しないときの措置については、37条書面に記載しなければならない。==。"},{"question_id":"2025-Q30","year":2025,"session":"通常","question_no":30,"major_field":"宅建業法","section":"宅建業法","unit":"業者売主の複合規制","topic":"共同売主・35条・クーリングオフ・手付金保全","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_incorrect","question_text":"いずれも宅地建物取引業者であるＡ社、Ｂ社及びＣ社（以下この問において「売主ら」という。）が、分譲マンションを共同で建築、販売することとなり、建築確認を受けた後、工事完了前にその一室を5,000 万円で宅地建物取引業者ではない個人である買主に売却しようとする場合に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）に違反するものはいくつあるか。ア　売主らは、共同する全社が各個に重要事項説明を実施すると、かえって買主を混乱させると考え、買主の了解を得た上で、Ａ社1 社を幹事社とし、Ａ社の宅地建物取引士が単独で重要事項説明書に記名のうえ、買主に交付し説明を行った。イ　売主らは、Ａ社の事務所において買主から買受けの申込みを受け、売買契約を締結したが、売主らは当該売買契約には法第37 条の2 の規定に基づくいわゆるクーリング・オフの適用はないと判断し、クーリング・オフについて買主に告げる書面の交付は行わなかった。ウ　売主らは、当該物件については、重要事項説明の時点では共用部分に関する規約が案であるので、買主の了解を得た上で、契約締結後に決定した規約を交付することとし、重要事項説明書への記載は省略した。エ　売主らは買主から手付金500 万円を受領することとしたが、手付金の保全措置を講じる必要はないと判断し、手付金保全措置の概要について重要事項説明書への記載は省略した。","choice_1":"一つ","choice_2":"二つ","choice_3":"三つ","choice_4":"四つ","official_accepted_answers":"3","answer_conclusion":"共同売主のマンション販売では《ア・ウ・エの3つが違反》し、肢3が正解です。","answer_reason":"【結論】共同売主のマンション販売では《ア・ウ・エの3つが違反》し、肢3が正解です。\n【解き方】共同売主でも宅建業者が非業者へ自ら売主として販売する場合、各業者の法令遵守責任がなくなるわけではない。未完成物件に係る手付金等は一定割合・一定金額を超える前に保全措置が必要であり、完成物件より基準が厳しい。分譲マンションの35条説明には共用部分・規約等に関する事項が含まれる。クーリング・オフでは申込者がどの場所で申込みをしたかが重要で、買主都合で訪れた営業所","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】共同売主でも宅建業者が非業者へ自ら売主として販売する場合、各業者の法令遵守責任がなくなるわけではない。未完成物件に係る手付金等は一定割合・一定金額を超える前に保全措置が必要であり、完成物件より基準が厳しい。分譲マンションの35条説明には共用部分・規約等に関する事項が含まれる。クーリング・オフでは申込者がどの場所で申込みをしたかが重要で、買主都合で訪れた営業所等の場合と、事業者が訪問して勧誘した場合を分ける。違反の個数問題ではア〜エの取引経過に即して数える。\n【本問への当てはめ】《ア》違反：共同売主なら重要事項説明の責任も各社が負い、A社の取引士の単独記名だけで他社の法定義務を満たすとすることはできません。《イ》違反なし：宅建業者の事務所で買受け申込みした場合は原則クーリング・オフの対象外。《ウ》違反：マンション共用部分の規約が案の段階でも重説対象。《エ》違反：未完成物件5000万円に対する手付500万円（10％）は5％・1000万円の基準を超え、保全措置を要します。\n【判断順序・類題への対応】未完成物件の保全5％・1000万円／完成物件10％・1000万円／重要事項とクーリング・オフの場所要件。\n【構成記述の検討】ア：違反。共同売主の重要事項説明義務は各社が負い、幹事社の取引士だけの記名で他の売主業者の法定義務を免れない。 イ：違反ではない。買主が売主業者の事務所で申込みをしていれば、通常はクーリング・オフの対象外となる。 ウ：違反。共用部分の管理規約が案であってもマンション取引の重要事項として説明の対象となる。 エ：違反。未完成物件5000万円で手付500万円は5％を超えるため保全措置の要否を検討すべきで、必要な説明を省略できない。","system_purpose":"制度の趣旨：共同売主でも宅建業者が非業者へ自ら売主として販売する場合、各業者の法令遵守責任がなくなるわけではない。未完成物件に係る手付金等は一定割合・一定金額を超える前に保全措置が必要であり、完成物件より基準が厳しい。分譲マンションの35条説明には共用部分・規約等に関する事項が含まれる。クーリング・オフでは申込者がどの場所で申込みをしたかが重要で、買主都合で訪れた営業所等の場合と、事業者が","practical_examples":"【具体例】三社が共同販売する分譲マンションで広告、重要事項説明、手付受領、申込場所の手続が分かれた場合も各手続を切り分ける。","advanced_knowledge":"【周辺・発展】《ア》違反：共同売主なら重要事項説明の責任も各社が負い、A社の取引士の単独記名だけで他社の法定義務を満たすとすることはできません。《イ》違反なし：宅建業者の事務所で買受け申込みした場合は原則クーリング・オフの対象外。《ウ》違反：マンション共用部分の規約が案の段階でも重説対象。《エ》違反：未完成物件5000万円に対する手付500万円（10％）は5％・1000万円の基準を超え、保全措置を要します。\n[[NOTE:未完成物件の保全5％・1000万円／完成物件10％・1000万円／重要事項とクーリング・オフの場所要件。]]","comparative_explanation":"未完成物件の保全5％・1000万円／完成物件10％・1000万円／重要事項とクーリング・オフの場所要件。","important_points":"==共同売主でも各社責任／管理規約案も重説／未完成5％超の手付は保全／申込場所でCO判定。==","trick_patterns":"買主が了承しても法定の説明・保全義務は省略できない。｜本問特有の誤誘導：共同売主のマンション販売では《ア・ウ・エの3つが違反》し、肢3が正解です。\n【誤答注意】設問中の [[WARN:一つ]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"共同売主でも各社責任／管理規約案も重説／未完成5％超の手付は保全／申込場所でCO判定。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 3。\nQ2: 本問の主要な判断要件は何か？ A2: 未完成物件の保全5％・1000万円／完成物件10％・1000万円／重要事項とクーリング・オフの場所要件。。\nQ3: ア〜エの各判定は？ A3: ア：違反。共同売主の重要事項説明義務は各社が負い、幹事社の取引士だけの記名で他の売主業者の法定義務を免れない。／イ：違反ではない。買主が売主業者の事務所で申込みをしていれば、通常はクーリング・オフの対象外となる。／ウ：違反。共用部分の管理規約が案であってもマンション取引の重要事項として説明の対象となる。／エ：違反。未完成物件5000万円で手付500万円は5％を超えるため保全措置の要否を検討すべきで、必要な説明を省略できない。","substatement_reasoning":"ア：違反。共同売主の重要事項説明義務は各社が負い、幹事社の取引士だけの記名で他の売主業者の法定義務を免れない。\nイ：違反ではない。買主が売主業者の事務所で申込みをしていれば、通常はクーリング・オフの対象外となる。\nウ：違反。共用部分の管理規約が案であってもマンション取引の重要事項として説明の対象となる。\nエ：違反。未完成物件5000万円で手付500万円は5％を超えるため保全措置の要否を検討すべきで、必要な説明を省略できない。\n【数え方】法違反は3つ。","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"宅地建物取引業法35条・37条の2・41条 | 宅地建物取引業法35条・37条の2・41条 / 宅建業法施行規則 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"共同売主でも各社責任／管理規約案も重説／未完成5％超の手付は保全／申込場所でCO判定。","marker_red_spans":"一つ","marker_blue_spans":"未完成物件の保全5％・1000万円／完成物件10％・1000万円／重要事項とクーリング・オフの場所要件。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"一つ","choice_1_reason":"誤り。一つだけでなく、ア・ウ・エが違反しています。\n【構成要素の理由】違反。共同売主の重要事項説明義務は各社が負い、幹事社の取引士だけの記名で他の売主業者の法定義務を免れない。／違反ではない。買主が売主業者の事務所で申込みをしていれば、通常はクーリング・オフの対象外となる。／違反。共用部分の管理規約が案であってもマンション取引の重要事項として説明の対象となる。／違反。未完成物件5000万円で手付500万円は5％を超えるため保全措置の要否を検討すべきで、必要な説明を省略で。\n【結論】本肢「一つ」は 法違反を3つと数えた結果に合致しない。\n【要素ごとの判定】ア：違反。共同売主の重要事項説明義務は各社が負い、幹事社の取引士だけの記名で他の売主業者の法定義務を免れない。 イ：違反ではない。買主が売主業者の事務所で申込みをしていれば、通常はクーリング・オフの対象外となる。 ウ：違反。共用部分の管理規約が案であってもマンション取引の重要事項として説明の対象となる。 エ：違反。未完成物件5000万円で手付500万円は5％を超えるため保全措置の要否を検討すべきで、必要な説明を省略できない。 【数え方】法違反は3つ。","choice_1_corrected_statement":"正しい判断は「ア・ウ・エが違反し、イは違反しない」。設問に対する正解の選択肢は3である。","choice_1_legal_basis":"宅地建物 される。宅建業務に従事する従業者には証明書を携帯させ、相手方から求められたときの提示義務もある。近隣の将来環境など不確実な事項について断定的判断を提供して誤認させる行為も問","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】宅建業法の勧誘規制は契約が成立したかに関わらず、勧誘の手段・説明内容自体を対象とする。勧誘者は業者名・自分の氏名・勧誘目的を明示しなければならず、不適切な威迫や申込み撤回を妨げる行為は禁止される。宅建業務に従事する従業者には証明書を携帯させ、相手方から求められたときの提示義務もある。近隣の将来環境など不確実な事項について断定的判断を提供して誤認させる行為も問題となる。複合問題はアからエまでを個別に認定してから正解数を数える。\n【本問への当てはめ】《ア》氏名を名乗らず勧誘：業者の名称・勧誘者の氏名・勧誘目的を先に明示する義務に違反。《イ》申込み撤回者へ怒鳴り・来所強要：威迫による撤回妨害に該当。《ウ》アルバイトも宅建業務従事者であれば従業者証明書携帯が必要。チラシ配布も業務。《エ》将来にわたり高層建築物ができないと根拠なく断定する行為は、将来の環境に関して誤解させる断定的判断の提供に当たります。\n【判断順序・類題への対応】勧誘方法規制／従業者証明書／将来の不確実な事項の断定的判断の提供を区別。\n【構成記述の検討】ア：禁止行為。勧誘者本人の氏名を告げておらず、業者名・免許番号のみでは勧誘者の氏名の明示義務を満たさない。 イ：禁止行為。撤回希望者を威迫し来所を強制する言動は、後に撤回を受け付けたとしても違反が解消されるわけではない。 ウ：禁止行為。広告チラシ配布を含む宅建業務に従事させるアルバイトは従業者証明書を携帯する必要がある。 エ：禁止行為。将来にわたり高層建築物が建たないと根拠なく断定して購入を促すことは将来の環境について誤認を生じさせる。","system_purpose":"制度の趣旨：宅建業法の勧誘規制は契約が成立したかに関わらず、勧誘の手段・説明内容自体を対象とする。勧誘者は業者名・自分の氏名・勧誘目的を明示しなければならず、不適切な威迫や申込み撤回を妨げる行為は禁止される。宅建業務に従事する従業者には証明書を携帯させ、相手方から求められたときの提示義務もある。近隣の将来環境など不確実な事項について断定的判断を提供して誤認させる行為も問題となる。複合問題は","practical_examples":"【具体例】勧誘時に会社名も名乗らず投資用マンションを強く勧めた場合、契約締結がなかったとしても勧誘方法の違反が成立し得る。","advanced_knowledge":"【周辺・発展】《ア》氏名を名乗らず勧誘：業者の名称・勧誘者の氏名・勧誘目的を先に明示する義務に違反。《イ》申込み撤回者へ怒鳴り・来所強要：威迫による撤回妨害に該当。《ウ》アルバイトも宅建業務従事者であれば従業者証明書携帯が必要。チラシ配布も業務。《エ》将来にわたり高層建築物ができないと根拠なく断定する行為は、将来の環境に関して誤解させる断定的判断の提供に当たります。\n[[NOTE:勧誘方法規制／従業者証明書／将来の不確実な事項の断定的判断の提供を区別。]]","comparative_explanation":"勧誘方法規制／従業者証明書／将来の不確実な事項の断定的判断の提供を区別。","important_points":"==業者名・勧誘者名・勧誘目的／撤回妨害禁止／従業者証明書携帯／将来の環境を断定しない。==","trick_patterns":"「契約に至らなければ違反なし」は誤り。勧誘行為だけで問題になる。｜本問特有の誤誘導：勧誘の4事例《ア・イ・ウ・エすべてに禁止行為》が含まれるため、肢4が正解。\n【誤答注意】設問中の [[WARN:一つ]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"業者名・勧誘者名・勧誘目的／撤回妨害禁止／従業者証明書携帯／将来の環境を断定しない。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 4。\nQ2: 本問の主要な判断要件は何か？ A2: 勧誘方法規制／従業者証明書／将来の不確実な事項の断定的判断の提供を区別。。\nQ3: ア〜エの各判定は？ A3: ア：禁止行為。勧誘者本人の氏名を告げておらず、業者名・免許番号のみでは勧誘者の氏名の明示義務を満たさない。／イ：禁止行為。撤回希望者を威迫し来所を強制する言動は、後に撤回を受け付けたとしても違反が解消されるわけではない。／ウ：禁止行為。広告チラシ配布を含む宅建業務に従事させるアルバ を売却するときは、手付金等の保全措置と損害賠償額の予定などの8種制限に注意する。保全措置の要否は物件が完成前か完成後か、受領額の代金に対する割合、1000万円の絶対額を組み合わせて判定する。完成物件は代金の10％以下かつ1000万円以下であれば保全措置を要しない。未完成物件は5％以下かつ1000万円以下が基準。手付の性質、違約金と損害賠償予定の合計上限20％も別に検討する。\n【本問への当てはめ】手付金等の保全では、未完成物件は《5％以下かつ1,000万円以下》、完成物件は《10％以下かつ1,000万円以下》をセットで覚えます。「5％を超える又は1,000万円を超える」と保全が必要という裏返しです。また、保全は《受領前》に行うことが原則です。\n【判断順序・類題への対応】完成物件10％・1000万円／未完成5％・1000万円／損害賠償予定等合算20％。\n【具体的な当てはめ】完成マンション4000万円の手付400万円なら価格の10％で1000万円以下であり保全措置は不要という基準を確認する。 ","system_purpose":"制度の趣旨：宅建業者が自ら売主として非業者に住宅を売却するときは、手付金等の保全措置と損害賠償額の予定などの8種制限に注意する。保全措置の要否は物件が完成前か完成後か、受領額の代金に対する割合、1000万円の絶対額を組み合わせて判定する。完成物件は代金の10％以下かつ1000万円以下であれば保全措置を要しない。未完成物件は5％以下かつ1000万円以下が基準。手付の性質、違約金と損害賠償予定","practical_examples":"【具体例】完成マンション4000万円の手付400万円なら価格の10％で1000万円以下であり保全措置は不要という基準を確認する。","advanced_knowledge":"【周辺・発展】手付金等の保全では、未完成物件は《5％以下かつ1,000万円以下》、完成物件は《10％以下かつ1,000万円以下》をセットで覚えます。「5％を超える又は1,000万円を超える」と保全が必要という裏返しです。また、保全は《受領前》に行うことが原則です。\n[[NOTE:完成物件10％・1000万円／未完成5％・1000万円／損害賠償予定等合算20％。]]","comparative_explanation":"完成物件10％・1000万円／未完成5％・1000万円／損害賠償予定等合算20％。","important_points":"==未完成5％・完成10％＋どちらも1,000万円以下／損害賠償予定20％が頻出。==","trick_patterns":"「かつ」と「または」、保全のタイミング、売主の倍額償還を問うひっかけ。｜本問特有の誤誘導：完成物件の手付金400万円は代金4,000万円の《10％》で、《1,000万円以下》なので保全措置不要。肢2は違反しません。\n【誤答注意】設問中の [[WARN:損害賠償の予定額を1,000 万円]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"未完成5％・完成10％＋どちらも1,000万円以下／損害賠償予定20％が頻出。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 2。\nQ2: 本問の主要な判断要件は何か？ A2: 完成物件10％・1000万円／未完成5％・1000万円／損害賠償予定等合算20％。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"宅地建物取引業法39条・41条・41条の2 | 国土交通省「不動産取引における手付金等の保全」 / 宅地建物取引業法39条・41条・41条の2 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"未完成5％・完成10％＋どちらも1,000万円以下／損害賠償予定20％が頻出。","marker_red_spans":"損害賠償の予定額を1,000 万円","marker_blue_spans":"完成物件10％・1000万円／未完成5％・1000万円／損害賠償予定等合算20％。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"受領した後、当該手付金と中間金について法第41 条に定める保全措置を講じた","choice_1_reason":"違反します。未完成物件の手付金等を一定の額を超えて受領するときは、原則《受領前》に保全措置が必要です。合計400万円に達してから保全するのは遅すぎます。\n【本肢の根拠・注意点】未完成マンション4000万円の5％は200万円である。手付200万円を超えて中間金200万円を加算受領するなら、保全措置を先に講じる必要がある。受領した後で保全するのではタイミングが遅く、手付と中間金は合算して判断する。","choice_1_corrected_statement":"Ａは、建築工事完了前のマンションの売買契約を締結する際にＢから手付金200 万円を受領し、さらに建築工事中に200 万円を中間金として当該手付金等の合計額が保全基準を超える中間金の受領前に、法第41条所定の保全措置を講じた。","choice_1_legal_basis":"宅地建物取引業法39条・41条・41条の2（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"「かつ」と「または」、保全のタイミング、売主の倍額償還を問うひっかけ。｜違反します。未完成物件の手付金等を一定の額を超えて受領するときは、原則《受領前》に保全措置が必要です。合計400万円に達してから保全するのは遅すぎます。\n円を加算受領するなら、保全措置を先に講じる必要がある。受領した後で保全するのではタイミングが遅く、手付と中間金は合算して判断する。\nひっかけ箇所：[[WARN:受領した後、当該手付金と中間金について法]]。正しい内容：==保全基準を超える中間金の受領前に、法第41条所定の保全措置を講じた。==。","choice_2_truth":"true","choice_2_is_exam_answer":"true","choice_2_wrong_part":"該当なし","choice_2_reason":"違反しません。完成物件では手付金等が売買代金の10％以下《かつ》1,000万円以下なら、保全措置不要の例外に当たります。400万円は4,000万円の10％です。\n【本肢の根拠・注意点】完成済マンション4000万円で手付400万円はちょうど10％、かつ1000万円以下である。完成物件の手付金等保全の例外基準に収まるので、保全措置を講じないことが違反とはならない。","choice_2_corrected_statement":"原文どおりで正しい。","choice_2_legal_basis":"宅地建物取引業法39条・41条・41条の2（当該肢と条文の個別照合は要確認）","choice_2_exam_tip":"「かつ」と「または」、保全のタイミング、売主の倍額償還を問うひっかけ。｜違反しません。完成物件では手付金等が売買代金の10％以下《かつ》1,000万円以下なら、保全措置不要の例外に当たります。400万円は4,000万円の10％です。\nょうど10％、かつ1000万円以下である。完成物件の手付金等保全の例外基準に収まるので、保全措置を講じないことが違反とはならない。","choice_3_truth":"false","choice_3_is_exam_answer":"false","choice_3_wrong_part":"当該手付金500 万円を返還して、契約を一方的に解除した","choice_3_reason":"違反します。宅建業者が自ら売主となる取引で、売主から手付解除する場合は原則《手付金の倍額を現実に提供》する必要があります。返還だけでは足りません。\n【本肢の根拠・注意点】宅建業者が自ら売主となる売買で手付を受領した場合、履行着手前なら買主は手付放棄、売主は倍額の現実提供で解除できるという制限がある。受け取った500万円だけ返還して一方的に解除することはできない。","choice_3_corrected_statement":"Ａは、建築工事完了前のマンションの売買契約を締結する際にＢから手付金500 万円を受領したが、Ｂに債務不履行がないにもかかわらず当該手付金の倍額1,000万円を現実に提供し、相手方が履行に着手する前に手付解除した。","choice_3_legal_basis":"宅地建物取引業法39条・41条・41条の2（当該肢と条文の個別照合は要確認）","choice_3_exam_tip":"「かつ」と「または」、保全のタイミング、売主の倍額償還を問うひっかけ。｜違反します。宅建業者が自ら売主となる取引で、売主から手付解除する場合は原則《手付金の倍額を現実に提供》する必要があります。返還だけでは足りません。\n買主は手付放棄、売主は倍額の現実提供で解除できるという制限がある。受け取った500万円だけ返還して一方的に解除することはできない。\nひっかけ箇所：[[WARN:当該手付金500 万円を返還して、契約を]]。正しい内容：==,000万円を現実に提供し、相手方が履行に着手する前に手付解除した。==。","choice_4_truth":"false","choice_4_is_exam_answer":"false","choice_4_wrong_part":"損害賠償の予定額を1,000 万円","choice_4_reason":"違反します。業者売主・非業者買主の場合の損害賠償額の予定等は合算で代金の《20％》以下。4,000万円の20％は800万円であり、1,000万円は超過です。\n【本肢の根拠・注意点】損害賠償の予定額と違約金は合計で代金の20％を超えてはいけない。4000万円の20％は800万円なので、予定額1000万円は上限超過となる。買主非業者への自ら売主取引の保護規律。","choice_4_corrected_statement":"Ａは、建築工事完了後のマンションの売買契約を締結する際に、当事者の債務の不履行を理由とする契約の解除に伴う損害賠償の予定額を代金4,000万円の20％以内である800万円以下とする特約を定めた。","choice_4_legal_basis":"宅地建物取引業法39条・41条・41条の2（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"「かつ」と「または」、保全のタイミング、売主の倍額償還を問うひっかけ。｜違反します。業者売主・非業者買主の場合の損害賠償額の予定等は合算で代金の《20％》以下。4,000万円の20％は800万円であり、1,000万円は超過です。\nえてはいけない。4000万円の20％は800万円なので、予定額1000万円は上限超過となる。買主非業者への自ら売主取引の保護規律。\nひっかけ箇所：[[WARN:損害賠償の予定額を1,000 万円]]。正しい内容：==金4,000万円の20％以内である800万円以下とする特約を定めた。==。"},{"question_id":"2025-Q33","year":2025,"session":"通常","question_no":33,"major_field":"宅建業法","section":"宅建業法","unit":"35条と37条","topic":"重要事項説明と契約書面の記載・説明","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"count_false","question_text":"宅地建物取引業者Ａが行う業務に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはいくつあるか。なお、この問において「37 条書面」とは、同法第37 条の規定により交付すべき書面をいうものとする。ア　建物の賃貸借の媒介をするＡは、当該建物の引渡しの時期について、重要事項説明書に記載して説明する必要はないが、37 条書面には記載しなければならない。イ　Ａは、自ら売主として建物を売却する場合、重要事項説明書に記載しなければならない契約の解除に関する事項については、契約に定めがなくても37 条書面に全て記載しなければならない。ウ　Ａは、売主を代理して、抵当権が登記されている建物を売却する場合、買主に交付する37 条書面だけでなく、売主に交付する37 条書面についても、当該抵当権の内容を記載しなければならない。エ　建物の賃貸借の媒介をするＡは、37 条書面を交付するに当たり、宅地建物取引士をして、その内容を説明させなければならない。","choice_1":"一つ","choice_2":"二つ","choice_3":"三つ","choice_4":"四つ","official_accepted_answers":"3","answer_conclusion":"アだけ正しく、《イ・ウ・エの3つが誤り》です。肢3が正解。","answer_reason":"【結論】アだけ正しく、《イ・ウ・エの3つが誤り》です。肢3が正解。\n【解き方】重要事項説明は契約前に購入判断に必要な情報を伝える制度であるのに対し、37条書面は成立後に当事者の合意内容を確認するための制度である。売買・交換・貸借では記載事項が異なり、任意事項や条件付き記載事項を一律必須と考えると誤る。また、取引態様や相手が宅建業者か一般消費者かによって義務の適用範囲が違う場面がある。ア〜エの複合問題では各記述の「いつ」「誰が」「何を」","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】重要事項説明は契約前に購入判断に必要な情報を伝える制度であるのに対し、37条書面は成立後に当事者の合意内容を確認するための制度である。売買・交換・貸借では記載事項が異なり、任意事項や条件付き記載事項を一律必須と考えると誤る。また、取引態様や相手が宅建業者か一般消費者かによって義務の適用範囲が違う場面がある。ア〜エの複合問題では各記述の「いつ」「誰が」「何を」「条件は何か」を細分化して判定する。\n【本問への当てはめ】《ア》正しい：建物引渡し時期は35条重説の必須事項ではありませんが、37条契約書面の記載事項です。《イ》誤り：37条書面の解除事項は《定めがある場合》に記載する事項で、契約に定めがなくても全て記載するわけではありません。《ウ》誤り：抵当権等の登記された権利は35条の説明事項ですが、37条の一般的な記載義務とは異なります。《エ》誤り：37条書面は取引士の記名が必要ですが、内容の口頭説明までは一律必要ではありません。\n【判断順序・類題への対応】35条＝契約前説明／37条＝契約成立後交付。必須記載事項と当事者の定めがある場合だけの事項を区別。\n【構成記述の検討】ア：正しい。引渡し時期は35条説明の必須記載項目ではなく、契約成立後の37条書面では記載を要する。 イ：誤り。契約解除に関する37条の記載は契約に定めがある場合の事項であり、存在しない解除条項まで記載義務はない。 ウ：誤り。抵当権の登記内容は35条説明事項であり、売主・買主双方の37条書面に一律で記載する義務とは異なる。 エ：誤り。37条書面は取引士の記名等が必要だが、取引士による内容の口頭説明まで一律義務とはされない。","system_purpose":"制度の趣旨：重要事項説明は契約前に購入判断に必要な情報を伝える制度であるのに対し、37条書面は成立後に当事者の合意内容を確認するための制度である。売買・交換・貸借では記載事項が異なり、任意事項や条件付き記載事項を一律必須と考えると誤る。また、取引態様や相手が宅建業者か一般消費者かによって義務の適用範囲が違う場面がある。ア〜エの複合問題では各記述の「いつ」「誰が」「何を」「条件は何か」を細分","practical_examples":"【具体例】買主に説明した修繕積立金の情報と、売買契約で確定した代金支払日を混同せず、35条・37条の位置づけで整理する。","advanced_knowledge":"【周辺・発展】《ア》正しい：建物引渡し時期は35条重説の必須事項ではありませんが、37条契約書面の記載事項です。《イ》誤り：37条書面の解除事項は《定めがある場合》に記載する事項で、契約に定めがなくても全て記載するわけではありません。《ウ》誤り：抵当権等の登記された権利は35条の説明事項ですが、37条の一般的な記載義務とは異なります。《エ》誤り：37条書面は取引士の記名が必要ですが、内容の口頭説明までは一律必要ではありません。\n[[NOTE:35条＝契約前説明／37条＝契約成立後交付。必須記載事項と当事者の定めがある場合だけの事項を区別。]]","comparative_explanation":"35条＝契約前説明／37条＝契約成立後交付。必須記載事項と当事者の定めがある場合だけの事項を区別。","important_points":"==35条＝契約前の判断材料／37条＝契約後の書面化／条件付き記載と必須記載。==","trick_patterns":"「35条で説明する事項＝全部37条 許を受けることができる。","choice_1":"一つ","choice_2":"二つ","choice_3":"三つ","choice_4":"四つ","official_accepted_answers":"3","answer_conclusion":"正しいのは《ア・イ・エの3つ》。ウの現場助勢罪は法定代理人の免許欠格に関係します。肢3が正解。","answer_reason":"【結論】正しいのは《ア・イ・エの3つ》。ウの現場助勢罪は法定代理人の免許欠格に関係します。肢3が正解。\n【解き方】宅建業免許の欠格事由は法人か個人か、役員・政令使用人など誰の事情か、刑罰の種類と経過期間で決まる。禁錮以上に相当する刑の執行猶予期間中などの扱いや、破産後に復権を得た場合の扱いを区別する。免許取消処分に先立ち廃業した場合の欠格期間では、公告前の役員歴を遡って見る規定がある。暴行現場助勢罪など特定の罰金刑も欠格事由になり得る。2025年前後の刑罰名称の制度変更","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】宅建業免許の欠格事由は法人か個人か、役員・政令使用人など誰の事情か、刑罰の種類と経過期間で決まる。禁錮以上に相当する刑の執行猶予期間中などの扱いや、破産後に復権を得た場合の扱いを区別する。免許取消処分に先立ち廃業した場合の欠格期間では、公告前の役員歴を遡って見る規定がある。暴行現場助勢罪など特定の罰金刑も欠格事由になり得る。2025年前後の刑罰名称の制度変更があるため、旧条文の「禁錮」表記を現行制度へ機械的に置き換えず施行日で確認する。\n【本問への当てはめ】《ア》正しい：政令使用人に禁錮以上の刑の執行猶予期間中の者がいれば欠格事由。《イ》正しい：取消処分の聴聞公示前《60日以内》に役員であったEは、公示40日前退任でも欠格対象になり得ます。《ウ》誤り：《現場助勢罪》は罰金刑でも欠格対象となる法定の刑法犯の一つ。法定代理人Gが該当すれば行為能力のない未成年者Fも免許できません。《エ》正しい：破産者は《復権すれば》欠格が解消し、さらに5年待つ必要はありません。\n【判断順序・類題への対応】禁錮以上に相当する刑・対象の罰金刑／執行猶予／破産と復権／取消処分の公告と役員歴を分ける。\n【構成記述の検討】ア：正しい。政令使用人に法定の重い刑罰を受け執行猶予期間中の者がいる場合、法人免許の欠格要件に該当し得る。 イ：正しい。取消聴聞の公示日前60日以内に役員であった者も対象となり、公示40日前に退任した事情だけでは免れない。 ウ：誤り。現場助勢罪は罰金刑でも欠格対象となる法定の刑法犯で、法定代理人の欠格が行為能力のない未成年者の免許申請に影響する。 エ：正しい。破産手続開始決定を受けても復権を得た者は、それだけを理由にさらに5年間待つ必要はない。","system_purpose":"制度の趣旨：宅建業免許の欠格事由は法人か個人か、役員・政令使用人など誰の事情か、刑罰の種類と経過期間で決まる。禁錮以上に相当する刑の執行猶予期間中などの扱いや、破産後に復権を得た場合の扱いを区別する。免許取消処分に先立ち廃業した場合の欠格期間では、公告前の役員歴を遡って見る規定がある。暴行現場助勢罪など特定の罰金刑も欠格事由になり得る。2025年前後の刑罰名称の制度変更があるため、旧条文の","practical_examples":"【具体例】役員が罰金刑を受けた法人の免許申請では、すべての罰金刑が欠格なのではなく対象犯罪や経過年数を調べる。","advanced_knowledge":"【周辺・発展】《ア》正しい：政令使用人に禁錮以上の刑の執行猶予期間中の者がいれば欠格事由。《イ》正しい：取消処分の聴聞公示前《60日以内》に役員であったEは、公示40日前退任でも欠格対象になり得ます。《ウ》誤り：《現場助勢罪》は罰金刑でも欠格対象となる法定の刑法犯の一つ。法定代理人Gが該当すれば行為能力のない未成年者Fも免許できません。《エ》正しい：破産者は《復権すれば》欠格が解消し、さらに5年待つ必要はありません。\n[[NOTE:禁錮以上に相当する刑・対象の罰金刑／執行猶予／破産と復権／取消処分の公告と役員歴を分ける。]]","comparative_explanation":"禁錮以上に相当する刑・対象の罰金刑／執行猶予／破産と復権／取消処分の公告と役員歴を分ける。","important_points":"==執行猶予中＝欠格／公示前60日以内の役員／現場助勢罪／破産は復権で解消。==","trick_patterns":"「罰金なら欠格にならない」も「破産は復権後5年待つ」も誤り。｜本問特有の誤 nswers":"1","answer_conclusion":"営業保証金の取戻しでは、一定の場合に《6か月以上の官報公告》が必要です。肢1が正しい。","answer_reason":"【結論】営業保証金の取戻しでは、一定の場合に《6か月以上の官報公告》が必要です。肢1が正しい。\n【解き方】営業保証金は宅建業者が取引によって生じた損害賠償等への弁済原資を供託する仕組みで、本店は1000万円、支店1か所につき500万円が基準となる。供託先は本店の最寄りの供託所を原則とする。主たる事務所移転や支店新設に伴う供託・公告の要否を分けて整理する。営業保証金を取り戻すときは、一定の場合に還付請求者への機会を与えるため6か月以上の官報公告等の手続が必要となる","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】営業保証金は宅建業者が取引によって生じた損害賠償等への弁済原資を供託する仕組みで、本店は1000万円、支店1か所につき500万円が基準となる。供託先は本店の最寄りの供託所を原則とする。主たる事務所移転や支店新設に伴う供託・公告の要否を分けて整理する。営業保証金を取り戻すときは、一定の場合に還付請求者への機会を与えるため6か月以上の官報公告等の手続が必要となる。単に事業をやめたから直ちに取り戻せると考えない。\n【本問への当てはめ】営業保証金制度は、取引相手方の保護のため宅建業者に一定の財産を供託させます。《主たる事務所1,000万円＋従たる事務所1か所500万円》が原則。保証協会に加入する場合は別の弁済業務保証金分担金制度になります。\n【判断順序・類題への対応】本店1000万円・支店500万円／供託先＝本店最寄り／取戻し時は一定の公告期間が必要。\n【具体的な当てはめ】本店を移し、支店を二つ設置した事業者の営業保証金は、支店数と供託先を別々に算定する。 ","system_purpose":"制度の趣旨：営業保証金は宅建業者が取引によって生じた損害賠償等への弁済原資を供託する仕組みで、本店は1000万円、支店1か所につき500万円が基準となる。供託先は本店の最寄りの供託所を原則とする。主たる事務所移転や支店新設に伴う供託・公告の要否を分けて整理する。営業保証金を取り戻すときは、一定の場合に還付請求者への機会を与えるため6か月以上の官報公告等の手続が必要となる。単に事業をやめたか","practical_examples":"【具体例】本店を移し、支店を二つ設置した事業者の営業保証金は、支店数と供託先を別々に算定する。","advanced_knowledge":"【周辺・発展】営業保証金制度は、取引相手方の保護のため宅建業者に一定の財産を供託させます。《主たる事務所1,000万円＋従たる事務所1か所500万円》が原則。保証協会に加入する場合は別の弁済業務保証金分担金制度になります。\n[[NOTE:本店1000万円・支店500万円／供託先＝本店最寄り／取戻し時は一定の公告期間が必要。]]","comparative_explanation":"本店1000万円・支店500万円／供託先＝本店最寄り／取戻し時は一定の公告期間が必要。","important_points":"==本店1,000万円・支店500万円／供託先は本店最寄り／取戻し官報6か月で整理。==","trick_patterns":"供託に必要な金額と、取引相手方が還付を受ける上限を取り違えない。｜本問特有の誤誘導：営業保証金の取戻しでは、一定の場合に《6か月以上の官報公告》が必要です。肢1が正しい。\n【誤答注意】設問中の [[WARN:500 万円を限度として]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"本店1,000万円・支店500万円／供託先は本店最寄り／取戻し官報6か月で整理。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 1。\nQ2: 本問の主要な判断要件は何か？ A2: 本店1000万円・支店500万円／供託先＝本店最寄り／取戻し時は一定の公告期間が必要。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"宅地建物取引業法25条・30条、営業保証金規則 | 国土交通省東北地方整備局「宅地建物取引業」 / 宅地建物取引業者営業保証金規則7条 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"本店1,000万円・支店500万円／供託先は本店最寄り／取戻し官報6か月で整理。","marker_red_spans":"500 万円を限度として","marker_blue_spans":"本店1000万円・支店500万円／供託先＝本店最寄り／取戻し時は一定の公告期間が必要。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"true","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。免許期間満了などにより取戻しをする場合、還付権者の申出を促すため、原則《6か月を下らない期間》を定めて官報公告します。\n【本肢の根拠・注意点】免許の期間満了などで営業保証金を取り戻すには、取引で生じた債権の権利者へ還付申出の機会を与えるため、原則6か月以上の官報公告が必要となる。供託の払い戻しが債権者保護より先行しないようにする仕組み。","choice_1_corrected_statement":"原文どおりで正しい","choice_1_legal_basis":"宅地建物取引業法25条・30条、営業保証金規則（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"供託に必要な金額と、取引相手方が還付を受ける上限を取り違えない。｜正しい。免許期間満了などにより取戻しをする場合、還付権者の申出を促すため、原則《6か月を下らない期間》を定めて官報公告します。\n利者へ還付申出の機会を与えるため、原則6か月以上の官報公告が必要となる。供託の払い戻しが債権者保護より先行しないようにする仕組み。","choice_2_truth":"false","choice_2_is_exam_answer":"false","choice_2_wrong_part":"従たる事務所を設置したときの営業保証金については、金銭のみをもって供託しなければならない","choice_2_reason":"誤り。営業保証金は法定の条件下で金銭・有価証券・その併用で供託可能であり、支店分だけ金銭に限定されるわけではありません。\n【本肢の根拠・注意点】営業保証金の供託は金銭に限定されず、法律で認める有価証券との併用も可能。従たる事務所分だけ有価証券供託を禁止する特別規制はない。供託方法と必要供託額の区分を混同しない。","choice_2_corrected_statement":"Ａが営業保証金を供託する場合において、金銭と有価証券を併用して供託することができるが、従たる事務所分を追加供託するときも法定の有価証券と金銭を併用できる。","choice_2_legal_basis":"宅地建物取引業法25条・30条、営業保証金規則（当該肢と条文の個別照合は要確認）","choice_2_exam_tip":"供託に必要な金額と、取引相手方が還付を受ける上限を取り違えない。｜誤り。営業保証金は法定の条件下で金銭・有価証券・その併用で供託可能であり、支店分だけ金銭に限定されるわけではありません。\n律で認める有価証券との併用も可能。従たる事務所分だけ有価証券供託を禁止する特別規制はない。供託方法と必要供託額の区分を混同しない。\nひっかけ箇所：[[WARN:従たる事務所を設置したときの営業保証金に]]。正しい内容：==従たる事務所分を追加供託するときも法定の有価証券と金銭を併用できる。==。","choice_3_truth":"false","choice_3_is_exam_answer":"false","choice_3_wrong_part":"従たる事務所の最寄りの供託所","choice_3_reason":"誤り。新設支店分の供託先も原則として《主たる事務所の最寄りの供託所》です。支店所在地の供託所ではありません。\n【本肢の根拠・注意点】新たに支店を設けても、供託先は支店最寄りではなく本店の最寄りの供託所である。支店ごとに500万円という必要額は、供託所の所在地を支店別に分けるという意味ではない。甲県知事免許と乙県支店との関係も確認する。","choice_3_corrected_statement":"Ａは、事業の開始後新たに乙県に従たる事務所を設置したときは、主たる事務所の最寄りの供託所に営業保証金を供託し、その供託物受入の記載のある供託書の写しを添付して、その旨を甲県知事に届け出なければならない。","choice_3_legal_basis":"宅地建物取引業法25条・30条、営業保証金規則（当該肢と条文の個別照合は要確認）","choice_3_exam_tip":"供託に必要な金額と、取引相手方が還付を受ける上限を取り違えない。｜誤り。新設支店分の供託先も原則として《主たる事務所の最寄りの供託所》です。支店所在地の供託所ではありません。\n。支店ごとに500万円という必要額は、供託所の所在地を支店別に分けるという意味ではない。甲県知事免許と乙県支店との関係も確認する。\nひっかけ箇所：[[WARN:従たる事務所の最寄りの供託所]]。正しい内容：==る供託書の写しを添付して、その旨を甲県知事に届け出なければならない。==。","choice_4_truth":"false","choice_4_is_exam_answer":"false","choice_4_wrong_part":"500 万円を限度として","choice_4_reason":"誤り。支店と取引した人の還付上限が一律500万円になるわけではありません。500万円は《従たる事務所1か所あたりの供託額》です。還付は営業保証金全体の範囲で考えます。\n【本肢の根拠・注意点】支店で取引した顧客の弁済上限が支店分供託額500万円に限定されるわけではない。営業保証金は業者全体の取引に対する保護制度で、各取引債権の還付は一定の手続と総供託額の枠内で扱われる。","choice_4_corrected_statement":"Ａの設置した支店においてＡと宅地建物取引業に関する取引をした者は、その取引により生じた債権に関し、営業保証金全体の枠内で法定の要件に従ってその債権の弁済を受ける権利を有する。","choice_4_legal_basis":"宅地建物取引業法25条・30条、営業保証金規則（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"供託に必要な金額と、取引相手方が還付を受ける上限を取り違えない。｜誤り。支店と取引した人の還付上限が一律500万円になるわけではありません。500万円は《従たる事務所1か所あたりの供託額》です。還付は営業保証金全体の範囲で考えます。\n円に限定されるわけではない。営業保証金は業者全体の取引に対する保護制度で、各取引債権の還付は一定の手続と総供託額の枠内で扱われる。\nひっかけ箇所：[[WARN:500 万円を限度として]]。正しい内容：==金全体の枠内で法定の要件に従ってその債権の弁済を受ける権利を有する。==。"},{"question_id":"2025-Q36","year":2025,"session":"通常","question_no":36,"major_field":"宅建業法","section":"宅建業法","unit":"業務上の禁止行為","topic":"再勧誘・断定的判断・迷惑勧誘","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"宅地建物取引業者Ａの業務に関する次の記述のうち、宅地建物取引業法の規定によれば、禁止されているものはいくつあるか。ア　Ａの従業者は、電話によりＢに投資用マンションの購入の勧誘を行った際、Ｂから「Ａから購入する意思は一切無いので、今後電話を含め勧誘はしないでほしい。」と告げられたが、その翌日、Ｂに対し、再度の勧誘を行った。イ　建物の購入希望者から「契約の締結についてしばらく考えさせてほしい。」という申し出があったので、Ａの従業者は、他に買い手がいないにもかかわらず、「他に買い手がいるので、今日中しか契約の締結はできない。」と当該購入希望者に告げた。ウ　Ａの従業者は、建物の購入希望者に対して、長時間にわたり契約の締結をするための勧誘を行い、当該購入希望者を困惑させた。エ　建物の売買を媒介しているＡの従業者は、手持ち資金がない購入希望者に対して「手付金は当社が貸し付けるので後から返してくれれば構わない。」と告げて、契約の締結を誘引したが、契約には至らなかった。","choice_1":"一つ","choice_2":"二つ","choice_3":"三つ","choice_4":"四つ","official_accepted_answers":"4","answer_conclusion":"ア・イ・ウ・エの《4行為すべて禁止》され、肢4が正解。","answer_reason":"【結論】ア・イ・ウ・エの《4行為すべて禁止》され、肢4が正解。\n【解き方】宅建業者の禁止行為は、直接の虚偽説明だけでなく、勧誘時に相手の判断を不当に左右する行為を対象にする。断られた後に執拗に勧誘を続けること、契約成立の期限等について事実でない説明をして決断を急がせること、相手を困惑させる勧誘、手付金を貸し付けて契約を誘引すること等は問題になる。違反が成立するのに実際の損害発生を要しない類型もあるため、契約前の会話だけで適法性を判","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】宅建業者の禁止行為は、直接の虚偽説明だけでなく、勧誘時に相手の判断を不当に左右する行為を対象にする。断られた後に執拗に勧誘を続けること、契約成立の期限等について事実でない説明をして決断を急がせること、相手を困惑させる勧誘、手付金を貸し付けて契約を誘引すること等は問題になる。違反が成立するのに実際の損害発生を要しない類型もあるため、契約前の会話だけで適法性を判断する。\n【本問への当てはめ】《ア》購入意思なし・勧誘不要と明示された後の再勧誘は不可。《イ》他の買い手が存在しないのに「今日までしか契約できない」と告げるのは不実告知・判断圧迫。《ウ》長時間の勧誘で相手を困惑させることは禁止。《エ》手付金貸付によって契約を誘引する行為は、成約に至らなくても禁止。\n【判断順序・類題への対応】威迫・再勧誘・断定的判断・手付貸付誘引はそれぞれ別要件だが消費者保護が共通目的。\n【構成記述の検討】ア：禁止行為。購入意思がないと明確に断った者に、翌日に再び同じ販売目的の勧誘を行うことは禁止される。 イ：禁止行為。実際には他の買い手がいないのに「今日中でなければ契約できない」と虚偽の情報で判断を迫っている。 ウ：禁止行為。長時間の勧誘によって購入希望者を困惑させる行為は契約締結の有無と関係なく規制される。 エ：禁止行為。手付金を業者が貸し付けて契約を誘引する行為は禁止され、結局契約に至らなくても規制対象となる。","system_purpose":"制度の趣旨：宅建業者の禁止行為は、直接の虚偽説明だけでなく、勧誘時に相手の判断を不当に左右する行為を対象にする。断られた後に執拗に勧誘を続けること、契約成立の期限等について事実でない説明をして決断を急がせること、相手を困惑させる勧誘、手付金を貸し付けて契約を誘引すること等は問題になる。違反が成立するのに実際の損害発生を要しない類型もあるため、契約前の会話だけで適法性を判断する。","practical_examples":"【具体例】購入を断った相手へ夜間に繰り返し電話し「今日中でなければ購入できない」と根拠なく迫った場合の勧誘規制を考える。","advanced_knowledge":"【周辺・発展】《ア》購入意思なし・勧誘不要と明示された後の再勧誘は不可。《イ》他の買い手が存在しないのに「今日までしか契約できない」と告げるのは不実告知・判断圧迫。《ウ》長時間の勧誘で相手を困惑させることは禁止。《エ》手付金貸付によって契約を誘引する行為は、成約に至らなくても禁止。\n[[NOTE:威迫・再勧誘・断定的判断・手付貸付誘引はそれぞれ別要件だが消費者保護が共通目的。]]","comparative_explanation":"威迫・再勧誘・断定的判断・手付貸付誘引はそれぞれ別要件だが消費者保護が共通目的。","important_points":"==断られたら再勧誘しない／虚偽の購入期限を示さない／困惑させない／手付貸付による誘引禁止。==","trick_patterns":"実際に契約成立していなくても禁止規制が適用されます。｜本問特有の誤誘導：ア・イ・ウ・エの《4行為すべて禁止》され、肢4が正解。\n【誤答注意】設問中の [[WARN:一つ]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"断られたら再勧誘しない／虚偽の購入期限を示さない／困惑させない／手付貸付による誘引禁止。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 4。\nQ2: 本問の主要な判断要件は何か？ A2: 威迫・再勧誘・断定的判断・手付貸付誘引はそれぞれ別要件だが消費者保護が共通目的。。\nQ3: ア〜エの各判定は？ A3: ア：禁止行為。購入意思がないと明確に断った者に、翌日に再び同じ販売目的の勧誘を行うことは禁止される。／イ：禁止行為。実際には他の買い手がいないのに「今日中でなければ契約できない」と虚偽の情報で判断を迫っている。／ウ：禁止行為。長時間の勧誘によって購入希望者を困惑させる行為は契約締結の有無と関係なく規制される。／エ：禁止行為。手付金を業者が貸し付けて契約を誘引する行為は禁止され、結局契約に至らなくても規制対象となる。","substatement_reasoning":"ア：禁止行為。購入意思がないと明確に断った者に、翌日に再び同じ販売目的の勧誘を行うことは禁止される。\nイ：禁止行為。実際には他の買い手がいないのに「今日中でなければ契約できない」と虚偽の情報で判断を迫っている。\nウ：禁止行為。長時間の勧誘によって購入希望者を困惑させる行為は契約締結の有無と関係なく規制される。\nエ：禁止行為。手付金を業者が貸し付けて契約を誘引する行為は禁止され、結局契約に至らなくても規制対象となる。\n【数え方】禁止行為は4つ。","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"宅地建物取引業法47条・47条の2、同施行規則16条の11 | 宅地建物取引業法47条・47条の2 / 宅建業法施行規則16条の11 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"断られたら再勧誘しない／虚偽の購入期限を示さない／困惑させない／手付貸付による誘引禁止。","marker_red_spans":"一つ","marker_blue_spans":"威迫・再勧誘・断定的判断・手付貸付誘引はそれぞれ別要件だが消費者保護が共通目的。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"一つ","choice_1_reason":"誤り。再勧誘だけではなくほかの3行為も禁止です。\n【構成要素の理由】禁止行為。購入意思がないと明確に断った者に、翌日に再び同じ販売目的の勧誘を行うことは禁止される。／禁止行為。実際には他の買い手がいないのに「今日中でなければ契約できない」と虚偽の情報で判断を迫っている。／禁止行為。長時間の勧誘によって購入希望者を困惑させる行為は契約締結の有無と関係なく規制される。／禁止行為。手付金を業者が貸し付けて契約を誘引する行為は禁止され、結局契約に至らなくても規制対象となる。。\n【結論】本肢「一つ」は 禁止行為を4つと数えた結果に合致しない。\n【要素ごとの判定】ア：禁止行為。購入意思がないと明確に断った者に、翌日に再び同じ販売目的の勧誘を行うことは禁止される。 イ：禁止行為。実際には他の買い手 4月から「実施後2年を経過していないもの」へ改められた。一戸建て等と同じくすべて1年と暗記してはならない。またマンション管理規約案や管理に関する事項等、建物特性に応じた説明項目がある。","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】35条重要事項説明では中古住宅の建物状況調査が行われた場合、その結果概要を一定期間内の調査に限って説明する。鉄筋コンクリート造などの共同住宅に係る調査結果の有効期間は2024年4月から「実施後2年を経過していないもの」へ改められた。一戸建て等と同じくすべて1年と暗記してはならない。またマンション管理規約案や管理に関する事項等、建物特性に応じた説明項目がある。契約前説明と、成立後37条書面に記載する当事者双方の確認事項との違いも再確認する。\n【本問への当てはめ】建物状況調査（インスペクション）については《実施したか》《実施した時期》《結果の概要》を分けて覚えます。RC等の既存共同住宅については、所定の期間《2年以内》が基準となる場合があり、他の既存建物の1年と一律に扱わないこと。\n【判断順序・類題への対応】RC等の共同住宅の調査2年／その他の建物で1年の原則／35条と37条の役割を区別。\n【具体的な当てはめ】18か月前に実施したRC造共同住宅の建物状況調査は、説明対象となる2年以内の調査として扱う場面がある。 ","system_purpose":"制度の趣旨：35条重要事項説明では中古住宅の建物状況調査が行われた場合、その結果概要を一定期間内の調査に限って説明する。鉄筋コンクリート造などの共同住宅に係る調査結果の有効期間は2024年4月から「実施後2年を経過していないもの」へ改められた。一戸建て等と同じくすべて1年と暗記してはならない。またマンション管理規約案や管理に関する事項等、建物特性に応じた説明項目がある。契約前説明と、成立後","practical_examples":"【具体例】18か月前に実施したRC造共同住宅の建物状況調査は、説明対象となる2年以内の調査として扱う場面がある。","advanced_knowledge":"【周辺・発展】建物状況調査（インスペクション）については《実施したか》《実施した時期》《結果の概要》を分けて覚えます。RC等の既存共同住宅については、所定の期間《2年以内》が基準となる場合があり、他の既存建物の1年と一律に扱わないこと。\n[[NOTE:RC等の共同住宅の調査2年／その他の建物で1年の原則／35条と37条の役割を区別。]]","comparative_explanation":"RC等の共同住宅の調査2年／その他の建物で1年の原則／35条と37条の役割を区別。","important_points":"==マンションの調査時期＝2年以内の扱い／規約案も説明／受領金銭の額・目的と保管方法は区別。==","trick_patterns":"建物種別で建物状況調査の説明対象期間が異なる点に注意。｜本問特有の誤誘導：既存RC共同住宅の建物状況調査は《2年以内》の調査が対象となるため、1年6か月前の調査を説明する肢4が正しい。\n【誤答注意】設問中の [[WARN:説明する必要はない]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"マンションの調査時期＝2年以内の扱い／規約案も説明／受領金銭の額・目的と保管方法は区別。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 4。\nQ2: 本問の主要な判断要件は何か？ A2: RC等の共同住宅の調査2年／その他の建物で1年の原則／35条と37条の役割を区別。。","substatement_reasoning":"","reform_status":"relevant_verified","reform_title":"RC造等の共同住宅の建物状況調査結果・重要事項説明の対象期間見直し","reform_effective_date":"2024-04-01","reform_before":"RC造等の共同住宅の建物状況調査について、重要事項説明で扱う調査実施からの期間は原則1年。","reform_after":"RC造等の共同住宅は、調査の実施から2年を経過していない建物状況調査結果が重要事項説明の対象。","reform_2026_impact":"2026年時点もRC造等の共同住宅は「実施から2年を経過していない」調査結果が重要事項説明の対象。本問の1年6か月前は期間内で、肢4の正誤判断は変わらない。","reform_sources":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/const/tochi_fudousan_kensetsugyo_const_tk3_000001_00063.html","legal_sources":"宅地建物取引業法35条・同施行規則16条の2の2、国土交通省2024年4月改正資料 | 宅地建物取引業法35条 / 宅地建物取引業法施行規則16条の2の2 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/ | 国交省建物状況調査 https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/const/tochi_fudousan_kensetsugyo_const_tk3_000001_00063.html | https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/const/tochi_fudousan_kensetsugyo_const_tk3_000001_00063.html","marker_yellow_spans":"マンションの調査時期＝2年以内の扱い／規約案も説明／受領金銭の額・目的と保管方法は区別。","marker_red_spans":"説明する必要はない","marker_blue_spans":"RC等の共同住宅の調査2年／その他の建物で1年の原則／35条と37条の役割を区別。","qa_status":"REWORK","qa_issues":"一次資料で一部の中核論点を再確認済。ただし4肢すべての独立検証は未了｜2024年共同住宅の調査期間2年未満を確認｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"false","choice_1_is_exam_answer":"false","choice_1_wrong_part":"その概要を説明しなければならない","choice_1_reason":"誤り。建物の貸借で説明する法令上の制限は売買と同一ではなく、設問の準防火地域の建築構造制限は一律の説明対象とはなりません。\n【本肢の根拠・注意点】建物貸借の媒介で35条説明対象となる法令制限は取引類型に応じ限定される。準防火地域における構造規制を、建物貸借の説明で売買と同様に一律説明すべき対象に含めない。土地建物の売買か貸借かを確かめる。","choice_1_corrected_statement":"建物の貸借の媒介を行う場合、当該建物が都市計画法の準防火地域内にあり、建築基準法第61 条第1 項に基づく建物の構造に係る制限があるときは、建物賃貸借の媒介については、この建築構造の制限の概要は一律の重要事項説明対象とはならない。","choice_1_legal_basis":"宅地建物取引業法35条・同施行規則16条の2の2、国土交通省2024年4月改正資料（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"建物種別で建物状況調査の説明対象期間が異なる点に注意。｜誤り。建物の貸借で説明する法令上の制限は売買と同一ではなく、設問の準防火地域の建築構造制限は一律の説明対象とはなりません。\nされる。準防火地域における構造規制を、建物貸借の説明で売買と同様に一律説明すべき対象に含めない。土地建物の売買か貸借かを確かめる。\nひっかけ箇所：[[WARN:その概要を説明しなければならない]]。正しい内容：==ては、この建築構造の制限の概要は一律の重要事項説明対象とはならない。==。","choice_2_truth":"false","choice_2_is_exam_answer":"false","choice_2_wrong_part":"説明する必要はない","choice_2_reason":"誤り。区分所有建物の用途・利用制限に関する管理規約は《案の段階》でも重要事項として説明が必要です。\n【本肢の根拠・注意点】マンションの専有部分の用途等の利用制限は、規約が確定していなくても案の段階で説明対象となる。契約後に決まったら初めて知らせればよいという扱いでは、購入者の判断材料が不足する。\n【補足】契約締結前の判断資料として規約案も意味を持つ。","choice_2_corrected_statement":"マンションの分譲を行う場合、建物の区分所有等に関する法律第2 条第3 項に規定する専用部分の用途その他の利用の制限に関する規約の定めが案の段階であるときは、案の段階であっても説明する必要がある。","choice_2_legal_basis":"宅地建物取引業法35条・同施行規則16条の2の2、国土交通省2024年4月改正資料（当該肢と条文の個別照合は要確認）","choice_2_exam_tip":"建物種別で建物状況調査の説明対象期間が異なる点に注意。｜誤り。区分所有建物の用途・利用制限に関する管理規約は《案の段階》でも重要事項として説明が必要です。\n約が確定していなくても案の段階で説明対象となる。契約後に決まったら初めて知らせればよいという扱いでは、購入者の判断材料が不足する。\nひっかけ箇所：[[WARN:説明する必要はない]]。正しい内容：==の定めが案の段階であるときは、案の段階であっても説明する必要がある。==。","choice_3_truth":"false","choice_3_is_exam_answer":"false","choice_3_wrong_part":"及び保管方法","choice_3_reason":"誤り。借賃以外の金銭は額・目的が重説事項ですが、《保管方法》まで一律の法定説明事項ではありません。\n【本肢の根拠・注意点】建物貸借で借賃以外に授受される金銭については額や目的が説明事項となるが、その保管方法まで一般的に説明を要求するわけではない。説明すべき項目の範囲を拡張した語句が誤り。\n【補足】金銭の管理方法という別の説明事項を無条件に追加しない。","choice_3_corrected_statement":"建物の貸借の媒介を行う場合、借賃以外に授受される金銭の額、授受の目的を説明する必要があるが、保管方法まで説明することは一律には要求されないを説明しなければならない。","choice_3_legal_basis":"宅地建物取引業法35条・同施行規則16条の2の2、国土交通省2024年4月改正資料（当該肢と条文の個別照合は要確認）","choice_3_exam_tip":"建物種別で建物状況調査の説明対象期間が異なる点に注意。｜誤り。借賃以外の金銭は額・目的が重説事項ですが、《保管方法》まで一律の法定説明事項ではありません。\nついては額や目的が説明事項となるが、その保管方法まで一般的に説明を要求するわけではない。説明すべき項目の範囲を拡張した語句が誤り。\nひっかけ箇所：[[WARN:及び保管方法]]。正しい内容：==方法まで説明することは一律には要求されないを説明しなければならない。==。","choice_4_truth":"true","choice_4_is_exam_answer":"true","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。鉄筋コンクリート造の既存共同住宅では、所定の建物状況調査の実施時期に関する扱いがあり、1年6か月前は説明対象に入ります。\n【本肢の根拠・注意点】鉄筋コンクリート造共同住宅では2024年4月の改正により、調査実施から2年を経過していない建物状況調査結果が35条の説明対象。1年6か月前の調査は2年以内なので、実施の有無と結果概要を説明する。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"宅地建物取引業法35条・同施行規則16条の2の2、国土交通省2024年4月改正資料（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"建物種別で建物状況調査の説明対象期間が異なる点に注意。｜正しい。鉄筋コンクリート造の既存共同住宅では、所定の建物状況調査の実施時期に関する扱いがあり、1年6か月前は説明対象に入ります。\n施から2年を経過していない建物状況調査結果が35条の説明対象。1年6か月前の調査は2年以内なので、実施の有無と結果概要を説明する。"},{"question_id":"2025-Q38","year":2025,"session":"通常","question_no":38,"major_field":"宅建業法","section":"宅建業法","unit":"広告規制","topic":"取引態様の明示・誇大広告・広告費","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"count_false","question_text":"宅地建物取引業者Ａが行う業務に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはいくつあるか。ア　Ａは、宅地又は建物の売買に関する広告をする際に取引態様の別を明示した場合、当該広告を見た者から売買に関する注文を受けたときは、改めて取引態様の別を明示する必要はない。イ　Ａは、宅地の売買に関する広告をするに当たり、当該宅地の形質について、実際のものよりも著しく優良であると人を誤認させる表示をした場合、当該宅地に関する注文がなく、売買が成立しなかったときであっても、監督処分及び罰則の対象となる。ウ　Ａは、複数の区画がある宅地の売買について、数回に分けて広告をする予定でいる場合、最初に行う広告に取引態様の別を明示すれば足り、それ以降は明示する必要はない。エ　Ａは、建物の貸借の媒介において、依頼者の依頼によらない広告をした場合、国土交通大臣の定める報酬限度額となる媒介報酬のほか、当該広告の料金に相当する額を受領できる。","choice_1":"一つ","choice_2":"二つ","choice_3":"三つ","choice_4":"四つ","official_accepted_answers":"3","answer_conclusion":"ア・ウ・エの《3つが誤り》で、イのみ正しいため、肢3が正解です。","answer_reason":"【結論】ア・ウ・エの《3つが誤り》で、イのみ正しいため、肢3が正解です。\n【解き方】広告・勧誘の規律では、取引態様の明示、誇大広告の禁止、報酬の上限などを別々に確認する。宅建業者は広告時に加え注文を受けた際にも取引態様を明示する必要がある。誇大広告は実際に契約が成立していなくても禁止され、価格・面積・環境などについて誤認を招く表示が問題になる。売主等の依頼なく追加で行った特別広告費について当然に別請求できるわけではない。複合設問ではア〜エの","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】広告・勧誘の規律では、取引態様の明示、誇大広告の禁止、報酬の上限などを別々に確認する。宅建業者は広告時に加え注文を受けた際にも取引態様を明示する必要がある。誇大広告は実際に契約が成立していなくても禁止され、価格・面積・環境などについて誤認を招く表示が問題になる。売主等の依頼なく追加で行った特別広告費について当然に別請求できるわけではない。複合設問ではア〜エの各事実と具体的な禁止規定を対応させて判定する。\n【本問への当てはめ】《取引態様》は広告で明示し、注文を受けた場合にも改めて明示します。《誇大広告》は実際に売れなくても表示行為自体が規制対象です。《特別依頼の広告料金》は、依頼者の依頼に基づく場合に通常の報酬とは別に請求できる余地がありますが、自主的に行った広告費を一律に上乗せできません。\n【判断順序・類題への対応】広告と受注時の取引態様明示／誇大広告の成立に成約不要／通常報酬と特別広告費は別。\n【構成記述の検討】ア：誤り。取引態様の別は広告時だけでなく注文を受けたときにも明示する。広告に書いたから再度明示不要とはいえない。 イ：正しい。誇大広告の禁止は表示行為を規制するため、申込みや売買成立がなくても監督処分・罰則の対象となる。 ウ：誤り。複数回広告する場合でも、各広告で取引態様の別を明示する必要があり最初の広告だけでは足りない。 エ：誤り。依頼者から特別の広告依頼がないのに業者が自主的に行った広告費用を、通常の媒介報酬に当然に上乗せして受け取ることはできない。","system_purpose":"制度の趣旨：広告・勧誘の規律では、取引態様の明示、誇大広告の禁止、報酬の上限などを別々に確認する。宅建業者は広告時に加え注文を受けた際にも取引態様を明示する必要がある。誇大広告は実際に契約が成立していなくても禁止され、価格・面積・環境などについて誤認を招く表示が問題になる。売主等の依頼なく追加で行った特別広告費について当然に別請求できるわけではない。複合設問ではア〜エの各事実と具体的な禁止","practical_examples":"【具体例】広告上は仲介と明示した事業者が、問い合わせ対応で代理に変わったなら受注時の取引態様も明示する必要がある。","advanced_knowledge":"【周辺・発展】《取引態様》は広告で明示し、注文を受けた場合にも改めて明示します。《誇大広告》は実際に売れなくても表示行為自体が規制対象です。《特別依頼の広告料金》は、依頼者の依頼に基づく場合に通常の報酬とは別に請求できる余地がありますが、自主的に行った広告費を一律に上乗せできません。\n[[NOTE:広告と受注時の取引態様明示／誇大広告の成立に成約不要／通常報酬と特別広告費は別。]]","comparative_explanation":"広告と受注時の取引態様明示／誇大広告の成立に成約不要／通常報酬と特別広告費は別。","important_points":"==広告・注文時の両方で取引態様／誇大広告は成約不要／依頼のない広告費を追加請求しない。==","trick_patterns":"「一度広告に書いたらそれ以後省略可能」「売買不成立なら誇大広告規制なし」に注意。｜本問特有の誤誘導：ア・ウ・エの《3つが誤り》で、イのみ正しいため、肢3が正解です。\n【誤答注意】設問中の [[WARN:一つ]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"広告・注文時の両方で取引態様／誇大広告は成約不要／依頼のない広告費を追加請求しない。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 3。\nQ2: 本問の主要な判断要件は何か？ A2: 広告と受注時の取引態様明示／誇大広告の成立に成約不要／通常報酬と特別広告費は別。。\nQ3: ア〜エの各判定は？ A3: ア：誤り。取引態様の別は広告時だけでなく注文を受けたときにも明示する。広告に書いたから再度明示不要とはいえない。／イ：正しい。誇大広告の禁止は表示行為を規制するため、申込みや売買成立がなくても監督処分・罰則の対象となる。／ウ：誤り。複数回広告する場合でも、各広告で取引態様の別を明示する必要があり最初の広告だけでは足りない。／エ：誤り。依頼者から特別の広告依頼がないのに業者が自主的に行った広告費用を、通常の媒介報酬に当然に上乗せして受け取ることはできない。","substatement_reasoning":"ア：誤り。取引態様の別は広告時だけでなく注文を受けたときにも明示する。広告に書いたから再度明示不要とはいえない。\nイ：正しい。誇大広告の禁止は表示行為を規制するため、申込みや売買成立がなくても監督処分・罰則の対象となる。\nウ：誤り。複数回広告する場合でも、各広告で取引態様の別を明示する必要があり最初の広告だけでは足りない。\nエ：誤り。依頼者から特別の広告依頼がないのに業者が自主的に行った広告費用を、通常の媒介報酬に当然に上乗せして受け取ることはできない。\n【数え方】誤っているものは3つ。","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"宅地建物取引業法32条・34条・46条、報酬告示 | 宅地建物取引業法32条・34条 / 宅建業者が受け取る報酬に関する国土交通省告示 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"広告・注文時の両方で取引態様／誇大広告は成約不要／依頼のない広告費を追加請求しない。","marker_red_spans":"一つ","marker_blue_spans":"広告と受注時の取引態様明示／誇大広告の成立に成約不要／通常報酬と特別広告費は別。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜選択肢真偽はcompoundに補正。ア〜エの論拠をさらに独立照合する必要｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.r 媒介・指定流通機構・契約更新","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"宅地建物取引業者Ａが、ＢからＢ所有の中古住宅の売却について媒介の依頼を受けた場合における次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","choice_1":"ＡがＢとの間で専属専任媒介契約を締結し、Ｂから「売り出し中であることを秘密にしておきたいので指定流通機構への登録はしないでほしい」旨の申出があった場合、Ａは、そのことを理由に登録をしなかったとしても法に違反しない。","choice_2":"Ａは、Ｂとの間で有効期間を1 か月とする専属専任媒介契約を締結する際、「Ｂが媒介契約を更新する旨を申し出ない場合は、有効期間満了により自動更新するものとする」旨の特約は有効である。","choice_3":"ＡがＢと一般媒介契約を締結したときは、法第34 条の2 第1 項の規定に基づき交付すべき書面に、宅地建物取引士をして記名させなければならない。","choice_4":"ＡがＢとの間で専属専任媒介契約を締結した場合、Ａは、当該中古住宅の取引の申込みの受付に関する状況を指定流通機構に登録しなければならない。","official_accepted_answers":"4","answer_conclusion":"専属専任媒介では《取引申込みの受付状況》を指定流通機構へ登録する義務があり、肢4が正しい。","answer_reason":"【結論】専属専任媒介では《取引申込みの受付状況》を指定流通機構へ登録する義務があり、肢4が正しい。\n【解き方】専属専任媒介契約と専任媒介契約では、レインズ登録期限、依頼者への報告頻度、依頼者自ら見つけた相手との契約可否が異なる。専属専任は締結翌日から業者の休業日を除き5日以内、依頼者へ1週間に1回以上報告。専任は7日以内、2週間に1回以上報告。契約の有効期間は原則3か月を超えられず、依頼者の申し出により更新できるが自動更新はできない。近年は指定流通機構への取引申込み","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】専属専任媒介契約と専任媒介契約では、レインズ登録期限、依頼者への報告頻度、依頼者自ら見つけた相手との契約可否が異なる。専属専任は締結翌日から業者の休業日を除き5日以内、依頼者へ1週間に1回以上報告。専任は7日以内、2週間に1回以上報告。契約の有効期間は原則3か月を超えられず、依頼者の申し出により更新できるが自動更新はできない。近年は指定流通機構への取引申込み受付状況の登録も重要論点となる。\n【本問への当てはめ】売却媒介契約の3類型《一般・専任・専属専任》では、登録義務、業務報告、自己発見取引の可否が異なります。専属専任は登録5日、報告1週間に1回以上、専任は登録7日、報告2週間に1回以上が原則。\n【判断順序・類題への対応】専属専任＝5日・週1／専任＝7日・2週1／どちらも自動更新不可。\n【具体的な当てはめ】売却を一社に専属専任で任せた場合、登録期限と依頼者への進捗報告が専任より短いことを確認する。 \n【類題での整理】専属専任＝5日・週1／専任＝7日・2週1／どちらも自動更新不可。\n【参考になる法令・基準】宅地建物取引業法34条の2","system_purpose":"制度の趣旨：専属専任媒介契約と専任媒介契約では、レインズ登録期限、依頼者への報告頻度、依頼者自ら見つけた相手との契約可否が異なる。専属専任は締結翌日から業者の休業日を除き5日以内、依頼者へ1週間に1回以上報告。専任は7日以内、2週間に1回以上報告。契約の有効期間は原則3か月を超えられず、依頼者の申し出により更新できるが自動更新はできない。近年は指定流通機構への取引申込み受付状況の登録も重要","practical_examples":"【具体例】売却を一社に専属専任で任せた場合、登録期限と依頼者への進捗報告が専任より短いことを確認する。","advanced_knowledge":"【周辺・発展】売却媒介契約の3類型《一般・専任・専属専任》では、登録義務、業務報告、自己発見取引の可否が異なります。専属専任は登録5日、報告1週間に1回以上、専任は登録7日、報告2週間に1回以上が原則。\n[[NOTE:専属専任＝5日・週1／専任＝7日・2週1／どちらも自動更新不可。]]","comparative_explanation":"専属専任＝5日・週1／専任＝7 se","choice_2_wrong_part":"旨の特約は有効である","choice_2_reason":"誤り。専属専任媒介の更新は依頼者からの申し出が必要で、《自動更新特約》は認められません。\n【本肢の根拠・注意点】専属専任媒介の期間は上限3か月とされ、更新は依頼者の申出に基づく必要がある。期間を1か月と短くすること自体は可能でも、満了時の自動更新特約は法の趣旨に反し認められない。\n【補足】「依頼者からの申出」が更新要件である。","choice_2_corrected_statement":"Ａは、Ｂとの間で有効期間を1 か月とする専属専任媒介契約を締結する際、「Ｂが媒介契約を更新する旨を申し出ない場合は、有効期間満了により自動更新するものとする」旨の自動更新特約は無効である。","choice_2_legal_basis":"宅地建物取引業法34条の2（当該肢と条文の個別照合は要確認）","choice_2_exam_tip":"登録期限の5日・7日と報告頻度1週・2週を逆にしない。｜誤り。専属専任媒介の更新は依頼者からの申し出が必要で、《自動更新特約》は認められません。\n更新は依頼者の申出に基づく必要がある。期間を1か月と短くすること自体は可能でも、満了時の自動更新特約は法の趣旨に反し認められない。\nひっかけ箇所：[[WARN:旨の特約は有効である]]。正しい内容：==期間満了により自動更新するものとする」旨の自動更新特約は無効である。==。","choice_3_truth":"false","choice_3_is_exam_answer":"false","choice_3_wrong_part":"宅地建物取引士をして記名させなければならない","choice_3_reason":"誤り。媒介契約書面に必ず宅地建物取引士の記名が必要という規定ではありません。35条・37条書面と混同しないこと。\n【本肢の根拠・注意点】一般媒介契約の媒介契約書面については、宅建業法34条の2の専任媒介契約書面の法定記名等の規律を同様に適用しない。一般媒介も書面が常に不要という趣旨ではなく、法定義務を混同しない。","choice_3_corrected_statement":"ＡがＢと一般媒介契約を締結したときは、法第34 条の2 第1 項の規定に基づき交付すべき書面に、宅地建物取引士の記名は法定の必須事項ではない。","choice_3_legal_basis":"宅地建物取引業法34条の2（当該肢と条文の個別照合は要確認）","choice_3_exam_tip":"登録期限の5日・7日と報告頻度1週・2週を逆にしない。｜誤り。媒介契約書面に必ず宅地建物取引士の記名が必要という規定ではありません。35条・37条書面と混同しないこと。\n4条の2の専任媒介契約書面の法定記名等の規律を同様に適用しない。一般媒介も書面が常に不要という趣旨ではなく、法定義務を混同しない。\nひっかけ箇所：[[WARN:宅地建物取引士をして記名させなければなら]]。正しい内容：==づき交付すべき書面に、宅地建物取引士の記名は法定の必須事項ではない。==。","choice_4_truth":"true","choice_4_is_exam_answer":"true","choice_4_wrong_part":"該当なし","choice_4_reason":"正しい。専属専任媒介では、取引の申込みの受付に関する状況も指定流通機構に登録する義務があります。\n【本肢の根拠・注意点】専属専任媒介は指定流通機構への登録義務に加え、取引申込みの受付状況について登録する仕組みが設けられている。中古住宅の売主が客観的に販売状況を把握できるようにする制度である。\n【補足】販売経過の透明性のための制度。","choice_4_corrected_statement":"原文どおりで正しい","choice_4_legal_basis":"宅地建物取引業法34条の2（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"登録期限の5日・7日と報告頻度1週・2週を逆にしない。｜正しい。専属専任媒介では、取引の申込みの受付に関する状況も指定流通機構に登録する義務があります。\nえ、取引申込みの受付状況について登録する仕組みが設けられている。中古住宅の売主が客観的に販売状況を把握できるようにする制度である。"},{"question_id":"2025-Q40","year":2025,"session":"通常","question_no":40,"major_field":"宅建業法","section":"宅建業法","unit":"クーリング・オフ","topic":"申込み場所・行使期間・解除通知","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"count_true","question_text":"宅地建物取引業者Ａが、自ら売主として、宅地建物取引業者Ｂの媒介により、宅地建物取引業者ではない買主Ｃとの間で宅地の売買契約を締結した場合、宅地建物取引業法第37 条の2 の規定に基づくいわゆるクーリング・オフに関する次の記述のうち、正しいものはいくつあるか。ア　Ｃは、Ｂの事務所で買受けの申込みを行い、その3 日後に、Ｃの自宅近くの喫茶店で売買契約を締結した場合、クーリング・オフによる契約の解除はできない。イ　ＡとＣの間で、クーリング・オフによる契約の解除に関し、Ｃは契約の解除の書面をクーリング・オフの告知の日から起算して8 日以内にＡに到達させなければ契約を解除することができない旨の特約を定めた場合、当該特約は無効である。ウ　Ｃは、Ｂからの提案によりＣの自宅で買受けの申込みを行ったが、クーリング・オフについては告げられず、その10 日後に、Ａの事務所で売買契約を締結した場合、クーリング・オフによる契約の解除はできない。エ　クーリング・オフについてＣに告げる書面には、Ａの商号又は名称及び住所並びに免許証番号を記載しなければならないが、Ｂの商号又は名称及び住所並びに免許証番号の記載は必要ない。","choice_1":"一つ","choice_2":"二つ","choice_3":"三つ","choice_4":"なし","official_accepted_answers":"3","answer_conclusion":"クーリング・オフについて《ア・イ・エの3つが正しい》ため、肢3が正解です。","answer_reason":"【結論】クーリング・オフについて《ア・イ・エの3つが正しい》ため、肢3が正解です。\n【解き方】クーリング・オフは宅建業者が自ら売主となり非業者に売る取引で、買主が冷静な判断をしにくい場所で申込・契約した場合に認められる制度。営業所等での申込は原則適用対象外となり、申込みをした場所が重要になる。告知書面等を受けてから8日を経過するまでに書面等で意思表示でき、法律上の要件を満たした解除は発信時に効力が生じる。他方、代金全額の支払と物件引渡しがともに完了し","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】クーリング・オフは宅建業者が自ら売主となり非業者に売る取引で、買主が冷静な判断をしにくい場所で申込・契約した場合に認められる制度。営業所等での申込は原則適用対象外となり、申込みをした場所が重要になる。告知書面等を受けてから8日を経過するまでに書面等で意思表示でき、法律上の要件を満たした解除は発信時に効力が生じる。他方、代金全額の支払と物件引渡しがともに完了した場合には行使できない。場所・期間・引渡し・支払の4点をチェックする。\n【本問への当てはめ】クーリング・オフは《申込場所》を先に確認します。宅建業者の事務所などの法定場所で買受け申込みをすると、その後の契約場所が喫茶店でも原則対象外です。他方、買主の自宅での申込みは《買主の自発的な申出》かどうかで扱いが異なります。解除通知は出した時点で効力が生じるため、到達期限を課して買主に不利にする特約は無効です。\n【判断順序・類題への対応】申込場所と契約場所／8日間／発信主義／代金全額支払＋引渡し済みの例外。\n【構成記述の検討】ア：正しい。買受け申込みを媒介業者Bの事務所で行った時点で法定の場所に該当し、その後喫茶店で契約しても通常はクーリング・オフ対象外となる。 イ：正しい。クーリング・オフの行使は法定の要件下で発信時に効力を生じ、8日以内の到達を要求する買主不利の特約は無効である。 ウ：誤り。業者側提案で買主の自宅において申込み、告知も受けていないなら、10日後に業者事務所で契約しただけで解除権は失われない。 エ：正しい。クーリング・オフ告知書面には売主業者の商号・住所・免許証番号等を記載するが、媒介業者Bの同情報の記載は一律の要件ではない。","system_purpose":"制度の趣旨：クーリング・オフは宅建業者が自ら売主となり非業者に売る取引で、買主が冷静な判断をしにくい場所で申込・契約した場合に認められる制度。営業所等での申込は原則適用対象外となり、申込みをした場所が重要になる。告知書面等を受けてから8日を経過するまでに書面等で意思表示でき、法律上の要件を満たした解除は発信時に効力が生じる。他方、代金全額の支払と物件引渡しがともに完了した場合には行使できな","practical_examples":"【具体例】喫茶店で申込み後、営業所で契約した場合、最初の申込場所を無視して営業所契約だから解除不可とは即断できない。","advanced_knowledge":"【周辺・発展】クーリング・オフは《申込場所》を先に確認します。宅建業者の事務所などの法定場所で買受け申込みをすると、その後の契約場所が喫茶店でも原則対象外です。他方、買主の自宅での申込みは《買主の自発的な申出》かどうかで扱いが異なります。解除通知は出した時点で効力が生じるため、到達期限を課して買主に不利にする特約は無効です。\n[[NOTE:申込場所と契約場所／8日間／発信主義／代金全額支払＋引渡し済みの例外。]]","comparative_explanation":"申込場所と契約場所／8日間／発信主義／代金全額支払＋引渡し済みの例外。","important_points":"==申込場所を最優先／告知から8日間／発送で解除の効力。==","trick_patterns":"「契約場所だけ」を見て判定しない。媒介会社の営業所と、自宅訪問の経緯も確認。｜本問特有の誤誘導：クーリング・オフについて《ア・イ・エの3つが正しい》ため、肢3が正解です。\n【誤答注意】設問中の [[WARN:一つ]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"申込場所を最優先／告知から8日間／発送で解除の効力。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 3。\nQ2: 本問の主要な判断要件は何か？ A2: 申込場所と契約場所／8日間／発信主義／代金全額支払＋引渡し済みの例外。。\nQ3: ア〜エの各判定は？ A3: ア：正しい。買受け申込みを媒介業者Bの事務所で行った時点で法定の場所に該当し、その後喫茶店で契約しても通常はクーリング・オフ対象外となる。／イ：正しい。クーリング・オフの行使は法定の要件下で発信時に効力を生じ、8日以内の到達を要求する買主不利の特約は無効である。／ウ：誤り。業者側提案で買主の自宅において申込み、告知も受けていないなら、10日後に業者事務所で契約しただけで解除権は失われない。／エ：正しい。クーリング・オフ告知書面には売主業者の商号・住所・免許証番号等を記載するが、媒介業者Bの同情報の記載は一律の要件ではない。","substatement_reasoning":"ア：正しい。買受け申込みを媒介業者Bの事務所で行った時点で法定の場所に該当し、その後喫茶店で契約しても通常はクーリング・オフ対象外となる。\nイ：正しい。クーリング・オフの行使は法定の要件下で発信時に効力を生じ、8日以内の到達を要求する買主不利の特約は無効である。\nウ：誤り。業者側提案で買主の自宅において申込み、告知も受けていないなら、10日後に業者事務所で契約しただけで解除権は失われない。\nエ：正しい。クーリング・オフ告知書面には売主業者の商号・住所・免許証番号等を記載するが、媒介業者Bの同情報の記載は一律の要件ではない。\n【数え方】正しいものは3つ。","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"宅地建物取引業法37条の2、同施行規則16条の5 | 宅地建物取引業法37条の2 / 宅地建物取引業法施行規則16条の5 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"申込場所を最優先／告知から8日間／発送で解除の効力。","marker_red_spans":"一つ","marker_blue_spans":"申込場所と契約場所／8日間／発信主義／代金全額支払＋引渡し済みの例外。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜選択肢真偽はcompoundに補正。ア〜エの論拠をさらに独立照合する必要｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verifi ","choice_4_legal_basis":"宅地建物取引業法37条の2、同施行規則16条の5（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"個数・組合せ問題ではア〜エの真偽を先に確定し、数だけ最後に合わせる。「契約場所だけ」を見て判定しない。媒介会社の営業所と、自宅訪問の経緯も確認。｜誤り。「なし」ではありません。設問のア・イ・エは正しい記述です。"},{"question_id":"2025-Q41","year":2025,"session":"通常","question_no":41,"major_field":"宅建業法","section":"宅建業法","unit":"免許・届出","topic":"事業開始・解散・事務所・免許換え","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"single_correct","question_text":"宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choice_1":"宅地建物取引業者Ａ（甲県知事免許）が免許を受けてから1 年以内に事業を開始しないときは、甲県知事は免許を取り消さなければならない。","choice_2":"宅地建物取引業者Ｂ（甲県知事免許）が株主総会の決議により解散した場合、Ｂを代表する役員であった者は、その旨を当該解散の日から60 日以内に甲県知事に届け出なければならない。","choice_3":"宅地建物取引業者ではないＣが甲県に本店を、乙県に支店をそれぞれ有する場合で、乙県の支店のみで新たに宅地建物取引業を営もうとするときは、Ｃは乙県知事の免許を受けなければならない。","choice_4":"宅地建物取引業者Ｄ（甲県知事免許）は、甲県の事務所を廃止し、乙県内で新たに事務所を設置して宅地建物取引業を営もうとする場合、甲県知事へ廃業の届出を行うとともに、乙県知事への免許換えの申請を行わなければならない。","official_accepted_answers":"1","answer_conclusion":"免許後《1年以内に事業を開始しない》場合は免許取消しの対象です。肢1が正しい。","answer_reason":"【結論】免許後《1年以内に事業を開始しない》場合は免許取消しの対象です。肢1が正しい。\n【解き方】宅建業の免許は事務所の所在地を基礎に、1都道府県だけなら知事、複数都道府県なら国土交通大臣が免許権者となる。直接宅建業務をしていない本店も法令上事務所として扱われる場合があるため、支店だけを見て知事免許と判断しない。免許取得後1年以内に業務を開始しない、または1年以上引き続き休止した場合は取消事由となる。解散等の届出は30日以内という期限や届出義務者を確認す","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】宅建業の免許は事務所の所在地を基礎に、1都道府県だけなら知事、複数都道府県なら国土交通大臣が免許権者となる。直接宅建業務をしていない本店も法令上事務所として扱われる場合があるため、支店だけを見て知事免許と判断しない。免許取得後1年以内に業務を開始しない、または1年以上引き続き休止した場合は取消事由となる。解散等の届出は30日以内という期限や届出義務者を確認する。事務所移転で免許権者が変わる場合は免許換えの仕組みを使うので、廃業届とは区別する。\n【本問への当てはめ】免許は《事務所が何県にあるか》《誰に申請するか》《免許後どう変わったか》を一連の流れで覚えます。都道府県をまたぐ事務所は大臣免許、一都道府県内なら知事免許が基本。免許換えは業務継続のための制度であり、単純な廃業手続とは異なります。\n【判断順序・類題への対応】知事と大臣免許／1年間の不開始・休止／30日届出／免許換えと廃業届を区別。\n【具体的な当てはめ】甲県に本店、乙県に支店があり乙県支店でのみ媒介業務を行う法人でも、両県に事務所がある扱いを確認する。 ","system_purpose":"制度の趣旨：宅建業の免許は事務所の所在地を基礎に、1都道府県だけなら知事、複数都道府県なら国土交通大臣が免許権者となる。直接宅建業務をしていない本店も法令上事務所として扱われる場合があるため、支店だけを見て知事免許と判断しない。免許取得後1年以内に業務を開始しない、または1年以上引き続き休止した場合は取消事由となる。解散等の届出は30日以内という期限や届出義務者を確認する。事務所移転で免許","practical_examples":"【具体例】甲県に本店、乙県に支店があり乙県支店でのみ媒介業務を行う法人でも、両県に事務所がある扱いを確認する。","advanced_knowledge":"【周辺・発展】免許は《事務所が何県にあるか》《誰に申請するか》《免許後どう変わったか》を一連の流れで覚えます。都道府県をまたぐ事務所は大臣免許、一都道府県内なら知事免許が基本。免許換えは業務継続のための制度であり、単純な廃業手続とは異なります。\n[[NOTE:知事と大臣免許／1年間の不開始・休止／30日届出／免許換えと廃業届を区別。]]","comparative_explanation":"知事と大臣免許／1年間の不開始・休止／30日届出／免許換えと廃業届を区別。","important_points":"==開始せず1年＝必要的取消し／解散届30日／事務所が複数都道府県＝大臣免許／免許換えと廃業届を区別。==","trick_patterns":"「本店で直接営業していなければ除外」と早合点しない。本店の取扱いに注意。｜本問特有の誤誘導：免許後《1年以内に事業を開始しない》場合は免許取消しの対象です。肢1が正しい。\n【誤答注意】設問中の [[WARN:乙県知事の免許]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"開始せず1年＝必要的取消し／解散届30日／事務所が複数都道府県＝大臣免許／免許換えと廃業届を区別。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 1。\nQ2: 本問の主要な判断要件は何か？ A2: 知事と大臣免許／1年間の不開始・休止／30日届出／免許換えと廃業届を区別。。","substatement_reasoning":"","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"宅地建物取引業法3条・7条・11条・66条 | 宅地建物取引業法3条・7条・11条・66条 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"開始せず1年＝必要的取消し／解散届30日／事務所が複数都道府県＝大臣免許／免許換えと廃業届を区別。","marker_red_spans":"乙県知事の免許","marker_blue_spans":"知事と大臣免許／1年間の不開始・休止／30日届出／免許換えと廃業届を区別。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"true","choice_1_is_exam_answer":"true","choice_1_wrong_part":"該当なし","choice_1_reason":"正しい。免許を受けてから1年以内に事業を開始せず、または引き続き1年以上休止した場合は、免許権者による必要的取消し事由になります。\n【本肢の根拠・注意点】免許取得後1年以内に業務を開始しない場合は、免許権者が免許を取り消さなければならない法定事由。営業保証金供託後の事業開始手続とは別に、実際の業務開始期限がある点を押さえる。","choice_1_corrected_statement":"原文どおりで正しい","choice_1_legal_basis":"宅地建物取引業法3条・7条・11条・66条（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"「本店で直接営業していなければ除外」と早合点しない。本店の取扱いに注意。｜正しい。免許を受けてから1年以内に事業を開始せず、または引き続き1年以上休止した場合は、免許権者による必要的取消し事由になります。\n、免許権者が免許を取り消さなければならない法定事由。営業保証金供託後の事業開始手続とは別に、実際の業務開始期限がある点を押さえる。","choice_2_truth":"false","choice_2_is_exam_answer":"false","choice_2_wrong_part":"60 日以内","choice_2_reason":"誤り。解散の届出期限は原則《30日以内》。60日ではありません。届出者の立場も分けて覚えます。\n【本肢の根拠・注意点】会社が株主総会決議で解散した場合、届出義務者である代表役員であった者は解散日から30日以内に届出をする。60日ではなく30日という期限の入替えを見抜く。\n【補足】届出義務者は解散会社の代表役員であった者という点にも注意する。","choice_2_corrected_statement":"宅地建物取引業者Ｂ（甲県知事免許）が株主総会の決議により解散した場合、Ｂを代表する役員であった者は、その旨を当該解散の日から30日以内に甲県知事に届け出なければならない。","choice_2_legal_basis":"宅地建物取引業法3条・7条・11条・66条（当該肢と条文の個別照合は要確認）","choice_2_exam_tip":"「本店で直接営業していなければ除外」と早合点しない。本店の取扱いに注意。｜誤り。解散の届出期限は原則《30日以内》。60日ではありません。届出者の立場も分けて覚えます。\n散した場合、届出義務者である代表役員であった者は解散日から30日以内に届出をする。60日ではなく30日という期限の入替えを見抜く。\nひっかけ箇所：[[WARN:60 日以内]]。正しい内容：==の旨を当該解散の日から30日以内に甲県知事に届け出なければならない。==。","choice_3_truth":"false","choice_3_is_exam_answer":"false","choice_3_wrong_part":"乙県知事の免許","choice_3_reason":"誤り。本店が他県にあり支店だけで宅建業を営む場合でも、本店が業務上の事務所とみなされるため、複数都道府県にまたがる事務所があるなら国土交通大臣免許の問題になります。\n【本肢の根拠・注意点】甲県本店と乙県支店を持つ法人が乙県支店のみで業務をする場合でも、本店は法令上の事務所として数えられる。複数都道府県に事務所を置くなら国土交通大臣免許が必要となる。","choice_3_corrected_statement":"宅地建物取引業者ではないＣが甲県に本店を、乙県に支店をそれぞれ有する場合で、乙県の支店のみで新たに宅地建物取引業を営もうとするときは、Ｃは国土交通大臣の免許を受けなければならない。","choice_3_legal_basis":"宅地建物取引業法3条・7条・11条・66条（当該肢と条文の個別照合は要確認）","choice_3_exam_tip":"「本店で直接営業していなければ除外」と早合点しない。本店の取扱いに注意。｜誤り。本店が他県にあり支店だけで宅建業を営む場合でも、本店が業務上の事務所とみなされるため、複数都道府県にまたがる事務所があるなら国土交通大臣免許の問題になります。\n県支店のみで業務をする場合でも、本店は法令上の事務所として数えられる。複数都道府県に事務所を置くなら国土交通大臣免許が必要となる。\nひっかけ箇所：[[WARN:乙県知事の免許]]。正しい内容：==を営もうとするときは、Ｃは国土交通大臣の免許を受けなければならない。==。","choice_4_truth":"false","choice_4_is_exam_answer":"false","choice_4_wrong_part":"甲県知事へ廃業の届出を行うとともに、乙県知事への免許換えの申請","choice_4_reason":"誤り。甲県から乙県へ事務所を移して知事免許を受け直す場合は《免許換え》の手続きを行うので、別途甲県知事への廃業届が常に必要というわけではありません。\n【本肢の根拠・注意点】他県へすべての事務所を移転する場合には免許換えの申請による手続があり、元の免許について別個の廃業届を常に行うとは限らない。業務を続ける免許換えと廃業の届出は別制度。","choice_4_corrected_statement":"宅地建物取引業者Ｄ（甲県知事免許）は、甲県の事務所を廃止し、乙県内で新たに事務所を設置して宅地建物取引業を営もうとする場合、甲県知事免許の廃業届を別に行うことなく、乙県知事への免許換えの申請を行わなければならない。","choice_4_legal_basis":"宅地建物取引業法3条・7条・11条・66条（当該肢と条文の個別照合は要確認）","choice_4_exam_tip":"「本店で直接営業していなければ除外」と早合点しない。本店の取扱いに注意。｜誤り。甲県から乙県へ事務所を移して知事免許を受け直す場合は《免許換え》の手続きを行うので、別途甲県知事への廃業届が常に必要というわけではありません。\nには免許換えの申請による手続があり、元の免許について別個の廃業届を常に行うとは限らない。業務を続ける免許換えと廃業の届出は別制度。\nひっかけ箇所：[[WARN:甲県知事へ廃業の届出を行うとともに、乙県]]。正しい内容：==別に行うことなく、乙県知事への免許換えの申請を行わなければならない。==。"},{"question_id":"2025-Q42","year":2025,"session":"通常","question_no":42,"major_field":"宅建業法","section":"宅建業法","unit":"宅地建物取引士","topic":"登録・変更・取引士証返納・登録移転","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"count_true","question_text":"宅地建物取引士に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはいくつあるか。なお、この問において、宅地建物取引士は、事務の禁止の処分を受けていないものとする。ア　二つ以上の都道府県において宅地建物取引士資格試験に合格した者は、当該試験を行った都道府県のうち試験日が遅い都道府県知事の登録以外を受けることができない。イ　宅地建物取引士は、その登録している勤務先の名称に変更があった場合、登録を受けている都道府県知事に、変更の登録の申請とあわせて、宅地建物取引士証の書換え交付を申請しなければならない。ウ　宅地建物取引士は、宅地建物取引士証が効力を失ったときは、速やかに、宅地建物取引士証をその交付を受けた都道府県知事に返納しなければならない。エ　宅地建物取引士は、登録を受けている都道府県知事の管轄する都道府県以外の都道府県に所在する宅地建物取引業者の事務所の業務に従事しているときは、登録の移転の申請をすることができる。","choice_1":"一つ","choice_2":"二つ","choice_3":"三つ","choice_4":"四つ","official_accepted_answers":"2","answer_conclusion":"正しいのは《ウ・エの2つ》で肢2。取引士の登録と取引士証の記載事項を区別します。","answer_reason":"【結論】正しいのは《ウ・エの2つ》で肢2。取引士の登録と取引士証の記載事項を区別します。\n【解き方】宅地建物取引士には資格登録と取引士証の交付という別制度があり、どちらの情報を変更するかを混同しない。登録に関する氏名・住所等の変更届と、取引士証に記載された事項の書換え申請では手続や時期が異なる。取引士証を受領した後、失効・返納等が生じる場合には法令上の義務がある。登録の移転は勤務先の変更など要件があり、本人の希望だけで自由に移転できるわけではない。正誤個数","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】宅地建物取引士には資格登録と取引士証の交付という別制度があり、どちらの情報を変更するかを混同しない。登録に関する氏名・住所等の変更届と、取引士証に記載された事項の書換え申請では手続や時期が異なる。取引士証を受領した後、失効・返納等が生じる場合には法令上の義務がある。登録の移転は勤務先の変更など要件があり、本人の希望だけで自由に移転できるわけではない。正誤個数問題は四つの具体事例の義務の主体・期限・提出先を別々に確認する。\n【本問への当てはめ】《ア》誤り：複数都道府県で試験に合格した場合、登録先が最も遅い受験県に限定されるわけではありません。《イ》誤り：勤務先名称の変更は変更登録の対象ですが、取引士証の書換交付が一律に必要というわけではありません。《ウ》正しい：取引士証が失効したら速やかに返納。《エ》正しい：他都道府県の宅建業事務所で業務に従事する場合、条件を満たす登録移転申請が可能。\n【判断順序・類題への対応】資格登録と取引士証／変更登録と書換え／取引士証の有効期限・返納義務を区別。\n【構成記述の検討】ア：誤り。複数の都道府県で合格した者は、登録先が試験日の最も遅い都道府県のみに限定されるわけではない。 イ：誤り。勤務先の名称変更は登録事項の変更手続の対象だが、取引士証書換え申請が一律必要ということではない。 ウ：正しい。取引士証が効力を失った場合は、速やかに交付した都道府県知事に返納する義務がある。 エ：正しい。登録を受けた都道府県以外にある宅建業者の事務所で従事する場合、条件を満たせば登録移転を申請できる。","system_purpose":"制度の趣旨：宅地建物取引士には資格登録と取引士証の交付という別制度があり、どちらの情報を変更するかを混同しない。登録に関する氏名・住所等の変更届と、取引士証に記載された事項の書換え申請では手続や時期が異なる。取引士証を受領した後、失効・返納等が生じる場合には法令上の義務がある。登録の移転は勤務先の変更など要件があり、本人の希望だけで自由に移転できるわけではない。正誤個数問題は四つの具体事例","practical_examples":"【具体例】登録は甲県でも乙県で勤務を始めた場合、登録移転の要件と取引士証の書換えは別々に判断する。","advanced_knowledge":"【周辺・発展】《ア》誤り：複数都道府県で試験に合格した場合、登録先が最も遅い受験県に限定されるわけではありません。《イ》誤り：勤務先名称の変更は変更登録の対象ですが、取引士証の書換交付が一律に必要というわけではありません。《ウ》正しい：取引士証が失効したら速やかに返納。《エ》正しい：他都道府県の宅建業事務所で業務に従事する場合、条件を満たす登録移転申請が可能。\n[[NOTE:資格登録と取引士証／変更登録と書換え／取引士証の有効期限・返納義務を区別。]]","comparative_explanation":"資格登録と取引士証／変更登録と書換え／取引士証の有効期限・返納義務を区別。","important_points":"==登録の変更と取引士証の書換は異なる／証失効→返納／登録移転の条件。==","trick_patterns":"登録先・勤務地が違うだけで自動移転するわけではありません。｜本問特有の誤誘導：正しいのは《ウ・エの2つ》で肢2。取引士の登録と取引士証の記載事項を区別します。\n【誤答注意】設問中の [[WARN:一つ]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"登録の変更と取引士証の書換は異なる／証失効→返納／登録移転の条件。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 2。\nQ2: 本問の主要な判断要件は何か？ A2: 資格登録と取引士証／変更登録と書換え／取引士証の有効期限・返納義務を区別。。\nQ3: ア〜エの各判定は？ A3: ア：誤り。複数の都道府県で合格した者は、登録先が試験日の最も遅い都道府県のみに限定されるわけではない。／イ：誤り。勤務先の名称変更は登録事項の変更手続の対象だが、取引士証書換え申請が一律必要ということではない。／ウ：正しい。取引士証が効力を失った場合は、速やかに交付した都道府県知事に返納する義務がある。／エ：正しい。登録を受けた都道府県以外にある宅建業者の事務所で従事する場合、条件を満たせば登録移転を申請できる。","substatement_reasoning":"ア：誤り。複数の都道府県で合格した者は、登録先が試験日の最も遅い都道府県のみに限定されるわけではない。\nイ：誤り。勤務先の名称変更は登録事項の変更手続の対象だが、取引士証書換え申請が一律必要ということではない。\nウ：正しい。取引士証が効力を失った場合は、速やかに交付した都道府県知事に返納する義務がある。\nエ：正しい。登録を受けた都道府県以外にある宅建業者の事務所で従事する場合、条件を満たせば登録移転を申請できる。\n【数え方】正しいものは2つ。","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"宅地建物取引業法18条・19条・20条・22条の2 | 宅地建物取引業法18条・19条・20条・22条の2 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"登録の変更と取引士証の書換は異なる／証失効→返納／登録移転の条件。","marker_red_spans":"一つ","marker_blue_spans":"資格登録と取引士証／変更登録と書換え／取引士証の有効期限・返納義務を区別。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜選択肢真偽はcompoundに補正。ア〜エの論拠をさらに独立照合する必要｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true","choice_text_verified":"true","official_answer_checked":"true","legal_2026_checked":"false","source_page_url":"https://takken-success.info/2025kakomon/","official_pdf_url":"https://www.retio.or.jp/wp-content/uploads/2025/12/R7_question_answer.pdf","choice_1_truth":"compound","choice_1_is_exam_answer":"false","choice_1_wrong_part":"一つ","choice_1_reason":"誤り。ウとエの2つが正しいので一つではありません。\n【構成要素の理由】誤り。複数の都道府県で合格した者は、登録先が試験日の最も遅い都道府県のみに限定されるわけではない。／誤り。勤務先の名称変更は登録事項の変更手続の対象だが、取引士証書換え申請が一律必要ということではない。／正しい。取引士証が効力を失った場合は、速やかに交付した都道府県知事に返納する義務がある。／正しい。登録を受けた都道府県以外にある宅建業者の事務所で従事する場合、条件を満たせば登録移転を申請できる。。\n【結論】本肢「一つ」は 正しいものを2つと数えた結果に合致しない。\n【要素ごとの判定】ア：誤り。複数の都道府県で合格した者は、登録先が試験日の最も遅い都道府県のみに限定されるわけではない。 イ：誤り。勤務先の名称変更は登録事項の変更手続の対象だが、取引士証書換え申請が一律必要ということではない。 ウ：正しい。取引士証が効力を失った場合は、速やかに交付した都道府県知事に返納する義務がある。 エ：正しい。登録を受けた都道府県以外にある宅建業者の事務所で従事する場合、条件を満たせば登録移転を申請できる。 【数え方】正しいものは2つ。","choice_1_corrected_statement":"正しい判断は「ウ・エの2つが正しくア・イは誤り」。設問に対する正解の選択肢は2である。","choice_1_legal_basis":"宅地建物取引業法18条・19条・20条・22条の2（当該肢と条文の個別照合は要確認）","choice_1_exam_tip":"個数・組合せ問題ではア〜エの真偽を先に確定し、数だけ最後に合わせる。登録先・勤務地が違うだけで自動移転するわけではありません。｜誤り。ウとエの2つが正しいので一つではありません。","choice_2_truth":"compound","choice_2_is_exam_answer":"true","choice_2_wrong_part":"該当なし","choice_2_reason":"正しい。ウ（証の返納）、エ（条件付き登録移転）の2つが正しい。\n【構成要素の理由】誤り。複数の都道府県で合格した者は、登録先が試験日の最も遅い都道府県のみに限定されるわけではない。／誤り。勤務先の名称変更は登録事項の変更手続の対象だが、取引士証書換え申請が一律必要ということではない。／正しい。取引士証が効力を失った場合は、速やかに交付した都道府県知事に返納する義務がある。／正しい。登録を受けた都道府県以外にある宅建業者の事務所で従事する場合、条件を満たせば登録移転を申請できる。。\n【結論】本肢「二つ」は 正しいものを2つと数えた結果に合致する。\n【要素ごとの判定】ア：誤り。複数の都道府県で合格した者は、登録先が試験日の最も遅い都道府県のみに限定されるわけではない。 イ：誤り。勤務先の名称変更は登録事項の変更手続の対象だが、取引士証書換え申請が一律必要ということではない。 ウ：正しい。取引士証が効力を失った場合は、速やかに交付した都 エの真偽を先に確定し、数だけ最後に合わせる。登録先・勤務地が違うだけで自動移転するわけではありません。｜誤り。4つとも正しいわけではありません。"},{"question_id":"2025-Q43","year":2025,"session":"通常","question_no":43,"major_field":"宅建業法","section":"宅建業法","unit":"重要事項説明（35条）","topic":"信託受益権・未完成物件・敷金・津波区域","importance_1_5":"UNKNOWN","difficulty_1_3":"UNKNOWN","question_type":"count_true","question_text":"宅地建物取引業者が行う宅地建物取引業法第35 条に規定する重要事項の説明に関する次の記述のうち、正しいものはいくつあるか。なお、説明の相手方は宅地建物取引業者ではないものとする。ア　自らを委託者とする宅地又は建物に係る信託の受益権の売主となる場合、相手方に金融商品取引法第2 条第10 項に規定する目論見書を交付し、宅地建物取引業法第35 条第3 項の規定に基づき説明すべき事項のすべてが当該目論見書に記載されているときは、重要事項説明書の交付及び説明を省略することができる。イ　建物の貸借の媒介を行う場合、当該建物が建築工事の完了前のものであるときは、その完了時における当該建物の主要構造部、内装及び外装の構造又は仕上げ並びに設備の設置及び構造について説明しなければならない。ウ　建物の貸借の媒介を行う場合、敷金その他いかなる名義をもって授受されるかを問わず、契約終了時において精算することとされている金銭の精算に関する事項を説明しなければならない。エ　宅地の売買の媒介を行う場合、当該宅地が津波防災地域づくりに関する法律第21 条第1項により指定された津波防護施設区域内にあるときは、同法第23 条第1 項の規定による制限の概要について説明しなければならない。","choice_1":"一つ","choice_2":"二つ","choice_3":"三つ","choice_4":"四つ","official_accepted_answers":"4","answer_conclusion":"信託受益権・未完成建物・敷金精算・津波防護施設区域について《ア〜エすべて正しい》。肢4が正解。","answer_reason":"【結論】信託受益権・未完成建物・敷金精算・津波防護施設区域について《ア〜エすべて正しい》。肢4が正解。\n【解き方】35条重要事項説明の事項は土地・建物の利用制限だけではなく、権利関係、取引対象の種類、契約条件など広範囲にわたる。信託受益権に関する説明には特則があり、未完成の建物では完成時の仕様等を説明する必要がある場面がある。敷金等の清算、津波防護施設区域など防災・法令制限に関する事項も対象に含まれる。ア〜エの具体的な取引形態に即して法定説明事項を判定する。","scoring_exception_note":"","deep_lecture":"【制度の全体像・適用】35条重要事項説明の事項は土地・建物の利用制限だけではなく、権利関係、取引対象の種類、契約条件など広範囲にわたる。信託受益権に関する説明には特則があり、未完成の建物では完成時の仕様等を説明する必要がある場面がある。敷金等の清算、津波防護施設区域など防災・法令制限に関する事項も対象に含まれる。ア〜エの具体的な取引形態に即して法定説明事項を判定する。\n【本問への当てはめ】《ア》正しい：法35条3項の信託受益権に関する所定事項が目論見書に網羅されていれば特例が使えます。《イ》正しい：未完成建物の貸借媒介では完成時の主要構造部・内外装・設備等の説明が必要。《ウ》正しい：敷金等、終了時に精算する金銭の精算事項は説明対象。《エ》正しい：津波防護施設区域の法令上の制限も説明対象になります。\n【判断順序・類題への対応】所有権売買・賃貸借・信託受益権／未完成建物／敷金精算／津波関連の区域を整理。\n【構成記述の検討】ア：正しい。所定事項をすべて記載した目論見書が交付されている信託受益権取引では35条3項の説明省略の特則が働く。 イ：正しい。未完成建物の貸借媒介では完成時の主要構造部や内外装・設備の仕様等を説明する。 ウ：正しい。敷金その他の名目で契約終了時に精算する金銭の精算事項は35条の説明対象である。 エ：正しい。津波防護施設区域内の宅地については、関連法令による制限の概要が説明対象となる。","system_purpose":"制度の趣旨：35条重要事項説明の事項は土地・建物の利用制限だけではなく、権利関係、取引対象の種類、契約条件など広範囲にわたる。信託受益権に関する説明には特則があり、未完成の建物では完成時の仕様等を説明する必要がある場面がある。敷金等の清算、津波防護施設区域など防災・法令制限に関する事項も対象に含まれる。ア〜エの具体的な取引形態に即して法定説明事項を判定する。","practical_examples":"【具体例】完成前の分譲住宅と既存マンションと信託受益権では、同じ35条でも説明すべき固有事項が違う。","advanced_knowledge":"【周辺・発展】《ア》正しい：法35条3項の信託受益権に関する所定事項が目論見書に網羅されていれば特例が使えます。《イ》正しい：未完成建物の貸借媒介では完成時の主要構造部・内外装・設備等の説明が必要。《ウ》正しい：敷金等、終了時に精算する金銭の精算事項は説明対象。《エ》正しい：津波防護施設区域の法令上の制限も説明対象になります。\n[[NOTE:所有権売買・賃貸借・信託受益権／未完成建物／敷金精算／津波関連の区域を整理。]]","comparative_explanation":"所有権売買・賃貸借・信託受益権／未完成建物／敷金精算／津波関連の区域を整理。","important_points":"==信託受益権の重説特例／未完成物件の完成時仕様／敷金等の精算／津波防護施設区域。==","trick_patterns":"「賃貸借だから建物仕様・災害関係は説明不要」と一律に判断しない。｜本問特有の誤誘導：信託受益権・未完成建物・敷金精算・津波防護施設区域について《ア〜エすべて正しい》。肢4が正解。\n【誤答注意】設問中の [[WARN:一つ]] を無条件で正しいと扱わず、条文の条件と照合する。","memory_summary":"信託受益権の重説特例／未完成物件の完成時仕様／敷金等の精算／津波防護施設区域。","review_check_questions":"Q1: 本問の正解肢は何番か？ A1: 4。\nQ2: 本問の主要な判断要件は何か？ A2: 所有権売買・賃貸借・信託受益権／未完成建物／敷金精算／津波関連の区域を整理。。\nQ3: ア〜エの各判定は？ A3: ア：正しい。所定事項をすべて記載した目論見書が交付されている信託受益権取引では35条3項の説明省略の特則が働く。／イ：正しい。未完成建物の貸借媒介では完成時の主要構造部や内外装・設備の仕様等を説明する。／ウ：正しい。敷金その他の名目で契約終了時に精算する金銭の精算事項は35条の説明対象である。／エ：正しい。津波防護施設区域内の宅地については、関連法令による制限の概要が説明対象となる。","substatement_reasoning":"ア：正しい。所定事項をすべて記載した目論見書が交付されている信託受益権取引では35条3項の説明省略の特則が働く。\nイ：正しい。未完成建物の貸借媒介では完成時の主要構造部や内外装・設備の仕様等を説明する。\nウ：正しい。敷金その他の名目で契約終了時に精算する金銭の精算事項は35条の説明対象である。\nエ：正しい。津波防護施設区域内の宅地については、関連法令による制限の概要が説明対象となる。\n【数え方】正しいものは4つ。","reform_status":"review_required","reform_title":"","reform_effective_date":"","reform_before":"","reform_after":"","reform_2026_impact":"","reform_sources":"","legal_sources":"宅地建物取引業法35条、津波防災地域づくりに関する法律 | 宅地建物取引業法35条 / 津波防災地域づくりに関する法律23条 | RETIO https://www.retio.or.jp/exam/past_ques_ans/other/","marker_yellow_spans":"信託受益権の重説特例／未完成物件の完成時仕様／敷金等の精算／津波防護施設区域。","marker_red_spans":"一つ","marker_blue_spans":"所有権売買・賃貸借・信託受益権／未完成建物／敷金精算／津波関連の区域を整理。","qa_status":"REWORK","qa_issues":"4肢の適用条文・要件・例外について独立した一次資料照合が未了｜選択肢真偽はcompoundに補正。ア〜エの論拠をさらに独立照合する必要｜2026年4月1日時点の関連改正の有無・該当範囲の確認未了｜肢別根拠に「要確認」記載：4/4肢","question_text_verified":"true",
